# Dependabot: automatic PRs with dependency updates.
# Documentation: https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
#
# Enabled: GitHub Actions (actions are pinned to a commit SHA, Dependabot
# updates the SHA and the version comment) and pip for the skeleton checks in ci/
# (requirements.txt with hashes), and gomod for the Go implementation in impl/ (D-91, D-92;
# its tools staticcheck and govulncheck are tool dependencies there), npm for the Gemini CLI of
# the review workflow (ci/gemini), and docker and docker-compose for the images of
# impl/deploy/compose. A new
# version is proposed only a week after its release (cooldown), so a release taken over and
# pulled within days does not arrive here; security updates are not delayed.
# The schedule time zone is UTC.
version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "UTC"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/ci"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "UTC"
    cooldown:
      default-days: 7
    groups:
      ci-python:
        patterns: ["*"]

  - package-ecosystem: "gomod"
    directory: "/impl"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "UTC"
    cooldown:
      default-days: 7
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/ci/gemini"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "UTC"
    cooldown:
      default-days: 7
    groups:
      gemini-cli:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/impl/deploy/compose"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "UTC"
    cooldown:
      default-days: 7
    groups:
      images:
        patterns: ["*"]

  - package-ecosystem: "docker-compose"
    directory: "/impl/deploy/compose"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "UTC"
    cooldown:
      default-days: 7
    groups:
      compose-images:
        patterns: ["*"]
