# Dependabot: automatic PRs with dependency updates.
# Documentation: https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
#
# Enabled: GitHub Actions (actions are pinned to a commit SHA, Dependabot
# updates the SHA and the version comment) and pip for the skeleton checks in ci/
# (requirements.txt with hashes), and gomod for the Go implementation in impl/ (D-91, D-92;
# its tools staticcheck and govulncheck are tool dependencies there). The skeleton has no
# container images: deploy/compose.example.yaml is an example, not a launch file.
# The schedule time zone is UTC.
version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "UTC"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/ci"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "UTC"
    groups:
      ci-python:
        patterns: ["*"]

  - package-ecosystem: "gomod"
    directory: "/impl"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "UTC"
    groups:
      go:
        patterns: ["*"]
