# Dependabot: automatic PRs with dependency updates.
# Documentation: https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
#
# Enabled: GitHub Actions (actions are pinned to a commit SHA, Dependabot
# updates the SHA and the version comment) and pip for the skeleton checks in ci/
# (requirements.txt with hashes). The skeleton has no container images:
# deploy/compose.example.yaml is an example, not a launch file.
# The skeleton does not choose an implementation language. The schedule time zone is UTC.
version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "UTC"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/ci"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "UTC"
    groups:
      ci-python:
        patterns: ["*"]
