# Go implementation checks (D-91, D-92): formatting, go vet, staticcheck, tests with the race
# detector (with a PostgreSQL store), a build for linux/amd64 and linux/arm64 (a Raspberry Pi test machine) and govulncheck.
# The code lives in impl/. No secrets, read-only token. The Go toolchain is not installed by an
# action: the go command of the runner image downloads the version named in impl/go.mod
# (GOTOOLCHAIN=auto) from the Go module proxy and verifies it against the checksum database.
# staticcheck and govulncheck are tool dependencies in impl/go.mod, so their versions are pinned
# by go.sum and updated by Dependabot. Actions are pinned to a full commit SHA.
name: go

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: go-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: impl
    env:
      GOTOOLCHAIN: auto
      GOFLAGS: -mod=readonly
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: toolchain
        run: go version
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "::error::[gofmt] files are not formatted: $out"; exit 1; fi
      - name: go mod tidy
        run: |
          go mod tidy -diff
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: go tool staticcheck ./...
      - name: test
        # The store tests start a private PostgreSQL server with initdb of the runner image
        # (PostgreSQL 16 on ubuntu-24.04); without it they would be skipped, so here they must run.
        env:
          BOTARU_TEST_PG_REQUIRED: "1"
          BOTARU_CONFORM_OUT: ${{ runner.temp }}/conform
        run: CGO_ENABLED=1 go test -race -timeout 30m ./...
      - name: rule coverage
        # The conformance runner (internal/conform) wrote the coverage table of the rules during
        # the tests: done means every behaviour case of the rule passes on this core.
        if: always()
        run: |
          f="$RUNNER_TEMP/conform/coverage.md"
          if [ -f "$f" ]; then cat "$f" >> "$GITHUB_STEP_SUMMARY"; else echo "no coverage table: the conformance test did not run"; fi
      - name: build
        run: |
          GOOS=linux GOARCH=amd64 go build ./...
          GOOS=linux GOARCH=arm64 go build ./...
      - name: govulncheck
        run: go tool govulncheck ./...
