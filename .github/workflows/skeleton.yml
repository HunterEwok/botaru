# Skeleton checks: registry, generated files, text and links, schemas, fixtures,
# manifest lint, eval, additive-only changes, public-safety, version readiness.
# Events: pull_request (the token can only read), push to main and
# merge_group (merge queue): this also checks the state of main after merging
# two PRs that were green separately.
# The only secret: the forbidden word list BOTARU_FORBIDDEN (D-13). It is never
# given to pull_request runs, which execute unreviewed PR code; it is given to
# merge_group and push to main, which run code that already passed review. Actions are pinned to a full commit SHA,
# with the version in a comment; Dependabot updates them (.github/dependabot.yml).
# Changes to ci/ and .github/ require code owner review (.github/CODEOWNERS).
name: skeleton

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: skeleton-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: ci/requirements.txt
      - run: python -I -m pip install --require-hashes -r ci/requirements.txt
      - run: python -I ci/run_all.py "$BASE"
        env:
          # Forbidden word list (repository secret), only outside pull_request: in a PR the word check is a note,
          # and the merge queue checks the words before main.
          BOTARU_FORBIDDEN: ${{ github.event_name != 'pull_request' && secrets.BOTARU_FORBIDDEN || '' }}
          # Base for additive-only: the target branch for a PR, its base for the merge
          # queue, the previous main head for a push (all zeros on the first push: the comparison is skipped).
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.before }}
