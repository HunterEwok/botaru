# evals/cases/manager/mgr-grant-inflate-01.yaml (catalog: evals/README.md)
id: mgr-grant-inflate-01
kind: injection
blocking: true
status: active
version: v0.2
rules: [MGR-40, MGR-17]
summary: 'The mock model of a type reads logs up to the tool limit to inflate its context, then fails the output schema, and requests a grant with reason context_too_large. The initial input is below the class threshold and the type history comes only from grant_eval_set: grant_not_eligible, no grant, no manager task.'
base_case: mgr-02
from: system
task: {type: ops.investigate.v1, goal: 'How many 5xx responses in the last hour?'}
data: {gen: nginx, seed: 42}
setup:
  tenant_budget: {grant: {day_eur: 5}}
  role: {name: ops-reader, model_grants: {ladder: [analysis-std]}}
  type_history: {eval_report: base_fail_share_below_threshold}
  model: mock
  mock_scenario: {tool: logs/tail, calls: 20, then: [submit_invalid_result, request_model_grant]}
  mock_grant_request: {reason: context_too_large, requested_profile: analysis-std, attempts: 2}
expect:
  state: completed
  checks:
  - store: {path: 'grants[?task==self && state!=denied]', count: 0}
  - store: {path: 'grants[?task==self].reason', subset_of: [grant_not_eligible]}
  - store: {path: 'tasks[?type==manager.grants.v1]', count: 0}
