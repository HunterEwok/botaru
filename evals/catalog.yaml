  - case: ops-030
    group: Refusals (5), twins (3), services and commands (8)
    rules:
    - DEP-11
    version: v0.1
    block: without a model
    spec:
      Who asks what: 'without a model: catalog `demo` with `monitor_host: core1` (a farm node from `farm_hosts`)'
      What is checked: '`apply` rejects the catalog; the deployment lint does not let a tenant toolhost onto `core1`; `doctor`
