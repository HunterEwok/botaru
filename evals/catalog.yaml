# The eval case catalog: every case and every row without a model that the skeleton rules name.
# Edited by hand; evals/README.md, section "Case catalog", explains the fields.
# ci/check_evals.py checks it against the case files in evals/cases/.
areas:
- area: First bot hello
  cases:
  - case: hello-001
    rules:
    - DLV-12
    version: v0.1
    block: 'no'
    spec:
      Who asks what: 'dave (only this case) in a direct chat: `/hello`'
      What is checked: on first contact first `ai_notice` and `privacy_notice`, then the task answer in one sentence; no tools
        (D-86 (10))
  - case: hello-002
    rules:
    - PRM-2
    - PRM-8
    version: v0.1
    block: 'no'
    spec:
      Who asks what: bob (`staff`, without `task:hello.greet.v1`) writes `/hello`
      What is checked: 'a code refusal without a model: no task, `needs: [task:hello.greet.v1]`'
  - case: hello-003
    rules: []
    version: v0.1
    block: 'no'
    spec:
      Who asks what: alice (group `hello`) writes the same `/hello` (twin of hello-002)
      What is checked: a greeting
