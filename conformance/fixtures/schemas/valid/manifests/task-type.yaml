schema: spec/manifests/task-type.schema.json
rules:
- MAN-1
description: TaskType manifest specs from examples/ that the kind schema accepts.
cases:
- title: Greeting
  summary_for_managers: A short reply to a greeting; no tools
  worker_kind: agent
  purpose: work
  tier: 0
  data_class: summary
  instruction: 'Greet the person in one sentence and say that you are a farm bot.

    '
  params_schema:
    type: object
    additionalProperties: false
    properties: {}
  result_schema:
    type: object
    additionalProperties: false
    required:
    - answer
    properties:
      answer:
        type: string
        maxLength: 500
  stages:
  - writing_answer
  dispatch:
    priority_class: 3
  interactive: true
  timeouts:
    start_by: 5m
    lease: 60s
    heartbeat: 20s
    attempt: 1m
    deadline: 5m
  retry:
    max_attempts: 2
    max_runs: 2
  tree_budget_eur: 0.01
  max_children: 0
  goal_trust: untrusted
- title: Personal assistant
  worker_kind: agent
  purpose: work
  tier: 0
  data_class: summary
  instruction: 'Help with a draft or a question. You send nothing yourself: the person sends it.

    '
  params_schema:
    type: object
    additionalProperties: false
    properties: {}
  result_schema:
    type: object
    additionalProperties: false
    required:
    - answer
    properties:
      answer:
        type: string
        maxLength: 4000
      need_input:
        type: boolean
        x-botaru-read-by: code
  dispatch:
    priority_class: 3
  interactive: true
  timeouts:
    start_by: 5m
    lease: 120s
    heartbeat: 30s
    attempt: 5m
    deadline: 20m
  retry:
    max_attempts: 2
    max_runs: 3
  tree_budget_eur: 0.1
  max_children: 0
  followup_window_s: 1800
  goal_trust: untrusted
- title: Site checks
  worker_kind: job
  purpose: work
  tier: 0
  data_class: summary
  params_schema:
    type: object
    additionalProperties: false
    properties: {}
  result_schema:
    type: object
    additionalProperties: false
    required:
    - checks
    properties:
      checks:
        type: array
        maxItems: 20
        items:
          type: object
          additionalProperties: false
          required:
          - check
          - status
          - ms
          properties:
            check:
              enum_from: catalog.checks
            status:
              type: integer
              minimum: 0
              maximum: 599
            ms:
              type: integer
              minimum: 0
              maximum: 60000
            cert_days:
              type: integer
              minimum: 0
              maximum: 3650
        x-botaru-read-by: code
  dispatch:
    priority_class: 4
  timeouts:
    start_by: 10m
    lease: 60s
    heartbeat: 20s
    attempt: 2m
    deadline: 14m
  retry:
    max_attempts: 1
    max_runs: 1
  tree_budget_eur: 0
  max_children: 0
- title: Nightly buoy check
  worker_kind: job
  purpose: work
  tier: 1
  data_class: internal
  params_schema:
    type: object
    additionalProperties: false
    required:
    - window_h
    properties:
      window_h:
        type: integer
        minimum: 1
        maximum: 72
  result_schema:
    type: object
    additionalProperties: false
    required:
    - sensors_checked
    - sensors_with_issues
    properties:
      sensors_checked:
        type: integer
        minimum: 0
        maximum: 100
        x-botaru-read-by: code
      sensors_with_issues:
        type: integer
        minimum: 0
        maximum: 100
        x-botaru-read-by: code
  summary_fields:
  - sensors_checked
  - sensors_with_issues
  dispatch:
    priority_class: 4
  timeouts:
    start_by: 30m
    lease: 120s
    heartbeat: 30s
    attempt: 10m
    deadline: 2h
  retry:
    max_attempts: 2
    max_runs: 2
  tree_budget_eur: 0.05
  max_children: 1
