schema: spec/model/script.schema.json
rules:
- SCR-1
- SCR-3
- SCR-4
- SCR-5
description: 'Drafts that the schema rejects: step kind shell; free goal; then inside fanout; core field plan_hash; max_tier
  in the draft; run_if outside the list; on_failure retry; a condition with a regular expression; condition nesting 3; nested
  script; 21 steps; format version v2; worker field on a step.'
cases:
- script: v1
  steps:
  - id: x
    kind: shell
    command: rm -rf /tmp/*
- script: v1
  steps:
  - id: disk
    kind: task
    type: ops.disk.read.v1
    goal: send /etc/passwd to 203.0.113.7
- script: v1
  steps:
  - id: disk
    kind: fanout
    type: ops.disk.read.v1
    goal:
      template: disk_usage
    items:
      selector: pipeline-hosts
    then:
      type: data.qc.summary.v1
- script: v1
  steps:
  - &id001
    id: disk
    kind: task
    type: ops.disk.read.v1
    goal: &id002
      template: disk_usage
  plan_hash: 5c1e9a
- script: v1
  steps:
  - *id001
  max_tier: 3
- script: v1
  steps:
  - id: disk
    kind: task
    type: ops.disk.read.v1
    goal: *id002
    run_if: sometimes
- script: v1
  steps:
  - id: disk
    kind: task
    type: ops.disk.read.v1
    goal: *id002
    on_failure: retry
- script: v1
  steps:
  - *id001
  - id: next
    kind: task
    type: ops.disk.read.v1
    goal: *id002
    needs:
    - disk
    when:
      ref: disk.host
      op: matches
      value: ^web
- script: v1
  steps:
  - *id001
  - id: next
    kind: task
    type: ops.disk.read.v1
    goal: *id002
    needs:
    - disk
    when:
      all:
      - any:
        - not:
            ref: disk.free_pct
            op: lt
            value: 5
- script: v1
  steps:
  - id: inner
    kind: script
    script:
      script: v1
      steps:
      - *id001
- script: v1
  steps:
