schema: spec/model/script-propose-request.schema.json
rules:
- TRN-3
- SCR-6
description: 'Arguments that the schema rejects: immediate run; a draft without steps.'
cases:
- script:
    script: v1
    steps:
    - id: disk
      kind: task
      type: ops.disk.read.v1
      goal:
        template: disk_usage
      params:
        resource: db1
    - id: ask
      kind: confirm
      needs:
      - disk
      when:
        ref: disk.free_level
        op: in
        value:
        - low
        - critical
      who: initiator
    - id: clean
      kind: fanout
      needs:
      - ask
      action: cleanup_tmp
      items:
        resources:
        - db1
  run: true
- script:
    script: v1
    steps: []
