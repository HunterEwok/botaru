schema: urn:botaru:schema:p4-anthropic-messages-request:1
rules:
- GW-1
description: 'A runtime request to P4 outside the allowlist: service_tier, region field inference_geo, tool_choice of kind
  any, mcp_servers, temperature out of range, a tool call made by a provider server tool (D-87 (4)).'
cases:
- model: base-std
  max_tokens: 400
  service_tier: priority
  messages:
  - {role: user, content: Hello}
- model: base-std
  max_tokens: 400
  inference_geo: us
  messages:
  - {role: user, content: Hello}
- model: base-std
  max_tokens: 400
  tool_choice: {type: any}
  messages:
  - {role: user, content: Hello}
- model: base-std
  max_tokens: 400
  mcp_servers: [{type: url, url: 'https://mcp.example.org/sse', name: ext}]
  messages:
  - {role: user, content: Hello}
- model: base-std
  max_tokens: 400
  temperature: 1.5
  messages:
  - {role: user, content: Hello}
- model: base-std
  max_tokens: 400
  messages:
  - {role: user, content: Check nginx}
  - role: assistant
    content:
    - {type: tool_use, id: toolu_01, name: cmd_run, input: {command: service_status}, caller: {type: code_execution_20250825, tool_id: srvtoolu_01}}
  - role: user
    content:
    - {type: tool_result, tool_use_id: toolu_01, content: active}
