schema: spec/manifests/channel.schema.json
rules:
- ING-1
- ING-3
- ING-4
description: 'Source channels that the kind schema rejects: no authenticity check (ING-1), an authenticity check outside the
  closed list (ING-1), no limits or no body size limit (ING-3), an event outside the ext.* namespace (ING-4).'
cases:
- driver: webhook
  direction: in
  identity_kind: hook
  identity_assurance: strong
  membership_assurance: none
  ai_disclosure: native
  provenance: metadata
  ingress:
    event: ext.pipeline.run_failed.v1
    limits: {per_minute: 60, max_body_bytes: 262144}
    mapping:
      run_id: {from: /run/id, schema: {type: string, x-botaru-format: id}}
- driver: webhook
  direction: in
  identity_kind: hook
  identity_assurance: weak
  membership_assurance: none
  ai_disclosure: native
  provenance: metadata
  ingress:
    event: ext.pipeline.run_failed.v1
    auth: none
    limits: {per_minute: 60, max_body_bytes: 262144}
    mapping:
      run_id: {from: /run/id, schema: {type: string, x-botaru-format: id}}
- driver: webhook
  direction: in
  identity_kind: hook
  identity_assurance: strong
  membership_assurance: none
  ai_disclosure: native
  provenance: metadata
  ingress:
    event: ext.pipeline.run_failed.v1
    auth: tls_token
    mapping:
      run_id: {from: /run/id, schema: {type: string, x-botaru-format: id}}
- driver: webhook
  direction: in
  identity_kind: hook
  identity_assurance: strong
  membership_assurance: none
  ai_disclosure: native
  provenance: metadata
  ingress:
    event: ext.pipeline.run_failed.v1
    auth: tls_token
    limits: {per_minute: 60}
    mapping:
      run_id: {from: /run/id, schema: {type: string, x-botaru-format: id}}
- driver: webhook
  direction: in
  identity_kind: hook
  identity_assurance: strong
  membership_assurance: none
  ai_disclosure: native
  provenance: metadata
  ingress:
    event: alarm.pipeline.failed.v1
    auth: tls_token
    limits: {per_minute: 60, max_body_bytes: 262144}
    mapping:
      run_id: {from: /run/id, schema: {type: string, x-botaru-format: id}}
- driver: webhook
  direction: in
  identity_kind: hook
  identity_assurance: strong
  membership_assurance: none
  ai_disclosure: native
  provenance: metadata
  ingress:
    event: task.created.v1
    auth: tls_token
    limits: {per_minute: 60, max_body_bytes: 262144}
    mapping:
      run_id: {from: /run/id, schema: {type: string, x-botaru-format: id}}
