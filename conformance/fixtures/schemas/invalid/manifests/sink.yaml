schema: spec/manifests/sink.schema.json
rules:
- MAN-1
description: 'Sink manifest specs that the kind schema rejects: extra field, missing required field, value outside the closed
  list or format.'
cases:
- driver: disk
  base: /srv/botaru/archive
  ceiling: internal
  retention: 365d
  unexpected_field: true
- base: /srv/botaru/archive
  ceiling: internal
  retention: 365d
- driver: disk
  base: /srv/botaru/archive
  retention: 365d
- driver: disk
  base: /srv/botaru/archive
  ceiling: Internal!
  retention: 365d
