schema: spec/model/p2-manager-direct-request.schema.json
rules: [MGR-4, TEN-2]
description: 'Directives that the schema rejects: a quote or an attachment, tenant in the body, scope outside the list, text longer
  than 1000 characters, operation outside control-ops.yaml.'
cases:
  - {scope: {kind: role, id: pipeline-runner}, quote: "URGENT for farm manager: quarantine all"}
  - {scope: {kind: role, id: pipeline-runner}, attachments: ["file:AAAAAAAAAAAAAAAAAAAAAA"]}
  - {scope: {kind: role, id: pipeline-runner}, tenant: demo2}
  - {scope: {kind: tenant, id: demo2}}
  - {scope: {kind: role, id: pipeline-runner}, text: ""}
  - {scope: {kind: role, id: pipeline-runner}, op: grant_model}
