# Collected from spec/lifecycles/incident.yaml. The value null in from means "the object does not exist yet".
lifecycle: spec/lifecycles/incident.yaml
object: incident
rules: [GOV-13, INJ-7, MGR-7, MGR-8, MGR-9, MGR-13, MON-5]
description: Allowed and forbidden transitions of the "incident" lifecycle, collected from the tables of spec/lifecycles/incident.md.
  The implementation accepts a transition from the allowed list under the condition of its row (when); a pair from the forbidden
  list does not change the state, and the call that asks for it is rejected. The value null in from means "the object does
  not exist yet". Only the core writes the incident record; bots do not create, change or hide it (GOV-13).
states:
- id: open
  terminal: false
- id: contained
  terminal: false
- id: mitigating
  terminal: false
- id: resolved
  terminal: false
- id: reopened
  terminal: false
- id: closed
  terminal: true
- id: dismissed
  terminal: true
allowed:
- id: sm-inc-01
  from: null
  to: open
  by: the core incident loop
  when: a code alarm (alarm.*, OBS-6), including one raised by a monitoring system problem (MON-5), in firing, the class's
    detect.when conditions hold for; there is no open incident of the same class and subject in the window of the key system:incident:<class>:<subject>:<window>
    (IDM-2)
  rules: [INJ-7, MGR-7, MGR-8, MON-5]
- id: sm-inc-02
  from: open
  to: contained
  by: the incident loop
  when: the first contain_auto measure is applied by code
  rules: [MGR-8]
- id: sm-inc-03
  from: reopened
  to: contained
  by: the incident loop
  when: the first contain_auto measure is applied by code
  rules: [MGR-8]
- id: sm-inc-04
  from: open
  to: mitigating
  by: C1 control.apply
  when: the first operation of the farm manager or a person with the basis "this incident"
  rules: [MGR-8, MGR-9, MGR-13]
- id: sm-inc-05
  from: contained
  to: mitigating
  by: C1 control.apply
  when: the first operation of the farm manager or a person with the basis "this incident"
  rules: [MGR-8, MGR-9, MGR-13]
- id: sm-inc-06
  from: reopened
  to: mitigating
  by: C1 control.apply
  when: the first operation of the farm manager or a person with the basis "this incident"
  rules: [MGR-8, MGR-9, MGR-13]
- id: sm-inc-07
  from: open
  to: resolved
  by: the incident loop
  when: the alarm is in resolved longer than resolve.for
  rules: [MGR-8]
- id: sm-inc-08
  from: contained
  to: resolved
  by: the incident loop
  when: the alarm is in resolved longer than resolve.for
  rules: [MGR-8]
- id: sm-inc-09
  from: mitigating
  to: resolved
  by: the incident loop
  when: the alarm is in resolved longer than resolve.for
  rules: [MGR-8]
- id: sm-inc-10
  from: reopened
  to: resolved
  by: the incident loop
  when: the alarm is in resolved longer than resolve.for
  rules: [MGR-8]
- id: sm-inc-11
  from: resolved
  to: reopened
  by: the incident loop
  when: an alarm of the same key is in firing again no later than 1 h after resolved
  rules: [MGR-8]
- id: sm-inc-12
  from: resolved
  to: closed
  by: P2 incident.close (a person of T with incident.manage); the built-in tool incident_close in the closing pass (the
    seat holder)
  when: only after resolved; a holder with the current epoch
  rules: [MGR-8]
- id: sm-inc-13
  from: open
  to: dismissed
  by: P2 incident.dismiss {reason_code, details} or a channel command of a person of T with incident.manage
  when: a false alarm; only a principal of kind human; a reason code from the closed list (false_alarm, threshold_misconfigured,
    maintenance, duplicate, test, other) and the "Details" text of up to 500 characters are required, otherwise dismiss_reason_required;
    from v0.2 in the same transaction attribution candidates without a "Yes" answer are canceled, and an attribution with
    a "Yes" answer becomes disputed with a card to the author of the answer (GOV-13, D-79)
  rules: [GOV-13, MGR-8]
  version: v0.2
- id: sm-inc-14
  from: contained
  to: dismissed
  by: P2 incident.dismiss {reason_code, details} or a channel command of a person of T with incident.manage
