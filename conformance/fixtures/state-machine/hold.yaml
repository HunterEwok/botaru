# Collected from spec/lifecycles/hold.yaml. The value null in from means "the object does not exist yet".
lifecycle: spec/lifecycles/hold.yaml
object: hold
rules:
- CAP-4
- DEP-8
- GOV-14
- HLD-1
- HLD-2
- HLD-1
- HLD-6
- HLD-7
- LCY-1
- MGR-1
- MGR-14
- MGR-15
- MGR-7
- MGR-9
- MON-9
- PRM-14
- PRM-15
- SEC-6
- TIM-1
description: Allowed and forbidden transitions of the "hold" lifecycle, collected from the tables of spec/lifecycles/hold.md.
  The implementation accepts a transition from the allowed list under the condition of its row; a pair from the forbidden
  list does not change the state, and the call that asks for it is rejected. The scope, effects, reason and author do not
  change after the hold is set; for an active hold only the term may change, toward shortening when the seat holder is replaced,
  and toward extension only for a maintenance window hold while the polls report the window active (MON-9). The core does not lift holds by itself.
states:
- id: active
  terminal: false
- id: expired
  terminal: true
- id: released
  terminal: true
allowed:
- from: null
  to: active
  by: P2 `hold.set`
  when: the operator through `farmctl` (any scope; the `farm` and `seat` scopes only the operator) or a person of their
    own tenant with `hold.set:<scope>` on a scope of their own tenant, through `farmctl` or by a command in a direct chat
    with the bot; a hold on the `governance` scope (v0.2) is set by a person with `admin:governance` in the case's tenant;
    the scope and the effects are in the closed lists of the current version
  rules:
  - GOV-14
  - HLD-1
  - HLD-2
  - HLD-1
  - PRM-14
  - PRM-15
- from: null
  to: active
  by: '`farmctl hold farm` (a write directly into the store, without the core process and without a channel)'
  when: the operator on the core machine; `farmctl` with the core's credentials is part of the core; scope `farm`
  rules:
  - DEP-8
  - HLD-1
- from: null
  to: active
  by: the background loop `hold` by an auto-stop rule
  when: the rule condition from `spec/model/holds.yaml` is met; author `contain_auto`; no term (HLD-6, CAP-4) or one hour
    (HLD-7 `runaway_spend`)
  rules:
  - CAP-4
  - HLD-2
  - HLD-6
  - HLD-7
- from: null
  to: active
  by: the core when an incident opens
  when: the first measure of the incident class from git with its own term; author `contain_auto`
  rules:
  - HLD-2
  - MGR-7
- from: null
  to: active
  by: C1 `control.apply`, operation `hold`
  when: the current holder of the farm manager seat with the current epoch; scope `worker`, `bot`, `bot_group`, `role`,
    `tasktype` or `resource`; a target from the list that code built; a term of at most `hold_ttl_max`; the seat's limits
    are not exceeded
  rules:
  - HLD-2
  - MGR-9
- from: null
  to: active
  by: the seat safeguard
  when: the limits of control operations are exceeded; in one transaction a `no_control` hold on the `seat` scope without
    a term, a seat epoch increment and cancellation of the holder's running attempts in all tenants
  rules:
  - MGR-14
- from: null
  to: active
  by: a P2 hold on the `seat` scope (the farm manager kill switch)
  when: only the operator with `admin:farm` through `farmctl`; in one transaction a seat epoch increment and cancellation
    of the holder's running attempts in all tenants
  rules:
  - MGR-15
  - PRM-14
- from: null
  to: active
  by: the background loop `hold` by a maintenance window of the monitoring system (the E5 adapter polls the maintenance
    status, v0.2)
  when: 'the first `active` event of a window on a node that the tenant catalog linked to its resource (`Catalog.spec.hosts[].monitor_host`);
    scope `host` (the catalog host whose `monitor_host` is the node); effects `no_tool` and `pause_action` (with `hosts[].maintenance_hold:
    true` the effect `no_action` instead of `pause_action`); reason `maintenance`; author `contain_auto`, source `system:monitor`;
    `until` from the event, the poll time plus two poll intervals; no new hold for a window whose hold a person released'
  rules:
  - HLD-2
  - MON-9
- from: null
  to: active
  by: P2 `tenant.suspend`
  when: the operator; a hold on the `tenant` scope with the reason `suspended`
  rules:
  - LCY-1
- from: null
  to: active
  by: revocation of a secret on compromise (`rotate --compromised`)
  when: the operator; a hold on the scope where the secret was used, reason `compromised`
  rules:
  - SEC-6
- from: active
  to: expired
  by: the background loop `hold`
  when: '`until` has come'
  rules:
  - HLD-1
  - TIM-1
- from: active
  to: released
  by: P2 `hold.release`
  when: a principal with `hold.release` on the hold's scope and not below the author in rank (the table "Who sets, who lifts"
    below); otherwise `forbidden`; a hold on the `governance` scope is lifted by a person with `admin:governance` in the
    case's tenant
  rules:
  - GOV-14
  - HLD-2
  - HLD-1
  - PRM-14
- from: active
  to: released
  by: C1 `control.apply`, lifting a hold
  when: the seat holder lifts only its own holds
  rules:
  - HLD-2
  - MGR-9
- from: active
  to: released
  by: P2 `control.revert` with `since`
  when: only the operator with `admin:farm`; the holds that the seat holder set after `since` are lifted
  rules:
  - MGR-15
  - PRM-14
- from: active
  to: released
  by: P2 `control.revert` with `incident`
  when: the operator or a person of the tenant with `hold.release` in this tenant (the command `/control revert <number>`
    in a direct chat with the bot); only the seat holder's holds for this incident are lifted
  rules:
  - MGR-15
  - PRM-15
- from: active
  to: active
  by: the background loop `hold` by a later `active` event of the same maintenance window (v0.2)
  when: the core moves `until` of the maintenance window hold forward to the event's `until`, never back; nothing else of
    the hold changes
  rules:
  - HLD-2
  - MON-9
- from: active
  to: active
  by: P2 `seat.assign` (replacement of the seat holder)
  when: for the holds of the previous holder, `until` is shortened to 15 minutes from the replacement if it was later
  rules:
  - HLD-2
  - MGR-1
forbidden:
- from: null
  to: expired
  expect: rejected
  rules:
  - CAP-4
  - DEP-8
  - GOV-14
  - HLD-1
  - HLD-2
  - HLD-1
  why: the object does not appear directly in the state expired
- from: null
  to: released
  expect: rejected
  rules:
  - CAP-4
  - DEP-8
  - GOV-14
  - HLD-1
  - HLD-2
  - HLD-1
  why: the object does not appear directly in the state released
- from: expired
  to: active
  expect: rejected
  rules:
  - CAP-4
  - DEP-8
  - GOV-14
  - HLD-1
  - HLD-2
  - HLD-1
  why: 'expired is a terminal state: there are no transitions out of it'
- from: expired
  to: expired
  expect: rejected
  rules:
  - HLD-1
  - TIM-1
  why: 'expired is a terminal state: there are no transitions out of it'
- from: expired
  to: released
  expect: rejected
  rules:
  - GOV-14
  - HLD-2
  - HLD-1
  - MGR-15
  - MGR-9
  - PRM-14
  why: 'expired is a terminal state: there are no transitions out of it'
- from: released
  to: active
  expect: rejected
  rules:
  - CAP-4
  - DEP-8
  - GOV-14
  - HLD-1
  - HLD-2
  - HLD-1
  why: 'released is a terminal state: there are no transitions out of it'
- from: released
  to: expired
  expect: rejected
  rules:
  - HLD-1
  - TIM-1
  why: 'released is a terminal state: there are no transitions out of it'
- from: released
  to: released
  expect: rejected
  rules:
  - GOV-14
  - HLD-2
  - HLD-1
  - MGR-15
  - MGR-9
  - PRM-14
  why: 'released is a terminal state: there are no transitions out of it'
