# Collected from spec/lifecycles/case.yaml. The value null in from means "the object does not exist yet".
lifecycle: spec/lifecycles/case.yaml
object: case
rules: [GOV-6, GOV-7, GOV-8, GOV-9, GOV-12, GOV-14, GOV-15, GOV-23, GOV-30, GOV-31, IDN-10]
description: Allowed and forbidden transitions of the "governance case" lifecycle, collected from the tables of spec/lifecycles/case.md.
  The implementation accepts a transition from the allowed list under the condition of its row (when); a pair from the forbidden
  list does not change the state, and the call that asks for it is rejected. The value null in from means "the object does
  not exist yet". Rows with "any open" are expanded over all non-terminal states; the hold and stuck flags do not change
  the state and are recorded as a transition to the same state with a to_note mark. The whole lifecycle arrives in v0.2.
version: v0.2
states:
- id: opened
  terminal: false
- id: parked
  terminal: false
- id: balloting
  terminal: false
- id: counted
  terminal: false
- id: confirming
  terminal: false
- id: effective
  terminal: true
- id: rejected
  terminal: true
- id: expired
  terminal: true
- id: canceled
  terminal: true
allowed:
- id: sm-case-01
  from: null
  to: opened
  by: the governance loop
  when: the head of the queue under the conditions of GOV-14; the tenant has no open case and no hold on the governance
    scope; in removal mode L is not empty and the swap_cooldown pause has passed
  rules: [GOV-6, GOV-12, GOV-14]
- id: sm-case-02
  from: opened
  to: parked
  by: the governance loop
  when: the governance line lacks money for the case estimate, starting with the farm manager's ballot
