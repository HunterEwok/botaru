# Collected from spec/lifecycles/case.yaml. The value null in from means "the object does not exist yet".
lifecycle: spec/lifecycles/case.yaml
object: case
rules: [GOV-6, GOV-9, GOV-12, GOV-14, GOV-30, GOV-31, GOV-43, IDN-10]
description: Allowed and forbidden transitions of the "governance case" lifecycle, collected from the tables of spec/lifecycles/case.md.
  The implementation accepts a transition from the allowed list under the condition of its row (when); a pair from the forbidden
  list does not change the state, and the call that asks for it is rejected. The value null in from means "the object does
  not exist yet". Rows with "any open" are expanded over all non-terminal states; the hold flag does not change the state
  and is recorded as a transition to the same state with a to_note mark. The whole lifecycle arrives in v0.2.
version: v0.2
states:
- id: opened
  terminal: false
- id: confirming
  terminal: false
- id: effective
  terminal: true
- id: rejected
  terminal: true
- id: expired
  terminal: true
- id: canceled
  terminal: true
allowed:
- id: sm-case-01
  from: null
  to: opened
  by: the governance loop
  when: the queue head under the conditions of GOV-14; the tenant has no open case and no hold on the governance scope; in
    the removal mode L is not empty and the swap_cooldown pause has passed
  rules: [GOV-6, GOV-12, GOV-14]
- id: sm-case-02
  from: opened
  to: confirming
  by: the governance loop
  when: 'the card is sent: in the vacancy mode with the free seat, in the removal mode with L, the figures of its seats and
    the leaver code proposed, if any'
  rules: [GOV-12, GOV-14, GOV-43]
- id: sm-case-03
  from: opened
  to: opened
  to_note: same, flag hold
  from_note: any open
  by: P2 hold.set on the governance scope
  when: a hold by people; lifting the hold continues the case from the same place
  rules: [GOV-14]
- id: sm-case-04
  from: confirming
  to: confirming
  to_note: same, flag hold
  from_note: any open
  by: P2 hold.set on the governance scope
  when: a hold by people; lifting the hold continues the case from the same place
  rules: [GOV-14]
- id: sm-case-05
  from: confirming
  to: effective
  by: the "Confirm" button (governance.confirm:commission)
  when: '"Details" was opened; the candidate''s change has no unanswered attribution candidates; the deadline has not passed;
    in the removal mode the button names the proposed seat or the seat the person chose from L'
  rules: [GOV-9, GOV-12, GOV-30]
- id: sm-case-06
  from: confirming
  to: rejected
  by: the "Not now" or "Wrong candidate" button (a "Reject" reason code)
  when: governance.confirm:commission
  rules: [GOV-9, GOV-31]
- id: sm-case-07
  from: confirming
  to: expired
  by: the approval-expiry loop (the outcome on silence from the decision registry row, APR-12)
  when: 7 days without a decision
  rules: [GOV-9]
- id: sm-case-08
  from: opened
  to: canceled
  to_note: canceled(human)
  from_note: any open
  by: P2 governance.cancel
  when: a person with admin:governance in the case's tenant
  rules: [GOV-14]
- id: sm-case-09
  from: confirming
  to: canceled
  to_note: canceled(human)
  from_note: any open
  by: P2 governance.cancel
  when: a person with admin:governance in the case's tenant
  rules: [GOV-14]
- id: sm-case-10
  from: opened
  to: canceled
  to_note: canceled(candidate_ineligible)
  from_note: any open
  by: the governance loop
  when: 'the candidate lost eligibility: left, is under a hold by people on the bot scope, or got a confirmed attribution'
  rules: [GOV-14]
- id: sm-case-11
  from: confirming
  to: canceled
  to_note: canceled(candidate_ineligible)
  from_note: any open
  by: the governance loop
  when: 'the candidate lost eligibility: left, is under a hold by people on the bot scope, or got a confirmed attribution'
  rules: [GOV-14]
- id: sm-case-12
  from: opened
  to: canceled
  to_note: canceled(seat_changed)
  from_note: any open
  by: the core on a holder change
  when: a seat from L changed its holder or became free
  rules: [GOV-12, IDN-10]
- id: sm-case-13
  from: confirming
  to: canceled
  to_note: canceled(seat_changed)
  from_note: any open
  by: the core on a holder change
  when: a seat from L changed its holder or became free
  rules: [GOV-12, IDN-10]
forbidden:
- id: sm-case-x01
  from: null
  to: confirming
  expect: rejected
  rules: [GOV-6, GOV-12, GOV-14]
  why: the object does not appear directly in the state confirming
- id: sm-case-x02
  from: null
  to: effective
  expect: rejected
  rules: [GOV-6, GOV-12, GOV-14]
  why: the object does not appear directly in the state effective
- id: sm-case-x03
  from: null
  to: rejected
  expect: rejected
  rules: [GOV-6, GOV-12, GOV-14]
  why: the object does not appear directly in the state rejected
- id: sm-case-x04
  from: null
  to: expired
  expect: rejected
  rules: [GOV-6, GOV-12, GOV-14]
  why: the object does not appear directly in the state expired
- id: sm-case-x05
  from: null
  to: canceled
  expect: rejected
  rules: [GOV-6, GOV-12, GOV-14]
  why: the object does not appear directly in the state canceled
- id: sm-case-x06
  from: opened
  to: effective
  expect: rejected
  rules: [GOV-9, GOV-12, GOV-14, GOV-30]
  why: the lifecycle table has no such transition
- id: sm-case-x07
  from: opened
  to: rejected
  expect: rejected
  rules: [GOV-9, GOV-12, GOV-14, GOV-31]
  why: the lifecycle table has no such transition
- id: sm-case-x08
  from: opened
  to: expired
  expect: rejected
  rules: [GOV-9, GOV-12, GOV-14, GOV-43]
  why: the lifecycle table has no such transition
- id: sm-case-x09
  from: confirming
  to: opened
  expect: rejected
  rules: [GOV-6, GOV-9, GOV-12, GOV-14]
  why: the lifecycle table has no such transition
- id: sm-case-x10
  from: effective
  to: opened
  expect: rejected
  rules: [GOV-9, GOV-12, GOV-30]
  why: 'effective is a terminal state: there are no transitions out of it'
- id: sm-case-x11
  from: effective
  to: confirming
  expect: rejected
  rules: [GOV-9, GOV-12, GOV-30]
  why: 'effective is a terminal state: there are no transitions out of it'
- id: sm-case-x12
