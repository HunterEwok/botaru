# Collected from spec/lifecycles/escalation.yaml. The value null in from means "the object does not exist yet".
lifecycle: spec/lifecycles/escalation.yaml
object: escalation
rules:
- COM-13
- MGR-1
- MGR-13
- MGR-2
- MGR-24
- MGR-4
- MGR-5
- MGR-6
- MGR-9
description: Allowed and forbidden transitions of the "escalation (v0.2)" lifecycle, collected from the tables of spec/lifecycles/escalation.md.
  The implementation accepts a transition from the allowed list under the condition of its row (when); a pair from the forbidden
  list does not change the state, and the call that asks for it is rejected. The value null in from means "the object does
  not exist yet". An escalation lives in the bot's tenant; the terminal states merged, dismissed, answered, expired do not
  change (MGR-6).
states:
- id: screened
  terminal: false
- id: merged
  terminal: true
- id: dismissed
  terminal: true
- id: parked
  terminal: false
- id: in_review
  terminal: false
- id: forwarded
  terminal: false
- id: taken
  terminal: false
- id: answered
  terminal: true
- id: expired
  terminal: true
allowed:
- id: sm-esc-01
  from: null
  to: screened
  by: P3 escalate; P1 escalation.submit for job; publication at the end of the attempt
  when: 'a live attempt, at most one per attempt; schema; subject: its own worker, its own task tree or a resource from
    the task''s scope; rate: 1 per hour per worker, 5 per day per role in the tenant, 20 per day per tenant; the evidence
    exists and belongs to the tenant and the attempt'
  rules:
  - MGR-5
  - MGR-6
- id: sm-esc-02
  from: null
  to: dismissed
  by: same
  when: the schema, subject, rate or evidence did not pass; chain depth above 5 (chain_too_deep, PRM-6)
  rules:
  - MGR-5
  - MGR-6
- id: sm-esc-03
  from: screened
  to: merged
  by: the core
  when: an alarm is firing or an incident is open for the subject
  rules:
  - MGR-6
- id: sm-esc-04
  from: screened
  to: dismissed
  by: the core
  when: 'the request has a regular path: a model grant or request_action (use_normal_path)'
  rules:
  - MGR-6
- id: sm-esc-05
  from: screened
  to: in_review
  by: the core
  when: the tenant's review line covers the lens estimate; a necessity lens task review.escalation.v1 is enqueued with the
    key system:necessity:<escalation> (IDM-2)
  rules:
  - COM-13
  - MGR-6
- id: sm-esc-06
  from: screened
  to: parked
  by: the core
  when: the review line is empty
  rules:
  - MGR-6
- id: sm-esc-07
  from: parked
  to: in_review
  by: the core
  when: money in the review line has appeared
  rules:
  - MGR-6
- id: sm-esc-08
  from: in_review
  to: forwarded
  by: the core by the escalation section of the commission manifest
  when: lens score from forward_if_score_gte (2), for untrusted from untrusted_forward_if_score_gte (3); at most 30 forwarded
    per day across the whole farm
  rules:
  - MGR-6
- id: sm-esc-09
  from: in_review
  to: dismissed
  by: the core
  when: score below the threshold; a lens reason from the list (evidence_below_threshold, covered_by_alarm, out_of_scope)
  rules:
  - MGR-6
- id: sm-esc-10
  from: forwarded
  to: taken
  by: P3 escalations_take of a holder decision attempt with the current epoch
  when: 'the seat is in held; a task in T of class 3, with urgency: high of class 1 through the control lane (DSP-5)'
  rules:
  - MGR-24
  - MGR-4
- id: sm-esc-11
  from: taken
  to: forwarded
  by: the core
  when: the decision attempt ended without an outcome (seat_changed, fenced, cancellation, failure)
  rules:
  - MGR-1
- id: sm-esc-12
  from: taken
  to: answered
  by: the core at complete of the decision attempt
  when: 'an outcome is recorded: operations (MGR-9), a card or "no action needed"'
  rules:
  - MGR-13
  - MGR-9
- id: sm-esc-13
  from: screened
  to: expired
  by: the core escalation loop
  when: escalation_ttl has passed; code shows people in T an urgent forwarded escalation that nobody took, using a template
  rules:
  - MGR-2
- id: sm-esc-14
  from: parked
  to: expired
  by: the core escalation loop
  when: escalation_ttl has passed; code shows people in T an urgent forwarded escalation that nobody took, using a template
