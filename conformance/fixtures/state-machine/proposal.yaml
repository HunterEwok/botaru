# Collected from spec/lifecycles/proposal.yaml. The value null in from means "the object does not exist yet".
lifecycle: spec/lifecycles/proposal.yaml
object: proposal
rules: [COM-4, COM-5, COM-6, COM-7, COM-14, COM-16, DIG-1, DIG-2, DIG-3, DIG-4, DIG-5, DIG-6, INS-3, PRP-1, PRP-2, PRP-3,
  PRP-4, PRP-5, PRP-6, PRP-7, PRP-8, PRP-9, PRP-10, PRP-11, PRP-16, PRP-18, PRP-19, PRP-20, PRP-21, PRP-22, PRP-23]
description: 'Allowed and forbidden transitions of the "proposal" lifecycle, collected from the tables of spec/lifecycles/proposal.md.
  The implementation accepts a transition from the allowed list under the condition of its row (when); a pair from the forbidden
  list does not change the state, and the call that asks for it is rejected. Only code changes the state of a proposal by
  the table, and only a person presses the buttons (PRP-6). The audit sample states and the "Lift veto" button arrive in
  v0.2: their rows carry version v0.2. The state realized is terminal, except for the transition to reverted.'
version: v0.1
states:
- id: screened
  terminal: false
- id: in_review
  terminal: false
- id: recommended
  terminal: false
- id: parked
  terminal: false
- id: dismissed
  terminal: true
- id: presented
  terminal: false
- id: declined
  terminal: true
- id: expired
  terminal: true
- id: noted
  terminal: true
- id: realizing
  terminal: false
- id: realized
  terminal: true
- id: realization_failed
  terminal: true
- id: reverted
  terminal: true
- id: sampled
  terminal: false
- id: sample_presented
  terminal: false
- id: sample_judged
  terminal: false
- id: sample_closed
  terminal: true
allowed:
- id: sm-prp-01
  from: null
  to: screened
  by: '`complete` of an analysis or aggregator attempt (port P1)'
  when: the body passed the schema; the evidence matched the reread values; the change is by the allowlist, in its own folder,
    the target is `proposable`, the direction is allowed; the metric is from the registry; the limits are not exceeded;
    otherwise there is no record, there is a `proposal.rejected.v1` event
  rules: [INS-3, PRP-1, PRP-2, PRP-3, PRP-5, PRP-6, PRP-7, PRP-8, PRP-10, PRP-11, PRP-16, PRP-21]
- id: sm-prp-02
  from: screened
  to: in_review
  by: the core loop `proposal`
  when: the code checks passed; the sum of `tree_budget_eur` of the review types of the lenses being enqueued is reserved
    in the `review` line
  rules: [COM-5, COM-6, COM-14, PRP-6]
- id: sm-prp-03
  from: screened
  to: dismissed
  by: the `proposal` loop
  when: a code check did not pass (for example `no_op`)
  rules: [COM-5, PRP-6]
- id: sm-prp-04
  from: screened
  to: parked
  by: the `proposal` loop
  when: the target is locked by a conflict (`conflict`), or there has been no money for reviews longer than `review_wait_max`
    (`review_budget`)
  rules: [COM-6, PRP-6, PRP-9]
- id: sm-prp-05
  from: in_review
  to: recommended
  by: the `proposal` loop
  when: the code verdict `recommended`; for kind `none`, by two reviews
  rules: [COM-4, COM-14, PRP-6]
- id: sm-prp-06
  from: in_review
  to: parked
  by: the `proposal` loop
  when: the verdict `parked(score)` or `parked(veto_lens_missing)`
  rules: [COM-4, PRP-6]
- id: sm-prp-07
  from: in_review
  to: dismissed
  by: the `proposal` loop
  when: the verdict `dismissed(veto)`, `dismissed(below_min)` or `dismissed(low_score)`
  rules: [COM-4, PRP-6]
- id: sm-prp-08
  from: parked
  to: screened
  by: the `proposal` loop
  when: the evidence changed by more than the declared share; the trial of the conflicting proposal ended; the `review`
    line was topped up; the lens with a veto has an executor again
  rules: [COM-6, COM-7, PRP-5, PRP-6, PRP-9]
- id: sm-prp-09
  from: parked
  to: expired
  by: the `proposal` loop
  when: '`park_ttl` expired (30 days by default)'
  rules: [PRP-6]
- id: sm-prp-10
  from: parked
  to: sampled
  by: the `proposal` loop, the monthly audit sample
  when: selected by the recorded seed
  rules: [DIG-5, PRP-6]
  version: v0.2
- id: sm-prp-11
  from: dismissed
  to: sampled
  by: the `proposal` loop, the monthly audit sample
  when: selected by the recorded seed
  rules: [DIG-5, PRP-6]
  version: v0.2
- id: sm-prp-12
  from: recommended
  to: presented
  by: delivery of the `proposal_digest` summary through the channel (E1)
  when: the evidence reread before showing is within tolerance
  rules: [DIG-1, DIG-2, PRP-2, PRP-6]
- id: sm-prp-13
  from: recommended
  to: parked
  by: the `proposal` loop when building the summary
  when: evidence drift (`evidence_drift`) or a conflict
  rules: [PRP-2, PRP-6, PRP-9]
- id: sm-prp-14
  from: recommended
  to: expired
  by: the `proposal` loop
  when: 28 days without being shown (`recommend_ttl`)
  rules: [PRP-6]
- id: sm-prp-15
  from: presented
  to: realizing
  by: 'the "Accept" button: the `decide` operation (P1) from the card''s channel (APR-4)'
  when: the kind is not `none`; the person has the right to decide and to start the realization; the target is not locked
    by a conflict or by a running trial
  rules: [DIG-3, PRP-4, PRP-6, PRP-9, PRP-18, PRP-21]
- id: sm-prp-16
  from: presented
  to: noted
  by: the "Accept" button
  when: kind `none`
  rules: [DIG-3, PRP-4, PRP-6]
- id: sm-prp-17
  from: presented
  to: declined
  by: the "Reject" button and the reason card
  when: a reason from the closed list
  rules: [DIG-3, DIG-4, PRP-5, PRP-6]
- id: sm-prp-18
  from: presented
  to: recommended
  by: the "Postpone" button
  when: at most 2 times
  rules: [DIG-3, PRP-6]
- id: sm-prp-19
  from: presented
  to: expired
  by: the `proposal` loop
  when: '`decide_ttl` expired (14 days by default)'
  rules: [PRP-6]
- id: sm-prp-20
  from: presented
  to: parked
  by: the `proposal` loop
  when: a conflicting proposal moved to `realizing`; the card goes dark
  rules: [PRP-6, PRP-9]
- id: sm-prp-21
  from: realizing
  to: realized
  by: 'the core: the "Accept" or "Lift veto" object is executed; a commit with the line `Botaru-Proposal: <id>` is applied;
    a commit is linked through P2 `proposal.link_commit`'
  when: 'the link is verified: the commit is applied, only the tenant folder, the fields are at the accepted values or in
    the named direction'
  rules: [PRP-6, PRP-8, PRP-19, PRP-20]
- id: sm-prp-22
  from: realizing
  to: realization_failed
  by: the core
  when: the object is not executed (`object_failed`) or `realize_by` expired (`timeout`)
  rules: [PRP-6, PRP-18]
- id: sm-prp-23
  from: realized
  to: reverted
  by: 'the core: a commit with the line `Botaru-Revert: <id> <reason>` is applied'
  when: the commit returns the values of the reverse edit; the reason is from the closed list, without one `other`; `harm_observed`
    closes the trial with the outcome `worse`
  rules: [PRP-6, PRP-20, PRP-22, PRP-23]
- id: sm-prp-24
  from: sampled
  to: sample_presented
  by: delivery of `proposal_sample_card` through the channel (E1)
  when: a recipient with `proposal.decide:<category>`; the recipient's address and ceiling
  rules: [DIG-2, DIG-5, DIG-6, PRP-6]
  version: v0.2
- id: sm-prp-25
  from: sample_presented
  to: sample_judged
  by: the "Would accept" button
  when: the answer is written into the sample and scores the forecasts before the scores are shown
  rules: [COM-16, DIG-6, PRP-6]
  version: v0.2
- id: sm-prp-26
  from: sample_presented
  to: sample_closed
  by: the "Would not accept" button or the `decide_ttl` deadline
  rules: [DIG-6, PRP-6]
  version: v0.2
- id: sm-prp-27
  from: sample_judged
  to: realizing
  by: the "Accept" button (no veto) or "Lift veto" (there is a veto, the capability `proposal.override_veto:<category>`,
    after "Details")
  when: the kind is not `none`; rights; the target is not locked
  rules: [DIG-6, PRP-4, PRP-6, PRP-9, PRP-18, PRP-21]
  version: v0.2
- id: sm-prp-28
  from: sample_judged
  to: noted
  by: the "Accept" or "Lift veto" button
  when: kind `none`
  rules: [DIG-6, PRP-4, PRP-6]
  version: v0.2
- id: sm-prp-29
  from: sample_judged
  to: sample_closed
  by: the "Reject" button or the `decide_ttl` deadline
  rules: [DIG-6, PRP-6]
  version: v0.2
