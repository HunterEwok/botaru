# Collected from spec/lifecycles/message.yaml. The value null in from means "the object does not exist yet".
lifecycle: spec/lifecycles/message.yaml
object: message
rules:
- DLV-2
- FEN-4
- FEN-5
- HLD-3
- MSG-1
- MSG-10
- MSG-11
- MSG-12
- MSG-13
- MSG-14
- MSG-15
- MSG-16
- MSG-2
- MSG-3
- MSG-4
- MSG-5
- MSG-6
- MSG-7
- MSG-8
- MSG-9
- PRM-8
- STA-1
- STA-2
description: 'Allowed and forbidden transitions of the "message (inbox entry)" lifecycle, collected from the tables of spec/lifecycles/message.md.
  The implementation accepts a transition from the allowed list under the condition of its row (when); a pair from the forbidden
  list does not change the state, and the call that asks for it is rejected. The value null in from means "the object does
  not exist yet". A refusal at sending creates no record: the transition to rejected is an answer to the sender. Terminal
  states do not change: an entry after acked, dead, expired or discarded is never handed out; there are at most three returns
  that count a handout (MSG-9).'
states:
- id: staged
  terminal: false
- id: queued
  terminal: false
- id: leased
  terminal: false
- id: acked
  terminal: true
- id: discarded
  terminal: true
- id: dead
  terminal: true
- id: expired
  terminal: true
- id: current
  terminal: false
- id: stale
  terminal: false
- id: replaced
  terminal: true
- id: removed
  terminal: true
- id: rejected
  terminal: true
allowed:
- id: sm-msg-01
  from: null
  to: staged
  by: P3 send_message from an agent attempt; P1 msg.send with a job attempt token
  when: the attempt is alive and holds the lease; a kind of the report genus with the needed producers; the pair (kind,
    address) is in the role's messages.send, the initiator has msg.send:<kind>; the address is allowed inside the tenant;
    the fields passed the kind's closed schema, the size and the note are within limits; the kind's data_class is not below
    the attempt's mark; at most 3 sends per attempt, the kind's rate; hops at most 5; the inbox has room counting staged,
    and the sender role's share is not exceeded; there is no hold with no_message
  rules:
  - MSG-1
  - MSG-10
  - MSG-11
  - MSG-13
  - MSG-15
  - MSG-2
  - MSG-4
  - MSG-5
  - MSG-6
- id: sm-msg-02
  from: null
  to: rejected
  by: P3 send_message, P1 msg.send
  when: 'any check above failed: address_invalid, msg_type_not_allowed, data_schema_invalid, note_not_allowed, data_class_exceeded,
    inbox_full, sender_quota, hops_exceeded, service_rate_limited, held, fenced; the model gets a short "no"'
  rules:
  - FEN-4
  - HLD-3
  - MSG-10
  - MSG-15
  - MSG-4
  - MSG-5
  - PRM-8
- id: sm-msg-03
  from: staged
  to: queued
  by: C1 complete of the sending attempt (the same transaction)
  when: at this moment there is no hold with no_message on the sender's scope; for delivery all, copies are created here
    in the inboxes of the recipient's active workers, at most 50, and a copy that has no room in a worker's inbox is not
    created, and the core writes an event
  rules:
  - DLV-2
  - MSG-14
  - MSG-9
- id: sm-msg-04
  from: staged
  to: discarded
  by: C1 fail of the sending attempt, its cancellation, preemption or loss of the lease; C1 complete under a hold with no_message
  when: the attempt ended without complete, or a hold forbids publication (reason held); a retry of the task by a new attempt
    sends its own and does not duplicate the key system:msg:<attempt>:<n>
  rules:
  - FEN-4
  - HLD-3
  - MSG-9
- id: sm-msg-05
  from: null
  to: queued
  by: 'the core in the transaction of a terminal transition of a task (a route on: task_done with mode: report); the core
    for its own message to a specific worker'
  when: an auto-report with summary_fields fields, the task's mark and flag, the key system:report:<task>:<route>; only
    the core writes the address worker:<id>; an auto-report that has no room is not created, the core writes a message.rejected
    event, and the task transition goes through
  rules:
  - DLV-2
  - MSG-16
  - MSG-4
- id: sm-msg-06
  from: queued
  to: leased
  by: P3 inbox_read; P1 msg.receive with a job attempt token
  when: the task type of the reading attempt declared inbox.read with this kind, the kind is in the role's receive; the
    entry's mark is not above the attempt's mark (otherwise the entry is not handed out and is counted in hidden); a worker
    reads the inbox of its role, the inboxes of its bot groups and, if the role declared instance_inbox, its own inbox
  rules:
  - MSG-11
  - MSG-6
  - MSG-7
  - MSG-8
- id: sm-msg-07
  from: leased
  to: acked
  by: C1 complete of the reading attempt (the same transaction)
  when: all entries that the attempt read and did not return with msg.nack; P1 msg.ack only marks the entry, the acknowledgement
    happens here anyway
  rules:
  - DLV-2
  - MSG-9
- id: sm-msg-08
  from: leased
  to: queued
  by: C1 fail of the reading attempt; loss of its lease (the reaper loop); P1 msg.nack
  when: the entry's term has not expired; the handout count plus one, and after that it is below 3
  rules:
  - MSG-9
- id: sm-msg-09
  from: leased
  to: queued
  by: cancellation or preemption of the reading attempt; a lease that expired while the core was not running
  when: the entry's term has not expired; the handout count does not change
  rules:
  - FEN-5
  - MSG-9
- id: sm-msg-10
  from: leased
  to: dead
  by: C1 fail of the reading attempt; loss of its lease; P1 msg.nack
  when: this is the third return that counts a handout (delivery_exhausted); the core writes a message.dead event
  rules:
  - MSG-9
- id: sm-msg-11
  from: leased
  to: expired
  by: any return of an entry to the inbox
  when: the entry's term expired while it was leased
  rules:
  - MSG-12
- id: sm-msg-12
  from: queued
  to: expired
  by: the background loop inbox
  when: expiresat has passed; the entry is no longer handed out, wakes nobody and creates no tasks
  rules:
  - MSG-12
- id: sm-msg-13
  from: queued
  to: discarded
  by: apply removed the role, the bot group or the receive of this kind; P2 worker.revoke for a worker inbox
  when: the recipient no longer exists (reason recipient_gone); the core writes an event, the entry is not lost silently
  rules:
  - MSG-10
  - MSG-3
- id: sm-msg-14
  from: null
  to: current
  by: P1 msg.send with a worker token (code outside an attempt)
  when: 'a kind of the state genus with producers: [code]; the sender is the worker from the credentials; at most once per
    minute per (worker, kind), plus on a phase change'
  rules:
  - MSG-14
  - STA-1
- id: sm-msg-15
  from: current
  to: replaced
  by: P1 msg.send of the same worker with the same kind
  when: a new value in the same inbox; in the same transaction it becomes current
  rules:
  - MSG-14
  - MSG-9
- id: sm-msg-16
  from: current
  to: stale
  by: the background loop inbox
  when: the value is older than the kind's stale_after
  rules:
  - MSG-12
- id: sm-msg-17
  from: stale
  to: replaced
  by: P1 msg.send of the same worker with the same kind
  when: the new value becomes current
  rules:
  - MSG-14
- id: sm-msg-18
  from: current
  to: removed
  by: P2 worker.revoke; apply removed the kind or the receiving role
  when: the value of a revoked worker is no longer shown as state
  rules:
  - MSG-14
  - STA-2
- id: sm-msg-19
  from: stale
  to: removed
  by: P2 worker.revoke; apply removed the kind or the receiving role
  when: the value of a revoked worker is no longer shown as state
  rules:
  - MSG-14
  - STA-2
