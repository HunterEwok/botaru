# Collected from spec/lifecycles/trial.yaml. The value null in from means "the object does not exist yet".
lifecycle: spec/lifecycles/trial.yaml
object: trial
rules: [OBV-6, PRP-18, PRP-19, PRP-20, PRP-21, PRP-22, PRP-23]
description: Allowed and forbidden transitions of the "change trial" lifecycle, collected from the tables of spec/lifecycles/trial.md.
  The implementation accepts a transition from the allowed list under the condition of its row (when); a pair from the forbidden
  list does not change the state, and the call that asks for it is rejected. Only the core writes the trial record; code
  computes the outcome at the end of the window, the model does not write into the record.
version: v0.1
states:
- id: baseline
  terminal: false
- id: running
  terminal: false
- id: guard_broken
  terminal: false
- id: better
  terminal: true
- id: unchanged
  terminal: true
- id: worse
  terminal: true
- id: undetermined
  terminal: true
- id: mixed
  terminal: true
- id: canceled
  terminal: true
allowed:
- id: sm-tri-01
  from: null
  to: baseline
  by: the "Accept" or "Lift veto" button
  when: the change kind is not `none`; the metric and the guards come from series with a full `outcome` block; guards by
    the target kind, by the metric and from `insights.extra_guards`; the before values cover the 14 days before the decision
  rules: [OBV-6, PRP-21]
- id: sm-tri-02
  from: baseline
  to: running
  by: the core sets the proposal to `realized`
  when: the link is verified
  rules: [PRP-19, PRP-21]
- id: sm-tri-03
  from: baseline
  to: canceled
  by: the core sets the proposal to `realization_failed`
  when: the object is not executed or `realize_by` expired
  rules: [PRP-18]
- id: sm-tri-04
  from: running
  to: guard_broken
  by: the core loop `proposal`, the daily check
  when: a guard went out of tolerance in the bad direction
  rules: [PRP-23]
- id: sm-tri-05
  from: running
  to: mixed
  by: the `proposal` loop, end of the window
  when: another proposal was executed on the same subjects, or another commit changed the fields of the same objects
  rules: [PRP-22]
- id: sm-tri-06
  from: running
  to: undetermined
  by: the `proposal` loop, end of the window
  when: before or after, `min_samples` was not reached in a computation that is not empty because of the points of the author
    or of its role; an empty computation gives the mark `self_measured`, not `undetermined`
  rules: [PRP-22]
- id: sm-tri-07
  from: running
  to: worse
  by: the `proposal` loop, end of the window; or the core sets the proposal to `reverted` with the reason `harm_observed`
  when: a worsening beyond tolerance in at least one of the three computations; or a revert with `harm_observed`
  rules: [PRP-20, PRP-22, PRP-23]
- id: sm-tri-08
  from: running
  to: better
  by: the `proposal` loop, end of the window
  when: an improvement beyond tolerance in all computations
  rules: [PRP-22]
- id: sm-tri-09
  from: running
  to: unchanged
  by: the `proposal` loop, end of the window
  when: all other cases
  rules: [PRP-22]
- id: sm-tri-10
  from: running
  to: canceled
  by: the core sets the proposal to `reverted`
  when: no guard fired during the window, the revert reason is `superseded` or `other`
  rules: [PRP-20]
- id: sm-tri-11
  from: guard_broken
  to: worse
  by: the `proposal` loop, end of the window; or the core sets the proposal to `reverted`
  rules: [PRP-22, PRP-23]
