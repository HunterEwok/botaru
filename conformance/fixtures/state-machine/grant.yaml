# Collected from spec/lifecycles/grant.yaml. The value null in from means "the object does not exist yet".
lifecycle: spec/lifecycles/grant.yaml
object: grant
rules: [GW-2, MGR-17, MGR-18, MGR-2, MGR-22]
description: Allowed and forbidden transitions of the "model grant" lifecycle, collected from the tables of spec/lifecycles/grant.md.
  The implementation accepts a transition from the allowed list under the condition of its row (when); a pair from the forbidden
  list does not change the state, and the call that asks for it is rejected. A grant lives in the task's tenant and ends
  together with the task; at most 2 attempts, a term of at most 6 h. The whole lifecycle arrives in v0.2.
version: v0.2
states:
- id: requested
  terminal: false
- id: screened
  terminal: false
- id: pending
  terminal: false
- id: approved
  terminal: false
- id: active
  terminal: false
- id: consumed
  terminal: true
- id: denied
  terminal: true
- id: expired
  terminal: true
- id: revoked
  terminal: true
allowed:
- id: sm-grt-01
  from: null
  to: requested
  by: P3 request_model_grant; P1 grant.request for job
  when: the role has the ladder model_grants.ladder, the tenant's grant line is above 0; one request per task; a profile
    from the ladder ∩ those allowed to the tenant, not the seat's profile
  rules: [MGR-17]
- id: sm-grt-02
  from: requested
  to: denied
  by: the core on receipt
  when: 'no right to ask (grant_not_eligible: neither the initial input above the class threshold nor the type history by
    MGR-17); the evidence did not match reason; the price does not fit (grant_over_budget); rate (grant_rate_limited: more
    than 3 requests per role in the tenant per day, MGR-17)'
  rules: [MGR-17]
- id: sm-grt-03
  from: requested
  to: screened
  by: the core on receipt
  when: all code checks passed
  rules: [MGR-17]
- id: sm-grt-04
  from: screened
  to: pending
  by: the core
  when: always, right after the code checks; the request waits for the seat holder's nearest batch or a person's decision
  rules: [MGR-18]
- id: sm-grt-05
  from: pending
  to: approved
  by: P3 grant_decide of the seat holder (task manager.grants.v1, in a batch once every 10 minutes, key system:grants:<tenant>:<window>,
    IDM-2); P2 model_grant.issue by a person with model_grant.manage
  when: the epoch is current; at most 2 attempts, a term of at most 6 h, the sum cap_eur within the grant line and within
    the seat's daily grant ceiling seat_grants_eur_day; in distrust mode only the first step of the ladder
  rules: [MGR-18, MGR-22]
- id: sm-grt-06
  from: pending
  to: denied
  by: P3 grant_decide with a refusal; P2 by a person with model_grant.manage
  when: a reason from the closed list
  rules: [MGR-18]
- id: sm-grt-07
  from: pending
  to: expired
  by: the grant loop
  when: no decision within grant_wait_max (15 minutes), reason grant_expired_unanswered; the task continues on the base
    model
  rules: [MGR-18, MGR-2]
- id: sm-grt-08
  from: approved
  to: active
  by: the core at the start of a task attempt
  when: P4 allows the granted slot only to this task
  rules: [MGR-18]
- id: sm-grt-09
  from: active
  to: approved
  by: the core at the end of an attempt
  when: attempts_left is above 0 and the task has not finished
  rules: [MGR-18]
- id: sm-grt-10
  from: active
  to: consumed
  by: the core
  when: 'the grant attempts ran out, the task finished, or the rest of cap_eur does not hold the reserve of the next call:
    such a call does not start (budget_exhausted), no attempt is spent, the task continues on the base model'
  rules: [GW-2, MGR-18]
- id: sm-grt-11
  from: approved
  to: consumed
  by: the core
  when: 'the grant attempts ran out, the task finished, or the rest of cap_eur does not hold the reserve of the next call:
    such a call does not start (budget_exhausted), no attempt is spent, the task continues on the base model'
  rules: [GW-2, MGR-18]
- id: sm-grt-12
  from: approved
  to: expired
  by: the grant loop
  when: expires_at has come; P4 no longer allows the granted slot, the running attempt finishes without spending, the task
    continues on the base model
  rules: [MGR-18]
- id: sm-grt-13
  from: active
  to: expired
  by: the grant loop
  when: expires_at has come; P4 no longer allows the granted slot, the running attempt finishes without spending, the task
    continues on the base model
  rules: [MGR-18]
- id: sm-grt-14
  from: approved
  to: revoked
  by: P2 model_grant.revoke by a person with model_grant.manage
  when: the running attempt is canceled with the reason grant_revoked without spending, the task continues on the base model
  rules: [MGR-18]
- id: sm-grt-15
  from: active
  to: revoked
  by: P2 model_grant.revoke by a person with model_grant.manage
  when: the running attempt is canceled with the reason grant_revoked without spending, the task continues on the base model
  rules: [MGR-18]
