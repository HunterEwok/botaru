# Collected from spec/lifecycles/campaign.yaml. The value null in from means "the object does not exist yet".
lifecycle: spec/lifecycles/campaign.yaml
object: campaign
rules:
- APR-2
- APR-4
- APR-6
- APR-7
- APR-9
- FEN-3
- HLD-3
- ORC-1
- ORC-11
- ORC-12
- ORC-14
- ORC-2
- ORC-3
- ORC-4
- ORC-5
- ORC-6
- ORC-8
- ORC-9
- PRM-3
- PRM-8
- SCR-7
- SCR-8
description: Allowed and forbidden transitions of the "campaign and campaign item" lifecycle, collected from the tables
  of spec/lifecycles/campaign.md. The implementation accepts a transition from the allowed list under the condition of its
  row (when); a pair from the forbidden list does not change the state, and the call that asks for it is rejected. The value
  null in from means "the object does not exist yet". The plan is frozen; an item is executed at most once, a terminal item
  does not return to pending and is not released again (ORC-1, ORC-3). The "Resume" button does not lift the estimate_exceeded
  pause (ORC-8).
machines:
- name: Campaign
  states:
  - id: proposed
    terminal: false
  - id: running
    terminal: false
  - id: paused
    terminal: false
  - id: stopping
    terminal: false
  - id: completed
    terminal: true
  - id: failed
    terminal: true
  - id: canceled
    terminal: true
  - id: rejected
    terminal: true
  allowed:
  - id: sm-cmp-01
    from: null
    to: proposed
    by: P3 propose_campaign; P1 campaign.propose with an attempt token
    when: a live attempt; a role with campaigns.propose of the needed kind; the rights of every item on behalf of every
      initiator; policy and size no wider than the ceilings; the ceiling under distrust or with the initiator system; the
      tree size and the whole price estimate fit into the reserve; a campaign with an action has no hold in its scope (ORC-11);
      a card is needed (a campaign with an action, a read campaign above confirm_read_over, or a read campaign that only
      lacks the human initiator's daily limit); the core creates an approval with the subject campaign
    rules:
    - APR-2
    - ORC-1
    - ORC-14
    - ORC-2
    - ORC-5
    - ORC-6
    - ORC-8
  - id: sm-cmp-02
    from: null
    to: rejected
    by: P3 propose_campaign; P1 campaign.propose
    when: 'the first failed check: campaign_policy_exceeded, campaign_untrusted_limit, no_group_cap, tree_too_large, budget_exhausted,
      held (a campaign with an action in the scope of a hold), fenced; the same key with a different plan gives idempotency_conflict;
      the model gets a short "no"'
    rules:
    - ORC-1
    - ORC-14
    - ORC-5
    - ORC-6
    - ORC-8
    - PRM-8
  - id: sm-cmp-03
    from: null
    to: proposed
    by: the "Retry failed" button (P1 campaign.control with retry_failed, P2 campaign.retry_failed)
    when: a human initiator pressed it; the original campaign is terminal; a new campaign from its failed, unknown and skipped
      items with the same template, a policy no wider, the original's untrusted_seen and a refs link, without then; a campaign
      with an action always gets a new approval
    rules:
    - ORC-1
    - ORC-2
  - id: sm-cmp-04
    from: null
    to: proposed
    by: release of a fanout step of a script run (the core loop script)
    when: a person approved the run; the list is a subset of the list frozen at approval; a campaign with an action gets
      its own approval; the reserve is taken from the run's reserve; there is no then
    rules:
    - ORC-1
    - ORC-8
    - SCR-7
    - SCR-8
  - id: sm-cmp-05
    from: proposed
    to: running
    by: the core in the same creation transaction
    when: 'no card is needed: a read campaign below confirm_read_over whose estimate also fits into the initiator''s daily
      limit (under distrust or with the initiator system, at most 10 items as an explicit list), or a read campaign of a
      fanout step; no hold covers the scope; the first items are released'
    rules:
    - ORC-14
    - ORC-2
    - ORC-4
  - id: sm-cmp-06
    from: proposed
    to: running
    by: the "Approve" button (P1 decide with the subject campaign)
    when: a human principal from the card's chat with its nonce, the right action.approve:<a> (for a read campaign task:<type>),
      the self_approve rule, and for a production tenant the person who pressed is not the initiator; the initiator is active
      and has the rights; in the same transaction the approval goes to executing and the canary is released
    rules:
    - APR-4
    - APR-9
    - ORC-2
    - ORC-3
  - id: sm-cmp-07
    from: proposed
    to: paused
    by: the core in the same creation transaction; the "Approve" button
    when: no card is needed or a person approved, but the campaign scope is covered by a hold with an effect that forbids
      release or execution; items are not released; for a campaign with an action the approval is executing
    rules:
    - ORC-11
  - id: sm-cmp-08
    from: proposed
    to: rejected
    by: the "Reject" button (P1 decide); the background loop approval-expiry; P2 hold.set with no_action; cancellation of
      the approval together with its reason
    when: the approval moved to rejected, expired or canceled; the reserve is released, no items were released
    rules:
    - APR-6
    - HLD-3
    - ORC-11
    - ORC-2
  - id: sm-cmp-09
    from: running
    to: paused
    by: the core in the transaction that closes the last canary item
    when: 'all canary items are ok, after_canary: manual; with after_canary: auto there is no pause, the campaign loop waits
      out bake'
    rules:
    - ORC-4
  - id: sm-cmp-10
    from: running
    to: paused
    by: the core in the transaction where an item became unknown
    when: 'on_unknown: pause'
    rules:
    - ORC-4
  - id: sm-cmp-11
    from: running
    to: paused
    by: the "Pause" button (P1 campaign.control); P2 campaign.control
    when: the human initiator, a person with the right to approve, or the tenant admin (admin:people)
    rules:
    - ORC-4
  - id: sm-cmp-12
    from: running
    to: paused
    by: P2 hold.set and core auto-stops
    when: the hold scope covers the campaign or its items, effect no_enqueue, no_claim, no_action or cancel_running; the
      same transaction as the hold record
    rules:
    - HLD-3
    - ORC-11
  - id: sm-cmp-13
    from: running
    to: paused
    by: the background loop campaign
    when: no live executor of its type takes a released item for longer than start_by
    rules:
    - ORC-4
  - id: sm-cmp-14
    from: running
    to: paused
    by: the core at release
    when: the next item does not fit into the rest of the campaign reserve
    rules:
    - ORC-8
  - id: sm-cmp-15
    from: paused
    to: running
    by: the "Resume" button (P1 campaign.control with resume)
    when: 'a human principal from the card''s chat with its nonce, the right to approve, not the initiator when self_approve:
      false and for a production tenant; the initiator is active and has the rights; reason gate, unknown, human or no_executor;
      reason held only when no hold covers the campaign any more; reason estimate_exceeded is never lifted'
    rules:
    - APR-4
    - APR-9
    - ORC-11
    - ORC-2
    - ORC-8
  - id: sm-cmp-16
    from: running
    to: stopping
    by: the core in the transaction that closes an item
    when: the number of failed items exceeded the threshold (threshold_exceeded) or a canary item failed
    rules:
    - ORC-4
  - id: sm-cmp-17
    from: paused
    to: stopping
    by: the core in the transaction that closes an item
    when: the number of failed items exceeded the threshold (threshold_exceeded) or a canary item failed
    rules:
    - ORC-4
  - id: sm-cmp-18
    from: running
    to: stopping
    by: the background loop campaign
    when: the deadline passed (deadline_exceeded)
    rules:
    - ORC-4
  - id: sm-cmp-19
    from: paused
    to: stopping
    by: the background loop campaign
    when: the deadline passed (deadline_exceeded)
    rules:
    - ORC-4
  - id: sm-cmp-20
    from: running
    to: stopping
    by: the "Cancel" button (P1 campaign.control with cancel); P2 campaign.control
    when: the human initiator, a person with the right to approve, or the tenant admin (admin:people); reason initiator
      if the initiator canceled, and admin if a person with the right to approve or the tenant admin did
    rules:
    - ORC-4
  - id: sm-cmp-21
    from: paused
    to: stopping
    by: the "Cancel" button (P1 campaign.control with cancel); P2 campaign.control
    when: the human initiator, a person with the right to approve, or the tenant admin (admin:people); reason initiator
      if the initiator canceled, and admin if a person with the right to approve or the tenant admin did
    rules:
    - ORC-4
  - id: sm-cmp-22
    from: running
    to: stopping
    by: cancellation of the tree root; rights recheck at release
    when: the root is canceled; the initiator lost the right (rights_revoked) or is disabled (person_inactive)
    rules:
    - ORC-6
    - PRM-3
  - id: sm-cmp-23
    from: paused
    to: stopping
    by: cancellation of the tree root; rights recheck at release
    when: the root is canceled; the initiator lost the right (rights_revoked) or is disabled (person_inactive)
    rules:
    - ORC-6
    - PRM-3
  - id: sm-cmp-24
    from: stopping
    to: failed
    by: the core in the transaction where the last released item became terminal, or at once if none were released
    when: stop reason threshold_exceeded or deadline_exceeded; the core raises alarm.campaign.threshold on the threshold
    rules:
    - ORC-4
  - id: sm-cmp-25
    from: stopping
    to: canceled
    by: same
    when: stop reason initiator or admin, cancellation of the root, rights_revoked or person_inactive
    rules:
    - ORC-4
    - ORC-6
  - id: sm-cmp-26
    from: running
    to: completed
    by: the core in the transaction where the last item became terminal
    when: all items are terminal, failed items do not exceed the threshold
    rules:
    - ORC-4
  - id: sm-cmp-27
    from: paused
    to: completed
    by: the core in the transaction where the last item became terminal
    when: all items are terminal, failed items do not exceed the threshold
    rules:
    - ORC-4
