- name: Item
  states:
  - id: pending
    terminal: false
  - id: released
    terminal: false
  - id: ok
    terminal: true
  - id: failed
    terminal: true
  - id: unknown
    terminal: true
  - id: skipped
    terminal: true
  - id: canceled
    terminal: true
  allowed:
  - id: sm-cmi-01
    from: null
    to: pending
    by: C1 campaign.create
    when: all items of the plan are created together with the campaign
    rules:
    - ORC-1
  - id: sm-cmi-02
    from: pending
    to: released
    by: the core in the transaction that closes the previous item or in the approval transaction; the background loop campaign
      (bake)
    when: 'the campaign is running; there is no hold in its scope; fewer than max_in_flight are released and not finished;
      the resource is free with exclusive: resource; the tenant''s queue of the item type is not longer than queue_max;
      every initiator has the rights; the item fits into the rest of the reserve; from v0.2 the pace rate_per_min is not
      exceeded and the wave is open. In the same transaction, the item''s task with the key system:campaign:<campaign>:<n>,
      and for an action also one write call from the snapshot'
    rules:
    - ORC-11
    - ORC-12
    - ORC-3
    - ORC-4
    - ORC-6
    - ORC-8
  - id: sm-cmi-03
    from: pending
    to: skipped
    by: the "Exclude item" button (P1 campaign.control with skip); the campaign's transition to stopping
    when: the button was pressed by a human principal from the card's chat with the right to approve, not the initiator
      for a production tenant; with stopping, all unreleased items at once
    rules:
    - APR-9
    - ORC-1
    - ORC-2
    - ORC-4
  - id: sm-cmi-04
    from: released
    to: ok
    by: C1 campaign.item_close in the transaction of the terminal transition of the item's task
    when: the task is completed (for an action, the write call is executed); the summary_fields fields are copied into the
      item record
    rules:
    - ORC-4
    - ORC-9
  - id: sm-cmi-05
    from: released
    to: failed
    by: same
    when: the task failed after its attempts (for an action, the write call is exec_failed)
    rules:
    - FEN-3
