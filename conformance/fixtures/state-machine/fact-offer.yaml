# Collected from spec/lifecycles/fact-offer.yaml. The value null in from means "the object does not exist yet".
lifecycle: spec/lifecycles/fact-offer.yaml
object: fact-offer
rules: [IDN-11, MEM-7, MEM-9]
description: 'Allowed and forbidden transitions of the "fact offer" lifecycle, collected from the tables of spec/lifecycles/fact-offer.md.
  The implementation accepts a transition from the allowed list under the condition of its row (when); a pair from the forbidden
  list does not change the state, and the call that asks for it is rejected. The value null in from means "the object does
  not exist yet". The offer and recipient machines were collected by hand from the table of spec/lifecycles/fact-offer.md:
  in spec/lifecycles/fact-offer.yaml both machines got the same list of transitions, and the row "(none), recipient waiting"
  lost its start (none).'
machines:
- name: Offer
  states:
  - id: open
    terminal: false
  - id: closed
    terminal: true
  allowed:
  - id: sm-fo-01
    from: null
    to: open
    by: the core in the transaction of an identity's retirement or of a change of its binding
    when: there are active facts; each one is rechecked; at most offer.max (100)
    rules: [IDN-11, MEM-7]
  - id: sm-fo-02
    from: open
    to: closed
    by: the core or the identity loop
    when: the recipient is in a terminal state or open_until has passed; the facts of the retiring identity are erased together
      with the seal
    rules: [MEM-7, MEM-9]
  forbidden:
  - id: sm-fo-x01
    from: null
    to: closed
    expect: rejected
    rules: [IDN-11, MEM-7]
    why: the object does not appear directly in the state closed
  - id: sm-fo-x02
    from: open
    to: open
    expect: rejected
    rules: [IDN-11, MEM-7, MEM-9]
    why: the lifecycle table has no such transition
  - id: sm-fo-x03
    from: closed
    to: open
    expect: rejected
    rules: [MEM-7, MEM-9]
    why: 'closed is a terminal state: there are no transitions out of it'
  - id: sm-fo-x04
    from: closed
    to: closed
    expect: rejected
    rules: [MEM-7, MEM-9]
    why: 'closed is a terminal state: there are no transitions out of it'
- name: Recipient inside the offer
  states:
  - id: waiting
    terminal: false
  - id: copied
    terminal: true
  - id: expired
    terminal: true
  allowed:
  - id: sm-for-01
    from: null
    to: waiting
    to_note: recipient waiting
    by: the core
    when: 'the successor under MEM-7 does not exist yet'
    rules: [MEM-7]
  - id: sm-for-02
    from: null
    to: copied
    to_note: recipient copied
    by: the core, in the transaction where the successor exists
    when: 'the successor exists; each copied fact passed the recheck with the successor''s permissions and fits the free room of its space'
    rules: [MEM-7]
  - id: sm-for-03
    from: waiting
    to: copied
    to_note: recipient copied
    by: the core, in the transaction where the successor appears
    when: 'the successor appeared before open_until; each copied fact passed the recheck with the successor''s permissions and fits the free room of its space'
    rules: [MEM-7]
  - id: sm-for-04
    from: waiting
    to: expired
    to_note: recipient expired
    by: the identity loop
    when: 'open_until passed without a successor'
    rules: [MEM-7]
  forbidden:
  - id: sm-for-x01
    from: null
    to: expired
    expect: rejected
    rules: [MEM-7]
    why: the object does not appear directly in the state expired
  - id: sm-for-x02
    from: waiting
    to: waiting
    expect: rejected
    rules: [MEM-7]
    why: the lifecycle table has no such transition
  - id: sm-for-x03
    from: copied
    to: waiting
    expect: rejected
    rules: [MEM-7]
    why: 'copied is a terminal state: there are no transitions out of it'
  - id: sm-for-x04
    from: copied
    to: copied
    expect: rejected
    rules: [MEM-7]
    why: 'copied is a terminal state: there are no transitions out of it'
  - id: sm-for-x05
    from: copied
    to: expired
    expect: rejected
    rules: [MEM-7]
    why: 'copied is a terminal state: there are no transitions out of it'
  - id: sm-for-x06
    from: expired
    to: waiting
    expect: rejected
    rules: [MEM-7]
    why: 'expired is a terminal state: there are no transitions out of it'
  - id: sm-for-x07
    from: expired
    to: copied
    expect: rejected
    rules: [MEM-7]
    why: 'expired is a terminal state: there are no transitions out of it'
  - id: sm-for-x08
    from: expired
    to: expired
    expect: rejected
    rules: [MEM-7]
    why: 'expired is a terminal state: there are no transitions out of it'
