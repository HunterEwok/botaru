# Collected from spec/lifecycles/lease.yaml. The value null in from means "the object does not exist yet".
lifecycle: spec/lifecycles/lease.yaml
object: lease
rules: [APR-7, DLV-1, DLV-11, DLV-6, DSP-1, FEN-1, FEN-2, FEN-3, FEN-4, FEN-5, GW-13, HLD-1, HLD-3, IDM-3, IDN-10,
  IDN-4, LCY-4, MGR-1, MGR-11, OBS-8, PRM-3, RET-6, SEC-3, TEN-3, TEN-3a, TIM-1]
description: Allowed and forbidden transitions of the "lease" lifecycle, collected from the tables of spec/lifecycles/lease.md.
  The implementation accepts a transition from the allowed list under the condition of its row; a pair from the forbidden
  list does not change the state, and the call that asks for it is rejected. The without_transition rows are calls that
  have no transition by the table. A changing call on a lease that is not active gets fenced without writes (FEN-2).
states:
- id: active
  terminal: false
- id: closed
  terminal: true
- id: released
  terminal: true
- id: expired
  terminal: true
- id: revoked
  terminal: true
- id: preempted
  terminal: true
allowed:
- from: null
  to: active
  by: P1 `claim` with the kinds `attempt`, `toolcall` or `delivery`
  rules: [DLV-6, DSP-1, FEN-1, HLD-1, TEN-3, TEN-3a, TIM-1]
- from: active
  to: active
  by: P1 `heartbeat` with the current token
  rules: [DLV-11, FEN-2, FEN-3]
- from: active
  to: active
  by: C1 `lease.extend` when the core leaves `not_ready`
  rules: [FEN-5, OBS-8]
- from: active
  to: closed
  by: P1 `complete` or P1 `fail` with the current token
  rules: [FEN-2, IDM-3]
- from: active
  to: released
  by: P1 `release`
  rules: [FEN-2]
- from: active
  to: expired
  by: the `reaper` loop
  rules: [APR-7, DLV-1, FEN-1, FEN-3]
- from: active
  to: expired
  by: the `reaper` loop after a downtime window
  rules: [FEN-1, FEN-5, GW-13]
- from: active
  to: revoked
  by: P1 `cancel`; P2 `task.cancel`; cancellation of the parent
  rules: [FEN-4]
- from: active
  to: revoked
  by: P2 `worker.revoke`
  rules: [FEN-2, IDN-4]
- from: active
  to: revoked
  by: 'the core in the transaction of the cause: P2 `principal.off`, P2 `ungrant`'
  rules: [PRM-3]
- from: active
  to: revoked
  by: P2 `hold.set` with the effect `cancel_running`
  rules: [HLD-3]
- from: active
  to: revoked
  by: P2 `seat.assign`, P2 `seat.vacate`, a seat hold
  rules: [IDN-10, MGR-1]
- from: active
  to: revoked
  by: C1 `epoch.advance` on restore from backup
  rules: [RET-6, SEC-3]
- from: active
  to: preempted
  by: the control operation `preempt`
  rules: [MGR-11]
- from: active
  to: released
  by: the `drain_deadline` of a worker in `draining`
  rules: [LCY-4]
