- name: Step
  states:
  - id: pending
    terminal: false
  - id: waiting
    terminal: false
  - id: released
    terminal: false
  - id: ok
    terminal: true
  - id: failed
    terminal: true
  - id: unknown
    terminal: true
  - id: declined
    terminal: true
  - id: skipped
    terminal: true
  - id: canceled
    terminal: true
  allowed:
  - id: sm-scs-01
    from: null
    to: pending
    by: C1 script.create together with the run
    when: all steps of the draft
    rules:
    - SCR-5
  - id: sm-scs-02
    from: pending
    to: skipped
    by: the core in the transaction that closes a predecessor; the script loop
    when: 'all steps from needs are terminal, but when is false or run_if is not met; or a failure with on_failure: stop
      stopped the release, and the step has run_if: succeeded'
    rules:
    - SCR-11
    - SCR-3
  - id: sm-scs-03
    from: pending
    to: released
    by: C1 script.release_step in the transaction that closes a predecessor; the script loop for steps without predecessors
    when: the run is in running; needs are terminal, run_if and when are met; the initiator's rights are rechecked; a task
      with the key system:script:<run>:<step> (task) or a campaign (fanout without an action) is created; for wait and await
      (v0.2) a waiting record is created
    rules:
    - SCR-8
    - SCR-9
  - id: sm-scs-04
    from: pending
    to: waiting
    by: same
    when: 'same, but of kind action, confirm or fanout with an action: an approval with an exact snapshot is created (subject
      approval, script_gate or a campaign approval); an action step with risk: routine without untrusted text creates no
      approval and goes directly to released by a service_grant record authored by the initiator (D-78)'
    rules:
    - SCR-7
    - SCR-8
  - id: sm-scs-05
    from: pending
    to: failed
    by: same
    when: the initiator's rights at release did not pass (rights_revoked, no_group_cap); in v0.1 a hold rejected the enqueue
      (held)
    rules:
    - SCR-8
  - id: sm-scs-06
    from: waiting
    to: released
    by: P1 decide "Approve" on an action or a campaign
    when: a person with action.approve:<a> decided by the approval rules; the core enqueues action.<a> tasks
    rules:
    - SCR-7
  - id: sm-scs-07
    from: waiting
    to: ok
    by: P1 decide "Continue" on script_gate
    when: a person decided by the step's who
    rules:
    - SCR-7
  - id: sm-scs-08
    from: waiting
    to: declined
    by: P1 decide "Reject" or "Stop"; the decision deadline (expired)
    rules:
    - SCR-11
  - id: sm-scs-09
    from: waiting
    to: failed
    by: a hold with the effect no_action on the step's scope
    when: the step's pending approval moved to canceled(held) (HLD-3); the step is failed(held)
    rules:
    - SCR-11
  - id: sm-scs-10
    from: released
    to: ok
    by: the core at the end of a task, a campaign or an action; for wait the deadline came, for await the event arrived
      (v0.2)
    when: the task is completed, the campaign ended successfully, the action is executed
    rules:
    - SCR-8
  - id: sm-scs-11
    from: released
    to: failed
    by: same; for await the timeout expired (v0.2)
    when: the task failed, the campaign failed, the action failed
    rules:
    - SCR-11
  - id: sm-scs-12
    from: released
    to: unknown
    by: the core by the outcome of the action
    when: the outcome of the write call is unknown (exec_unknown)
    rules:
    - SCR-11
  - id: sm-scs-13
    from: pending
    to: canceled
    by: cancellation of the run or expiry of its deadline
    when: the pending approval is canceled, the released task or campaign gets a cancellation
    rules:
    - SCR-11
  - id: sm-scs-14
