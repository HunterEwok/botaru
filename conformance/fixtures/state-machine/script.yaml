# Collected from spec/lifecycles/script.yaml. The value null in from means "the object does not exist yet".
lifecycle: spec/lifecycles/script.yaml
object: script
rules:
- SCR-10
- SCR-11
- SCR-3
- SCR-5
- SCR-6
- SCR-7
- SCR-8
- SCR-9
- TRN-4
description: Allowed and forbidden transitions of the "script run and its steps" lifecycle, collected from the tables of
  spec/lifecycles/script.md. The implementation accepts a transition from the allowed list under the condition of its row
  (when); a pair from the forbidden list does not change the state, and the call that asks for it is rejected. The value
  null in from means "the object does not exist yet". After a terminal state of the run no step is released; the "Run" button
  does not approve actions (SCR-7, SCR-11).
machines:
- name: Run
  states:
  - id: proposed
    terminal: false
  - id: running
    terminal: false
  - id: paused
    terminal: false
  - id: completed
    terminal: true
  - id: failed
    terminal: true
  - id: canceled
    terminal: true
  - id: rejected
    terminal: true
  allowed:
  - id: sm-scr-01
    from: null
    to: proposed
    by: P3 propose_script of a translator attempt; the "Accept" button on a proposal with a script change (P1 decide, subject
      proposal)
    when: all acceptance checks passed; the record, the steps in pending, the script.drafted event and the script_confirm
      delivery are created
    rules:
    - SCR-5
    - SCR-6
  - id: sm-scr-02
    from: null
    to: rejected
    by: the same calls
    when: 'a check did not pass: script_invalid, script_ref_unknown, no_role_cap, no_group_cap and other rights reasons,
      script_too_large, script_untrusted_limit; there is no record, the key is not taken, the refusal is written to the
      audit'
    rules:
    - SCR-5
    - TRN-4
  - id: sm-scr-03
    from: proposed
    to: running
    by: the "Run" button (P1 decide, subject script)
    when: 'the initiator pressed it themselves: a human principal, with script.run if the script has actions, confirm or
      service control (SCR-6), the card''s channel, a valid nonce, once; the deadline has not expired; plan_hash matched;
      there is no hold on the scope; the budget reserve and the tree size reserve are taken in full. The event script.started'
    rules:
    - SCR-6
    - SCR-8
  - id: sm-scr-04
    from: proposed
    to: rejected
    by: the "Cancel" button (declined); the script loop at the decision deadline (expired); the initiator is disabled (person_inactive);
      a new draft in the same conversation (script_superseded); the reserve did not fit at the press (budget_exhausted)
    when: code updates the card; no reserve is taken
    rules:
    - SCR-11
    - SCR-6
  - id: sm-scr-05
    from: running
    to: paused
    by: P1 script.control with pause from the channel by the initiator's button; from v0.2 a hold whose scope touches the
      run (held)
    when: new steps are not released; released work continues unless the hold itself stopped it
    rules:
    - SCR-10
    - SCR-11
  - id: sm-scr-06
    from: paused
    to: running
    by: P1 script.control with resume from the channel by the initiator's button
    when: there is no hold on the scope, the deadline has not expired, the initiator is active
    rules:
    - SCR-10
    - SCR-11
  - id: sm-scr-07
    from: running
    to: completed
    by: the core when closing the last step (C1 script.step_close)
    when: 'all steps are terminal, no failure with on_failure: stop happened; the script_summary delivery'
    rules:
    - SCR-11
  - id: sm-scr-08
    from: paused
    to: completed
    by: the core when closing the last step (C1 script.step_close)
    when: 'all steps are terminal, no failure with on_failure: stop happened; the script_summary delivery'
    rules:
    - SCR-11
  - id: sm-scr-09
    from: running
    to: failed
    by: the core when closing the last step
    when: 'all steps are terminal and a failure with on_failure: stop happened; the script_summary delivery'
    rules:
    - SCR-11
  - id: sm-scr-10
    from: paused
    to: failed
    by: the core when closing the last step
    when: 'all steps are terminal and a failure with on_failure: stop happened; the script_summary delivery'
    rules:
    - SCR-11
  - id: sm-scr-11
    from: running
    to: failed
    by: the script loop at the run's deadline (deadline_exceeded)
    when: 'the deadline expired: unreleased steps are canceled, pending approvals are canceled, released ones get a cancellation'
    rules:
    - SCR-11
  - id: sm-scr-12
    from: running
    to: canceled
    by: P1 script.control with cancel from the channel by the initiator's button; P2 script.cancel (the initiator or a person
      with admin:people); cancellation of the anchor task; the initiator is disabled (person_inactive)
    when: in the same transaction unreleased steps are canceled, pending step approvals are canceled, the tasks and campaigns
      of released steps get a cancellation
    rules:
    - SCR-11
  - id: sm-scr-13
    from: paused
    to: canceled
    by: the same calls as for running; the script loop at the run's deadline
    when: same
    rules:
    - SCR-10
    - SCR-11
