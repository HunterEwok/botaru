  expect: rejected
  rules: *id003
  why: withheld is a terminal state
- from: withheld
  to: sending
  expect: rejected
  rules: *id003
  why: withheld is a terminal state
- from: withheld
  to: delivered
  expect: rejected
  rules: *id003
  why: withheld is a terminal state
- from: withheld
  to: withheld
  expect: rejected
  rules: *id003
  why: withheld is a terminal state
- from: withheld
  to: dead
  expect: rejected
  rules: *id003
  why: withheld is a terminal state
- from: dead
  to: planned
  expect: rejected
  rules: *id003
  why: dead is a terminal state
- from: dead
  to: sending
  expect: rejected
  rules: *id003
  why: dead is a terminal state
- from: dead
  to: delivered
  expect: rejected
  rules: *id003
  why: dead is a terminal state
- from: dead
