without_transition:
- from: dead
  to: null
  by: P2 `delivery.redrive`
  when: a new delivery is created with a link to the dead one; ceilings and rights are checked again
  expect: no_transition
  rules: [DLV-4]
expect:
  allowed: 13
  forbidden: 20
