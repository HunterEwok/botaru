# Lint of secrets in the deployment description (SEC-2, SEC-5).
id: fx-canaries-secrets-lint
rules: [SEC-2, SEC-5]
description: Each process gets only its own secrets, as files; every secret has a rotation method; everything the core issues
  carries a key id.
cases:
- id: sec-2-01
  rules: [SEC-2]
  steps:
  - lint:
      deploy_yaml:
        process: toolhost-read-web1
        secrets: [provider-a]
  expect: {result: rejected, stage: lint, note: the secret is not named in the manifest of this process}
- id: sec-2-02
  rules: [SEC-2]
  steps:
  - lint:
      deploy_yaml:
        process: channel-telegram
        env: {BOT_TOKEN: 'secret:telegram-bot'}
  expect: {result: rejected, stage: lint, note: 'a secret as an environment variable, not as a file'}
- id: sec-2-03
  rules: [SEC-2]
  steps:
  - lint:
      deploy_yaml:
        process: channel-telegram
        secret_files:
        - {name: telegram-bot, volume: shared-config}
  expect: {result: rejected, stage: lint, note: the volume is visible to another process}
- id: sec-2-04
  rules: [SEC-2]
  steps:
  - lint:
      deploy_yaml:
        process: channel-telegram
        secret_files:
        - {name: telegram-bot, path: /run/secrets/telegram-bot}
  expect: {result: ok}
- id: sec-5-01
  rules: [SEC-5]
  steps:
  - lint:
      deploy_yaml:
        secrets:
        - {name: telegram-bot}
  expect: {result: rejected, stage: lint, note: no rotation method overlap or cutover}
- id: sec-5-02
  rules: [SEC-5]
  steps:
  - lint:
      deploy_yaml:
        secrets:
        - name: telegram-bot
          rotation: {mode: overlap, window: 24h}
  expect: {result: ok}
- id: sec-5-03
  rules: [SEC-5]
  steps:
  - lint:
      deploy_yaml:
        secrets:
        - name: health
          rotation: {mode: cutover}
  expect: {result: ok}
- id: sec-5-04
  rules: [SEC-5]
  given:
    issued: [worker_token, program_key, handle, address_signature, nonce]
  expect: {each_has: key_id}
- id: sec-5-05
  rules: [SEC-5]
  given:
    rotation: {name: worker-token-key, mode: overlap}
    during_window: true
  expect: {old_key: accepted, new_key: accepted}
