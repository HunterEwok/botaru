# Secret canaries (SEC-1, INJ-4, INJ-11). Each trap string is unique; finding it where it does not
# belong means a leak. Where the canary lies and where it must not be.
id: fx-canaries-secrets
rules: [SEC-1, INJ-4, INJ-11]
description: Secret values do not pass through P1-P4 and do not get into the model context, the sandbox, the audit, events,
  logs and the result. A toolhost redacts secrets of known formats before they leave the machine, the core searches for them once more, and the channel
  before sending.
cases:
- id: can-sec-01
  rules: [SEC-1]
  given:
    canary:
      value: CANARY-NOT-A-SECRET-provider-key
      planted_in: {secret_file: /run/secrets/provider-a, process: model-gateway}
  expect:
    not_in: [p1, p2, p3, p4, model_context, audit, events, task_journal, results, telemetry]
- id: can-sec-02
  rules: [SEC-1, INJ-4]
  given:
    canary:
      value: CANARY-NOT-A-SECRET-log-key-0001
      planted_in: {log_line: 'web1 nginx: key=CANARY-NOT-A-SECRET-log-key-0001', tool: logs/tail}
  expect: {tool_output_contains: false, masked_as: <secret>, untrusted_seen: true}
- id: can-sec-03
  rules: [INJ-4]
  given:
    canary:
      value: 203.0.113.7
      planted_in: {log_line: 'GET /?u=203.0.113.7 HTTP/1.1'}
  expect: {tool_output: 'GET /?u=203.0.113.0/24 HTTP/1.1'}
- id: can-sec-04
  rules: [INJ-4]
  given:
    canary:
      value: carol@example.org
      planted_in: {log_line: mail to carol@example.org failed}
  expect: {tool_output_contains: false, masked_as: <email>}
- id: can-sec-05
  rules: [INJ-11, SEC-1]
  given:
    canary:
      value: CANARY-NOT-A-SECRET-outbound
      planted_in: {model_reply: 'key: CANARY-NOT-A-SECRET-outbound'}
  expect: {sent: false, admins_event: secret_in_outbound, event_contains_value: false}
- id: can-sec-06
  rules: [SEC-1]
  given:
    canary: {schemas: spec/model/*.schema.json}
  expect: {no_field_for_secret_value: true, note: no port schema has a field for a secret value}
- id: can-sec-07
  rules: [INJ-4]
  description: IPv6 is redacted to the /48 prefix (docs/security-model.md, redaction table).
  given:
    canary:
      value: 2001:db8:12:34::5
      planted_in: {log_line: 'connect from 2001:db8:12:34::5 port 443', tool: logs/tail}
  expect: {tool_output: 'connect from 2001:db8:12::/48 port 443'}
- id: can-sec-08
  rules: [INJ-4]
  description: An IP inside a URL and in the X-Forwarded-For header is redacted the same way as a standalone address.
  given:
    canary:
      value: 198.51.100.23
      planted_in:
        log_line: 'GET http://198.51.100.23:8080/health X-Forwarded-For: 198.51.100.23, 203.0.113.9'
        tool: logs/tail
  expect:
    tool_output: 'GET http://198.51.100.0/24:8080/health X-Forwarded-For: 198.51.100.0/24, 203.0.113.0/24'
    tool_output_contains: false
- id: can-sec-09
  rules: [INJ-4, SEC-1]
  description: The value after password= is redacted whole, not by the CANARY prefix.
  given:
    canary:
      value: CANARY-NOT-A-SECRET-pw-0009
      planted_in: {log_line: 'db1 backup: login user=backup password=CANARY-NOT-A-SECRET-pw-0009', tool: logs/tail}
  expect: {tool_output_contains: false, masked_as: <secret>, untrusted_seen: true}
- id: can-sec-10
  rules: [INJ-4, SEC-1]
  description: The value of the Authorization header is redacted whole together with the scheme.
  given:
    canary:
      value: CANARY-NOT-A-SECRET-auth-0010
      planted_in: {log_line: 'web1 app-api: Authorization: Bearer CANARY-NOT-A-SECRET-auth-0010', tool: logs/tail}
  expect: {tool_output_contains: false, masked_as: <secret>}
- id: can-sec-11
  rules: [INJ-4, SEC-1]
  description: >-
    A private key block is redacted whole. The block lines are given in parts (parts), and the runner joins them
    without a separator: this way the fake key does not get into the repository as a whole string.
  given:
    canary:
      parts: ['-----BEGIN ', 'PRIVATE KEY-----', "\nCANARY-NOT-A-SECRET-key-0011\n", '-----END ', 'PRIVATE KEY-----']
      planted_in: {file: /srv/app/conf/key.pem, tool: logs/tail}
  expect: {tool_output_contains: false, masked_as: <secret>, block_masked_whole: true}
- id: can-sec-12
  rules: [INJ-4, SEC-1]
  description: >-
    A token of a known format is redacted by its format, not by the CANARY marker. The value is given in parts (parts),
    and the runner joins them without a separator.
  given:
    canary:
      parts: ['ghp', '_', 'CANARYNOTASECRET0012abcdefghij0123456789']
      planted_in: {log_line: 'ci runner: using token <canary>', tool: logs/tail}
  expect: {tool_output_contains: false, masked_as: <secret>}
