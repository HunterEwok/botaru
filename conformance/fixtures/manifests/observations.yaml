id: fx-man-obs-01
rules: [OBV-2, OBV-4, OBV-6, OBV-7]
description: >-
  Observation series checks: a tool source names the tool and its field, a job source its
  field of run.finished.v1 (OBV-2, OBV-7); the data class is not below the output_class of the
  source tool (OBV-2); rollups and outcome.compare come from spec/model/rollups.yaml (OBV-4); a
  trial guard of the tenant names only a series with a complete outcome block (OBV-6).
with_examples: true
cases:
  - name: series from a tool field
    manifests:
      - apiVersion: botaru/v1alpha1
        kind: ObservationSeries
        metadata: {name: host.load.v1, tenant: demo}
        spec:
          catalog_kind: host
          value: {type: number, minimum: 0, maximum: 10000}
          data_class: internal
          source: {kind: tool, tool: monitor/item_history, field: cpu_load}
          rollups: [hour.max, hour.mean, day.p95]
          outcome: {compare: day.p95, better: down, tolerance_pct: 10, min_samples: 10}
    expect: ok
  - name: data class below the source tool
    manifests:
      - apiVersion: botaru/v1alpha1
        kind: ObservationSeries
        metadata: {name: host.load.v1, tenant: demo}
        spec:
          catalog_kind: host
          value: {type: number, minimum: 0, maximum: 10000}
          data_class: summary
          source: {kind: tool, tool: monitor/item_history, field: cpu_load}
    expect: {error: series_class_below_source}
  - name: data class that is not in the closed list
    manifests:
      - apiVersion: botaru/v1alpha1
        kind: ObservationSeries
        metadata: {name: host.load.v1, tenant: demo}
        spec:
          catalog_kind: host
          value: {type: number, minimum: 0, maximum: 10000}
          data_class: public
          source: {kind: job, field: duration_s}
    expect: {error: cap_data_class}
  - name: rollup outside the closed list
    manifests:
      - apiVersion: botaru/v1alpha1
        kind: ObservationSeries
        metadata: {name: host.load.v1, tenant: demo}
        spec:
          catalog_kind: host
          value: {type: number, minimum: 0, maximum: 10000}
          data_class: internal
          source: {kind: tool, tool: monitor/item_history, field: cpu_load}
          rollups: [hour.max, minute.median]
    expect: {error: rollup_unknown}
  - name: tool source without a field
    manifests:
      - apiVersion: botaru/v1alpha1
        kind: ObservationSeries
        metadata: {name: host.load.v1, tenant: demo}
        spec:
          catalog_kind: host
          value: {type: number, minimum: 0, maximum: 10000}
          data_class: internal
          source: {kind: tool, tool: monitor/item_history}
    expect: {error: series_source_invalid}
  - name: trial guard with an incomplete outcome block
    manifests:
      - apiVersion: botaru/v1alpha1
        kind: ObservationSeries
        metadata: {name: host.load.v1, tenant: demo2}
        spec:
          catalog_kind: host
          value: {type: number, minimum: 0, maximum: 10000}
          data_class: internal
          source: {kind: job, field: duration_s}
          outcome: {compare: day.p95, better: down, tolerance_pct: 10}
      - {apiVersion: botaru/v1alpha1, kind: Tenant, metadata: {name: demo2}, spec: {kind: test, farm_manager: {enabled: false}, budgets: {month_eur: 60}, insights: {extra_guards: [{metric: farm.task.outcome, guards: [host.load.v1]}]}}}
    expect: {error: guard_not_metric}
  - name: trial guard of core series
    manifests:
      - {apiVersion: botaru/v1alpha1, kind: Tenant, metadata: {name: demo2}, spec: {kind: test, farm_manager: {enabled: false}, budgets: {month_eur: 60}, insights: {extra_guards: [{metric: farm.task.outcome, guards: [farm.attempt.duration]}]}}}
    expect: ok
