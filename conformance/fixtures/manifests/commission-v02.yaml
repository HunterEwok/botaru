id: fx-man-com-v02
rules: [COM-10, COM-13]
description: >-
  Apply lint of the v0.2 commission fields, on top of examples/. A shadow share of 0 is allowed only
  as an explicit shadow: off (COM-10); the escalation thresholds can only be raised from their
  defaults 2 and 3 (COM-13).
with_examples: true
cases:
  - name: shadow off passes
    manifests:
      - {apiVersion: botaru/v1alpha1, kind: Commission, metadata: {name: demo, tenant: demo}, spec: {review_deadline: 48h, weights: {security: 3, operational: 2, cost: 1, value: 2}, recommend_if: {weighted_mean_gte: 2.5, value_gte: 2}, park_if: {weighted_mean_gte: 1.5}, shadow: 'off'}}
    expect: ok
  - name: a veto lens shadow share of 0 without off
    manifests:
      - {apiVersion: botaru/v1alpha1, kind: Commission, metadata: {name: demo, tenant: demo}, spec: {review_deadline: 48h, weights: {security: 3, operational: 2, cost: 1, value: 2}, recommend_if: {weighted_mean_gte: 2.5, value_gte: 2}, park_if: {weighted_mean_gte: 1.5}, shadow: {veto_lenses: 0, other_lenses: 0.2}}}
    expect: {error: shadow_zero_without_off, at: veto_lenses}
  - name: an other lens shadow share of 0 without off
    manifests:
      - {apiVersion: botaru/v1alpha1, kind: Commission, metadata: {name: demo, tenant: demo}, spec: {review_deadline: 48h, weights: {security: 3, operational: 2, cost: 1, value: 2}, recommend_if: {weighted_mean_gte: 2.5, value_gte: 2}, park_if: {weighted_mean_gte: 1.5}, shadow: {veto_lenses: 0.25, other_lenses: 0}}}
    expect: {error: shadow_zero_without_off, at: other_lenses}
  - name: escalation thresholds at and above the defaults pass
    manifests:
      - {apiVersion: botaru/v1alpha1, kind: Commission, metadata: {name: demo, tenant: demo}, spec: {review_deadline: 48h, weights: {security: 3, operational: 2, cost: 1, value: 2}, recommend_if: {weighted_mean_gte: 2.5, value_gte: 2}, park_if: {weighted_mean_gte: 1.5}, escalation: {forward_if_score_gte: 3, untrusted_forward_if_score_gte: 3}}}
    expect: ok
  - name: a forward threshold of 1
    manifests:
      - {apiVersion: botaru/v1alpha1, kind: Commission, metadata: {name: demo, tenant: demo}, spec: {review_deadline: 48h, weights: {security: 3, operational: 2, cost: 1, value: 2}, recommend_if: {weighted_mean_gte: 2.5, value_gte: 2}, park_if: {weighted_mean_gte: 1.5}, escalation: {forward_if_score_gte: 1, untrusted_forward_if_score_gte: 3}}}
    expect: {error: escalation_threshold_lowered, at: forward_if_score_gte}
  - name: an untrusted threshold of 2
    manifests:
      - {apiVersion: botaru/v1alpha1, kind: Commission, metadata: {name: demo, tenant: demo}, spec: {review_deadline: 48h, weights: {security: 3, operational: 2, cost: 1, value: 2}, recommend_if: {weighted_mean_gte: 2.5, value_gte: 2}, park_if: {weighted_mean_gte: 1.5}, escalation: {forward_if_score_gte: 2, untrusted_forward_if_score_gte: 2}}}
    expect: {error: escalation_threshold_lowered, at: untrusted_forward_if_score_gte}
