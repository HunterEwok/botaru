id: fx-man-model-01
rules: [GW-14, GW-15, GW-17]
description: >-
  Model profiles and provider terms (rows lint:model/provider-terms-lint and
  lint:model/price-age-lint): a profile with provider_training: true, with a subprocessor outside
  privacy.subprocessors or with retention longer than max_days does not pass apply in models_allowed;
  a price 70 days old gives a warning, 130 days a refusal of apply. Age is counted from the today field. A production
  tenant with a provider in a region outside the EU passes apply only if the tenant has a spec.model_transfer record (GW-14, D-87 (2)).
with_examples: true
today: '2026-10-12'
cases:
  - name: training on requests
    manifests:
      - apiVersion: botaru/v1alpha1
        kind: ModelProfile
        metadata: {name: base-std}
        spec: {provider: provider-a, model: model-a-small-2026-09, family: family-a, rank: 1, max_output_tokens: 8000, tokens_per_s: 60,
               price: {input: 1.0, output: 4.0, checked: '2026-10-01'},
               provider_training: {value: true, checked: '2026-10-01'}, provider_human_review: {value: abuse_only, checked: '2026-10-01'}}
    expect: {error: provider_training}
  - name: subprocessor outside the privacy block
    manifests:
      - apiVersion: botaru/v1alpha1
        kind: ModelProfile
        metadata: {name: base-std}
        spec: {provider: provider-a, model: model-a-small-2026-09, family: family-a, rank: 1, max_output_tokens: 8000, tokens_per_s: 60,
               price: {input: 1.0, output: 4.0, checked: '2026-10-01'},
               provider_training: {value: false, checked: '2026-10-01'}, provider_human_review: {value: abuse_only, checked: '2026-10-01'},
               subprocessors: [{provider: provider-z, region: region-a}]}
    expect: {error: subprocessor_undeclared}
  - name: provider retention longer than the contract
    manifests:
      - apiVersion: botaru/v1alpha1
        kind: ModelProfile
        metadata: {name: base-std}
        spec: {provider: provider-a, model: model-a-small-2026-09, family: family-a, rank: 1, max_output_tokens: 8000, tokens_per_s: 60,
               price: {input: 1.0, output: 4.0, checked: '2026-10-01'}, provider_retention_days: {value: 90, checked: '2026-10-01'},
               provider_training: {value: false, checked: '2026-10-01'}, provider_human_review: {value: abuse_only, checked: '2026-10-01'}}
    expect: {error: provider_retention}
  - name: price 70 days old is only a warning
    manifests:
      - apiVersion: botaru/v1alpha1
        kind: ModelProfile
        metadata: {name: base-std}
        spec: {provider: provider-a, model: model-a-small-2026-09, family: family-a, rank: 1, max_output_tokens: 8000, tokens_per_s: 60,
               price: {input: 1.0, output: 4.0, checked: '2026-08-03'},
               provider_training: {value: false, checked: '2026-08-03'}, provider_human_review: {value: abuse_only, checked: '2026-08-03'}}
    expect: ok
  - name: price 130 days old
    manifests:
      - apiVersion: botaru/v1alpha1
        kind: ModelProfile
        metadata: {name: base-std}
        spec: {provider: provider-a, model: model-a-small-2026-09, family: family-a, rank: 1, max_output_tokens: 8000, tokens_per_s: 60,
               price: {input: 1.0, output: 4.0, checked: '2026-06-04'},
               provider_training: {value: false, checked: '2026-06-04'}, provider_human_review: {value: abuse_only, checked: '2026-06-04'}}
    expect: {error: price_stale}
  - name: model alias without a version does not pass the schema
    manifests:
      - apiVersion: botaru/v1alpha1
        kind: ModelProfile
        metadata: {name: base-std}
        spec: {provider: provider-a, model: Latest, family: family-a, rank: 1, max_output_tokens: 8000, tokens_per_s: 60,
               price: {input: 1.0, output: 4.0, checked: '2026-10-01'},
               provider_training: {value: false, checked: '2026-10-01'}, provider_human_review: {value: abuse_only, checked: '2026-10-01'}}
    expect: {error: schema_invalid, also: [ref_missing]}
  - name: provider region outside the EU for a production tenant without a model_transfer record
    manifests:
      - apiVersion: botaru/v1alpha1
        kind: Tenant
        metadata:
          name: demo
        spec:
          kind: production
          timezone: Europe/Berlin
          self_approve: false
          locale: ru
          limits:
            max_queued: 5000
            max_enqueue_per_hour: 2000
            max_storage_bytes: 21474836480
          budgets:
            month_eur: 300
            day_eur: 15
            hour_eur: 3
            lines:
              insight:
                month_eur: 15
                per_role_month_eur: 5
              aggregate:
                month_eur: 5
              review:
                month_eur: 50
              governance:
                month_eur: 5
              manager:
                day_eur: 2
                month_eur: 30
          attention:
            cards_per_tenant_hour: 20
          delegated_groups:
          - researcher
          farm_manager:
            enabled: true
          link_allowlist:
          - www.example.org
          - docs.example.org
          models_allowed:
          - base-std
          - analysis-std
          - review-a
          - review-b
          - seat-std
          - seat-alt
          - manager-std
          - translate-std
          providers_allowed:
          - provider-a
          - provider-b
          operator_access:
            debug_journal: notify
          messaging:
            wake_day_eur: 1.5
            wakes_per_day: 200
          retention:
            classes: {content: 90d}
            files: 90d
            journals: 30d
          privacy:
            purposes:
            - purpose: operations
              lawful_basis: legitimate_interest
            - purpose: assistance
              lawful_basis: consent
            - purpose: data_processing
              lawful_basis: legitimate_interest
            - purpose: incident_review
              lawful_basis: legitimate_interest
            subprocessors:
            - provider: provider-a
              agreement_ref: contracts/provider-a-dpa
              region: region-a
              retention:
                mode: standard
                max_days: 30
            - provider: provider-b
              agreement_ref: contracts/provider-b-dpa
              region: region-a
              retention:
                mode: standard
                max_days: 30
            - provider: provider-c
              agreement_ref: contracts/provider-c-dpa
              region: region-a
              retention:
                mode: standard
                max_days: 30
            - provider: anthropic
              agreement_ref: contracts/anthropic-dpa
              region: us
              retention:
                mode: standard
                max_days: 30
            recipients:
            - model_provider
            - messenger
            - monitoring
            channels:
            - driver: telegram
              third_party_storage: true
              ceiling: internal
            notice_ref: https://docs.example.org/botaru/privacy
            notice_version: 3
          commands:
            /logs: ops.investigate.v1
            /health: ops.health.v1
            /geo: geo.describe.v1
            /pipeline: pipeline.status.v1
            /describe: data.describe.v1
            /a: assist.chat.v1
            /hello: hello.greet.v1
          run:
            ctd-qc:
              action: pipeline.ctd_qc
              args:
              - month
              - stations
            batch-resume:
              action: pipeline.batch_resume
              args:
              - run
              - profile
            month-report:
              type: report.monthly.numbers.v1
              args:
              - month
          default_types:
          - type: ops.summary.v1
            chats:
            - direct
      - apiVersion: botaru/v1alpha1
        kind: ModelProfile
        metadata:
          name: base-std
        spec:
          provider: anthropic
          model: model-a-small-2026-09
          family: family-a
          rank: 1
          pool: family-a
          fallback: []
          fallback_on:
          - overloaded
          - unavailable
          - retired
          max_output_tokens: 8000
          tokens_per_s: 60
          price:
            input: 1.0
            output: 4.0
            checked: 2026-10-01
          provider_retention_days:
            value: 30
            checked: 2026-10-01
          requires_retention: false
          provider_training:
            value: false
            checked: 2026-10-01
          provider_human_review:
            value: abuse_only
            checked: 2026-10-01
          subprocessors: []
          retires_at: null
    expect: {error: transfer_basis_missing}
  - name: provider region outside the EU for a production tenant with a model_transfer record
    manifests:
      - apiVersion: botaru/v1alpha1
        kind: Tenant
        metadata:
          name: demo
        spec:
          kind: production
          model_transfer:
          - {provider: anthropic, basis: scc, checked: '2026-10-01'}
          timezone: Europe/Berlin
          self_approve: false
          locale: ru
          limits:
            max_queued: 5000
            max_enqueue_per_hour: 2000
            max_storage_bytes: 21474836480
          budgets:
            month_eur: 300
            day_eur: 15
            hour_eur: 3
            lines:
              insight:
                month_eur: 15
                per_role_month_eur: 5
              aggregate:
                month_eur: 5
              review:
                month_eur: 50
              governance:
                month_eur: 5
              manager:
                day_eur: 2
                month_eur: 30
          attention:
            cards_per_tenant_hour: 20
          delegated_groups:
          - researcher
          farm_manager:
            enabled: true
          link_allowlist:
          - www.example.org
          - docs.example.org
          models_allowed:
          - base-std
          - analysis-std
          - review-a
          - review-b
          - seat-std
          - seat-alt
          - manager-std
          - translate-std
          providers_allowed:
          - provider-a
          - provider-b
          operator_access:
            debug_journal: notify
          messaging:
            wake_day_eur: 1.5
            wakes_per_day: 200
          retention:
            classes: {content: 90d}
            files: 90d
            journals: 30d
          privacy:
            purposes:
            - purpose: operations
              lawful_basis: legitimate_interest
            - purpose: assistance
              lawful_basis: consent
            - purpose: data_processing
              lawful_basis: legitimate_interest
            - purpose: incident_review
              lawful_basis: legitimate_interest
            subprocessors:
            - provider: provider-a
              agreement_ref: contracts/provider-a-dpa
              region: region-a
              retention:
                mode: standard
                max_days: 30
            - provider: provider-b
              agreement_ref: contracts/provider-b-dpa
              region: region-a
              retention:
                mode: standard
                max_days: 30
            - provider: provider-c
              agreement_ref: contracts/provider-c-dpa
              region: region-a
              retention:
                mode: standard
                max_days: 30
            - provider: anthropic
              agreement_ref: contracts/anthropic-dpa
              region: us
              retention:
                mode: standard
                max_days: 30
            recipients:
            - model_provider
            - messenger
            - monitoring
            channels:
            - driver: telegram
              third_party_storage: true
              ceiling: internal
            notice_ref: https://docs.example.org/botaru/privacy
