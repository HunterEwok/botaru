id: fx-man-com-07
rules: [COM-2, COM-6, COM-7, COM-8]
description: >-
  Every veto lens of a charter with a commission has an executor: a seat of the lens whose fallback role claims
  the lens review type (COM-7); the base profile of a role that claims a lens review answers in at most 2000
  output tokens (COM-6).
with_examples: true
cases:
  - name: the example charter of demo
    manifests: []
    expect: ok
  - name: the security seat falls back to a role without review.security.v1
    manifests:
      - apiVersion: botaru/v1alpha1
        kind: Governance
        metadata: {name: demo, tenant: demo}
        spec:
          positions:
            functional: {max_rank: 1, analysis_max_rank: 2}
          commission:
            seat_role: commission-member
            model_profile: seat-std
            seats:
              - {id: 1, lens: security, fallback_role: reviewer-b}
              - {id: 2, lens: operational, fallback_role: reviewer-a}
              - {id: 3, lens: cost, fallback_role: reviewer-b}
              - {id: 4, lens: value, fallback_role: reviewer-b}
            lenses:
              security: {persona: {ref: personas/lens-security.md, sha256: "..."}}
              operational: {persona: {ref: personas/lens-operational.md, sha256: "..."}}
              cost: {persona: {ref: personas/lens-cost.md, sha256: "..."}}
              value: {persona: {ref: personas/lens-value.md, sha256: "..."}}
            audit_sample: {min_per_month: 4, share: 0.25, max_per_digest: 2}
          promotion: {probation: 14d, exclude_change_kinds: [none], min_tenure: 30d, swap_cooldown: 30d}
          removal: {protect_new: 60d}
          confirmation: {ttl: 7d}
          attribution: {window: 14d}
          identity: {unbound_ttl: 30d}
          memory:
            seal_ttl: 30d
            facts: {max_active: 100, per_attempt: 3}
            offer: {max: 100}
    expect: {error: veto_lens_no_executor}
  - name: a reviewer profile with a long answer
    manifests:
      - apiVersion: botaru/v1alpha1
        kind: ModelProfile
        metadata: {name: review-a}
        spec:
          provider: provider-a
          model: model-a-large-2026-09
          family: family-a
          rank: 3
          pool: family-a
          fallback: []
          fallback_on: [overloaded, unavailable, retired]
          max_output_tokens: 4000
          tokens_per_s: 60
          price: {input: 3.00, output: 12.00, checked: 2026-10-01}
          provider_retention_days: {value: 30, checked: 2026-10-01}
          requires_retention: false
          provider_training: {value: false, checked: 2026-10-01}
          provider_human_review: {value: abuse_only, checked: 2026-10-01}
          subprocessors: []
          retires_at: null
    expect: {error: lens_profile_output}
  - name: no seats; the veto lenses go to the reviewer roles that claim them
    manifests:
      - apiVersion: botaru/v1alpha1
        kind: Governance
        metadata: {name: demo, tenant: demo}
        spec:
          positions:
            functional: {max_rank: 1, analysis_max_rank: 2}
          commission:
            seat_role: commission-member
            model_profile: seat-std
            seats: []
            lenses:
              security: {persona: {ref: personas/lens-security.md, sha256: "..."}}
              operational: {persona: {ref: personas/lens-operational.md, sha256: "..."}}
              cost: {persona: {ref: personas/lens-cost.md, sha256: "..."}}
              value: {persona: {ref: personas/lens-value.md, sha256: "..."}}
            audit_sample: {min_per_month: 4, share: 0.25, max_per_digest: 2}
          promotion: {probation: 14d, exclude_change_kinds: [none], min_tenure: 30d, swap_cooldown: 30d}
          removal: {protect_new: 60d}
          confirmation: {ttl: 7d}
          attribution: {window: 14d}
          identity: {unbound_ttl: 30d}
          memory:
            seal_ttl: 30d
            facts: {max_active: 100, per_attempt: 3}
            offer: {max: 100}
    expect: ok
  - name: a seat falls back to a role on the analysis profile of a proposal author
    manifests:
      - apiVersion: botaru/v1alpha1
        kind: Role
        metadata: {name: reviewer-c}
        spec:
          profile: reviewer
          worker_kind: agent
          claims: [review.security.v1]
          models: {base: analysis-std}
          memory: none
      - apiVersion: botaru/v1alpha1
        kind: Governance
        metadata: {name: demo, tenant: demo}
        spec:
          positions:
            functional: {max_rank: 1, analysis_max_rank: 2}
          commission:
            seat_role: commission-member
            model_profile: seat-std
            seats:
              - {id: 1, lens: security, fallback_role: reviewer-c}
              - {id: 2, lens: operational, fallback_role: reviewer-a}
              - {id: 3, lens: cost, fallback_role: reviewer-b}
              - {id: 4, lens: value, fallback_role: reviewer-b}
            lenses:
              security: {persona: {ref: personas/lens-security.md, sha256: "..."}}
              operational: {persona: {ref: personas/lens-operational.md, sha256: "..."}}
              cost: {persona: {ref: personas/lens-cost.md, sha256: "..."}}
              value: {persona: {ref: personas/lens-value.md, sha256: "..."}}
            audit_sample: {min_per_month: 4, share: 0.25, max_per_digest: 2}
          promotion: {probation: 14d, exclude_change_kinds: [none], min_tenure: 30d, swap_cooldown: 30d}
          removal: {protect_new: 60d}
          confirmation: {ttl: 7d}
          attribution: {window: 14d}
          identity: {unbound_ttl: 30d}
          memory:
            seal_ttl: 30d
            facts: {max_active: 100, per_attempt: 3}
            offer: {max: 100}
    expect: {error: reviewer_not_independent, also: [lens_profile_output]}
