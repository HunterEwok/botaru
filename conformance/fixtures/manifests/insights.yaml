id: fx-man-ins-01
rules: [INS-1, INS-2, INS-4]
description: >-
  The insight section of a role: its types are insight types of tier 1 at most that the role claims and that
  take the core's insight-result, each in exactly one role (INS-1); its tools are among the role's own (INS-2);
  the merge window is at least an hour (INS-4).
with_examples: true
cases:
  - name: the example analysis of ops-reader
    manifests: []
    expect: ok
  - name: merge window shorter than an hour
    manifests:
      - apiVersion: botaru/v1alpha1
        kind: Role
        metadata: {name: ops-reader}
        spec:
          profile: worker
          worker_kind: agent
          claims: [ops.investigate.v1, ops.health.v1, ops.summary.v1, ops.insight.v1]
          tools: [cmd/run, logs/tail, checks/latest, storage/dir_sizes, monitor/problems, monitor/item_history,
                  monitor/maintenance, monitor/item_text, monitor/problem_comments]
          actions_may_request: [cleanup_pipeline_tmp]
          service_control: [nginx]
          monitor_scripts: [nginx-cache-clear]
          models: {base: base-std, analysis: analysis-std}
          memory: none
          insight: {types: [ops.insight.v1], tools: [monitor/item_history], max_data: internal, merge_window: 30m}
    expect: {error: insight_merge_window}
  - name: analysis tool outside the role tools
    manifests:
      - apiVersion: botaru/v1alpha1
        kind: Role
        metadata: {name: ops-reader}
        spec:
          profile: worker
          worker_kind: agent
          claims: [ops.investigate.v1, ops.health.v1, ops.summary.v1, ops.insight.v1]
          tools: [cmd/run, logs/tail, checks/latest, storage/dir_sizes, monitor/problems,
                  monitor/maintenance, monitor/item_text, monitor/problem_comments]
          actions_may_request: [cleanup_pipeline_tmp]
          service_control: [nginx]
          monitor_scripts: [nginx-cache-clear]
          models: {base: base-std, analysis: analysis-std}
          memory: none
          insight: {types: [ops.insight.v1], tools: [monitor/item_history], max_data: internal, merge_window: 1h}
    expect: {error: insight_wider}
  - name: analysis type of tier 2
    manifests:
      - apiVersion: botaru/v1alpha1
        kind: TaskType
        metadata: {name: ops.insight.v1}
        spec:
          title: "Weekly look at the role's own results"
          worker_kind: agent
          purpose: insight
          tier: 2
          data_class: internal
          instruction: "Look at the role's own results."
          params_schema: {type: object, additionalProperties: false, properties: {}}
          timeouts: {start_by: 1h, lease: 60s, heartbeat: 20s, attempt: 5m, deadline: 2h}
          retry: {max_attempts: 1, max_runs: 2}
          tree_budget_eur: 0.10
          max_children: 0
          proposable: false
    expect: {error: insight_type_invalid, also: [sandbox_live_tools]}
