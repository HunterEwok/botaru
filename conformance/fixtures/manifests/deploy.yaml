id: fx-man-deploy-01
rules: [DEP-10, RET-5, MON-2]
description: >-
  Deployment lint per spec/model/deploy-topology.schema.json: a process kind: core on a machine
  kind: production has no test-control port listener (listeners.test), otherwise listener_test_in_production
  (D-86 (4)). A single-server farm without a monitoring system passes only if there is a watchdog kind: watch
  and backups go encrypted to external storage (D-88). A deployment description is data, not a manifest: the case carries it in the deploy field.
cases:
  - name: training farm without a test-control port
    deploy:
      monitoring:
        url: https://monitor.example.org
        address: 192.0.2.40
      farm_hosts:
      - core1
      - backup1
      health_keys:
      - health-key
      hosts:
        core1:
          kind: production
          processes:
          - name: farmd
            kind: core
            user: botaru-core
            networks:
            - core
            - store
            secrets:
            - store-core
            listeners:
              p1:
                networks:
                - core
              p2:
                networks:
                - admin
                - monitoring
          - name: store
            kind: store
            user: botaru-store
            networks:
            - store
          - name: channel-demo
            kind: channel
            tenant: demo
            user: botaru-ch-demo
            networks:
            - core
            secrets:
            - worker-token-channel-demo
          - name: monitor-demo
            kind: monitor
            tenant: demo
            user: botaru-mon-demo
            networks:
            - core
            secrets:
            - worker-token-monitor-demo
        backup1:
          kind: production
          processes:
          - name: backup
            kind: backup
            user: botaru-backup
            networks:
            - backup
            secrets:
            - backup-key
        ctd1:
          kind: production
          processes:
          - name: th-demo-read
            kind: toolhost
            tenant: demo
            placement: host
            user: botaru-read-demo
            networks:
            - core
            secrets:
            - worker-token-th-demo-read
          - name: th-demo-act
            kind: toolhost
            tenant: demo
            placement: host
            tools: write
            user: botaru-act-demo
            networks:
            - core
            secrets:
            - worker-token-th-demo-act
          os_users:
            ctd-qc-run:
              demo: botaru-ctd-demo
    expect: ok
  - name: test-control port listener on a production machine
    deploy:
      monitoring:
        url: https://monitor.example.org
        address: 192.0.2.40
      farm_hosts:
      - core1
      - backup1
      health_keys:
      - health-key
      hosts:
        core1:
          kind: production
          processes:
          - name: farmd
            kind: core
            user: botaru-core
            networks:
            - core
            - store
            secrets:
            - store-core
            listeners:
              p1:
                networks:
                - core
              p2:
                networks:
                - admin
                - monitoring
              test:
                networks:
                - bench
          - name: store
            kind: store
            user: botaru-store
            networks:
            - store
          - name: channel-demo
            kind: channel
            tenant: demo
            user: botaru-ch-demo
            networks:
            - core
            secrets:
            - worker-token-channel-demo
          - name: monitor-demo
            kind: monitor
            tenant: demo
            user: botaru-mon-demo
            networks:
            - core
            secrets:
            - worker-token-monitor-demo
        backup1:
          kind: production
          processes:
          - name: backup
            kind: backup
            user: botaru-backup
            networks:
            - backup
            secrets:
            - backup-key
        ctd1:
          kind: production
          processes:
          - name: th-demo-read
            kind: toolhost
            tenant: demo
            placement: host
            user: botaru-read-demo
            networks:
            - core
            secrets:
            - worker-token-th-demo-read
          - name: th-demo-act
            kind: toolhost
            tenant: demo
            placement: host
            tools: write
            user: botaru-act-demo
            networks:
            - core
            secrets:
            - worker-token-th-demo-act
          os_users:
            ctd-qc-run:
              demo: botaru-ctd-demo
    expect: {error: listener_test_in_production}
  - name: 'single-server farm without a monitoring system, watchdog and encrypted backups in external storage (D-88)'
    deploy:
      farm_hosts:
      - core1
      health_keys:
      - health-key
      watch:
        notify_ref: watch-notify
        interval_s: 60
      backup:
        target: external
        url: https://backup.example.org/farm
        location_id: offsite-1
        encrypted: true
        key_ref: backup-encryption-key
        credentials_ref: backup-write-only
      hosts:
        core1:
          kind: production
          processes:
          - name: farmd
            kind: core
            user: botaru-core
            networks:
            - core
            - store
            secrets:
            - store-core
            listeners:
              p1:
                networks:
                - core
              p2:
                networks:
                - admin
                - watch
          - name: store
            kind: store
            user: botaru-store
            networks:
            - store
          - name: channel-demo
            kind: channel
            tenant: demo
            user: botaru-ch-demo
            networks:
            - core
            secrets:
            - worker-token-channel-demo
          - name: watch
            kind: watch
            user: botaru-watch
            networks:
            - watch
            - notify-out
            secrets:
            - health-key
            - watch-notify
          - name: backup
            kind: backup
            user: botaru-backup
            networks:
            - store
            - backup-out
            secrets:
            - backup-encryption-key
            - backup-write-only
        web1:
          kind: production
          processes:
          - name: th-demo-read
            kind: toolhost
            tenant: demo
            placement: host
            user: botaru-read-demo
            networks:
            - core
            secrets:
            - worker-token-th-demo-read
    expect: ok
  - name: single server, backups in external storage without encryption
    deploy:
      farm_hosts:
      - core1
      health_keys:
      - health-key
      watch:
        notify_ref: watch-notify
        interval_s: 60
      backup:
        target: external
        url: https://backup.example.org/farm
        location_id: offsite-1
        encrypted: false
        key_ref: backup-encryption-key
        credentials_ref: backup-write-only
      hosts:
        core1:
          kind: production
          processes:
          - name: farmd
            kind: core
            user: botaru-core
            networks:
            - core
            - store
            secrets:
            - store-core
            listeners:
              p1:
                networks:
                - core
              p2:
                networks:
                - admin
                - watch
          - name: store
            kind: store
            user: botaru-store
            networks:
            - store
          - name: channel-demo
            kind: channel
            tenant: demo
            user: botaru-ch-demo
            networks:
            - core
            secrets:
            - worker-token-channel-demo
          - name: watch
            kind: watch
            user: botaru-watch
            networks:
            - watch
            - notify-out
            secrets:
            - health-key
            - watch-notify
          - name: backup
            kind: backup
            user: botaru-backup
            networks:
            - store
            - backup-out
            secrets:
            - backup-encryption-key
            - backup-write-only
        web1:
          kind: production
          processes:
          - name: th-demo-read
            kind: toolhost
            tenant: demo
            placement: host
            user: botaru-read-demo
            networks:
            - core
            secrets:
            - worker-token-th-demo-read
    expect: {error: backup_external_required}
  - name: single server without a backup location
    deploy:
      farm_hosts:
      - core1
      health_keys:
      - health-key
      watch:
        notify_ref: watch-notify
        interval_s: 60
      hosts:
        core1:
          kind: production
          processes:
          - name: farmd
            kind: core
            user: botaru-core
            networks:
            - core
            - store
            secrets:
            - store-core
            listeners:
              p1:
                networks:
                - core
              p2:
                networks:
                - admin
                - watch
          - name: store
            kind: store
            user: botaru-store
            networks:
            - store
          - name: channel-demo
            kind: channel
            tenant: demo
            user: botaru-ch-demo
            networks:
            - core
            secrets:
            - worker-token-channel-demo
          - name: watch
            kind: watch
            user: botaru-watch
            networks:
            - watch
            - notify-out
            secrets:
            - health-key
            - watch-notify
          - name: backup
            kind: backup
            user: botaru-backup
            networks:
            - store
            - backup-out
            secrets:
            - backup-encryption-key
            - backup-write-only
        web1:
          kind: production
          processes:
          - name: th-demo-read
            kind: toolhost
            tenant: demo
            placement: host
            user: botaru-read-demo
            networks:
            - core
            secrets:
            - worker-token-th-demo-read
    expect: {error: backup_external_required}
  - name: without a monitoring system and without a watchdog
    deploy:
      farm_hosts:
      - core1
      health_keys:
      - health-key
      backup:
        target: external
        url: https://backup.example.org/farm
        location_id: offsite-1
        encrypted: true
        key_ref: backup-encryption-key
        credentials_ref: backup-write-only
      hosts:
        core1:
          kind: production
          processes:
          - name: farmd
            kind: core
            user: botaru-core
            networks:
            - core
            - store
            secrets:
            - store-core
            listeners:
              p1:
                networks:
                - core
              p2:
                networks:
                - admin
                - watch
          - name: store
            kind: store
            user: botaru-store
            networks:
            - store
          - name: channel-demo
            kind: channel
            tenant: demo
            user: botaru-ch-demo
            networks:
            - core
            secrets:
            - worker-token-channel-demo
          - name: backup
            kind: backup
            user: botaru-backup
            networks:
            - store
            - backup-out
            secrets:
            - backup-encryption-key
            - backup-write-only
        web1:
          kind: production
