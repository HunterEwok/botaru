id: fx-restore-restore
rules: [RET-6, RET-7]
description: Restoring the store from a backup. Before the core is ready the store epoch grows and old tokens get
  fenced; waiting approvals move to canceled(restored) with card_update; the erasure log is replayed again
  from its separate backup, including manual deletions through farmctl; P1 claim and enqueue answer not_ready, and P4 does not
  start model calls; the core is not ready until the spend gap is filled with spend_reconciled lines, or the operator
  completes the restore with restore.complete --spend-pending.
given: {tenant: demo}
cases:
- id: rst-fx-01
  rules: [RET-6, RET-7, AUD-6]
  description: The backup was taken while the approval was pending, before its decision and before forget; after the restore the approval
    is canceled(restored), the memory record is deleted again, and the old token gets fenced.
  given: {store_epoch: 7}
  steps:
  - occur:
      approval_pending: {approval: a_01JB8M0000000000000000000A}
    at: '2026-10-12T01:00:00Z'
  - stand: {op: store.snapshot, label: store-daily}
    at: '2026-10-12T02:00:00Z'
  - occur:
      approval_decided: {approval: a_01JB8M0000000000000000000A, decision: approve}
    at: '2026-10-12T08:00:00Z'
  - occur:
      forget: {memory_item: m_01JB8M0000000000000000000M, erasure_request: er_01JB8M0000000000000000000E}
    at: '2026-10-12T09:00:00Z'
  - occur:
      lease_token_issued: {token_epoch: 7}
    at: '2026-10-12T09:30:00Z'
  - stand: {op: store.restore, label: store-daily}
    at: '2026-10-12T10:00:00Z'
  expect:
    store_epoch: 8
    before_ready:
      p1_claim: {result: rejected, reason: not_ready}
      p1_enqueue: {result: rejected, reason: not_ready}
      p4_model_calls: 0
    approvals:
      a_01JB8M0000000000000000000A: {state: canceled, reason: restored, card_update: true}
    erasure_journal_replayed: true
    memory: {m_01JB8M0000000000000000000M: absent}
    old_token: {result: fenced}
    farm_audit: {restore_record: true, head_epoch: grows}
- id: rst-fx-02
  rules: [RET-6]
  description: An approval in executing whose write call was in queued gets exec_unknown together with it; the action
    is not repeated.
  given:
    approval: {state: executing, write_call: queued}
  expect: {approval_outcome: exec_unknown, action_retried: false}
- id: rst-fx-03
  rules: [RET-7]
  description: The operator deletes a principal's data through farmctl after the backup was taken; after the restore from this backup
    the data are deleted again.
  steps:
  - stand: {op: store.snapshot, label: store-daily}
    at: '2026-10-12T02:00:00Z'
  - occur:
      erasure_request:
        request:
          scope: {tenant: demo, subject: 'human:carol'}
          reason: manual
          author: {kind: principal, id: 'human:bob'}
    at: '2026-10-12T05:00:00Z'
  - occur: {erasure_journal_backup: true}
    at: '2026-10-12T05:00:00Z'
  - stand: {op: store.restore, label: store-daily}
    at: '2026-10-12T06:00:00Z'
  expect:
    subject_data: {'human:carol': absent}
    request_state_after_replay: done
- id: rst-fx-04
  rules: [RET-6]
  description: restore.complete --spend-pending gives readiness, the alarm alarm.spend.unreconciled (warn) and a halved
    daily limit; spend.reconcile removes both.
  given:
    budgets: {month_eur: 300, day_eur: 15}
  steps:
  - call:
      port: P2
      op: restore.complete
      request: {spend_pending: true}
    by: operator
    expect:
      ready: true
      alarms:
      - {type: alarm.spend.unreconciled.v1, state: firing, severity: warn}
      day_eur_effective: 7.5
  - call:
      port: P2
      op: spend.reconcile
      request:
        day: '2026-10-11'
        provider: anthropic
        rows:
        - {tenant: demo, spent_eur_micros: 12000000}
    by: operator
    context: {covers_gap: true}
    expect:
      alarms:
      - {type: alarm.spend.unreconciled.v1, state: resolved}
      day_eur_effective: 15
- id: rst-fx-05
  rules: [RET-6]
  description: Without --spend-pending and without spend_reconciled lines for the gap the core does not become ready.
  given: {spend_gap_open: true}
  steps:
  - call: {port: P2, op: restore.complete}
  expect:
    ready: false
    p1_claim: {result: rejected, reason: not_ready}
- id: rst-fx-06
  rules: [RET-6]
  description: The core completes the restore itself if at startup it sees a separate erasure log backup ahead of
    the store; the log is replayed before readiness.
  given:
    erasure_journal_backup_at: '2026-10-12T05:00:00Z'
    store_backup_at: '2026-10-12T02:00:00Z'
    spend_gap_open: false
  expect: {restore_detected: true, erasure_journal_replayed: true}
