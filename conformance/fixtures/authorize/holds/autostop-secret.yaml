id: hld-fx-12
rules: [HLD-6]
description: Twice within an hour a channel refused to send a message of one role of a tenant because it found a secret in it
  (INJ-11). The core sets a hold of scope role with effect no_delivery, reason secret_in_outbound, author contain_auto
  and no end time, and raises the alarm alarm.hold.auto; the role's next message is not delivered. The core does not release the hold itself.
given:
  channel_refusals:
  - at: '2026-10-12T14:05:00Z'
    role: ops-reader
    reason: secret_in_outbound
    text: token=CANARY-NOT-A-SECRET-hld6-a
  - at: '2026-10-12T14:40:00Z'
    role: ops-reader
    reason: secret_in_outbound
    text: token=CANARY-NOT-A-SECRET-hld6-b
  tenant: demo
  role: ops-reader
  autostop: secret_in_outbound_twice
expect:
  hold:
    tenant: demo
    scope: {kind: role, tenant: demo, name: ops-reader}
    effects: [no_delivery]
    reason: secret_in_outbound
    author_kind: contain_auto
    until: null
  alarms:
  - {type: alarm.hold.auto.v1, state: firing}
  next_delivery: {role: ops-reader, at: '2026-10-12T14:50:00Z', result: withheld}
  after_secret_alarm_resolved: {hold_state: active}
cases:
- id: hld-fx-13
  rules: [HLD-6]
  description: Two refusals of one role more than an hour apart do not give a hold.
  given:
    channel_refusals:
    - {at: '2026-10-12T12:00:00Z', role: ops-reader, reason: secret_in_outbound}
    - {at: '2026-10-12T13:30:00Z', role: ops-reader, reason: secret_in_outbound}
    tenant: demo
  expect: {hold: null}
- id: hld-fx-14
  rules: [HLD-6]
  description: One refusal each for two different roles within an hour does not give a hold.
  given:
    channel_refusals:
    - {at: '2026-10-12T14:05:00Z', role: ops-reader, reason: secret_in_outbound}
    - {at: '2026-10-12T14:20:00Z', role: reporter, reason: secret_in_outbound}
    tenant: demo
  expect: {hold: null}
