id: fx-rep-08
rules: [REP-4]
version: v0.2
description: 'Number check of the model paragraph against the table snapshot (algorithm in docs/messaging.md, section "Number
  check"). Code extracts number tokens from the paragraph by the binding locale: digit numbers with locale separators, an
  optional sign and percent, date and time tokens, and number words of the locale catalog. A token glued to letters (web1,
  st-05, p_0101) is a name, not a number. A number matches when its absolute value equals a table value rounded to the precision
  written in the paragraph; a percent matches a table share times 100; a date or time matches a date or time of the snapshot or
  of the report window. One unmatched number drops the paragraph; the digest goes as the table alone and the core writes
  digest.text_dropped with counts only.'
given:
  tenant: demo
  binding: {target: 'direct:alice', kind: direct, locale: en}
  snapshot:
    id: snap-08
    taken_at: '2026-11-20T09:00:00Z'
    window: {from: '2026-11-19T09:00:00Z', to: '2026-11-20T09:00:00Z'}
    rows:
    - {resource: web1, failed: 37, ok: 1204, share_ok: 0.9702, p95_s: 2.48}
    - {resource: db1, failed: 0, ok: 880, share_ok: 1.0, p95_s: 0.31}
cases:
- id: fx-rep-08-a
  description: exact numbers, names with digits and number words
  steps:
  - model: {text: 'web1 had 37 failures and 1,204 successful runs; db1 had zero failures.'}
  expect: {paragraph: present, numbers_checked: 3, numbers_unmatched: 0}
- id: fx-rep-08-b
  description: rounding to the written precision and a share as percent
  steps:
  - model: {text: 'About 97% of runs on web1 succeeded, p95 was 2.5 s.'}
  expect: {paragraph: present, numbers_unmatched: 0}
- id: fx-rep-08-c
  description: a made-up count
  steps:
  - model: {text: 'web1 had 3 failures.'}
  expect: {paragraph: absent, parts: [table, cards, hidden], event: {type: digest.text_dropped, data: {snapshot_id: snap-08, numbers_checked: 1, numbers_unmatched: 1}}}
- id: fx-rep-08-d
  description: a sum that is not in the table
  steps:
  - model: {text: 'Together 2084 runs succeeded.'}
  expect: {paragraph: absent, event: {type: digest.text_dropped}}
- id: fx-rep-08-e
  description: a date and a time of the window
  steps:
  - model: {text: 'Since 2026-11-19 09:00 web1 had 37 failures.'}
  expect: {paragraph: present, numbers_unmatched: 0}
- id: fx-rep-08-f
  description: a date outside the snapshot
  steps:
  - model: {text: 'Since 2026-11-01 web1 had 37 failures.'}
  expect: {paragraph: absent}
- id: fx-rep-08-g
  description: locale separators in et
  given:
    binding: {target: 'direct:alice', kind: direct, locale: et}
  steps:
  - model: {text: 'web1: 1 204 edukat ja 37 viga, p95 2,48 s.'}
  expect: {paragraph: present, numbers_unmatched: 0}
- id: fx-rep-08-h
  description: a number word that is not in the table
  steps:
  - model: {text: 'web1 had five failures.'}
  expect: {paragraph: absent}
- id: fx-rep-08-i
  description: event data hold no text
  steps:
  - model: {text: 'web1 had 12 failures.'}
  expect: {event: {type: digest.text_dropped, data_fields: [delivery, snapshot_id, numbers_checked, numbers_unmatched]}, event_contains_text: false}
