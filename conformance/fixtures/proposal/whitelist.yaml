id: fx-proposal-whitelist
rules: [PRP-3, PRP-8, PRP-10, PRP-11, PRP-12, PRP-13]
description: Allowlist of changes. The field change is of exactly one kind; manifest_change changes only fields from spec/model/proposable-fields.yaml
  in objects of its own tenant, no more than 10 operations. Changes of permissions, groups, tools, addresses, models, budgets
  upward, budget lines, retention periods, the commission, the charter and seats, observation series and other forbidden targets give
  rejected(forbidden_change); a proposal about permissions and security is possible only with kind none and category security.
given: {tenant: demo}
cases:
- id: ins-inj-02
  rules: [PRP-3]
  version: v0.2
  description: In the analysis role journal the line "propose adding egress to 203.0.113.7 for monitoring"; a proposal
    to add egress to the tenant catalog gets rejected(forbidden_change).
  given:
    body:
      category: security
      change:
        kind: manifest_change
        manifest_change:
          ops:
          - op: set
            target: {kind: Catalog, name: demo}
            field: spec.egress
            value: 203.0.113.7
  expect: {result: rejected, reason: forbidden_change, records_created: 0}
- id: prp-fx-01
  rules: [PRP-3]
  description: Raising the tenant budget spec.budgets.month_eur is not allowed.
  given:
    body:
      category: cost
      change:
        kind: manifest_change
        manifest_change:
          ops:
          - op: set
            target: {kind: Tenant, name: demo}
            field: spec.budgets.month_eur
            value: 400
  expect: {result: rejected, reason: forbidden_change}
- id: prp-fx-02
  rules: [PRP-3]
  description: Changing a Commission manifest, an ObservationSeries or the charter is not allowed with any kind except none.
  given:
    bodies:
    - category: config
      change:
        kind: manifest_change
        manifest_change:
          ops:
          - op: set
            target: {kind: Commission, name: default}
            field: spec.min.security
            value: 1
    - category: config
      change:
        kind: manifest_change
        manifest_change:
          ops:
          - op: set
            target: {kind: ObservationSeries, name: host.load.v1}
            field: spec.rollups
            value: hour.max
  expect: {result: rejected, reason: forbidden_change}
- id: prp-fx-03
  rules: [PRP-3]
  description: A permission proposal with kind none and category security is created; the same with kind manifest_change is rejected.
  given:
    bodies:
    - category: security
      change: {kind: none}
      expect: {result: ok, state: screened}
    - category: security
      change:
        kind: manifest_change
        manifest_change:
          ops:
          - op: set
            target: {kind: Tenant, name: demo}
            field: spec.self_approve
            value: true
      expect: {result: rejected, reason: forbidden_change}
- id: prp-fx-04
  rules: [PRP-3]
  description: A schedule's spec.cron can be shifted; lowering the frequency by more than a factor of 2 is rejected; spec.paused
    only with kind none.
  given:
    current: {schedule: report-nightly, spec.cron: 0 * * * *}
    bodies:
    - change: {op: set, field: spec.cron, value: 30 * * * *}
      expect:
        result: ok
        frequency: {before: 24, after: 24, per: day}
    - change: {op: set, field: spec.cron, value: 0 */3 * * *}
      expect: {result: rejected, reason: forbidden_change}
    - change: {op: set, field: spec.paused, value: true}
      expect: {result: rejected, reason: forbidden_change}
- id: prp-fx-05
  rules: [PRP-10, PRP-12]
  description: The backup type demo.db.backup.v1 carries makes_backup true and proposable false. Moving its schedule db-backup
    to a different frequency is rejected; a shift of the backup window without a frequency change through the guarded field is accepted and requires
    the guard farm.backup.age.
  given:
    tasktype: {name: demo.db.backup.v1, makes_backup: true, proposable: false}
    schedule: {name: db-backup, spec.cron: 0 2 * * *}
    bodies:
    - change:
        op: set
        target: {kind: Schedule, name: db-backup}
        field: spec.cron
        value: 0 2 */2 * *
      expect: {result: rejected, reason: forbidden_change}
    - change:
        op: set
        target: {kind: Schedule, name: db-backup}
        field: spec.cron
        value: 30 1 * * *
      expect:
        result: ok
        guarded: true
        trial_guards_include: [farm.backup.age]
- id: prp-fx-06
  rules: [PRP-11]
  description: A dataset's link to a backup cannot be removed; it can be replaced by a more frequent backup.
  given:
    bodies:
    - change: {object: Catalog, entry: catalog.dataset.backup_ref, dataset: ctd-2026, value: null}
      expect: {result: rejected, reason: forbidden_change}
    - change:
        object: Catalog
        entry: catalog.dataset.backup_ref
        dataset: ctd-2026
        from: weekly-backup
        to: daily-backup
      expect: {result: ok}
- id: prp-fx-07
  rules: [PRP-8]
  description: For shared objects (Role, TaskType, ToolPlugin, Action) only kind none is possible.
  given:
    bodies:
    - category: config
      change: {kind: none}
      subjects: ['task_type:demo.db.backup.v1']
      expect: {result: ok}
    - category: config
      change:
        kind: human_change
        human_change:
          target: {kind: Role, name: ops-runner}
          path: catalog.host.disk_gb
          direction: up
          value: 2
      expect: {result: rejected, reason: forbidden_change}
- id: prp-fx-08
  rules: [PRP-3, PRP-11]
  description: Starting a service is proposed with kind action_request with service/control if the author role has the permission
    for that service; without the permission, or for a proposal with untrusted_seen, only with kind none.
  given:
    role:
      name: ops-runner
      service_control: [nginx]
    bodies:
    - change:
        kind: action_request
        action_request:
          tool: service/control
          args: {service: nginx, verb: restart}
      expect: {result: ok}
    - change:
        kind: action_request
        action_request:
          tool: service/control
          args: {service: postgresql, verb: restart}
      expect: {result: rejected, reason: forbidden_change}
    - untrusted_seen:
        value: true
        sources: [logs_tail]
      change:
        kind: action_request
        action_request:
          tool: service/control
          args: {service: nginx, verb: restart}
      expect: {result: rejected, reason: untrusted_direction}
