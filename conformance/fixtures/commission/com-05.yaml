# Calibration within a lens (COM-11), row com-05 of evals/README.md. The tenant demo, 180-day window. A review "warns" when it
# has a veto or a score of at most 1, and "passes" otherwise; the outcome table is in the text of COM-11.
id: com-05
rules: [COM-11]
version: v0.2
description: 'Only code computes the calibration of a lens executor, relative to its own lens: the share of matches minus the mean
  share for the lens in the tenant over 180 days. A veto lifted by people with a trial outcome other than worse and no confirmed
  attribution is a miss of the veto lens. People''s decisions do not enter the value calibration. A disputed attribution does not
  enter while the dispute is open, a canceled one leaves the calibration. Blind card answers enter the veto lens calibration with
  weight 1/inclusion_prob. Fewer than 10 cases give insufficient.'
given:
  tenant: demo
  executors:
    security: [bot_05, reviewer-a]
    value: [bot_12]
cases:
- id: com-05-a
  description: A veto lifted by people, trial better, no attribution; the vetoing executor gets a miss.
  given:
    proposal: {id: p_501, veto_overridden: true}
    reviews: {p_501: {security: {executor: bot_05, veto: true}}}
    trial: {proposal: p_501, outcome: better}
  expect:
    calibration_case: {executor: bot_05, lens: security, proposal: p_501, match: false, weight: 1}
- id: com-05-b
  description: People decline a proposal with too_risky; the value executor's calibration does not change, the security
    executor that passed it gets a miss.
  given:
    proposal: {id: p_502, state: declined, decline_reason: too_risky}
    reviews: {p_502: {security: {executor: bot_05, score: 3}, value: {executor: bot_12, score: 4}}}
  expect:
    calibration_cases_for: {bot_12: 0}
    calibration_case: {executor: bot_05, lens: security, proposal: p_502, match: false}
- id: com-05-c
  description: Value is calibrated only by the trial outcome; better matches a passing score, unchanged and worse are misses,
    undetermined, mixed and canceled give no case.
  given:
    reviews:
      p_503: {value: {executor: bot_12, score: 3}}
      p_504: {value: {executor: bot_12, score: 3}}
      p_505: {value: {executor: bot_12, score: 3}}
    trials: {p_503: better, p_504: unchanged, p_505: mixed}
  expect:
    calibration_cases:
    - {executor: bot_12, proposal: p_503, match: true}
    - {executor: bot_12, proposal: p_504, match: false}
    calibration_cases_for_proposal: {p_505: 0}
- id: com-05-d
  description: A disputed attribution does not enter while open; a canceled one leaves the calibration.
  given:
    reviews: {p_506: {security: {executor: bot_05, score: 3}}}
    trial: {proposal: p_506, outcome: better}
    attributions: [{proposal: p_506, state: disputed}]
  steps:
  - check: calibration cases of bot_05
    expect: {calibration_cases_for_proposal: {p_506: 0}}
  - occur: {attribution_of: p_506, to: canceled}
  expect:
    calibration_case: {executor: bot_05, proposal: p_506, match: true}
- id: com-05-e
  description: A blind answer "Would accept" on a sample item vetoed by bot_05, inclusion_prob 0.5, is a miss with weight 2.
  given:
    sample_item: {proposal: p_507, inclusion_prob: 0.5, answer: would_accept}
    reviews: {p_507: {security: {executor: bot_05, veto: true}}}
  expect:
    calibration_case: {executor: bot_05, proposal: p_507, match: false, weight: 2}
- id: com-05-f
  description: Nine cases give insufficient; the mean share is taken over the executors of the lens in the tenant.
  given:
    cases_in_window: {bot_05: 9, reviewer-a: 20}
  expect:
    calibration: {bot_05: insufficient}
    calibration_relative_to: lens security mean share of demo over 180 days
