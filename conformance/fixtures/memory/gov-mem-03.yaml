id: gov-mem-03
rules: [MEM-7]
description: 'Successor per the closed table of MEM-7. Only the core writes a fact offer (FactOffer): only active
  facts, rechecked at creation, no more than offer.max (100), only in the same tenant and only to the successor.
  Colleagues of the same role get no facts. Core records, the track record, sessions, the inbox and records of another tenant
  are never offered. A person does not approve the handover. The offer is open until the end of the leaver''s seal (open_until);
  if there is no successor by then, the facts are erased together with the seal. Numbers of identities, facts, tasks and proposals
  are shortened, as in the example in docs/bots.md.'
given: {tenant: demo}
cases:
- id: gov-mem-03-a
  given:
    leaving: {bot: bot_17, event: promoted_to_seat, worker: w_0042}
  expect: {offer_to: new identity of w_0042, bot_17_state: active}
- id: gov-mem-03-b
  given:
    leaving: {bot: bot_09, reason: removed_by_vote, seat: 'commission:3'}
    since: v0.2
  expect: {offer_to: 'new holder of commission:3'}
- id: gov-mem-03-c
  given:
    leaving: {bot: bot_07, reason: replaced_by_human, seat: 'commission:2'}
    then: {seat_assigned_before_seal_end: bot_19}
  expect: {offer_to: bot_19}
- id: gov-mem-03-d
  given:
    leaving: {bot: bot_07, reason: replaced_by_human, seat: 'commission:2'}
    then: {seat_assigned_before_seal_end: null}
  expect:
    recipient: waiting
    at_open_until: {offer: closed, facts: erased_with_seal}
- id: gov-mem-03-e
  given:
    leaving:
      bot: bot_41
      tenant: farm
      seat: farm-manager
      sections: [demo, demo2]
    then: {new_holder: bot_58}
  expect:
    offers:
    - {tenant: demo, to: bot_58}
    - {tenant: demo2, to: bot_58}
    cross_tenant_facts: 0
- id: gov-mem-03-f
  given:
    leaving: {bot: bot_17, reason: human_retire, worker: w_0042, worker_alive: true}
  expect: {offer_to: new identity of w_0042}
- id: gov-mem-03-g
  given:
    leaving: {bot: bot_31, reason: worker_gone, role: ops-runner}
    then:
    - enroll: {role: ops-runner, tenant: demo2}
      creates: bot_62
    - enroll: {role: ops-runner, tenant: demo}
      creates: bot_44
    - enroll: {role: ops-runner, tenant: demo}
      creates: bot_45
  expect:
    offer_to: bot_44
    not_offered_to: [bot_62, bot_45]
- id: gov-mem-03-h
  given:
    leaving: {bot: bot_23, reason: role_removed}
  expect: {recipient: null, facts: erased_with_seal}
- id: gov-mem-03-i
  given:
    leaving: {bot: bot_23, reason: tenant_offboarded}
    since: v0.2
  expect: {recipient: null}
- id: gov-mem-03-j
  description: Contents of the offer.
  given:
    facts: {active: 104, stale: 3, recheck_fails: 2}
    other: [core_records, service_record, sessions, inbox]
    leaving: {bot: bot_17, reason: human_retire, worker_alive: true}
  expect:
    offer_facts: 100
    offer_contains_only: facts
    stale_offered: 0
    colleague_offers: 0
    approval_cards: 0
