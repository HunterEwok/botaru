# The list of seats that can leave, the figures of its seats and the facts of commission seat holders (GOV-12). The demo
# commission of docs/improvements.md.
id: gov-mem-01
rules: [GOV-12]
version: v0.2
description: 'At opening the core writes an unchangeable list L: the commission seats with a holder except those whose holder has
  been on the commission less than protect_new, and never the manager seat; a holder under a people''s hold on the scope bot stays
  in L. For every seat the card shows how many times the holder recommended and vetoed and how many of these were confirmed and
  refuted. A seat of L that changes holder cancels the case. Commission seat holders write no facts, so nobody in L prepares a
  one-sided set of facts.'
given:
  tenant: demo
  commission:
    seat_role: commission-member
    seats:
      'commission:1': {lens: security, holder: bot_05, on_commission_days: 300}
      'commission:2': {lens: operational, holder: bot_07, on_commission_days: 150}
      'commission:3': {lens: cost, holder: bot_09, on_commission_days: 210}
      'commission:4': {lens: value, holder: bot_12, on_commission_days: 40}
  manager_seat: {state: held, holder: bot_40}
  queue: [{bot: bot_17, trigger_at: '2026-11-24T00:00:00Z'}]
cases:
- id: gov-mem-01-a
  description: The list of the example; seat 4 is protected by protect_new, and the manager seat is never in L.
  given:
    records_180d:
      bot_09: {recommended: 6, vetoed: 0, recommendations_better: 3, recommendations_worse: 1}
  steps:
  - stand: {op: loop.tick, loop: governance}
  expect:
    case:
      state: confirming
      snapshot:
        list: ['commission:1', 'commission:2', 'commission:3']
        seats_include: [{seat: 'commission:3', recommended: 6, vetoed: 0, confirmed: 3, refuted: 1}]
        proposed: null
    card: {kind: promotion_card, seats_shown: ['commission:1', 'commission:2', 'commission:3']}
- id: gov-mem-01-b
  description: A holder under a people's hold on the scope bot stays in L.
  given:
    holds: [{scope: {kind: bot, tenant: demo, name: bot_07}, set_by: human:bob}]
  steps:
  - stand: {op: loop.tick, loop: governance}
  expect:
    case:
      snapshot:
        list: ['commission:1', 'commission:2', 'commission:3']
- id: gov-mem-01-d
  description: The list does not change after opening; a seat of L that changes holder cancels the case.
  steps:
  - stand: {op: loop.tick, loop: governance}
  - call:
      port: P2
      op: seat.assign
      request: {seat: 'commission:5', bot: bot_23}
    by: operator
  - check: case list
    expect:
      case:
        snapshot:
          list: ['commission:1', 'commission:2', 'commission:3']
  - call:
      port: P2
      op: seat.vacate
      request: {seat: 'commission:2'}
    by: operator
  expect:
    case: {state: canceled, reason: seat_changed}
- id: gov-mem-01-f
  description: A seat holder writes no facts, before or during a case (PRF-1, MEM-6).
  cases:
  - id: gov-mem-01-f1
    given:
      manifest:
        kind: TaskType
        metadata: {name: review.cost.v1}
        spec: {purpose: review, memory: {facts: propose}}
      claimed_by_role: commission-member
    expect:
      apply: {result: rejected}
  - id: gov-mem-01-f2
    given:
      attempt: {type: review.cost.v1, acting_bot: bot_09, seat: 'commission:3'}
      result_facts: [{kind: observation, predicate: backup_late_on, subject: 'res:db1'}]
    expect:
      facts_written_by: {bot_09: 0}
      note: the facts field of a reviewer attempt is not read; the list L and its figures are taken from records only
