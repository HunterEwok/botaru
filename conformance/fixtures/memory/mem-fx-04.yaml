id: mem-fx-04
rules: [MEM-7]
description: 'When the successor exists, code copies the facts of the offer without a choice task: each fact is rechecked
  with the permissions of the successor''s role and copied into active with the mark inherited, the most recently used first,
  while the space has room (memory.facts.max_active, 100); untrusted_origin is kept. A role whose profile has no memory of
  scope bot gets nothing. No model takes part, and no task is enqueued. People do not approve the transfer; P2 and the digest
  show only numbers. Numbers of identities, facts and offers are shortened, as in the example in docs/bots.md.'
given:
  offer:
    id: fo_0005
    from_bot: bot_17
    facts: 15
    recipient: {bot: bot_31, state: waiting}
  recipient_role: {name: ops-runner, profile: worker}
  recipient_space: {active_facts: 80}
  tenant: demo
cases:
- id: mem-fx-04-a
  description: The successor appears; code copies the facts that pass the recheck in one transaction, without a task.
  given: {failing_recheck: [f_0320, f_0321, f_0322]}
  expect:
    tasks_enqueued: 0
    copies: 12
    copy: {state: active, inherited: {from_bot: bot_17, offer: fo_0005}}
    recipient: copied
- id: mem-fx-04-b
  description: The space has room for 8 facts; the 8 most recently used facts that pass are copied.
  given:
    recipient_space: {active_facts: 92}
  expect:
    copies: 8
    order: last_used_at descending
    recipient: copied
- id: mem-fx-04-c
  given:
    f_0313: {untrusted_origin: true}
  expect:
    copy_of_f_0313: {untrusted_origin: true}
- id: mem-fx-04-d
  given:
    recipient_role: {name: reporter, profile: reporter}
  expect: {copies: 0, recipient: copied, note: a profile without memory of scope bot}
- id: mem-fx-04-e
  description: Section T of the manager.
  given:
    offer:
      id: fo_0009
      from_bot: bot_41
      section: demo
      recipient: {bot: bot_58}
  expect:
    copies_in_tenant: demo
    tasks_enqueued: 0
- id: mem-fx-04-f
  steps:
  - call:
      port: P2
      op: bot.show
      request: {op: bot.show, id: bot_31}
    by: operator
  expect:
    transfer: {offered: 15, copied: 12}
    fact_contents_shown: false
    approval_cards: 0
