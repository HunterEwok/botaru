id: fx-mgr-breaker
rules: [MGR-14]
description: 'Global safeguard: three control.apply refusals in a row (the count is shared across tenants and reset by an applied
  operation) give no_control, epoch + 1 and the alarm alarm.manager.breaker with severity page. protected_target answers and
  conversion into a card do not count as refusals. There is no money pause of the seat: the manager line of each tenant holds the
  money (MGR-20).'
given:
  seat:
    id: farm-manager
    tenant: farm
    state: held
    holder: bot_41
    epoch: 9
    stop_reasons: []
cases:
- id: fx-mgr-breaker-a
  steps:
  - call:
      port: P3
      op: tools/call
      request:
        name: control_ops
        arguments: {tenant: demo}
    by: attempt
    expect: {result: rejected, reason: target_not_implicated}
  - call:
      port: P3
      op: tools/call
      request:
        name: control_ops
        arguments: {tenant: demo}
    by: attempt
    expect: {result: rejected, reason: protected_target}
  - call:
      port: P3
      op: tools/call
      request:
        name: control_ops
        arguments: {tenant: demo2}
    by: attempt
    expect: {result: rejected, reason: service_rate_limited}
  - call:
      port: P3
      op: tools/call
      request:
        name: control_ops
        arguments: {tenant: demo}
    by: attempt
    expect: {result: rejected, reason: target_excluded}
  expect:
    seat:
      state: stopped
      stop_reasons: [no_control]
      epoch: 10
    alarm: {type: alarm.manager.breaker.v1, severity: page, delivered_by: monitor_system}
    attempts_canceled_in: [demo, demo2]
- id: fx-mgr-breaker-b
  steps:
  - call:
      port: P3
      op: tools/call
      request:
        name: control_ops
        arguments: {}
    by: attempt
    expect: {result: rejected, reason: target_not_implicated}
  - call:
      port: P3
      op: tools/call
      request:
        name: control_ops
        arguments: {}
    by: attempt
    expect: {result: rejected, reason: control_rate_limited}
  - call:
      port: P3
      op: tools/call
      request:
        name: control_ops
        arguments: {}
    by: attempt
    expect: {result: ok}
  - call:
      port: P3
      op: tools/call
      request:
        name: control_ops
        arguments: {}
    by: attempt
    expect: {result: rejected, reason: target_excluded}
  expect:
    seat: {state: held}
    breaker_denials_in_row: 1
