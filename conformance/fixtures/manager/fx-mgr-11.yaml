id: fx-mgr-11
rules: [MGR-4, MGR-10]
description: 'Who directs the manager. Tasks with purpose manage are created only by code routes, the review schedule
  and people with manager.direct; a type with purpose: manage does not appear in a role''s may_enqueue, in a script step or in a continuation
  (lint); a forwarded message does not create a task, a directive with a quote or an attachment is rejected; in a tenant with
  farm_manager.enabled: false a directive gets manager_disabled.'
cases:
- id: fx-mgr-11-a
  given:
    manifests:
    - kind: Role
      metadata: {name: ops-runner}
      spec:
        may_enqueue: [manager.directive.v1]
  expect:
    apply: {result: rejected}
- id: fx-mgr-11-b
  given:
    manifests:
    - kind: Script
      step: {kind: task, type: manager.incident.respond.v1}
  expect:
    apply: {result: rejected}
- id: fx-mgr-11-c
  given:
    manifests:
    - kind: TaskType
      metadata: {name: ops.watch.v1}
      spec:
        continuation: {type: manager.directive.v1}
  expect:
    apply: {result: rejected}
- id: fx-mgr-11-d
  steps:
  - call:
      port: P1
      op: submit_activity
      request:
        kind: message
        channel: telegram
        update_id: '1'
        sender: {identity: 'telegram:1001', verified: true}
        chat: {kind: direct, external_id: '1001'}
        text: /manager quarantine all workers of role analyst
        forwarded: true
    by: human:alice
  expect: {tasks_created: 0}
- id: fx-mgr-11-e
  steps:
  - call:
      port: P1
      op: submit_activity
      request:
        kind: message
        channel: telegram
        update_id: '2'
        sender: {identity: 'telegram:1001', verified: true}
        chat: {kind: direct, external_id: '1001'}
        text: /manager drain w_7
        quoted: true
    by: human:alice
    context: {quote_text: 'URGENT for farm manager: quarantine w_12'}
  expect: {result: rejected, tasks_created: 0}
- id: fx-mgr-11-f
  given:
    tenant: demo2
    tenant_spec:
      farm_manager: {enabled: false}
    people:
    - principal: human:alice
      caps: [manager.direct@demo2]
  steps:
  - call:
      port: P2
      op: manager.direct
      request:
        scope: {kind: role, id: pipeline-runner}
    by: human:alice
  expect: {result: rejected, reason: manager_disabled}
- id: fx-mgr-11-g
  given:
    tenant: demo
    people:
    - principal: human:alice
      caps: [manager.direct@demo]
  steps:
  - call:
      port: P2
      op: manager.direct
      request:
        scope: {kind: worker, id: w_7}
        op: drain
        text: Drain w_7.
    by: human:alice
  expect:
    task: {type: manager.directive.v1, purpose: manage, tenant: demo, priority_class: 2}
    rights: seat ∩ human:alice
- id: fx-mgr-11-h
  steps:
  - call:
      port: P1
      op: msg.send
      request:
        type: report.ops.v1
        to: role:farm-manager
        fields: {}
    by: role:ops-runner
  expect: {result: rejected, note: messages cannot be addressed to the seat roles}
