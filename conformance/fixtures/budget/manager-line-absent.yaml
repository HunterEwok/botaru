id: fx-budget-manager-line-absent
rules: [BUD-15, MGR-20]
description: doctor shows the actual usage of each budget line over 30 days. For a tenant with farm_manager.enabled
  false there are no manager rows; the daily review is a separate row. The MGR-20 lint computes the price of three
  worst-case incident reads at the seat profile prices.
cases:
- id: bud-fx-07
  rules: [BUD-15]
  description: The manager is disabled, apply passes without a manager line, and doctor has no manager rows.
  given:
    tenant: demo2
    farm_manager: {enabled: false}
    budgets:
      month_eur: 100
      lines:
        review: {month_eur: 20}
  expect:
    apply: ok
    doctor_rows_present: [review]
    doctor_rows_absent: [manager, manager_daily_review]
- id: bud-fx-09
  rules: [MGR-20]
  description: 'The MGR-20 lint counts the manager''s incident reads as three reads of one worst-case incident: input of
    60 thousand tokens together and three answers at the seat profile''s max_output_tokens; the example profile prices are in euro per million
    tokens.'
  given:
    tenant: demo
    farm_manager: {enabled: true}
    seat_profile:
      name: seat-std
      max_output_tokens: 8000
      price: {input: 1.72, output: 8.6, checked: '2026-10-05'}
  expect:
    manager_incident_reads: {input_tokens: 60000, output_tokens: 24000, eur: 0.31}
