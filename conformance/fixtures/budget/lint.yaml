id: fx-budget-lint
rules: [BUD-9, BUD-13, BUD-2, GW-2]
description: 'Apply lint on money: the field max_tokens in manifests is rejected, tree_budget_eur is required for every
  type with a model (BUD-9); the monthly review line covers max_per_week times 4.4 times the review price of one proposal for
  every role, a lens profile with max_output_tokens above 2000 does not pass (BUD-13); a tree limit of a type with a model below the reserve of one call does not pass
  (tree_budget_below_call, GW-2, BUD-2).'
cases:
- id: bud-fx-10
  rules: [BUD-9]
  description: A task type with the field max_tokens does not pass apply.
  given:
    tenant: demo
    manifest:
      kind: TaskType
      metadata: {name: ops.investigate.v1}
      spec: {purpose: work, tree_budget_eur: 0.4, max_tokens: 4000}
  expect: {result: rejected, stage: apply, field: max_tokens}
- id: bud-fx-11
  rules: [BUD-9]
  description: A review type with a model without tree_budget_eur does not pass apply.
  given:
    tenant: demo
    manifest:
      kind: TaskType
      metadata: {name: review.risk.v1}
      spec: {purpose: review, model: true}
  expect: {result: rejected, stage: apply, field: tree_budget_eur}
- id: bud-fx-12
  rules: [BUD-9]
  description: A type with a model and tree_budget_eur passes; max_output_tokens lives in the profile, run_max_input_tokens
    among the run limits of the agent runtime.
  given:
    tenant: demo
    manifest:
      kind: TaskType
      metadata: {name: ops.investigate.v1}
      spec: {purpose: work, tree_budget_eur: 0.4}
  expect: {result: ok}
- id: bud-fx-13
  rules: [BUD-13]
  description: 'A role with insight.max_per_week 3, the review price of one proposal 3 lenses at 0.08 EUR; the need of
    3 x 4.4 x 0.24 = 3.168 EUR fits into the review line of 50 EUR.'
  given:
    tenant: demo
    lines:
      insight: {month_eur: 15}
      review: {month_eur: 50}
    roles:
    - name: ops-reader
      insight: {max_per_week: 3}
    lenses:
    - {type: review.risk.v1, tree_budget_eur: 0.08}
    - {type: review.cost.v1, tree_budget_eur: 0.08}
    - {type: review.privacy.v1, tree_budget_eur: 0.08}
  expect:
    result: ok
    need_eur: 3.168
- id: bud-fx-14
  rules: [BUD-13]
  description: The need of 3.168 EUR is above the review line of 2 EUR; apply is rejected, and doctor shows the missing amount
    rounded up to a euro cent.
  given:
    tenant: demo
    lines:
      insight: {month_eur: 15}
      review: {month_eur: 2}
    roles:
    - name: ops-reader
      insight: {max_per_week: 3}
    lenses:
    - {type: review.risk.v1, tree_budget_eur: 0.08}
    - {type: review.cost.v1, tree_budget_eur: 0.08}
    - {type: review.privacy.v1, tree_budget_eur: 0.08}
  expect: {result: rejected, stage: apply, doctor_shortfall_eur: 1.17}
- id: bud-fx-15
  rules: [BUD-13]
  description: A lens model profile with max_output_tokens above 2000 does not pass apply.
  given:
    tenant: demo
    lens_profile: {name: review-a, max_output_tokens: 8000}
  expect: {result: rejected, stage: apply, field: max_output_tokens}
- id: bud-fx-16
  rules: [BUD-9, BUD-2, GW-2]
  description: 'A type with a model whose tree_budget_eur of 0.01 is below the reserve of one call: the base slot profile
    with max_output_tokens 8000 at 4.00 EUR per million output tokens gives 0.032 EUR for the output alone. The type does not pass
    apply; with tree_budget_eur 0.05 it passes.'
  given:
    tenant: demo
    profile: {name: base-std, max_output_tokens: 8000, price: {output: 4.00}}
    role: {name: hello, claims: [hello.greet.v1], models: {base: base-std}}
    manifest:
      kind: TaskType
      metadata: {name: hello.greet.v1}
      spec: {purpose: work, worker_kind: agent, tree_budget_eur: 0.01}
  expect: {result: rejected, stage: apply, code: tree_budget_below_call}
