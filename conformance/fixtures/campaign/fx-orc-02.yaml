id: fx-orc-02
rules: [ORC-3, ORC-4]
description: 'kill -9 of the toolhost process in the middle of releasing an item. If the lease of the write call expired, the item becomes
  unknown and is not retried. With on_unknown: pause the campaign pauses with reason unknown, and a person decides.
  redrive of an item with an action is forbidden.'
given:
  tenant: demo
  campaign:
    id: k_01JB0000000000000000000002
    state: running
    template:
      kind: action
      action: cleanup_pipeline_tmp
      args: {older_than_days: 7}
    items:
    - {n: 1, resource: web1}
    - {n: 2, resource: db1}
    rollout:
      canary: 1
      after_canary: auto
      bake: 2m
      max_in_flight: 1
      max_failures: 0
      on_unknown: pause
      deadline: 2h
steps:
- stand: {op: loop.tick, loop: campaign}
- stand: {op: process.stop, process: toolhost, signal: 9, during: write_call, item: 1}
- stand: {op: clock.advance, by: lease_ttl}
- stand: {op: loop.tick, loop: campaign}
- call:
    port: P2
    op: task.redrive
    request: {op: task.redrive, id: t_1}
  by: operator
  note: t_1 is the task of item 1; P2 campaign.control has only pause and cancel, a retry is task.redrive, and it is forbidden for action.* (DLV-4, APR-7)
  expect: {result: rejected}
expect:
  item_1: {state: unknown, write_calls: 1, repeated: false}
  item_2: {state: pending}
  campaign: {state: paused, pause_reason: unknown}
  redrive: {result: rejected}
