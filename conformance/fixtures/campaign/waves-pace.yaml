id: fx-orc-waves-pace
rules: [ORC-15, ORC-4, ORC-10]
version: v0.2
description: 'Waves and pace of a campaign (ORC-15). The waves are cumulative shares of the items after the canary, and the
  next wave opens only when every item of the previous one is final and bake has passed. rate_per_min caps the releases
  in any 60 seconds; an item held back by a closed wave or the pace stays pending and spends nothing. The record field
  wave changes in the transaction that opens the wave, and the progress card is updated then.'
given:
  tenant: demo
  campaign:
    id: k_01JB00000000000000000000W1
    state: running
    approval_id: ap_01JB00000000000000000000W1
    template:
      kind: task
      type: pipeline.status.v1
    items:
    - {n: 1, resource: web1}
    - {n: 2, resource: db1}
    - {n: 3, resource: ctd1}
    - {n: 4, resource: web1}
    - {n: 5, resource: db1}
    rollout:
      canary: 1
      after_canary: auto
      bake: 2m
      max_in_flight: 4
      max_failures: 1
      on_unknown: pause
      deadline: 2h
      waves: ['50%', '100%']
      rate_per_min: 1
cases:
- id: orc-fx-15a
  rules: [ORC-15]
  description: 'Four items after the canary, waves 50% and 100%: wave 1 holds items 2 and 3. The canary item 1 ended ok
    and bake passed. The pace of one per minute releases item 2 first and item 3 a minute later; items 4 and 5 stay
    pending until wave 1 is final and bake has passed.'
  given:
    campaign_items:
    - {n: 1, state: ok, ended_at: '2026-10-12T09:00:00Z'}
    clock: '2026-10-12T09:02:00Z'
  steps:
  - stand: {op: loop.tick, loop: campaign}
  - stand: {op: clock.advance, by: 30s}
  - stand: {op: loop.tick, loop: campaign}
  - stand: {op: clock.advance, by: 31s}
  - stand: {op: loop.tick, loop: campaign}
  expect:
    released_order: [2, 3]
    pending: [4, 5]
    wave: 1
    attempts_spent_by_pending: 0
    card_updates_on_wave_change: 1
- id: orc-fx-15b
  rules: [ORC-15, ORC-10]
  description: 'Items 2 and 3 of wave 1 ended ok and bake passed: wave 2 opens, the record field wave becomes 2 in the
    same transaction, and the progress card is updated once for the wave change.'
  given:
    campaign_items:
    - {n: 1, state: ok, ended_at: '2026-10-12T09:00:00Z'}
    - {n: 2, state: ok, ended_at: '2026-10-12T09:05:00Z'}
    - {n: 3, state: ok, ended_at: '2026-10-12T09:06:00Z'}
    campaign_wave: 1
    clock: '2026-10-12T09:08:00Z'
  steps:
  - stand: {op: loop.tick, loop: campaign}
  expect:
    released: [4]
    pending: [5]
    wave: 2
    card_updates_on_wave_change: 1
- id: orc-fx-15c
  rules: [ORC-15]
  description: 'A proposal whose waves do not end with 100% is rejected and creates no record.'
  steps:
  - call:
      port: P1
      op: campaign.propose
      request:
        template: {kind: task, type: pipeline.status.v1}
        items:
          resources: [web1, db1]
        rollout: {waves: ['50%', '80%']}
    by: role:ops-reader
    expect: {result: rejected, reason: campaign_waves_invalid, records_created: 0}
