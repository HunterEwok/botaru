id: fx-orc-01
rules: [ORC-3, ORC-4]
description: Double release with two copies of the background loop campaign. Releasing an item with an action in one transaction
  moves the item from pending to released, creates a task action.<a> with approval_id, campaign_item and key system:campaign:<id>:<n>
  and one write call. Two copies of the loop that read one campaign record at the same time release each item
  exactly once.
given:
  tenant: demo
  action: {name: cleanup_pipeline_tmp, exclusive: resource}
  campaign:
    id: k_01JB0000000000000000000001
    state: running
    approval_id: ap_01JB0000000000000000000001
    template:
      kind: action
      action: cleanup_pipeline_tmp
      args: {older_than_days: 7}
    items:
    - {n: 1, resource: web1}
    - {n: 2, resource: db1}
    - {n: 3, resource: ctd1}
    rollout:
      canary: 1
      after_canary: auto
      bake: 2m
      max_in_flight: 2
      max_failures: 0
      on_unknown: pause
      deadline: 2h
steps:
- stand: {op: loop.tick, loop: campaign, copies: 2, concurrent: true}
- stand: {op: clock.advance, by: bake}
- stand: {op: loop.tick, loop: campaign, copies: 2, concurrent: true}
expect:
  per_item:
    tasks_created: 1
    write_calls: 1
    idempotency_key: system:campaign:k_01JB0000000000000000000001:<n>
    plugin_key: ap_01JB0000000000000000000001:<n>
  canary_released_alone: true
  in_flight_never_above: 2
  transition_pending_to_released_and_task_in_one_transaction: true
