id: fx-gateway-gateway
rules: [GW-10, GW-13]
description: A provider rate limit of the tenant's workspace is a wait, not a refusal (GW-10), and runs count in max_runs only
  with a model answer (GW-13). The reasons provider_quota and provider_config do not spend an attempt.
given: {tenant: demo}
cases:
- id: gw-fx-16
  rules: [GW-10]
  description: The provider asked the pair (demo workspace, pool family-a) to wait 60 seconds; the dispatcher does not give out
    a task of that pair, and the runtime is not started for it; a task of demo2 on the same pool is given out.
  given:
    provider_answer: {tenant: demo, pool: family-a, reason: provider_rate_limited, retry_after_s: 60}
    task: {type: ops.investigate.v1, slot: base, profile: base-std}
  expect: {claim_gives_task: false, waiting_reason: provider_quota, runtime_started: false, demo2_task_given: true}
- id: gw-fx-17
  rules: [GW-10, GW-13]
  description: A run whose first call gets a rate limit answer ends with provider_rate_limited without spending an attempt
    and without counting in max_runs; P4 keeps no rate limiter of its own.
  given: {provider_answer: {reason: provider_rate_limited, retry_after_s: 30}, answered: false}
  expect: {run_end_reason: provider_rate_limited, spends_attempt: false, counts_to_max_runs: false, p4_limiter: false}
- id: gw-fx-18
  rules: [GW-10]
  description: After the wait time the task of the pair is given out again.
  given: {provider_answer: {reason: provider_rate_limited, retry_after_s: 20}, clock_s: 21}
  expect: {claim_gives_task: true}
- id: gw-fx-19
  rules: [GW-13]
  description: A run that ended before the first model answer with a provider reason or core_unavailable does not count
    in max_runs.
  given: {max_runs: 2}
  expect: {runs_counted: 1, task_state: submitted}
  cases:
  - given: {reason: provider_unavailable, answered: false}
  - given: {reason: provider_rate_limited, answered: false}
  - given: {reason: provider_quota, answered: false}
  - given: {reason: provider_config, answered: false}
  - given: {reason: core_unavailable, answered: false}
  - given: {reason: runtime_error, answered: true}
- id: gw-fx-20
  rules: [GW-13]
  description: A provider configuration error gives provider_config; the attempt is not spent, it is not retried by timer,
    there is a code alarm, the circuit of the pair opens, and the task waits for a fix until deadline.
  given: {provider_error: key_revoked}
  expect:
    reason: provider_config
    spends_attempt: false
    timer_retry: false
    alarm: true
    breaker: open
    waits_until: deadline
- id: gw-fx-21
  rules: [GW-13]
  description: A task that waited for a provider and ended failed(deadline_exceeded) keeps the provider reason in its
    outcome.
  given: {waited_reason: provider_unavailable}
  expect: {state: failed, reason: deadline_exceeded, provider_reason: provider_unavailable}
