# Money of the manager lens (GOV-25, BUD-7). Prices are review type tree_budget_eur.
id: gov-fm-02
rules: [GOV-25]
version: v0.2
description: 'Veto lenses are reserved first and the manager lens is skipped when the review line runs short; the verdict is
  computed without it with the mark "without the manager''s vote". A tenant with commission seats keeps the governance line
  above 0.'
given:
  tenant: demo
  types:
    review.security.v1: {tree_budget_eur: 0.08}
    review.operational.v1: {tree_budget_eur: 0.08}
    review.cost.v1: {tree_budget_eur: 0.08}
    review.value.v1: {tree_budget_eur: 0.08}
    review.farm_manager.v1: {tree_budget_eur: 0.20}
  manager_seat: {state: held, holder: bot_41}
cases:
- id: gov-fm-02-a
  description: The review line has 0.35 EUR left; the four seat lenses are reserved, the manager lens is skipped.
  given:
    budget_lines: {review@demo: {remaining_eur: 0.35}}
    proposal: {id: p_201, kind: schedule, state: screened}
  steps:
  - stand: {op: loop.tick, loop: proposal}
  expect:
    reserved_eur: 0.32
    tasks_of_type: {review.farm_manager.v1: 0, review.security.v1: 1, review.operational.v1: 1}
    verdict_mark: without_manager_vote
- id: gov-fm-02-f
  description: 'Lint: a tenant with commission seats and governance line 0 fails apply.'
  cases:
  - id: gov-fm-02-f2
    given:
      manifest:
        kind: Tenant
        metadata: {name: demo}
        spec: {budgets: {lines: {governance: {month_eur: 0}}}}
      charter_has_seats: true
    expect: {apply: {result: rejected}}
