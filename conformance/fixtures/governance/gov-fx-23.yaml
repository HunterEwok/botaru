# The person's choice and "Reject" on the promotion card with a reason code (GOV-12, GOV-31) and its effect on the queue
# entry (GOV-14). Case gc_7 of the demo example is in confirming with the list of seats 1-3; alice has governance.confirm:commission.
id: gov-fx-23
rules: [GOV-12, GOV-31, GOV-14]
version: v0.2
description: 'Without a code proposal the person chooses the leaver from L: "Confirm" carries the seat in choice, and a seat
  outside L is refused with leaver_not_offered. "Reject" requires a reason code from governance-decline-reasons.yaml: not_now keeps
  the entry at the head and the next case waits swap_cooldown; the first wrong_candidate returns the entry to the head, the second
  removes it until the next success. A case is never reopened with another list.'
given:
  tenant: demo
  people:
  - {principal: human:alice, caps: ['governance.confirm:commission']}
  case:
    id: gc_7
    mode: removal
    candidate: bot_17
    state: confirming
    details_opened_by: [human:alice]
    snapshot:
      list: ['commission:1', 'commission:2', 'commission:3']
      proposed: null
  queue: [{bot: bot_17, state: in_case}, {bot: bot_18, state: queued}]
cases:
- id: gov-fx-23-a
  description: '"Reject" without a reason code is refused.'
  steps:
  - call:
      port: P1
      op: decide
      request: {subject_kind: governance_case, id: gc_7, decision: reject}
    by: human:alice
    card: promotion_card
    expect: {result: rejected, reason: reason_code_required}
  expect: {case: {state: confirming}}
- id: gov-fx-23-b
  description: '"Confirm" with a seat of L makes that holder leave; a seat outside L is refused.'
  steps:
  - call:
      port: P1
      op: decide
      request: {subject_kind: governance_case, id: gc_7, decision: confirm, choice: 'commission:4'}
    by: human:alice
    card: promotion_card
    expect: {result: rejected, reason: leaver_not_offered}
  - call:
      port: P1
      op: decide
      request: {subject_kind: governance_case, id: gc_7, decision: confirm, choice: 'commission:3'}
    by: human:alice
    card: promotion_card
  expect: {case: {state: effective, outcome: {leaver: 'commission:3'}}}
- id: gov-fx-23-d
  description: not_now keeps the entry at the head; the next case opens only after swap_cooldown.
  steps:
  - call:
      port: P1
      op: decide
      request: {subject_kind: governance_case, id: gc_7, decision: reject, reason_code: not_now}
    by: human:alice
    card: promotion_card
  - stand: {op: loop.tick, loop: governance}
    at: 29d
    expect: {new_cases: 0}
  - stand: {op: loop.tick, loop: governance}
    at: 30d
  expect:
    queue_head: bot_17
    new_case: {candidate: bot_17}
- id: gov-fx-23-e
  description: The first wrong_candidate returns the entry to the head with its own swap_cooldown (30 days, D-101), during which
    the next entry may go ahead; once bot_18 has left, no case opens before day 30; the second wrong_candidate for the same entry removes it.
  steps:
  - call:
      port: P1
      op: decide
      request: {subject_kind: governance_case, id: gc_7, decision: reject, reason_code: wrong_candidate}
    by: human:alice
    card: promotion_card
    expect: {queue_head: bot_17}
  - stand: {op: loop.tick, loop: governance}
    at: 1d
    expect: {open_case: {candidate: bot_18}, entry: {bot: bot_17, state: queued, cooldown_until: 30d}}
  - occur: {bot_retired: bot_18, reason: human_retire}
    expect: {case_of_bot_18: {state: canceled, reason: candidate_ineligible}, entry: {bot: bot_18, state: removed}}
  - stand: {op: loop.tick, loop: governance}
    at: 29d
    expect: {open_case: null}
  - stand: {op: loop.tick, loop: governance}
    at: 30d
    expect: {open_case: {candidate: bot_17}}
  - occur: {case: gc_9, candidate: bot_17, state: confirming}
  - call:
      port: P1
      op: decide
      request: {subject_kind: governance_case, id: gc_9, decision: reject, reason_code: wrong_candidate}
    by: human:alice
    card: promotion_card
  expect:
    queue: []
    entry_returns_with: next success of bot_17
