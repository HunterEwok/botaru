# Case flags (GOV-19). Each case seeds a case with the list L, the leaver that a person chose or code proposed, and reads the flags.
id: gov-fx-29
rules: [GOV-19]
version: v0.2
description: 'Code sets case flags only from spec/model/governance-flags.yaml, each by its when condition; flags decide nothing,
  so the same choice with and without a flag gives the same outcome. People see the flags on the promotion card next to the
  figures of every seat of L.'
given:
  tenant: demo
  people:
  - {principal: human:bob, caps: ['admin:governance', 'governance.confirm:commission']}
  case:
    id: gc_7
    snapshot:
      list: ['commission:1', 'commission:2', 'commission:3']
cases:
- id: gov-fx-29-a
  description: evicts_upheld_veto when the chosen leaver has a veto that people upheld.
  given:
    upheld_vetoes: {'commission:1': 1}
    chosen_leaver: 'commission:1'
  expect:
    flags_include: [evicts_upheld_veto]
- id: gov-fx-29-b
  description: From v0.3 evicts_top_calibrated when the proposed leaver has the best accuracy of its lens.
  given:
    version: v0.3
    accuracy: {'commission:1': 0.12, 'commission:2': 0.05, 'commission:3': 0.20}
    lenses: {'commission:1': value, 'commission:2': security, 'commission:3': value}
    chosen_leaver: 'commission:3'
  expect:
    flags_include: [evicts_top_calibrated]
- id: gov-fx-29-c
  description: Flags decide nothing; the same choice gives the same outcome whatever the flags.
  given: {replay_of: gov-fx-29-a, flags_suppressed_in_replay: true}
  expect: {same_outcome: true}
- id: gov-fx-29-d
  description: A flag code outside the registry is never written.
  expect:
    flags_subset_of_registry: governance-flags
