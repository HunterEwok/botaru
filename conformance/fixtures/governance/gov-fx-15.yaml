# No vote is lost (GOV-23). Case gc_7 of the demo example, round 2, expected = 5 voters; reissue_max 3, stuck_after 24h.
id: gov-fx-15
rules: [GOV-23]
version: v0.2
description: 'A round closes only with exactly one ballot from every voter of expected. A failed ballot is handed out again as a
  new attempt of the same task, on another worker of the role when one is live, at most reissue_max times. After reissue_max
  attempts that failed for a model cause the core writes a defaulted ballot: the seat of the voter''s enum that K2, K3 and then
  the order by the case opening seed would strike out last. More than half defaulted in a round gives defaulted_majority and the
  card line "outcome by code rule". An infrastructure cause never gives a ballot by rule: the round waits, after stuck_after the
  case is stuck and admins with admin:governance get governance_stuck once a day with "Pause" and "Cancel". expected shrinks only
  by a person''s action or a core loop, with voters_removed and audit.'
given:
  tenant: demo
  people:
  - {principal: human:bob, caps: ['admin:governance']}
  - {principal: human:alice, caps: ['governance.confirm:commission']}
  case:
    id: gc_7
    state: balloting
    round: 2
    list: ['commission:2', 'commission:3']
    expected: [bot_05, bot_07, bot_09, bot_12, bot_40]
  calibration: {'commission:2': -0.02, 'commission:3': 0.04}
  workers:
    w_0050: {role: commission-member, tenant: demo, slots: [seat]}
    w_0051: {role: commission-member, tenant: demo, slots: [seat]}
cases:
- id: gov-fx-15-a
  description: A ballot that failed on w_0050 is handed out again on w_0051 as a new attempt of the same task.
  steps:
  - model: {refusal: true}
    by: worker:w_0050
  expect:
    task: {key: 'system:governance:gc_7:2:bot_12', attempts: 2}
    attempt_2: {executed_by_worker: w_0051, acting_bot: bot_12}
    ballot_reissue: 1
- id: gov-fx-15-b
  description: Model refusals on all attempts give a defaulted ballot for the seat that K2-K3 strike out last.
  steps:
  - model: {refusal: true}
  - model: {refusal: true}
  - model: {forced_output: {choice: abstain}}
  - model: {refusal: true}
  expect:
    ballot: {voter: bot_12, defaulted: true, choice: 'commission:2', reissue: 3}
    flags: [defaulted]
    note: commission:2 has the lower calibration, so K2 would strike it out last
- id: gov-fx-15-c
  description: Three defaulted ballots of five give defaulted_majority and the card line.
  given:
    defaulted_voters: [bot_05, bot_12, bot_40]
  steps:
  - stand: {op: loop.tick, loop: governance}
  expect:
    flags: [defaulted, defaulted_majority]
    card: {kind: promotion_card, line: outcome by code rule}
- id: gov-fx-15-d
  description: An infrastructure cause never writes a ballot by rule; the round waits; after 24h stuck and governance_stuck to bob.
  given:
    workers:
      w_0050: {role: commission-member, tenant: demo, state: stale}
      w_0051: {role: commission-member, tenant: demo, state: stale}
    recorded: [bot_05, bot_09, bot_12, bot_40]
  steps:
  - stand: {op: loop.tick, loop: governance}
    at: 23h
    expect: {flags: [], ballot_of_bot_07: null}
  - stand: {op: loop.tick, loop: governance}
    at: 25h
  - stand: {op: loop.tick, loop: governance}
    at: 49h
  expect:
    flags: [stuck]
    stuck: {missing: [{voter: bot_07, reason: no_executor}]}
    ballots_defaulted: 0
    deliveries: {governance_stuck: {to: human:bob, count: 2, buttons: [pause, cancel]}}
    deliveries_to: {human:alice: 0}
- id: gov-fx-15-e
  description: '"Pause" sets a hold on the scope governance; "Cancel" cancels the case; a bot or a service cannot cancel.'
  cases:
  - id: gov-fx-15-e1
    steps:
    - call:
        port: P2
        op: hold.set
        request: {scope: {kind: governance, tenant: demo, name: gc_7}, effects: [no_claim], reason: manual, until: null}
      by: human:bob
      card: governance_stuck
    expect: {case: {hold: true, state: balloting}}
  - id: gov-fx-15-e2
    steps:
    - call:
        port: P2
        op: governance.cancel
        request: {op: governance.cancel, id: gc_7}
      by: human:bob
      card: governance_stuck
    expect: {case: {state: canceled, reason: human}, queue_head: bot_17}
  - id: gov-fx-15-e3
    steps:
    - call:
        port: P2
        op: governance.cancel
        request: {op: governance.cancel, id: gc_7}
      by: service:report-client
      expect: {result: denied}
    expect: {case: {state: balloting}}
- id: gov-fx-15-f
  description: expected shrinks by a people's hold on the scope bot; need is computed from the new set; voters_removed and audit.
  steps:
  - call:
      port: P2
      op: hold.set
      request: {scope: {kind: bot, tenant: demo, name: bot_07}, effects: [no_claim], reason: manual, until: null}
    by: human:bob
  - stand: {op: loop.tick, loop: governance}
  expect:
    case: {expected: [bot_05, bot_09, bot_12, bot_40], need: 3}
    flags: [voters_removed]
    audit: {command: governance.voters_removed, target: gc_7}
- id: gov-fx-15-g
  description: A model refusal does not shrink expected, and nobody counts a round without a vote.
  steps:
  - model: {refusal: true}
  expect:
    case: {expected_count: 5}
    round_closed_without_all_ballots: false
