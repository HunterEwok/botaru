- id: DLV-12
  title: A person knows they are talking to a bot
  status: active
  text: >-
    The channel driver declares `ai_disclosure`: `native`, if the external system itself shows that
    the sender is a bot, or `first_contact`. With `first_contact`, before the first model text, the
    core creates a delivery of the code text `ai_notice` to each principal at first contact in this
    channel and to each newly bound chat. The text says that this is a bot, that a model of an
    external provider writes the answers, where the conversation is stored and what the operator
    sees. The core stores on the pair (principal, channel) and on the chat binding the marker
    `ai_disclosure.ack` with the time when `ai_notice` became `delivered`. Deliveries with model
    text to this recipient wait in `planned` while the marker is absent; if `ai_notice` ended with
    `dead`, they end with `withheld(ai_notice_dead)`, the marker is not set, and on the next
    activity from this principal the core creates `ai_notice` again: the recipient is not left
    without answers forever. The channel command `/about` at any moment returns a code text: what
    this bot is, who the tenant and operator are, where `/mydata` is. The `privacy_notice` delivery
    with `notice_version` goes separately from `ai_notice` and does not depend on `ai_disclosure`
    (SEC). A driver without `ai_disclosure` fails `apply`.
  goal: C6
  check: [lint, adapter, blackbox]
  waivable: false
  version: v0.1
  profile: core
  decisions: [D-36]
