- id: ORC-10
  title: Items do not deliver by themselves, one progress card
  status: active
  text: >-
    Campaign items do not create their own deliveries to `origin` (DLV-6). A person gets an approval
    card (if one is needed), one progress card and one final summary; the channel draws all of it
    from the campaign record. The progress card is updated with a `card_update` delivery no more
    often than the ceiling from the channel manifest (once in 30 seconds by default) and when the
    campaign state changes, from v0.2 also when the wave changes. The mark of the summary equals the
    mark of the campaign (DLV-6, DLV-7). A campaign of a script `fanout` step creates no progress
    card and no summary of its own: its progress is shown by the script run card (SCR-8), while the
    approval card of a campaign with an action remains.
  goal: G6
  check: [adapter, blackbox]
  waivable: true
  version: v0.1
  profile: campaign
  decisions: [D-14]
  fixtures: [blackbox:campaign/no-item-delivery]
