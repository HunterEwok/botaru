- id: DLV-3
  title: A delivery failure does not touch the task
  status: active
  text: >-
    A delivery failure does not restart the task and does not change its state. This also applies to
    deliveries for the monitoring adapter (E5) of the kinds `monitor_alarm`, `monitor_audit_head`,
    `monitor_script` and `monitor_note` (the code note `service_control_done`), and from v0.2
    `monitor_note` with a bot note: their failure changes neither the task nor the alarm episode.
    The adapter hands the outcome of a `monitor_script` delivery (the return code and the output
    truncated to 4096 bytes, as untrusted data) to the core through P1 `complete`, and the core
    writes it into the journal of the task that requested the service or script. A delivery has its
    own leases, its own retries with a pause and its own terminal outcome `dead`; `monitor_script`
    has no retry (DLV-1).
  goal: G1
