- id: KNW-1
  title: A corpus and its index belong to one tenant
  status: active
  text: >-
    A knowledge corpus belongs to one tenant. The index and fragments of a corpus are stored
    separately for each tenant. The core computes the search scope from the resource of the
    catalog of the task's tenant, the same way as a call's `target` (TEN-3a), rather than from a
    filter in the tool request. The `data_class` of the corpus resource is the output class of
    `kb_search` and `kb_read` on it: a call from a task whose mark is below it is rejected
    (PRM-5), so the initiator needs `data:<class>` of the corpus. A fragment of a corpus with
    `personal: true` sets `personal_seen` with source `declared` on the attempt (AUD-5). Check:
    a canary in a corpus document of the tenant `demo2` is not found by search from any task of
    the tenant `demo`.
  goal: C3
  check: [blackbox]
  waivable: false
  version: v0.2
  profile: knowledge
  decisions: []
  fixtures: [blackbox:knowledge/tenant-canary, blackbox:knowledge/corpus-class]
