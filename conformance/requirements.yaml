- id: KNW-5
  title: Deleting a document deletes its fragments
  status: active
  text: >-
    Deleting a corpus document, the expiry of its file and deleting the whole corpus delete the
    fragments of this document in the per-tenant corpus index in C1 together with the file (C1
    `file.purge`), and the cached output of `kb_search` and `kb_read` that holds them (PRM-12).
    After deletion, search does not find them (D-97). Fragments live only in C1, so the check is a
    C1 store check; for the edge stores the check asks their `match` operation for the document
    canary and expects no fragment record, while copies that tasks quoted into sessions, memory or
    results are task content under their own retention and erasure.
  goal: C6
