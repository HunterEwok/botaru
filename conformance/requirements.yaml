    sandbox VM (DEP-1, DEP-2). An installation that does not claim the `sandbox` profile has no
    tier 2: its core rejects at `apply` a type or a tool of tier 2 and a plugin with `placement:
    sandbox` (MAN-11), and a single server without a separate VM never claims the profile.
