- id: REP-4
  title: A model paragraph to people carries no numbers
  status: active
  text: >-
    Every paragraph that the model writes to people as part of a report or summary (the digest
    paragraph, REP-2, and the text part of a group summary, DLV-15) carries no numbers: all numbers
