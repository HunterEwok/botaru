    that are currently running a task of a protected type. The core computes the set, the same one
    for proposals (PRP-3) and for seat operations. Hold, quarantine, drain, preemption and
    cancellation of a protected target by the seat are not applied immediately: the attempt gets the
    answer `protected_target`, the core creates a `control` card for the people of T, and a person's
