    provider; a call for a tenant's task goes only with its key and in its workspace, including a
    call on behalf of the manager seat in this tenant (MGR-24). A model handle is valid only while
    the lease it is bound to is alive: of the attempt or, with `model_attribution: per_profile`, of
    the worker (RT-3).
  goal: C3
