- id: PRP-19
  title: '"Executed" only by a verified link'
  status: active
  text: >-
    The core sets `realized` only in two cases. First: the object created by the "Accept" or "Lift
    veto" button of this proposal (an action approval or a script run) ran successfully. Second: an
    applied commit carries the line `Botaru-Proposal: <id>` from the farm patch or was linked to the
    proposal by a person through P2 `proposal.link_commit`, and the core verified it: the commit is
    applied (MAN-5), touches only the tenant's folder (PRP-8) and changes the fields named in the
    change to the accepted values or in the named direction. The executor or a person with
    `proposal.decide:<category>` can link a commit. A value that is already set or was set without
    such a link does not make the proposal executed.
