- id: ORC-12
  title: One released write call per resource
  status: active
  text: >-
    An action with `exclusive: resource` has no more than one released write call per tenant
    resource, counting campaign items and single approvals. An item on a busy resource waits with
    reason `resource_busy` instead of failing; a single approval on a busy resource runs after the
    resource is free.
  goal: G4
