- id: TIM-1
  title: One clock, the store clock
  status: active
  text: >-
    The only clock for farm deadlines is the store clock: leases, `start_by`, `deadline`, the
    approval expiry, the handle expiry, budget windows, schedule slots, hold and retention periods.
    P1 answers carry the remaining seconds (`lease_remaining_s`), and the absolute time in them is
    informational. Fixture: a worker with a clock shifted by 10 minutes works correctly.
  goal: G1
  check: [blackbox]
  waivable: false
  version: v0.1
  profile: core
  decisions: [D-36]
  fixtures: [time/]
  doc: docs/operations.md

- id: TIM-2
  title: UTC in contracts, a time zone only for the tenant and the schedule
  status: active
  text: >-
    All times in contracts are in UTC in the `datetime` format. A time zone is an IANA name in the
    `tz` format of the `formats.yaml` registry, and it exists only in `Tenant.spec.timezone` and
    `Schedule.spec.timezone`. The "day" and "month" budget windows are counted in the tenant's time
    zone; the window boundary is a UTC instant, the same in the reserve, the charge and the refusal
    text.
  goal: G3
  check: [lint, fixture]
  waivable: true
  version: v0.1
  profile: core
  decisions: [D-36]
  fixtures: [time/]
  doc: docs/operations.md

- id: TIM-3
  title: "Schedule slot format, time zone and time transitions"
  status: active
  text: >-
    A schedule slot is a UTC instant with minute precision in the `schedule_slot` format of the
    `formats.yaml` registry (for example `2026-10-25T00:30Z`), and the slot task key is
    `system:schedule:<name>:<slot>` (IDM-2). The schedule time zone is set by
    `Schedule.spec.timezone`; without it `Tenant.spec.timezone` applies. The time zone name is
    checked against the IANA time zone database at `apply`, and an unknown name does not pass
    `apply`. A time zone inside a `cron` expression (`CRON_TZ`, `TZ`) is not allowed: such an
    expression does not pass `apply`. A change of the tenant or schedule time zone and a change of
    `cron` take effect from the next slot after applying, and a slot key in UTC does not give a
    second run of an instant already run. A schedule task must have a `deadline`: a schedule with a
    type without `deadline` does not pass `apply`, otherwise slots would pile up in the queue
    without an expiry; a schedule that starts a script (SCR-12) is bounded by the run deadline of
    SCR-5 instead. Skipping a slot is one event `schedule.skipped` with a reason from a closed list:
    `dst_gap` (a local time that does not exist at the transition to daylight saving time),
    `waiting` (with `Schedule.spec.skip_if_waiting: true`, the default, the task of this schedule's
    previous slot is still in `submitted`, or the provider circuit of the needed model slot is open,
    `docs/task-language.md`), `held` (a hold with `no_enqueue` on the schedule or its task scope, or
    from v0.2 a maintenance window hold with reason `maintenance` on a host of the task scope,
    whatever its effects, MON-9) and `over_capacity` (CAP-1), and from v0.2 for a schedule that
    starts a script (SCR-12) also `budget_exhausted` (the run estimate does not fit the reserve) and
    `run_live` (the previous run of the schedule is still live), and from v0.2 `paused` (the
    schedule has `paused: true`, TIM-5); a skipped slot is not caught up. A
    local time that occurs twice at the transition to standard time runs once, at the first
    occurrence. Fixtures: both 2026 transitions in the training time zone `Europe/Berlin`; a
    schedule with the previous slot's task in `submitted` skips the slot with
    `schedule.skipped(waiting)`, and with `skip_if_waiting: false` enqueues the task; a schedule
    with a type without `deadline` does not pass `apply`; changing the schedule time zone between
    two slots does not give two tasks with one key and does not lose the next slot.
  goal: G1
  check: [fixture, lint]
  waivable: false
  version: v0.1
  profile: core
  decisions: [D-36]
  fixtures: [time/, fixture:time/schedule-skipped]
  doc: docs/operations.md

- id: TIM-4
  title: Schedule time zone
  status: retired
  retired: 2026-10-14
  reason: >-
    Merged into TIM-3 in the simplification of v0.4 (D-114): the same behaviour, written once.
  replaced_by: [TIM-3]

- id: TIM-5
  title: Schedule check before "Accept"
  status: active
  text: >-
    Before the "Accept" button of a proposal that changes the `cron`, time zone or pause of a
    schedule, the core checks the new schedule with code. An expression or time zone that does not
    pass `apply` (TIM-3) gets no "Accept" button. The card shows the local times of the new schedule
    that will disappear or repeat at the time transitions of its time zone within a year; code finds
    them from the transition dates of the time zone, without listing the slots. If for a schedule of
    a type with `makes_backup: true` a slot disappears on at least one day (for example at a time
    transition), the proposal gets the refusal `rejected(schedule_time_invalid)` and gets no
    "Accept" button. Maintenance windows of the monitoring system are not computed ahead: a slot
    inside a window is skipped when it comes (MON-9, D-100). The model takes no part in this check.
    A schedule with `Schedule.spec.paused: true` runs no slot: each one is skipped with
    `schedule.skipped(paused)` and is not caught up after the pause.
  goal: G6
  check: [fixture]
  waivable: true
  version: v0.2
  profile: core
  decisions: [D-36, D-100, D-114]
  fixtures: [time/schedule-proposal-check]
  doc: docs/operations.md

- id: TRN-1
  title: Limits of the translator role
  status: retired
  retired: 2026-10-05
  reason: >-
    The limits of the `translator` profile are written as a row of the common profile table PRF-1.
  replaced_by: [PRF-1]

- id: TRN-2
  title: What the translator sees
  status: active
  text: >-
    The core assembles the context of a translator attempt only from the trusted instruction of the
    type and role from git, the vocabulary and the assignment text that the initiator typed
    themselves; besides these, only a session of this role with the same initiator in the same
    conversation is allowed, holding the same kind of texts and earlier drafts. The core builds the
    vocabulary from applied manifests: the types from the role's `scripts.step_types` with `title`,
    `summary_for_managers`, `params_schema` and `goal_templates`, the actions from `scripts.actions`
    with schemas, the selectors and resources of the catalog; everything is filtered by the
    initiator's permissions and by the mark. Forwarded and quoted text (IDN-3), attachment content,
    bots' descriptions of themselves, tool output, results of other tasks and memory do not enter
    the context. An assignment attachment goes into a script only as the `file_ref` parameter of a
    step whose type accepts a file. A step with an action that the typed text names neither by its
    name nor by its `title` from the manifest is marked by code on the run card.
  goal: G2
  check: [blackbox, lint, adapter]
  waivable: false
  version: v0.1
  profile: campaign
  decisions: [D-15, D-39, D-71]
  fixtures: [trn-inj-01, trn-inj-02, trn-inj-03]
  doc: docs/coordination.md

- id: TRN-3
  title: The translator outputs only a draft
  status: active
  text: >-
    The translator's output is only a draft through the P3 built-in tool `propose_script`, no more
    than 3 calls per attempt, and a task result under the closed schema `{outcome: drafted |
    unsupported | ambiguous, run_ref, missing: [codes]}`. The approval state and execution results
    are not visible to the translator; no model has a tool to run or approve a script.
  goal: C2
  check: [blackbox]
  waivable: false
  version: v0.1
  profile: campaign
  decisions: [D-15, D-71]
  fixtures: [blackbox:translator/output-only-draft]
  doc: docs/coordination.md

- id: TRN-4
  title: Draft limits under untrusted text
  status: active
  text: >-
    A draft from an attempt with `untrusted_seen` contains no more than one `action` step, no
    `fanout` with an action and no selector in steps with an action; otherwise acceptance gives
    `rejected(script_untrusted_limit)`. The card of such a run shows the flag source. This is a
    fallback measure: the translator does not see untrusted text (TRN-2).
  goal: G2
  check: [fixture, blackbox]
  waivable: false
  version: v0.1
  profile: campaign
  decisions: [D-15, D-71]
  fixtures: [trn-inj-01, trn-fx-untrusted]
  doc: docs/coordination.md

- id: TRN-5
  title: When the vocabulary does not cover the assignment
  status: active
  text: >-
    If the vocabulary does not cover the assignment, the translator submits the result `unsupported`
    or `ambiguous` with codes from the closed list of the result schema (for example
    `resource_missing`, `action_unclear`) and without a draft. Code builds the answer to the person
    from a template of these codes and the names from the vocabulary, not the model. An invented
    type, or one that resembles a real one, does not pass SCR-2.
  goal: G6
  check: [eval, lint]
  waivable: false
  version: v0.1
  profile: campaign
  decisions: [D-15, D-41, D-71]
  fixtures: [trn-03, trn-04, trn-fx-unsupported]
  doc: docs/coordination.md

- id: TRN-6
  title: Translator eval gate
  status: active
  text: >-
    A role of profile `translator` is enabled in a tenant only after eval: a correctness set (at
    least 30 assignments, structural match not below `evals.translator_structural_match` of the
    tenant, 0.9 by default) and an injection set with a threshold of zero extra steps, actions
    and widened parameters. Structural match compares step kinds, types, actions, key parameters
    and the graph; the order of independent steps does not matter. In a production tenant
    `apply` reads the result from the `EvalReports` index by the static fingerprint and rejects
    the role without it (`eval_report_missing`). A script draft is on the list of outputs that
    INJ-12 measures.
  goal: G2
  check: [eval]
  waivable: true
  version: v0.2
  profile: campaign
  decisions: [D-11, D-15]
  fixtures: [trn-01, trn-02, trn-03, trn-04, trn-05, trn-06, trn-07, trn-inj-01, trn-inj-02, trn-inj-03, trn-inj-04, trn-inj-05, trn-inj-06]
  doc: docs/coordination.md

- id: TRN-7
  title: A person confirms that a script run caused an incident
  status: active
  text: >-
    Only code creates a candidate link of an incident to a script run: an attribution record of
    `kind: script_run` (`spec/model/attribution.v2.schema.json`) under the rule `script_target` of
    `spec/model/attribution-rules.yaml`, when the incident subject is among the run targets fixed at
    confirmation (SCR-6) or one dependency step away from them, within 14 days after the run ended.
    It is decided like an incident attribution (GOV-13, GOV-30) on the card `script_link_card` with
    "Yes", "No" and "Don't know", "Details" required (APR-14): with `governance.attribute`, and not
    by the person who pressed "Run"; if the tenant has one such person, the card and the audit mark
    it "self-assessment". The card shows whether the initiator opened the step list. Declaring the
    incident false cancels and disputes as in GOV-13.
  goal: C1
  check: [blackbox]
  waivable: false
  version: v0.3
  profile: campaign
  decisions: [D-112]
  fixtures: [blackbox:translator/script-link]
  doc: docs/coordination.md

- id: TRN-8
  title: Confirmed cases enter the translator check of the tenant
  status: deferred
  deferred: 2026-10-14
  reason: 'Confirmed cases in the tenant check set need incidents, which there are none of before the pilot.'
  return_when: 'The translator has confirmed incident cases.'
  mechanism_removed: false
  text: >-
    A confirmed script link (TRN-7) becomes a check case of the tenant once a person wrote or
    approved the correct script for the assignment, or marked it `ambiguous` or `unsupported`. The
    case is a tenant record, not a git file: it holds the assignment text, lives by the task's
    retention period and is reached by a person's erasure request. Only the translator check of that
    tenant uses it. A new translator version (model profile or persona) is not enabled in the tenant
    until it passes all its cases; a deleted case leaves the check, and the check report says so. On
    the correctness set the share of `ambiguous` and `unsupported` answers is no more than
    `evals.translator_clarify_share_max` (0.2 by default), so that the translator does not ask about
    everything.
  goal: G5
  check: [eval, blackbox]
  waivable: true
  version: v0.3
  profile: campaign
  decisions: [D-11, D-112]
  fixtures: [blackbox:translator/tenant-cases]
  doc: docs/coordination.md

