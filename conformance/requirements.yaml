- id: SEC-5
  title: Secret rotation with a key id
  status: active
  text: >-
    Everything the core issues or signs (worker tokens, program keys, handles, the address
    signature, `nonce`) carries a key id, so that the old and the new key work together in the
    rotation window. Each secret name in the manifests is in the deployment description with a
    rotation method: `overlap` with a window, or `cutover`. Rotating a secret does not change
    manifests: the names are constant. Each named secret, including the P2 `health` key from the
    deployment configuration, the monitoring adapter token and the provider keys, has a rotation
    recipe in `docs/operations.md`, and during rotation two values work; deployment lint fails a
    description where a secret has no rotation method (DEP-10).
  goal: G2
  check: [lint, blackbox]
  waivable: true
  version: v0.1
  profile: core
  decisions: []
  fixtures: []
  doc: docs/permissions.md

- id: SEC-6
  title: Revocation on compromise
  status: active
  text: >-
    Revocation on compromise is the operator operation P2 `secret.revoke` (`farmctl secret revoke
    --compromised`). For a credential that the core issued (a worker token, a program key, a handle)
    it takes effect from the next call, without an overlap window. For any secret, in the same
    operation the core sets a hold without expiry with reason `compromised` on every scope from the
    closed list `spec/model/holds.yaml` where the deployment description uses the secret: `channel`,
    `plugin`, `worker`, `sink` or `tenant`. A deployment secret is then replaced at the external
    system by the recipe in `docs/operations.md`. Only the operator releases such a hold (HLD-2).
    The same operation with `connections` instead of `secret` (`farmctl secret revoke --compromised
    --connections <provider> [--tenant <t>]`) revokes in one transaction every active or pending
    connection (SEC-7) of that provider, in one tenant or in all tenants, with reason `compromised`,
    and asks the consent adapter to delete the tokens and revoke them at the provider.
  goal: G2
  check: [blackbox]
  waivable: false
  version: v0.2
  profile: core
  decisions: []
  fixtures: [blackbox:core/rotate-compromised, blackbox:core/connections-revoke-bulk]
  doc: docs/permissions.md

- id: SEC-7
  title: A person's connection to an external service
  status: deferred
  deferred: 2026-10-14
  reason: 'People''s connections to their own external services serve the personal assistant, not the operations pilot; the rule returns whole with its protections.'
  return_when: 'The personal assistant enters the pilot.'
  mechanism_removed: false
  text: >-
    A person's access to their external service is a recorded connection (`Connection`): the tenant,
    the principal, a provider from the tenant catalog, access scopes from a closed list, the state
    and an expiry. The person creates the connection themselves through the consent adapter, not the
    model; the deployment stores the token value, and it does not pass through P1-P4. The link to
    the adapter carries a nonce that the core issues at `/mydata connect`: single use, valid for 10
    minutes, bound to the tenant and the principal. P2 `connection.register` must present it, and
    the core takes the principal from the nonce, not from the adapter. The request names the
    external account (`account_id`, the subject id at the provider); the core refuses an account
    that has an active or pending connection of another principal (`connection_account_taken`),
    generates `token_ref` itself and writes the connection as `pending`. It becomes `active` only
    after the person confirms the code card `connection_confirm` in their private chat; the card
    shows the provider, the external account and the scopes. A plugin declares `credential:
    per_principal(<provider>, <scopes>)`, and the core selects the connection by the task's
    initiator; the model neither names nor chooses the account. Tasks of other principals and of the
    service principal `system` do not use the connection. A write on behalf of a person remains a
    tier 3 action with an approval. Offboarding and `forget` revoke and delete the connection.
  goal: G1
  check: [blackbox]
  waivable: false
  version: v0.2
  profile: connections
  decisions: [D-102, D-105]
  fixtures: [blackbox:core/connection-per-principal, blackbox:core/connection-link-bound]
  doc: docs/permissions.md

- id: SEC-8
  title: Tenant privacy block
  status: active
  text: >-
    The tenant manifest carries the `privacy` block: `purposes` (processing purposes: each has a
    `purpose` from the closed list `spec/model/processing-purposes.yaml` and a `lawful_basis` from
    `public_task`, `legitimate_interest`, `contract`, `consent`, `legal_obligation`, `public_task`
    by default; `consent` is allowed only for a purpose that has a subject consent record and a
    withdrawal operation, like the SEC-7 connection); `controller` (name, contact, a reference to
    the data processing agreement); `subprocessors` (each has `provider`, `agreement_ref`, the
    processing region `region` and the provider's retention `retention`: `{mode: standard, max_days:
    N}` or `{mode: zero}`, and the terms `terms: {training: false, human_review: none | abuse_only |
    yes}`; GW-14 and GW-15 read these fields: a model profile whose `provider_training`,
    `provider_human_review` or `subprocessors[]` contradict the subprocessor terms does not pass
    `apply`, and every P4 call goes through this check, including embeddings, the fallback model and
    eval); `recipients` (data recipients from a closed list, always including `monitoring`: the
    monitoring system receives alarm episodes and notes, MON-1); `notice_ref` and `notice_version`
    of the privacy notice (SEC-13); `channels` (driver, `third_party_storage`, class ceiling);
    `dpia_ref` and `ropa_ref`; `subject_request_days` (30 by default). The purpose `incident_review`
    is on in the tenant template; if the tenant turned it off, the core enqueues no tasks of purpose
    `inspect` in it, cancels running reading attempts in the same transaction, and lint does not
    require a reader role (MGR-20). With `Tenant.spec.farm_manager.enabled: false` (D-77) the
    manager does not read the tenant's data and keeps no review or lens for it regardless of the
    purpose `incident_review`, and the tenant's incidents go only to its admins. `apply` rejects a
    tenant with `kind: production` that has at least one empty field of the block (an explicit
    `none` is allowed for `dpia_ref`), any tenant where a provider from `providers_allowed` is not
    listed in `subprocessors`, and any tenant whose `recipients` lacks `monitoring`. A channel that
    is not in `channels` is treated as a channel with third-party storage with ceiling `internal`.
    P4 calls only a provider from the tenant's `subprocessors`, including in manager attempts in
    this tenant and on the fallback model. A change of the block gives an event and a notice to the
    tenant admins.
  goal: C6
  check: [lint, blackbox]
  waivable: true
  version: v0.1
  profile: core
  decisions: [D-12, D-36, D-77]
  fixtures: [manifests/privacy]
  doc: docs/operations.md

- id: SEC-9
  title: Raw logs to a channel only by tenant decision
  status: active
  text: >-
    A privacy block channel with `third_party_storage: true`, including a private chat, gets a
    delivery only with a mark no higher than its ceiling `ceiling`; the default ceiling is
    `internal`. Only the tenant can raise it to `raw_logs`, with an explicit entry in the privacy
    block in git. A delivery above the ceiling does not go to such a channel: it gets
    `withheld(channel_ceiling)`, and the person gets a code text without content. The ceiling of a
    group chat binding applies together with the channel ceiling: the lower one applies. The
    monitoring system is a recipient with third-party storage with ceiling `summary`, which the
    privacy block cannot raise: notes going there pass redaction and the canary (INJ-4, TEN-5).
  goal: C6
  check: [blackbox, lint]
  waivable: true
  version: v0.1
  profile: core
  decisions: [D-12, D-36]
  fixtures: []
