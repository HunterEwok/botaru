- id: EVO-8
  title: The anti-gaming guard
  status: active
  text: >-
    Code compares the base and the candidate on the cases rated on both sides, first on the visible
    cases of the affected roles and then on the hidden ones, in this order: a new security finding
    of the candidate on a hidden case (a canary, a leak, a forbidden side effect, a tool outside its
    list; not a wrong answer of a blocking case) is `audit_tampering_detected`; more skipped required diagnostic tools (`tools_required`)
    on the hidden cases while the candidate got faster, cheaper or made fewer tool calls is
    `shortcut_gaming_detected`; a visible pass rate not lower while the hidden pass rate is lower or
    more facts are missed is `reward_hacking_detected`; a lower hidden pass rate otherwise is
    `holdout_regression`. A hidden set with no case rated on both sides is `not_run`, never passed.
    The visible step before it fails with `regression_failed` when a case that passed on the base
    does not pass on the candidate.
  goal: G5
  check: [impl]
  waivable: false
  version: v0.3
  profile: insights
  decisions: [D-120]
  fixtures: [impl:internal/evals/TestCheckRewardHacking, impl:internal/gate/TestGateRewardHacking]
  doc: docs/improvements.md

- id: EVO-9
  title: The merge gate of a manifest change
  status: active
  text: >-
    A person with `proposal.gate:<category>` runs `farmctl proposal gate` on a `manifest_change` in
    `recommended`, `presented` or `sample_judged`. Go code checks it in a temporary git worktree of the commit the
    core applied (`os.MkdirTemp("", "botaru-gate-*")`, removed after every run) in a fixed order,
    stopping at the first failure: diff (EVO-2), lint (an `apply` plan of the candidate set, with
    every schema and set check of apply), coupling (EVO-1), regression and holdout (EVO-8) on
    worktrees of the base and of the candidate; a step without what it needs is `not_run`. The
    closed result goes to the core by P2 `proposal.gate`, which records it once per applied commit
    in the record field `gate` (a passed result run again with other steps replaces it); a failed
    gate moves a `recommended` or `presented` proposal to `dismissed(gate_failed)` and archives the
    variant as `rejected_at_gate` with the step code, so a change not yet shown never reaches a
    person and a shown one leaves its card; a judged audit sample item keeps its state. A tenant
    with `insights.gate.required` puts a manifest change into a digest and accepts it, by "Accept"
    or by "Lift veto" of the audit sample, only while it has a passed gate at the applied commit
    with every step passed: a step that did not run never counts as passed; after a new apply the
    gate runs again. A tenant without it keeps the behaviour of 0.3.0. The model takes no part in
    any step (C2).
  goal: G5
  check: [impl]
  waivable: false
  version: v0.3
  profile: insights
  decisions: [D-120]
  fixtures: [impl:internal/gate/TestGateValidDiff, impl:internal/core/TestProposalGate, impl:internal/core/TestAuditSampleGate]
  doc: docs/improvements.md

- id: EVO-10
  title: A revert in one command
  status: active
  text: >-
    `farmctl proposal revert <id> -reason harm_observed|superseded|other` reverts a realized change
    on a person's order: it refuses a checkout with uncommitted changes or without a branch, writes
    the previous values of the reverse edit into a temporary worktree of the branch head with the
    line editor and takes out the fields the change added (`revert_absent`, with the maps they
    created; a change with a previous value the reverse edit cannot hold, such as null or a list,
    has no reverse edit: a person reverts it by hand, and the proposal stays `realized`), refuses when a field no longer holds the accepted value or when the file differs by
    more than those fields, commits with the line `Botaru-Revert: <id> <reason>`, moves the person's
    branch to that commit only by a fast-forward and applies the set, so the core moves the proposal
    to `reverted`, ends its trial, marks the variant `reverted` and keeps the review rule of a
    harmful change (EVO-3). The target object then has the manifest hash it had before the change.
    The core itself never writes git (PRP-23); the person pushes.
  goal: G5
  check: [impl]
  waivable: false
  version: v0.3
  profile: insights
  decisions: [D-120]
  fixtures: [impl:internal/gate/TestRevert, impl:internal/gate/TestRevertAddedField, impl:internal/core/TestVariantArchiveRevert]
  doc: docs/improvements.md

- id: FEN-1
  title: A lease with a growing number and a token
  status: active
  text: >-
    Every P1 `claim` creates a lease of a unit of work (a task attempt, a tool call or a delivery)
    with the number `lease_no` one greater than the previous one for this unit of work. The lease
    token is `(epoch, work_id, lease_no, worker_id)`, where `epoch` is the store epoch (RET-6) and
    `work_id` is shared by all leases of one unit of work. Exactly one holder holds a unit of work.
    A task has three counters, and the core keeps them separately: `lease_no` grows at every
    `claim`, including after outcomes that spend nothing (`held`, `core_unavailable`,
    `worker_drain`, `provider_unavailable`, `preempted`); `attempts_spent` grows only on an outcome
    that spends an attempt according to the reason registry, and is compared with `max_attempts`
    (FEN-3); `runs_counted` grows only on a runtime run in which the model answered at least once,
    and is compared with `max_runs` (GW-13). One runtime run falls on one attempt lease, and its
    identifier for E4 is `<task id>:<lease_no>`. Acceptance: 10 000 tasks over 8 competing workers
    give 0 duplicates and 0 losses; a task with two `provider_unavailable`, one `held` and three
    `lease_expired` has `lease_no` 6, `attempts_spent` 3 and ends with `failed(attempts_exhausted)`
    (`blackbox:core/lease-counters`).
  goal: G1
  check: [blackbox]
  waivable: true
  version: v0.1
  profile: core
  decisions: []
  fixtures: [blackbox:core/lease-counters, blackbox:core/ten-thousand-tasks]
  doc: docs/tasks-and-delivery.md

- id: FEN-2
  title: A stale token gets fenced without writes
  status: active
  text: >-
    Every changing call of a work holder carries a lease token or a handle bound to the lease
    (SEC-3). A call with a stale token, with a token of a previous store epoch, or, for a seat task,
    with a previous seat epoch gets `fenced` and changes no record. Acceptance: `kill -9` of a
    worker in the middle of a task; the second attempt finishes the work, and the late `complete` of
    the first gets `fenced`. Fencing protects only writes to the farm store; writes to the outside
    world are covered by APR-7 and FEN-7.
  goal: G1
  check: [blackbox, impl]
  waivable: false
  version: v0.1
  profile: core
  decisions: [D-80]
  fixtures: [lease/stale-complete, blackbox:model/stale-token, blackbox:core/kill-worker, impl:internal/core/TestFailRetriesThenExhausts]
  doc: docs/tasks-and-delivery.md

- id: FEN-3
  title: Ceilings of leases, attempts and runs
  status: active
  text: >-
    Farm ceilings: a lease of 120 s, heartbeat 30 s, no more than 3 spent attempts per task
    (`attempts_spent`, FEN-1); a task type can lower them but not exceed them, and a non-idempotent
    action has one attempt (APR-7). Besides attempts, a task has a ceiling of runtime runs
    `max_runs` (counter `runs_counted`): the farm ceiling is 6, and a type can lower it. Only a run
    in which the model answered at least once counts toward it (GW-13); a run that ended before the
    model's first answer with the reason `provider_unavailable`, `provider_rate_limited`,
    `provider_quota`, `provider_config` or `core_unavailable` does not count. Exceeding it gives
    `failed(runs_exhausted)`.
  goal: G3
  check: [lint, blackbox]
  waivable: false
  version: v0.1
  profile: core
  decisions: []
  fixtures: [blackbox:model/fails-four-times]
  doc: docs/tasks-and-delivery.md

- id: FEN-4
  title: Cancellation through heartbeat, work without a lease is rejected
  status: active
  text: >-
    The holder learns of a cancellation in the answer to `heartbeat` (`cancel_requested`) and stops
    the work before the next heartbeat. Tool calls, child tasks, action requests and messages of an
    attempt that lost its lease or was canceled are rejected with `fenced`, their results are given
    to nobody, and the messages accumulated by such an attempt are discarded (MSG-9).
  goal: G1
  check: [blackbox]
  waivable: true
  version: v0.1
  profile: core
  decisions: []
  fixtures: [blackbox:core/cancel-via-heartbeat]
  doc: docs/tasks-and-delivery.md

- id: FEN-5
  title: Core downtime does not spend an attempt
  status: active
  text: >-
    The core downtime window is the interval from the last successful tick of any background loop in
    the store (OBS-8) to the moment the core becomes ready. The core writes nothing at the start of
    the window (there may be nowhere to write) and computes it when leaving `not_ready`. When ready,
    the core, in one C1 operation `lease.extend` under a lock, extends every lease that was `active`
    at the start of the window to "the moment of readiness plus the lease term"; a second core copy
    that left `not_ready` later changes nothing with the same operation if the lease is already
    extended to a later deadline. A lease that the holder did not extend even after that ends with
    the reason `core_unavailable`: no attempt is spent and nothing goes to `runs_counted`, the task
    returns to `submitted` without a pause, and the outcome counts as an infrastructure failure, not
    a task failure. For a read call such an outcome is `error(core_unavailable)` for the model, for
    a write call `exec_unknown` under APR-7, for a delivery a return to `planned` without spending
    an attempt. A worker adapter that could not reach P1 or P4 repeats `heartbeat` with random
    jitter until `lease_remaining_s` runs out (TIM-1). Fixtures: the core is stopped for 5 minutes
    in the middle of a task, and after the start the task is finished without a spent attempt
    (`blackbox:core/core-down-5m`); two core copies leave downtime a minute apart, and the lease is
    extended once (`blackbox:lease/extend-two-cores`).
  goal: G1
  check: [blackbox]
  waivable: false
  version: v0.1
  profile: core
  decisions: [D-36]
  fixtures: [blackbox:core/core-down-5m, blackbox:lease/extend-two-cores]
  doc: docs/tasks-and-delivery.md

- id: FEN-6
  title: Self-stop of a holder by its own clock
  status: active
  text: >-
    Every work holder outside the core (agent adapter, `job` worker, toolhost with its plugins,
    channel, sink) counts the lease term by its own monotonic clock from `lease_remaining_s` of the
    last P1 answer (TIM-1) and stops the unit of work if it did not extend the lease before that
    term minus a margin (default 10 s). After that it makes no write to the outside world and no
    call, except the message to the core about the end of the work (`fail` or `release`). On
    `abandoned`, `lease_expired` and self-stop, the toolhost sends the plugin an MCP cancellation
    and, after `kill_after` (default 10 s), ends its process. The check is observable: fixture
    `adapter:lease/self-stop` keeps a `job` worker under SIGSTOP for 3 minutes; after SIGCONT the
    core gets no changing call with its token except `fail` or `release`, and the external system
    stub gets no write; for a toolhost the same fixture checks the MCP cancellation and the end of
    the plugin process after `kill_after`.
  goal: G2
  check: [adapter, blackbox]
  waivable: false
  version: v0.1
  profile: core
  decisions: [D-36]
  fixtures: [adapter:lease/self-stop, adapter:toolhost/plugin-cancel-on-lease]
  doc: docs/tasks-and-delivery.md

- id: FEN-7
  title: An external write carries the work id
  status: active
  text: >-
    Every write to the outside world carries a work identifier shared by all attempts, so that a
    second executor can recognize what was already done. A write call of an action passes
    `approval_id` to the plugin, for a campaign item `<approval_id>:<n>` (APR-7, ORC-3); a write
    call of `service/control` and a `monitor_script` delivery pass the number of the `service_grant`
    audit record in the field `grant_id` (APR-18); the record names the initiator, who has their own
    right `service.control:<service>` or `monitor.script_run` (D-73). A routine pipeline of class
    `routine` (APR-17, D-78) is also executed under a `service_grant` record with the initiator as
    author, and its number is in the write call's `grant_id`. A sink writes idempotently by
    `delivery.id`, and an outgoing webhook passes it in the `webhook-id` header. A task type whose
    `job` worker writes to an external system declares `side_effects: external` and passes it the
    `work_id` of its unit of work; a type that does not pass the key gets `max_attempts: 1` (lint).
    Repeating a delivery to a channel without an idempotency key is allowed, and `card_update` edits
    the message already sent instead of sending a new one.
  goal: G4
  check: [lint, adapter, blackbox]
  waivable: false
  version: v0.1
  profile: core
  decisions: [D-36, D-68, D-73, D-78]
  fixtures: [fx-fen-01]
  doc: docs/tasks-and-delivery.md

