- id: MGR-9
  title: Control operations and their targets
  status: active
  text: >-
    The seat holder changes the world only with operations from `control-ops.yaml` (`hold`,
    `quarantine`, `drain`, `preempt`, `cancel`, `pin_task`, `request_action`, `release`, `notify`)
    through C1 `control.apply` and with the write tools `service/control` and `monitor/script_run`
    (MON-8, MON-10), which the decision role gets with the manifest fields `service_control: ["*"]`
    and `monitor_scripts: ["*"]` (D-67, D-69); people call the same operations through P2 along the
    same code path, and task pinning and preemption by people are operator operations through
    `farmctl` (PRM-14). A seat hold is set with scope `worker`, `bot`, `bot_group`, `role`,
    `tasktype` or `resource`. A target is taken only from the list that code built for the task's
    basis (the incident's involved parties, the escalation subject, the directive scope); otherwise
    the refusal is `target_not_implicated`, and a target from a finding goes under MGR-26. For
    services and scripts the list is the services of the incident subject's node from the catalog of
    T and the scripts by name from `hosts[].monitor_scripts_allowed` of that node (for a directive,
    the resource node from its scope), intersected with the catalog's `control`, the class's
    `responses.services` or `responses.monitor_scripts` and the consent of group `farm-manager-ops`
    (`service.control:<service>`, `monitor.script_run`); a call from the list goes without a card
    under a `service_grant` record (D-68), and in distrust mode with an approval card to a person
    (MGR-22, INJ-15). Under a human directive an action with a service passes only if that person
    could approve its card in the tenant themselves. The incident's involved parties are the workers
    and tasks returned by the class functions, plus the bot identities, roles and bot groups of
    those workers and the types of those tasks. A seat hold of scope `bot` only delays the
    identity's tasks: it does not change its state, promotion eligibility. Effects only
    narrow; a hold expiry is no more than `hold_ttl_max` (2 h); only one's own holds can be
    released. The targets of hold, quarantine, drain, preemption and cancellation never include
    workers and types that write the series of classes with `stops_manager` (from v0.3
    `manager_accountable`, GOV-48), roles of profiles `reporter`, `reviewer`, `translator` and the
    roles of the seat itself, nor tasks of purposes `governance`, `review`, `inspect`, `manage`;
    such a call gets `target_excluded`. Manager holds do not delay tasks of purpose `governance`.
    The exception to HLD-2 applies only to the current seat holder with the current epoch.
  goal: G2
  check: [blackbox, fixture]
  waivable: false
  version: v0.1
  profile: manager
  decisions: [D-18, D-33, D-62, D-67, D-68, D-70, D-114]
  fixtures: [fx-mgr-04, fx-mgr-05, fx-mgr-17, mgr-01]
  doc: docs/farm-manager.md

- id: MGR-10
  title: What control is not
  status: active
  text: >-
    No seat operation and no seat built-in tool gives: a shell, ssh, sudo; reading or writing
    another bot's runtime, session, memory or context; sending text into a bot's context; operations
    with credentials; editing manifests, budgets, groups, permissions and the incident catalog;
    `decide` on any card; a direct call of `action.*` and rerunning actions; releasing holds by
    people and auto-stops; actions with services outside the MGR-9 list (services outside the tenant
    catalog, verbs outside the service's `control` and the class's `responses.services`, services of
    the core and of farm nodes, MON-8); monitoring scripts outside the list of the subject node, on
    farm nodes and on nodes of other tenants (MON-10); acknowledging, closing, silencing and
    changing the severity of monitoring system problems, notification actions and maintenance
    windows in it (MON-4). Seat credentials are not accepted on P2 (IDN-7). Lint checks the list of
    built-in tools of the seat profiles.
  goal: G2
  check: [lint, fixture]
  waivable: false
  version: v0.1
