- id: TEN-1
  title: One record, one tenant
  status: active
  text: >-
    Each record belongs to exactly one tenant, and it does not change. This applies to a task, a
    lease, a tool call, an approval, a delivery, a principal, an identity, a membership, a worker, a
    file, a memory record and a fact, a session, a usage line, an event, an audit record, a message
    and an inbox entry, a proposal and a review, a change trial, an observation series, a hold, a
    campaign, a script run, an incident, a control operation, a bot identity, a seat, a case, an
    incident attribution and an erasure request. A reference from a record of one tenant to an
    identity or seat of another tenant (for example to the identity of the manager seat holder in
    the service tenant `farm`) is stored only as an id and an epoch in fields the core writes
    (`acting_bot`, `bot_epoch`, `seat_epoch`, case snapshots); nothing is read by such a reference.
    A hold of scope `farm` or `seat` is a record of the service tenant `farm`; a hold of any other
    scope is a record of the tenant of its scope.
  goal: C3
  check: [fixture, blackbox]
  waivable: false
  version: v0.1
  profile: core
  decisions: [D-30, D-33]
  fixtures: [fx-ten-01]
  doc: docs/architecture.md

- id: TEN-2
  title: Tenant and principal from the credentials
  status: active
  text: >-
    The core takes the tenant and the principal of any call from the credentials: of the worker,
    channel, external program, operator or handle. The monitoring system's `health` key carries
    neither a tenant nor a principal: it opens only the P2 operation `health`, whose answer contains
    no tenant data, and any other operation with it is rejected (MON-2). Task bodies, requests,
    model arguments and messages do not carry the tenant; the schema rejects such a field. A
    protocol adapter whose request has a tenant in it (for example the `tenant` field of an external
    agent protocol) checks it against the credentials; a mismatch gives `tenant_mismatch` and an
    alarm. A handle of one tenant presented in the work of another is rejected. There are no
    exceptions for any role, including the roles of the manager seat.
  goal: C3
  check: [blackbox]
  waivable: false
  version: v0.1
  profile: core
  decisions: [D-47, D-60]
  fixtures: [blackbox:model/tenant-field, blackbox:model/child-record-fields]
  doc: docs/architecture.md

- id: TEN-3
  title: Only its own tenant takes work
  status: active
  text: >-
    `claim` gives a worker only work of its tenant, and `msg.receive` only entries of its tenant's
    inboxes. A delivery is taken only by a channel, sink or monitoring adapter of the same tenant,
    and only by the one whose `enroll` record matched the delivery target `target` (`kind`:
    `channel`, `sink` or `monitor`, and the name), which the core writes into the delivery. Seat
    tasks are taken only by workers of seat roles enrolled in the task's tenant.
  goal: C3
  check: [blackbox]
  waivable: false
  version: v0.1
  profile: core
  decisions: [D-71, D-80]
  fixtures: [blackbox:core/claim-own-tenant, blackbox:core/delivery-target]
  doc: docs/architecture.md

- id: TEN-3a
  title: Tool call target
  status: active
  text: >-
    A tool call has `target` = (tenant, plugin, placement, machine from a catalog resource),
    computed by the core: it takes the machine from the argument that the tool manifest named in
    `target_from`, and a tool with `target: any` gets a target without a machine (any toolhost of
    the tenant with this plugin and placement). `apply` rejects a tool manifest without
    `target_from` and without `target: any`. `claim(toolcall)` gives a call only to a toolhost whose
    tenant, plugins, placement and machine recorded at `enroll` matched `target`. Fixtures: a
    sandbox toolhost does not take a call with `placement: host`; a toolhost on `web1` does not take
    a call for a resource of machine `db1`; a tool manifest `cmd/run` without `target_from` and
    without `target: any` does not pass `apply`.
  goal: C3
  check: [fixture, blackbox, lint]
  waivable: false
  version: v0.1
  profile: core
  decisions: []
  fixtures: [lint:manifests/tool-target-from, blackbox:core/toolcall-target]
  doc: docs/architecture.md

- id: TEN-4
  title: A process serves one tenant
  status: active
  text: >-
    The process of any worker (agent, job, toolhost, channel, sink, monitor) serves one tenant;
    `enroll` fixes it. The monitoring system adapter (E5) runs as a separate process for each tenant
    and a separate process in the service tenant `farm`; each process has its own monitoring system
    user with permissions only on the node groups of its tenant (for the `farm` process, on the farm
    node group), so a tenant process exports only that tenant's alarms and audit head, and accepts
    problems and runs monitoring system scripts only for the nodes of its catalog; `doctor` checks
    through the API that the `demo` adapter user sees neither the nodes of `demo2` nor farm nodes.
    An identity that a channel asserts is looked up only among the principals of its tenant. A
    catalog resource (machine, log source, storage root, URL) is declared in the catalog of exactly
    one tenant, and a machine belongs to exactly one tenant: a (machine, service) pair and a
    (monitoring system node, script) pair appear in the catalog of one tenant, and `apply` rejects a
    catalog where a machine or node is already linked to another tenant (D-75); so there is only one
    toolhost on a machine, and only of its tenant. There are no exceptions: seat roles, including
    the manager seat, work as workers enrolled in each tenant separately.
  goal: C3
  check: [blackbox, lint]
  waivable: false
  version: v0.1
  profile: core
  decisions: [D-33, D-66, D-69, D-75]
  fixtures: [blackbox:channel/press-other-tenant, adapter:monitor/user-scope, lint:catalog/host-one-tenant]
  doc: docs/architecture.md

- id: TEN-5
  title: Data and context do not mix tenants
  status: active
  text: >-
    Memory (records and facts), sessions, files, inboxes, observation series, the catalog, knowledge
    corpora and their indexes, the sandbox and the model context do not mix tenants. Tenant data
    goes to the organization's shared monitoring system only as numbers, `enum` values and catalog
    ids with a `tenant` tag, and as text only in notes on problems of a class no higher than
    `summary` after redaction, as to a third-party store (INJ-4, MON-7); the `monitor` plugin reads
    only nodes that its tenant's catalog linked to resources (MON-1, MON-6). The core computes store
    keys and spaces. Files are not deduplicated across tenants. Each tenant has its own workspace
    and key at the model provider. One attempt sees data of exactly one tenant: no bot attempt,
    including those of the manager seat and the aggregator, reads records of more than one tenant,
    and only core code builds the view of the whole farm for `farm` operators from allowlisted
    metadata (OBS-1). A tenant with `farm_manager.enabled: false` is closed to the manager entirely:
    its data is not read, and no review or lens is kept for it (D-77). Check: a canary of tenant A
    is not found in any request of tenant B at the mock provider behind P4, nor in the inboxes,
    tasks and facts of tenant B, nor in the notes that the farm writes to the monitoring system for
    any tenant.
  goal: C3
  check: [blackbox, adapter]
  waivable: false
  version: v0.1
  profile: core
  decisions: [D-42, D-30, D-59, D-66, D-77]
  fixtures: [blackbox:model/foreign-source, blackbox:toolhost/symlink, gov-fx-10, fx-mgr-tenant, inj-peer-agg-01, blackbox:core/tenant-canary]
  doc: docs/architecture.md

- id: TEN-6
  title: Global manifests without tenant data
  status: active
  text: >-
    Global manifests (kinds without `metadata.tenant`: Role, TaskType, ToolPlugin, Action,
    MessageType and other global kinds) contain no principals, chat ids, secrets, addresses or
    tenant data. Egress addresses for tenant resources are taken from its catalog (`enum_from`).
    Secret names of a global plugin are resolved in the tenant's namespace.
  goal: C7
