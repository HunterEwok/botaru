- id: COM-10
  title: Shadow reviewer at the tenant's choice
  status: deferred
  deferred: 2026-10-14
  reason: 'The shadow reviewer is off by default (D-103) and not needed for the pilot.'
  return_when: 'The tenant wants to compare a candidate reviewer before seating it.'
  mechanism_removed: false
  text: >-
    The shadow is off by default: a commission manifest without a `shadow` block, or with `shadow:
    off`, gets no shadow tasks, and `doctor` shows the check `commission.shadow_off` (D-103). A
    tenant turns it on with a `shadow` block; then for a share of proposals the fallback role of a
    lens (COM-7) gets a shadow review task of that lens on the `seat` slot with the lens seat
    profile (GW-7), without memory facts and without a persona; the shadow runs only for lenses
    whose review a seat holder executed. A proposal is selected when `sha256(seed ‖ proposal id ‖
    lens)` falls below the share by the rule and test vector of `spec/hashing.md` ("shadow draw");
    the seed is drawn monthly per tenant and written to audit (`commission.shadow_seed`, D-101). The
    `shadow` block sets `veto_lenses` (0.25 when the block omits it) and `other_lenses` (0.2 when
    omitted), each above 0 and at most 1; a share of 0 inside the block fails the lint
    `shadow_zero_without_off` at `apply`, because the shadow is turned off only by leaving the block
    out or by `shadow: off`. A shadow task gets its own core key
    `system:review:<proposal>:<lens>:shadow` (IDM-2) and does not merge with the seat's task. Its
    reviews have `shadow: true` (COM-9) and are paid from the `review` line. For each lens, code
    takes the pairs "seat score minus shadow score" of the last 30 days, drops pairs with a
    difference of 0, and sets the flag `shadow_divergence` when at least 15 pairs remain and a
    one-sided exact sign test gives p below 0.05 for "seat below shadow"; people see it in P2
    `commission.status` and in `doctor` (`commission.shadow_divergence`).
  goal: G5
  check: [blackbox]
  waivable: true
  version: v0.2
  profile: insights
  decisions: [D-16, D-101, D-103]
