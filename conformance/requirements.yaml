- id: BUD-4
  title: Code decides on exhausted budgets and thresholds
  status: active
  text: >-
    `budget_exhausted` is not retried and does not spend an attempt. The 80% threshold of the
    tenant's monthly or daily limit or of the principal's daily limit gives one event per period;
    100% gives a refusal with the time when the limit renews. The threshold is computed from actual
    usage and the reserves of running attempts: the reserve of tasks waiting for the provider
    (`waiting_reason: provider_unavailable` or `provider_quota`) does not count toward the
    threshold, although the reserve itself is kept, and overspend stays zero because the reserve is
    taken again before the call (GW-2). Tenant usage per hour above `hour_eur` (default one
    hundredth of `month_eur`) is not a reserve limit but the threshold of the `contain_auto` hold
    for the class `runaway_spend` (HLD-7). Code decides on thresholds, not the model. The periods
    "day" and "month" are counted in the tenant's time zone (TIM-2). Fixture: 72 schedule tasks wait
    for the provider with reserves summing to more than the daily limit, and a direct request from a
    person does not get `budget_exhausted`.
