- id: DSP-10
  title: A personal assistant is a pool of workers with the owner in the lease
  status: deferred
  deferred: 2026-10-14
  reason: 'The personal assistant stays among the goals but is not in the queue of the pilot, which starts with operations tasks; per-person memory returns with it, and its protections (IDN-5, MEM-1 to MEM-4) stay active.'
  return_when: 'People of the pilot tenant need a personal assistant.'
