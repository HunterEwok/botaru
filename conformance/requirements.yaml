- id: MGR-47
  title: Restricted mode after a preventable incident
  status: active
  text: >-
    In restricted mode in tenant T (the seat record field `restricted_in`) the decision attempts of
    the seat in T only read views and send notices (MGR-52): `control.apply`, `service/control`,
    `monitor/script_run`, `takeover_request`, `grant_decide` and `link_hint` are refused with
    `manager_restricted`, which does not count for the safeguard (MGR-14). The exception: for an
    incident of severity sev1 opened in T during the restriction, the attempts whose basis is that
    incident are not restricted. The restriction is lifted only by an operator with
    `admin:governance` in `farm` through `farmctl seat resume farm-manager --tenant demo`, or ends when
    the seat changes holder or is vacated; each change writes an audit record and a seat event.
  goal: C1
  check: [blackbox]
  waivable: false
  version: v0.3
  profile: manager
  decisions: [D-110]
  fixtures: [blackbox:manager/preventable-restricted]
