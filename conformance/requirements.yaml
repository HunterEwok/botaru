- id: RET-11
  title: Channel cache, every runtime and tenant scope in erasure
  status: active
  text: >-
    From v0.2 three erase operations are added to RET-4, and the adapter of each passes the
    `erasure` suite. A channel that declares `driver.stores_content: attachments` or `cache`
    implements E1 `match` (it searches its cache and saved attachments for the needles and answers
    only with ids) and E1 `erase` by `(tenant)`, `(tenant, subject)` and a list of ids. Every agent
    runtime implements E4 `purge` by the same scopes, also without `runtime_internal`: it deletes
    the working files, caches and logs with content it keeps, and the core sends this work to every
    agent worker that ran an attempt of the tenant. C3 `purge` accepts the scope `(tenant)` for
    tenant deletion (LCY-1). A store that lacks the operation answers `failed`, and the request
    stays open with an alarm (RET-7). After a restore the replayed erasure requests (RET-6) send
    this work again, and an `erase_match` request is replayed only by its recorded ids, never by a
    new search.
  goal: C6
  check: [adapter, blackbox]
