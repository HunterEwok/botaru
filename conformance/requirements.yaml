- id: IDN-10
  title: Only the core writes the seat holder
  status: active
  text: >-
    Seats are declared by the charter (GOV-33). A seat has no more than one holder. Only the core
    writes the holder, in one transaction that increments the seat epoch by 1 and writes a seat
    event (`seat.assigned`, `seat.vacated`, `seat.stopped` or `seat.resumed`) and an audit record.
    The trigger comes only from a closed list: a confirmed promotion case (GOV-9); P2 `seat.assign`,
    `seat.vacate` or `seat.resume` by a person with `admin:governance` in the seat's tenant, and for
    the manager seat in `farm`, only through `farmctl` (PRM-14); a stop of the manager seat
    (GOV-22); the holder's departure (IDN-11). On a commission seat, `seat.assign` seats only an
    existing functionary identity of this tenant in the state `active`, and for the manager seat the
    core always creates a new identity in `farm`. A task on behalf of a seat carries the seat epoch;
    a review or control operation with a stale epoch gets `fenced` without side effects, and
    at every change of the seat epoch the running attempts of seat tasks get `cancel_requested` and
    end with the reason `seat_changed` without spending an attempt, and the task waits for a holder
    with the current epoch. A vacant or stopped seat gets no tasks.
  goal: C1
  check: [blackbox]
  waivable: false
  version: v0.1
  until: v0.2
  superseded_by: [IDN-16]
  profile: governance
  decisions: [D-21, D-33, D-114]
  fixtures: [gov-fx-01, gov-fx-09]
  doc: docs/bots.md

- id: IDN-11
  title: Identity retirement by a closed list
  status: active
  text: >-
    An identity retires (`retired`) only for one of seven reasons from the closed list
    `spec/model/bot-retire-reasons.yaml`, which only the core applies: `removed_by_vote` (a
    promotion case is `effective`), `replaced_after_incident` (only the manager seat: replacement,
    vacating or the `decide_within` deadline while the stop reason set contains `incident`),
    `replaced_by_human` (`seat.assign` on a taken seat, or `seat.vacate`), `role_removed` (the role
    is not in the tenant's applied manifests), `worker_gone` (the identity has been `unbound` for
    longer than `unbound_ttl`, 30 days), `human_retire` (P2 `bot.retire` with `admin:workers`) and
    `tenant_offboarded` (tenant offboarding, P2 `tenant.offboard`, from v0.2). Bots have no
    operation, message type, field or route that sets a reason or postpones retirement. `retired` is
    terminal: there are no tasks, and reviews and facts from the identity are not accepted, its
    running attempts get `cancel_requested`, and late writes get `fenced`. In the same transaction
    the core seals its facts, records and sessions (MEM-4) and opens a fact offer to the successor
    (MEM-7), and the live worker of the retired identity gets a new identity of the same role. What
    is sealed is erased under MEM-9, the identity becomes `erased`, and a tombstone remains: id,
    tenant, role, time, reason and the successor's id.
  goal: G5
  check: [blackbox, lint]
  waivable: false
  version: v0.1
  until: v0.2
  superseded_by: [IDN-15]
  profile: governance
  decisions: [D-28, D-33]
  fixtures: [mem-fx-03, gov-fx-18, gov-fx-24]
  doc: docs/bots.md

- id: IDN-12
  title: A task without memory or tools on any worker of the role
  status: active
  text: >-
    A task of an identity that needs no memory, session, inbox or tools is
    executed by any worker of the identity's role in its tenant, on the role's slot; `acting_bot`
    stays this identity, and the executing worker is written into the attempt and audit. A task with
    memory, a session, an inbox or tools goes only to the worker of the identity's binding with the
    current binding epoch (dispatcher condition D20).
  goal: G5
  check: [blackbox, fixture]
  waivable: false
  version: v0.1
  profile: governance
  decisions: [D-29, D-114]
  fixtures: [gov-fx-07]
  doc: docs/bots.md

- id: IDN-13
  title: Person offboarding and a chat list for admins
  status: active
  text: >-
    When a person is disabled or removed for good (P2 `principal.off`, `principal.offboard`), the
    principal goes to `off`, or with `principal.offboard` to `offboarded` (LCY-8). In the same
    transaction the core sends the admins of their tenant with `admin:people` the code notice
    `principal_left` (only to their private chats, not to a group, text under the key
    `notice.principal_left`, REP-5): the principal id, the reason and the list of chats with a farm
    binding (`ChatBinding`) where this person remains a member according to the E1 channel's
    information that the core stores on the binding, with a marker on chats with
    `membership_assurance: enforced`. If the person has no chat with a farm binding, the notice goes
    anyway: the tenant administrator gets it, and instead of the chat list it says that there are no
    chats. There is no model text in the notice. In v0.1 the core only reports the list; from v0.2
    offboarding also removes groups, unused invitations and connections and empties views for chats
    the person stays in (IDN-14). The farm never removes a person from an external chat itself.
  goal: G2
  check: [blackbox, fixture]
  waivable: true
  version: v0.1
  profile: governance
  decisions: []
  fixtures: [idn-fx-13, blackbox:core/principal-offboard-final]
  doc: docs/bots.md

- id: IDN-14
  title: Offboarding without traces of access
  status: active
  text: >-
    From v0.2 offboarding (LCY-8) in the same transaction also removes the person from all groups,
    revokes the unused invitations they issued and, where the profile `connections` is claimed,
    their connections (SEC-7). The person's tasks are canceled, not handed over (LCY-3). The farm
    does not remove a person from an external chat and does not leave it: the `principal_left`
    notice names the chats (IDN-13), and while the person remains a member of a bound chat, the core
    counts them as a participant without permissions, so views for that chat carry nothing (REP-7),
    and repeats the notice once a day for at most 7 days.
  goal: G2
  check: [blackbox]
  waivable: false
  version: v0.2
  profile: core
  decisions: [D-98, D-107]
  fixtures: [blackbox:core/offboard-leftovers]
  doc: docs/bots.md

- id: IDN-15
  title: Identity retirement by a closed list from v0.3
  status: active
  text: >-
    An identity retires (`retired`) only for one reason from `spec/model/bot-retire-reasons.yaml`,
    which only the core applies: `removed_by_vote`, `replaced_by_human`, `role_removed`,
    `worker_gone`, `human_retire`, `tenant_offboarded` (all as in IDN-11) and `parked_expired` (a
    bot parked under GOV-42 waited 180 days without a worker of its role). A parked bot does not
    retire as `worker_gone`. A v0.3 core never applies `replaced_after_incident`. Bots have no
    operation, message type, field or route that sets a reason or postpones retirement. `retired` is
    terminal, and the same transaction seals, offers facts and gives the live worker a new identity,
    as in IDN-11.
  goal: G5
