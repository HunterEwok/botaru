    A manifest can carry `deprecated: true` and `sunset: <date>`; `apply` warns about references to
    a deprecated object, and after `sunset` rejects new and existing references to it. Task type
    `.vN` is removed only when it has no non-terminal tasks and no schedule or route points to it;
    otherwise the `apply` status shows an error and the type stays (MAN-2). When the manifest
    `apiVersion` changes (D-44), `farmctl` ships a converter whose output gives the same `apply
    --dry-run` plan; this part is checked from the release that changes `apiVersion`.
  goal: C9
