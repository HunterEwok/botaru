- id: GOV-35
  title: Locked commission
  status: deferred
  deferred: 2026-10-14
  reason: The card "the commission is stuck" works on three months of flags and does not fire before the pilot ends.
  return_when: The commission has worked for three months.
  mechanism_removed: false
  text: >-
    A tenant's commission counts as locked when a flag holds steadily: the audit sample flag
    `commission_underrates` (DIG-5) is in three monthly digests in a row, or three cases in a row in
    the tenant closed with the same one of the case flags `evicts_top_calibrated` and
