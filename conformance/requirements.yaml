- id: INJ-3
  title: MCP annotations are only hints
  status: active
  text: >-
    MCP annotations are only hints: the toolhost treats them as untrusted. `access`, `tier`,
    `output_class` and `untrusted_output` are set by the manifest. The field `untrusted_output` is
    required; `false` is allowed only if the tool's output, by schema, consists only of numbers and
    `enum` values. A contradiction between an annotation and the manifest (for example
    `readOnlyHint: false` with `access: read`) fails `apply`.
  goal: G2
  check: [lint]
  waivable: false
  version: v0.1
  profile: core
  decisions: []
  fixtures: []
  doc: docs/permissions.md

- id: INJ-4
  title: Redaction and output wrapping
  status: active
  text: >-
    Tool output is redacted and truncated on the toolhost before it leaves the machine: by default
    IPv4 down to the /24 subnet and IPv6 down to the /48 prefix, including inside URLs, headers and
    query strings; an email address in full; secrets of known formats; then truncation by the
    manifest's `output_limit_kb`. The core searches for secrets once more, sets `untrusted_seen` and
    gives the output to the model as a separate tool result block. Where text is needed, it is
    wrapped in a tag with a random value per call, and the same tag inside the text is cut out. In
    the same way, as a data block with a tag rather than as instruction text, the core gives the
    model any text not from the initiator that it itself puts into the attempt input, for example
    the reviewer input. `resource_link` is not opened; embedded resources count as untrusted output;
    images and audio are discarded if the manifest does not expect them; `structuredContent` is
    checked against the manifest's `outputSchema`. The manifest of a tool with `placement: host` and
    `untrusted_output: true` carries the field `redact`, no shorter than `[ip, email, secret]`;
    `apply` rejects a tool without it. The monitoring system is a recipient with third-party storage
    with the ceiling `summary` (SEC-9): a bot note on a problem (MON-7) and a code note about an
    action (MON-8) pass the same redaction as tool output before delivery, and the note text is part
    of the tenant canary check (TEN-5). Fixtures: a canary secret in plugin output does not reach
    the runtime; output with a forged closing tag does not leave the wrapper; the tool `logs/tail`
    without `redact` fails `apply`; a canary of the `demo` tenant in a problem note does not reach
    the monitoring system.
  goal: G2
  check: [blackbox, lint, fixture]
  waivable: false
  version: v0.1
  profile: core
  decisions: []
  fixtures: [blackbox:toolhost/mask-addresses, blackbox:toolhost/mask-secrets, blackbox:toolhost/output-limit, lint:manifests/redact-required, blackbox:monitor/note-masking, fx-canaries-secrets]
  doc: docs/permissions.md

- id: INJ-5
  title: A plugin does not ask the model or people
  status: active
  text: >-
    The toolhost as an MCP client does not declare the capabilities `sampling`, `elicitation` and
    `roots`. Client capabilities are passed in every request, so the check runs on every request,
    and a server's request for input (`InputRequiredResult`) counts as a call error. Parameters with
    `x-mcp-header` are forbidden in the manifest: their values go into HTTP headers and are visible
    to intermediaries on the network.
  goal: G2
  check: [adapter, lint]
  waivable: false
