- id: RET-2
  title: Retention periods and deletion at expiry
  status: active
  text: >-
    Content is deleted at the retention class expiry by the background loop `retention`. In v0.1 the
    loop deletes only objects of classes `content` and `observation` older than the default period
    from `spec/model/retention-classes.yaml` (RET-1); everything else is deleted before its period
    only by an erasure request (RET-7). From v0.2 the tenant sets the periods (RET-9) and the loop
    deletes every class in every copy (RET-10). Fixture: a `content` class canary older than the
    default period is not found in C3 after a loop tick, while a `metadata` record of the same age
    remains.
