- id: PRP-20
  title: Reverse edit of an executed change
  status: active
  text: >-
    On `realized` by a commit the core keeps a reverse edit: the previous values of the same fields
    of the same objects, and the batch number if one commit is linked to several proposals. The
    reverse edit is available to the executor in the "Revert" card (PRP-23) and in P2
    `proposal.show`. From v0.3 the reverse edit also names the fields the change added
    (`revert_absent`, EVO-10). A commit that carries the line `Botaru-Revert: <id> <reason>`, returns
    these values and takes out those fields is linked by the core to the proposal and moves it to `reverted`; the reason is from the
    closed list `harm_observed` (the change did harm), `superseded` (replaced by another), `other`,
    and a line without a reason is read as `other`. The core writes the revert reason into the
    proposal record and into the author's "My outcomes" (DIG-7).
  goal: G4
