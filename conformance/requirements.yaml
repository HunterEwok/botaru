- id: PRF-1
  title: Role profile table
  status: active
  text: >-
    The role profile `Role.spec.profile` is a value from the closed list
    `spec/model/role-profiles.yaml`: `worker` (the default), `manager`, `reporter`, `translator`,
    `reviewer`, `aggregator`, `farm-manager`, `farm-manager-reader`. A profile grants no permissions
    and is not part of the C2 permission formula: it only narrows what a role can declare and
    carries the model rank ceilings: `max_rank` for slots `base` and `seat` and `analysis_max_rank`
    for slot `analysis` (GOV-3); the tenant charter can only lower them. `apply` rejects a role that
    declares something its profile forbids or takes (`claims`) a type with a purpose the profile
    does not allow. When assembling `tools/list`, the core adds P3 built-in tools only from
    `builtin-tools.yaml` for the role's profile and does not add anything the profile forbids, even
    if the manifest is wrong. Table rows. `worker`: purposes `work` and `insight` (seat analysis,
    INS-1); built-ins `request_action`, `send_message`, `inbox_read`, `status.*`, `service/control`
    with the role field `service_control` and `monitor/script_run` with `monitor_scripts:
    [<name>...]` (APR-18), from v0.2 `escalate`, `request_model_grant` and `skill_read`, and in
    `insight` tasks only `observations_query` within the role's `insight.observes` (OBV-3); there
    are no limits beyond the common skeleton rules. `manager`: purposes `work` and `insight`;
    built-ins as for `worker`, in `work` tasks plus `enqueue_child`, `propose_campaign`,
    `campaign_status`, `campaign_results`; it releases and assigns nothing itself. `reporter`: only
    types of purpose `report` of tier 0 that declare only `status.*` views and `inbox.read`;
    `tools`, `may_enqueue`, `campaigns`, `actions_may_request`, `scripts` and `messages.send` are
    empty; `messages.receive` only genus `report`; `memory: none`; a model only of slot `base`; in
    `tools/list` only `status.*` and `inbox_read`. `translator`: only types of purpose `translate`
    of tier 0; `tools`, `may_enqueue`, `actions_may_request`, `messages.send` and `messages.receive`
    are empty; `campaigns.propose: none`; `memory: none`; `scripts.propose: draft`; a model only of
    slot `base`; in `tools/list` only `propose_script`. `reviewer`: only types of purposes `review`
    and `governance` of tier no higher than 1; `tools`, `may_enqueue`, `campaigns`,
    `actions_may_request`, `scripts` and `messages` are empty; there is no session, each task starts
    from a clean slate; in `review` tasks the only built-in is `observations_query`, in `governance` tasks there are no built-ins (GOV-16); of
    memory only `memory.read: bot` can be declared, and the core returns only facts with
    `untrusted_origin: false`; the model does not write to memory. `aggregator`: only types of
    purpose `aggregate` of tier no higher than 1, a model of slot `analysis`, budget line
    `aggregate`; `tools`, `may_enqueue`, `campaigns`, `actions_may_request`, `scripts` and
    `messages` are empty; `memory: none`; of the built-ins only `observations_query`,
    `messages_digest`, `proposals_query`; output only proposals in the task result (INS-3).
    `farm-manager`: only types of purpose `manage`; the manager's built-in tools (operations from
    `control-ops.yaml`, `inspect_request`, `incident_close`, from v0.2 `grant_decide`,
    `escalations_take`, `grants_pending`, `takeover_request`) exist only for this profile; also
    `service/control` and `monitor/script_run` within the manager's measures (D-67); there are no
