- id: ORC-15
  title: Waves and pace of a campaign
  status: deferred
  deferred: 2026-10-14
  reason: 'A campaign of the pilot has a canary, max_in_flight and a failure threshold (ORC-4); waves and pace are not needed.'
  return_when: 'A campaign touches enough items that a staged rollout after the canary is needed.'
  mechanism_removed: false
  text: >-
    `rollout.waves` is a list of 1-10 cumulative shares of the items after the canary, strictly
    increasing, the last one `100%`; a proposal that breaks this is rejected with
    `campaign_waves_invalid` and creates no record. Wave k may release, in item order `n`, the items
    after the canary up to the share of wave k of their number, rounded up. Wave 1 opens when the
    canary gate opens (`after_canary`), or at once without a canary; wave k+1 opens only when every item of wave k is final, the
    failure threshold is not crossed and the `bake` pause has passed since the last of them ended.
    Without `waves` all items after the canary form one wave. `rollout.rate_per_min` caps the
    releases of the campaign in any 60 seconds. An item that a closed wave or the pace holds back
    stays `pending`: that is not a failure and spends nothing. The `campaign` loop and the end of an
    item release it later by the same gates. Waves and pace only narrow release; they never pass an
    item that another gate of ORC-4 holds. The campaign record keeps the number of the open wave
    (`wave`, 0 for the canary), written by the core in the transaction that opens the wave, and the
    progress card is updated then (ORC-10).
  goal: G4
  check: [fixture, blackbox]
  waivable: false
  version: v0.2
  profile: campaign
  decisions: [D-14]
  fixtures: [campaign/waves-pace, blackbox:campaign/pace-window]
  doc: docs/coordination.md

- id: OUT-1
  title: Result fields read by code are of closed kinds
  status: active
  text: >-
    Result fields that code reads (route filters, continuations, waits, `summary_fields` summaries,
    card texts, the campaign summary table and script conditions) are marked in the type's result
    schema with `x-botaru-read-by: code` and have only closed INJ-1 leaf kinds. Code does not read
    or parse free model text. Lint rejects a reference of a route, continuation, wait, summary or
    script to an unmarked field. The model takes numbers in such fields only from a tool answer or
    from task data, and does not compute them itself: a type whose result carries numbers declares
    the source tool in `instruction` and in `summary_fields`, and the type's eval compares the
    result numbers with the tool answer (example `data.describe.v1`, D-72). At `complete` the core
    checks the result against the type's full `result_schema`: `enum_from` resolves against the
    catalog version recorded for the attempt (its run fingerprint, PRV-1), filtered by the task's
    `data_mark`, and `x-botaru-format` is an assertion, not an annotation. A failure is
    `output_schema_invalid`: the core ends the attempt, the attempt is spent and the retry follows
    its backoff, so the holder cannot hand in another result under the same lease (D-98).
  goal: G2
  check: [lint, blackbox]
  waivable: false
  version: v0.1
  profile: core
  decisions: [D-71, D-72, D-80, D-98]
  fixtures: [eval:data/describe-numbers-match, ctd-001, ctd-inj-01, blackbox:model/result-full-schema]
  doc: docs/tasks-and-delivery.md

