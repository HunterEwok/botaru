- id: MAN-5
  title: Only apply changes declared objects
  status: active
  text: >-
    Declared objects change only through `apply`. P2 has no operations that change their `spec`; P2
    `budget.set` only temporarily lowers a principal's limit and always with an expiry, and the
    limits themselves live only in the tenant manifest. An urgent change without git is made with a
    hold (HLD-1). The status stores the applied commit and the hash of the set; P2 `doctor` shows a
    divergence from the commit the operator named. For the improvement cycle (D-71), the core reads
    the lines `Botaru-Proposal: <id>` and `Botaru-Revert: <id> <reason>` of the commit message at
    `apply` and links the commit to the proposal; the revert reason is a code from the closed list
    of PRP-22 (`harm_observed`, `superseded`, `other`), and a line without a reason or with a reason
    outside the list fails `apply` of the set. If such a commit, or a commit linked to a proposal
    through P2 `proposal.link_commit`, touches files outside the folder of that proposal's tenant,
    `apply` is rejected as a whole with reason `proposal_scope`, and the commit is not linked to the
    proposal (PRP-8).
  goal: C1
  check: [blackbox, lint]
  waivable: true
  version: v0.1
  profile: core
  decisions: [D-71, D-80]
  fixtures: [lint:manifests/commit-trailers]
  doc: docs/task-language.md

- id: MAN-6
  title: apply is atomic
  status: active
  text: >-
    `apply` is atomic: the set is applied as a whole in one store transaction or not applied at all.
    A schema, reference, lint or escalation-ban error in any object of the set, and a core failure
    in the middle of `apply`, leave all objects of the set in their previous state; there are no
    partially applied permissions, roles or types. The status shows the errors of the rejected set.
    Fixture: in a set of a role, a task type and a group, the third file has an error; after `apply`
    all three objects are unchanged.
  goal: G2
  check: [blackbox]
  waivable: false
  version: v0.1
  profile: core
  decisions: [D-36]
  fixtures: []
  doc: docs/task-language.md

- id: MAN-7
  title: Deprecation, version removal and apiVersion change
  status: deferred
  deferred: 2026-10-14
  reason: 'Deprecation and an apiVersion converter are needed when the manifest version changes, not for the pilot.'
  return_when: 'The manifest apiVersion changes.'
  mechanism_removed: false
