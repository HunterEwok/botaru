- id: SEC-10
  title: A copy of a person's data only to that person
  status: active
  text: >-
    A person gets a copy of their data in the tenant of the channel by a request: the command
    `/mydata export` in a private chat creates a request of kind `export` with the public key that
    the person supplied (`recipient_key`, SEC-11), and after the request is confirmed the core's
    export task (`principal.export`, LCY-2) writes the copy as a file encrypted with that key. A
    copy of a person's data goes only to that person and never to the operator, an admin or a chat:
    only into a sink with the block `Sink.spec.export_only: {recipient_ref, key_ref}`, with
    `recipient_ref: self` and the person's key, or `human:<id>` of that same person, with the period
    of class `content`; the person gets the link to the file as code text in a private chat.
    `recipient_ref: admin` is allowed only for a tenant export, and `apply` rejects a
    `privacy.export_sink` whose sink is not `self` (`export_sink_not_self`). An export task to a sink
    without `export_only` is rejected with code `sink_not_export`, and a person's copy to another
    recipient with `export_recipient_not_subject`. There is no separate report about a person's
    data: what is stored and for how long is in the privacy notice (SEC-13), and the person gets
    the data itself. The export arrives in v0.2, while the command `/mydata erase` works from v0.1
    (SEC-11, D-76).
  goal: C6
  check: [blackbox]
  waivable: true
  version: v0.2
  profile: core
  decisions: [D-12, D-36, D-76, D-102, D-114]
  fixtures: [blackbox:core/export-sink-not-export, blackbox:core/mydata-export, manifests/v02-lints, manifests/v02-security-lints]
  doc: docs/operations.md

- id: SEC-11
  title: A person's request and deletion through ports
  status: active
  text: >-
    A person's request (`SubjectRequest`) is a core record: the principal or author, the kind
    (`export`, `erase`, `erase_match`), the deadline `privacy.subject_request_days`, the state and
    the result. The commands `/mydata export` and `/mydata erase` through P2
    `principal.data_request` create a request about oneself and a `subject_request` card for the
    tenant's people with `admin:people`. Deletion at a person's request (`erase`, `erase_match`)
    works from v0.1, and for a tenant with `kind: production` this rule cannot be waived (D-76); the
    data copy (`export`, LCY-2) arrives in v0.2; it is only about oneself, carries the requester's
    public key (`recipient_key`) and goes only to the requester (SEC-10). The model neither creates
    nor decides a request. Silence neither executes nor closes a request: at half of the period the
    admins get a reminder, and at the deadline an overdue event and a notice to the operator. A
    confirmed deletion goes only through an erasure request with reason `subject_request` and scope
    `(tenant, subject)` through the erase operation of each port (RET-4, RET-7), including the
    sealed memory of retired bots. The scope includes objects where the principal is the initiator
    or owner, objects with them in `personal_subjects` (AUD-5) and group chat sessions whose key
    includes them (C3); before deleting the identity, the core itself creates an `erase_match`
    request by the principal's external ids and display name, which a second person with
    `admin:people` confirms; the person gets the result for each store as code text. A confirmed
    export enqueues a principal export task (LCY-2). The data of a person who is not a farm
    principal is deleted by an `erase_match` request: a person with `admin:people` creates it
    through P2 `erasure.match`, and another person with the same permission confirms it; if the
    tenant has no second active person with `admin:people`, a farm admin confirms through `farmctl`,
    and this counts as the second person (D-86 (8)). At creation the core searches for the exact
    string in all objects of classes `content` and `memory` of the tenant, including sealed ones,
    and in stores that the core does not read, with the port's `match` operation: the E4 runtime
    (short-term memory and transcripts), the E2 sink, the E1 channel cache; notes in the monitoring
    system are deleted by E5 `erase` by `(tenant, subject)` and found by `match`; a binding that
    cannot delete notes answers `failed`, and this is acceptable: by design a note carries no
    personal data (class `summary`, redaction, INJ-4), so such a result is shown to the person as a
    separate line and does not keep the request open. In v0.1 erase operations exist for C1
    `file.purge`, C3 `delete` and `purge`, C4 `erase`, E2 `erase`, E4 `purge` and E5 `erase`;
    `erase` and `match` of the E1 channel cache arrive in v0.2 (RET-11), and until then a channel
    without a cache answers `not_applicable`, and a channel with a cache `failed`. Any other store
    without `match` gives the result `failed` with an alarm, not "not found"; production tenant lint
    allows a role with `session: runtime_internal` or `memory: runtime_internal` only with a runtime
    adapter that declared `match` (RT-1). The core writes the ids of the objects found into the
    request and erases the string at once; the card shows the number of objects found per store,
    without content. The confirmation creates an erasure request with reason `subject_request` for
    these ids; an object is deleted as a whole, a tombstone remains, and after a restore the
    deletion is replayed by the same ids. The string does not enter the audit, events or the erasure
    log, not even as a hash. Fixture: after `erase_match` and a restore from a backup taken before
    the request, the canary string is in no store and in no request record.
  goal: C6
  check: [blackbox]
  waivable: true
  version: v0.1
  profile: core
  decisions: [D-12, D-36, D-76]
  fixtures: [blackbox:core/erase-match-restore, blackbox:core/erase-personal-subjects, blackbox:core/erase-runtime-no-match, blackbox:core/erasure-v01-ports, erasure/erasure]
  doc: docs/operations.md

- id: SEC-12
  title: Privacy report
  status: deferred
