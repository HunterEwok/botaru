- id: LCY-8
  title: Offboarding is final and frees the identity
  status: active
  text: >-
    P2 `principal.offboard` writes the principal state `offboarded`, which no operation leaves:
    `principal.on`, `principal.off`, `principal.set_identity`, `grant` and the use of an invitation
    for this principal answer `subject_closed`. In the same transaction the core deletes the links
    of the principal's channel identities, so the same external identity can be given to a new
    principal with `principal.add` or an invitation; the new principal has none of the old groups.
    The principal record keeps its opaque id, which core records already use (D-85). The same
    transaction cancels the principal's pending approvals and tasks (APR-6), creates the erasure
    request `(tenant, subject)` with the reason `offboarding` (RET-7, MEM-4) and sends the notice of
    IDN-13. The record shape is fixed in v0.1, so that records written before v0.2 hold no principal
    that v0.2 would revive (D-98); the event `principal.offboarded` comes in v0.2 (LCY-3).
  goal: C6
  check: [blackbox]
  waivable: false
  version: v0.1
  profile: core
  decisions: [D-98]
  fixtures: [blackbox:core/principal-offboard-final]
  doc: docs/operations.md

- id: MAN-1
  title: Wrapper, kind schema and apiVersion
  status: active
  text: >-
    A manifest in git sits in the wrapper `{apiVersion, kind, metadata, spec}` and passes the schema
    of its kind and `apiVersion`: `botaru/v1alpha1` until release 1.0.0, then `botaru/v1`. A kind
    without a registered schema is rejected. There is no `status` field in git: the core stores the
    status. References between declared objects are checked at `apply`. If a recorded object that a
    declared object refers to later disappears, the referring object is not used, and the error is
    visible in its status.
  goal: C9
  check: [fixture, lint]
  waivable: true
  version: v0.1
  profile: core
  decisions: [D-44]
  fixtures: [lint:manifests/wrapper]
