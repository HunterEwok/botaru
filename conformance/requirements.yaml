- id: MON-1
  title: Alarms to people along one installation path
  status: active
  text: >-
    The installation chooses the path of farm alarms to people with a conformance profile, and it
    has one path (D-88). An installation with profile `monitor` gives alarms to people only through
    the organization's monitoring system (MON-12): it has no delivery of alarms to people of its
    own. An installation without profile `monitor` delivers alarms to people itself with the code
    message `alarm_notice` (MON-13), and it has no export for E5. Paging people about an unhandled
    incident goes along the same path: the alarm `alarm.incident.unhandled` with `severity: page`,
    which the `incident` loop raises if within `page_if_unhandled_after` there is neither an
    operation nor a P2 `incident.ack`. There are no other paths: `apply` lint rejects a route that
    delivers an `alarm.*` event to people, and groups have no permissions to receive alarms.
    Fixtures: a farm with profile `monitor` gives, on a `firing` alarm, a delivery for E5 and no
    `alarm_notice` delivery; a farm without it gives `alarm_notice` and no delivery for E5.
  goal: C5
  check: [fixture, lint, blackbox]
  waivable: false
  version: v0.1
  profile: core
  decisions: [D-59, D-62, D-66, D-71, D-80, D-88]
  fixtures: [blackbox:core/alarm-path-monitor, blackbox:core/alarm-notice-no-monitor, manifests/v02-security-lints]
  doc: docs/operations.md

- id: MON-2
  title: An external poll checks core liveness
  status: active
  text: >-
    The core does not report its own death, so the core's P2 `health` is polled once a minute by a
    process outside the core with a separate key that works only on `health`: in an installation
    with profile `monitor` this is the monitoring system, without it the deployment watchdog (a
    process `kind: watch` in the deployment description, D-88). The core answers "alive" only if the
    store answers and all background loops marked a tick in time (OBS-4); with `false` the answer
    carries a reason code from a closed list (`store_unavailable`, `loop_stale`, `not_ready`,
    `draining` with the number `drain_until_s` during a core drain, LCY-6); the answer holds only
    numbers: free space on the store volume (CAP-5), three health indicators (OBS-9), the tick age
    of each loop and the age of the last successful export to the monitoring system
    `monitor_export_age_s` (MON-11). The `health` key is taken from the deployment configuration,
    not from the store, the `health` handler answers without the store and outside the worker pool,
    and during a key change two values work at once (the recipe is in `docs/operations.md`). No
    answer, a "not alive" answer or a number beyond the threshold for longer than the farm template
    threshold: the poller wakes people along its own path, not through the farm channel. The
    monitoring system raises a problem; the monitoring adapter sends it its own heartbeat once a
    minute, and absence of data from the adapter for longer than the threshold also gives a problem.
    The watchdog sends ready text along its own notification path (`watch.notify_ref` of the
    deployment description: its own bot or mail, not a tenant channel token) no more often than once
    in 30 minutes while the core is not alive, and one message when the core is alive again. The
    poller gets no credentials of the core, the store, the channels or the model provider, except
    the key for `health`; the monitoring system does not run on the core machine. A watchdog on the
    core machine does not see the death of the machine itself: `doctor` shows this as a remark, and
    deployment lint requires a watchdog if there is no monitoring system. Fixtures: stopping the
    `reaper` loop gives "not alive"; an unavailable store gives "not alive"; the `health` key does
    not pass on any other P2 operation; during `core.drain` the answer carries `draining` and
    `drain_until_s`; both keys from the change window pass; without a monitoring system, stopping
    the core process for 3 minutes gives one watchdog notification, and the return one more.
  goal: G4
  check: [lint, blackbox]
  waivable: false
  version: v0.1
  profile: core
  decisions: [D-60, D-80, D-88]
  fixtures: [blackbox:core/health-draining, blackbox:core/health-watch, manifests/deploy]
  doc: docs/operations.md

- id: MON-3
  title: Audit chain head in the monitoring history
  status: active
  text: >-
    At least once a day the core background loop `audit-head` puts, with a delivery of kind
    `monitor_audit_head` for E5, the audit chain head of each tenant and of the service tenant
    `farm`: the triple `(seq, hash, sig)`, where `seq` is the number of the last record, `hash` is
    its hash, and `sig` is the signature of this object with the core key with the key id
    (`spec/hashing.md`, chain head: type, tenant, epoch, seq, hash, key_id; AUD-6, SEC-5); `seq`
    decreases only together with a growth of `epoch`, and such growth appears in the `farm` chain as
    a restore record (D-86 (7)); the monitoring adapter of this tenant writes the head into the
    monitoring system history. This is an external witness for P2 `audit.verify`: `verify` checks
    the signature of each head from the history and the monotonicity of `seq` between them, so an
    adapter that writes the head with its token cannot forge or rewrite the witness, and an edit of
    the audit directly in the store gives a mismatch with the signed head or a gap in `seq`. The
    head delivery does not die by attempt count, it is repeated until the head is exported (MON-11).
    The retention period of this item's history in the monitoring system is not shorter than the
    audit retention period; the deployment sets it. P2 `doctor` shows the time of the last written
    head and fails the check if there is none for more than a day or if `seq` in the history is not
    monotonic; `doctor` reads through the monitoring system API the actual history retention period
    of the head item together with the general history cleanup setting, and warns if this period is
    shorter than 90 days. The witness holds as long as the store operator does not control the
    monitoring system; this separation of duties is written in `docs/permissions.md`. Fixtures:
    an edit of an audit record in the store bypassing the core, and `audit.verify` with heads from
    the mock monitoring system finds the mismatch; a head with a correct hash and a foreign
    signature is rejected by `verify`; a history with `seq` 12 after `seq` 15 fails `verify` and
    `doctor`; a mock monitoring system with a 30-day history period gives a `doctor` warning.
  goal: G2
  check: [adapter, blackbox]
  waivable: false
  version: v0.1
  profile: monitor
  decisions: [D-60, D-88]
  fixtures: [adapter:monitor/audit-head-signed]
  doc: docs/operations.md

- id: MON-4
  title: Permissions of the farm account in the monitoring system
  status: active
  text: >-
    Each monitoring adapter process (one per tenant and one for the service tenant `farm`, TEN-4)
    has its own account in the monitoring system. A tenant process account sees, reads and writes
    only the node groups of its tenant: problems, history, maintenance windows and scripts of the
    nodes that this tenant's catalog linked to its resources (`Catalog.spec.hosts[].monitor_host`),
    and this tenant's farm items; the `farm` process account manages farm nodes (core, workers,
    toolhost) and the farm template from git (`deploy/monitor/`) only in the farm node group and
    exports alarms about the farm itself. On nodes of its tenant the account can run monitoring
    system scripts (MON-10, D-69); on farm nodes, on nodes of other tenants and on nodes not linked
    by catalogs it has no script permission. The only write to someone else's problem is adding a
    message (code notes about actions with services and scripts, MON-8 and MON-10; from v0.2 bot
    notes, MON-7). No farm account has permissions to acknowledge, close and silence problems,
    change their severity, or change notification actions and maintenance windows. A machine that
    runs the core, the store, a channel, an adapter or backups (a farm node by the node list in the
    deployment configuration) cannot be a resource of a tenant catalog: `apply` rejects a catalog
    where the `monitor_host` or `machine` of a resource matches a farm node (DEP-11). P2 `doctor`
    checks through the monitoring system API the role and scope of each account and fails the check
    if the permissions are wider than listed: there is a permission to acknowledge, close, silence,
    change severity, notification actions or maintenance windows; a tenant account sees nodes of
    another tenant or the farm node group; any account has script permission on at least one node
    from the farm node list in the deployment configuration (not only on the farm node group).
    Fixtures: the mock monitoring system gives an account permission to acknowledge problems,
    `doctor` fails; the `demo` adapter account sees node `demo2`, `doctor` fails; script permission
    on node `core1` from the farm node list, `doctor` fails; a `demo` catalog with `monitor_host:
    core1.example.org` does not pass `apply`.
  goal: C3
  check: [adapter, blackbox]
  waivable: false
  version: v0.1
  profile: monitor
  decisions: [D-61, D-69, D-80, D-88]
  fixtures: [adapter:monitor/account-scope]
  doc: docs/operations.md

- id: MON-5
  title: Monitoring problems into the farm
  status: active
  text: >-
    The monitoring system sends a webhook to the E5 adapter when a problem opens and closes on a
    node that a tenant catalog linked to a resource. The adapter checks authenticity (token over
    TLS, ING-1) and hands the event to the core along the external event path (P1 `submit_activity`
    from a `service` principal with identity `hook:monitor`): `ext.monitor.problem.v1` with closed
    fields only (ING-2): `eventid`, `triggerid`, `resource` (the catalog resource the core mapped
    the node to), `severity` (monitoring system severity as a number 0-5), `state` (`open` or
    `resolved`) and numbers. The trigger name, its tags and the problem texts do not go into the
    event. The core takes the problem class only from the tenant catalog:
    `Catalog.spec.monitor_triggers: [{triggerid, class, item}]`, where `class` is from the closed
    table `spec/model/monitor-map.yaml`, and `item` is the item whose history number the `job` task
    reads through the monitoring system API; a trigger that is not in the catalog gives class
    `unknown`. The event idempotency key is `system:ingress:monitor:<eventid>:<state>`. A problem on
    a node that is not linked to any catalog resource does not enter the farm. A node belongs to
    exactly one tenant (D-75): `apply` rejects a catalog in which a `monitor_host`, a (machine,
    service) pair or a (node, script) pair is already linked to a resource of another tenant (TEN-4,
    DEP-11), so one tenant gets the event. The route enqueues a task of a `job` role without a model
    slot, which rechecks the problem with code through the monitoring system API (the problem
    exists, the node and the trigger are the same, the state is the same) and raises or closes a
    farm alarm by the class table: class `disk_free` gives `alarm.disk.free.low`, `disk_fill` gives
    `alarm.disk.fill.rate`, class `unknown` gives `alarm.monitor.problem` with severity `warn`. The
    alarm severity is set by the class table, not by the trigger tags. Then the alarm follows the
    incident catalog (MGR-7). An event for a trigger from `monitor_triggers` on a node from the
    tenant catalog is a trusted source (D-82): the task the route enqueues for it does not get
    `untrusted_seen`, and its source is recorded as `monitor` (for audit and cards); an event for a
    trigger that is not in the catalog sets the flag like any external event (INJ-13). Fixtures: a
    repeated webhook with the same `eventid` and `state` gives no new task; a webhook with a wrong
    token is rejected; a problem that is not in the mock monitoring system API raises no alarm; a
    trigger name with a canary appears neither in the event nor in the alarm; a trigger with a
    `disk_free` class tag that is not in `monitor_triggers` gives `alarm.monitor.problem` with
    `warn`, not `alarm.disk.free.low`; a `demo2` catalog with `monitor_host: db1.example.org`,
    already linked by the `demo` catalog, does not pass `apply`.
  goal: G4
  check: [adapter, fixture, blackbox]
  waivable: false
  version: v0.1
  profile: monitor
  decisions: [D-63, D-75, D-82, D-88]
  fixtures: [blackbox:monitor/trigger-not-in-catalog, blackbox:model/service-monitor-trusted]
  doc: docs/operations.md

- id: MON-6
  title: The monitor plugin is read only
  status: active
  text: >-
    The `monitor` plugin (port E3) gives bots only read tools: problems, item history and trends,
    maintenance windows. It answers only about nodes that the task tenant's catalog linked to its
    resources; plugin code does the check against the catalog, not the model. The plugin has no
    writes to the monitoring system; running monitoring scripts is a separate write tool of the
    action toolhost, `monitor/script_run` (MON-10). The farm treats the monitoring system of its own
    tenant as a trusted source (D-82), so trust in the output is set by the tool manifest, and code
    checks it. Trusted output (`untrusted_output: false`, sets no flag) is given by
    `monitor/problems` (node problems: `eventid`, `triggerid`, class and item from the catalog's
    `monitor_triggers`, class `unknown` for a trigger outside the catalog, the node resource,
    severity, state, time), `monitor/maintenance` (node maintenance windows: start and end) and
    `monitor/item_history` (item history and trends): the item is taken only from the catalog's
    `monitor_triggers` or from a closed list of fields, and the plugin returns only numeric values,
    while an item that the monitoring system declared as text or log (the item value type attribute
    in its API) gets `error(item_not_numeric)`. The plugin never returns trigger names, their tags
    or expanded problem texts from the API (INJ-16). Untrusted output (`untrusted_output: true`,
    sets the flag under INJ-13) is given by two tools: `monitor/item_text` (values of text and log
    items, for example log lines, flag source `monitor_item_text`) and `monitor/problem_comments`
    (comments on problems, written by people and bots, source `monitor_comment`). The manager's
    reader role uses the plugin together with `logs`. Fixtures: a request about a node of another
    tenant is rejected; `monitor/problems` and `monitor/item_history` on a numeric item of `web1`
    set no flag; `monitor/item_history` on a log item gets `item_not_numeric`; `monitor/item_text`
    sets `untrusted_seen` with source `monitor_item_text`; a trigger name with a canary in the mock
    monitoring system does not appear in the output of `monitor/problems`.
  goal: G2
  check: [adapter, blackbox]
  waivable: true
  version: v0.1
  profile: monitor
  decisions: [D-59, D-64, D-69, D-82, D-88]
  fixtures: [blackbox:model/service-monitor-trusted, blackbox:model/service-monitor-item-text]
  doc: docs/operations.md

- id: MON-7
  title: Bot notes on problems
  status: deferred
  deferred: 2026-10-14
  reason: 'Bot notes on monitoring problems are useful but not needed before the pilot and need editing of notes and a data recipient.'
  return_when: 'Operators ask for bot notes on problems in the monitoring system.'
  mechanism_removed: false
  text: >-
    A role whose manifest has `outputs: [monitor_note]` can return with a task result a note on a
    monitoring problem: the `eventid` of a problem on a node of its own tenant's catalog and a text
    of up to 1000 characters. The note goes in the optional `monitor_note` field of P1 `complete`,
    next to `result`; a refused note is dropped with its reason in the task journal and does not
    change the task outcome. The monitoring system is a third-party store read by the organization's
    people outside the tenant: with profile `monitor` it is named as a data recipient in the
    processing description (`recipients: monitoring`), the note's data class is no higher than
    `summary`, and the text passes the same redaction as outgoing data to third-party stores (INJ-4:
    ip, email, secret), the secret check as for an outgoing message (INJ-11; the INJ-12 leak check
    includes notes) and the tenant canary (TEN-5: the note text is part of the canary set). The core
    checks that the problem is on a node of this tenant and creates a delivery for E5; the adapter
    adds the note to the problem as a message marked `[botaru <bot_id>]`. A tenant gets no more than
    10 notes per hour, extra ones are rejected with `service_rate_limited`. A note cannot
    acknowledge, close, change the severity of or silence a problem, and the farm account has no
    permissions for that (MON-4). Fixtures: the eleventh note in an hour is rejected and the task
    still succeeds; a note on a problem of a node of another tenant is rejected; a note delivery
    carries no acknowledgement attribute; a note with an email address and an IP goes out redacted;
    a note with data of a class above `summary` is rejected; the tenant canary in a note does not
    reach the mock monitoring system.
  goal: G5
  check: [adapter, blackbox]
  waivable: true
  version: v0.2
  profile: monitor
  decisions: [D-61, D-64, D-88]
  fixtures: [blackbox:monitor/note-masking, blackbox:monitor/note-limits]
  doc: docs/operations.md

- id: MON-8
  title: Service control
  status: active
  text: >-
    Farm bots start, stop and restart services on machines of their own tenant's catalog (D-67). The
    catalog declares controllable services: `Catalog.spec.hosts[].services[]` with the fields `name`
    (the closed service name in the tenant, for example `nginx`), `unit` (the exact unit name on the
    machine, only for `via: host`), `control` (a subset of `start`, `stop`, `restart`), `via`
    (`host` or `monitor`) and `no_card` (verbs that go without an approval card: `[restart]` by
    default, and the catalog can only leave `[]`; `start` and `stop` in `no_card` do not pass
    `apply`, D-74); for a `via: monitor` service the field `scripts` names, for each verb from
    `control`, a script name from `hosts[].monitor_scripts_allowed` of that machine (MON-10).
    `apply` rejects a service without `control`, a verb outside the three, `via: host` without
    `unit` and `via: monitor` without a script for a verb; lint rejects services of the core and of
    farm nodes (core, workers, toolhost, adapter) in a tenant catalog, and a (machine, service) pair
    can be in the catalog of only one tenant (D-75, DEP-11). People grant the permission in the role
    manifest: `service_control: [<name>...]` or `service_control: ["*"]` (all services of its own
    tenant's catalog). If the task has an initiator, a person or an external program, it must have
    its own capability `service.control:<service>`, as for ordinary actions (D-73, APR-18): without
    it the call gets `forbidden` even though the role has the permission; an external program
    (`service`) gets this capability only with an explicit line for a specific service, without `*`;
    a task of a schedule, route or incident is enqueued by `system`, and its capability
    `service.control:<service>` is given only by an explicit line in group `system-ops` (APR-18),
    and the manager needs the capability of group `farm-manager-ops` (APR-18). The bot calls the
    action toolhost write tool `service/control {service, verb}`: `service` only from
    `services[].name` of the task tenant's catalog, `verb` only from the `control` of that service,
    and code takes the machine from the catalog, not the model. A `via: host` service is run by the
    OS mechanism `unit` under the OS mechanism binding in `spec/bindings/os/` (DEP-4): `apply`
    generates the access rule on the machine from the catalog, and it allows the OS user of this
    tenant's action toolhost exactly the `control` verbs on the exact unit names from the catalog;
    `wait: true` is allowed if the action fits into `timeout_s`. A `via: monitor` service is run by
    a monitoring system script with a `monitor_script` delivery for E5 (MON-10); such a service
    exists only in an installation with profile `monitor`, without it `apply` rejects `via:
    monitor`, and there are no notes in the monitoring system (D-88). A restart (`restart`) from the
    allowed list (the service is declared in the catalog, the role has the permission on it, the
    initiator has the capability) goes without an approval card (D-68, D-74, APR-18), except for a
    task with `untrusted_seen` (INJ-15, D-70); instead of an approval number the call carries the
    number of a `service_grant` audit record (bot, role, task, service, verb, task reason code), and
    the toolhost runs it once by this number. Start and stop (`start`, `stop`) go through an
    approval card like an ordinary action (APR-3, APR-7): a person with
    `action.approve:service.control:<service>` decides, and the call carries `approval_id`. Default
    guards, which the catalog can tighten but not loosen: no more than 6 actions per service and 30
    per tenant per hour, an extra call gets `service_rate_limited` and raises the alarm
    `alarm.service.control.rate` (`warn`; if a stop hit the limit, the alarm goes with `page`); one
    operation per service at a time (`exclusive: resource`); a hold with `no_tool` or `no_action` on
    the call scope (including a maintenance window hold MON-9, a hold of scope `bot` and an operator
    hold) gives `denied(held)` (HLD-3). 2 minutes after a stop or a restart, code reconciles the
    service state (by its `health` if declared, otherwise by the monitoring problem) and writes the
    result into the task journal. The model gets the result only as closed fields: the result code,
    the service state after reconciliation and the `service_grant` number or `approval_id`. Each
    action writes an audit record and a code note in the monitoring system from template
    `service_control_done` marked `[botaru <bot_id>]` on the task's `monitor_event` problem, and if
    there is none, on the last open problem of the node; if there are no open problems on the node,
    there is no note. The note is a `monitor_note` delivery without model text and outside the MON-7
    limit. The channel command `/service <verb> <service>` from a person with the capability
    `service.control:<service>` (PRM-18) is run by the same tool without a card, because the person
    made the decision themselves: a `service_grant` record with the person as author, the same
    closed lists, guards, counters, reconciliation and note. The manager acts under the same rules
    and on top of them is limited by the seat limits (MGR-14) and by the incident class fields
    `responses.services` and `responses.monitor_scripts`. Fixtures: a role without `service_control`
    on the service gets a refusal; a verb outside `control` is rejected; a service of a core node in
    a tenant catalog does not pass lint; service `nginx` on `web1` in the catalogs of `demo` and
    `demo2` does not pass `apply`; `no_card: [stop]` does not pass `apply`; `restart nginx` from a
    bot at the request of `bob` with `service.control:nginx` goes without a card, while the same
    request from `carol` without this capability gets `forbidden` despite the role permission; `stop
    nginx` from a bot goes through a card decided by a person with
    `action.approve:service.control:nginx`; the seventh restart of one service in an hour gets
    `service_rate_limited` and a `warn` alarm, the seventh stop gives `page`; `/service restart
    nginx` from `bob` gives a `service_grant` with author `bob` without a card, and from `carol`
    without the capability gets `forbidden`; a call under a `host` hold gets `denied(held)`; a
    restart gives a `service_grant` record, one `service_control_done` note and a reconciliation
    after 2 minutes; without an open problem on the node and without `monitor_event` on the task
    there is no note.
  goal: C5
