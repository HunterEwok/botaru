- id: MGR-26
  title: Target origin
  status: active
  text: >-
    A target from the code list for the task's basis is applied immediately within the seat. A
    target that is not on the list and came from a finding is applied only through
    `decide(subject_kind: control)` by a tenant person with `control.approve` (by default in groups
    `approver` and `admin`). The channel draws the `control` card from the record without model
    text; its expiry is 1 h, and after expiry the operation is not applied; an approved operation is
    applied through `control.apply` on behalf of the person who decided. Each operation call records
    the target origin: `code` or `finding:<id>`.
