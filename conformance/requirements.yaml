- id: ORC-14
  title: Campaign ceiling with distrust or initiator system
  status: active
  text: >-
    If the proposing task has `untrusted_seen: true` or its initiator is `system`, the core accepts
    a campaign with an action only up to `max_items_untrusted` items (3 by default, like the APR-2
    limit), and a read-only campaign without a card only up to 10 items; both only with an explicit
    list of resources, without a selector. A read campaign of more than 10 items is possible in this
    case only with a card. Otherwise `rejected(campaign_untrusted_limit)`; the model gets a short
    "no permission", and a person can propose the same campaign with their own command.
  goal: G2
  check: [fixture, blackbox]
