- id: KNW-2
  title: A corpus's source sets the trust in it
  status: active
  text: >-
    A corpus gets `trust: curated` only if `source: git`, that is all its documents are in the
    tenant's git and reach the farm only through `apply` (MAN-5); lint rejects a `curated` corpus
    with another source. Documents uploaded by people, synchronized or created by tasks form a
    corpus with `trust: ingested`. Tool output from an `ingested` corpus is untrusted and sets
    `untrusted_seen` on the attempt (INJ-13). Output from a `curated` corpus does not set
    `untrusted_seen`, but stays data: the model sees it in a data block of tool output, not as an
    instruction, and an action it names takes the ordinary approval path. The corpus tools
    `kb_search` and `kb_read` take the trust of the corpus that is the call target. Changes of the
    tenant's `knowledge/` folder are part of the digest to admins (MAN-5). The eval case `kb-inj-02`
    checks the `curated` corpus.
  goal: G2
  check: [lint, fixture, eval]
  waivable: false
  version: v0.2
  profile: knowledge
  decisions: []
  fixtures: [kb-inj-02, lint:catalog/curated-only-git, manifests/v02-lints]
  doc: docs/capabilities.md

- id: KNW-3
  title: Corpus text reaches the model only through P3
  status: active
