- id: MGR-53
  title: Analysis after an incident
  status: active
  text: >-
    When an incident moves to `resolved` in a tenant with the manager enabled and
    `farm_manager.postmortem` (true by default), the core enqueues one task `manager.postmortem.v1`
    with key `system:postmortem:<incident>` (IDM-2); a reopened and again resolved incident gets no
    second one, nor does one dismissed as false. Code builds the table: time, alarms, operations,
    involved parties; each reader sees its rows by its own permissions, and people only by ids
    behind "Details". A model paragraph is written only for sev1, when code found link candidates
    (GOV-38, GOV-13, TRN-7) or on a person's request; one per class and object in 7 days. It is
    marked as untrusted model text, cites its sources, and code checks its numbers against the
    table. If the purpose `incident_review` is off in T, the report is only the table with the mark
    "reading off". The report goes to the people of T as `postmortem_report` within the per-person
    limit (excess goes to the next digest), and to the farm operators only numbers for incidents of
    `farm`. It is paid from the `manager` line outside the sev1 reserve, within the daily ceiling
    `farm_manager.postmortem_max_eur.day`; without money above the reserve it waits for the next
    day. From the analysis the manager may submit a proposal (MGR-51).
  goal: G5
  check: [blackbox]
  waivable: true
  version: v0.3
  profile: manager
  decisions: [D-30, D-110, D-114]
  fixtures: [blackbox:manager/postmortem]
  doc: docs/farm-manager.md

