    A personal assistant task (a type of a role with per-person memory, `memory: person`) is
    enqueued only by the owner, from a private chat; at `claim` the core writes the owner into the
    lease (`owner`), and the attempt sees the memory, session and inbox only of this owner. The
    owner's tasks from a group chat and other people's tasks are not enqueued for the assistant.
  goal: G2
