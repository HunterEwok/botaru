- id: IDN-16
  title: Only the core writes the seat holder, from v0.3
  status: active
  text: >-
    Seats are declared by the charter (GOV-33), a seat has no more than one holder, and only the
    core writes the holder, in one transaction that increments the seat epoch and writes a seat
    event and an audit record, as in IDN-10. The trigger comes only from a closed list: a confirmed
    promotion case (GOV-9); P2 `seat.assign`, `seat.vacate` or `seat.resume` by a person with
    `admin:governance` through `farmctl` (PRM-14); a confirmed link under GOV-42 (the seat becomes
    vacant and the holder is parked); the holder's departure (IDN-15). There is no stop on an
    incident (GOV-47). The epoch fencing and the cancellation of running seat attempts are as in
