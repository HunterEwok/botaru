    figures, and the ready commands `farmctl seat vacate <seat>` and `farmctl seat assign <seat>
    <bot>` (replacing the holder); the card is repeated once a month while the flag holds. `doctor`
    and P2 `commission.status` show "commission locked" (`commission_locked`) with the same basis.
    The card decides nothing and frees no seat: only a person changes the holder, through `farmctl`
    (PRM-14, IDN-10), and neither code nor a bot opens a case on this basis.
  goal: G5
