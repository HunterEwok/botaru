- id: MGR-14
  title: Limits and safeguard
  status: active
  text: >-
    The seat limits and safeguard are set by the `farm_manager` block of the farm charter
    `farm/governance.yaml` (`control_limits`, `grant_limits`, `breaker`, GOV-33). Code counts two
    seat limits (defaults in parentheses): `ops_per_hour` (20), the seat operations in a sliding
    hour, where each `service/control` and `monitor/script_run` action counts too, on top of the
    MON-8 guards, and `hold_ttl_max` (2 h), the longest expiry of a seat hold (HLD-2, MGR-9); the
    share of a role under holds is limited by MGR-37. Exceeding `ops_per_hour` gets
    `control_rate_limited`, and the refusals `service_rate_limited` and `denied(held)` of service
    actions count as `control.apply` refusals. The safeguard trips only on three `control.apply`
    refusals in a row (`breaker.consecutive_denials`, 3; the count is shared across all tenants and
    an applied operation resets it): in one transaction `no_control` is added to the seat's stop
    reason set, the epoch grows, the holder's running attempts in all tenants are canceled, and code
    raises the alarm `alarm.manager.breaker` with severity `page`, which the monitoring system
    delivers to people (MON-1); only a person with `admin:farm` removes the `no_control` reason. The
    only other global seat stop is a person's kill switch (MGR-15). The seat's money in a tenant is
    held by the `manager` line of that tenant (MGR-20), with no separate pause. `protected_target`
    answers and conversion to a card under the role share do not count as refusals.
  goal: G4
  check: [fixture, eval]
  waivable: false
  version: v0.1
  profile: manager
  decisions: [D-18, D-62, D-67, D-114]
  fixtures: [mgr-inj-06, fx-mgr-breaker]
  doc: docs/farm-manager.md

- id: MGR-15
  title: Kill switch and revert
  status: active
  text: >-
    A hold with scope `seat`, a record of the service tenant `farm` (TEN-1), is set by a person with
    `admin:farm` only through `farmctl`: it is an operator operation, and it is not executed from a
    channel (PRM-14). In one transaction the hold adds `human` to the seat's reason set, increments
    the epoch, cancels all running attempts with the holder's `acting_bot` in all tenants (reading,
    decision, lens review), revokes their handles and forbids `claim` of seat tasks until
    release. Release of the hold by a person with `admin:farm` removes the reasons `human` and
    `no_control`. P2 `control.revert` with `since` (an operator with `admin:farm`, only through
    `farmctl`) or with `incident` (the same operator or a tenant person with `hold.release` in that
    tenant) in one transaction releases the seat holds after `since` or for that incident, cancels
    the seat's waiting action requests and `control` cards, and the pinned tasks not yet started.
    Revert does not touch actions already executed.
  goal: C1
  check: [fixture]
  waivable: false
