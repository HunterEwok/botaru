  title: Preemption
  status: active
  text: >-
    `preempt` moves an attempt to `preempted`; the attempt is not spent, and the task returns to the
    queue. No more than 2 preemptions per task, the next one gives `canceled(preempt_limit)`.
    Preemption and cancellation do not revoke writes already made by tools.
