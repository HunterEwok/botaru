- id: TEN-7
  title: References only to one's own objects
  status: active
  text: >-
    `file_ref` in attachments and the `refs` of a request are accepted only if the object belongs to
    the task's tenant and the initiator uploaded or created it, or the object came from the `origin`
    chat. For a foreign and for a nonexistent reference the answer is the same:
    `rejected(ref_invalid)`. `file_ref` carries 128 random bits, not a content hash. A child task
    gets only the parent's attachments.
  goal: C3
