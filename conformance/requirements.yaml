- id: BUD-12
  title: A campaign with a card and a script run are paid from the monthly limit by the amount on the card
  status: active
  text: >-
    A campaign with an approval card is paid from the tenant's monthly limit and the budget line of
    its type, for the amount shown on the card. When a campaign is proposed, the core estimates the
    price of all its items and of the continuation and reserves that amount in full (ORC-8); the
    approval accepts exactly that amount. The daily limit of the human initiator does not apply to
    the items of such a campaign: it is checked only for that person's direct requests. A campaign
    without a card reserves the estimate in all limits of BUD-1, including the initiator's daily
    limit; a read campaign that lacks only the daily limit of the human initiator gets a card
    instead of a refusal and, after approval, is paid like a campaign with a card (ORC-8). A script
    run is paid like a campaign with a card: when the run is approved, the core reserves its
    estimate in full, at the worst case over all branches (SCR-8), in the tenant's monthly limit and
    in the `work` line (step types have the purpose `work` or `report`, SCR-2), within the amount on
    the card and without the initiator's daily limit; `fanout` campaigns inside a run take their
    reserve from the run's reserve and do not reserve it a second time (SCR-8). Usage does not
    exceed the amount shown: an item that does not fit in the remainder of the campaign's reserve is
    not released, and the campaign pauses with the reason `estimate_exceeded`, which the "Continue"
    button does not clear (ORC-8).
  goal: G3
  check: [blackbox]
  waivable: false
  version: v0.1
  profile: core
  decisions: [D-36, D-53]
  fixtures: [blackbox:core/campaign-reserve]
