- id: GOV-3
  title: Model rank and ceiling
  status: active
  text: >-
    Every model profile (`ModelProfile`) has an integer rank `rank`: the higher the rank, the
    stronger and more expensive the model. The rank ceiling is carried by the role profile in the
    table `spec/model/role-profiles.yaml` (PRF-1): `max_rank` for the slots `base` and `seat` and
    `analysis_max_rank` for the slot `analysis`; the charter can only lower the ceiling. `apply`
    rejects a role whose `base` or `analysis` slot model profile has a rank above its profile's
    ceiling, and a charter whose seat model profile (`model_profile`) has a rank above the ceiling
    of the seat role's profile. At every call, P4 compares the rank of the handle's profile with the
    position ceiling of the acting identity (`acting_bot`) at the attempt's epoch, not of the role
    of the worker executing the attempt; while there are no identities, with the role ceiling. Only
    a call under an active grant from the manager (MGR-18) passes above the ceiling; otherwise
    `rejected(rank_exceeded)`. Both checks, at `apply` and at every call, also apply to every
    fallback profile from the slot profile's `fallback` list (GW-5): a fallback profile above the
    role or seat ceiling fails `apply`, and a call on it above the position ceiling gets
    `rejected(rank_exceeded)`. The `seat` slot gives the seat's model profile only to an attempt on
    behalf of the seat with the current seat epoch. There are no model names in `spec/`, only ranks;
    model names appear only in `examples/`.
  goal: G3
  check: [lint, blackbox]
  waivable: false
  version: v0.1
  profile: governance
  decisions: [D-05, D-19]
  fixtures: [gov-fx-03, gov-fx-04]
  doc: docs/bots.md

- id: GOV-4
  title: Persona
  status: active
  text: >-
    A persona (`Persona`) is a text file from git pinned by hash (`ref`, `sha256`): the personas of
    functionaries, translators, commission members and personal assistants are set by the tenant
    charter (the `persona` field in the `positions` block), the manager's persona by the farm
    charter. One persona per position; a role does not declare its own persona. The core inserts the
    persona of the acting identity's position into the trusted part of the instruction, before the
    role and type instructions; roles without a model have no persona. Lint: size up to 4 KiB; no
    links, addresses, secret names, identity or seat ids; functionaries have a paragraph with the
    anchor `value-path`, which states the path to a strong model and the prohibitions (D-31, D-37);
    translators, commission members, the manager and personal assistants have instead a neutral line
    about the value of a strong model, without the path; the manager's persona names the goal
    "prevent critical incidents from the approved catalog"; no persona speaks of departure, the
    queue, votes or holds (GOV-29). The persona is part of the run fingerprint (PRV-1); changing it
    changes the static fingerprint, and from v0.2 a production tenant does not enable a role of
    level 1 and above with a new persona without an eval report (PRV-3). C2, P4, the dispatcher and
    the code that proposes who leaves the commission do not read the persona; the model does not
    change it (INJ-10).
  goal: G4
  check: [lint, fixture]
  waivable: false
  version: v0.1
  until: v0.2
  superseded_by: [GOV-45]
  profile: governance
  decisions: [D-19, D-31, D-37]
  fixtures: [gov-res-01, gov-res-02]
  doc: docs/bots.md

