- id: GW-2
  title: Worst-case reserve and charging by the provider response
  status: active
  text: >-
    Before each call, P4 reserves the worst case: an upper estimate of the input plus the profile's
    `max_output_tokens`, at the `ModelProfile` prices in micro-euros (BUD-9), in all applicable
    limits and in the task's budget line; for a call under an active model grant (slot `granted`),
    the applicable limits include the remainder of the grant amount `cap_eur` (MGR-18). P4 sets the
    output limit in the request to the provider no higher than the profile's `max_output_tokens`.
    After the response, P4 charges the usage from the provider's response with the sum of all
    iterations, including server-side compaction, cache write and read, and reasoning, and releases
    the rest of this call's reserve. A call without a response is charged under BUD-11. Check: the
    number of mock provider calls equals the number of usage lines.
  goal: G3
  check: [blackbox]
  waivable: false
  version: v0.1
  profile: core
  decisions: [D-45, D-87]
  fixtures: [blackbox:core/usage-rows]
  doc: docs/models-and-money.md

