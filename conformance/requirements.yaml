- id: PRP-21
  title: Change trial record on "Accept"
  status: active
  text: >-
    On "Accept" or "Lift veto" of any kind other than `none`, the core creates in the same
    transaction a change trial record: the metric from `benefit.metric` (a series with an `outcome`
    block, OBV-6), the direction and the promised change from `benefit`, the subjects that the core
    derives from the change targets, the metric value before (for the 14 days before "Accept", as
    numbers) and one to five guards, also with values before. The core takes the guards from two
    tables of the registry `spec/model/core-series.yaml`: by the kind of the change target and by
    the metric (for example, metric `farm.task.outcome` is always guarded by `farm.attempt.duration`
    of the same type, and `farm.queue.wait` is guarded by `farm.task.cost` and by the subjects' load
    series, if it is declared with an `outcome` block); a tenant can only add guards
    (`insights.extra_guards`), a table guard cannot be removed, and `apply` lint checks this. The
    trial window is 14 days from `realized`. The model does not write into the record; a proposal of
    such a kind with a metric not from the registry gets the refusal `rejected(metric_unknown)` at
    creation.
  goal: G5
  check: [blackbox, fixture, lint]
  waivable: false
  version: v0.1
  profile: insights
  decisions: [D-24, D-37, D-71]
  fixtures: [prp-09, prp-13]
  doc: docs/improvements.md

- id: PRP-22
  title: Own evidence share and the trial outcome computed by code
  status: active
  text: >-
    For each evidence series the core computes at creation `self_influence`: the share of points
    produced by attempts of the author bot (`author_share`; while bots have no numbers, of its
    worker), and the share of points of its role (`role_share`). With `author_share` not less than
    0.3, the people's card and the reviewer input carry the mark `self_evidence` without the
    author's identity. The fields `self_influence` and the trial outcome (`trial.outcome`) are in
    the record schema from v0.1. At the end of the window only code computes the trial outcome, from
    a closed list: `better`, `unchanged`, `worse`, `undetermined` and `mixed` (mixed with another
    change). Order of computation: if a guard tripped within the window, the outcome is `worse`;
    otherwise, if within the window another proposal was executed on the same subjects or another
    commit changed fields of the same objects, the outcome is `mixed`; otherwise the metric is
    compared with the series tolerance in three computations: over all points, without the points of
    the author bot, and without the points of all bots of its role; a worsening beyond the tolerance
    in at least one computation gives `worse`, an improvement beyond the tolerance in all of them
    gives `better`, and the rest gives `unchanged`. A computation in which `min_samples` was not
    reached before or after gives `undetermined`, except in one case: if the metric's points are
    produced only by attempts of the author or its role (the computation without them is empty or
    shorter than `min_samples`), the outcome is computed from the remaining computations and carries
    the mark `self_measured`; such an outcome is visible on cards and in "My outcomes", and a
    promotion trigger from it appears only after a person's "Count it" button on the case card
    (GOV-14). `apply` lint warns if a role with an `insight` section has one bot and its `observes`
    contains only series of its own task types. The core writes the outcome and the numbers into the
    `trial` of the proposal record. If the change was reverted before the end of the window
    (PRP-20), the outcome is `worse` when a guard tripped before the revert or the revert reason is
    `harm_observed`, otherwise `canceled`. Outcome `worse` is a worsening confirmed by the core
    (D-37). Attributing an incident to a change does not change the trial outcome; a disputed
    attribution (`disputed`, GOV-13) only delays the promotion trigger until it is resolved (D-79).
  goal: G5
  check: [fixture, blackbox, lint]
  waivable: false
  version: v0.1
  profile: insights
  decisions: [D-37, D-79, D-24, D-71]
  fixtures: [prp-04, prp-11, prp-12, prp-16, prp-10]
  doc: docs/improvements.md

- id: PRP-23
  title: The "Revert" card for the executor
  status: active
  text: >-
    The core checks the trial guards once a day. If a guard went beyond the tolerance in the bad
    direction, the executor gets a "Revert" card with the reverse edit (PRP-20) and, if the change
    can be neutralized with a hold (a schedule pause, a type hold), with a hold button: this is a P2
    `hold.set` operation button, which the core accepts only from the executor with the permission
    `hold.set:<scope>` (HLD-1, APR-4); the executor gets the same card on outcome `worse` at the end
    of the window. The farm itself reverts nothing and does not write to git. Until there is a
    revert, the trial runs to the end of the window.
  goal: G4
  check: [blackbox]
  waivable: true
  version: v0.1
  profile: insights
  decisions: [D-37]
  fixtures: [prp-05]
  doc: docs/improvements.md

- id: PRP-24
  title: A rejected proposal can be submitted again
  status: active
  text: >-
    The core marks a proposal as a resubmission when its fingerprint (PRP-5) equals that of a
    proposal the commission dismissed or parked by score. A resubmission is accepted no earlier than
    30 days after that verdict, from any bot, with the credit to the new author, and at most once
    per fingerprint in 90 days; otherwise it gets `rejected(resubmit_too_early)`. Reviewers do not
    see that it is a resubmission. If the values of the change are the same and the trial of the
    resubmission ended, the forecasts of the first round are scored by this outcome (COM-16); if the
    values differ, the first round is not scored.
  goal: G5
