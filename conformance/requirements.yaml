- id: MAN-3
  title: Only additions within a version
  status: active
  text: >-
    Within version `.vN` of a task type, event type, message type and schema, only additions of
    optional fields are allowed; a breaking change is `.v(N+1)` next to `.vN`. The core is the main
    validator, workers tolerate unknown fields. The CI check `ci/check-additive` compares the schema
    with the previous commit.
  goal: C9
