- id: DEP-9
  title: A separate action toolhost
  status: active
  text: >-
    Write tools run in a separate toolhost that does not execute read tools and does not start read
    plugins. The run request queue of the `oneshot` mechanism (DEP-4) is writable only by the OS
    user of this toolhost, and the rule of the `unit` mechanism (the OS mechanism binding in
    `spec/bindings/os/`) allows the verbs only to it; no other process on the machine runs as this
    user. The parser rejects a run request file placed by anyone other than the action toolhost
    user, including the read toolhost user, and the OS mechanism does not allow a request to the
    service manager from another user. The action toolhost accepts a write call only if it carries
    an approval number (APR-7) or `grant_id`, the number of a `service_grant` audit record (APR-18),
    the tenant matches and the argument hash equals the recorded one.
  goal: G2
  check: [lint, blackbox]
  waivable: false
  version: v0.1
  profile: core
  decisions: [D-36, D-67, D-68]
  fixtures: [blackbox:toolhost/os-rule-other-user]
  doc: docs/permissions.md

- id: DEP-10
  title: The deployment is described by data and checked by lint
  status: active
  text: >-
    The deployment is described by data: for each machine its kind (production machine or sandbox
    VM); for each farm process and plugin the OS user, networks, volumes and named secrets; for
    action executors the OS users per tenant (`os_users`); the address of the monitoring system (if
    the installation declares the `monitor` profile) or a `kind: watch` watchdog (if not, MON-2);
    the location of `backup` copies (RET-5); the list of farm nodes `farm_hosts` (DEP-11); and the
    rotation method of each named secret (SEC-5). The description follows
    `spec/model/deploy-topology.schema.json`, and the lint checks the facts that the schema has
    fields for; a fact the schema has no field for (for example a process kind of the agent, a
    plugin image digest, the docker group or socket, an address of a described machine) is not part of the
    description and is not linted from it; the schema is closed, so a description with such a
    field fails the schema. The schema has no process kind of the agent and no address of the described machines, so
    the network of the agent (DEP-5) and the machine the monitoring system runs on (MON-2) are not
    linted; a later schema version that adds these fields lints them. The deployment lint checks the description before
    rollout and in `farmctl doctor` against the rules DEP-1, DEP-3, DEP-4, DEP-6, DEP-7,
    DEP-8, DEP-9, DEP-11 (including that a machine does not appear in the catalogs and processes of
    two tenants, D-75), SEC-2 and SEC-5, and also that no farm process but the monitoring adapter
    and the watchdog holds the key for P2 `health`, and that the watchdog holds no other farm
    credential but its own alert secret (MON-2, `poller_credentials`), that there is a watchdog when there is no monitoring
    system (`watch_missing`), and that backups are not on the core machine or leave encrypted to
    external storage (RET-5, `backup_external_required`). A farm on one server (`farm_hosts:
    [core1]`) is allowed (D-88). The lint counts `farmctl` on the core machine as a core process
    (DEP-8). A violation fails the lint.
  goal: G2
  check: [lint]
  waivable: false
  version: v0.1
  profile: core
  decisions: [D-36, D-60, D-75, D-88]
  fixtures: [lint:deploy/os-rule-matches-catalog, lint:deploy/toolhost-on-farm-host, lint:deploy/two-tenants-one-host, manifests/deploy]
  doc: docs/permissions.md

- id: DEP-11
  title: A farm node is not a tenant resource
  status: active
  text: >-
    A machine that, by the deployment description, runs the core, the store, `farmctl`, a channel or
    the watchdog, or holds backups, is a farm node; external backup storage (RET-5) is not a farm
    node. The deployment description lists the farm nodes in `farm_hosts`, and the lint fails the
    description if such a process or backups are on a machine outside the list. A farm node is never
    a resource of a tenant catalog: `apply` rejects a catalog in which the `monitor_host`, `machine`
    or `host` of a resource, service or script matches a farm node, and the deployment lint rejects
    a toolhost, plugin, action executor or tenant OS user (`os_users`) on a farm node. In an
    installation with the `monitor` profile, `farmctl doctor` checks that every farm node is in the
    monitoring system's farm node group and that the adapter accounts have no script right on this
    group (MON-4). A machine belongs to exactly one tenant: the pair (machine, service) and the pair
    (monitoring node, script) appear in the catalog of one tenant, and `apply` rejects a catalog in
    which `machine`, `host` or `monitor_host` is already linked to another tenant (D-75, TEN-4); by
    the same rule the deployment lint does not allow toolhosts, plugins and executors of two tenants
    on one machine. In the single-server example, `farm_hosts: [core1]` (D-88). In the main example,
    `farm_hosts: [core1, backup1]`: the core, the store and the channel are on `core1`, store
    backups on `backup1`, and `web1`, `db1` and `ctd1` are only machines of the `demo` tenant
    catalog. Fixtures: the `demo` catalog with `monitor_host: core1` is rejected by `apply`; a
    deployment description with a `demo` toolhost on `core1` fails the lint; the `demo2` catalog
    with `machine: web1`, which is already in the `demo` catalog, is rejected by `apply`.
  goal: C3
  check: [lint, fixture]
  waivable: false
  version: v0.1
  profile: core
  decisions: [D-75, D-88]
  fixtures: [lint:manifests/farm-host-in-catalog, lint:deploy/toolhost-on-farm-host, lint:catalog/host-one-tenant, lint:deploy/two-tenants-one-host]
  doc: docs/permissions.md

