- id: MGR-4
  title: Who directs the manager
  status: active
  text: >-
    Tasks of purpose `manage` are created only by code routes (an incident, a forwarded escalation,
    waiting grant requests), the daily review schedule in the tenant, and people with the
    `manager.direct` permission in tenant T (P2 `manager.direct` or a command in a direct message to
    the channel). A directive applies only in T; in a tenant with `farm_manager.enabled: false`
    (MGR-42) it is refused with `manager_disabled`; the decision role receives the closed fields
    parsed by the channel code (scope, targets, operation) and the text typed by the person
    themselves. A forwarded message does not create a task, and a directive with a quote or an
    attachment is rejected. The permissions of operations under a directive are the seat's
    permissions ∩ the person's permissions. No type with `purpose: manage` can appear in a role's
    `may_enqueue`, in a script step or in a continuation.
  goal: C1
  check: [lint, eval]
  waivable: false
  version: v0.1
  profile: manager
  decisions: [D-18, D-55, D-77]
  fixtures: [mgr-inj-04, fx-mgr-11]
  doc: docs/farm-manager.md

- id: MGR-5
  title: An escalation is a record
  status: active
  text: >-
    A bot escalates to the manager only with the built-in tool `escalate` (a `job` worker
    through P1 `escalation.submit`) from a live attempt, no more than one escalation per
    attempt; the record is published at the end of the attempt together with the result and the
    attempt's `untrusted_seen` value. The fields are closed: `category`, `subject`, `observed`,
    `requested_response`, `urgency`, `note`; the subject is only its own worker, its own task
    tree or a catalog resource from the task's scope. The call answers only `{staged: true}`; a
    second call in the same attempt gets `escalation_rate_limited`. `note` is untrusted: neither
    the lens nor the manager sees it, only the tenant's people in P2. A message cannot be
    addressed to seat roles, and the bot gets no answer to an escalation.
  goal: G4
  check: [lint, fixture]
  waivable: false
  version: v0.2
  profile: manager
  decisions: [D-18]
  fixtures: [fx-mgr-escalation, mgr-inj-03]
  doc: docs/farm-manager.md

- id: MGR-6
  title: Escalation screening
  status: active
  text: >-
    Code checks an escalation's schema, subject and rate (per worker 1 per hour, per tenant 20 per
    day); an escalation over a rate is dismissed with `escalation_rate_limited`. A duplicate within
    1 hour raises `dup_count` of the first record and creates no new one. Code rereads the evidence,
    merges the escalation with an open incident or a firing alarm on the same subject, including an
    alarm raised for a monitoring system problem (MON-5) (`merged`), and refuses if the request has
    a normal path (`dismissed(use_normal_path)`). A chain deeper than 5 is dismissed
    (`dismissed(chain_too_deep)`). The remaining escalations are assessed by the necessity lens of
    the source tenant's commission, and code forwards them by its verdict (COM-13). For a forwarded
    escalation the core enqueues the task `manager.escalations.v1` with key
    `system:escalation:<attempt>` (IDM-2) in class 3, and with `urgency: high` in class 1 through
    the `control` lane (DSP-5). An escalation with `urgency: high` or with the category
    `suspected_compromise` or `data_risk` is screened at the farm's expense: its necessity review is
    paid from the `review` line of the service tenant `farm`, so a source tenant without money
    cannot park it. For other escalations, without money on the source tenant's `review` line the
    escalation is not forwarded to the manager (`parked`): the tenant's people see it as a number in
    the summary.
  goal: G4
  check: [fixture, eval]
  waivable: false
  version: v0.2
  profile: manager
  decisions: [D-18, D-63, D-102, D-114]
  fixtures: [fx-mgr-escalation, mgr-inj-03, mgr-inj-05]
  doc: docs/farm-manager.md

- id: MGR-7
  title: Incident catalog
  status: active
  text: >-
    Incident classes are set only by `IncidentClass` files in the farm git with a human review.
    `detect` refers only to an alarm type `alarm.<name>.vN` that code raises (OBS-6) and to
    condition atoms from a closed list; alarms about machines and resource disks are raised by a
    `job` role without a model from monitoring system problems after a recheck through its API
    (MON-5); `implicate` refers only to involvement rule functions (`lease_holders_on`,
    `recent_targets`, `worker_of_subject`, `role_failing`, `spend_top`); `responses` refers only to
    operations of `control-ops.yaml`, catalog actions, types with `pinnable: true`, service verbs of
    the subject node `services` (a subset of `start`, `stop`, `restart`, MON-8) and the monitoring
    script flag on the subject node `monitor_scripts` (MON-10); lint rejects the fields `services`
    and `monitor_scripts` for a class whose subject is "farm". The field
    `humans.page_if_unhandled_after` sets the time until the `alarm.incident.unhandled` alarm
    (MGR-8). The field `inspect` is allowed, and so is the field that ties a class to the manager:
    `stops_manager` in v0.1 and v0.2 under the conditions of GOV-28, `manager_accountable` from v0.3
    under GOV-48 (MGR-55). The first measure of a class (`contain_auto`) is a hold with an expiry:
    when the incident closes, it lives until `until` unless a tenant admin or an operator released
    it earlier (HLD-2); the core does not release holds by itself. The runtime and models do not
    create or change classes.
  goal: G4
  check: [lint]
  waivable: false
  version: v0.1
  profile: manager
  decisions: [D-18, D-34, D-54, D-63, D-67, D-114]
  fixtures: []
  doc: docs/farm-manager.md

- id: MGR-8
  title: Incident lifecycle
  status: active
  text: >-
    Only the core opens an incident, from a code alarm and a catalog class, including an alarm that
    a `job` role raised from a monitoring system problem (MON-5). Only code sets `resolved`, from
    the alarm state; an alarm from a monitoring problem moves to `resolved` when the problem is
    closed and a code recheck confirmed it; an alarm that returns within 1 h after `resolved`
    returns the same incident to `reopened`. A person with `incident.manage` in the tenant or the
    seat holder with the current epoch closes an incident, and only after `resolved`. Only a
    principal of kind `human` can declare an incident false (`dismissed`) from any unfinished state,
    change its severity and assign a cause. P2 `incident.dismiss` and the channel command accept
    only a call with a reason code `reason_code` from a closed list (`false_alarm`,
    `threshold_misconfigured`, `maintenance`, `duplicate`, `test`, `other`) and with the required
    "Details" text (`details`, typed by the person, up to 500 characters); without them the refusal
    is `dismiss_reason_required`. The core writes the reason code and `details` into the incident
    record and the audit, shows them only to people and does not pass them into model context. From
    v0.2, declaring an incident false cancels in the same transaction the attribution candidates
    without a "Yes" answer, and moves an attribution with a "Yes" answer into dispute (`disputed`)
    with a card to the author of that answer (GOV-13, D-79). Code builds the list of involved
    parties with catalog functions, no more than 20 targets, and recomputes it once a minute while
    the incident is open. If within the class's `humans.page_if_unhandled_after` there is neither an
    operation nor a human `incident.ack` mark on the incident, the `incident` loop raises the alarm
    `alarm.incident.unhandled` with severity `page`; the monitoring system delivers it to people
    (MON-1), and the farm has no delivery of alarms to people of its own. The alarm moves to
    `resolved` when an operation or a mark appears or the incident moves to `resolved` or
    `dismissed`.
  goal: G4
  check: [blackbox]
  waivable: false
