- id: SEC-3
  title: Handles
  status: active
  text: >-
    Handles (bearer credentials that the runtime gets for tools, the model, sessions and memory): at
    least 128 bits of randomness; they expire together with the lease; they are bound to the store
    epoch, so after a restore from backup the handles of the previous epoch are invalid; they are
    passed in the authorization header; they do not enter the model context, logs, telemetry or the
    audit (canary check).
  goal: G2
  check: [blackbox]
