- id: DIG-5
  title: A random audit sample by a recorded seed
  status: active
  text: >-
    Every month the core draws the audit sample from the tenant's proposals that got a commission
    verdict that month and were not recommended: `dismissed` (a veto, a minimum or a low score) and
    `parked` by score (not by quorum, budget or conflict). The size is N = min(T,
    max(`min_per_month`, ceil(`share` × T))), where T is the number of such proposals;
    `min_per_month` is at least 4 by lint. The core draws N of them uniformly at random with a fresh
    seed and records the seed and the drawn ids at the time of the choice; each item stores in the
    `sample` field of the proposal the month and its inclusion probability `inclusion_prob` = N / T.
    Blind cards go in the digest only by direct message to people with `proposal.decide:<category>`,
    no more than `audit_sample.max_per_digest` at a time; a group digest shows only their number.
    Code computes over 180 days the share of "Would accept" answers with weights 1/`inclusion_prob`
    and shows it in P2 `commission.status`; with at least 10 answers and a share of at least 0.3 it
    sets the flag `commission_underrates`, visible to people there.
  goal: G5
  check: [blackbox, fixture]
  waivable: false
  version: v0.2
