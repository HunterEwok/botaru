- id: IDN-7
  title: A channel verifies activities and performs no operator operations
  status: active
  text: >-
    A channel verifies the authenticity of activities with the means of the external system; how
    exactly is stated in the channel binding note in `spec/bindings/channels/`. A channel's
    credentials on P2 act only on behalf of a verified person and within that person's permissions
    (PRM-7); operator operations are not available to them, neither by command nor by a card button
    (PRM-14). P2 listens separately from P1, and worker tokens are not accepted on P2.
