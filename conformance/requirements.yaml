- id: PRP-5
  title: Fingerprint, duplicates and proposal flow limits
  status: active
  text: >-
    The core computes the proposal fingerprint (category, problem code, subjects, kind and targets
    of the change). An open duplicate does not create a second proposal: `seen_count` grows and
    evidence is added. A fingerprint declined by a person is not accepted for `redecide_after` (30
    days by default) unless the evidence changed by more than the declared share; the refusal is
    `rejected(recently_declined)`. The limits are `insight.max_open_proposals` and
    `insight.max_per_week` per role and `max_in_review` per tenant; exceeding them gives the refusal
