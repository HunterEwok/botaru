- id: IDN-2
  title: The initiator is verified and inherited
  status: active
  text: >-
    A task's initiator is a person's identity verified by the channel, an external program's key (a
    principal of kind `service`) or the tenant's service principal `system`; the model and the
    request body do not set the initiator. A child task, a campaign item, a script step and a
    continuation copy from the parent the initiator, `origin`, the conversation, the mark and
    `untrusted_seen`. The core enqueues route and wake-up tasks on behalf of `system`, and their
    initiator set is extended with the initiators of everything read; the permissions of such an
    attempt are intersected with the permissions of each of them (MSG-7).
  goal: G2
  check: [blackbox]
  waivable: false
  version: v0.1
  profile: core
  decisions: [D-47]
  fixtures: [blackbox:model/child-record-fields, fx-msg-launder, adapter:channel/forwarded-not-command]
  doc: docs/permissions.md

- id: IDN-3
  title: No commands or decisions without a real sender
  status: active
  text: >-
    An activity where the channel cannot name the real sender (a message on behalf of the chat, the
    service user of an anonymous group admin) does not execute privileged commands and does not take
    decisions. The same holds for any activity from a channel with `identity_assurance: weak`, for
    example email without sender verification. Forwarded and quoted text is never a command or a
    decision: it is untrusted data. An unknown identity does not create a task.
  goal: G2
  check: [adapter, blackbox]
  waivable: false
  version: v0.1
  profile: core
  decisions: []
  fixtures: [adapter:channel/sender-chat, adapter:channel/unbound-chat, channel/on-behalf]
