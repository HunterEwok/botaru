- id: CAP-1
  title: Tenant ceilings on counters
  status: active
  text: >-
    The core limits a tenant's work with counters, not only with money. `Tenant.spec.limits` holds
    `max_queued` (tasks in `submitted`), `max_enqueue_per_hour` (enqueues over a sliding hour from
    all sources: people, external programs, routes, schedules, child tasks and campaigns) and
    `max_storage_bytes` (the overall storage ceiling of the tenant's files and artifacts); from v0.2
    it also holds the file limits of ART-4: `max_file_bytes` (size of one file) and
    `max_task_files_bytes` (size of all files of one task). The farm ceilings are set by the
    deployment binding; a tenant can only lower them. In `max_queued`, 20% of the slots, but no
    fewer than 2, are reserved for tasks of priority classes 1 and 2 (a person's question, a card,
    an urgent task, DSP-5): service tasks (schedules, daily reviews, analysis, reviews) and tasks of
    classes 3-5 cannot take the reserve and get `rejected(over_capacity)` when `max_queued` minus
    the reserve is full; a task of class 1 or 2 is refused only when all of `max_queued` is full.
    Exceeding at enqueue gives `rejected(over_capacity)` with `retry_after_s` and does not take the
    idempotency key; a schedule task skips the slot with an event. Writing a file or artifact beyond
    `max_storage_bytes` is rejected with the same reason. A person sees the ready code text "over
    capacity", an external program gets an RFC 9457 response with the `Retry-After` header.
    Fixtures: a route in a loop hits `max_enqueue_per_hour`, the extra enqueues get
    `rejected(over_capacity)`, other tenants work as usual; with `max_queued` 10 and eight waiting
    schedule tasks, the ninth schedule task gets `rejected(over_capacity)`, and a person's class 1
    question is enqueued.
  goal: G1
  check: [blackbox, fixture]
  waivable: true
  version: v0.1
  profile: core
  decisions: [D-36, D-71, D-80]
  fixtures: [blackbox:core/queue-reserve]
  doc: docs/operations.md

- id: CAP-2
  title: A dependency failure does not spend an attempt
  status: active
  text: >-
    A failure of an external dependency does not spend an attempt: on `provider_unavailable`,
    `provider_rate_limited` (the model provider limited the rate) and `provider_quota` (GW-10), the
    task waits and is retried with a pause until `deadline` and ends with
    `failed(deadline_exceeded)`, not `attempts_exhausted`; the task journal keeps the last provider
    reason code. One layer retries a provider error: the provider client in P4 at most once, the
    runtime does not retry, and after that the core retries the task with a pause up to a ceiling
    and random jitter (GW-12); on a series of failures, P4 opens the circuit of its pair (workspace,
    model pool) and answers `provider_unavailable` right away (GW-11). A provider configuration
    error gives `provider_config`: it does not spend an attempt, is not retried on a timer, raises
    an alarm by code, and the task waits for the fix until its `deadline` (GW-13).
    `provider_spend_cap` is not retried: the task ends `failed`, and code raises an alarm. A
    fallback provider that bypasses P4 is forbidden (DEP-5). Fixture: a mock provider answers 529
    for ten minutes, and no task ends with `attempts_exhausted`.
  goal: G1
  check: [blackbox]
  waivable: true
  version: v0.1
  profile: core
  decisions: []
  fixtures: [blackbox:gateway/dependency-down]
  doc: docs/operations.md

