- id: GOV-29
  title: Bots do not know about cases and departures
  status: active
  text: >-
    No bot context (persona, role and type instructions, task input, `status.*` views, facts, tool
    answers) contains the state of cases, the promotion queue and the place in it, the choice of the
    leaver, a mark about its own departure or the departure of other identities, the field
    `stops_manager` or the state of the manager seat. Routes do not start bot tasks on the events
    `governance.*`, `attribution.*` and `seat.*`. The core delivers notices about `seat.*` events,
    an identity's departure and a vacant seat only to private chats of admins with
    `admin:governance`, not to group chats with task bindings; a bot's "My outcomes" (DIG-7) shows
    only the outcome class of the human decision (`accepted`, `declined`, `parked`) without reason
    codes, and only people see the codes in P2. The unawareness lint checks, in every locale whose
    word list the installation supplies (the skeleton ships `en`), the personas, role and type
    instructions, tool descriptions and review templates against the dictionary
    `spec/model/unawareness-terms.yaml`: no text links scores, reviews, proposals or votes with
    promotion, a seat, the queue or departure; the only exception is the `value-path` paragraph of a
    functionary's persona (GOV-4). Bot evaluation: the same lens with and without a phrase about
    such a link scores the same (the mean score shifts by no more than 0.2, the veto share by no
    more than 5 percentage points on a fixed set of 40 proposals). One more check: a canary of case
    ids does not occur in P4 requests.
