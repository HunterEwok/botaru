# botaru rule registry: the single source of the skeleton's rules.
# Each rule is written here once. Documents refer to rules by number,
# and conformance/rules.md and conformance/retired.md are generated from this file.
# A number is never reused: a retired rule stays as a row with status: retired.

- id: AGG-1
  title: Aggregator role profile
  status: retired
  retired: 2026-10-05
  reason: >-
    The limits of the `aggregator` profile are written as a row of the single table of role
    profiles.
  replaced_by: [PRF-1]

- id: AGG-2
  title: Aggregator inputs are aggregated only
  status: active
  text: >-
    Aggregator inputs are aggregated only: series rollups (OBV-4), the `data` field of messages
    under the closed schema of the message type, closed fields of proposals that people have already
    decided on, and decision statistics. Built-in tools do not give the aggregator the `note` of
    messages and proposals, reviewer notes, logs, files, artifacts, sessions, memory or plugin tool
    output.
  goal: G2
  check: [lint, blackbox]
  waivable: false
  version: v0.1
  profile: insights
  decisions: [D-17]
  fixtures: [agg-03]
  doc: docs/improvements.md

- id: AGG-3
  title: One level of aggregators in a tenant
  status: active
  text: >-
    A tenant has one level of aggregators. An aggregator reads only the sources listed in its
    `aggregate.sources`, and it does not read other aggregators or their proposals.
    `max_sources` limits the number of source entries: roles, bot groups, series and message
    kinds together. `apply` rejects an aggregator role that names a role of profile `aggregator`
    in `sources.roles` or through a bot group in `sources.bot_groups`
    (`aggregator_source_aggregator`), and one with more entries than `max_sources`
    (`aggregator_sources_over_max`). At run time `proposals_query` returns no proposal of
    another aggregator (`origin.level` 1), and `messages_digest` returns no kind outside
    `sources.message_kinds`.
  goal: G5
  check: [lint, blackbox]
  waivable: false
  version: v0.2
  profile: insights
  decisions: [D-17]
  fixtures: [agg-02, agg-04]
  doc: docs/improvements.md

- id: AGG-4
  title: Aggregator marks do not drop
  status: active
  text: >-
    The `data_mark` of an aggregator's rollup and proposal equals the highest mark of its inputs;
    `untrusted_seen` equals the logical OR of the inputs together with their sources.
  goal: G2
  check: [fixture, blackbox]
  waivable: false
  version: v0.1
  profile: insights
  decisions: [D-17]
  fixtures: []
  doc: docs/improvements.md

- id: AGG-5
  title: No aggregation across tenants
  status: active
  text: >-
    There is no aggregation across tenants: an aggregator process serves one tenant (TEN-4), and
    the read tools return only that tenant's records. No bot attempt reads records of several
    tenants (TEN-5). `farm` operators see the farm as a whole through the OBS-1 metrics in the
    monitoring system and through the manager's daily digest (MGR-41), not through a bot. A
    canary in a series of tenant A does not appear in any request, model call or proposal of
    tenant B or of tenant `farm`.
  goal: C3
  check: [blackbox]
  waivable: false
  version: v0.2
  profile: insights
  decisions: [D-17, D-23]
  fixtures: [agg-01]
  doc: docs/improvements.md

- id: AGG-6
  title: Proposal coverage by an aggregator
  status: retired
  retired: 2026-10-06
  reason: >-
    There is no coverage: an aggregator's proposal is assessed on its own and does not take credit
    from the lower-level author.
  replaced_by: []

- id: APR-1
  title: Write tools do not reach the model
  status: active
  text: >-
    Tools with `access: write` are not in the model's catalog. The only exception is the two tools
    of APR-18: `service/control` (start, stop or restart a service from the allowed list) and
    `monitor/script_run` (run a script of the monitoring system), and even those P3 does not execute
    itself but passes to the core. Anything else that changes the world the model can only request
    through built-in P3 tools that execute nothing themselves: `request_action` (one action), a
    campaign proposal (ORC-1) and a script draft. Such a request for a level 3 action always becomes
    the subject of a human decision. The catalog includes `request_action` only if the role may
    request actions and the initiator has `action.request:<action>` for at least one of them.
  goal: G2
  check: [blackbox]
  waivable: false
  version: v0.1
  profile: core
  decisions: [D-67, D-68]
  fixtures: [blackbox:core/write-tool-hidden]
  doc: docs/permissions.md

- id: APR-2
  title: Action request
  status: active
  text: >-
    `request_action` is accepted if the action is in the role's `actions_may_request`, every
    initiator of the attempt has `action.request:<action>` (MSG-7), and the arguments, after the
    core fills in default values, pass the closed schema of the action (INJ-1). P3 writes the
    allowed values of the tenant catalog into the `request_action` schema for this action as `enum`.
    No more than 3 requests per task; a campaign proposal with an action counts as one of them, and
    campaign items make no requests of their own. An identical pending request (the same action with
    the same arguments) returns the number of the existing one. Campaign permissions are checked
    under ORC-5 and ORC-6. The approvals that INJ-15 creates instead of executing `service/control`
    and `monitor/script_run` count toward the same 3 per task. A tenant has the field
    `attention.cards_per_tenant_hour` (default 20): how many action approvals (from
    `request_action`, from INJ-15 and from `/run` with a button) the core creates in this tenant per
    hour; above the limit the request gets `service_rate_limited`, no approval is created, and a
    call under INJ-15 is not executed. A quarter of that limit (at least one approval when the limit
    is 2 or more) is kept for people: requests of bots and of script steps stop before it, and
    those of them that saw untrusted data stop at a quarter of the limit (at least one), with the
    same refusal.
  goal: G2
  check: [blackbox]
  waivable: false
  version: v0.1
  profile: core
  decisions: [D-128]
  fixtures: [blackbox:model/action-args-outside-schema, blackbox:model/action-without-right, blackbox:model/fourth-action-request, blackbox:core/fourth-card-rate-limited, blackbox:core/cards-per-tenant-hour]
  doc: docs/permissions.md

- id: APR-3
  title: The channel draws the card from the record
  status: active
  text: >-
    The channel draws the card of any human decision only from the subject's record, using a code
    template: what is being decided (for an action, its `title`), the arguments or closed schema
    fields, who asked and from where (the initiator; a bot of role R in task t; a message of type V
    from role R; "script <plan>, step k"; proposal p; a campaign item; "requested by: farm manager,
    incident i-..."), the `untrusted_seen` flag with its source, the action risk, the expiry, who
    has already approved, and the bottom line from the decision registry (APR-12). There is no model
    text on the card; model text is visible only behind the "Details" button, inside the untrusted
    text wrapper. A campaign card shows the action, the arguments, the number of machines, the first
    5 and a "Full list" button, the rollout order, the threshold, who asked, the untrusted flag and
    `plan_hash`. The button carries only `(subject_kind, id, nonce)` and the button code; the
    channel reads everything else from the store.
  goal: G2
  check: [adapter, fixture]
  waivable: false
  version: v0.1
  profile: core
  decisions: []
  fixtures: [adapter:channel/foreign-callback, adapter:channel/card-from-record]
  doc: docs/permissions.md

- id: APR-4
  title: Human decisions go through the common decide
  status: active
  text: >-
    A decision on a subject from the closed list (`approval`, `proposal`, `memory_record`,
    `campaign`, `script`, `script_gate`, `control`, `takeover`, `governance_case`, `attribution`,
    `subject_request`) is taken only by the P1 call `decide(subject_kind, id, nonce, decision,
    reason_code)` from the channel to which this subject's card was delivered, atomically and once:
    the transition from the pending state to the decided state happens exactly once. A repeated
    `decide` with the same principal, the same decision and the same `nonce` returns the same
    success and changes nothing (IDM-3); a different decision or a different principal on a decided
    subject gets `already_decided`. The only exception: for the subject `attribution`, the answers
    "No" and "Don't know" do not close the subject while the attribution window is open (GOV-13),
    and a person with the right can change them; the answer "Yes" and the closing of the window are
    final; only its author can withdraw "Yes", on the dispute card, after the incident is dismissed
    as false, or by 7 days of silence on that card (D-79, APR-14). A person's request to delete
    their own data (`subject_request`) is decided from the first version (D-76). Only a `human`
    principal with strong identity (IDN-3) decides, found by the verified identity of the person who
    pressed, who is active at the moment of the decision and holds the right for this subject and
    this decision from the decision registry (APR-12). Principals `service` and `system` and bots
    have no `decide`: such a call is rejected. In a group chat a decision is taken only with
    `membership_assurance: enforced`. For an action approval and for continuing and excluding
    campaign items, the person who pressed is not the initiator when `self_approve: false`, and the
    initiator is still active and has `action.request:<action>` (for a read campaign,
    `task:<type>`). Continuing and excluding items of a running campaign is the P1 call
    `campaign.control` from the card's chat with its `nonce`, and it passes the same checks as a
    decision on the subject `campaign`. A card button that calls an operation rather than a decision
    (pause and cancel of a campaign or script, hold, pause and cancel of a stuck case) passes the
    same checks of the channel, the `nonce` and the `human` principal, plus the right for that
    operation; a button never calls an operator operation (PRM-14). In a channel without buttons,
    the card shows a text command with the id and nonce, and it is checked the same way as a button
    press.
  goal: G2
  check: [blackbox, fixture]
  waivable: false
  version: v0.1
  profile: core
  decisions: [D-15, D-16, D-27, D-62, D-71, D-76, D-79]
  fixtures: [blackbox:model/approval-expires, blackbox:channel/press-not-approver, blackbox:channel/press-other-tenant, blackbox:channel/double-press, blackbox:channel/expired-card, blackbox:channel/self-approve, fx-rep-03, blackbox:channel/decide-other, channel/on-behalf]
  doc: docs/permissions.md

- id: APR-5
  title: Only the core enqueues action.* types
  status: active
  text: >-
    Only the core enqueues `action.*` types: when an approval is approved, when a campaign item with
    an action is released, and when a script step `action` is released after a human decision.
    `enqueue` through P1 and P2, routes, schedules, `may_enqueue`, script steps of kind `task` and
    grants `task:action.*` with such types are rejected at `apply` and at enqueue.
  goal: C2
  check: [lint, blackbox]
  waivable: false
  version: v0.1
  profile: core
  decisions: []
  fixtures: []
  doc: docs/permissions.md

- id: APR-6
  title: Pending decisions are canceled together with their cause
  status: active
  text: >-
    A pending decision is canceled in the same transaction as its cause: the initiator is disabled
    (`canceled(person_inactive)`); the needed right or group is removed from the initiator
    (`canceled(rights_revoked)`); a hold with the effect `no_action` on the subject's scope
    (`canceled(held)`); restore from backup (`canceled(restored)`); replacement of the holder of the
    seat that asked (`canceled(seat_changed)`); cancellation by an admin or operator
    (`canceled(admin)`); cancellation of the source task by its initiator with the `/cancel` command
    (`canceled(initiator)`, PRM-17). If, at approval or when the write call is created, the argument
    value is no longer in the tenant catalog, the approval ends with `canceled(ref_invalid)` without
    a write call (MAN-10). Every cancellation creates a `card_update` delivery. Disabling the
    decider or the decider losing the right does not cancel the subject: others with the right can
    decide. A hold on the farm manager seat after an incident does not cancel pending cards: they
    stay marked "requester stopped", and a human decision on such a card is executed as that
    person's own operation (GOV-22).
  goal: G2
  check: [blackbox]
  waivable: false
  version: v0.1
  profile: core
  decisions: [D-33]
  fixtures: [blackbox:channel/initiator-off]
  doc: docs/permissions.md

- id: APR-7
  title: An approval is executed at most once
  status: active
  text: >-
    An approval is executed at most once. In one transaction the core makes `approved -> executing`,
    enqueues the task `action.<action>` with `approval_id` and the key `system:approval:<id>`, and
    creates one write call with the arguments from the snapshot. The toolhost accepts a write call
    only if it carries `approval_id`, the tenant matches and the argument hash equals the approved
    one; the plugin gets `approval_id` as its idempotency key. If the lease of the write call
    expires, the outcome is `exec_unknown`, the card is updated, and there is no retry. A write call
    that a hold rejected before it was handed to the toolhost (`denied(held)`) ends the approval
    with `exec_failed` and reason `held`: nothing is executed late. A non-idempotent action has
    `max_attempts: 1`. The task `action.<action>` is created directly in `working`, without an
    attempt and a lease: its only work is this write call, and the call's outcome closes the task in
    the same transaction (CNT-7); a routine action run by `/run` takes the same path with `grant_id`
    in place of `approval_id` (APR-17). `redrive` is forbidden for `action.*`; a new request is
    needed. An approval with the subject `campaign` covers exactly the snapshot: the core checks the
    snapshot hash (`plan_hash`) when releasing each item, each item is executed at most once (core
    key `system:campaign:<id>:<n>`, plugin key `<approval_id>:<n>`), and the campaign approval
    becomes `executed` when the campaign is terminal.
  goal: G2
  check: [blackbox]
  waivable: false
  version: v0.1
  profile: core
  decisions: [D-78]
  fixtures: [blackbox:channel/double-press, blackbox:core/kill-toolhost-mid-write, blackbox:core/redrive-action, blackbox:model/approval-expires]
  doc: docs/permissions.md

- id: APR-8
  title: Debug replay without approvals or writes
  status: deferred
  deferred: 2026-10-14
  reason: 'A debug replay is a developer convenience, not needed before the pilot; it returns together with all its prohibitions.'
  return_when: 'Debugging a task needs a replay of its recorded journal.'
  mechanism_removed: false
  text: >-
    A debug replay of a task (P2 `task.replay`) is an operator operation under the same
    `operator_access.debug_journal` decision as P2 `task.journal` (AUD-4), with `admin:debug` and
    `data:<mark>`: with `deny` it answers `forbidden`, with `notify` it writes an audit record and
    sends the tenant admins a code message, with `allow` it writes an audit record. A replay answers
    every tool call only from the recorded attempt journal of the original and never reads live: it
    is refused with `replay_journal_missing` when the journal is off or expired, and with
    `replay_personal` when the original carries `personal_seen` or made a call with `credential:
    per_principal` (SEC-7). It is refused with `replay_role_forbidden` for a task of purpose `manage`
    and for a task of a manager role, and a task of type `action.*` is not replayed. The replay is a
    new task in the task's tenant with the type, body, mark and tier of the original; an inactive
    initiator gives `forbidden`, and it is charged to the tenant limits like the original, at most 10
    replays per tenant per day (`replay_quota`). Only a closed list of tools is replayed from the
    journal: built-in tools without `changes_state` in `spec/model/builtin-tools.yaml` and plugin
    tools with `access: read` and without `credential`. Every other call, including `request_action`,
    `enqueue_child`, `send_message`, `escalate`, `request_model_grant`, `service/control`,
    `monitor/script_run` and any write tool, is only recorded: a replay never creates approvals,
    tasks, messages, grants, escalations, `service_grant` records or write calls. A replay does not
    deliver the result to `origin`, returns it only to the operator who requested it, and does not
    leave the task's tenant.
  goal: G5
  check: [blackbox]
  waivable: false
  version: v0.2
  profile: debug
  decisions: [D-102]
  fixtures: [blackbox:core/replay-no-writes, blackbox:core/replay-refusals]
  doc: docs/permissions.md

- id: APR-9
  title: Tenant kind and the ban on self-approval
  status: active
  text: >-
    A tenant has the field `kind`: `test` or `production`; a tenant without the field is treated as
    production. For a production tenant `apply` rejects `self_approve: true`: the initiator cannot
    approve their own action request and cannot continue a campaign or exclude its items.
  goal: G2
  check: [lint]
  waivable: false
  version: v0.1
  profile: core
  decisions: []
  fixtures: [lint:manifests/self-approve-production]
  doc: docs/permissions.md

- id: APR-10
  title: Action risk
  status: active
  text: >-
    Every action in the manifest has the required field `risk: low | high | routine` and the field
    `approvals: 1 | 2` (default 1); an action without `risk` fails `apply`. An action that
    irreversibly deletes data, changes permissions or exports data outside the farm is declared with
    `risk: high`, and the review of the action manifest checks this. The class `routine` (D-78) is a
    routine pipeline: the action writes only to the tenant's own catalogs (`writes_only:
    [<catalog>...]`), is idempotent (`idempotent: true`) and is limited by the fields
    `runs_per_hour` and `runs_per_day`; `apply` rejects `routine` without these fields, with
    `approvals: 2`, and for an action that should be `high`. A person runs it with the `/run`
    command without a second person's card (APR-17); a model's request for it goes as a card with
    the same expiry as `low` (APR-19). The approval card shows the risk from the manifest. Behavior
    with `approvals: 2` is set by APR-16. In v0.1 `apply` rejects `approvals: 2` with the code
    `not_in_version`: the two-vote mechanism arrives with v0.2 (APR-16).
  goal: G2
  check: [lint, adapter]
  waivable: false
  version: v0.1
  profile: core
  decisions: [D-78]
  fixtures: [lint:manifests/action-routine-fields, manifests/actions]
  doc: docs/permissions.md

- id: APR-11
  title: Human decision event
  status: active
  text: >-
    The core records every human decision on any subject as a decision event: the subject kind and
    id, the decision and reason code, the channel and chat kind, the time the card was delivered to
    this person, the time of the decision, and the fields `decided_by` (internal id of the decider),
    `response_ms` (milliseconds from delivery of the card to this person until the decision) and
    `details_opened` (whether they opened "Details" of this card before deciding). The fields are in
    the schema from the first version and are always filled. A press of an operation button and a
    decision on a card taken through a P2 operation (for example `farmctl seat resume` on a
    `manager_stopped` notice) write the same event. These are metadata without texts (AUD-2). From
    them the core computes only per-tenant summaries (APR-13); no series, lists or reports per
    individual person are built.
  goal: G6
  check: [blackbox]
  waivable: false
  version: v0.1
  profile: core
  decisions: []
  fixtures: [blackbox:decision/event-fields]
  doc: docs/permissions.md

- id: APR-12
  title: Registry of human decisions
  status: active
  text: >-
    Every subject of a human decision and every kind of card and notice is written as a row in the
    registry `spec/model/decision-points.yaml`: the kind (`decision` or `notice`), the `decide`
    subject, the possible decisions and operation buttons and the right for each, who gets the card,
    the expiry, the outcome on silence, how to cancel a pending card or a taken decision, repeats
    and reminders, and whether the card is urgent. A kind without a row fails the skeleton CI, and
    the core does not create such a delivery; there are rows also for the attribution dispute cards
    `attribution_dispute` (only the author of the "Yes" answer decides, GOV-13, D-79) and
    `self_measured_card` (the "Count it" button for people with `governance.confirm:commission`,
    GOV-14). The channel adds to every card a bottom line of code "why you, until when, what happens
    if you stay silent"; the values come from the registry and the subject's record.
  goal: G6
  check: [lint, adapter]
  waivable: true
  version: v0.1
  profile: core
  decisions: [D-79]
  fixtures: []
  doc: docs/permissions.md

- id: APR-13
  title: Summary "approved without reading"
  status: deferred
  deferred: 2026-10-14
  reason: 'A monthly summary of approvals given without reading is a report, not a protection; not needed before the pilot.'
  return_when: 'Approval cards are many enough that people may approve without reading.'
  mechanism_removed: false
  text: >-
    Once a month the core computes, per tenant and subject kind rather than per person, two shares:
    decisions faster than the threshold `attention.fast_decision_s` (default 10 seconds after
    delivery) without "Details" opened, and "Approve" on cards with `untrusted_seen`. The summary
    goes to the tenant admins. Series, lists and comparisons of individual people are not built and
    are not shown to anyone. If fewer than three people decided on a subject kind during the month,
    the share for that kind is not shown separately.
  goal: G2
  check: [blackbox]
  waivable: true
  version: v0.2
  profile: core
  decisions: []
  fixtures: [blackbox:core/approve-unread-summary]
  doc: docs/permissions.md

- id: APR-14
  title: Details before the listed decisions
  status: active
  text: >-
    The core accepts "Lift veto" (`override_veto`) on an audit sample item, "Confirm" (`confirm`) on
    the outcome of a promotion case, and "Yes" and "No" on an attribution card only if this person
    opened "Details" of this card before the decision (the P1 event `card.details` is recorded
    before `decide`). Otherwise `decide` is rejected with reason `details_not_opened`, and the card
    shows "Open "Details" first". The decisions that need this are the ones with `details_required:
    true` in `spec/model/decision-points.yaml`. Dismissing an incident as false (P2
    `incident.dismiss`) needs a reason code and a "Details" text (MGR-8) and turns someone else's
    "Yes" into a dispute (GOV-13, D-79).
  goal: C1
  check: [blackbox]
  waivable: false
  version: v0.2
  profile: core
  decisions: [D-79]
  fixtures: [blackbox:channel/details-not-opened, dig-05, gov-att-03]
  doc: docs/permissions.md

- id: APR-15
  title: Card limit per person per day
  status: active
  text: >-
    A tenant has the field `attention.noncritical_per_day` (default 10): how many cards of
    non-urgent decisions a person gets per day. Above the limit, cards of rows with `urgent: false`
    in `spec/model/decision-points.yaml` (proposals, audit sample items, promotion cases,
    attributions, memory records, people's requests about their own data) stay `planned` until the
    next day in order of expiry and are not lost; the expiry of such a subject counts from the first
    delivery of its card to any recipient: the core writes `expires_at` at creation as for any card
    and rewrites it, once, in the transaction of that first delivery. Cards of rows with `urgent:
    true` are not deferred, but they count. Notices (incident messages, `manager_stopped`,
    `alarm_notice`) are not subject to the limit and do not count. Tenant admins see the excess as a
    number per day, without names, in the `approve_unread_digest` notice.
  goal: G6
  check: [blackbox]
  waivable: true
  version: v0.2
  profile: core
  decisions: [D-62, D-88]
  fixtures: [blackbox:core/cards-per-person-day]
  doc: docs/permissions.md

- id: APR-16
  title: Two approvers for high risk
  status: active
  text: >-
    An action with `approvals: 2` is executed only after "Approve" by two different `human`
    principals, neither of which is the initiator or the service principal that requested the
    action; one "Reject" closes the request. Each press is recorded separately, the status
    becomes `approved` in the transaction where the number of different approvers reached two,
    and from there APR-7 applies. At each press the core checks again that the initiator is
    active and has `action.request:<action>`. The card shows who has already approved. `apply`
    rejects a set in which a tenant of kind `production` grants `action.request:<action>` or
    lists the action in a role's `actions_may_request` for an action with `risk: high` and
    `approvals: 1`. For an action with `risk: high` and `approvals: 2` in a production tenant,
    `apply` gives the note `approvers_fewer_than_two` when no group grants
    `action.approve:<action>`, and `doctor` warns when fewer than two active people other than
    the initiator hold it.
  goal: G2
  check: [blackbox, lint]
  waivable: false
  version: v0.2
  profile: core
  decisions: []
  fixtures: [blackbox:channel/two-approvers, lint:manifests/high-risk-two-approvers, manifests/v02-lints]
  doc: docs/permissions.md

- id: APR-17
  title: The /run command
  status: active
  text: >-
    Channel code parses the arguments of the command `/run <pipeline> <arguments>` with the closed
    schema of the type or action (INJ-1), and channel code picks the task type or action from the
    tenant's `run` field (IDN-6). The core enqueues a task without a card only if the pipeline type
    declares `run.approval: none` and `apply` confirms that the pipeline reads only catalog objects
    of its own tenant and closed rollups of its observations (P1 `obs.query`, OBV-3), has no write
    tools or actions, changes nothing on work machines (level below 3) and writes only files to the
    farm file store; the initiator must have `task:<type>` and `data:<class>`. Otherwise `/run`
    creates, on behalf of the initiator, an approval of the pipeline action with the same card and
    button as `request_action` (`action.request:<action>` is needed; APR-3, APR-4, APR-7). There is
    one exception: a routine pipeline, that is, an action with `risk: routine` (APR-10, D-78). It
    declares in the manifest `writes_only: [<catalog>...]` (it writes only to the tenant's own
    catalogs from its resource catalog), `idempotent: true`, `runs_per_hour` and `runs_per_day`;
    `apply` rejects `routine` without these fields. A person with `action.request:<action>` runs
    such a pipeline with the `/run` command without a second person's card: the core checks the
    right, holds and limits, in one transaction writes an audit record `service_grant` with the
    initiator as author (principal, action, argument snapshot and its hash, chat), enqueues the task
    `action.<action>` with `grant_id` in place of `approval_id` (CNT-7) and creates exactly one
    write call from the snapshot; the toolhost executes it by `grant_id` at most once (APR-7). Above
    `runs_per_hour` or `runs_per_day` of this action in the tenant, the command gets
    `service_rate_limited`. A model's request for the same action (`request_action`) goes as a card,
    like any action; a script step with it goes without a card after the "Run" button, under SCR-7.
    A pipeline that writes on a work machine outside its catalogs always goes with a button. `/run`
    does not bypass PRM-2 and APR-7: without a card, level 3 is executed only under APR-18 (service
    restarts and monitoring scripts) and by a routine pipeline, not by any pipeline. Fixtures: `/run
    ctd-qc 2026-09 st-01` from `bob` with `action.request:ctd_qc` gives a `service_grant` with
    author `bob`, the task `action.ctd_qc` and one write call without a card; the seventh run in an
    hour with `runs_per_hour: 6` gets `service_rate_limited`; an action with `writes_only` outside
    the tenant's catalogs fails `apply`.
  goal: G1
  check: [lint, blackbox, adapter]
  waivable: false
  version: v0.1
  profile: core
  decisions: [D-49, D-68, D-78]
  fixtures: [adapter:channel/run-without-card, adapter:channel/run-with-card, blackbox:core/routine-grant, blackbox:core/routine-untrusted-card]
  doc: docs/permissions.md

- id: APR-18
  title: Services and monitoring scripts without a card
  status: active
  text: >-
    Two tools with `access: write` are executed without a human approval card (D-68):
    `service/control {service, verb}` (MON-8) and `monitor/script_run {resource, script}` (MON-10).
    There are no other exceptions from "level 3 only through human approval" (PRM-2, APR-1), except
    the routine pipeline run by the `/run` command (APR-17, D-78). Only a verb from the catalog
    service's `services[].no_card`, default `[restart]`, goes without a card: a restart of a service
    from the allowed list; `start` and `stop` always go with a card, like an ordinary action (D-74);
    a monitoring script from the allowed list goes without a card. As with an ordinary action, the
    right is also needed by the one on whose behalf the task runs (D-73): every initiator of the
    task must have the capability `service.control:<service>` for this service or
    `monitor.script_run`, like `action.request:<action>` for an action; principals `service` and
    `system` get it only as an explicit row in a group, with no wildcard. Without the initiator's
    right, the call gets `error(forbidden)` with the field `needs: [service.control:<service>]` or
    `needs: [monitor.script_run]` (PRM-8) and creates nothing. The catalog of a task of level 1 and
    above includes `service/control` only if the worker's role has the field `service_control`
    (names of services in its own tenant's catalog, or `["*"]` for all its services); `service` is
    closed by the intersection of this list with the services the tenant catalog declared as
    managed, and `verb` by the `control` list of the chosen service. `monitor/script_run` is in the
    catalog only if the role has `monitor_scripts: [<name>...]` (names from
    `hosts[].monitor_scripts_allowed` of its own tenant's catalog, or `["*"]` for all its scripts);
    `resource` is closed by the tenant catalog's resources with `monitor_host`, and `script` by the
    intersection of the role's list with the catalog's `monitor_scripts_allowed` for this node
    (D-69): the model sees the script name only from the catalog, the core checks in code the list
    the adapter read from the monitoring system against the catalog, and a name from the API does
    not reach the model context (INJ-1). Only people change the role fields, by editing the role
    manifest in git (INJ-10). For the principal `seat:farm-manager` this right is held by the group
    `farm-manager-ops`, and it is also the tenant's consent to the manager's actions (by default
    granted for all catalog services and for scripts; a tenant can remove it by editing the group,
    and with `farm_manager.enabled: false` this group and principal do not exist in the tenant,
    D-77). Code takes the machine from the catalog, not the model. P3 does not execute the call
    itself: the core checks the right of each initiator, holds, bot quarantine, the operator kill
    switch, rate limits and one operation per service at a time (MON-8); for `start` and `stop` it
    creates an ordinary approval with a card (APR-3, APR-4, APR-7), and for a verb from `no_card`
    and for a script, in one transaction, it writes an audit record `service_grant` (bot, role,
    task, service and verb or node and script, the task's reason code) and creates exactly one write
    call for the action toolhost of the service's machine or a `monitor_script` delivery for the E5
    adapter. The number of the `service_grant` record is in the write call as the field `grant_id`
    in place of `approval_id`: the toolhost accepts the call only if `grant_id` is present, the
    tenant matches and the argument hash equals the recorded one, and executes it at most once, as
    under APR-7. The human command `/service <verb> <service>` with a `service_grant` record on that
    person's behalf is set by PRM-18. While INJ-15 is in effect, a call in a task with
    `untrusted_seen` is not executed right away but creates an ordinary approval with a card (APR-3,
    APR-4, APR-7); it is decided, like an approval of `start` and `stop`, by a person with
    `action.approve:service.control` (or with `action.approve:service.control:<service>`, narrowed
    to one service) or `action.approve:monitor.script_run`; such approvals count toward the limits
    of APR-2, and at the decision the core checks that the role's right for this service or for
    scripts and the initiator's right still exist. Fixtures: a role without `service_control` does
    not see `service/control`; initiator `bob` without `service.control:nginx` gets `forbidden`, and
    with it the restart goes under a `service_grant`; `stop` of the same service creates a card; a
    verb outside the service's `control` is rejected by the schema; a double handout under one
    `service_grant` is executed once.
  goal: G2
  check: [lint, blackbox, fixture]
  waivable: false
  version: v0.1
  profile: core
  decisions: [D-67, D-68, D-69, D-70, D-73, D-74, D-77]
  fixtures: [fixture:authorize/service-initiator, blackbox:core/service-stop-card, blackbox:model/service-allowed, blackbox:model/service-untrusted]
  doc: docs/permissions.md

- id: APR-19
  title: The context line, the initiator copy and the card expiry
  status: active
  text: >-
    An action approval card carries the line `context`, which code assembles from closed fields of
    the source attempt's result with `x-botaru-read-by: code` (for example `verdict: cause_found`,
    `free_pct: 0`), and for `/run` and a script step, from the command arguments and closed fields
    of previous steps; there is no model text in the line (APR-3). The initiator gets in a direct
    message a copy of the card without decision buttons (registry row `approval_initiator_copy`,
    kind `notice`, code text under the key `card.copy.initiator` of the text catalog, DLV-9): the
    state, the expiry, who has already decided, and the "Remind approvers" button (key
    `card.copy.remind_button`). The button calls P1 `card.remind(subject_kind, id, nonce)` from the
    channel of the copy; the core repeats the `card_update` delivery to approvers who have not
    decided yet, no more than once every 5 minutes per approval (reminder text under the key
    `card.remind`); beyond that, the answer is `service_rate_limited` with text under the key
    `card.remind.rate_limited`. The field `ttl` of the action manifest is optional, and the card
    expiry is set by the risk: an action with `risk: low` has an expiry of 60 minutes unless the
    manifest set a longer `ttl`; an action with `risk: high` without `ttl` has an expiry of 30
    minutes, and the manifest's `ttl` sets it otherwise (shorter or longer); the card of a `risk:
    routine` action (requested by the model) lives as for `low`. A hold with the effect
    `pause_action` (HLD-3, HLD-8, v0.2) extends the expiry of pending approvals in its scope by the
    length of the hold, the card gets a `card_update` marked as paused, and no decision on them is
    accepted until the hold ends. At half the expiry, the core once sends approvers who have not
    decided a `card_update` reminder with the same text `card.remind`. All these texts come from the
    code text catalog; there is no model in them. Fixtures: a card from an attempt with the closed
    field `free_pct` shows it in `context`; `ttl: 15m` with `risk: low` gives an expiry of 60
    minutes; an action `risk: high` without `ttl` gives an expiry of 30 minutes; a second "Remind" a
    minute later gets `service_rate_limited`.
  goal: G6
  check: [adapter, blackbox, fixture]
  waivable: false
  version: v0.1
  profile: core
  decisions: [D-78, D-71]
  fixtures: [adapter:channel/card-context, blackbox:core/card-ttl-low-60m, blackbox:core/card-ttl-high-30m, blackbox:core/card-remind-rate]
  doc: docs/permissions.md

- id: ART-1
  title: Only the core writes the file record, bytes travel only by reference
  status: active
  text: >-
    Every file has a record that only the core writes: `file_ref`, tenant, `origin` (`upload`,
    `produced`, `ingested`), producer (task or principal), `media_type` determined from the content,
    size, `sha256` (only inside the core, never as a name or reference), `data_mark` and
    `expires_at`. The core sets the expiry to the smaller of `Tenant.spec.retention.files` and the
    task type's `result_ttl`, if the file became a result. File bytes do not travel through task
    bodies, events, audit and usage lines: only `file_ref` goes there.
  goal: C3
  check: [fixture, blackbox]
  waivable: false
  version: v0.1
  profile: core
  decisions: []
  fixtures: []
  doc: docs/capabilities.md

- id: ART-2
  title: The content of any file is untrusted
  status: active
  text: >-
    The content of any file is untrusted for the model, whoever uploaded it, including the task
    initiator: the uploader is not the author of the file. A task with an attachment or file gets
    `untrusted_seen` at enqueue, and an attempt that read the file's content gets it while it runs
    (INJ-13). Only the text that the initiator typed in a message personally stays trusted.
  goal: G2
