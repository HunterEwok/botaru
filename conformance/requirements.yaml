- id: MGR-45
  title: When an incident is preventable
  status: active
  text: >-
    An incident is preventable (GOV-47) only if its class has `manager_accountable: true`, the
    holder was responsible for the seat in its tenant T for the whole window of the sign, and the
    sign of its class below holds; code computes each part from records and code series, and the
    model takes no part. The holder is responsible when at the start of the window the seat was in
    `held` with this holder and was not restricted in T (MGR-47), and until the incident opened the
    seat either stayed in `held` or left it only for the reason `no_control` (MGR-14), which the
    holder could have caused itself; leaving `held` for `human` (MGR-15) or a holder change within
    the window removes responsibility. The signs for the critical incident classes approved by the
    owner (D-114, docs/goals.md): (1) a full disk (`disk_full`): for the whole `prevent_window` (2
    h) before the opening, the free space of that disk by its code series (CAP-6, GOV-48) was below
    the alarm threshold of the class `disk_filling` and was lower at the end of the window than at
    its start, and the class functions found at least one involved party on that disk in the window
    (MGR-9); (2) a catalog service down and not recovered within the set time of its class: for that
    whole time before the opening an incident on that service was open in T, a restart of the
    service was on the seat's list without a card (the class's `responses.services`, the catalog
    `control` and the consent of group `farm-manager-ops`, MGR-9), no decision attempt of the seat
    in T was in distrust mode (MGR-22), and the seat made no `service/control` call on that service;
    (3) a backup older than a day or a failed restore check is not preventable by the manager:
    backup types and their schedules are protected targets that it touches only through a person's
    card (MGR-32); (4) an unreachable core is not preventable by the manager: the seat acts only
    through the core, and the monitoring system pages people (MON-2); (5) an automatic stop by the
    rate of spending (`runaway_spend`, HLD-7) is not preventable by the manager: the stop is itself
    the code measure, the seat stops a role only through a card (MGR-37), and its own spending is
    held by the `manager` line (MGR-20). A class of the kinds (3) to (5) never makes an incident
    preventable. When an incident is not preventable, its record keeps the reason code why.
  goal: G4
  check: [fixture, blackbox]
  waivable: false
  version: v0.3
  profile: manager
  decisions: [D-34, D-59, D-110, D-114]
  fixtures: [blackbox:manager/preventable-no-stop]
  doc: docs/farm-manager.md

