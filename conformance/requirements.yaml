    only types with `pinnable: true` and mark `summary` are pinned, without `file_ref` and without
    tools with tenant data. This is the only task path with a worker field, and it belongs to the
    core: requests have no worker field (DSP-4). A pinning task gets key
    `system:control:<epoch>:<number>` (IDM-2).
