- id: PRM-17
  title: Initiator and lead commands
  status: active
  text: >-
    A human initiator manages their tasks from a private chat with the bot with code commands,
    without a model. `/tasks` shows their tasks for the last day: the number, the type name
    (`title`), the state, the waiting reason (`waiting_reason`). `/status <number>` shows one task
    with the same content; for a foreign or nonexistent task the answer is `not_found` (PRM-9).
    `/cancel <number>` cancels their task in a state up to and including `working` after
    confirmation (repeating the command with the `nonce` from the answer, or the "Yes" button): the
    channel calls P2 `task.cancel` on behalf of the initiator, the core accepts it from the
    initiator only for their own task and in one transaction cancels the task tree and its waiting
    approvals with reason `canceled(initiator)` (APR-6); a released write call is not revoked.
    `/help` shows the tenant's `commands` and `run` lines with the `title` names of types and
    actions, filtered by the person's permissions (in a group chat only the commands of that chat,
    PRM-15); `/me` shows the `title` names of types, not the type names. `/lang <language>` sets the
    principal's `locale` from the languages of the text catalog (the skeleton ships `en`, the
    installation adds others, DLV-9), after which cards, refusals and command answers come to them
    in that language; a language outside the catalog gets the code text `cmd.lang.unknown` (REP-12).
    `/team [group] [window]` for a person with the capability `team.view:<group>` (a team lead) is a
    code table of the tasks of the people of that group over the window (7 days by default): the
    number of tasks by type with names and states, failed runs, waiting approvals for actions that
    group members can request, usage by task type without rows for individual people (DLV-14); the
    rows are filtered by the permissions of the person who asked (`task.read:<type>`, `data:<mark>`,
    REP-7), and the table has no task texts. `team.view:<group>` is not privileged, and only a
    person holds it. All texts of these commands come from the code text catalog. Fixtures:
    `/cancel` of a foreign task answers `not_found`; `/cancel` of one's own task in `working` gives
    `canceled(initiator)` to the tree and the waiting approval; `/cancel` of a task in `completed`
    answers with a code text that the task has already finished; `/team` without `team.view:<group>`
    gets `forbidden`.
  goal: G1
  check: [adapter, blackbox, fixture]
  waivable: false
  version: v0.1
  profile: core
  decisions: []
  fixtures: [blackbox:channel/cancel-own-task, blackbox:channel/team-forbidden, adapter:channel/lang-command]
  doc: docs/permissions.md

- id: PRM-18
  title: The /service command from a person
  status: active
  text: >-
    A person with the capability `service.control:<service>` in their group gives the command
    `/service <verb> <service>` in a private chat with the bot (D-68, D-73). Channel code parses it
    by a closed schema: `service` from the services of the tenant catalog declared as controllable,
    `verb` from the `control` list of that service (MON-8); the model takes no part. The core checks
    the person's permission, holds, the operator's kill switch, rate limits and one operation per
    service at a time, the same as in APR-18. A verb from the service's `services[].no_card` (only
    `restart` by default, D-74) the core then runs in one transaction: it writes a `service_grant`
    audit record with the person as author (principal, service, verb, chat) and creates exactly one
    write call for the action toolhost of the service's machine with `grant_id`; the toolhost runs
    it no more than once, as under APR-7. There is no card here, because the person made the
    decision with their own text, not the model. `start`, `stop` and any verb outside `no_card` go
    through a card like an ordinary action (D-74): the core creates on behalf of this person an
    approval with a snapshot of the arguments (APR-3), a person with
    `action.approve:service.control` or `action.approve:service.control:<service>` decides it, in a
    production tenant not the initiator themselves (APR-9), execution goes under APR-7, and such
    approvals count in the APR-2 limits. Beyond the limits the answer is `service_rate_limited`;
    without the permission `forbidden` with the field `needs: [service.control:<service>]` and the
    name of the needed group (PRM-8). The core does not accept the command from a `service`
    principal, from a bot, from a group chat or from forwarded text (PRM-15, IDN-3). The result
    comes to the same person as code text; the record is visible in the audit and as a code note in
    the monitoring system. Fixtures: `bob` with `service.control:nginx` writes `/service restart
