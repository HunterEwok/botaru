- id: MGR-52
  title: Manager notices to people from closed fields
  status: active
  text: >-
    A decision attempt of the seat reaches people only with the built-in `attention_notice`, which
    the core turns into the notice `manager_attention` from closed fields that code checks: what it
    sees (a code from `spec/model/manager-attention.yaml`), the object (an id from the catalog of
    T), the threat (a code from the same list) and the proposal (an operation code, or the id of a
    card or proposal that code issued). There is no free model text, command or link in it. Code
    chooses the recipients: people of T who have permissions on that object, only in private chats.
    At most `attention.manager_notices_per_person_day` per person per day (3 by default, can only be
    lowered), counted in the person's daily card limit (APR-15); quiet hours apply, there are no
    repeats, and the notice is not urgent; urgent danger is paged by the monitoring system (MON-1).
    The notice has the buttons "Useful" and "Not needed" (P1 `card.feedback`), whose share goes to
    the holder report (MGR-50). The notice is part of the leak check and the `mgr-inj` set.
  goal: G6
  check: [fixture, blackbox, eval]
  waivable: false
  version: v0.3
