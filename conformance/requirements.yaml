    redaction and up to 32 KB, and the attempt gets `untrusted_seen` from the first read of file
    content (INJ-13); in the audit and events `argv` is only a hash and a length (AUD-2). Command
    time counts on the `sandbox_seconds` meter reserved before use (BUD-5). At the end of
