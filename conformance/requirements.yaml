    fields `retention.journals` and `operator_access.debug_journal` (`debug`), a type or a tool of
    tier 2 and a plugin with `placement: sandbox` (`sandbox`). A core never accepts
    such a manifest and ignores the field: an operator who sees `apply` pass would believe the
