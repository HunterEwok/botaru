- id: MGR-34
  title: Disk stop only after visible growth
  status: active
  text: >-
    An incident of a class with `stops_manager: true` whose subject is a disk adds the reason
    `incident` to the seat only if, for the whole `prevent_window` (2 h) before its opening, a
    `disk_filling` incident was open on the same disk, the used size of the disk by the code series
    (`dataorigin: code`, CAP-6; the series is written by a `job` role without a model from the
    monitoring system history, GOV-28) at the end of the window is greater than at the start, and
    the holder was responsible for the seat for the whole window: at the start of the window the
    seat was in `held` with this holder, and until the incident opened it either stayed in `held` or
    left `held` only for reason `no_control` (the safeguard, MGR-14), which the holder could have
    caused itself. A safeguard stop within the window does not remove responsibility: the reason
    `incident` is added to a seat in `stopped` too, and the exits from the stop are the same
    (GOV-22). Leaving `held` for reason `human` (MGR-15) or a holder change within the window
    removes responsibility. Otherwise there is no stop, and the incident stays an ordinary critical
    one; the incident record keeps the reason code.
  goal: G4
