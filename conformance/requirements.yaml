- id: PRP-25
  title: Replay of a rejected change over the history
  status: deferred
  deferred: 2026-10-14
  reason: 'Replaying a rejected change over the history needs a replay engine of alarms and limits; too costly before the pilot. The outcome of D-109 (8) returns with it.'
  return_when: 'The farm has enough history of rejected changes to replay them.'
  mechanism_removed: false
  text: >-
    When the commission dismisses or parks by score a proposal of kind `manifest_change` that sets
    only fields marked `replayable: true` in `spec/model/proposable-fields.yaml` (alarm thresholds,
    schedule windows, limits), the core replays the change by code over the recorded monitoring and
    farm series of the last 30 days: which alarms and incidents of the classes with the proposal's
    problem code would have fired earlier, later or not at all, and which limits would have been
    hit. Nothing changes on the farm, no model takes part, and people see nothing. The result is one
    of `benefit`, `harm`, `none`, `mixed`, written into the proposal record, and code scores the
    forecasts of the commission by it (COM-16) as a trial outcome (`benefit` as `better`, `harm` as
    `worse`). A replay is not a trial: it gives no promotion trigger. Changes of code, permissions
    or new actions are never replayed.
  goal: G5
