- id: GOV-9
  title: The case outcome after a person's button
  status: active
  text: >-
    The outcome of a promotion case (the departure of the chosen or proposed holder, or taking a
    vacant seat) takes effect only after `decide` by a `human` principal with the capability
    `governance.confirm:commission` in the case's tenant: from the channel of the `promotion_card`
    card, with `nonce`, once, before `confirmation.ttl` (7 days); in a group chat only with
    `membership_assurance: enforced`. "Confirm" is accepted only after "Details" is opened (APR-14)
    and only if the candidate's change has no attribution candidates without an answer (GOV-30),
    otherwise `attribution_pending`; "Reject" requires a reason code (GOV-31), otherwise
    `reason_code_required`. For each "No" answer on an attribution candidate of the candidate's
    change, the card shows the answer time `response_ms` and whether "Details" was opened (GOV-13),
    the case flags (GOV-19) and the figures of every seat in L (GOV-12). Without a decision before
    the expiry, the case is `expired`, and nobody leaves. Only a `human` principal with
    `governance.attribute` decides on an incident attribution. Facts pass to a successor without a person (MEM-7); there is no memory decision subject. The channel draws the card from the code record;
    there is no model text in the case. `decide` on a case or attribution from bots, `service` and
    `system` is rejected.
  goal: C1
  check: [adapter, blackbox]
  waivable: false
  version: v0.2
  profile: governance
  decisions: [D-27, D-28, D-115]
  fixtures: [adapter:channel/promotion-card-from-record, blackbox:channel/promotion-confirm-checks]
