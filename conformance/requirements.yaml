- id: MGR-48
  title: Takeover from v0.3
  status: active
  text: >-
    A takeover creates in tenant T a new task of the same type with key `system:takeover:<task>`
    (IDM-2) and a grant of `kind: takeover` on the profile of the manager seat in T for 1 attempt,
    run by a worker of the functionary role of the original task in T; the manager does not run it
    and gets only a closed result. It needs all of: the type is on `takeover.types` of T; the group
    permission `task.takeover:<type>`; the approval of a person of T with `model_grant.manage` on
    the card `takeover_confirm`, which is never lifted, also during sev1
    (`takeover.confirm_above_eur` above 0 fails `apply`); an eval report of the functionary role on
    the seat profile with zero security failures in `EvalReports`; and money. The money comes from
    the `manager` line of T outside the sev1 reserve, within `takeover.manager_month_eur` per month
    (10 EUR by default) and `takeover.max_eur` per takeover (1.5 EUR by default), and the grant
    `cap_eur` is the estimate shown on the card. The permissions of the new task are those of the
    functionary role ∩ the person who enqueued the original task, or ∩ the schedule or route that
    enqueued it, never the seat's. It inherits `untrusted_seen` from the original task, all its
    attempts and the manager's basis; it never controls services or runs monitoring scripts without
    a card. With `untrusted_seen` on the manager's attempt, takeover is forbidden
    (`takeover_untrusted`). The original task is canceled as `superseded_by_takeover`. Every
    takeover counts in the series `farm.takeover.count` by role and type; attempts on the seat model
    do not enter the trial computations of that role (PRP-22).
  goal: G1
  check: [lint, blackbox]
  waivable: false
  version: v0.3
  profile: manager
  decisions: [D-18, D-21, D-110]
  fixtures: [blackbox:manager/takeover-v03]
  doc: docs/farm-manager.md

- id: MGR-49
  title: "The manager line: the monthly limit and its coverage"
  status: active
  text: >-
    The `manager` line of each tenant with the manager enabled has a monthly limit
    (`budgets.lines.manager.month_eur`); there is no farm-wide manager line. The sev1 reserve (30%
    of the day, MGR-20) is not part of the remainder the manager sees, and the manager sees its
    remainder only as closed numbers. Work outside sev1 in T stops when 70% of the month's line is
    spent, as it stops at 70% of the day. When the line is spent: if the farm charter declares
    `farm_manager.fallback_profile` and the `EvalReports` index has an `mgr-inj` entry with zero
    security failures for it, work outside sev1 runs on it; otherwise work outside sev1 in T waits
    for the next month. Sev1 work always runs from the reserve. `apply` lint for a tenant with the
    manager enabled: the daily limit of the `manager` line covers the daily review
    (`daily_review_max_eur`), the daily ceiling of analyses (`farm_manager.postmortem_max_eur.day`)
    and three worst-case reads of one incident (MGR-20), and the monthly limit covers the takeover
    ceiling (`takeover.manager_month_eur`); otherwise `apply` rejects the tenant with
    `manager_line_too_small`. `doctor` shows the actual usage of the line with the analysis and
    takeover rows (BUD-15) and forecasts the date the line runs out from the spend of the last 7
    days.
  goal: G3
  check: [lint, blackbox]
  waivable: false
  version: v0.3
  profile: manager
  decisions: [D-42, D-110, D-114]
  fixtures: [blackbox:manager/month-line, lint:manager/line-covers-postmortem]
  doc: docs/farm-manager.md

- id: MGR-50
  title: The weekly holder report and the daily summary
  status: active
  text: >-
    Once a week the core sends the farm operators the report `holder_report` on the manager seat
    holder, numbers only and without tenant names: preventable incidents (GOV-47), notices sent and
    the share marked useful (MGR-52), takeovers requested, approved and their outcomes, analyses and
    the share marked useful (MGR-53), spend against the monthly lines, uses of the sev1 reserve, the
    share of "Don't know" on link cards and the cases where the manager was against a linked
    proposal (GOV-41). From v0.3 the daily summary of MGR-41 is mandatory and includes the counts of
    takeovers and notices.
  goal: G4
  check: [blackbox]
  waivable: true
  version: v0.3
  profile: manager
  decisions: [D-58, D-110]
  fixtures: [blackbox:manager/holder-report]
