- id: GOV-22
  title: Stopping the manager seat on an incident
  status: active
  text: >-
    At any moment the manager seat has no more than one holder with the current epoch. The seat
    stores the stop reason set with the time of each reason: `human` (a hold on the scope `seat`,
    MGR-15), `no_control` (the safeguard, MGR-14) and `incident`. A new incident of a class with
    `stops_manager: true` in any tenant where the manager is enabled (`farm_manager.enabled: true`,
    MGR-42), opened by the core while the seat is in `held`, adds the reason `incident` in the same
    transaction; for a class whose subject is a disk, the reason is added only if MGR-33 and MGR-34
    hold; otherwise there is no stop, and the incident record stores the reason code in the field
    `stops_manager_effect`. The stop increments the seat epoch, cancels all running attempts of the
    holder in all tenants and forbids `claim` of seat tasks. An incident opened before a holder was
    assigned or returned gives no stop; there is no window without a stop after assignment. There is
    one exception: if the seat left `held` only for the reason `no_control` within the
    `prevent_window` of an incident the holder is responsible for under MGR-34, the reason
    `incident` is added also to a seat in `stopped`, and the ways out of the stop are the same.
    Holds that the holder already set live out their term, no longer than 2 h, and there are no new
    ones; its pending cards stay marked "requester stopped", and a human decision on them is
    executed as that person's operation; similar incidents opened during the stop are only appended
    to the `manager_stopped` card. The card goes to farm operators without buttons, with ready
    `farmctl` commands (MGR-35), and is repeated under MGR-36. Ways out: P2 `seat.resume`, only
    after the triggering incident and the incidents of the same minute are dismissed as false (it
    removes only the reason `incident`, epoch + 1); P2 `seat.assign` or `seat.vacate`, in which the
    previous holder leaves with the trigger `replaced_after_incident`; the deadline `decide_within`
    (default and maximum 7 days), after which the `identity` loop removes the previous holder with
    the same trigger, and the seat becomes `vacant`. The reasons `human` and `no_control` are
    removed by a person with `admin:farm`; the seat is in `held` only when the set is empty.
  goal: C1
  check: [blackbox, lint]
  waivable: false
  version: v0.1
  until: v0.2
  superseded_by: [GOV-47]
  profile: governance
  decisions: [D-33, D-34, D-77]
