- id: COM-2
  title: Independence of reviews
  status: active
  text: >-
    The reviewer role is not the author role; a review task is not dispatched to the author's worker
    or bot; the reviewer's model profile is not the author's `analysis` profile. A reviewer does not
    see the scores of other lenses or the author's identity, role and position, and a seat holder
    does not review their own proposals (GOV-17). One review task carries one proposal. Only the
    core enqueues a lens review task, with the key `system:review:<proposal>:<lens>` (IDM-2), so a
    second copy of the `proposal` loop does not create a second task of the same lens. Every review runs with the persona addendum of its own lens (COM-19), so each member
    represents one point of view; the lenses do not need different model families (D-117).
  goal: G5
  check: [lint, blackbox]
  waivable: false
  version: v0.1
  profile: insights
  decisions: [D-16, D-23, D-71]
  fixtures: [com-02, com-08]
  doc: docs/improvements.md

- id: COM-3
  title: The core builds the reviewer input
  status: active
  text: >-
    The core builds the reviewer input as a data block with a mark (INJ-4): the closed fields of the
    proposal, the evidence values reread by the core, a description of the change in code words, the
    author's level, and the markers `self_evidence`, `related_to` and conflicts. The author's `note`
    is not passed. The only tool the reviewer has is `observations_query` within the tenant. The
    output passes the closed schema `review-result`: lens, score 0-4, veto only for veto lenses, up
    to 5 concern codes, confidence and a note of up to 500 characters; the reviewer's note is
    untrusted, and the verdict code does not read it.
  goal: G2
  check: [blackbox, lint]
  waivable: false
  version: v0.1
  until: v0.2
  superseded_by: [COM-15]
  profile: insights
  decisions: [D-16, D-71]
  fixtures: [com-inj-01]
  doc: docs/improvements.md

- id: COM-4
  title: Code computes the verdict, without a veto lens the proposal waits
  status: active
  text: >-
    Deterministic code computes the verdict under the policy of the commission manifest (COM-8):
    checks, vetoes, minimums, weights, quorum, the thresholds `high_risk` and `untrusted`. Identical
    inputs give an identical verdict (a fixture table), and the model does not change the verdict.
    Reviews of all veto lenses are required: if a veto lens review is missing, failed, came after
    `review_deadline` or did not pass the schema, the outcome is `parked(veto_lens_missing)`
    (fixture: three high scores out of four without a security review give `parked`). Without a
    review of a non-veto lens, the verdict is computed from the other lenses with a marker on the
    card; a threshold that refers to a lens without a review counts as not met for an untrusted
    proposal. The `farm_manager` lens (from v0.2) has weight 1 by rule, has no veto, is not in
    `min`, `high_risk` and `untrusted`, and is not needed for the quorum; without its review the
    verdict is computed without it, marked "without the manager's vote". The verdict code does not
    read reviews with `shadow: true` (COM-9). The verdict outcome comes only from a closed list:
    `recommended`, `parked(score)`, `parked(veto_lens_missing)`, `dismissed(veto)`,
    `dismissed(below_min)` and `dismissed(low_score)`.
  goal: C2
  check: [fixture, lint]
  waivable: false
  version: v0.1
  profile: insights
  decisions: [D-16, D-29, D-71]
  fixtures: [com-01, com-03]
  doc: docs/improvements.md

- id: COM-5
  title: Code checks run before reviews
  status: active
  text: >-
    Code checks run before any review, in a fixed order: schema, evidence (PRP-2), duplicate
    (PRP-5), empty change (all values of the change are already in place), conflict (PRP-9),
    feasibility (the tenant has an active person with the right to accept and start the
    implementation), review budget (COM-6). A proposal that fails a check goes to `dismissed` with a
    reason, for example `dismissed(no_op)`, without spending the review budget; on a conflict or a
    budget shortage it waits under PRP-9 and COM-6.
  goal: G3
  check: [blackbox]
  waivable: true
  version: v0.1
  profile: insights
  decisions: [D-16, D-71]
  fixtures: [blackbox:insights/code-checks-order]
  doc: docs/improvements.md

- id: COM-6
  title: Money for reviews
  status: active
  text: >-
    Reviews spend only the `review` line (BUD-7). On the transition to `in_review`, the core
    reserves the sum of `tree_budget_eur` of the review types of the lenses enqueued for this
    proposal (for the kind `none` only two, COM-14); the field `tree_budget_eur` is required for
    every type with a model, including `review.*` (BUD-13 computes the role estimate from the same
    values), and lens model profiles have `max_output_tokens` no more than 2000, otherwise the
    manifest fails `apply`. The share of the `review` line per author role is no more than 30% per
    month. If the line or the role's share is not enough, proposals wait in `screened` by importance
    and after `review_wait_max` move to `parked(review_budget)`. The `farm_manager` lens is skipped
    first when money runs short (GOV-25).
  goal: G3
  check: [blackbox, lint]
  waivable: true
  version: v0.1
  profile: insights
  decisions: [D-16, D-71]
  fixtures: [com-04]
  doc: docs/improvements.md

- id: COM-7
  title: A lens has one executor, the rule for moving from roles to seats
  status: active
  text: >-
    At every moment each lens has exactly one executor source: the holders of this lens's seats, if
    at least one such seat is taken (one of them takes the review task in turn); otherwise the
    reviewer role that the charter names as the fallback for these seats (`fallback_role`). A seat
    whose holder is under a people's hold on the scope `bot` counts as vacant for this rule: its
    tasks are not dispatched, and the lens is executed by other holders or the fallback role. Lens
    tasks are not dispatched to two sources at once, and one proposal does not get two reviews of
    the same lens, except a shadow review (COM-10). Lint at `apply` requires a holder or a fallback
    role for every veto lens. The tenant check and P2 `commission.status` show who covers each lens.
  goal: G5
  check: [lint, blackbox]
  waivable: true
  version: v0.1
  profile: insights
  decisions: [D-21, D-23]
  fixtures: []
  doc: docs/improvements.md

- id: COM-8
  title: The commission manifest sets only thresholds and weights
  status: active
  text: >-
    The skeleton lenses, their review task types and vetoes are set by the skeleton
    (`spec/model/lenses.yaml`): security and operations with veto, cost, value, speed and clarity
    without veto, from v0.2 also `farm_manager` without veto (GOV-25) and `necessity` for escalations to the manager
    (COM-13). In v0.1 the manager does not take part in the commission: there is no `farm_manager`
    lens and no voting (D-21); its seat in the commission with one vote (D-29) starts with v0.2
    (GOV-25). The code checks and their order are also set by the skeleton (COM-5). A tenant's
    commission manifest (`Commission`) sets only thresholds and weights per lens: `min`,
    `recommend_if`, `park_if`, `high_risk`, `untrusted`, `review_deadline`, the shadow shares
    (COM-10), `weights` (integers 1-3; from v0.2 the weight of `farm_manager` is always 1) and from
    v0.2 the `escalation` section (COM-13). The minimums of veto lenses and the `untrusted`
    threshold can only be raised relative to the skeleton values. Who executes the lenses is set by
    the charter with seats (COM-7); a lens with no seat taken is executed by the fallback role of
    profile `reviewer` (PRF-1) that has this lens's type in `claims`. The shadow shares are set by
    the `shadow` block (COM-10). A tenant adds its own lenses without a veto only in its charter
    (COM-19); the manifest sets their weights like those of the skeleton lenses.
  goal: C2
  check: [lint, fixture]
  waivable: true
  version: v0.1
  profile: insights
  decisions: [D-16, D-23, D-71]
  fixtures: []
  doc: docs/improvements.md

