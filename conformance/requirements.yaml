- id: MGR-33
  title: Disk stop only with quotas
  status: active
  text: >-
    An incident of a class with `stops_manager: true` whose subject is a disk adds the reason
    `incident` to the seat (GOV-22) only if, at the minute of opening, everyone who writes to that
    disk (tenants, sinks and pipelines from the `writers` of that volume in `Catalog.spec.volumes`)
    has a size quota on that disk (`quota_bytes`, CAP-6), and the sum of quotas is below the class's
    alarm threshold. Otherwise the incident stays critical, with the first measure by code and
    paging of people, but it does not stop the seat; the incident record keeps the reason code. When
    the catalog is approved and at `apply` of quotas, the core shows people for which disks the
    condition holds. The condition concerns disks under the alarm `alarm.disk.free.low`, which a
    `job` role raises from a monitoring system problem (MON-5); the core store volume is guarded by
    the class "low space for the database" on the alarm `alarm.store.free.low` (CAP-5, MGR-38), and
    it does not stop the seat.
