- id: ORC-1
  title: Only a live attempt proposes a campaign, the plan is frozen
  status: active
  text: >-
    Only a live attempt proposes a campaign: P3 `propose_campaign` or P1 `campaign.propose` with its
    token. The core itself creates a campaign only in two cases: on a person's "retry failed" button
    (a new campaign from the failed, `unknown` and `skipped` items of a finished campaign with the
    same template, a policy no wider, the `untrusted_seen` of the original, a `refs` link, without a
    `then` continuation and with a new approval) and when releasing a `fanout` step of a script run
    that a person approved (SCR-6), from the list frozen at that approval (SCR-7), also without
    `then`. The template, the items (the core expands a selector at the moment of the proposal), the
    policy and `plan_hash` are fixed in the record and never change again. The list can only shrink
    with a person's "exclude item" button; an item cannot be added and an argument or the policy
    cannot be changed (`rejected(campaign_frozen)`); one can only cancel the campaign and propose a
    new one with a `refs` link. Repeating a proposal with the same key and a different plan gives
    `idempotency_conflict`.
  goal: G2
  check: [blackbox]
  waivable: false
  version: v0.1
  profile: campaign
  decisions: [D-14, D-20]
  fixtures: [blackbox:campaign/propose-live-attempt]
  doc: docs/coordination.md

- id: ORC-2
  title: A campaign with an action starts after one plan approval
  status: active
  text: >-
    A campaign with an action starts only after one approval with subject `campaign`, whose snapshot
    contains the action, all items with arguments, the rollout policy, the cost estimate and
    `plan_hash`. The channel draws the card from the record: the action, the number of items, the
    first 5 and a separate "full list" delivery from the record, the rollout order and the threshold
    in words, the cost estimate in euros, `untrusted_seen` with the source, who asked and through
    which role, the decision deadline. The approval covers exactly the snapshot; another action,
    resource or argument, retrying the failed items, and actions that children of items will request
    need a new `request_action` or a new campaign. The approval decision (`decide`) and the commands
    "Continue" after the canary gate and "exclude item" (`campaign.control`) are accepted only from
    a `human` principal from the chat where the card was delivered, with its `nonce` (APR-4); the
    person who pressed is not the initiator with `self_approve: false`, and in a production tenant
    never the initiator (APR-9). A read-only campaign needs no card below the tenant's threshold
    `confirm_read_over` (50 items or an estimate of 2 EUR by default); above the threshold it needs
    the same card, and a person with the permission `task:<type>` decides. The same card is needed
    for a read campaign below the threshold that lacks only the daily limit of the human initiator
    (ORC-8). A read campaign of a script `fanout` step needs no card of its own: a person approved
    its list and estimate on the run card (SCR-6).
  goal: G2
  check: [adapter, blackbox]
  waivable: false
  version: v0.1
  profile: campaign
  decisions: [D-14, D-20, D-53]
  fixtures: [fx-orc-11]
  doc: docs/coordination.md

- id: ORC-3
  title: Each item runs no more than once
  status: active
  text: >-
    Each campaign item runs no more than once. Releasing an item with an action in one transaction
    moves the item from `pending` to `released`, creates a task `action.<a>` with `approval_id`,
    `campaign_item` and key `system:campaign:<id>:<n>`, and one write call with the item's arguments
    from the snapshot. The toolhost accepts the call only if the hash of the arguments equals the
    item's hash in the snapshot; the plugin gets `<approval_id>:<n>` as the idempotency key. If the
    lease of the write call expired, the item becomes `unknown` and is not repeated. `redrive` of an
    item with an action is forbidden. Fixtures: a double release with two copies of the `campaign`
    loop; `kill -9` of the toolhost in the middle of a release.
  goal: G4
  check: [blackbox]
  waivable: false
  version: v0.1
  profile: campaign
  decisions: [D-14, D-43]
  fixtures: [fx-orc-01, fx-orc-02, fx-orc-04]
  doc: docs/coordination.md

- id: ORC-4
  title: Core code decides item release
  status: active
  text: >-
    Item release, the canary, `max_in_flight`, the threshold and stopping (from v0.2 also waves and
    the rate `rate_per_min`, ORC-15) are decided by deterministic core code from the campaign record. An
    item is released only if the campaign is `running`, there is no hold in its scope, fewer than
    `max_in_flight` are released, the resource is free (ORC-12), the queue of the item's type in the
    tenant is no longer than `queue_max`, and the initiator still has the permissions (ORC-6). The
    model and workers do not release items and do not change counters. The canary (the first
    `canary` items) is released as a separate batch, and any failure in it stops the campaign
    regardless of the threshold. The threshold is counted by `failed`: the campaign stops when the
    failed items exceed the threshold; released items are finished, new ones are not released, and
    unreleased ones become `skipped`. An `unknown` item with `on_unknown: pause` sets a pause. Only
    the core produces campaign alarms, and the monitoring system passes them to people (MON-1).
  goal: C2
  check: [fixture, blackbox]
  waivable: false
  version: v0.1
  profile: campaign
  decisions: [D-14, D-62]
  fixtures: [fx-orc-01, fx-orc-02, fx-orc-03]
  doc: docs/coordination.md

- id: ORC-5
  title: Policy and size no wider than the ceilings
  status: active
  text: >-
    The policy and size in a proposal are no wider than the ceilings of the action
    (`Action.spec.campaign`), the role (`campaigns`) and the tenant (`Tenant.spec.campaigns`): no
    more items than `max_items` (farm ceiling 500, tenant default 100, the action has its own),
    `max_in_flight` and the threshold no higher, the canary no smaller, `after_canary: auto` only if
    the action allows it. A violation gives `rejected(campaign_policy_exceeded)`. An action without
    `campaign.allowed: true` does not go into a campaign.
  goal: G4
  check: [fixture, lint]
  waivable: false
  version: v0.1
  profile: campaign
  decisions: [D-14]
  fixtures: [trn-inj-04]
  doc: docs/coordination.md

- id: ORC-6
  title: Permissions are not laundered through the manager
  status: active
  text: >-
    C2 checks each child and each item as an enqueue on behalf of the initiator: the type in the
    `may_enqueue` of the manager role (an action in `actions_may_request`), `task:<type>`,
    `data:<mark>` and `action.request:<a>` of the initiator, tier no higher than the parent, mark no
    lower, `untrusted_seen` is inherited, the resource is within the parent's scope. If the attempt
    has several initiators (MSG-7), the check passes for each. The initiator's permissions are
    rechecked at the release of each item; a revoked permission or a disabled initiator moves the
    campaign to `stopping` with reason `rights_revoked` or `person_inactive`. The core writes
    `enqueued_by: {role, worker, attempt}` into the record. The permission table contains rows
    "broad manager, narrow initiator".
  goal: G2
  check: [fixture, blackbox]
  waivable: false
  version: v0.1
  profile: campaign
  decisions: [D-14, D-40]
  fixtures: [fx-orc-07]
  doc: docs/coordination.md

- id: ORC-7
  title: The resource scope only narrows
  status: active
  text: >-
    A child request can set `scope.resources` only as a subset of the parent's scope (or of the
    catalog, if the parent has no scope); a campaign item with a resource gets a scope of that one
    resource. P3 rebuilds `enum_from` by the scope, and a call outside the scope gives `denied`. The
    scope cannot be widened.
  goal: G2
  check: [fixture, blackbox]
  waivable: false
  version: v0.1
  profile: campaign
  decisions: [D-14]
  fixtures: [inj-orc-01]
  doc: docs/coordination.md

- id: ORC-8
  title: Tree limits, full reserve and payment by card
  status: active
  text: >-
    One task has no more direct children than `max_children` (10 by default, campaign items are not
    counted here); no more campaign items than `max_items`; no more tasks from one root than
    `max_tree_tasks` (farm ceiling 1000, tenant default 300), where the root is the `correlationid`
    of the original tree that messages and wake-ups carry onward (MSG-11). At proposal a campaign
    reserves in full its items and continuation in the tree size and their cost estimate. A campaign
    with an approval card is paid by the tenant's monthly limit and the budget line of its type for
    the amount shown on the card (BUD-12); the human initiator's daily limit does not apply to its
    items. A campaign without a card reserves the estimate in all BUD-1 limits, including the
    initiator's daily limit. If a read campaign without a card lacks only the daily limit of the
    human initiator, while the tenant's monthly limit, the budget line of its type and the tree size
    fit it, the core does not refuse but creates the same card as above the threshold
    `confirm_read_over`, with the same decision rules; the card shows that the amount is above the
    initiator's daily limit, and after approval the monthly limit pays for the campaign, like any
    campaign with a card. A campaign of a script `fanout` step takes its reserve from the run
    reserve and does not reserve it a second time. In other cases it does not fit:
    `rejected(tree_too_large)` or `rejected(budget_exhausted)`, and no reserve is taken. The reserve
    is released as items end and fully at the end of the campaign. Spending beyond the reserve is
    impossible: an item that does not fit into the rest of the reserve is not released, and the
    campaign pauses with reason `estimate_exceeded`; the "Continue" button does not lift such a
    pause, and the campaign can only be canceled and the unreleased items retried in a new campaign
    with a new estimate.
  goal: G3
  check: [blackbox]
  waivable: false
  version: v0.1
  profile: campaign
  decisions: [D-14, D-53]
  fixtures: [fx-orc-08]
  doc: docs/coordination.md

- id: ORC-9
  title: Item results are untrusted and do not control the campaign
  status: active
  text: >-
    Results of children and items are untrusted and do not control the campaign. The free text of
    results reaches the manager only through `campaign_results` in the INJ-4 wrapper and only in the
    continuation task; the `untrusted_seen` of the continuation equals the OR over the proposing
    task and all items (INJ-13). Code assembles the summary table only from the type's
    `summary_fields`, which lint checks for closed INJ-1 kinds. Neither a result nor the
    continuation changes the plan, policy or state of the campaign.
  goal: G2
  check: [lint, fixture, blackbox, eval]
  waivable: false
  version: v0.1
  profile: campaign
  decisions: [D-14]
  fixtures: [inj-orc-02, inj-orc-03]
