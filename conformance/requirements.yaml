- id: KNW-4
  title: The model has no write path to a corpus
  status: active
  text: >-
    The model has no write path to a corpus: agent roles have no corpus write tool, and no
    memory record gets into a corpus. Only a principal with the capability `kb.write:<corpus>`
    uploads documents, through a channel or P2 `kb.upload`. Only a task of kind `job` of type
    `kb.ingest.v1` parses documents and cuts them into fragments for the per-tenant word index
    (D-97). P1 `kb.index_put` writes only into the corpus and for the file that the leased
    ingest task names in its input; the core takes both from the task, and a request that names
    another corpus or file, or a file of another tenant, gets `forbidden` and writes nothing.
    Fragments of a `curated` corpus are written only for files that came through `apply` from
    the tenant's git (KNW-2); an uploaded, synchronized or task-created file never enters a
    `curated` corpus.
  goal: G2
  check: [lint, blackbox]
  waivable: false
