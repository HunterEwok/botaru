- id: MEM-11
  title: The session holds what the farm accepted
  status: active
  text: >-
    From v0.3 the core keeps with each session entry the attempt that appended it. P1
    `session.load` returns an entry of an attempt while the attempt runs and after the core accepted
    its result; an entry of an attempt that ended otherwise (a refused result, a failure, a fence, a
    timeout) is left out, so a later task of the conversation never reads as the bot's answer what
    the farm refused. Entries written before v0.3 have no attempt and are returned. The request
    field `last` asks for the latest entries, at most 100 and oldest first, instead of a page from the
    start; it goes without `after` and `limit`.
  goal: G1
  check: [impl]
  waivable: true
  version: v0.3
  profile: governance
  decisions: [D-122]
  fixtures: [impl:internal/core/TestSessionLeavesOutFailedAttempts, impl:internal/agent/TestAgentSession]
  doc: docs/bots.md

- id: MGR-1
  title: One seat, one holder, one epoch
  status: active
  text: >-
    The `farm-manager` seat in the registry of the service tenant `farm` has no more than one holder
    and one epoch. The epoch grows when the seat is assigned and vacated, with every new stop reason
    and on return to `held`. The core writes the epoch into the token of every attempt of the seat;
    an attempt, a control operation and a grant decision with an old epoch are refused with
    `fenced`, and at every epoch change the running attempts of seat tasks end with reason
    `seat_changed` without spending an attempt, and the task waits for a holder with the current
    epoch (IDN-10). Seat tasks are taken only by workers of seat roles enrolled in the task's
    tenant; in one tenant no more than one decision attempt runs. Only P2 `seat.assign` from a
    person with `admin:governance` in `farm` through `farmctl` assigns a holder (PRM-14), and the
    core always creates a new bot identity without `origin`; a bot from a commission does not move
    to the seat, and there are no holder elections. When a person replaces the holder, the waiting
    cards of the former holder move to `canceled(seat_changed)`, and its holds live no longer than
    15 minutes.
  goal: C1
  check: [blackbox]
  waivable: false
  version: v0.1
  profile: manager
  decisions: [D-18, D-21, D-33]
  fixtures: [fx-mgr-02, fx-mgr-15, fx-mgr-01]
  doc: docs/farm-manager.md

- id: MGR-2
  title: A farm without a manager
  status: active
  text: >-
    No core path (alarms and their export to the monitoring system, auto-stops, the first measure of
    class `contain_auto`, messages to people and the `alarm.incident.unhandled` alarm for an
    unhandled incident, dispatch, approvals, deliveries) waits for the manager. The seat can be in
    states `vacant`, `held` and `stopped`; state `stopped` holds the stop reason set `human`,
    `no_control`, `incident` with the time of each. In `vacant` and `stopped` seat tasks are not
    handed out in any tenant, and the farm works in no-manager mode: grant requests are refused
    after `grant_wait_max`, escalations expire after `escalation_ttl`, and code shows urgent
    escalations to people with a template. Code raises the alarm `alarm.manager.absent` if the seat
    is not in `held` for longer than 5 minutes or a seat task in a tenant waits for a worker for
    longer than 5 minutes. `alarm.manager.absent` and other alarms are delivered to people only by
    the monitoring system (MON-1), not by E1 channel delivery.
  goal: G4
  check: [blackbox]
  waivable: false
  version: v0.1
  profile: manager
  decisions: [D-18, D-33, D-62]
  fixtures: [fx-mgr-10]
  doc: docs/farm-manager.md

- id: MGR-3
  title: Seat tasks live in tenants
  status: active
  text: >-
    Seat tasks, attempts, findings, operations, cards, usage and the read log are records of the
    tenant T they belong to; they are run by workers of seat roles enrolled in T, with the key and
    the `manager` line of tenant T. The permissions of a seat attempt in T are the role's
    permissions ∩ the permissions of group `farm-manager-ops` of tenant T, and for a human directive
    also ∩ that person's permissions. The core derives the tenant of an operation's target from the
    target object; a tenant field in the call body is not accepted. `farm` holds only the seat
    registry (holder, epoch, state, stop reason set with the time of each) and the holder's identity
    in numbers and codes; there are no model calls for control in `farm`.
  goal: C3
  check: [blackbox, lint]
  waivable: false
  version: v0.1
  profile: manager
  decisions: [D-30, D-42]
  fixtures: [fx-mgr-04]
  doc: docs/farm-manager.md

