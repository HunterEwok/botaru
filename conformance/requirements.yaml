- id: ART-3
  title: File mark and check on handout
  status: active
  text: >-
    The `data_mark` of a produced file is not lower than the mark of the producing task. The
    `data_mark` of an uploaded file is not lower than the tenant's attachment class (default
    `internal`) and not higher than the class allowed to the uploader (`data:<class>`). Handing out
    a file and delivery check the file's mark against the recipient (PRM-9, DLV-6).
  goal: G2
