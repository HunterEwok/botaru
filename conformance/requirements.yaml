- id: SBX-2
  title: One disposable container per task
  status: deferred
  deferred: 2026-10-14
  reason: 'Goes with SBX-1.'
  return_when: 'SBX-1 returns; the `sandbox_seconds` meter returns to `spec/model/meters.yaml` and BUD-5 with it.'
  mechanism_removed: false
  text: >-
    The sandbox toolhost starts one container for one task and never reuses it for another task
    or tenant. The container has no network and no secrets, a read-only root, no privileges, an
    unprivileged user and limits on memory, CPU, processes and file size. `/in` is mounted
    read-only and only the toolhost fills it: with a slice of a tenant catalog dataset whose class
