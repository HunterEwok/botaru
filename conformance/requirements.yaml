- id: GOV-31
  title: '"Not now" and "Wrong candidate" on the promotion card'
  status: active
  text: >-
    "Reject" on the promotion card requires a reason code from
    `spec/model/governance-decline-reasons.yaml`: `not_now` ("Not now") or `wrong_candidate` ("Wrong
    candidate"); both are allowed in a case that frees a seat and in a case about a vacant seat.
    With `not_now`, nobody leaves, the candidate's entry stays at the head of the queue, and the
    next case comes no earlier than after `swap_cooldown` (30 days); this is also the answer of a
    person who disagrees with the leaver that code proposed (GOV-43). With `wrong_candidate`, the
    first "Reject" returns the entry to the head of the queue with its own `swap_cooldown` pause (30
    days), during which the next entries may go ahead (D-101), and the second one for the same
    candidate removes it until the candidate's next success. A case is never reopened with another
    list.
  goal: C1
  check: [blackbox]
  waivable: true
