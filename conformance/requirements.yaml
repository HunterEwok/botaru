- id: GOV-40
  title: A person confirms a link on a card
  status: active
  text: >-
    A candidate link of `kind: rejected_proposal` is decided like an incident attribution (GOV-13,
    GOV-30): the states `candidate`, `unknown`, `confirmed`, `rejected`, `disputed`, `canceled`;
    only a `human` principal with `governance.attribute` decides through `decide(subject_kind:
    attribution)`, and "Yes" and "No" only after "Details" (APR-14). With
    `commission.accountability: on` the card `rejection_link_card` goes once per incident with up to
    3 candidates and no model text: what the proposal would have changed, the incident, the rule by
    which code linked them, where the alarm came from and whether code writes its series, the
    author's share in the series, who would leave and whether each one's lens changed the verdict.
    Silence changes nothing; there are at most 3 weekly reminders. If the tenant has a second person
    with `governance.attribute`, a candidate created from a manager's hint is not decided by the
    person who created it; if there is one person, the card and the audit mark it. Declaring the
    incident false cancels the candidates and turns a "Yes" into a dispute, as in GOV-13; a link
    canceled this way returns the departed members under GOV-42.
  goal: C1
  check: [blackbox]
  waivable: false
