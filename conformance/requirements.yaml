- id: DSP-1
  title: The task pool is the C1 queue, work only through claim
  status: active
  text: >-
    A tenant's task pool is the task queue in C1. A worker gets work only through P1 `claim`; there
    are no other paths: no queues inside runtimes, no handover of work from worker to worker, no
    assignment by message.
  goal: G1
  check: [lint, blackbox]
  waivable: false
  version: v0.1
  profile: core
  decisions: [D-03, D-14]
  fixtures: [fx-dsp-09]
