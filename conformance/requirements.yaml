- id: PRM-16
  title: Delegated groups of a tenant
  status: active
  text: >-
    A tenant has the field `delegated_groups: [<group>...]`. Only a group whose privileged status
    (PRM-13) rests solely on task types of tiers 1 and 2 with a data class no higher than `internal`
    and on `task.read:<type>` of such types can be listed in it: `apply` rejects in this field a
    group with `action.request:<a>`, `action.approve:<a>`, `admin:<area>`, a class above `internal`,
    a tier 3 type or any decision permission. A tenant admin with `admin:people` grants and removes
    a group from `delegated_groups` from the channel (`/invite`, `/grant`, `/ungrant`, P2
    `invite.*`, `grant`, `ungrant`) without an operator, without `--requested-by` and without a
    verification code check; PRM-7 applies: the grantor has all capabilities of the group. The
    membership is `active` at once, the grant is written into the audit, and all tenant admins get a
    private message, as with the grant of a privileged group. `farmctl apply` and `/me` show such a
    group with the attribute `delegated`. Groups outside this field are granted under PRM-13.
    Fixtures: a group with `action.request:<a>` in `delegated_groups` does not pass `apply`; `alice`
    (`admin:people`) grants `bob` the delegated group `researcher` with the command `/grant`, the
    membership is `active`, and the admins get a message; the same command for group `approver` gets
    `privileged_group`.
  goal: G6
