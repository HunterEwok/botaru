- id: GW-10
  title: A provider rate limit is a wait
  status: active
  text: >-
    P4 keeps no rate limiter of its own: the rate limits are those of the tenant's workspace at the
    provider (GW-9). A provider answer that asks to wait ends the call with `provider_rate_limited`
    and the time to wait (`retry_after_s` when the provider gives it); it does not spend an attempt,
    and the pair (workspace, model pool) waits until that time. The dispatcher does not hand out a
    task of a pair that waits for the provider limit (dispatch condition D19, `waiting_reason:
    provider_quota`), and the runtime is not started for it. A run that ended before its first
    response with `provider_rate_limited` or `provider_quota` does not count toward `max_runs`
    (GW-13), and the retry pause follows GW-12.
  goal: G1
  check: [blackbox, fixture]
  waivable: false
  version: v0.1
  profile: core
  decisions: [D-42, D-36, D-114]
  fixtures: [gateway/gateway]
  doc: docs/models-and-money.md

- id: GW-11
  title: A circuit breaker in P4
  status: active
  text: >-
    P4 keeps a circuit breaker for each pair (workspace, model pool). A series of provider failures
    (network, 5xx, overload, response deadline) opens the circuit. While the circuit is open, P4
    answers `provider_unavailable` right away, without calling the provider, the dispatcher does not
    hand out tasks that need this pair (dispatch condition D18, `waiting_reason:
    provider_unavailable`), the runtime is not started for them, and the tasks' `deadline` runs.
    After a pause the circuit is half-open: one task makes a probe call; success closes the circuit,
    failure opens it again. A provider configuration error opens the circuit of its pair until it is
    fixed (GW-13). Fixture: a mock provider answers 529 for 30 minutes; no task ends with
    `attempts_exhausted` or `runs_exhausted` before its `deadline`, and there are no more provider
    calls during the outage than probes.
  goal: G1
  check: [fixture, blackbox]
  waivable: false
  version: v0.1
  profile: core
  decisions: [D-36]
  fixtures: [blackbox:gateway/outage-30m]
  doc: docs/models-and-money.md

- id: GW-12
  title: One retry layer with a pause ceiling and jitter
  status: active
  text: >-
    Only one layer retries a provider error. The model SDK in the runtime makes no retries, and the
    runtime does not retry a P4 error: it ends the run with the reason P4 returned. P4 retries a
    call once, and only if the request was not sent, that is, the call has no provider `request_id`;
    after the body is sent there is no retry, and a call without a response is charged under BUD-11.
    After that the core retries the task under the retry policy: the pause before a retry caused by
    the provider grows with a multiplier up to a ceiling (default 60 s) and is taken with full
    random jitter, from zero to the current pause, so that waiting tasks do not all arrive at once
    after the provider recovers, and a task of a pair that waits for the provider rate limit is not
    handed out (GW-10). P4 computes a call's response deadline from the profile: `max_output_tokens`
    divided by the profile's output speed `tokens_per_s`, with a twofold margin and no less than 60
    seconds; there is no fixed deadline. Fixture: a mock provider answers later than the deadline;
    there is exactly one provider call.
  goal: G1
  check: [adapter, blackbox, fixture]
  waivable: false
  version: v0.1
  profile: core
  decisions: [D-36]
  fixtures: [blackbox:gateway/slow-response-one-call]
  doc: docs/models-and-money.md

- id: GW-13
  title: Only runs with a response count, a configuration error does not spend an attempt
  status: active
  text: >-
    P4 marks in the run record whether the run got at least one model response. Only a run with a
    model response counts toward the run ceiling `max_runs` (FEN-3); a run that ended before the
    first response with `provider_unavailable`, `provider_rate_limited`, `provider_quota`,
    `provider_config` or `core_unavailable` does not count. A provider configuration error (the key
    is wrong or revoked, no access, the model is not found or retired, the workspace configuration
    is refused, the model is unavailable under the workspace retention setting) gives the reason
    `provider_config`: it does not spend an attempt, is not retried on a timer, raises an alarm by
    code and opens the circuit of its pair (GW-11), and the task waits for the fix until its
    `deadline`. A task that waited for the provider and ended with `failed(deadline_exceeded)` keeps
    the provider reason in its outcome, and the schedule pause of CAP-4 counts such an outcome as
    `attempts_exhausted`.
  goal: G1
  check: [blackbox, fixture]
  waivable: false
  version: v0.1
  profile: core
  decisions: [D-36]
  fixtures: []
  doc: docs/models-and-money.md

- id: GW-14
  title: Only P4 sets the call region
  status: active
  text: >-
    Only P4 sets the processing region of a model call: from `privacy.subprocessors[].region` of the
    called provider's entry in the tenant's privacy block, in the way the provider binding describes
    (a request field or a workspace setting). The runtime does not set the region: a region field in
    its request is rejected (GW-1). A profile whose provider does not support this region fails
    `apply` for this tenant. P4 does not call a provider that is not in the tenant's
    `privacy.subprocessors`, on either the main or the fallback model (SEC-8). Every P4 call goes
    through the same checks, not only attempts: the embedding model call of the task `kb.ingest.v1`
    and eval runs on the test bench; the embedding model has its own `ModelProfile`, and GW-14 and
    GW-15 apply to its provider in the same way. A production tenant whose `privacy.subprocessors`
    has a profile provider with a region outside the EU (the list of regions is in the provider
    binding note) passes `apply` only if the tenant has a transfer basis `spec.model_transfer` for
    this provider or region (`basis`: `scc`, `adequacy` or `consent`, check date `checked`; code
    `transfer_basis_missing`, D-87 (2)). The basis belongs to each controller tenant, not to the
    shared model profile.
  goal: C6
  check: [blackbox, lint]
  waivable: false
  version: v0.1
  profile: core
  decisions: [D-36, D-87]
  fixtures: [manifests/model-profiles, manifests/privacy]
