- id: SEC-13
  title: The privacy notice as a separate delivery
  status: active
  text: >-
    The privacy notice is a separate code delivery `privacy_notice` with the field `notice_version`,
    independent of `ai_disclosure` and of the channel's `native` mode (DLV-12). The core sends it to
    each principal at the first contact in the tenant and into each new bound chat before the first
    model text, repeats it at the next contact when `privacy.notice_version` has grown, and repeats
    it to a participant who joined a bound group chat with `membership_assurance: enforced`
    (MSG-17). Code assembles the text from the message catalog by key `notice.privacy` (DLV-9,
    REP-12) and the privacy block (SEC-8), with the substitutions `{controller}`, `{contact}`,
    `{purposes}`, `{recipients}`, `{subprocessors}`, `{retention}`, `{notice_ref}`,
    `{notice_version}`: the controller and contact, the purposes with lawful bases, the recipients,
    the subprocessors with region and retention, the periods by class, the `notice_ref` link to the
    full text and how to file a data request. A change of `controller`, `purposes`, `subprocessors`
    or `recipients` without a growth of `notice_version` fails `apply`. The delivery is written into
    the audit with the version; while the recipient has no delivered `privacy_notice` of the current
    version, model text to them is held back, as with an undelivered bot notice. Fixture: a channel
    with `ai_disclosure: native` still delivers `privacy_notice` before the first model text.
  goal: C6
  check: [blackbox, lint]
  waivable: true
  version: v0.1
  profile: core
  decisions: []
  fixtures: [blackbox:channel/privacy-notice-native, blackbox:channel/privacy-notice-enforced-join, manifests/privacy]
  doc: docs/operations.md

- id: SEC-14
  title: Per-principal usage is anonymized after 93 days
  status: active
  text: >-
    Usage lines whose `subject` is a person (`human:`) and that are older than 93 days lose the
    reference: the retention loop removes `subject`, `task` and `root`, truncates `time` to the day
    (00:00 UTC) and writes `subject_kind: human`, in whole days, so that no join with audit, events
    or task records leads back to the person; the amounts and the other fields remain; the line
    stays in class `metadata` for its period, and this removal is the only edit of a `metadata`
    row. The retention loop does it together with
    BUD-16. Daily limits and reports per principal are computed only from lines younger than 93
    days; the report to a person about their data names this period (SEC-10). Fixture: after a loop
    run, a usage line aged 94 days has no `subject`, `task` or `root`, and its `time` is midnight.
  goal: C6
  check: [blackbox]
  waivable: true
  version: v0.2
  profile: core
  decisions: []
  fixtures: [blackbox:budget/subject-anonymized-93d]
  doc: docs/operations.md

