- id: AUD-5
  title: The "personal data seen" flag
  status: active
  text: >-
    A task, a file record, an artifact, a bot message, a manager finding and a memory record carry
    the flag `personal_seen`, which only the core sets: if redaction on the toolhost replaced at
    least one IP address or email address; if the attempt read the content of a file or attachment
    uploaded by a person; if the attempt read the body, result, file or message of a task whose
    initiator is another person; if the task body came as a forward or a quote; if the attempt read
    an object with the flag. The flag's source comes from the closed list `masking`, `human_file`,
    `other_person`, `forward`, `quote`, `declared`, `inherited` and, from v0.2, `connection`. With source `other_person`,
    `forward` or `quote`, the core writes into the object the closed field `personal_subjects:
    [<principal id>...]` (ids only, append-only); through it, an erasure request for the scope
    `(tenant, subject)` and the report to a person find objects where their data lies in other
    people's tasks (SEC-11). Source `declared` is set for a file uploaded by a principal with
    `uploads_personal: true`, and for a `service` or `ingested` file whose source declared personal
    data; the manager reads any file with the flag as personal (MGR-30). From v0.2 source
    `connection` is set when the attempt called a tool with `credential: per_principal` (SEC-7), and
    a corpus fragment of a resource with `personal: true` read by `kb_search` or `kb_read` sets
    source `declared` (KNW-1). The flag is monotonic:
    child tasks, continuations and objects created by an attempt with the flag inherit it. The model
    does not see or remove the flag. The report to a person about their data and the privacy report
    count the flag; in audit it is stored as a marker with the source code, without content.
  goal: C6
  check: [fixture, blackbox]
  waivable: true
  version: v0.1
  profile: core
  decisions: [D-36]
  fixtures: []
  doc: docs/operations.md

- id: AUD-6
  title: Audit hash chain
  status: active
  text: >-
    The audit records of each tenant and of the service tenant `farm` are linked by their own hash
    chain: each record stores its number and the hash of the previous record, and its own hash
    covers all its fields. Deleting a whole period by the retention loop writes into the chain a
    record with the period bounds, the number of deleted records and the hash of the last of them.
    At least once a day the head of the chain of each tenant and of `farm` (the number and hash of
    the last record) leaves the store. The core signs the head with its key, with the key id
    (SEC-5), and the monitoring adapter writes the value `seq hash sig key_id` into the monitoring
    system's history (MON-3); the adapter can write another head, but without the core's signature
    it is not accepted. The retention of this history is not shorter than the retention of audit,
    and `farmctl doctor` fails the check if the head of any chain has been missing there for more
    than a day or if `seq` in the witness history does not grow monotonically; in addition, the head
    of a tenant's chain goes to a sink or code summary assigned by the tenant, and the head of the
    `farm` chain goes to the admins of all tenants. P2 `audit.verify` recomputes the chain, compares
    it with the last head sent, checks the signature of every head in the witness history, and
    checks the monotonicity of `seq` over the whole history, not only the last value. The witness
    holds as long as whoever controls the store does not also control the monitoring system; this
    separation of duties is written in `docs/operations.md`. Fixtures: editing or deleting one
    record directly in the store is detected; a head rewritten in the witness history with the
    adapter's token is detected by its signature.
  goal: G2
  check: [blackbox, fixture]
  waivable: false
  version: v0.1
  profile: core
  decisions: [D-36, D-59, D-60]
  fixtures: [blackbox:core/audit-chain, blackbox:core/audit-head-rewritten]
  doc: docs/permissions.md

- id: AUD-7
  title: A separate right to read audit
  status: active
  text: >-
    Only a principal with the capability `audit.read` in a tenant reads that tenant's audit: P2
    `audit.query` and the manager's read log P2 `manager.reads`. The capability `audit.read` is
    privileged; only an operator grants it. The answer contains only metadata, and every audit read
    itself writes an audit record. An operator reads a tenant's audit only through emergency access
    with the record `via=farmctl`. Membership lint of a tenant with `kind: production` warns if a
    principal with `audit.read` has decision rights in the same tenant.
  goal: G2
  check: [blackbox, lint]
  waivable: true
  version: v0.1
  profile: core
  decisions: [D-36]
  fixtures: []
  doc: docs/permissions.md

- id: BGR-1
  title: A bot group is a selector by roles and labels
  status: active
  text: >-
    A bot group `BotGroup` is a tenant manifest in git with a selector by roles and worker labels.
    It has no worker ids, capabilities, secrets or references to other tenants. The core computes
    the membership from the role and the labels recorded at `enroll`; `hello` can only narrow it: a
    worker with other labels goes to `blocked` and drops out of the group. A worker can be in
    several groups; an empty group is legal. The membership can be changed only through git and
    `apply`; `apply` refuses to delete a group referenced by a dispatch policy, the
    `may_target_groups` of roles, routes or open tasks.
  goal: G1
  check: [lint, fixture, blackbox]
  waivable: false
  version: v0.1
  profile: messaging
  decisions: [D-14, D-71]
  fixtures: [fx-bgr-01, fx-dsp-01]
  doc: docs/coordination.md

- id: BGR-2
  title: A bot group grants no permissions
  status: active
  text: >-
    A bot group grants no permissions: the permission table has no "bot group" input, and C2 does
    not read membership at `authorize`. Membership only narrows dispatch (D5) and serves as an
    address for tasks (`to.group`) and messages (`group:`). A whole group can be stopped or taken
    out of work with a hold on the scope `bot_group`.
  goal: G2
  check: [fixture, lint]
  waivable: false
  version: v0.1
  profile: messaging
  decisions: [D-14, D-40, D-71, D-80]
  fixtures: [fx-bgr-02, fx-dsp-06]
  doc: docs/coordination.md

- id: BUD-1
  title: Reserve at enqueue in the tenant, tree and line limits
  status: active
  text: >-
    At `enqueue` the core reserves the task's price estimate (BUD-14) in four limits: the tenant's
    monthly and daily limits (`month_eur` and `day_eur` from `Tenant.spec.budgets`; by default
    `day_eur` is one twentieth of `month_eur`), the task tree limit (`tree_budget_eur` of the root
    type) and the budget line of the type's purpose (BUD-7). Two simple counters stand next to these
    limits. The daily limit of a person or program is the largest `day_eur` of the principal's
    groups; it counts only tasks of the `work` line, so reviews, analysis, the daily review and seat
    tasks do not use up the daily limit of the principal `system` and do not get in the way of
    schedules; a task with several initiators (for example, a wake-up on messages that have
    `origininitiators`) counts in the daily limit of each of them. The wake-up ceiling per pair
    (tenant, recipient role) is the counter of MSG-11, not a budget line. Campaign items with a card
    and script steps are paid from the reserve of the campaign or run (BUD-12). If even one limit or
    counter is exhausted: `rejected(budget_exhausted)`, and a wake-up is skipped with an event
    (MSG-11). There is one exception: a read campaign that lacks only the daily limit of the human
    initiator gets a card instead of a refusal (ORC-8). The reserve is released when the task
    becomes terminal. Fixtures: a stuck reserve does not eat the limit; 100 reviews in a day do not
    get in the way of enqueuing a schedule task from the principal `system`.
  goal: G3
