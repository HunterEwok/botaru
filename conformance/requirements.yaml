- id: COM-14
  title: A proposal of kind `none` is assessed by two lenses
  status: active
  text: >-
    For a proposal of kind `none` ("for information"), the core enqueues tasks only for the lenses
    `value` and `security`; the lenses `operational`, `cost`, `speed`, `clarity`, `farm_manager` and the
    tenant lenses (COM-19) are not enqueued for it, and there are no reviews or money for them. The verdict for such a proposal is computed
    under COM-4 with two reviews: only the `security` review is required (its absence gives
    `parked(veto_lens_missing)`), the minimum and veto apply only to it, the weighted mean is
    computed with the weights of these two lenses, and the thresholds `high_risk` and `untrusted`
    read only the `security` score. The `review` line reserve (COM-6) and the BUD-13 lint estimate
    for the kind `none` are computed from two review types; lint computes the role ceiling from the
    full commission, because the proposal kind is not known in advance.
  goal: G3
  check: [fixture, blackbox]
  waivable: true
  version: v0.1
  profile: insights
  decisions: [D-16, D-71]
  fixtures: [com-06]
  doc: docs/improvements.md

- id: COM-15
  title: The core builds the reviewer input, and a review carries a forecast
  status: active
  text: >-
    The core builds the reviewer input as a data block with a mark (INJ-4): the closed fields of the
    proposal, the evidence values that the core reread itself (series numbers over a bounded window
    and closed fields of records), a description of the change in code words, and the markers
    `self_evidence`, `related_to` and conflicts. The input has neither the author's `note` nor the
    author's level, identity, role or position, nor whether the proposal is a resubmission (PRP-24);
    no raw text (logs, files, messages, tool output) ever reaches it. The only tool the reviewer has
    is `observations_query` within the tenant. The output passes the closed schema
    `review-result.v2` (`spec/model/review-result.v2.schema.json`): lens, score 0-4, veto only for
    veto lenses, up to 5 concern codes, confidence, the lens forecast (COM-16) and a note of up to
    500 characters; the reviewer's note is untrusted, and the verdict code does not read it. A
    review whose score and forecast contradict each other (a score of 3 or more with a probability
    of a bad outcome of 0.5 or more) is invalid and counts as a missing review under COM-4. Reviews
    of v0.1 and v0.2 records keep `review-result`.
  goal: G2
  check: [fixture, blackbox]
  waivable: false
  version: v0.3
  profile: insights
  decisions: [D-16, D-71, D-109]
  fixtures: [blackbox:insights/review-forecast]
  doc: docs/improvements.md

- id: COM-16
  title: Every review is a forecast scored by code
  status: active
  text: >-
    Every lens review forecasts the outcome of its own lens, in probabilities with a step of 0.1
    that sum to 1: `value`, `speed`, `clarity` and the tenant lenses (COM-19) the trial outcome
    classes `better`, `unchanged` and `worse` (PRP-22);
    `security` and `operational` the probability of a bad outcome (people declined the proposal as
    too risky, a confirmed incident attribution to the change, or the trial outcome `worse`); `cost`
    the probability that the spend of the change subjects over the trial window exceeds the
    `cost_eur` of the review input. The forecast horizon is the trial window from `realized`, and
    for veto lenses also the attribution window (GOV-13). When the outcome is known, code scores the
    forecast with the multiclass Brier score (a binary one for the veto lenses and `cost`) and
    writes the score into the review record; the outcomes `undetermined`, `mixed` and `canceled`
    give no score, and harm observed by people (`harm_observed`, GOV-32) counts as `worse`. A
    rejected proposal is scored through the blind sample answers of people (DIG-6), weighted by
    1/`inclusion_prob`, through a resubmission with the same values whose trial ended (PRP-24) and
    through a replay (PRP-25). Every review written after the first `apply` of the tenant on a core
    that claims v0.3 (`governance_v03_since`, GOV-36) is scored, also while accountability is in
    `shadow` (D-116); shadow reviews (COM-9) are scored but never count for a seat.
  goal: G5
  check: [fixture, blackbox]
  waivable: true
  version: v0.3
  profile: insights
  decisions: [D-109, D-116]
  fixtures: [blackbox:insights/review-forecast]
  doc: docs/improvements.md

- id: COM-17
  title: Accuracy of a commission member
  status: active
  text: >-
    Only code computes the accuracy of a lens executor, and only relative to its own lens: over its
    forecasts scored in the last 180 days (COM-16), accuracy = 1 - B / B_ref, where B is the mean
    Brier score of its forecasts and B_ref the mean Brier score of a reference forecast "as it
    usually goes in this lens" (the base rates of the lens outcomes over the same 180 days in the
    tenant) on the same cases; a value above 0 is better than the reference. A review whose warning
    disagrees with its own forecast (it warns with a veto or a score of at most 1 while the forecast
    gives a bad outcome a probability below 0.5, or it passes while the forecast gives 0.5 or more)
    counts as a missed forecast with the worst Brier score, and people see the number of such
    reviews next to the accuracy. The outcome of each lens is the one of COM-16, so a veto that
    people lifted (DIG-6) is a miss when the trial ended other than `worse` and there is no
    confirmed attribution (GOV-13), and the blind card answers (DIG-6) enter the veto lenses with
    weight 1/`inclusion_prob`: "Would not accept" is a bad outcome, "Would accept" a good one.
    People's decisions do not enter the `value` lens: only the trial outcome counts (PRP-22). A
    canceled attribution leaves the computation, and a disputed one (`disputed`, D-79) does not
    enter it while the dispute is open. Fewer than 10 scored forecasts give `insufficient`; a
    decision about departure (GOV-43) needs at least `commission.accountability_min_forecasts`
    (GOV-36). Two executors are tied when their accuracies differ by less than one standard error of
    the difference. Accuracy is always shown together with the lens and compared only within the
    lens: P2 `commission.status`, the weekly commission summary and the promotion card show it; no
    bot context contains it (GOV-46).
  goal: G5
  check: [fixture, blackbox]
  waivable: true
  version: v0.3
  profile: insights
  decisions: [D-16, D-57, D-79, D-101, D-109, D-114]
  fixtures: [blackbox:insights/accuracy, com-05]
  doc: docs/improvements.md

- id: COM-18
  title: A stronger model for the most accurate member
  status: deferred
  deferred: 2026-10-14
  reason: 'A stronger model for the most accurate member has a ceiling of 0 euro by default and needs scored forecasts; it does not switch on in the pilot. The outcome of D-109 (5) returns with it.'
  return_when: 'The commission has scored forecasts and a budget for the reward.'
  mechanism_removed: false
  text: >-
    With `commission.accountability: on` (GOV-36) the holder with the best accuracy (COM-17) over 90
    days in the tenant, with at least 20 scored forecasts, gets two things for 90 days. (1) Its
    reviews of hard proposals run on the profile `reward_profile` of its seat in the charter: a
    proposal is hard when code marks it high risk, it touches a protected field, or it has
    `untrusted_seen` (the thresholds `high_risk` and `untrusted` of COM-8). The core issues for such
    a review attempt a grant of `kind: reward` on this profile for one attempt (MGR-18 ceilings
    apply; the slot is `granted`, GW-7), paid from the `review` line within
    `commission.reward_cap_eur_month` (0 by default, so there is no reward until people set an
    amount). The rank of `reward_profile` is no higher than the ceiling of the seat role's profile
    (GOV-3), and it
    changes only the model, not the persona of the lens (COM-19). (2) Protection from leaving by accuracy (GOV-43). The protection does not apply to
    departures for a confirmed link (GOV-42) and does not apply if without it nobody could leave. No
    bot context mentions the reward (GOV-46).
  goal: G5
  check: [lint, blackbox]
  waivable: true
  version: v0.3
  profile: insights
  decisions: [D-109]
  fixtures: [blackbox:insights/reward]
  doc: docs/improvements.md

- id: COM-19
  title: Every lens has its persona, and a tenant adds its own lenses
  status: active
  text: >-
    Every member of the commission represents one lens. The tenant charter sets the persona
    addendum of every lens that a seat names (`commission.lenses.<lens>.persona`, a file from git
    pinned by hash, as in GOV-4); the core appends it after the reviewer persona for every review of
    this lens, whoever executes it, a seat holder or the fallback role (COM-7). A seat whose lens has
    no addendum fails `apply` with `lens_persona_missing`. The addendum passes the persona lint of
    GOV-4 (size, no links or ids, the unawareness dictionary of GOV-29). A tenant adds its own lens
    only in its charter: the id `x_<name>`, the `meaning` (up to 300 characters, trusted text from
    git that the core inserts into the review instruction) and the persona addendum. A tenant lens
    is reviewed by the skeleton review type `review.lens.v1` with its id, has no veto, is not in
    `min`, `high_risk` and `untrusted`, is not needed for the quorum, is not enqueued for a proposal
    of kind `none` (COM-14) and answers for no incident area (GOV-41); its weight comes from the
    commission manifest (COM-8), 1 by default. A seat or a manifest that names a lens neither in
    `spec/model/lenses.yaml` nor in the charter fails `apply` with `lens_unknown`. The review price
    of a tenant lens counts in the BUD-13 lint like any seat lens.
  goal: G5
  check: [lint, fixture]
  waivable: false
  version: v0.1
  profile: insights
  decisions: [D-117]
  fixtures: [com-fx-19]
  doc: docs/improvements.md

- id: DEP-1
  title: Production machine and sandbox
  status: active
  text: >-
    A production machine is any host that runs the core, the store, a channel or a toolhost with
    `placement: host`, or holds data or secrets of any tenant, including backups. `placement:
    sandbox` lives only on a separate VM that has none of these: it has only the sandbox toolhost
    with its own worker token and a network path to P1. Sandbox task containers run without network
    and without secrets.
  goal: G2
