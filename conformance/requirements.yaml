- id: MAN-9
  title: Action manifest, what is approved is what runs
  status: active
  text: >-
    An `Action` manifest carries `title` (the card heading, written by a person in git),
    `description` (text for the model: when to propose it), a closed `args` schema with `required`,
    an optional `ttl` (without it the card expiry is set by the risk: `low` 60 minutes, `high` 30
    minutes, `routine` as `low`, APR-19), `idempotent`, the required risk field `risk: low | high |
    routine`, the number of approvers `approvals: 1 | 2` (APR-10, APR-16) and the executor
    `executor: {plugin, tool, os_mechanism}` (DEP-4). An action of class `routine` (routine
    pipeline, D-78) declares `writes_only` (the volumes or catalog resources it writes to),
    `idempotent: true`, `runs_per_hour` and `runs_per_day`; without any of them `apply` rejects the
    manifest, and it runs without a second person's card under a `service_grant` record with the
    initiator as author (APR-17). The "which resource" argument is set with `enum_from:
    catalog.<list>` of the catalog of the task's tenant. The core fills in default values explicitly
    before the snapshot, the hash and the card, so the card shows what will run. The executor's
    write tool has no schema of its own: it refers to the action schema with the field `args_from:
    action:<name>`, and lint rejects a second schema source. In the `request_action` schema for this
    action, P3 writes the `enum_from` values from the catalog of the task's tenant, filtered by the
    task's mark, as `enum`.
  goal: G2
  check: [lint, fixture, blackbox]
  waivable: false
  version: v0.1
  profile: core
  decisions: [D-36, D-78]
  fixtures: [lint:manifests/action-routine-fields]
  doc: docs/task-language.md

- id: MAN-10
  title: Catalog values pass a format and are rechecked
  status: active
  text: >-
    The values of a catalog list that `enum_from` refers to (tool parameters, action arguments,
    `params_schema` of types) pass at `apply` the format from the `formats.yaml` registry declared
    for that list, `id` by default; a value outside the format fails `apply` of the whole set
    (MAN-6). The core checks the value of an action argument against the catalog when the action is
    requested, when it is approved and when the write call is created; if the value is no longer in
    the catalog, the approval ends with `canceled(ref_invalid)`, and there is no write call.
  goal: G2
  check: [lint, blackbox]
  waivable: false
  version: v0.1
  profile: core
  decisions: [D-36]
  fixtures: [lint:manifests/catalog-values]
  doc: docs/task-language.md

- id: MAN-11
  title: A core rejects what it does not implement
  status: active
  text: >-
