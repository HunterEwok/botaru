    There is no worker per person: a worker record has no `owner` field, and P2 `worker.enroll` does
    not accept one. The personal assistant type is not part of the tenant's `default_types` (lint at
    `apply` rejects the catalog with the reason `assistant_in_default_types`); a person reaches the
    assistant only by an explicit address: with the command `/a <text>` from `commands`, or through
    a separate channel binding that has `ChatBinding.assistant: true` and only private chats. Free
    text in a private chat without a command gets a type from `default_types` or the code text of
    `/help`, not the assistant. Check: fixture `fx-dsp-07`: two workers of the role `assistant`,
