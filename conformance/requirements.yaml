  status: active
  text: >-
    The prompt cache is the provider's; the provider binding lists the cache control fields that are
    in the allowlist (GW-1) and where P4 itself sets the cache point: after the unchanging part of
    the request, the instruction and the tool catalog in a fixed order. The cache lives only inside
    the tenant's workspace (GW-3), and cache writes and reads are paid at the `ModelProfile` prices
    (BUD-9). Fixture: the second call of the same run reads the cache, and in its usage line the
