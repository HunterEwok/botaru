- id: MGR-42
  title: Tenant opt-out of the farm manager
  status: active
  text: >-
    The tenant's relation to the manager is one flag of its spec, `Tenant.spec.farm_manager.enabled`
    (D-77), true by default; seat attempts in T run on the seat profile from the farm charter
    (GOV-33). With `enabled: false` there is no manager in T: the core enqueues in T no seat tasks
    of any purpose (`manage`, `inspect`, `review`) and no `farm_manager` lens reviews, workers of
    seat roles are not enrolled in T, the reader role does not read the data of T, there is no seat
    memory in section T, T has no `manager` line and lint MGR-20 skips it; the holder's
    `control.apply` operations on targets of T, `service/control` and `monitor/script_run` on nodes
    of T and `manager.direct` directives in T are refused with `manager_disabled`; the incident
    message of T is kept only for the people of T, and `farm` operators see the incidents of T only
    as numbers in the daily summary; an incident of T does not stop the seat (GOV-22) and does not
    enter the escalation summary of T. A change of the flag is applied only through `apply` by an
    admin of T in one transaction: on turning off, running seat attempts in T are canceled with
    reason `manager_disabled`, the holder's holds in T live no longer than 15 minutes, and the
    waiting cards of its action requests in T close with `canceled(manager_disabled)`. `doctor` and
    `status` show tenants without a manager. Only the same `apply` can turn the manager back on.
  goal: G3
  check: [lint, blackbox, fixture]
  waivable: false
  version: v0.1
