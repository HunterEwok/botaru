- id: DLV-17
  title: Outgoing webhook sink
  status: deferred
  deferred: 2026-10-14
  reason: 'The pilot delivers to people and to the monitoring system; no outgoing webhook is needed. When it returns, its SSRF protection and signature stay mandatory.'
  return_when: 'A tenant needs to push results to an external program.'
  mechanism_removed: false
  text: >-
    An outgoing webhook is an E2 sink with `driver: webhook`. Its address is the manifest `base`
    exactly: an `https://` address whose host is not a farm host and not a loopback, private,
    link-local, shared or unspecified address, never taken from a task body or model text; lint
    rejects a webhook sink without such a base or without `signing_key_ref` (code
    `webhook_sink_invalid`). At every send the sink resolves the host itself, refuses the send as
    `dead` when any resolved address is a farm address or in those ranges, and connects only to an
    address it checked, so a changed DNS answer cannot turn the sink to the farm or its cloud
    metadata service. Each send is an HTTP POST of the delivery as JSON with the Standard
    Webhooks headers: `webhook-id` equals `delivery.id` (FEN-7), `webhook-timestamp` is the send
    time in seconds, and `webhook-signature` is `v1,<base64 HMAC-SHA256>` over
    `<id>.<timestamp>.<body>` with the deployment secret named by `signing_key_ref`. A 2xx answer
    completes the delivery; a timeout, 429 and 5xx are retried as delivery failures up to `dead`
    (DLV-3); any other answer is `dead` at once; redirects are not followed. A retry keeps the id
    and gets a new timestamp and signature. The body carries file references and metadata, never
    file bytes. The sink keeps no copy, so the core closes its erasure steps itself with
    `not_applicable` and basis `declared_none`.
  goal: G1
  check: [lint, fixture, blackbox]
  waivable: true
  version: v0.2
  profile: core
  decisions: [D-106, D-108]
  fixtures: [manifests/v02-retention, blackbox:delivery/webhook-send]
  doc: docs/tasks-and-delivery.md

- id: DLV-18
  title: Locale order and the answer language
  status: active
  text: >-
    From v0.2 the core chooses the language of a code text for each delivery in this order and takes
    the first value for which the installation has a catalog: the recipient's own `locale` (the
    principal's for a person or a private chat, the chat binding's for a group chat); for a delivery
    of a schedule task to the schedule's `deliver_to`, the schedule's `locale`; the tenant's
    `Tenant.spec.locale`; `en`. A key missing in the chosen catalog takes the `en` text of that key.
    Languages are the closed list `locale` of `spec/model/common.schema.json`; the skeleton ships
    only the `en` catalog, and catalogs of other languages are installation data (D-90). For an
    agent attempt the core writes `reply_locale` into the attempt work item of P1 `claim` with the language that the
    same order gives for the recipient of the task result (the initiator of a direct request, the
    chat of a group request, the schedule's addresses); the model does not choose it, and the core
    translates no model text and no argument value.
  goal: G6
