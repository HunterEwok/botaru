- id: ART-4
  title: File size limits with refusal
  status: active
  text: >-
    The size limits of one file (`max_file_bytes`) and of all files of one task
    (`max_task_files_bytes`) are set by `Tenant.spec.limits`; a tenant can only lower the farm
    ceilings from the deployment settings. A P1 `file.put` or P2 `kb.upload` above either limit gets
    `rejected(file_too_large)`: no file record is written and nothing is truncated. A write beyond
    `max_storage_bytes` gets `rejected(over_capacity)` (CAP-1).
  goal: G4
