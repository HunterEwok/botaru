- id: GW-15
  title: Provider retention and terms in the model profile
  status: active
  text: >-
    A `ModelProfile` has fields for retention at the provider: how many days the provider keeps
    requests and responses of this model (`provider_retention_days`, with a check date) and whether
    the model requires retention, that is, whether it is unavailable with zero retention
    (`requires_retention`). The allowed retention is set by `privacy.subprocessors[].retention` of
    the profile provider's entry in the tenant's privacy block: `{mode: standard, max_days: N}` or
    `{mode: zero}`. A profile with `provider_retention_days` above `max_days`, or with
    `requires_retention: true` for a provider with `mode: zero`, fails `apply` in this tenant's
    `models_allowed`, and P4 rejects a call on such a profile with `provider_config`. A profile also
    has provider terms fields with a check date: `provider_training` (whether the provider trains
    models on requests: `true` or `false`), `provider_human_review` (whether the provider's people
    read requests: `none`, `abuse_only`, `yes`) and `subprocessors` (the provider's own
    subprocessors for this model). What is allowed is set by `privacy.subprocessors[].terms` of the
    provider's entry (`training: false`, `human_review: none | abuse_only`), and every subprocessor
    of the profile must be in the tenant's `privacy.subprocessors`. A profile with
    `provider_training: true`, with `provider_human_review` above what is allowed, or with a
    subprocessor outside the list fails `apply` in this tenant's `models_allowed`, and P4 rejects a
    call on such a profile with `provider_config`. Fixture: a profile with `provider_human_review:
    yes` with `human_review: abuse_only` fails `apply`.
  goal: C6
  check: [lint, blackbox, fixture]
  waivable: false
  version: v0.1
  profile: core
  decisions: [D-36]
  fixtures: [lint:model/provider-terms-lint]
  doc: docs/models-and-money.md

- id: GW-16
