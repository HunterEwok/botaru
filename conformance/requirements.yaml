- id: INJ-7
  title: Code decides on alarms and incidents
  status: active
  text: >-
    Events `alarm.*` are produced only by the core and by workers of kind `job`. A task type with
    `alarm.*` in `events` does not declare inbox reading (`inbox.read`), does not accept artifacts
    of agent tasks and does not get, through a route, records with `dataorigin: model` or
    `untrusted: true`. A route to such a type from an agent event, or from a message type whose
    producers include `agent`, is rejected. Messages of the genus `state` do not produce alarms.
    External events, including monitoring system problems, live only in the `ext.*` namespace and
    never become `alarm.*` by themselves (ING-4, MON-5): whether to raise a farm alarm is decided by
    a route to a `job` worker that rechecks the condition in code. Farm alarms reach people only
    along the installation's one alarm path (MON-1), and only episodes of alarms raised by code go
    along it: numbers, `enum` values, tags and catalog ids. A bot note on a monitoring system
    problem (MON-7) does not acknowledge, close or silence the problem and does not change its
    severity. Only code opens an incident from an alarm; no bot creates, changes or hides incidents,
    their links to changes or alarms: code and people do that.
  goal: G4
  check: [blackbox, lint]
  waivable: false
  version: v0.1
  profile: core
  decisions: [D-59, D-62, D-63, D-64]
