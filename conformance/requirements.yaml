- id: COM-13
  title: The necessity lens and the `escalation` section of the commission manifest
  status: active
  text: >-
    From v0.2 the lens catalog `spec/model/lenses.yaml` contains the lens `necessity`. It assesses
    not proposals but only the bot escalations to the manager that code screening (MGR-6) left: code
    itself merges an escalation with a firing alarm or an open incident on the same subject and
    refuses one with a normal path, so the model sees only the borderline ones. The task is
    `review.escalation.v1` in the source tenant with the core key `system:necessity:<escalation>`
    (IDM-2); the executor is chosen as for other lenses (COM-7), and the review is paid from that
    tenant's `review` line (COM-6), except an escalation that MGR-6 screens at the farm's expense,
    which is paid from the `review` line of the tenant `farm`. The core builds the lens input as a
    data block with a mark (INJ-4): the closed fields of the escalation, evidence figures from code
    and the `untrusted` flag; the lens does not see the escalation's note. The output passes a
    closed schema: a score of 0-3 and a reason from a closed list (`evidence_below_threshold`,
    `covered_by_alarm`, `out_of_scope`, `plausible_risk`, `clear_risk`); `covered_by_alarm` means a
    farm alarm on the subject that reaches people along the installation's alarm path (MON-1) and
    that code screening did not match. Code computes the verdict under the `escalation` section of
    the commission manifest: an escalation is forwarded with a score of at least
    `forward_if_score_gte` (default 2), and an escalation with `untrusted` with a score of at least
    `untrusted_forward_if_score_gte` (default 3). Both thresholds can only be raised: lint at
    `apply` rejects a forward threshold below 2 or an untrusted threshold below 3
    (`escalation_threshold_lowered`). The `necessity` lens does not enter the proposal verdict, and
    the `farm_manager` lens does not assess escalations.
  goal: G6
  check: [lint, fixture]
  waivable: false
  version: v0.2
  profile: insights
  decisions: [D-18, D-23, D-62, D-63, D-114]
