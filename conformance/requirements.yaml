- id: INJ-6
  title: A plugin's network is closed by a list
  status: active
  text: >-
    A plugin's `network.egress` is empty or is a closed list of addresses from the tenant catalog;
    `*` is rejected. The only exception is the `monitor` plugin: its address `monitor-api` comes
    from the deployment description, not from the catalog, and it only reads (MON-6). The address a
    tool reaches on the network comes from the manifest or the catalog: the model has no URL or host
    argument. The list is enforced by the network of the plugin's container, not by its
    configuration (DEP-6, DEP-7).
  goal: G2
  check: [lint]
