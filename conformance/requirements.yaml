- id: IDN-1
  title: Only the core writes record fields
  status: active
  text: >-
    Only the core writes the record fields of a task and an attempt; the schema rejects a request
    that contains at least one of them. They are `tenant`; `initiator` and the attempt's initiator
    set (the initiators of everything it read); `origin`; `conversation`; `parent`, `root`, `depth`
    and the depth floor; `correlationid`; `max_tier`; `data_mark`; `untrusted_seen` with its source;
    `approval_id`; `continues`; `campaign` and `campaign_item`; `enqueued_by` together with
    `seat_epoch`, `incident`, `grant` and `takeover_of`; `scope`; `to_group`, `priority_class`,
    `fairness_key`, `pin`; `script_run` and `script_step`; `acting_bot` and `bot_epoch`; `trace`;
    the state and the attempt number. A field that appears in a later skeleton version is also
    written only by the core from the first day. Records of a bot identity, a seat, a case, an
    incident attribution, a proposal, an approval and any other subject of a human decision are
    created and changed only by the core.
  goal: G2
  check: [fixture, blackbox]
  waivable: false
  version: v0.1
  profile: core
  decisions: []
  fixtures: [blackbox:model/child-record-fields]
