- id: CAP-5
  title: Storage headroom
  status: active
  text: >-
    The core itself measures the free space of the store volume (C1) and keeps headroom for it.
    Below the soft threshold, enqueues of priority classes 3-5 get `rejected(over_capacity)`,
    and the free space figure is included in the P2 `health` response, which the monitoring
    system polls (MON-2), because a write to the store and the alarm export may already fail.
    The core also raises the alarm `alarm.store.free.low` by code in every installation; it goes
    to people along the installation's one alarm path (MON-1), and with profile `monitor` the
    farm template watches the same `health` number as a backstop in case the export fails. The
    incident class "low database volume" relies on this alarm (MGR-38). Below the hard
    threshold, P1 answers `not_ready` to everything except `heartbeat`, `complete`, `fail` and
    `release`; P2 and hold operations work; P2 `health` answers "not alive". The thresholds are
    set by the deployment binding, and the storage headroom is not part of any tenant's
    `max_storage_bytes`. Fixture with a mock space measurement: the soft threshold gives a
    refusal to a class 4 task and the alarm, the hard one gives `not_ready` on `claim`, and
    `complete` passes.
  goal: G4
  check: [blackbox, fixture]
  waivable: false
  version: v0.1
  profile: core
  decisions: [D-36, D-60]
  fixtures: []
  doc: docs/operations.md

- id: CAP-6
  title: Volume free space is read from the monitoring system
  status: active
  text: >-
    A volume is a disk of a resource from the tenant catalog that farm work writes to (for example
    `res:ctd1:data`), declared in `Catalog.spec.volumes`. The space limit of a volume is a quota of
    its file system, a sink or a pipeline set by the deployment, and the alarm on a filling disk
    comes from the monitoring system's template (MON-5); the core neither enforces quotas nor raises
    a disk alarm of its own for a volume. The core only reads the free space of each volume: a
    tenant observation series (an `ObservationSeries` with `source.kind: job`, a code series in the
    sense of GOV-28; `spec/model/core-series.yaml` has no core series for it) that a `job` role of the installation
    without a model slot writes on a code schedule from the monitoring system's history (the
    monitoring agent measured the number, no model takes part in the series), with a freshness
    check of the series (GOV-28). The job program that reads the history belongs to the
    installation, like any other `job` role; the core ships none. The `writers` of
    a volume with their `quota_bytes` record these quotas for the disk incident conditions of the
    manager (MGR-33). Without profile `monitor` there is no volume series, and the core's own store
    volume is guarded by CAP-5. Fixture: the free space series of a volume is written by a `job`
    role from the monitoring system history with `dataorigin: code`.
  goal: G4
  check: [fixture, blackbox]
  waivable: true
  version: v0.1
  profile: core
  decisions: [D-34, D-36, D-59, D-114]
  fixtures: [monitor/volume-quotas]
  doc: docs/operations.md

- id: CNT-1
  title: The continuation type comes only from git
  status: active
  text: >-
    A continuation is a task that the core enqueues on a trigger from the closed list
    `spec/model/continuation-triggers.yaml`: `reply` (end of a child task from `enqueue_child`),
    `campaign` (end of a campaign), `script` (end of a script step), and from v0.2 `timer` and
    `await`. The type and goal template of a continuation come only from declarations in git (the
    task type's `continuation`, the campaign's `then` from the role's `campaigns.then` list, a
    script step, `await.then` and `await.on_timeout`); the model can only pick a value from such a
    declared list, and model arguments and event data do not set the type. An action task after
    approval is not a continuation: the core enqueues it under APR-7.
  goal: G2
  check: [lint, blackbox]
  waivable: false
  version: v0.1
  profile: core
  decisions: [D-41]
  fixtures: [fx-cnt-01]
  doc: docs/tasks-and-delivery.md

- id: CNT-2
  title: A continuation in the trigger's transaction
  status: active
  text: >-
    A continuation is created in the same transaction as its trigger (DLV-2), with a key from the
    closed list of IDM-2: `system:cont:<trigger>:<source id>`, and for a script step
    `system:script:<run>:<step>` (SCR-8); a double trigger gives one task. If the continuation
    cannot be enqueued (the tree is canceled, the initiator is disabled or has lost the rights, the
    budget is exhausted, a hold on the scope), the core writes an event with the reason, and the
    person in `origin` gets a ready code text.
  goal: G1
  check: [blackbox]
  waivable: false
  version: v0.1
  profile: core
  decisions: [D-41]
  fixtures: [blackbox:core/continuation-same-tx]
  doc: docs/tasks-and-delivery.md

- id: CNT-3
  title: Inheritance for a continuation
  status: active
  text: >-
    A continuation copies the initiator, `origin` and conversation of the source; its parent is the
    task that ordered it (the asking task, the task proposing the campaign, the script step task);
    its depth equals the source's depth plus 1 and is no more than 5 (PRM-6); its mark equals the
    maximum of the participants' marks; `untrusted_seen` equals the OR over the participants
    (INJ-13). The core rechecks the initiator's rights at creation (PRM-3); on refusal there is no
    continuation, and the person gets a ready code text.
  goal: G2
  check: [blackbox]
  waivable: false
  version: v0.1
  profile: core
  decisions: [D-41]
  fixtures: [blackbox:core/continuation-inherit]
  doc: docs/tasks-and-delivery.md

- id: CNT-4
  title: An attempt never waits
  status: active
  text: >-
    An attempt never waits for a person, another task, a timer or an external event: a task has no
    states `input_required` and `auth_required`, and a plugin's `InputRequiredResult` counts as a
    call error (INJ-5). Waiting lives only in core records from a closed list: an approval, a
    deferred schedule run, a follow-up window (CNT-5), a campaign and a script run (its steps
    `confirm` and `action`, from v0.2 `wait` and `await`), and from v0.2 a waiting record for an
    event, a timer and a request for a model grant. A waiting task does not hold a lease. An attempt
    without progress for longer than its type's `timeouts.stall_after` ends with the reason
    `stalled`: the attempt is spent, the task is retried, the core raises the alarm
    `alarm.task.stalled`, and the monitoring system passes it to people (MON-1). Code computes the
    stall from core records, from the latest of three moments: the start of the attempt, the last
    finished P3 or P4 call (`done` or `error`), the last change of the progress field in
    `heartbeat`; a running call in `queued` or `leased` does not move the count, its deadline is
    held by the call's `start_by` (DLV-16) and the tool's `timeout_s`. Fixture
    `blackbox:core/stall`: an attempt sends `heartbeat` with the same progress and makes no calls
    for longer than `stall_after`, the outcome is `stalled`; an attempt with a call in `leased`
    lasting longer than `stall_after` but shorter than `timeout_s` is not counted as stalled.
  goal: G1
  check: [blackbox]
  waivable: false
  version: v0.1
  profile: core
  decisions: [D-41, D-62, D-71, D-80]
  fixtures: [blackbox:core/stall]
  doc: docs/tasks-and-delivery.md

- id: CNT-5
  title: A person's answer is linked by a reply
  status: active
  text: >-
    A clarification from a person is a new task in the same conversation. If the person replied to a
    bot message (the activity's `reply_to`), the core sets `continues: <previous task>` in the new
    task's record and adds it to `refs`, only if the conversation and tenant are the same and the
    person replying is the initiator of the previous task or has `task.read:<type>` and
    `data:<mark>` (PRM-9). The adapter gets the outcome of the previous task as an attachment block;
    if the previous task had `untrusted_seen`, it passes to the new one. Code sets the second
    linking method without a reply: when a task ended `completed` with a result whose closed field
    is `need_input: true` (a field with `x-botaru-read-by: code`, declared by the type), the core
    opens a follow-up window for the type's `followup_window_s` (default 1800 s; `0` turns it off)
    for the pair (conversation, initiator). An activity from the initiator in the same conversation
    within this window, without a command and without a reply, gets `continues` to this task and its
    type, like a reply; the window closes with the first such activity, at the end of the period or
    with a channel command, and a new result with `need_input` opens a new window. A reply always
    works. The code text under the bot's question says that the answer can simply be written within
    the window. Only the core sets the `continues` field. Fixture
    `blackbox:channel/followup-window`: a bot's question, a free answer after 5 minutes gives
    `continues`, after 40 minutes a new task without `continues`.
  goal: G6
  check: [fixture, blackbox]
  waivable: false
  version: v0.1
  profile: core
  decisions: [D-41]
  fixtures: [blackbox:channel/followup-window]
  doc: docs/tasks-and-delivery.md

- id: CNT-6
  title: Waiting for an event only from the type
  status: deferred
  deferred: 2026-10-14
  reason: 'The pilot starts with operations tasks; routes on events already react to events without a waiting task.'
  return_when: 'A task type needs to wait for an external event inside one task.'
  mechanism_removed: false
  text: >-
    Waiting for an external event is declared only in the task type: `await: {event, match, timeout,
    then, on_timeout}`. `event` is an event type of the events catalog; `match` is 1-5 pairs
    (`event_field`, `result_field`) that must all be equal, where the result field has
    `x-botaru-read-by: code` and the event field is a closed field of the event data schema (OUT-1);
    `timeout` is required and no longer than the farm ceiling (7 days by default). The core writes a
    waiting record in the transaction of `complete`. The first event of the same tenant that matches
    enqueues the `then` continuation (trigger `await`); the timeout enqueues `on_timeout` (trigger
    `timer`), or without it ends the record with the event `await.expired`. Each waiting record
    gives at most one continuation (CNT-2).
  goal: G1
  check: [lint, blackbox]
  waivable: false
  version: v0.2
  profile: core
  decisions: [D-41]
  fixtures: [schemas/valid/manifests/task-type-await, schemas/invalid/manifests/task-type-await, lint:manifests/await-fields, blackbox:model/await-match]
  doc: docs/tasks-and-delivery.md

- id: CNT-7
  title: An action task lives together with its write call
  status: active
  text: >-
    The task `action.<action>` is created in the transaction of the approval directly in `working`,
    with `approval_id`, the key `system:approval:<id>` and without an attempt or lease: its work is
    the single write call (APR-7). The call's outcome moves the task in the same transaction: `done`
    gives `completed` with a result from the closed fields of the plugin outcome; `error` (plugin
    error, `timeout_s`, `no_executor`, `plugin_unavailable`) and `denied(held)` give
    `failed(exec_failed)`; `exec_unknown` gives `failed(exec_unknown)`. The dispatcher filter, the
    `deadline` and `reaper` loops and the `start_by` check skip `action.*` tasks: they have no
    `claim`, no alarm `alarm.task.unclaimed` and no outcome `deadline_exceeded`, and their deadline
    is held by the action's `ttl` and the call's `timeout_s`. `task.redrive` is forbidden for them
    (DLV-4). Fixture `blackbox:core/action-task-lifecycle`: after `done` the task is `completed`,
    after `exec_unknown` the task is `failed(exec_unknown)`, and there is no alarm
    `alarm.task.unclaimed`.
  goal: G2
  check: [blackbox]
  waivable: false
  version: v0.1
  profile: core
  decisions: []
  fixtures: [blackbox:core/action-task-lifecycle]
  doc: docs/tasks-and-delivery.md

