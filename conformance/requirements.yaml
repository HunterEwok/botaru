- id: DEP-3
  title: Nobody is root
  status: active
  text: >-
    A bot never runs as root. The OS user of any farm process, plugin and container, set in the
    deployment description (DEP-10), is not root. No worker or plugin has sudo, a container runtime
    management group (`docker` and the like) or that runtime's socket, except the sandbox toolhost:
    it manages containers, that is, it equals root on its VM, so it does not share a machine with
    production data (DEP-1). A toolhost on a production machine does not start containers: its
    plugins run as a child process or in containers described in advance in the deployment, as DEP-7
    allows.
  goal: G2
  check: [lint, blackbox]
  waivable: false
