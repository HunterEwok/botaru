- id: KNW-6
  title: Corpus search is a word search
  status: deferred
  deferred: 2026-10-14
  reason: 'How the corpus search works inside belongs to the knowledge profile, not needed for operations tasks.'
  return_when: 'The knowledge profile enters the pilot.'
  mechanism_removed: false
  text: >-
    From v0.2 `kb_search` takes a corpus of the role's resource scope and a `query` in the format
    `search_query` (`kb-search-request`). The core splits the query into words by Unicode letters
    and digits, lowercases them, ignores words shorter than two characters and at most keeps the
    first 16; there are no operators, wildcards, regular expressions or phrase marks, and the core
    writes the query text into no answer, log or event. A fragment matches when it holds every word;
    matches are ordered by the number of word occurrences, then by file id and fragment number, at
    most `limit` (20) of them (`kb-search-response`). `kb_read` returns up to 20 fragments of one
    document from a fragment id in document order, only when the fragment's file belongs to the named
    corpus of the role's resource scope in the task's tenant; a fragment of another corpus or tenant,
    of a deleted file and a nonexistent one give the same `not_found`. Both answers carry the corpus
    trust (KNW-2).
  goal: G1
  check: [blackbox]
  waivable: true
  version: v0.2
  profile: knowledge
  decisions: [D-97, D-107]
  fixtures: [blackbox:knowledge/search-words]
  doc: docs/capabilities.md

- id: LCY-1
  title: Tenant lifecycle
  status: active
  text: >-
    A tenant is declared in git (`tenants/<name>/tenant.yaml`) and appears at `farmctl apply`;
    tenant operations are operator operations (PRM-14). A tenant goes through the states `active`,
    `suspended`, `offboarding`, `deleted` under the lifecycle `spec/lifecycles/tenant.md`.
    `suspended` is a hold on the scope `tenant` with the reason `suspended` and the effects
    `no_enqueue`, `no_claim`, `no_tool`, `no_action`, `no_delivery` (HLD-1); data is not touched,
    and deliveries get `withheld`, except messages to admins about the hold itself (HLD-3).
    `offboarding` (P2 `tenant.offboard`) sets an operator hold on scope `tenant` with reason
    `offboarding` and the effects of `suspended`, revokes the credentials of the tenant's workers
    and channels, forgets the tenant's provider key and stops using it (GW-3; revoking the key and
    the workspace at the provider is an operator step that `tenant.offboard` prints in its answer,
    D-103), revokes every connection of the tenant's people (SEC-7, reason `offboarding`; the
    consent adapter deletes the tokens and revokes them at the provider), and cancels pending
    approvals; only export is allowed. `deleted` (P2 `tenant.delete`, no earlier than the end of the
    export window: `export_window` of the `tenant.offboard` request, default and ceiling 30 days; an
    earlier `tenant.delete` gets `export_window_open`) creates an erasure request with the scope
    `(tenant)` across all stores (RET-7); the tenant id stays as a tombstone and is not used again
    (RET-3), and `apply` of a tenant with that name is rejected.
  goal: C3
  check: [blackbox]
  waivable: false
  version: v0.2
  profile: core
  decisions: [D-42]
  fixtures: [blackbox:core/tenant-suspend, blackbox:core/tenant-offboard-delete, blackbox:core/connections-revoke-bulk]
  doc: docs/operations.md

- id: LCY-2
  title: Tenant and principal export
  status: active
  text: >-
    Export of a tenant or principal is an operator P2 operation (`tenant.export`,
    `principal.export`, PRM-14) that enqueues a core task. The result is written only to the sink
    that the operator named for the export, in JSON Lines under the `spec/model` schemas with their
    `$id`, never to a chat and never to a model. A principal's export contains only the objects
    where they are the initiator and the objects that belong to them, and leaves out every object
    whose `personal_subjects` (AUD-5) name another principal; it goes only to that person (SEC-10).
    A tenant export leaves out the sessions and messages of private chats, the objects with a
    `personal_seen` source `connection` (data from a person's connection, SEC-7) and the connection
    records. A confirmed `/mydata export` request (SEC-11) enqueues the same principal export task to
    the sink named in `Tenant.spec.privacy.export_sink`, which must be an `export_only` sink with
    `recipient_ref: self`, encrypted with the public key the person supplied with the request
    (SEC-10). Declared objects are not exported: they are in git.
  goal: C6
  check: [blackbox]
  waivable: true
  version: v0.2
  profile: core
  decisions: []
  fixtures: [blackbox:core/export-jsonl, blackbox:core/mydata-export, manifests/v02-security-lints]
  doc: docs/operations.md

- id: LCY-3
  title: Principal lifecycle
  status: active
  text: >-
    A principal goes through `active`, `off`, `offboarded`. `/off` (a tenant admin) and P2
    `principal.offboard` cancel in one transaction their pending approvals (APR-6) and their
    non-terminal tasks (`canceled(person_inactive)`). From v0.1 `offboarded` cannot be left,
    offboarding deletes the links of their channel identities and creates an erasure request
    `(tenant, subject)` across all stores with their data (LCY-8, RET-7, D-98); from v0.2 it also
    publishes the event `principal.offboarded`, and only the opaque principal id stays in audit. A
    returning person gets a new principal without the old groups; there is no return window (D-100).
  goal: C6
  check: [blackbox]
  waivable: false
  version: v0.2
  profile: core
  decisions: [D-47, D-98, D-100]
  fixtures: [blackbox:core/principal-offboard]
  doc: docs/operations.md

- id: LCY-4
  title: Worker drain and removal
  status: active
  text: >-
    A worker in `draining` gets no new work and finishes the running work until `drain_deadline`. P2
    `worker.drain` carries the deadline; from it the heartbeat answer asks for release
    (`release_requested`), and a lease of a draining worker that expires after the deadline ends
    with `worker_drain` without spending an attempt. At `revoke` of a worker with `session:
    runtime_internal` or `memory: runtime_internal`, its profile store is cleared through the
    adapter (RT-1, RT-2) by an erasure request (RET-7).
  goal: G1
  check: [blackbox]
  waivable: true
  version: v0.2
  profile: core
  decisions: []
  fixtures: [blackbox:core/worker-drain-deadline, blackbox:core/worker-revoke-runtime-purge]
