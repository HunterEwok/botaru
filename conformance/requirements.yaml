- id: RET-3
  title: Tombstones keep uniqueness
  status: active
  text: >-
    Deletion does not release uniqueness. After a task is deleted a tombstone `(tenant,
    idempotency_key hash, task id)` remains, and the key stays taken while the tenant lives:
    repeating the key of a deleted task gets `gone`, not a new task (IDM-1). Ids of a tenant,
    principal, bot, task, `file_ref` and approval are not reused. A tombstone stores neither content
    nor a hash of an external id (an external channel id and a mail address can be found by brute
    force).
  goal: G1
  check: [blackbox]
  waivable: false
  version: v0.1
  profile: core
  decisions: [D-43, D-36]
  fixtures: [blackbox:core/tombstone]
  doc: docs/operations.md

- id: RET-4
  title: Erase operations in every port with content
  status: active
  text: >-
    Each port that stores content has an erase operation by scope `(tenant)`, `(tenant, subject)`,
    bot identity id and by a list of object ids: files in C1 `file.purge`; C3 `delete` (one session
    by id) and `purge` (by scope or id list); C4 `erase`; E1 `erase` for saved attachments and the
    cache; E2 `erase`; E4 `purge` through the runtime adapter (RT-1, RT-2); E5 `erase` at the
    monitoring adapter: scope `(tenant)` removes this tenant's items from the monitoring system;
    scope `(tenant, subject)` answers `not_applicable`, because notes carry no personal data (class
    `summary` and redaction, MON-7); for a list of note ids the binding can answer `failed` (if the
    monitoring system API does not delete notes), and the binding sheet declares this in advance:
    such a result is recorded honestly, but it does not keep the request open (RET-7). Each
    operation returns the result `done`, `failed` or `not_applicable`, and the core writes it into
    the erasure request (RET-7); `not_applicable` is accepted only with a `basis` attribute. An
    `erase` work item to an edge store carries the principal's `needles` (external identities,
    addresses, display name), and the core keeps them until the end of the erasure request; C1
    deletes task content with the operation `task.purge`, leaving a tombstone; a channel that
    declared `driver.stores_content: none` closes its step with that declaration (D-86 (8)). The
    adapter of each such port passes the `erasure` suite. Already from v0.1 the following apply: C3
    `delete` and `purge`, C4 `erase` (MEM-4), E4 `purge` for a runtime with `runtime_internal`
    (RT-1, RT-2), C1 `file.purge`, E2 `erase` and E5 `erase`: deletion of a person's data at their
    request is part of v0.1 and cannot be waived for a `kind: production` tenant (D-76, SEC-11). E1
    `erase` and `match` and E4 `purge` for the other runtimes are added in v0.2 (RET-11). Until a
    store with content has its own erase operation, it answers an erasure request with `failed`, and
    the request stays open with an alarm (RET-7).
  goal: C6
  check: [adapter, blackbox]
  waivable: false
  version: v0.1
  profile: core
  decisions: [D-66, D-76]
  fixtures: [blackbox:core/erasure-v01-ports, erasure/erasure]
