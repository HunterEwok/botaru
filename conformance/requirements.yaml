- id: GOV-41
  title: Who answers for a link
  status: active
  text: >-
    Only real reviews of seat holders in the current seat epoch count; reviews of fallback roles and
    shadow reviews never count. A review is "against" when it is a veto or has a score of 1 or less,
    and "for" otherwise; a missing or invalid review of a holder counts both as "against" and as
    "for", and as a missed forecast. For a confirmed link to a rejected proposal (GOV-40) the
    holders who were against answer, except a veto: a veto does not count against its holder. Nobody
    answers when people themselves rejected the proposal: the blind sample answer "Would not
    accept", or "Decline" with the reason `too_risky`, `not_applicable`, `wrong_data`,
    `already_done` or `duplicate`; when the proposal expired with people or was declined with
    `not_now` or `too_expensive`, nobody answers either; when people answered "Would accept" but did
    not lift the veto, the holders answer. For a confirmed attribution to a recommended change
    (GOV-13) the holders who were for it answer, but only those whose lens has the incident class's
    `area` in its `accountable_for` (`spec/model/lenses.yaml`): `security` for `security`,
    `operational` for `operational`, `cost` for `cost`; the lenses `value`, `speed`, `clarity`, the
    tenant lenses (COM-19) and the farm manager do not answer. A proposal of the farm manager seat holder, a proposal with `untrusted_seen` and an
    incident with an external cause never make anyone answer. The farm manager is never unseated
    this way (D-33); its being against is shown on the card and in the holder report (MGR-50).
  goal: C1
  check: [fixture, blackbox]
  waivable: false
  version: v0.3
  profile: governance
  decisions: [D-109]
  fixtures: [blackbox:governance/against-and-for]
  doc: docs/improvements.md

- id: GOV-42
  title: "A member who answers for a link returns to the functionaries, and promotion from v0.3"
  status: active
  text: >-
    With `commission.accountability: on` a holder who answers for a confirmed link (GOV-41) leaves
    its seat in the transaction of the person's "Yes": the seat becomes vacant (epoch + 1, running
    attempts of the seat end with `seat_changed`), the bot is not retired but parked (`parked` in
    the bot record: since, role, seat), and the operators get the notice `seat_parked_notice` with
    the command to enroll a worker of its former role. `doctor` shows parked bots and how long they
    wait. A new worker of that role is bound to the longest-waiting parked bot only with the
    operator's confirmation (`farmctl worker enroll --bot`); a parked bot is not retired as
    `worker_gone`, and after 180 days without a worker it retires with `parked_expired` (IDN-15).
    Its memory and track record stay; the departure record is visible only to people; its verified
    facts are offered as copies to the next holder of the seat until 30 days after the departure
    (MEM-7). At most one such departure per tenant in 30 days: the other confirmed cases are
    recorded, shown to people and wait in order; the last holder of a veto lens never leaves this
    way. A vacant seat is covered by the fallback role (COM-7) and gets the usual notice with
    `farmctl seat assign`. If people later dismiss the incident as false, the link is canceled; if
    the seat is still vacant the operators get the notice `seat_return_notice` with the command to
    return the bot, otherwise the bot is placed at the head of the promotion queue without the
    cooldown and without `min_tenure`; the new holder is not removed. The promotion trigger, the
    queue, the case opening and eligibility follow GOV-14 with three additions. A bot that left a
    seat for a confirmed link gets no trigger and no case for 180 days from the departure: its
    earlier queue entry is removed at the departure, the next success after the 180 days creates a
    new entry, and its tenure for `min_tenure` counts from the departure; the 60-day newcomer
    protection (`protect_new`) does not shield a holder from leaving for a link. A resubmitted
    proposal (PRP-24) gives the trigger to its new author. A case of a tenant with
    `commission.accountability: on` frees a seat by accuracy (GOV-43).
  goal: C1
  check: [blackbox]
  waivable: false
  version: v0.3
  profile: governance
  decisions: [D-24, D-26, D-27, D-28, D-109]
  fixtures: [blackbox:governance/unseat-park, blackbox:governance/unseat-pace, blackbox:governance/unseat-false-alarm, blackbox:governance/cooldown-after-unseat]
  doc: docs/improvements.md

- id: GOV-43
  title: Code proposes who leaves when a newcomer enters
  status: active
  text: >-
    When a promotion case needs a seat freed (GOV-14) and the tenant has `commission.accountability:
    on`, code proposes the leaver: the holder in L (GOV-12) with the worst accuracy (COM-17). A
    holder with fewer scored forecasts than `commission.accountability_min_forecasts` (GOV-36)
    counts with the median of its lens, unless it has held the seat for more than `min_tenure` plus
    90 days with fewer, then it counts as the worst. A holder protected by a reward (COM-18) is not
    proposed, unless nobody else is in L. When the two worst are tied (COM-17), code proposes
    nobody, and the person chooses among the tied seats. When no holder in L has enough scored
    forecasts, or the mode is `shadow`, code proposes nobody, and the person chooses from L
    (GOV-12). The card marks the proposed seat and shows the figures and the accuracy of every seat
    in L; "Confirm" makes the proposed holder leave, and a person who disagrees answers "Not now"
    (GOV-31). When the proposed holder is the only holder of a veto lens with enough scored
    forecasts, the card carries the flag `evicts_only_scored_veto` (GOV-19). The outcome takes
    effect only after the person's button (GOV-9).
  goal: C1
  check: [fixture, blackbox]
  waivable: false
  version: v0.3
  profile: governance
  decisions: [D-25, D-109, D-115, D-116]
  fixtures: [blackbox:governance/accuracy-leaver]
  doc: docs/improvements.md

