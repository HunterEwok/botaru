- id: PRP-3
  title: Exactly one change from the allowlist
  status: active
  text: >-
    `change` is of exactly one kind: `none`, `action_request`, `script`, `manifest_change` or
    `human_change` (PRP-13). `action_request` and `script` pass the schema and lint the same way as
    in a real enqueue, and only within the vocabulary of the author role; `script` only within the
    `scripts` section of the author role with `propose: in_proposal`, and after "Accept" the run
    passes the same acceptance (SCR-5) and the same approval (SCR-6) on behalf of the person who
    accepted. `manifest_change` contains only `set` operations on fields from the allowlist
    `spec/model/proposable-fields.yaml` (the skeleton sets the list, a tenant can only narrow it) or
    `create_from_template` from a template in git, no more than 10 operations. A change of
    permissions, groups, tools, addresses, models, budgets upward, budget lines, retention periods,
    the commission, the charter and seats (`Seat`), incident classes (`IncidentClass`), involvement
    rules, `control-ops.yaml`, the manager's limits and safeguard, consent groups, the protected set
    (MGR-32), the `farm-manager` role, the `farm-manager-ops` group, observation series, farm nodes
    and templates in the monitoring system (`deploy/monitor/`, MON-4) and the monitoring problem
    class table (MON-5) is rejected with `rejected(forbidden_change)`; a proposal about permissions
    and security is possible only with kind `none` and category `security`. Targets from the
    tenant's protected set (MGR-32: types and schedules that it names or that carry `proposable:
    false`, roles from incident classes and workers with a task of a protected type) are proposed
    only with kind `none`; the only exception is shifting the window of a backup schedule by a
    guarded field (PRP-12). For schedules `spec.paused` is proposed only with kind `none`, and
    `spec.cron` only as a window shift without lowering the frequency by more than 2 times; catalog
    labels that selectors, the dispatcher or involvement rules read are not proposed. The card and
    the patch show with code the frequency before and after and the affected alarms. Starting,
    stopping and restarting a service on a machine are proposed with kind `action_request` with the
    tool `service/control` (a service from the tenant catalog, a verb from its `control`), and a
    monitoring system script with kind `action_request` with the tool `monitor/script_run`, if the
    author role has the permission on that service (`service_control`) or on scripts
    (`monitor_scripts`); "Accept" creates an approval of this call on behalf of the person who
    accepted, and the MON-8 and MON-10 guards apply to its execution. Without such a permission, and
    for a proposal with `untrusted_seen` (PRP-11, INJ-15), they are proposed only with kind `none`.
  goal: G2
  check: [lint, fixture]
  waivable: false
