- id: SEC-2
  title: Each process gets only its own secrets
  status: active
  text: >-
    Each process gets only the secrets named in its manifest or in the deployment description
    (DEP-10). A secret is passed as a file into the container of this process, not as an environment
    variable, and does not sit on a volume that another process sees.
  goal: G2
