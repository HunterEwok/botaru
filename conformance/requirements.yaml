- id: IDN-8
  title: Bot identity and `acting_bot` in records
  status: active
  text: >-
    A bot identity (`Bot`) is a core record: a permanent id `bot_<ulid>`, a tenant, a role and a
    binding to a worker or seat with an epoch. Only the core issues the id and never reuses it; the
    identity's tenant comes from the credentials at creation and does not change (TEN-1). Every
    attempt, model call, usage line, proposal, review, fact, message record in the store (the
    sender's bot identity; the field is not part of the message envelope) and audit record carries
    `acting_bot` and the binding epoch `bot_epoch`; only the core writes these fields. The task
    body, parameters, a message and model output do not set or change the identity. The fields
    `acting_bot` and `bot_epoch` are in the record schemas from v0.1 and are empty in records made
    without a bot identity.
  goal: G5
  check: [fixture, blackbox]
  waivable: false
  version: v0.1
  profile: governance
  decisions: [D-19, D-80]
  fixtures: []
  doc: docs/bots.md

- id: IDN-9
  title: Identity and position grant no permissions
  status: active
  text: >-
    An identity, a position, a seat, a persona and a track record grant no permissions. The input of
    the C2 permission check (`authorize`) does not contain them, except narrowing by a hold on the
    scope `bot`; an attempt's permissions are the worker role's permissions ∩ the permissions of the
    initiator's groups. A position changes exactly three things, all through the core: the persona
    (GOV-4), the model rank ceiling (GOV-3) and admission to the review tasks of its seat's lens
    (COM-7); none of them is part of the permission check. Fixture: the `authorize` permission table
    is the same for an identity of any position.
  goal: G2
  check: [fixture, lint]
  waivable: false
  version: v0.1
  profile: governance
  decisions: [D-40]
  fixtures: [gov-fx-05]
