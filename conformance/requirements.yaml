- id: BUD-17
  title: A second price tier for a long input
  status: active
  text: >-
    A model profile may give a second price tier `price.above` for a provider that bills every
    token of a call with a long input at a higher price: a call whose input tokens, cache write and
    read included, are above the tier's `input_tokens` is priced by the tier in all its lines, and
