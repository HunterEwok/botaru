- id: INS-4
  title: Analysis frequency and merge window
  status: active
  text: >-
    A role in a tenant has no more than `insight.max_runs` scheduled analysis runs per period, no
    more than `insight.max_event_runs` runs from events (default 1 per day; they do not spend a
    schedule slot); the limit on open proposals of a role is `insight.max_open_proposals` of PRP-5,
    where the states `screened`, `in_review`, `recommended`, `presented` and `parked` count as open.
    Within the merge window `insight.merge_window` there is no more than one analysis of the role,
    and a route from the events `alarm.*` and `obs.*`, including from alarms on monitoring system
    problems (MON-5), starts analysis only through this window (debounce). The window is no shorter
    than 1 hour (default 1 hour): a manifest with a smaller value fails `apply`. When exceeded, the
    schedule slot or route is skipped with an event, and the model is not called.
  goal: G3
  check: [lint, blackbox]
  waivable: false
  version: v0.1
  profile: insights
  decisions: [D-16, D-63, D-71]
  fixtures: [ins-05]
