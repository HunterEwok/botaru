    only types of purpose `inspect`; of tools only read tools (`access: read`) and the built-in
    `file_read` by `file_ref`; output only findings `manager-finding/v1`; MGR-25 limits what the
    role can read; there are no control operations, `actions_may_request`, `may_enqueue`,
    `campaigns`, `scripts`, `messages` and no memory. The built-ins `escalate` and
    `request_model_grant` (from v0.2) are available only to profiles `worker` and `manager`, and
    `propose_script` only to profile `translator`. In `insight` tasks profiles `worker` and
    `manager` get only `observations_query` of the built-ins (INS-1, OBV-3); `skill_read` (from
