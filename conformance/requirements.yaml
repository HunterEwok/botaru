- id: DEP-8
  title: Only the core has the store
  status: active
  text: >-
    Only core processes have credentials and a network path to the farm store. `farmctl` on the core
    machine with the core's credentials is part of the core: when the core process is not running,
    it writes a hold to the store itself (HLD-1). Workers of any kind (`agent`, `job`, `toolhost`,
    `channel`, `sink`), runtimes, pipelines and plugins talk to the farm only through ports; a `job`
    worker gets the numbers for reports through a closed query of its tenant's rollups, P1
    `obs.query` (OBV-3). Fixture: a connection to the store from a `job` worker container is
    rejected.
  goal: G2
  check: [lint, blackbox]
  waivable: false
  version: v0.1
  profile: core
  decisions: [D-36]
  fixtures: [blackbox:core/job-no-store]
