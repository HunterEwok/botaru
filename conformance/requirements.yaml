- id: MAN-2
  title: apply converges to the desired state
  status: active
  text: >-
    `apply` brings the store to the set from git: repeating the same set changes nothing. `apply
    --dry-run` shows the plan without writing. An object that disappeared from git is not deleted
    silently: `apply` shows it together with its dependents, and only an explicit command deletes
    it.
  goal: C1
