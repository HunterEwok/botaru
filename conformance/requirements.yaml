- id: DEP-4
  title: A narrow OS mechanism executes an action
  status: active
  text: >-
    A write action is executed by a narrowly configured OS mechanism, not by a shell or sudo. The
    manifest of an action or write tool names the executor in one form: the plugin, its write tool
    and `os_mechanism`. There is one `os_mechanism` schema, with two kinds. `oneshot`, with the
    fields `unit`, `started_by` and `wait`: a oneshot unit of the request parser, owned by root, is
    started by the path unit `started_by`; the parser takes run request files from the queue, checks
    them strictly and queues the run; `wait` equals `false`, the outcome of the write call is
    "accepted for run" with the run id, and the end of the work is reported by the worker event
    `job`. `unit`, with the fields `unit_from`, `verb_from` and `wait`: the OS mechanism allows the
    OS user of this tenant's action toolhost exactly the `control` verbs of a service on the exact
    unit names from the tenant catalog (`services[]` with `via: host`); the unit name and the verb
    come from the catalog by the arguments `service` and `verb`, not from the model; `wait: true` is
    allowed if the operation fits within the write tool's `timeout_s`. `apply` generates the OS
    mechanism rule from the catalog, and the deployment lint and `farmctl doctor` compare the rule
    on the machine with the catalog; how the rule is built is described by the OS mechanism binding
    in `spec/bindings/os/`. Patterns and wildcards in unit names, verbs other than `start`, `stop`,
    `restart`, and units of farm services (core, workers, toolhost, adapter) are forbidden in the
    rule. The units, queues and paths that the farm sets up for the `oneshot` executor are separate
    for each tenant and contain its name: in a shared action manifest, `{tenant}` stands in place of
    the tenant. The executor's OS user is separate for each tenant and is set in the deployment
    description (`os_users`, DEP-10), not in the shared manifest (TEN-6).
  goal: G2
  check: [lint, blackbox]
  waivable: false
  version: v0.1
  profile: core
  decisions: [D-67, D-68, D-80]
  fixtures: [blackbox:toolhost/os-rule-from-catalog, blackbox:toolhost/os-rule-other-unit, blackbox:toolhost/os-rule-other-user]
  doc: docs/permissions.md

- id: DEP-5
  title: A runtime without keys or extra paths
  status: active
  text: >-
    The agent's worker token is held by the runtime adapter (E4). The runtime, if it is a separate
    process, has no provider key and no worker token; its config is read-only; it has no container
    runtime socket and no host volumes; its network reaches only P3, P4 and its own adapter; it has
    no network path to another runtime; there are no fallback providers.
  goal: G2
  check: [blackbox]
  waivable: false
  version: v0.1
  profile: core
  decisions: []
  fixtures: []
  doc: docs/permissions.md

- id: DEP-6
  title: A plugin without inbound paths
  status: active
  text: >-
    A toolhost has no inbound port. A plugin in a container accepts a connection only from its
    toolhost, with authentication (a token or a unix socket), and is not reachable from the agents'
    network. A plugin's network egress is enforced by its container's network and is counted per
    tenant. A plugin image is pinned by digest.
  goal: G2
  check: [lint, blackbox]
  waivable: false
  version: v0.1
  profile: core
  decisions: []
  fixtures: []
  doc: docs/permissions.md

- id: DEP-7
  title: Only an own plugin runs as a child process
  status: active
  text: >-
    On a production machine, only an own plugin runs as a child process of the toolhost: code from
    the implementation repository that passed review, without secrets and with an empty
    `network.egress`. A plugin with a secret, with network egress, or a third-party MCP server runs
    in its own container, described in advance in the deployment, with its own OS user and its own
    network, which holds only its toolhost and its closed list of addresses. The toolhost's own
    network leads only to P1 and to the containers of its plugins. Toolhosts of different tenants
    run as different OS users; a plugin's OS user is set for each tenant in the deployment
    description (DEP-10), not in the shared plugin manifest (TEN-6).
  goal: G2
  check: [lint, blackbox]
