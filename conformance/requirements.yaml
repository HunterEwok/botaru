    for a person with the capability `proposal.override_veto:<category>`; the core accepts it only
    if this person opened "Details" of the card (APR-14); it writes an audit record, sets
    `veto_overridden` on the proposal and creates an object on the ordinary path, the same as
    "Accept". A proposal with a lifted veto gives the author no credit and creates no promotion
    trigger; the trial of its change goes as usual.
