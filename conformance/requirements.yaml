- id: GW-1
  title: The model request matches the catalog and the allowlist
  status: active
  text: >-
    P4 rejects a model request if its `tools` differ from the P3 catalog of this handle in names and
    schema hashes; if it contains the provider's server-side tools, `mcp_servers` or `container`; if
    it contains a processing region field (only P4 sets it, GW-14); or if it contains any field
    outside the allowlist of the provider binding `spec/bindings/model-providers/<provider>.md`.
    Fields that the binding names as dropped (in the reference binding `metadata`, in the schema
    `x-botaru-dropped: true`) P4 accepts and removes before calling the provider; this is not a
    refusal (D-87 (4)). A runtime that added a built-in tool fails at the gateway. The catalog of a
    translator handle consists of a single `propose_script` (PRF-1), so a translator request with
    any other tool is rejected.
  goal: G2
  check: [blackbox]
  waivable: false
  version: v0.1
