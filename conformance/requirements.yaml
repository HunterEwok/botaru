- id: RET-5
  title: A backup is part of the production perimeter
  status: active
  text: >-
    A backup stores content and follows the rules of a production machine (DEP-1): it is encrypted,
    accessible only to the operator and stored off the core machine. There are two possible places
    for backups (D-88): a separate farm machine (`backup1` from `farm_hosts: [core1, backup1]`,
    DEP-11) or, in a single-server installation without a second machine, an external store
    (`backup.target: external` of the deployment description). A backup goes to the external store
    encrypted on the core machine before sending, with the key `backup.key_ref`, which the external
    store does not have; the store credentials can only write new objects and cannot delete existing
    ones. For a production installation without a second machine, encryption and the external store
    are mandatory: deployment lint rejects backups without a separate machine that lack
    `backup.target: external`, `encrypted: true` or `key_ref` (code `backup_external_required`). The
    lifetime of any backup is no longer than the longest period of class `content` plus the backup
    loop window, so deleted data leaves the backups by itself. The erasure log (erasure requests and
    tombstones, metadata only, RET-7) is backed up separately from the store backups and no less
    often than they are.
  goal: G4
  check: [lint, fixture]
  waivable: false
  version: v0.1
  profile: core
  decisions: [D-36, D-88]
  fixtures: [manifests/deploy]
  doc: docs/operations.md

- id: RET-6
  title: Restore from backup
  status: active
  text: >-
    After the store is restored from a backup and before the core is ready: (a) the store epoch
    grows, and all work and all handles of the previous epoch get `fenced`; (b) all waiting
    approvals (`pending`) move to `canceled(restored)` with `card_update`; an approval in
    `executing` whose write call was in `queued` or `leased` gets `exec_unknown` together with it,
    and actions are not repeated (APR-7); (c) the erasure log is replayed from its separate backup,
    including manual deletions through `farmctl` (RET-7); (d) P1 `claim` and `enqueue` answer
    `not_ready`, and P4 starts no model calls; (e) the core does not become ready until the usage
    gap since the backup is filled in with `spend_reconciled` lines from the provider report
    (BUD-10), or the operator completes the restore with the P2 operation `restore.complete
    --spend-pending`: the core becomes ready, the usage gap is marked open, code raises the alarm
    `alarm.spend.unreconciled` (`warn`), and the daily limits of all tenants are cut in half until
    the provider report is reconciled (`spend.reconcile`); after reconciliation the alarm moves to
    `resolved` and the limits return. The restore is completed by P2 `restore.complete` or by the
    core itself, if at start it sees that the separate backup of the erasure log is ahead of the
    store. Fixture: the backup was taken while an approval was pending, before its decision and
    before `forget`; after the restore the approval is `canceled(restored)`, the memory record is deleted again, and the old token gets
    `fenced`; `restore.complete --spend-pending` gives readiness, the alarm
    `alarm.spend.unreconciled` and a halved daily limit, and `spend.reconcile` removes both.
  goal: G2
  check: [blackbox]
  waivable: false
  version: v0.1
  profile: core
  decisions: [D-36, D-80]
  fixtures: [restore/, blackbox:core/restore, blackbox:core/restore-spend-pending]
  doc: docs/operations.md

- id: RET-7
  title: Early deletion only through the erasure log
  status: active
  text: >-
    Any early deletion, that is deletion before the retention class period ends (`forget`, person
    offboarding, erasing the data of a retired bot, tenant deletion, cleaning a runtime store when a
    worker is decommissioned, a person's request, manual deletion by an operator through `farmctl`),
    goes only through an erasure request (`ErasureRequest`). A request is a recorded object: scope,
    reason, author, time and a result for each store (`done`, `failed`, `not_applicable`). The scope
    is from a closed list: `(tenant)`, `(tenant, subject)`, a bot identity id (all its sealed data,
    only reason `bot_retired`), a worker id (the store of its runtime, only reason `worker_revoke`)
    or a list of object ids. The reason is also from a closed list: `forget`, `offboarding`,
    `bot_retired`, `tenant_delete`, `worker_revoke`, `subject_request`, `manual`. One request can
    name many ids: this is how a confirmed `erase_match` deletes all objects found (SEC-11). The
    core enqueues `bot_retired` requests: in the identity retirement transaction, for its sessions
    inside the runtime (`runtime_internal`) as a list of their ids, and E4 `purge` deletes them; at
    the end of `seal_ttl` (the `identity` loop), for all sealed data with the bot identity id as
    scope (MEM-9). The request enters the erasure log before the first byte is deleted. The
    `erasure` loop sends the request to the stores and collects the results; while at least one
    store is neither `done` nor `not_applicable`, the request is open, and at its deadline it gives
    an alarm by code; the only exception is `failed` from E5 for a list of note ids (RET-4): a note
    carries no personal data, and such a result does not keep the request open. Deletion of a
    person's data at their request is part of v0.1 and cannot be waived for a `kind: production`
    tenant (D-76). No process and no `farmctl` command has a direct deletion of content bypassing
    the request. Fixture: an operator deletes a principal's data through `farmctl` after a backup
    was taken; after restoring from that backup the data is deleted again.
  goal: C6
  check: [blackbox]
  waivable: false
  version: v0.1
  profile: core
  decisions: [D-12, D-36, D-76]
  fixtures: [restore/, blackbox:core/restore, erasure/erasure]
  doc: docs/operations.md

- id: RET-8
  title: Backup reports, with core alarms only without the monitoring system
  status: active
  text: >-
    An external backup process takes and checks backups. After each store backup, each erasure log
    backup and each restore check it calls P2 `backup.report {kind: backup | restore_check,
    started_at, finished_at, ok, size, location_id}` with its narrow key (an operator operation,
    PRM-14); `location_id` is the id of the backup location from the deployment configuration,
    without paths and addresses. At least once a week the backup process or the operator restores a
    fresh backup on a separate test bench (in a single-server installation this is a temporary VM or
    a machine outside the farm, D-88), which follows the same rules as the backup (RET-5), runs the
    `restore/` check set and P2 `doctor` on it and reports with `backup.report {kind:
    restore_check}`. In every installation `doctor` shows the age of the last backup of each
    location and the result of the last check, and fails the check if the erasure log backup is
    older than the store backup (RET-5). In an installation with profile `monitor` the monitoring
    system watches the backup age and the restore check result from the output of the backup tool
    with the farm template, and the core raises no backup alarm. In an installation without profile
    `monitor` the `health` loop counts from the latest reports: no `backup` report with `ok: true`
    for a location for longer than 26 hours gives the alarm `alarm.backup.overdue` (`warn`); no
    `restore_check` report with `ok: true` for longer than 8 days gives the alarm
    `alarm.backup.restore_check_overdue` (`warn`); a report with `ok: false` gives the same alarm at
    once. Fixtures, without profile `monitor`: a mock clock without a `backup` report for 26 hours
    gives `alarm.backup.overdue`; a `restore_check` report with `ok: false` gives
    `alarm.backup.restore_check_overdue`; a `backup` report with a fresh store backup and an old
    erasure log backup fails `doctor`.
  goal: G4
  check: [blackbox]
  waivable: true
  version: v0.1
  profile: core
  decisions: [D-36, D-88, D-114]
  fixtures: [restore/, blackbox:core/backup-report]
  doc: docs/operations.md

- id: RET-9
  title: Tenant retention periods
  status: deferred
  deferred: 2026-10-14
  reason: 'The default retention periods (RET-2) are enough for the pilot.'
  return_when: 'A tenant needs retention periods other than the defaults.'
  mechanism_removed: false
  text: >-
    From v0.2 a tenant sets its retention periods in `Tenant.spec.retention`: `classes` for the
    classes that have `ceiling_days` in `spec/model/retention-classes.yaml` (`content`, `memory` and
    `metadata`), `files` (the file period) and `journals` (the attempt journal period, AUD-4). A
    class period lies between `min_days` and `ceiling_days` of its class (`content` 1 to 400 days,
    `memory` 30 to 3650 days, `metadata` 93 to 3650 days); `files` and `journals` are not longer
    than the tenant's `content` period. Lint rejects anything else with `retention_period`. A field
    the tenant leaves out takes the class default; `memory` without a tenant period lives until
    `forget` or an erasure request, `tombstone` has no period, and `observation` keeps its own
    periods (OBV-4). When a file is written the core sets `expires_at` to the write time plus the
    smaller of `retention.files` and the type's `result_ttl` if the file became a result (ART-1). A
    shorter period of `content`, `memory`, `files` or `journals` applied later reaches objects
    already stored at the next loop run; a shorter `metadata` period applies only to records written
    after the `apply` that set it, so a manifest change never deletes audit, decisions or spending
    already written (AUD-3, D-108); a longer period never extends an object that has already
    expired.
  goal: C6
  check: [lint, fixture, blackbox]
  waivable: true
  version: v0.2
  profile: core
  decisions: [D-106, D-108]
  fixtures: [manifests/v02-retention, blackbox:core/retention-periods]
  doc: docs/operations.md

- id: RET-10
  title: Deletion by period in every copy
  status: active
  text: >-
    From v0.2 the `retention` loop deletes objects of every class with a period (RET-9) no later
    than 24 hours after the period ends, without an erasure request, and in every copy the farm
    keeps: C3 entries with `prune`, files after `expires_at` with C1 `file.purge` together with
    their corpus fragments (KNW-5) and cached tool output (PRM-12), attempt journals (AUD-4), task
    content with `task.purge` leaving a tombstone (RET-3), and the sessions of a runtime with
    `session: runtime_internal` through E4 `purge` by their ids. `metadata` and `observation` are
    deleted only in whole calendar months, never by editing a row (AUD-3); the only edit is the
    anonymization of usage lines (BUD-16). After a restore the loop deletes what is overdue again.
    Fixture: after the tenant period a canary is found in no store, including the corpus index, the
    tool cache and the runtime; a `metadata` record of the same age stays until its month ends.
  goal: C6
  check: [blackbox]
  waivable: false
  version: v0.2
  profile: core
