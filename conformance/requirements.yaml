- id: DLV-1
  title: At least once, no silent losses
  status: active
  text: >-
    Every task and every delivery is handed out at least once and ends in a terminal state with an
    event; there are no silent losses. A tool call is not handed out again: a read whose lease is
    lost returns an error to the model, and a write follows APR-7. A `monitor_script` delivery is
    handed out at most once: a lease that expired without an outcome ends it with `dead` and the
    reason `exec_unknown`, with no retry (MON-10).
  goal: G1
