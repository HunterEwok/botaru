- id: GOV-36
  title: Accountability runs in shadow until people switch it on, without retroactive effect
  status: active
  text: >-
    The first `apply` of a tenant on a core that claims v0.3 writes the audit record
    `governance.v03_enabled`; its time is `governance_v03_since`, shown in P2 `commission.status`.
    Only reviews written after it are scored (COM-16), only proposals with a commission verdict
    after it can be linked to an incident (GOV-38), only recommendations after it count for GOV-41,
    and only script runs confirmed after it can be linked (TRN-7). Forecasts are scored from this
    time, not from `accountability_on_since`. Records of v0.1 and v0.2 keep their schemas and are
    not rewritten (D-98). The tenant charter field `commission.accountability` is `shadow` (the
    default) or `on`. In `shadow` code finds the cases of GOV-38 and GOV-41, computes forecast
    scores and accuracy (COM-16, COM-17) and shows them only to people, in P2 `commission.status`
    and in the weekly commission summary; no link card is sent (a person may still confirm a link
    through P2, and this goes only into the statistics), nobody leaves the commission for a link or
    by accuracy, nobody gets a reward or protection (COM-18), and a person chooses who leaves for a
    newcomer (GOV-12). Forecasts, resubmission and the new reviewer input work in `shadow` too. When
    every commission seat of the tenant has a holder and every holder has at least
    `commission.accountability_min_forecasts` scored forecasts (a field of the tenant charter:
    default 20, it can only be lowered and never below 8, D-116), the `governance` loop sends the
    tenant admins with `admin:governance` the card `accountability_ready` (no buttons, repeated once
    a month while the condition holds and the mode is `shadow`). `apply` accepts `on` only while
    that condition holds, otherwise it rejects the charter with `accountability_not_ready`; going
    back to `shadow` is always accepted. The first `apply` with `on` writes the audit record
    `commission.accountability_on`; its time is `accountability_on_since`, and only incidents opened
    and links confirmed after it lead to departures.
  goal: C1
  check: [lint, blackbox]
  waivable: true
  version: v0.3
  profile: governance
  decisions: [D-98, D-109, D-116]
  fixtures: [blackbox:governance/accountability-shadow, blackbox:governance/accountability-ready]
  doc: docs/improvements.md

