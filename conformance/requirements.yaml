- id: MEM-1
  title: The core computes the memory space and the session key
  status: active
  text: >-
    The memory space `(tenant, scope, subject)` and the session key are computed by the core; model
    arguments do not set them. There are two scopes: `person`, where the subject is a person (for
    example the owner of a personal assistant), and `bot`, where the subject is a bot identity. The
    identity of the farm manager seat has a separate `bot` space in each tenant where it works
    (MGR-27). The session key `(tenant, role, subject, conversation)` always includes the tenant;
    for a group chat the `subject` field is the set of principals who wrote in the conversation,
    which the core extends at the first activity of each of them, so `purge` by scope `(tenant,
    subject)` also finds group sessions with that principal (C3).
  goal: C3
  check: [blackbox]
  waivable: false
  version: v0.1
  profile: core
  decisions: [D-10, D-35, D-80]
  fixtures: [blackbox:core/memory-space-computed]
  doc: docs/bots.md

- id: MEM-2
  title: Which memory for whom
  status: active
  text: >-
    `person` memory exists only for roles whose task types are all of class `summary`, without tools
    with `untrusted_output: true` and without `inbox.read`; roles that read untrusted text work
    without `person` memory. The `bot` scope holds only core records (`record`: numbers with bounds,
    codes from closed lists and ids, without model strings) and verified facts (`fact`, MEM-6);
    there are no free-form model notes (D-35). Records and facts are allowed for roles that read
    untrusted text too, because they contain no model strings. The role profile table (PRF-1)
    narrows which roles hold memory at all: profiles `reporter`, `translator`, `aggregator` and
    `farm-manager-reader` have no memory, and `reviewer` only reads facts with `untrusted_origin:
    false`. From v0.2, while the personal assistant is deferred (DSP-10, D-114), `apply` rejects a
    role with `memory: person` (`person_memory_deferred`).
  goal: G2
  check: [lint]
  waivable: false
  version: v0.1
  profile: core
  decisions: [D-10, D-35, D-114]
  fixtures: []
  doc: docs/bots.md

- id: MEM-3
  title: A person approves their memory, code verifies facts
  status: active
  text: >-
    A `person` memory record becomes `active` only after a decision by the person whose memory it
    is: the card goes to their private chat, the decision arrives through P1 `decide` with subject
    `memory_record` (APR-4), and on silence until the card expiry (7 days by default) the record
    gets `discarded`. There is no background self-learning without approval; a skill written by the
    model enters work only after a human review. With `untrusted_seen` of the attempt,
    `memory.propose` is rejected with reason `memory_untrusted`. A person does not approve facts of
    the `bot` scope: a fact becomes `active` after a code check (MEM-6), and a fact from an attempt
    with `untrusted_seen` gets `untrusted_origin: true`. There are no other records the model
    proposes into bot memory: a proposal of a record of kind `note` is rejected.
  goal: G2
  check: [blackbox]
  waivable: false
  version: v0.1
  profile: core
  decisions: [D-10, D-35]
  fixtures: [gov-mem-02]
  doc: docs/bots.md

- id: MEM-4
  title: Memory visibility, deletion and sealing
  status: active
  text: >-
    A person sees and erases their `person` memory; `forget` deletes for real. `forget`, person
    offboarding (P2 `principal.offboard`) and tenant deletion (P2 `tenant.delete`) go through an
    erasure request (RET-7) and delete memory and sessions in all stores, including runtime stores,
    with a result for each store. After an attempt there is no transcript on the runtime disk except
    the declared `runtime.session: runtime_internal` (RT-1). On identity retirement (IDN-11) the
    core seals its facts, records, track record and the sessions it ran: no bot reads them, except
    the fact offer to the successor (MEM-7); people with `admin:governance` see them only through
    P2 `bot.show --sealed`, and sessions only as metadata. Sealed data is erased in all stores under
    MEM-9, and a tombstone remains.
  goal: C6
  check: [fixture, blackbox]
  waivable: false
  version: v0.1
  profile: core
  decisions: [D-28]
  fixtures: [mem-fx-03]
  doc: docs/bots.md

- id: MEM-5
  title: Task order within one conversation
  status: deferred
  deferred: 2026-10-14
  reason: 'Ordering tasks within one conversation matters for chats with people; operations tasks of the pilot do not need it.'
  return_when: 'Bots hold conversations with people where order matters.'
  mechanism_removed: false
  text: >-
    A task type of `worker_kind: agent` declares `conversation_concurrency: serial | parallel`,
    default `serial`. With `serial`, one role has no more than one attempt in progress in one
    conversation: the core does not hand out a task of this conversation on `claim` while the same
    role has an attempt running in it, and hands out the tasks of that role in the conversation in
    enqueue order (dispatcher condition D17); a task held by another dispatch condition does not
    hold back the tasks behind it, and tasks of other roles in the conversation are not ordered
    against it; a task held back waits with `waiting_reason: conversation_busy`. A clarification
    from a person is a new task in the same conversation, and it waits its turn (D-41).
  goal: G1
