- id: DIG-3
  title: The right to decide on a proposal
  status: active
  text: >-
    A decision on a proposal takes the common path of human decisions (APR-4, subject `proposal`).
    Specific to proposals: the right to decide is given by the capability
    `proposal.decide:<category>` for this proposal's category, and "Accept" also requires the right
    to start the implementation: `action.request:<action>` for `action_request`, `script.run` for
    `script`; for `manifest_change` and `human_change`, `proposal.decide:<category>` is enough,
