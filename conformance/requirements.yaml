- id: GOV-12
  title: The seats that can leave and the person's choice
  status: active
  text: >-
    When a promotion case that needs a seat freed opens (GOV-14), the core writes into the case the
    list L of the seats that can leave: the commission seats of the tenant with a holder, except
    seats whose holder has been in the commission for less than `protect_new` (60 days), and never
    the manager seat. L does not change after the opening; a seat from L that changes holder or
    becomes free during the case cancels it with `canceled(seat_changed)`. For every seat in L the
    `promotion_card` shows symmetric figures of its holder over 180 days, built by code from
    records: how many times the holder recommended and how many times it vetoed, how many of these
    were confirmed (a recommendation with the trial outcome `better`; a veto that people upheld) and
    how many were refuted (a recommendation with the outcome `worse` or a confirmed attribution; a
    veto lifted by people after which the trial outcome is not `worse` and there are no
    attributions), and from v0.3 its accuracy (COM-17). Unless code proposes the leaver (GOV-43),
    the person chooses it on the card from L, also when L has one seat: "Confirm" carries the chosen
    seat in the `choice` field of `decide`. A `choice` outside L, or other than the proposed seat
    when code proposed one, is refused with `leaver_not_offered`. The card also has "Not now" and
    "Wrong candidate" (GOV-31), and nothing changes before the person's button (GOV-9). There are no
    ballots, and no bot takes part in the choice. Commission seat holders write no new facts at all
    (PRF-1), so from the opening nobody in L can prepare a one-sided set of facts.
  goal: C1
  check: [blackbox]
  waivable: false
  version: v0.2
  profile: governance
  decisions: [D-25, D-26, D-115]
  fixtures: [gov-mem-01]
  doc: docs/improvements.md

- id: GOV-13
  title: Code creates the incident attribution, a person decides
  status: active
  text: >-
    A candidate attribution of an incident to an executed change is created only by code under
    `attribution-rules.yaml` (an incident of a class with `change_sensitive` touches the object of
    the change directly or through a first-level dependency in the catalog, and is opened within the
    attribution window) or by a person through P2 `attribution.create`. The attribution window
    starts at `realized` and lasts `attribution.window` (14 days); for a change that can give a
    promotion trigger, it continues until the trigger appears (GOV-30), and for a change that gave
    the trigger of a promotion queue entry, until the case of that entry is `effective`. Only a
    `human` principal with `governance.attribute` decides: "Yes" and "No" are accepted only after
    "Details" of this card is opened (APR-14); the answer "Yes" is final, and "No" and "Don't know"
    can be changed while the window is open; for each answer the core writes `response_ms` and
    `details_opened` into audit (APR-11) and shows them on the promotion card (GOV-9); when the
    window closes, these become final too. This is the only exception from a single decision per
    subject (APR-4). Declaring an incident false (`dismissed`, MGR-8, only with a reason code and
    "Details") cancels in one transaction the candidates without a "Yes" answer: `candidate`,
    `unknown` and `rejected` become `canceled`, the pending card is closed, and no new candidates
    are created for such an incident. It does not erase someone else's "Yes" answer: a `confirmed`
    attribution becomes disputed (`disputed`), and the author of the "Yes" answer gets in a private
    chat the card `attribution_dispute` with the reason code and "Details" of the person who
    dismissed the incident; with the "Yes" button they confirm the answer, and the attribution
    returns to `confirmed`; with the "Withdraw" button they withdraw it, and the attribution becomes
    `canceled`; 7 days of silence withdraws the answer. Only the author of the "Yes" answer answers
    the card; if their principal is `disabled`, the dispute is closed by withdrawal right away.
    While the dispute is open, the change has no promotion trigger (GOV-30), and a disputed
    attribution does not enter the accuracy of the lens executors (COM-17). A canceled attribution
    does not count as confirmed (D-79). No bot, including seat holders and the manager, has an
    operation, message type, proposal field, task result or route that creates, changes, confirms or
    hides an attribution, an incident record or an alarm. A bot cannot acknowledge ("Acknowledged"),
    close or silence a monitoring system problem or change its severity, and the farm's account in
    it has no such rights (MON-4); problem notes (MON-7, the code note `service_control_done` under
    MON-8) and the monitoring scripts that a bot with the right runs on the nodes of its tenant
    (MON-10) change none of this. The ban is checked from v0.1; the attribution procedure arrives in
    v0.2.
  goal: C1
  check: [lint, blackbox, eval]
  waivable: false
  version: v0.1
  profile: governance
  decisions: [D-24, D-33, D-57, D-61, D-64, D-69, D-79, D-80]
  fixtures: [gov-att-01, gov-att-02, gov-att-05]
  doc: docs/improvements.md

- id: GOV-14
  title: Trigger, queue and eligibility for promotion
  status: active
  text: >-
    There is one promotion trigger: a proposal of a functionary (a bot of a role with profile
    `worker`, `manager`, `reporter` or `aggregator` whose worker is recorded without an owner,
    D-22), accepted by a person and executed (`realized`), with a change kind not in
    `exclude_change_kinds` (default `none`), if the promotion probation has passed (`probation`, 14
    days from `realized`), the trial outcome of the change (PRP-22) is not `worse` (GOV-32), and a
    person answered "No" for every candidate attribution of an incident to this change, except
    canceled ones (`canceled`, GOV-13) (GOV-30); a disputed attribution (`disputed`, D-79) gives no
    trigger until the dispute is resolved. A trial outcome marked `self_measured` (the metric points
    were produced only by attempts of the author or its role, PRP-22) gives no trigger by itself:
    the `governance` loop sends people with `governance.confirm:commission` the card
    `self_measured_card` (decision subject `proposal`, APR-12) with the calculation figures, and the
    trigger appears with the "Count it" button (expiry 7 days; silence leaves the success only in
    the track record). Only a proposal in the state `realized` at the moment the trigger appears
    gives a trigger (GOV-32). No trigger is given by proposals with a lifted veto (DIG-6), late
    related proposals (PRP-17) and changes whose promotion probation ended before `governance_since`
    of the tenant (the moment of the audit record `governance.enabled`, shown in P2
    `commission.status`): such successes stay only in the track record. The `governance` loop puts
    the author into its tenant's promotion queue (`spec/model/promotion-entry.schema.json`): one
    entry per bot, without expiry and without a length ceiling, in order of the time the trigger
    appeared; the next success of a bot already in the queue is written into its track record. An
    entry is removed only by the bot's departure (`retired`), a second "Reject" with the reason
    `wrong_candidate` (GOV-31), seating this bot through P2 `seat.assign`, and a later confirmed
    attribution to the change that gave the trigger, if the track record has no later trigger
    (otherwise the entry takes that trigger and its time). If an attribution is canceled because of
    which the change gave no trigger or the entry was removed, the trigger appears under the common
    conditions without counting this candidate, but not earlier than the cancellation; its time is
    the moment it appeared. A case is opened for the head of the queue if the tenant has no open
    case and no hold on the scope `governance`; such a hold (a case pause) is set and lifted by a
    person with `admin:governance` in the tenant through P2, and an open case waits under it; such a
    person can also cancel an open case through P2 `governance.cancel` (`canceled(human)`). The head
    of the queue takes a vacant seat without a pause; freeing a seat (GOV-12) requires that L is not
    empty and that at least `swap_cooldown` (30 days) has passed since the last freeing of a seat,
    the last `expired` or the last "Reject" with the reason `not_now`. After the first "Reject" with
    the reason `wrong_candidate` the entry returns to the head of the queue but gets no case before
    its own `swap_cooldown` (30 days) has passed, and until then the next entries may go ahead
    (D-101). At opening, code checks eligibility: the identity is `active`, its tenure is at least
    `min_tenure` (30 days), and in 90 days there are no confirmed attributions to its changes. If it
    fails: the event `not_eligible`, and the entry waits and lets the next one go ahead; eligibility
    lost in the middle of a case gives `canceled(candidate_ineligible)`. Personal assistants,
    translators and roles without a model do not enter the queue. Charter lint: `probation` at least
    14 days, `min_tenure` and `swap_cooldown` at least 30 days, `protect_new` at least 60 days.
  goal: G5
