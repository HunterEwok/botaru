- id: PRM-2
  title: Holds and bans before the permission intersection
  status: active
  text: >-
    C2 first checks active holds (HLD-1), then the non-waivable bans: the tenant of the credentials,
    the task, the principal and the chat is one and the same; write tools do not reach the model and
    tier 3 runs only through a human approval, except `service/control` and `monitor/script_run`
    within APR-18; only the core enqueues `action.*` types; `admin:*` and P2 operations are never
    model tools; operator operations are not accepted from a channel (PRM-14). Only after that is
    the intersection computed: the worker's role allows (the type in `claims`, the tool in `tools`)
    AND every initiator of the attempt, including initiators of what was read, allows
    (`task:<type>`, `data:<class>`) AND in a group chat the result class is not above the chat
    ceiling AND the budget is not exhausted. The decision does not depend on the bot identity, its
    profile, seat and bot groups: only the worker's role and the initiators set the permissions. A
    permission table of 30-50 anonymized rows (tenants `demo` and `demo2`) passes on any C2
    implementation.
  goal: G2
  check: [fixture]
  waivable: false
  version: v0.1
  profile: core
  decisions: [D-11, D-40, D-68]
  fixtures: [authorize/]
