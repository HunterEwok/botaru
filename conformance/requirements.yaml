- id: GOV-33
  title: Only the charter declares seats
  status: active
  text: >-
    A tenant's commission seats are declared only by its charter `tenants/<t>/governance.yaml`: the
    `commission` block with the seat role `seat_role`, the seat model profile `model_profile` and
    the list `seats` (seat id, a lens from `spec/model/lenses.yaml`, the fallback role
    `fallback_role`, optionally the seat's own `model_profile`, which replaces the shared one) and the map `lenses`
    with the persona addendum of every seat lens and the tenant's own lenses (COM-19). The block `commission.audit_sample` sets
    the audit sample (DIG-5): `min_per_month` is the smallest number of sample items per month
    (default 4, lint no fewer than 4), `share` the smallest share of items relative to the number of
    proposals the sample is drawn from (default 0.25), `max_per_digest` the largest number of items
    in one digest to people (default 2). The manager seat is declared only by the farm charter
    `farm/governance.yaml` with the `farm_manager` block: the rank ceiling, `model_profile`, the
    persona, `incident_stop.decide_within` and the seat limits `control_limits` (including
    `daily_review_max_eur`, MGR-41), `grant_limits` and `breaker` (MGR-14); the tenant's relation to
    the manager (the flag `enabled`) is set only by the `farm_manager` block of the tenant spec, not
    by the charter (MGR-42, D-77). The commission manifest (`Commission`) sets only thresholds and
    weights per lens (COM-8). `apply` rejects a set of manifests where seats, their lenses or
    executors are declared somewhere else or twice, and does not delete a seat that has a holder:
    first P2 `seat.vacate`. A tenant charter has no blocks other than `commission`, `positions`
    (position rank ceilings only below the profile ceilings, GOV-3; persona, GOV-4), `promotion`,
    `removal`, `attribution`, `confirmation`, `identity` and `memory`, and every numeric
    field changes only in one direction from the default value. Only raising is allowed for
    `promotion.probation` (14 days), `promotion.min_tenure` and `promotion.swap_cooldown` (30 days,
    all GOV-14), `removal.protect_new` (60 days, GOV-12), `attribution.window` (14 days, GOV-13),
    `confirmation.ttl` (7 days, GOV-9),  `identity.unbound_ttl`
    (30 days, IDN-11), `memory.seal_ttl` (30 days, MEM-9) and the fields of
    `commission.audit_sample` (DIG-5). Only lowering is allowed for `memory.facts.max_active` (100) and `memory.facts.per_attempt` (3, MEM-6),
    `memory.offer.max` (100, MEM-7). The list `promotion.exclude_change_kinds` (GOV-14) can only be
    extended, and the kind `none` is always in it. In the farm charter `incident_stop.decide_within`
    (7 days, GOV-22) can only be shortened.
  goal: C1
  check: [lint]
  waivable: false
  version: v0.1
  profile: governance
  decisions: [D-23, D-26, D-77, D-114, D-115]
  fixtures: [gov-fx-26]
