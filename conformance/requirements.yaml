- id: LCY-6
  title: Core drain before rollout
  status: active
  text: >-
    P2 `core.drain` with a deadline (an operator operation, PRM-14) prepares a core rollout: the
    core stops handing out work (`claim` answers `not_ready` with `retry_after_s`), lets running
    attempts work until the deadline, waits for started P4 calls to finish and stops. While the
    drain is going on, P2 `health` answers `alive: false` with the reason `draining` and the number
    `drain_until_s` (seconds until the drain deadline), so that the monitoring system can tell a
    planned rollout from a failure (MON-2): the liveness trigger in its template does not fire
    within `drain_until_s`, and `doctor` warns if the core has been draining longer than the
    deadline. A lease that expired while the core was not running and was not extended after it
    became ready ends with `core_unavailable` and does not spend an attempt (FEN-5). While the store
    has `active` leases, the store schema changes only by addition: first expand, and contract in
    the next rollout. Fixture: `core.drain` in the middle of two tasks, a core stop and start; both
    tasks continue without a spent attempt.
  goal: G4
  check: [blackbox]
  waivable: true
  version: v0.1
  profile: core
  decisions: [D-36]
  fixtures: [blackbox:core/health-draining]
  doc: docs/operations.md

- id: LCY-7
  title: Worker port version window
  status: active
  text: >-
    The core accepts the current and the previous major version of P1. A worker outside this window
    gets `version_unsupported` at `hello`, not errors in the middle of work. Fixture: a worker of
    the previous major version works with the new core, and a worker two versions older gets
    `version_unsupported` at `hello`.
