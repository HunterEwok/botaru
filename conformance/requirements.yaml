    Besides SCR-3, a `when` condition may use the atoms `lt`, `le`, `gt`, `ge`, `not_in` and
    `exists`, and may read the rollups `count`, `sum`, `min`, `max` of the `summary_fields` fields of
    the campaign items of a `fanout` step (`{ref: <step>.<rollup>.<field>}`, with a number literal);
    an `items.from` selection with a `where` atom reads only the `summary_fields` fields of the items
    of an earlier `fanout` step, and the core selects the items from the frozen list of that step.
    The limits of SCR-3 on nesting and the number of atoms hold.
  goal: G1
  check: [lint, blackbox]
