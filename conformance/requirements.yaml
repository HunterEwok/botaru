- id: HLD-7
  title: Auto-stop on spend rate
  status: active
  text: >-
    If a tenant's usage over a sliding hour is above its hourly limit `Tenant.spec.budgets.hour_eur`
    (default one hundredth of `month_eur`, BUD-1), the core sets a hold on the scope `role` on every
    agent role of the tenant with the effect `no_claim`, the reason `runaway_spend`, the author
    `contain_auto` and the expiry `until` one hour after setting, and raises the alarm
    `alarm.hold.auto` by code. The hold does not delay `job` tasks without a model slot. A tenant
    admin or an operator lifts such a hold before its expiry (HLD-2). The threshold and expiry are
    written in `spec/model/holds.yaml`; the tenant catalog can only make them stricter. Fixture:
    mock usage lines summing to more than `hour_eur` in an hour give a `no_claim` hold on every
    agent role with `until` in an hour and an alarm; a `job` task of the same tenant is handed out.
  goal: G3
  check: [blackbox]
  waivable: true
  version: v0.1
  profile: core
  decisions: [D-54]
  fixtures: [blackbox:core/runaway-spend]
  doc: docs/operations.md

- id: HLD-8
  title: A pause of approvals set by a person
  status: active
  text: >-
    From v0.2 a person with `hold.set:<scope>` may set the effect `pause_action` on any scope that
    holds approvals (`tenant`, `role`, `tasktype`, `action`, `host`, `resource`, `bot_group`,
    `bot`), not only through a maintenance window (MON-9). While it is in effect, a new
    `request_action` in the scope gets `rejected(held)`, P1 `decide` on a pending approval of the
    scope gets `held` and changes nothing, and the `approval-expiry` loop does not expire it; the
    card gets a `card_update` with the text `card.paused`. When the hold ends, the expiry of each
    such approval moves forward by the time it was pending under the hold, and the card gets a
    `card_update` with the new expiry. The pauses extend one approval by at most 7 days in total
    (a hold without `until` included): when an approval has been pending under `pause_action` for 7
    days, the `approval-expiry` loop expires it with `expired` even while the hold lasts, so no
    approval waits without end and no old card is decided long after its context (D-108).
    `no_action` on the same approval, in the same hold or another, wins over `pause_action`.
  goal: G6
  check: [blackbox, fixture]
  waivable: false
  version: v0.2
  profile: core
  decisions: [D-107, D-108]
  fixtures: [sm-apr-09, blackbox:core/hold-pause-by-person]
  doc: docs/operations.md

- id: HLD-9
  title: Auto-hold of a role after confirmed incident links
  status: active
  text: >-
    The core counts, per pair of tenant and role and not per bot, the confirmed links of incidents
    to the work of the role: an incident attribution that a person confirmed (GOV-13) to a change
    whose proposal a bot of the role wrote, and a confirmed script link (TRN-7) to a run whose draft
    the role wrote. When 3 such links fall within 90 days, the core sets a hold on the scope `role`
    of this role in the tenant with the effect `no_action`, the reason `role_incidents`, the author
    `contain_auto` and no expiry, and raises the alarm `alarm.hold.auto` by code. The rule is the
    same for every role; the threshold and window are written in `spec/model/holds.yaml`, and the
    tenant catalog can only make them stricter. While the hold is in effect, the role's bots request
    no actions and control no services (HLD-3), and draft acceptance (SCR-5) rejects a draft written
    by the role that has an `action` step, a `fanout` with an action, or a step that controls
    services or runs monitoring scripts, with `rejected(held)`; read-only work and read-only scripts
    still run. A link that later becomes disputed or canceled leaves the count but does not lift
    the hold: only a person lifts it (HLD-2), with an audit record. Fixture: three confirmed script
    links of the translator role in 90 days give the hold and the alarm; a draft with an action is
    rejected with `held`, a read-only draft is accepted; a tenant admin with `hold.release` lifts
    the hold.
  goal: G4
  check: [blackbox]
  waivable: false
  version: v0.3
  profile: core
  decisions: [D-112, D-114]
  fixtures: [blackbox:core/role-incident-hold]
  doc: docs/operations.md

- id: IDM-1
  title: Task idempotency key
  status: active
  text: >-
    A task's idempotency key is unique within the pair `(tenant, idempotency_key)`. A repeat with
    the same key returns the existing task only if both the initiator and the body match (compared
    by the hash of the body's canonical form); otherwise the answer is `idempotency_conflict`
    without an id and without any sign of the other task. A refusal at enqueue does not take the
    key: there is no task record, and the refusal is written to audit. Keys with the prefix
    `system:` are set only by the core: the `enqueue` request schema rejects a request with such a
    key from any other sender. Uniqueness holds even after the task is deleted: a tombstone
    `(tenant, key hash, task id)` of the retention class `tombstone` remains, the key stays taken
    while the tenant lives, and a repeat of the key of a deleted task gets `gone`, not a new task
    (RET-3).
  goal: G1
  check: [blackbox]
  waivable: false
  version: v0.1
  profile: core
  decisions: [D-43]
  fixtures: [blackbox:core/idempotency-key]
  doc: docs/tasks-and-delivery.md

- id: IDM-2
  title: A closed list of core keys
  status: active
  text: >-
    Tasks and messages that the core itself creates get an idempotency key only from a closed list,
    and a double firing of one trigger gives one task. The list: a schedule
    `system:schedule:<schedule>:<slot>`, where the slot is a UTC instant in the format
    `schedule_slot` (TIM-3); an action task after approval `system:approval:<approval id>`; a route
    on an event `system:event:<route>:<source>:<id>`, so two routes on one event give two tasks; a
    channel activity `system:activity:<channel>:<update id>`; a dead work redrive
    `system:redrive:<task id>:<n>`, not for `action.*`; a child task from `enqueue_child`
    `system:child:<parent>:<body hash>`; a bot message `system:msg:<attempt>:<n>`; a wake-up on an
    inbox `system:wake:<route>:<window>`; an auto-report `system:report:<task>:<route>`; a lens
    review task `system:review:<proposal>:<lens>`; a continuation `system:cont:<trigger>:<source
    id>`, including a child task's answer `system:cont:reply:<child task>` and a campaign outcome
    `system:cont:campaign:<campaign>`; a script step task `system:script:<run>:<step>` (SCR-8),
    which is also a continuation with the trigger `script`; a campaign item
    `system:campaign:<campaign>:<n>`; an incident `system:incident:<class>:<subject>:<window>` and
    its closing pass `system:incident:<incident>:close`; a data read by the manager seat
    `system:inspect:<basis>:<n>`; the daily review of the manager seat `system:daily:<tenant>:<day>`
    (MGR-41); a control operation `system:control:<epoch>:<number>`; a directive to the manager
    `system:directive:<id>`; the action task of a routine service grant `system:grant:<grant>`
    (APR-17, D-78). An external event
    `system:ingress:<source>:<delivery id>` (from v0.1 for the monitoring adapter, from v0.2 for
    source channels); from v0.2: an escalation to the manager `system:escalation:<attempt>`, a
    takeover `system:takeover:<task>`, a batch of pending model grant requests
    `system:grants:<tenant>:<window>`, a shadow reviewer task of a lens
    `system:review:<proposal>:<lens>:shadow`, separate from the seat's task, and a review of an
    escalation to the manager by the necessity lens `system:necessity:<escalation>`, and the ingest
    task of a corpus document `system:kb.ingest:<document>` (KNW-5); from v0.3: the postmortem of an
    incident `system:postmortem:<incident>` (MGR-53). A new core key appears only by editing this
    list.
  goal: G1
  check: [blackbox]
  waivable: true
  version: v0.1
