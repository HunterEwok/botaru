- id: OBS-8
  title: The store is unavailable
  status: active
  text: >-
    If the store (C1) does not answer, the core neither loses nor starts work: P1 answers all
    operations with `not_ready` with `retry_after_s` (in HTTP with the `Retry-After` header), P4
    starts no new model calls, the channel does not advance the external system offset (DLV-5),
    background loops do not mark ticks, and P2 `health` answers the monitoring system "not alive"
    (MON-2). The core leaves this mode only when the store answers and all background loops have
    marked a tick again. A lease that expired while the store was unavailable and was not renewed
    after readiness ends with reason `core_unavailable` and does not spend the attempt: this is an
    infrastructure failure, not a task failure (FEN-5). Fixture: the store stops in the middle of a
    task; the worker gets `not_ready`, the mock model gets no new calls, and after the store returns
    the task continues without a spent attempt.
  goal: G1
  check: [blackbox]
  waivable: false
  version: v0.1
  profile: core
  decisions: [D-36, D-60]
  fixtures: [blackbox:core/store-down]
  doc: docs/operations.md

- id: OBS-9
  title: Three health indicators
  status: active
  text: >-
    The core computes three health indicators: the age of the oldest task of priority classes 1 and
    2 in state `submitted`; the share of deliveries that reached `delivered` no later than 10
    minutes after creation; the age of the last tick of each background loop. The deployment binding
    sets the window for counting the share and the thresholds of all three indicators. An indicator
    beyond its threshold gives an alarm by code. The values are visible in P2 `doctor`,
    are part of the daily summary to operators and of the P2 `health` answer that the monitoring
    system polls (MON-2), so that a stuck farm is noticed even when its channel does not work.
    Fixture: a mock clock ages a class 2 task beyond the threshold, the core raises an alarm and
    returns the value in the `health` answer.
  goal: G1
  check: [blackbox]
  waivable: true
  version: v0.1
  profile: core
  decisions: [D-36, D-60]
  fixtures: [blackbox:core/health-indicators]
  doc: docs/operations.md

- id: OBS-10
  title: Health of plugins, channels and the provider
  status: active
  text: >-
    In `hello` and `heartbeat` a toolhost reports the state of each of its plugins (`ok`,
    `degraded`, `down`), a channel reports the time of the last successful poll of the external
    system, and P4 keeps the state of the model provider. Reports follow the schema
    `spec/model/health-report.schema.json` with check codes from a closed list only, without error
    texts (OBS-1). No work is handed out for a plugin in `down` and for a toolhost that is not seen;
    a call of such a plugin gets `plugin_unavailable` at once: the model sees the call error and
    decides itself, and the core does not repeat the call. State `down` only narrows hand-out and
    never widens it (STA-2). Fixture: a call of a plugin in `down` gets `plugin_unavailable` at
    once, without waiting for the lease expiry; after `hello` with `ok` the call passes.
  goal: G1
  check: [blackbox]
  waivable: true
  version: v0.1
  profile: core
  decisions: []
  fixtures: [blackbox:core/plugin-unavailable]
  doc: docs/operations.md

- id: OBS-11
  title: The `doctor` lines of the alarm path per tenant
  status: active
  text: >-
    P2 `doctor` shows for each tenant, including the service tenant `farm`, the checks that show
    that the alarm path to the monitoring system works: the age of the last successful
    export `monitor_export_age_s` (MON-11), the number of deliveries for E5 in `planned` older than
    15 minutes, and whether this tenant's adapter account sees only the node groups of its tenant
    (MON-4). `doctor` fails the check if a tenant with a catalog has no successful export for longer
    than 15 minutes (for example, it has no `monitor` worker in `active`), if deliveries for E5 sit
    in `planned` for longer than 15 minutes, or if the account sees other tenants' nodes. The
    `status` schema has no monitoring lines. What limits the manager and the improvement cycle is
    shown per tenant where its schema has the field: P2 `status` lists the tenants with
    `Tenant.spec.farm_manager.enabled: false` under `farm_manager_disabled` (D-77), and, with the
    profile `insights`, P2 `commission.status` shows the commission shadow off (`shadow: off`,
    COM-10) and, from v0.2, "commission locked" (`commission_locked`, GOV-35). Fixtures: `demo2` with
    `farm_manager.enabled: false` is listed under `farm_manager_disabled` in `status`; tenant
    `demo2` without an adapter process fails the check in `doctor`; a `monitor_alarm` delivery in
    `planned` for 20 minutes fails `doctor`.
  goal: G4
  check: [blackbox]
  waivable: true
  version: v0.1
  profile: core
  decisions: [D-77, D-80, D-114]
  fixtures: [blackbox:core/doctor-tenant, blackbox:core/status-manager-off]
