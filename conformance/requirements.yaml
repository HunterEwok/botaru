- id: STA-1
  title: Only worker code sends state
  status: active
  text: >-
    A message of genus `state` is sent only by worker code with the worker token through P1
    `msg.send`. A type of genus `state` has only `code` in `producers`; P3 gives the model no tool
    for `state` (lint and `tools/list` assembly check this). A worker reports only about itself: the
    sender is the worker from the credentials. The schema is closed, there is no note, `untrusted:
    false`, `dataorigin: code`. No more often than once a minute per (worker, type), plus on a
    change of `phase`; anything extra gets `rejected(service_rate_limited)` without an event. The
    code `service_rate_limited` means a farm guard, not the model provider: it does not spend the
    attempt and does not cause retries with backoff.
  goal: G2
  check: [lint, fixture, blackbox]
  waivable: false
  version: v0.1
  profile: messaging
  decisions: [D-14, D-71]
  fixtures: [fx-msg-09]
  doc: docs/messaging.md

- id: STA-2
  title: The self-report is informational, the truth about liveness is the core's
  status: active
  text: >-
    The `state` self-report is informational. The dispatcher, leases, the worker lifecycle, holds,
    budgets, alarms and the farm manager's decisions do not use `state` fields as a condition; the
    core judges liveness by its own observations (`last_seen`, leases, OBS-4). The only exception
    from a closed list: plugin state `down` in a toolhost report narrows the hand-out of calls of
    that plugin to that toolhost. `state` never widens what a worker gets, does not mark another
    worker, does not release a hold and does not raise an alarm. Fixture: a worker sends `phase:
    idle, slots_free: 64` with a stale `last_seen`; the `claim` decisions for other workers and the
    alarms are the same as without this message.
  goal: G4
  check: [fixture, blackbox]
  waivable: false
  version: v0.1
  profile: core
  decisions: [D-14]
  fixtures: [fx-sta-01]
  doc: docs/messaging.md

- id: STA-3
  title: Two columns and a mismatch code
  status: deferred
  deferred: 2026-10-14
  reason: 'last_seen and the leases in status are enough for the operator of the pilot.'
  return_when: 'The operator cannot tell a worker''s state from last_seen and leases.'
  mechanism_removed: false
  text: >-
    The `status.workers` view and P2 `status` show side by side the core observations (presence,
    worker lifecycle, holds, leases, `last_seen` age) and the last self-report with its source and
    time, plus a mismatch code from the closed list `state-mismatch.yaml`:
    `reported_ready_unreachable`, `reported_idle_not_claiming`, `reported_busy_no_lease`,
    `reported_draining_still_claiming`, `reported_plugins_differ`, `state_stale`. Core code computes
    the codes by a table of conditions; on a mismatch the core observation prevails. The
    self-report column carries only the phase from the closed list of `bot-state.schema.json`, its
    source and time; no other field of a worker's message reaches another bot's model context.
