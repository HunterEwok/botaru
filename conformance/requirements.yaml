- id: DLV-6
  title: The delivery target comes only from a closed list
  status: active
  text: >-
    The delivery target comes only from a closed list: the task's `origin` (signed by the core on
    receipt); the address of a route or a schedule's `deliver_to`, that is, a group of principals
    `group:<group>` (a direct message to each member), a bound chat `chat:<binding>`, a sink
    `sink:<sink>` or `approval_initiator`; the E5 monitoring adapter, whose address only the core
    sets, for exporting an alarm episode, for a monitoring script and a code note about a service
    action, and from v0.2 for a bot note on a problem, and such a delivery has no people's ids
    (MON-1, MON-7); the tenant's `insights.present_to` address for the digest and proposal cards
    (DIG-2, D-71); the address `admins` for the core's own code notices to the tenant admins
    (IDN-13), which only the core sets: the direct messages of the active admins with the right
    the notice names, for example `admin:people` for `principal_left` (REP-5). The address
    `approval_initiator` means the direct messages of the initiator of
    the approval whose number is in the event data, and it is accepted only if the approval belongs
    to the route's tenant, its action is named in the route, it is in the state `executed`, and the
    initiator is a person. For each human recipient the core checks that they are active and have
    `data:<mark>`, and for a file delivery that the file's mark is not above their right (ART-3).
    The sink address is built from the base in the sink manifest, the tenant and the delivery id.
    There are no addresses in the task body, the result, bot messages or event data. Child tasks and
    continuations do not choose an address but inherit it; campaign items create no deliveries of
    their own (ORC-10). A mark above the group chat ceiling: the answer goes by direct message to
    the person who asked, and a ready code text goes to the chat; content never goes to a group chat
    in place of a direct message. The delivery record carries the target `target`, which the core
    computes from the address: `{kind: chat | subject | sink | monitor, id}` (a channel chat, a
    recipient principal, a sink, the tenant's monitoring adapter); `claim(delivery)` hands the
    delivery only to the channel, sink or adapter worker recorded at `enroll` for this target, and
    the worker does not compute the recipient itself.
  goal: G2
  check: [fixture, blackbox]
  waivable: false
  version: v0.1
  profile: core
