    source mark. A group chat binding with `ChatBinding.model_text: labeled` (`summary_only` by
    default, DLV-15) accepts the paragraph even with `untrusted_seen`, if the paragraph's class is
    not above the binding ceiling: the channel puts before it the code line "bot text, check the
    numbers against the table" and the list of distrust sources from a closed list (source kind,
    role or tool, without text); even with `labeled` the paragraph does not replace the table.
