- id: GOV-47
  title: "A preventable incident does not stop the manager, and the operators get a notice"
  status: active
  text: >-
    From v0.3 the farm manager seat has only the stop reasons `human` (MGR-15) and `no_control`
    (MGR-14); the core never adds `incident`. A new incident of a class with `manager_accountable:
    true` (MGR-55), opened while the seat is in `held` in a tenant with the manager enabled
    (MGR-42), is preventable when the conditions of MGR-45 hold; then in the same transaction the
    core writes `manager_preventable` into the incident record, raises the alarm
    `alarm.manager.preventable` with severity `page`, which the monitoring system delivers to people
    (MON-1; without one, the fallback alarm path of D-88), sends the notice `manager_preventable`
    and puts the seat into restricted mode in that tenant (MGR-47). Otherwise the incident record
    keeps the reason code why it is not preventable. The notice `manager_preventable` goes to the
    farm operators with `admin:governance` in `farm` without buttons, built only from codes and
    numbers: the incident class and number, the tenant, the time, the reason code of preventability,
    and ready `farmctl` commands: lift the restriction (`farmctl seat resume farm-manager --tenant
    <tenant>`), assign a new holder and vacate the seat; the tenant's content does not go to `farm`.
    It repeats after 24 h and 72 h and then once a week until an operator marks it read or the
    restriction ends. The monitoring system repeats the alarm by its own rules. The people of the
    incident's tenant see the mark "manager restricted" in the incident message (MGR-39). The epoch
    does not change, and the holder keeps its seat until a person decides with `farmctl`: lift the
    restriction (`seat.resume`), replace the holder (`seat.assign`, the previous one leaves with
    `replaced_by_human`) or vacate the seat.
