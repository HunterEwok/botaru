    From v0.2 a sealed item of a retired identity whose class period (RET-9) ends before `seal_ttl`
    is deleted by the `retention` loop at its period (RET-10), and a sealed session is deleted at
    the period of its class even while the seal runs. A fact offer then no longer lists the deleted
    item, and the successor's re-verification does not read it (MEM-7). The end of the seal still
    files the `bot_retired` erasure request for what is left (MEM-9).
  goal: C6
  check: [blackbox]
  waivable: true
