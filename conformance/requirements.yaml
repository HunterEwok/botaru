- id: REP-5
  title: Alarms and manager notices bypass the reporter
  status: active
  text: >-
    Alarms, farm manager notices and the immediate report about a control operation (the entry in
    the message to people, MGR-13) go to people bypassing the reporter. The core passes an alarm to
    the monitoring adapter (E5), and the organization's monitoring system notifies people (MON-1);
