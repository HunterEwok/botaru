- id: MGR-37
  title: A role quarter rounded down
  status: active
  text: >-
    The share of workers of one role or bot group in tenant T under seat holds (including quarantine
    and drain) is no more than `floor(max_share_held × n)`, where n is the number of workers of that
    role or group enrolled in T, and `max_share_held` is 0.25 by default. A hold with scope `role`
    or `bot_group` counts as a hold of all its workers, and a hold of scope `bot` as a hold of the
    worker of its binding. An operation after which the share would exceed the limit, including when
    the limit is 0, is not applied immediately by the core: it creates a `control` card for the
    people of T. Such a conversion does not count as a refusal for the safeguard, and the card
    counts in `ops_per_hour`.
