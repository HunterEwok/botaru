- id: MGR-27
  title: Seat memory
  status: active
  text: >-
    Seat memory is the space `(T, bot, <holder identity>)` separately in each tenant T; it holds
    only core records (`record`) and verified facts, seat roles have no notes, and the reader role
    has no memory at all. Only a decision attempt in T proposes facts; decision attempts and manager
    lens reviews in T read them, only facts with `untrusted_origin: false`. When the holder changes,
    the facts of each section pass to the new holder under MEM-7: a separate offer for the section
