- id: GW-9
  title: Each workspace has its own ceilings, checked at apply
  status: active
  text: >-
    Each provider workspace (of a tenant and of the quality test bench) has its own spend ceiling
    and its own rate limits set at the provider, and the deployment describes them for each
    workspace; because the rate limits belong to the tenant's workspace, a provider rate limit is a
    wait for that tenant, not a refusal (GW-10). At `apply` the core makes one check: the tenant's
    monthly limit (`month_eur`) is no more than the ceiling of its workspace multiplied by a share
    from the deployment (default 0.9), and the sum of `month_eur` of all tenants is no more than the
    same share of the organization's ceiling at the provider, so that the farm limit runs out before
    `provider_spend_cap`; the limits of test workspaces and the test bench together are no more than
    the share of the organization limit set by the deployment. There is no daily probe: `farmctl
    doctor` reads the ceilings at the provider when the provider binding allows it and shows a
    mismatch with the description, and a configuration failure on a real call sets the reason
    `provider_config` for the pair (GW-13).
  goal: G3
  check: [lint, blackbox]
  waivable: false
  version: v0.1
  profile: core
