- id: GOV-30
  title: Silence on an attribution does not expire
  status: active
  text: >-
    A candidate attribution of an incident to a change on which a person did not answer before
    the card expiry, or answered "Don't know", stays in the state `unknown` ("undecided") and
    does not expire. While the change has candidates in the states `candidate`, `unknown` or
    `disputed` (a dispute after `dismissed`, GOV-13, D-79), no promotion trigger appears and the
    attribution window stays open (GOV-13), even if the promotion probation (`probation`) has
    already passed. The change trial (PRP-21) and its outcome (PRP-22) are not shifted or
    extended by this. The trigger appears only when the promotion probation has passed and a
    person answered "No" for every candidate except canceled ones (`canceled`, GOV-13). Once a
    week, people with `governance.attribute` get a reminder about undecided candidates, no more
    than 3 times per candidate; after that the candidate stays as a row in the weekly digest. On
    the promotion card "Confirm" is inactive while the candidate's change has non-canceled
    attribution candidates without a "Yes" or "No" answer or in a dispute
    (`attribution_pending`, GOV-9).
  goal: C1
  check: [blackbox]
  waivable: true
  version: v0.2
  profile: governance
