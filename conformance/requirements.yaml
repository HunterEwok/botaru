  title: Task pinning
  status: deferred
  deferred: 2026-10-14
  reason: 'Task pinning is a rare measure; in the pilot hold, quarantine, request_action and people through farmctl are enough.'
  return_when: 'The farm manager needs to send a task to one named worker.'
  mechanism_removed: false
  text: >-
    `pin_task` enqueues a class 1 task through the `control` lane (DSP-5) in tenant T for the named
    worker. The type is taken from the class's `responses.pin_types` ∩ the permissions of group
    `farm-manager-ops` ∩ the `claims` of the worker's role; tier no higher than 1; no more than
