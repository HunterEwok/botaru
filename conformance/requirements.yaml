- id: MGR-32
  title: Protected targets only through a person
  status: active
  text: >-
    Protected targets in tenant T: task types with `alarm.*` in `events`, the `job` type that
    rechecks monitoring system problems and raises alarms for them (MON-5), backup types
    (`makes_backup: true`), system types and their schedules (flag `proposable: false`, PRP-10),
