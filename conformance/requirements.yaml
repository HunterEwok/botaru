- id: MEM-9
  title: A seal does not extend retention periods
  status: active
  text: >-
    The seal of a retired identity does not extend retention periods. At the end of `seal_ttl` (30
    days) the `identity` loop enqueues an erasure request with reason `bot_retired` and the identity
    id as scope (RET-7), and erasure goes through it; from v0.2 the `retention` loop deletes sealed
    data earlier when its class period ends first (MEM-10). `forget`, a person's request about their
    data (including `erase_match`, SEC-11), person offboarding and tenant deletion reach sealed data
    too, and the seal does not delay them. The core cannot seal a `session: runtime_internal`
    session, so in the identity retirement transaction it enqueues an erasure request with reason
    `bot_retired` for it, and the runtime adapter deletes it with the E4 `purge` operation (RET-4,
    RET-7).
  goal: C6
  check: [blackbox]
  waivable: true
  version: v0.1
  profile: governance
  decisions: [D-28]
  fixtures: [blackbox:identity/seal-no-extend]
  doc: docs/bots.md

- id: MEM-10
  title: The seal does not hold back deletion by period
  status: active
