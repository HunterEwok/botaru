- id: PRP-18
  title: Executor and deadline of an accepted proposal
  status: active
  text: >-
    On "Accept" the core records the executor and the deadline. For `action_request` and `script`
    the executor is the person who accepted, on whose behalf the object was created. For
    `manifest_change` and `human_change` the executor is a tenant person from the list
    `insights.realizers` (by default the person who accepted, if they are on the list, otherwise the
    first on the list); they get a card with the patch or the description and the deadline
    `realize_by` (7 days by default), and at half of the period the core sends a reminder. If there
    is no execution by the deadline, the proposal moves to `realization_failed(timeout)`, and the
    trial is closed as `canceled`.
