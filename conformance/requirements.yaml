- id: INS-6
  title: A visible "loop disabled" signal
  status: active
  text: >-
    The core considers a tenant's improvement cycle disabled if at least one reason from a closed
    list holds: no role has an `insight` section; for a role with an `insight` section the `insight`
    line is 0; the tenant's `review` line is 0; there is no `insights.present_to` address; a veto
    lens has no executor (COM-7, COM-8); the tenant has no active person with `proposal.decide`. The
    tenant check (`farmctl doctor`) and the `apply` lint print "improvement cycle disabled" with the
    reasons for each role. With the cycle disabled, the weekly proposal digest arrives even without
    items and carries the code line "loop disabled" with the reasons, if there is an address for it.
  goal: G5
