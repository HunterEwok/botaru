- id: PRP-12
  title: Guarded fields
  status: active
  text: >-
    The `guarded` section of the allowlist adds fields that are dangerous without guards: the
    attempt timeout of a type in the tenant's dispatcher rule (upward no more than twice and not
    beyond the task timeout), the number of attempts in the same place (only downward, not below 1),
