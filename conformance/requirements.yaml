- id: RT-1
  title: Session inside the runtime
  status: active
  text: >-
    The core lets an agent runtime keep the conversation itself only when the agent worker declares
    `runtime.session: runtime_internal` in P1 `hello` together with the erase operations `erase` and
    `match` (RT-5); without them the core blocks the worker at `hello` (`blocked`). The core treats
    such a runtime as a store of retention class `content` with one profile per (tenant, role,
    subject) or per bound group chat, cleaned at the tenant's period: `forget`, offboarding and
    every erasure request reach it as `erasure` work units through P1 `claim`, and the core writes
    the outcome of each into the erasure request. The core keeps the session's `untrusted_seen`
    mark itself (INJ-13).
  goal: G1
  check: [blackbox]
  waivable: false
  version: v0.1
  profile: core
  decisions: []
