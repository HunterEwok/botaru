- id: SCR-5
  title: Draft acceptance by the core
  status: active
  text: >-
    A draft is accepted synchronously by a chain of core checks in this order: the schema
    `botaru.script/v1`; references (SCR-2); the graph and conditions (SCR-3); the vocabulary of the
    author role (`scripts.step_types`, `scripts.actions`); the initiator's permissions for each step
    as if they enqueued this task, campaign or action request themselves (`task:<type>`,
    `data:<class>`, `action.request:<a>`, campaign ceilings; for a `task` step whose parameters name
    a service or a monitoring script, also `service.control:<service>` or `monitor.script_run`, as
    for an action, D-73); limits (the number of steps, no more than 3 steps with an action, where a
    `fanout` with an action counts as one, `fanout` items within the campaign ceilings, a run
    timeout no longer than the ceiling: 6 hours, and from v0.2 up to 7 days with `wait` and `await`
    steps (SCR-13),
    condition complexity), with `untrusted_seen` also TRN-4; an estimate of all branches at once in
    euros (each step by the enqueue estimate of its type, BUD-14) and in tree size. The first
    refusal rejects the draft as a whole with the reason and the step number; a refusal creates no
    record and does not take the key, the full reason is written into the audit, and the model gets
    a short one (PRM-8). The run's permissions are the intersection of the author role's vocabulary,
    the initiator's permissions for each step and the ceilings; they are never wider than the
    initiator's. The fields `max_tier`, `data_mark`, `untrusted_seen` with sources, the list of
    actions, the estimate, `plan_hash` and the expanded frozen `fanout` lists are written only by
    the core; the schema rejects such fields sent by the author. From v0.3 a hold with `no_action`
    on the author role rejects a draft with an action step or service control (HLD-9).
  goal: G2
  check: [fixture, blackbox]
  waivable: false
  version: v0.1
  profile: campaign
  decisions: [D-15, D-40, D-73, D-71]
  fixtures: [trn-05, trn-07, scr-fx-05]
  doc: docs/coordination.md

- id: SCR-6
  title: A run only after the initiator's button
  status: active
  text: >-
    A run of a draft that the model wrote (the translator or a proposal author) starts only after
    the initiator's approval through the `script_confirm` card. The channel draws it from the run
    record in code words, without model text: the number of steps in the heading, all steps in
    order, resources, actions with a mark that each will require a separate approval, steps whose
    bot can restart services or run monitoring scripts, with a mark that a restart and a script will
    run without a separate card if the step has no untrusted text, while starting and stopping a
    service will ask with a card (D-68, D-70, D-74), `action` steps with `risk: routine` with a mark
    that the routine action will run without a separate card (D-78), the estimate, the untrusted
    text flag with the source, `plan_hash`, the decision deadline and a line about why they decide,
    by when, and what happens on silence. The core accepts the "Run" button only from the initiator
    themselves: a `human` principal with a strong identity (IDN-3), from the channel where the card
    was delivered, with its `nonce`, exactly once, while the deadline has not passed and `plan_hash`
    matches. The privileged capability `script.run` is needed by the initiator only if the script
    has an `action` step, a `fanout` with an action, a `confirm` step or a `task` step that the card
    marks as able to control services or run monitoring scripts; a script without such steps (only
    reading and a digest) is an ordinary task: to run it, `task:<type>` and `data:<class>` for each
    step, checked at acceptance (SCR-5), are enough, and `script.run` is not needed. The card always
    goes to the initiator in a private chat. A draft with `untrusted_seen` never runs without such
    an approval.
  goal: G2
  check: [adapter, blackbox]
  waivable: false
  version: v0.1
  profile: campaign
  decisions: [D-15, D-48, D-68, D-70, D-74, D-78, D-71]
  fixtures: [trn-inj-06, scr-fx-01, scr-fx-02, scr-fx-03]
  doc: docs/coordination.md

- id: SCR-7
  title: A run approval approves no actions
  status: active
  text: >-
    A run approval approves no action. An `action` step and a `fanout` step with an action create at
    release their own approval with an exact snapshot of the arguments and the resource list at that
    moment under the ordinary approval rules (APR-3, APR-4 for an action, ORC-2 for a campaign); a
    person with `action.approve:<a>` decides. There is one exception: an `action` step with an
    action of `risk: routine` (APR-10, D-78) is released after the "Run" button without a card under
    a `service_grant` record with the initiator as author, within the action's `runs_per_hour` and
    `runs_per_day`, like `/run` (APR-17), if the step has no `untrusted_seen` and its `when`
    condition did not read a field of a step with `untrusted_seen` (SCR-9); otherwise it goes
    through a card. A `task` step whose bot asks to restart, start or stop a service or to run a
    monitoring script (`service/control`, `monitor/script_run`) carries out the request under the
    common rules: without a card only a service restart from the allowed list (a verb from
    `services[].no_card`, D-74) and a monitoring script, with the permission
    `service.control:<service>` or `monitor.script_run` of the run initiator (D-73, APR-18);
    starting and stopping a service always with a card; a restart and a script with a card if the
    step task has `untrusted_seen` or its `when` condition read a field of a step with
    `untrusted_seen` (INJ-15, SCR-9). At execution, `fanout` items are only a subset of the list
    frozen at the run approval.
  goal: G2
  check: [blackbox]
  waivable: false
  version: v0.1
  profile: campaign
  decisions: [D-15, D-40, D-67, D-68, D-70, D-73, D-74, D-78, D-71]
  fixtures: [blackbox:script/frozen-subset, scr-fx-04]
  doc: docs/coordination.md

- id: SCR-8
  title: Core code releases steps
  status: active
  text: >-
    Only deterministic core code releases steps: in the transaction in which the work of the
    previous step ended (DLV-2), or by the background loop `script` (deadlines, steps without
    predecessors); the model takes no part in release. A step task gets key
    `system:script:<run>:<step>`, and a double release gives one task. The estimate of all branches
    at once and the tree size are reserved in full at the run approval, and the campaigns of
    `fanout` steps take their reserve from the run reserve; if the reserve does not fit, the run
    does not start (`budget_exhausted`). The run is paid by the tenant's monthly limit and budget
    line `work` for the amount on the run card; the initiator's daily limit does not apply to steps.
    When each step is released, the core checks the initiator's permissions again (PRM-3); a refusal
    makes the step `failed` with the check reason.
  goal: G3
  check: [blackbox]
  waivable: false
  version: v0.1
  profile: campaign
  decisions: [D-15, D-41, D-71]
  fixtures: [blackbox:script/double-release]
  doc: docs/coordination.md

- id: SCR-9
  title: The distrust flag passes between steps
  status: active
  text: >-
    The `untrusted_seen` of a step equals the run flag OR the flags of predecessor steps whose
    fields or attachments it receives; the flag is monotonic and is never cleared. If the condition
    before a step with an action reads a field of an agent step with `untrusted_seen`, the approval
    of that action shows the flag source on the card.
  goal: G2
  check: [fixture, blackbox]
  waivable: false
  version: v0.1
  profile: campaign
  decisions: [D-15, D-71]
  fixtures: [blackbox:script/untrusted-flag]
  doc: docs/coordination.md

- id: SCR-10
  title: A hold pauses a run
  status: active
  text: >-
    A hold whose scope covers a running run (the tenant, the role, task type, host or resource of
    one of its steps, a step campaign) and whose effect forbids release or execution (`no_enqueue`,
    `no_claim`, `no_action`, `cancel_running`, as in ORC-11) moves the run to `paused` with reason
    `held` in the same transaction; while such a hold is in effect, the core releases no steps of
    the run, and `resume` gets `held`. Releasing the hold does not resume the run: only `resume`
    from the initiator does. The run deadline keeps running, and at the deadline a paused run
    becomes `canceled(deadline_exceeded)`.
  goal: G2
  check: [blackbox]
  waivable: true
  version: v0.2
  profile: campaign
  decisions: [D-15]
  fixtures: [blackbox:script/hold-pauses-run]
  doc: docs/coordination.md

- id: SCR-11
  title: Run transitions only by the table, cancellation cascades
  status: active
  text: >-
    A run and its steps change state only by the transition table `spec/lifecycles/script.md`. A
    step is released when all steps from its `needs` are in a terminal state and `run_if` holds:
    `succeeded` requires all of them to be `ok`; `failed`, at least one to be `failed` or `unknown`;
    `always` releases on any outcome. A step with a false `when` or an unmet `run_if` becomes
    `skipped`. A step failure (`failed` or `unknown`) with `on_failure: stop` moves to `skipped` all
    unreleased steps except steps with `run_if: failed` or `always`, and the run ends `failed`; with
    `on_failure: continue` the failure affects only the steps that depend on it. A person's refusal
    or an expired decision deadline makes a step `declined`: dependent steps with `run_if:
    succeeded` become `skipped`, and the run does not count as failed. Cancellation of a run (the
    initiator's button, P2 `script.cancel` by the initiator or by a person with `admin:people`,
    cancellation of the anchor task, disabling of the initiator) in one transaction moves unreleased
    steps to `canceled`, cancels the waiting approvals of its steps and requests cancellation of the
    tasks and campaigns of released steps. After the run's terminal state the core releases no step.
  goal: G1
  check: [fixture, blackbox]
  waivable: false
  version: v0.1
  profile: campaign
  decisions: [D-15, D-41, D-71]
  fixtures: [blackbox:script/transitions]
  doc: docs/coordination.md

- id: SCR-12
  title: A script from git on a schedule
  status: deferred
  deferred: 2026-10-14
  reason: 'Scripts from git on a schedule are a second way to run things next to task schedules (TIM-3), which the operations pilot uses.'
  return_when: 'A tenant needs a multi-step script on a schedule.'
  mechanism_removed: false
  text: >-
    A `kind: Script` manifest reviewed in the tenant's git can be started by a schedule
    (`Schedule.spec.script`, an optional field from v0.2) without a person's button only if it
    needs no `script.run` (SCR-6): no `action` step, no `fanout` with an action, no `confirm`
    step and no step whose role has `service_control` or `monitor_scripts`; it has no `await`
    step, so an external event cannot steer a run without a person; it keeps within
    `Tenant.spec.scripts` (SCR-5); and the run's permissions are those of `system`: every `task`
    and `fanout` type of the script is listed explicitly in `system-ops` (PRM-10). Otherwise
    `apply` rejects the schedule. The `deliver_to` of such a schedule is checked at `apply` and
    at every run, as for a task schedule (PRM-10). The run has initiator `system`, fairness key
    `script:<run>` and the slot rules of TIM-3; at most one run of a schedule is live, and a
    slot that comes while the previous run is live is skipped with `run_live`. Its estimate is
    reserved at each slot as at a run approval (SCR-8), and a slot that does not fit is skipped
    with `budget_exhausted` (TIM-3). A hold on the schedule stops it (CAP-4), and a hold on the
    run pauses it (SCR-10).
  goal: G1
  check: [lint, blackbox]
  waivable: true
  version: v0.2
  profile: campaign
  decisions: [D-99, D-102, D-105]
  fixtures: [lint:manifests/schedule-script, blackbox:script/scheduled-run, manifests/v02-security-lints]
  doc: docs/coordination.md

- id: SCR-13
  title: The steps wait and await
  status: deferred
  deferred: 2026-10-14
  reason: 'Steps that wait days for events are not needed for the first operations tasks.'
  return_when: 'A script needs to wait for time or an external event.'
  mechanism_removed: false
  text: >-
    A `wait` step has only `for`, a duration. An `await` step has `event` (an event type of the
    events catalog, or an `ext.*` event of a source channel of the tenant whose data is closed by
    `ingress.mapping`, ING-2), `match` (1-5 pairs of an `event_field` and a value: a literal, `{ref:
    <step>.<field>}` to a closed result field with `x-botaru-read-by: code` (SCR-3), or `{param:
    <name>}` in a script from git, SCR-14) and a required `timeout`. `for` and `timeout` are each
    at most the run deadline. At release the core writes a waiting record and no task: there is
    no attempt and no lease, only the run record waits (CNT-4). For `wait` the timer ends the step
    `ok`. For `await` the first event of the same tenant whose fields all match ends the step `ok`,
    and the step result holds only the closed fields of the event data schema (OUT-1), which later
    steps read by reference; the timeout ends the step `failed(await_timeout)`, and the run goes on
    by `on_failure`. The end of such a step releases the next steps as any step end does (trigger
    `script`); a waiting record ends at most one step. A run whose script has a `wait` or `await`
    step has the deadline `Tenant.spec.scripts.wait_run_deadline` (7 days by default, the farm
    ceiling); other runs keep `run_deadline` (6 hours). A paused run (SCR-10) keeps its waiting
    records, and a step that ends during the pause releases nothing until the run resumes; a
    cancel or the run deadline ends the record and the step is `canceled`. `apply` and draft
    acceptance reject a `wait` or `await` step with missing or foreign fields or a duration above
    the deadline (`script_wait_fields`).
  goal: G1
  check: [lint, blackbox]
  waivable: false
  version: v0.2
  profile: campaign
  decisions: [D-41]
  fixtures: [manifests/v02-group1-lints, blackbox:script/wait-await]
  doc: docs/coordination.md

- id: SCR-14
  title: A script from git with parameters and a free goal
  status: deferred
  deferred: 2026-10-14
  reason: 'Scripts from git with parameters are a second launch path next to the translator; not needed before the pilot.'
  return_when: 'A tenant needs a reviewed script with parameters.'
  mechanism_removed: false
  text: >-
    A `kind: Script` manifest reviewed in the tenant's git may declare `params`: at most 16 named
    parameters, each of type integer, number or boolean, or a string with `enum` or a format from
    `formats.yaml` (there is no free string, INJ-1), with an optional `default`. Steps use a
    parameter only as a whole value `{param: <name>}` in `params`, `args` and `await.match`. Only
    such a script may declare `goals`: free goal texts of at most 2000 characters, reviewed in git
    and used without substitution, which an agent step names with `goal: {template: <id>}`; a name
    may not repeat a goal template of the step's type. A draft from the model or an improvement
    proposal with `goals`, `params` or `{param}` is rejected at acceptance with `script_free_goal`
    (SCR-4, SCR-5). A person starts a script from git with a command from `Tenant.spec.script_commands`
    (`/<command> key=value ...`): the core checks each value against the declared parameter, a
    missing one takes its `default` and without a default the command is refused with
    `script_param_invalid`; then it accepts the script like a draft (SCR-5) with the person as the
    initiator and creates the run in `proposed` with the `script_confirm` card, and the button and
    its checks are those of SCR-6. The run record keeps the manifest name and its commit, and
    `plan_hash` covers the parameter values. A schedule starts a script from git only with the
    default values (SCR-12). `apply` rejects an undeclared or free parameter, a `{param}` that
    names no declared parameter, a goal name that is in neither list or in both, and a script
    command that takes a built-in or a tenant command (`script_param_invalid`, `builtin_command`).
  goal: G1
  check: [lint, blackbox]
  waivable: false
  version: v0.2
  profile: campaign
  decisions: [D-15, D-71, D-104]
  fixtures: [manifests/v02-group1-lints, blackbox:script/git-command]
  doc: docs/coordination.md

- id: SCR-15
  title: Rollups and selections over the items of a fanout step
  status: deferred
  deferred: 2026-10-14
  reason: 'Conditions over rollups of fanout items and the selection of items by a result are more than the first operations tasks need; SCR-3 keeps eq, ne and in over closed fields of a step with one result and over the step state (D-114).'
  return_when: 'An assignment of the pilot needs to act only on the items of a fanout step that a result selects.'
  mechanism_removed: true
