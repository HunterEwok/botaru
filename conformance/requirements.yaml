- id: INS-7
  title: An optional "Useful" button under a bot's answer
  status: active
  text: >-
    With `attention.answer_feedback: true` in the Tenant manifest, the core plans, once a bot's
    answer to a work task went out to the person who asked in a direct chat, a card `task_answer`
    with the buttons "Useful" and "Not needed" through P1 `card.feedback`. Pressing is optional and
    changes nothing but the numbers below. The card goes only into the room the person's daily card
    limit (APR-15) has left: decision cards and manager notices count first and never wait for it,
    and it is left out, not deferred, once those and the day's answer cards reach the limit. An
    analysis task of the
    tenant gets the extension field `answer_feedback` (MAN-3): per task type of the last 30 days the
    cards sent and the "Useful" and "Not needed" presses, closed numbers only. Without the setting
    nothing changes.
  goal: G5
