- id: DSP-2
  title: The claim decision is deterministic
  status: active
  text: >-
    The `claim` decision is deterministic: it depends only on the conditions of the closed list
    `dispatch-predicates.yaml` and the ordering keys (priority class, fairness key from v0.2 by
    DSP-6, enqueue time, task id). The task body, messages, model output and the self-report `state`
    are not part of it; no model is called. The core writes `fairness_key` on every task from v0.1
    (D-98) as `<kind>:<id>` from the task source: `campaign:<campaign>` for a campaign item,
    `root:<root task>` for any child, `route:<route>` for a route or wake-up task,
    `schedule:<schedule>`, `script:<run>` for a script step, `interactive:<principal>` for a
    person's or program's direct request, and `system:<purpose>` for any other task that the core
    creates itself (a lens review, an incident, inspection or daily review task, a grant batch); a
    continuation keeps the key of its source, and a redrive and an action task after approval keep
    the key of the original task. So every task has a key. Check: fixture `fx-dsp-08` seeds two test
    benches in the same way through the ordinary paths and expects the same `claim` answer on both.
    A third bench differs only in the task body, a `state` self-report and the note of a message in
    the inbox, and the answer is unchanged. On each bench P2 `task.show` returns `fairness_key`
    `interactive:<principal>` for a person's request. Lint at `apply` checks that every condition
    referred to by the tenant policy `Tenant.spec.dispatch` is in the `dispatch-predicates.yaml`
    list of the version that the implementation declares (`conforms_to`).
  goal: G1
  check: [fixture, lint]
  waivable: false
  version: v0.1
  profile: core
  decisions: [D-14, D-98]
  fixtures: [fx-dsp-08]
  doc: docs/coordination.md

- id: DSP-3
  title: The list of conditions is closed, a policy only narrows
  status: active
  text: >-
    The list of dispatch conditions is closed (`dispatch-predicates.yaml`); a new condition is
    introduced only through an ADR. The tenant policy `Tenant.spec.dispatch` and its rules only
    narrow dispatch (assign a group, lower a class, set ceilings) and match only by the name or name
    prefix of the type and the kind of the task's source; dispatch cannot be widened beyond
    `claims`, `requires` and TEN-3. Besides dispatch, a rule can set for its type in the tenant the
    attempt deadline (no more than twice the type's deadline and not beyond the task's `deadline`)
    and the number of attempts (only fewer than the type has, and no fewer than 1, FEN-3). Lint at
    `apply` checks that the rule's group exists and its selector intersects with the roles that take
    the type, and that the attempt settings are within these bounds.
  goal: G2
  check: [lint, fixture]
  waivable: false
  version: v0.1
  profile: core
  decisions: [D-14]
  fixtures: [fx-dsp-10]
  doc: docs/coordination.md

- id: DSP-4
  title: Only the core assigns work to a specific worker
  status: active
  text: >-
    Nobody but the core assigns work to a specific worker. The schemas of P1 `enqueue`, P3
    `enqueue_child`, a campaign proposal, a route template and a script step have no worker field;
    the schema rejects a request with one. The field `to.group` only narrows dispatch: a task with
    `to_group` goes only to a member of this bot group (D5). The model picks a group from an `enum`
    that the core builds from the role's `may_target_groups` intersected with the groups able to
    take the type; another tenant's group, a nonexistent group and a disallowed group get the same
    `rejected(group_invalid)`. The only path for a task with an assigned worker belongs to the core:
    the control operation `pin_task` (MGR-12), which the holder of the farm manager seat calls
    through C1 `control.apply`, and people through P2 by the same code path; pinning by people is an
    operator operation through `farmctl` (PRM-14). A pinned task goes in the `control` lane in class
    1, with fencing and audit. Seat tasks and bot identity tasks are not assigned to a worker but
    dispatched by binding. A task of the purpose `manage` goes only to a worker of the seat's role
    enrolled in the task's tenant, while the seat is in `held`; the core writes the seat epoch into
    the attempt, and an attempt with an old epoch gets `fenced` (D15, MGR-1). A bot identity task
    with its memory, session, inbox or tools goes only to the worker of its binding with the current
    bot epoch, and a clean-context task to a worker of the role named by IDN-12 (D20).
  goal: C2
  check: [fixture, blackbox, lint]
  waivable: false
  version: v0.1
  profile: core
  decisions: [D-14, D-32, D-80]
  fixtures: [fx-dsp-01, fx-dsp-04, inj-peer-mgr-02, inj-peer-mgr-01]
  doc: docs/coordination.md

- id: DSP-5
  title: Priority classes are strict
  status: active
  text: >-
    Priority classes 1-5 (`control`, `interactive`, `normal`, `batch`, `background`) are strict: a
    task of a higher class is handed out before any task of a lower class. Only the core's `control`
    lane sets class 1: control operations of people with the right and of the farm manager seat
    holder (for example, the pinning `pin_task`, MGR-12) and urgent tasks enqueued by core code (for
    example, a seat task for an open incident); class 1 never comes from a request, a route or a
    type. The type sets the class (`dispatch.priority_class`); a request can only lower it, and a
    child and a campaign item are no higher than the parent. The core sets class 2 only for a
    person's direct request and `interactive: true` on the type.
  goal: G1
  check: [fixture, blackbox]
  waivable: false
  version: v0.1
  profile: core
  decisions: [D-14]
  fixtures: [fx-dsp-02]
  doc: docs/coordination.md

- id: DSP-6
  title: Fairness within a class
  status: active
  text: >-
    Within one class, `claim` hands out the next task from the fairness key with the smallest number
    of running attempts divided by the weight of its kind in `Tenant.spec.dispatch.fairness.weights`
    (a kind without a weight has 1; a key of weight 0 gets work only when no key with a higher
    weight has a waiting task in the class); a tie goes to the key whose oldest waiting task was
    enqueued first, then to the smaller task id. The core writes the key from v0.1 (DSP-2, D-98).
    Until v0.2 the order within a class is the enqueue time.
  goal: G1
  check: [fixture]
  waivable: true
  version: v0.2
  profile: core
  decisions: [D-14, D-98]
  fixtures: [fx-dsp-03]
  doc: docs/coordination.md

- id: DSP-7
  title: Pressure is expressed by counters, no work is lost
  status: active
  text: >-
    Pressure is expressed by counters, not by losing work. At enqueue, the tenant's queue ceiling
    `max_queued` (CAP-1) gives `rejected(over_capacity)` with `retry_after_s`, and the idempotency
    key is not taken. At dispatch, `max_running` per (tenant, type) applies, and from v0.2 also the
    bot group's `max_running` and the rule's `max_share` (DSP-11); a task above the ceiling waits in
    `submitted` with a `waiting_reason` from a closed list. Work is not silently thrown away, and no
    attempt is spent because of pressure.
  goal: G1
  check: [blackbox, fixture]
  waivable: false
  version: v0.1
  profile: core
  decisions: [D-14]
  fixtures: [fx-dsp-05]
  doc: docs/coordination.md

- id: DSP-8
  title: An empty group waits, an unclaimed task raises an alarm
  status: active
  text: >-
    A task for an empty or busy bot group waits in `submitted` with a `waiting_reason`; there is no
    overflow to workers outside the group. A task that nobody took before `start_by` stays in
    `submitted` and raises the alarm `alarm.task.unclaimed`; core code (the `deadline` loop) raises
    the alarm under the common alarm schema (OBS-6), and the monitoring system passes it to people
    (MON-1).
  goal: G4
  check: [blackbox, fixture]
  waivable: false
  version: v0.1
  profile: core
  decisions: [D-14, D-62]
  fixtures: [fx-dsp-11]
