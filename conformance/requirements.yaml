- id: PRM-3
  title: A check at every point without caching
  status: active
  text: >-
    Permissions are checked at every point: enqueue, claim, tool call, action request, human
    decision and opening "Details", action execution, delivery, sending and reading messages,
    reading a task, result and file, reading and writing memory, a P2 operation. A refusal at a tool
    call is mandatory even if the catalog is wider (RT-4). C2 decisions are not cached between
    points. A permission revoked from an initiator gives its tasks `canceled(rights_revoked)`, a
    disabled initiator gives `canceled(person_inactive)`; waiting decisions are canceled the same
    way (APR-6).
  goal: G2
