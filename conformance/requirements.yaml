- id: AUD-1
  title: An audit record for every decision
  status: active
  text: >-
    There is an audit record for every decision at the permission check points, every tool call,
    every approval and other human decision on a card (including "Lift veto"), every delivery, every
    refusal at enqueue, every admin change and every `apply` (with the commit number or the author
    of the command). Also recorded are setting and lifting a hold, operations of the manager and
    escalations to it, grants and returns of permissions, opening and closing an incident, a
    decision on an incident link, case transitions, the choice of the leaver, a change of seat
    holder, a transfer of facts to a successor, reading content for incident review, people's data requests and
    erasures, and every audit read; records about the manager, cases and seats appear together with
    these objects (D-71). Handouts of raw journals, tenant mismatches and secrets found are marked
    separately.
  goal: G2
  check: [blackbox]
  waivable: true
  version: v0.1
  profile: core
  decisions: [D-71, D-80]
  fixtures: [blackbox:core/audit-every-decision]
  doc: docs/permissions.md

- id: AUD-2
  title: Only metadata in journals
  status: active
  text: >-
    Audit, events, the transition journal, usage and process telemetry hold only ids, sizes, hashes,
    times, codes and arguments from an `enum` or the catalog. Free argument text (for example the
    sandbox `argv`) is stored as a hash and a length. There are no message texts, output, memory
    content, secrets or external ids. Lint checks the `event-data` schemas and the schemas of bot
    message fields that reach the journal: no `goal` fields, artifacts or strings without an `enum`
    or id format. Free bot text (notes of messages, findings and proposals) is stored in the
    retention class `content`. Content lies only in deletable stores with an expiry: task bodies,
    artifacts, sessions, memory, files, attempt journals. A canary check covers all append-only
    stores.
  goal: C6
  check: [lint, blackbox]
  waivable: false
  version: v0.1
  profile: core
  decisions: []
  fixtures: [blackbox:core/append-only-canaries, blackbox:decision/event-fields]
  doc: docs/permissions.md

- id: AUD-3
  title: Audit is append-only
  status: active
  text: >-
    Audit and the transition journal are append-only: a single record cannot be changed or deleted.
    They are deleted only as whole periods (months) by the retention loop, by the expiry of the
    `metadata` class. The core writes audit under a store role that has only insert and read on the
    audit table; the table owner is a separate migration role that the core does not use.
  goal: G2
  check: [impl]
  waivable: false
  version: v0.1
  profile: core
  decisions: []
  fixtures: [impl:internal/store/TestMigrateAndInit]
  doc: docs/permissions.md

- id: AUD-4
  title: The attempt journal is only in a deletable store
  status: deferred
  deferred: 2026-10-14
  reason: 'The attempt journal for debugging is not needed before the pilot; it returns together with APR-8 and its default prohibition for production.'
  return_when: 'Debugging a task needs its recorded journal.'
  mechanism_removed: false
  text: >-
    The core writes the attempt journal (model requests and responses as P4 saw them, and tool calls
    with wrapped output as P3 saw them). It is stored only in a deletable store of class `content`,
    with the tenant's expiry `retention.journals` and the task's mark; it does not reach audit,
    events or the model context, and only an operator reads it, through P2 `task.journal` with
    `admin:debug` and `data:<mark>`. Operator reading of the journal is governed by the tenant field
    `operator_access.debug_journal: deny | notify | allow` (default `notify`): with `deny`, P2
    `task.journal` answers `forbidden`; with `notify`, every read writes an audit record and sends
    the tenant admins a code message without content; with `allow`, only an audit record. Debug
    replay (APR-8) is decided by the same field. For a tenant with `kind: production` the journal is
    off until the tenant sets an expiry; for a test tenant the default expiry is 7 days.
  goal: G5
  check: [blackbox]
