    catalog: `/tasks` from `carol` shows only her tasks with the `title` of types; `/team` from
    `alice` with `team.view` shows the tasks of group `lab` without usage by person; `/cancel` from
    `bob` on a foreign task gets `forbidden`.
  goal: G6
