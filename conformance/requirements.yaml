- id: PRM-4
  title: The task type sets the tier
  status: active
  text: >-
    The task type sets the tier; groups have no tier. `max_tier` equals the type's tier and is not
    higher than the parent's. A tool can be called only if it is in the role's `tools`, it has
    `access: read`, `tier <= max_tier`, and the output class (the maximum of `output_class` and the
    resource class in the catalog) is not above `data_mark`. Tier 3 is never available to the model:
    it can only ask (APR-1). Tier 2 exists from v0.2 and only in the sandbox (SBX-1).
