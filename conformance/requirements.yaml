- id: ORC-11
  title: A hold pauses campaigns
  status: active
  text: >-
    A hold (HLD-1) whose scope covers a campaign or its items and whose effect forbids their release
    or execution (`no_enqueue`, `no_claim`, `no_action` or `cancel_running`) pauses the affected
    campaigns in the same transaction with reason `held`. In its scope new `request_action` calls
    and proposals of campaigns with an action are rejected (`held`), and waiting approvals are
    canceled (HLD-3). There is no separate stop valve for campaigns. Released write calls are not
    revoked, and their results are recorded. Releasing the hold does not resume campaigns: they stay
    paused until an explicit decision by a person.
  goal: G2
  check: [blackbox]
  waivable: false
  version: v0.1
  profile: campaign
  decisions: [D-14]
  fixtures: [fx-orc-05]
