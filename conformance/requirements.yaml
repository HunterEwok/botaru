- id: IDN-6
  title: Code chooses the task type, not the model
  status: active
  text: >-
    Channel code chooses the task type for a person's message (a command from the tenant's
    `commands`, `/run`, `default_types`), and the route manifest sets the task type of a route; the
    model does not choose the type. Exception: the model (the translator or the proposal author)
    chooses the type of a script step, but only from a dictionary that the core built from the
    author role and the initiator's permissions, and the run starts only after the initiator's
