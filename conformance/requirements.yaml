- id: MEM-6
  title: A fact with a closed schema
  status: active
  text: >-
    A fact is a record of the `bot` scope under the closed schema `spec/model/fact.schema.json`. The
    model proposes only the kind, the predicate and the subject from the registries
    `fact-kinds.yaml` and `fact-predicates.yaml`; the window and the sampling rule are set by the
    predicate (in v0.1 the window is 14 days for every predicate with a window, and `min_samples`,
    the tolerance and the share threshold are decided by the predicate's ADR at implementation), the
    core collects the evidence and computes the value, and the schema rejects window, evidence and
    value fields in a model proposal. There are three kinds: `where` (`dataset.stored_on`,
    `tasktype.touches`), `how_long` (`task.duration.p95_min`, `disk.days_to_full`) and `what_broke`
    (`incident.happened`, `task.fails_with`); a new kind or predicate is introduced only through an
    ADR. The subject is only a catalog resource, a task type, a dataset or a schedule of this
    tenant; an identity, a seat, a principal and a proposal cannot be a subject. Evidence is objects
    of the same tenant, not erased and available to the role of the space owner; if there are fewer
    than `min_samples`, the fact is not created: only the event `fact.rejected` with reason
    `fact_insufficient` remains. The fact's `data_mark` equals the highest mark of the evidence and
    is not above the space ceiling; a fact is inserted and offered only into a task with a mark not
    lower than its own. A task type declares `memory.facts: propose`; one attempt yields no more
    than 3 facts (`memory.facts.per_attempt`); the core writes them at `complete` in the same
    transaction, and a failed, canceled or `fenced` attempt leaves no facts. A fact from an attempt
    with `untrusted_seen` gets `untrusted_origin: true`; tasks with purposes `review` and `manage`
    get only facts with `untrusted_origin: false`. Reading a fact (`memory.read: bot`) does not set
    `untrusted_seen`. At a transfer offer and at acceptance the core rechecks the evidence and the
    value: erased evidence moves the fact to `stale`, a mismatch gives `fact_mismatch`. A space
    holds no more than 100 active facts (`memory.facts.max_active`); on overflow the fact with the
    oldest `last_used_at` is evicted.
  goal: G1
  check: [fixture, blackbox]
  waivable: false
  version: v0.1
  profile: governance
  decisions: [D-28, D-35]
  fixtures: [mem-fx-01, mem-fx-02, mem-fx-05, mem-fx-06]
  doc: docs/bots.md

- id: MEM-7
  title: Facts pass to the successor, rechecked by code
  status: active
  text: >-
    On identity retirement (IDN-11) or a change of its binding, the core creates a fact offer
    (`FactOffer`): only active facts, rechecked at creation, no more than `offer.max` (100), only in
    the same tenant and only to the successor; neither a person nor a model chooses the facts. The
    successor is the new identity of the same worker; without a live worker, the first identity that
    people enroll in the same role in the same tenant before the seal ends; for a seat holder, the
    next holder of the same seat, and for the farm manager seat with a separate offer for the
    section of each tenant (MGR-27). Other identities of the role do not get the facts, and when a
    role is deleted or a tenant offboards there is no successor. Core records, the track record,
    sessions, the inbox and records of another tenant are never offered. The offer stays open until
    the end of the leaving identity's seal (`open_until`); without a successor by then, the facts
    are erased together with the seal. When the successor exists, the core in one transaction
    rechecks each fact under MEM-6 with the permissions of the successor's role, copies the facts
    that pass, the most recently used first, into the successor's space in state `active` with the
    mark `inherited` while the space has room (`memory.facts.max_active`), and closes the offer; a
    role whose profile has no `bot` memory gets nothing (PRF-1, MEM-2). A copy keeps
    `untrusted_origin` of its fact, so a fact from an attempt with `untrusted_seen` stays marked.
    People do not approve the transfer; P2 and the summary show only numbers.
  goal: G1
  check: [blackbox, fixture]
  waivable: false
  version: v0.1
  profile: governance
  decisions: [D-27, D-28, D-33, D-114]
  fixtures: [gov-mem-03, mem-fx-03, mem-fx-04, gov-mem-04]
  doc: docs/bots.md

- id: MEM-8
  title: The newcomer picks the facts itself
  status: retired
