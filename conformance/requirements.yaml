- id: SEC-1
  title: Secrets do not go through ports
  status: active
  text: >-
    Secret values do not pass through P1-P4: no port schema has a field for them. A secret does not
    enter the model context, the sandbox, the audit, events, logs or the result. A manifest names a
    secret only by name.
  goal: G2
  check: [fixture, blackbox]
  waivable: false
  version: v0.1
  profile: core
