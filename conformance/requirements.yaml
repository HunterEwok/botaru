- id: PRM-6
  title: Permissions do not grow along a chain
  status: active
  text: >-
    Permissions do not grow along a chain. A child task is enqueued only with the built-in tool
    `enqueue_child` with a type from the role's `may_enqueue`. Depth is no more than 5 and continues
    through messages, wake-ups, continuations, campaign items, script steps and seat tasks (the
    depth floor from what was read): a seat task for an escalation or an incident gets the source
    depth plus 1, and a task enqueued by a seat operation another plus 1. One task has no more
    children than `max_children`, and only `enqueue_child` is counted. No more tasks from one root
    than `max_tree_tasks` (farm 1000, tenant 300); the root is the `correlationid` of the original
    tree that messages and wake-ups carry onward (MSG-11). A child's tier is not higher, its mark
    not lower, and the tree's usage comes from one tree limit (BUD-1). The attempt's permissions are
    intersected with the permissions of each initiator from its set, including the initiators of
    everything read (MSG-7).
  goal: G2
  check: [blackbox, fixture]
  waivable: false
  version: v0.1
  profile: core
  decisions: []
  fixtures: [blackbox:model/child-type-not-allowed, blackbox:model/chain-too-deep, fx-msg-launder]
  doc: docs/permissions.md

- id: PRM-7
  title: One can grant only what one has
  status: active
  text: >-
    One can grant only a group whose capabilities are fully contained in the grantor's capabilities.
    Privileged groups (PRM-13) are granted only by an operator through `farmctl`. An invitation is
    single-use and has an expiry; when it is used, the core checks again that the creator is active
    and can grant these groups. An asterisk is allowed only at the end of `task:<prefix>.*`, is
    compared by prefix after the dot and never covers `action.*`; there is no asterisk in
    `action.request`, `action.approve`, `admin`, `data` and in decision permissions. There are no
    permissions in the farm to receive and acknowledge alarms: the monitoring system delivers alarms
    to people, and who receives and acknowledges them is set there (MON-1).
  goal: G2
  check: [blackbox, lint]
  waivable: false
  version: v0.1
  profile: core
