- id: PRM-11
  title: A dry run without side effects
  status: deferred
  deferred: 2026-10-14
  reason: 'A dry run is a convenience for programs; it returns together with its prohibition for workers.'
  return_when: 'A program needs to check an enqueue without creating a task.'
  mechanism_removed: false
  text: >-
    P1 `enqueue` with `mode: validate` passes all enqueue checks, but creates no record, does not
    take the idempotency key and reserves no budget; the core writes an audit line with a dry-run
    flag. For something foreign or nonexistent the dry run answers the same as a real enqueue. The
    answer (type, `max_tier`, `data_mark`, the decision and reason, the budget estimate) goes to the
    calling principal in the `validate` block of the response, not to the model. The built-in tool
    `enqueue_child` has no `mode` parameter, and a P1 `enqueue` with `mode: validate` from a caller
    that holds an attempt or lease token (a worker in an attempt) is refused with `forbidden`, so
    code next to a model cannot probe with it. A dry run counts against the enqueue limits of the
    tenant and the caller (`max_enqueue_per_hour`, CAP-1) like a real enqueue, so it cannot flood
    the audit.
  goal: G1
  check: [blackbox]
  waivable: false
  version: v0.2
  profile: core
  decisions: []
  fixtures: [blackbox:core/enqueue-validate]
  doc: docs/permissions.md

- id: PRM-12
  title: Tool output cache
  status: active
  text: >-
    If an implementation caches tool output, it caches only plugin tools with `access: read`, never a
    tool with `credential: per_principal` (SEC-7; `apply` rejects `cache_s` on such a tool,
    `cache_per_principal`) and never a built-in tool with `changes_state`. An answer from the cache
    is returned only after a full check of the current call (PRM-3). The cache key includes the
    tenant, plugin, tool, arguments and catalog version. The expiry is set by the tool manifest
    (`cache_s`, 0 by default, that is no cache). The cache keeps the flags that the original call
    gave (`personal_seen` with its sources and `personal_subjects`, AUD-5) and applies them again to
    the attempt of every hit. Output from the cache stays untrusted and sets `untrusted_seen`. Audit
    and usage lines are written with the flag `cached`. The cache of a tenant is purged by an erasure
    request (RET-7) of that tenant, by deletion of a corpus document (KNW-5), and by a hold with
    `no_tool` on a scope that covers the entry.
  goal: G1
  check: [blackbox]
  waivable: false
  version: v0.2
  profile: core
  decisions: []
  fixtures: [blackbox:toolhost/output-cache, manifests/v02-security-lints]
  doc: docs/permissions.md

- id: PRM-13
  title: Only an operator grants privileged permissions
  status: active
  text: >-
    `farmctl apply` itself computes the `privileged` attribute of each group and prints it. A group
    is privileged if it has at least one of: `action.request:<a>` or `action.approve:<a>`; any
    `admin:<area>`; a data class above `internal`; a task type of tier 1 and higher; any decision or
    control permission (`proposal.decide`, `proposal.override_veto`, `proposal.gate`, `hold.set`, `hold.release`,
    `control.apply`, `control.approve`, `script.run`, `incident.manage`, `model_grant.manage`,
    `governance.confirm`, `governance.attribute`, `task.takeover`, `manager.direct`, `audit.read`
    and any other permission that the decision registry (APR-12) names a decision permission).
    `apply` rejects a set of manifests in which an ordinary group became privileged. A privileged
    group is granted only by an operator through `farmctl` (P2 `grant` or `invite` with operator
    credentials): the person tells the operator the verification code by voice or in person, and
    until the code is checked the membership is in state `pending`. In a tenant of kind `production`
    the grant requires a written request by an admin of that tenant, a person other than the
    granting operator (`--requested-by`). There is one exception: the operator invites the first
    admin of a tenant that has no active principal with `admin:people` yet without `--requested-by`;
    the verification code check is mandatory here too. About every grant and removal of a privileged
    group all tenant admins get a private message; they also get the notice `principal_left` when a
    person is disabled or removed for good (IDN-13). An invitation and `/grant` in a channel grant
    only ordinary groups. The tenant admin grants the groups from the tenant field
    `delegated_groups` themselves (PRM-16).
  goal: G2
  check: [lint, blackbox, fixture]
  waivable: false
  version: v0.1
  profile: core
  decisions: [D-40, D-62]
  fixtures: [blackbox:channel/grant-privileged]
  doc: docs/permissions.md

- id: PRM-14
  title: Operator operations only through farmctl
  status: active
  text: >-
    An operator operation is accepted only through P2 with operator credentials (`farmctl`) and
    never with channel credentials: not by a chat command, not by a card button, not on behalf of a
    person. Operator operations are a closed list: the P2 rows with `operator_only: true` in
    `spec/ports/operations.yaml` (D-114). The list holds everything that needs a
    capability in the service tenant `farm`, including `restore.complete` and `audit.verify`;
    `apply` (a tenant is declared in git by the file `tenants/<name>/tenant.yaml` and appears after
    `farmctl apply`, there is no separate operation to add a tenant); operations on workers,
    external program keys and the `system` principal; group chat binding `chat.bind`; `budget.set`;
    dead work redrive `task.redrive` and `delivery.redrive` in any tenant; grant and removal of
    privileged groups and invitations to them; disabling and re-enabling (`principal.off`,
    `principal.on`), identity change (`principal.set_identity`) and offboarding
    (`principal.offboard`) of people with such groups; a hold of scope `farm` and its release;
    `seat.*`, `bot.retire`, `bot.show --sealed`, a hold of scope `seat` and its release,
    `control.revert` for a period (`since`), `control.apply:pin_task` and `control.apply:preempt`
    from people, `core.drain`. From v0.2: the tenant lifecycle (`tenant.suspend`, `tenant.offboard`,
    `tenant.delete`), `tenant.export`, `principal.export`, `task.journal`, `task.replay`. P2 rejects
    a call of such an operation with channel credentials with reason `operator_only`, and a channel
    that got such a command in a chat answers with ready text and calls nothing. A card or a notice
    about a matter decided by such an operation (for example `manager_stopped`) shows a ready
    `farmctl` command from code instead of buttons. Operations of people of their own tenant outside
    this list (holds of their own scopes, reverting the manager's operations for one incident, a
    directive to the manager, incident decisions) are passed by the channel to P2 on behalf of the
    verified person and within their permissions (IDN-7, PRM-15).
  goal: G2
  check: [blackbox, adapter, fixture]
  waivable: false
  version: v0.1
  profile: core
  decisions: [D-33, D-80]
  fixtures: [adapter:channel/operator-command, adapter:channel/no-operator-ops]
  doc: docs/permissions.md

- id: PRM-15
  title: People's commands only in a private chat
  status: active
  text: >-
    P2 commands on behalf of a person (for example people management `/invite`, `/people`, `/grant`,
    `/ungrant`, `/off`, `/on`, hold commands, a directive to the manager `/manager`, revert
    `/control revert`, requests about one's own data `/mydata`, initiator commands `/tasks`,
    `/status <number>`, `/cancel <number>`, `/help`, `/me`, the lead command `/team`, the command
    `/service <verb> <service>`, language choice `/lang <language>`) and text decision commands in a
    channel without buttons are accepted by the channel only in a private chat with the bot. In a
    group chat the bot does not run such commands and answers with the ready text "this command can
    only be given in a private chat with the bot". Exception: the bot answers `/help` and `/about`
    in a group chat too, because they only read and call no P2 operations; `/help` in a group shows
    the commands of this chat and reminds that the rest are given in a private chat. A decision in a
    group chat is possible only with a card button and only with `membership_assurance: enforced`
    (APR-4).
  goal: G2
  check: [adapter, blackbox]
  waivable: false
  version: v0.1
