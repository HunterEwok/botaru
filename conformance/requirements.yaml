- id: MGR-17
  title: Model grant request and signs not from its own attempts
  status: active
  text: >-
    An executor asks for a stronger model only with the built-in tool `request_model_grant` (a `job`
    worker through P1 `grant.request`), and the tool is present in an attempt only if the role has a
    ladder `model_grants.ladder` and the tenant's `grant` budget line is greater than 0. The fields
    are closed (`reason`, `evidence`, `requested_profile`, `benefit`, `attempts`, `note`); the
    profile is from the ladder ∩ those allowed to the tenant, never the seat profile; one request
    per task. Code derives the right to ask only from signs that the model does not control (initial
    input above `grant.input_tokens_min` of the task type, or the type's history), not from failures
    of this attempt; without a sign the request gets `grant_not_eligible`. The sign "input above the
    threshold" is counted only from the task's initial input: the body, attachments and blocks that
    the core inserted at enqueue (facts, instructions), without tool output and without context the
    attempt gathered itself; the reason `context_too_large` is accepted only when the initial input
    is above `grant.input_tokens_min` of the task type. The sign "type history" is counted in only
    one of two ways: by code, when the `EvalReports` entry of the type's fixed set of inputs
    (`grant_eval_set` in git) run on the base model has `base_fail_share` not below
    `grant_limits.eval_fail_share_min` (0.3 by default), or by a human mark `grant_eligible: true`
    in the type manifest. No sign of the right to a stronger model depends on signals produced by
    attempts of the executor itself, its role or its profile. The failure share of the type's work
    attempts is only shown to the seat holder. Code checks the evidence, the price, the budget and
    the rate: no more than 3 grant requests per day are accepted per role in a tenant
    (`grant_limits.requests_per_role_day`, 3), and extra ones get `grant_rate_limited` without a
    task for the manager. The call answers only `{staged: true}`, the attempt ends without spending
    with `awaiting_model_grant`, and the task waits with `model_grant_pending`.
  goal: G3
  check: [fixture, eval, lint]
  waivable: false
  version: v0.2
  profile: manager
  decisions: [D-18, D-21]
  fixtures: [mgr-inj-02, gov-res-01, gov-res-sandbag-01, mgr-grant-inflate-01, fx-mgr-09, gov-res-sandbag-02, mgr-02]
  doc: docs/farm-manager.md

- id: MGR-18
  title: "Grant, the batch of grant requests and the model gateway"
  status: active
  text: >-
    A grant is decided by the seat holder with the current epoch (`grant_decide`) or by a person
    with `model_grant.manage` through P2 `model_grant.issue` within the same line; a person can
    revoke it through `model_grant.revoke`. The `grant` loop enqueues every 10 minutes, for each
    tenant with at least one grant request in `pending`, one task `manager.grants.v1` for the farm
    manager seat (condition D15) with the key `system:grants:<tenant>:<window>`, where the window is
    the UTC start of the 10-minute interval, and class 3. A tenant with `farm_manager.enabled:
    false`, or a seat that is not `held`, gets no task: its requests wait for a person with
    `model_grant.manage`. The task carries no request text; `grants_pending` returns only the closed
    fields of the tenant's pending requests, and `grant_decide` decides them in one batch with the
    current epoch. Both act only on the tenant of the task: a decision on a grant of another tenant,
    or on one that is not `pending`, gets `not_found` for that item and changes nothing. The grant
    record: `kind: grant`, task, role, profile, no more than 2 attempts, the amount `cap_eur` (in
    euros, stored in euro cents, BUD-9), an expiry of no more than 6 h, line `grant`, who decided, a
    distrust flag. The code ceilings (attempts, expiry, line `grant`, the seat's daily grant ceiling
    `seat_grants_eur_day` from `farm_manager.grant_limits` of the farm charter) apply to any
    decision, including every other item of a batch, and in distrust mode (MGR-22) a grant goes only
    to the first step of the ladder. Before each call under a grant, P4 reserves the worst case in
    the remainder of `cap_eur` and in line `grant` (GW-2); a call that does not fit does not start,
    the attempt is not spent, and the grant moves to `consumed`. The output limit is set by the
    profile's `max_output_tokens`. P4 allows a model only by the slot rules of GW-7: the role's slot
    (`base`, `analysis`), an active grant of this task (`granted`), or the `seat` slot (attempts on
    behalf of the seat with the current epoch, and shadow review attempts of COM-10). A grant does
    not change tools, tier, permissions or other budget lines, ends together with the task and does
    not enter the track record. A request that a batch leaves undecided stays `pending` for the next
    window or a person. No decision within `grant_wait_max` (15 minutes): refusal
    `grant_expired_unanswered`, and the task continues on the base model.
  goal: G3
  check: [adapter, blackbox]
  waivable: false
  version: v0.2
  profile: manager
  decisions: [D-18, D-21, D-107]
  fixtures: [fx-mgr-08, fx-mgr-09, mgr-02, mgr-03, blackbox:manager/grant-batch]
  doc: docs/farm-manager.md

