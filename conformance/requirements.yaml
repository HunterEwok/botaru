- id: GOV-38
  title: Code finds a link between an incident and a rejected proposal
  status: active
  text: >-
    Only code creates a candidate link of an incident to a proposal the commission rejected: an
    attribution record of `kind: rejected_proposal` (`spec/model/attribution.v2.schema.json`) under
    the rules `rejected_direct` and `rejected_dependency_1` of `spec/model/attribution-rules.yaml`.
    A candidate exists only if all hold: the proposal changes something (not kind `none`); the
    commission's verdict was `dismissed` (veto, below the minimum, low score) or `parked(score)`
    that expired, earlier than the incident opened and not earlier than 90 days before; the incident
    subject is among the subjects of the proposal's problem and is the target of the change or one
    dependency step away from it in the catalog (the same steps as GOV-13); the problem code is in
    the `problem_codes` of the incident class (MGR-55); the problem names no more than 3 subjects.
    There is never a candidate for an incident whose cause a person recorded as external
    (`external_load`, `attack`), for a proposal with `untrusted_seen`, for a proposal whose author
    is the farm manager seat holder (`origin.level` 2), or when the alarm series of the incident was
    written in the 7 days before it by the author or its role with a share of 0.3 or more (as
    PRP-22). One proposal gives at most one case, one incident at most 3 candidates, and one author
    role at most 2 cases in 90 days. The model takes no part in finding a candidate.
  goal: C1
