- id: CAP-4
  title: Dead work and schedule pause
  status: active
  text: >-
    `deadletter.list` also returns groups by (tenant, type, reason) with a count and the first and
    last time. A schedule whose last `K` slots in a row ended with `attempts_exhausted` or
    `runs_exhausted` (`K` = 3, the `threshold` of the auto-stop entry in `spec/model/holds.yaml`)
    gets an auto-stop: a hold on scope `schedule` with effect `no_enqueue`, reason
    `schedule_failing`, author `contain_auto`, no `until`, and the alarm `alarm.hold.auto`; later
    slots are skipped with `held` (TIM-3). A tenant admin or the operator releases it (HLD-2).
    `redrive` of a task whose body was deleted by its period answers `gone` (RET-3).
  goal: G6
  check: [blackbox]
