- id: HLD-1
  title: A hold as a recorded and visible object
  status: active
  text: >-
    A hold (`Hold`) is a recorded object: a scope from a closed list, effects from
    `spec/model/holds.yaml`, a reason from `reasons.yaml`, an expiry `until` (or no expiry, until
    lifted) and an author. The core writes the id, author, source and recording time. A hold on the
    scopes `farm` and `seat` is a record of the service tenant `farm`; a hold on any other scope is
    a record of the tenant of its scope (TEN-1). C2 checks active holds at every check point (PRM-3)
    before the permission formula, as a non-waivable ban (PRM-2); the model gets a short refusal "no
    permission" (PRM-8). Every setting, lifting and expiry of a hold gives an event (`hold.set`,
    `hold.released`, `hold.expired`) and an audit record (AUD-1). Active holds are visible in P2
    `hold.list`, `status` and `doctor` with the scope, effects, reason, expiry and author. An
    operator sets a hold on the scope `farm` with the command `farmctl hold farm`, which writes the
    hold directly to the store, without a running core process and without a channel: `farmctl` on
    the core machine with the core's credentials is part of the core (DEP-8).
  goal: G4
  check: [fixture, blackbox]
  waivable: false
  version: v0.1
  profile: core
  decisions: []
  fixtures: [authorize/holds/, blackbox:core/hold-events-visible]
  doc: docs/operations.md

- id: HLD-2
  title: Who sets and lifts a hold
  status: active
  text: >-
    A hold only narrows: it grants no permissions, deletes no data and changes no manifests. Holds
    are set by: an operator through `farmctl` on any scope, and a hold on the scopes `farm` and
    `seat` and its lifting are operator operations only (PRM-14); a person of the tenant with the
    right `hold.set:<scope>` on scopes of their tenant, through `farmctl` or with a command in a
    private chat with the bot (PRM-15); the core by an auto-stop rule from the closed list
    `spec/model/holds.yaml`; the core as the first measure of an incident class from git (MGR-7);
    from v0.2 the core by a maintenance window of the monitoring system (MON-9). A code hold within
    a tenant (auto-stop, the first measure of an incident, a maintenance window hold) is recorded
    with the author `contain_auto`. A model, worker, route or schedule does not set or lift a hold.
    The only exception: the current holder of the manager seat with the current epoch sets and lifts
    holds with `control.apply` operations (MGR-9), only on targets from the list that code built,
    with an expiry no longer than `hold_ttl_max`, and lifts only its own holds. A hold is lifted by
    a principal with the right `hold.release` on its scope and not below the hold's author in rank;
    ranks from top to bottom: operator, tenant admin (a person of the tenant with `hold.release`),
    seat holder. A hold set by an operator, with any reason, including `suspended` (LCY-1) and
    `compromised` (SEC-6), is lifted only by an operator; a hold with the author `contain_auto` is
    lifted by a tenant admin or an operator; a hold set by a person of the tenant is lifted by a
    tenant admin or an operator; a seat holder's hold is lifted by the holder itself, a tenant admin
    (P2 `control.revert` with `incident`, MGR-15) or an operator. A hold on the scopes `farm` and
    `seat`, including the seat safeguard (MGR-14), is lifted only by an operator. A hold on the
    scope `governance` is set and lifted by a person with `admin:governance` in the case's tenant
    (GOV-14). The rights `hold.set:<scope>` and `hold.release` are privileged and are granted only
    through `farmctl` (PRM-13). Only a person lifts a code hold; otherwise it ends at `until`. The
    core does not lift holds itself; when the seat holder is replaced, the core shortens the expiry
    of the holder's holds to 15 minutes (MGR-1); the only extension of an expiry is the `until` of a
    maintenance window hold, which the core moves forward while the monitoring adapter reports the
    window active (MON-9). Check: C2 at the check point `hold.release` compares the rank of the
    hold's author and the rank of the principal; the refusal is `forbidden`. Fixtures: a model,
    route or schedule cannot set or lift a hold; a seat holder with an old epoch gets a refusal; the
    manager does not lift a person's hold or an auto-stop; a tenant admin with `hold.release` gets
    `forbidden` on a `suspended` hold set by an operator, and lifts an auto-stop with the author
    `contain_auto` in their tenant.
  goal: C1
  check: [fixture, lint, blackbox]
  waivable: false
  version: v0.1
  profile: core
  decisions: [D-62, D-71, D-80]
  fixtures: [authorize/holds/, fixture:authorize/holds/release-rank]
  doc: docs/operations.md

- id: HLD-3
  title: How a hold acts
  status: active
  text: >-
    A hold acts from the next check, without `apply` or restarts. Effects: `no_enqueue`: an enqueue
    in the scope gets `rejected(held)`, except core tasks for erasure and export; `no_claim`:
    `claim` does not hand out work of the scope; `no_tool`: a tool call gets `denied(held)`, and the
    toolhost does not get the call; `no_action`: new `request_action` calls are rejected, and
    pending approvals of the scope move to `canceled(held)` with a `card_update` delivery;
    `no_delivery`: deliveries to the scope get `withheld`, except messages to admins about the hold
    itself; `no_message`: sending bot messages in the scope gets `rejected(held)`, records that the
    attempt accumulated are removed at its `complete` (`discarded(held)`), wake-ups in the scope are
    not enqueued, and the hold does not forbid reading inboxes; `cancel_running`: running attempts
    of the scope get `cancel_requested` in the heartbeat answer (FEN-4), their handles are revoked,
    the attempt ends with the reason `held` without spending an attempt, and while a hold with
    `cancel_running` or `no_claim` on the task's scope is in effect, `claim` does not hand it out;
    `no_control`: the holder of the manager seat applies no control operations; `pause_action`
    (v0.2, set by a person or a maintenance window, HLD-8): new `request_action` calls are rejected,
    and pending approvals of the scope are not canceled but wait: their expiry is extended by the
    length of the hold, the card gets a `card_update` marked as paused, and no decision on them is
    accepted until the hold ends. A write call in `queued` whose scope a hold with `no_tool` or
    `no_action` hit gets `denied(held)`, and its approval ends with `exec_failed(held)`; nothing is
    executed late (APR-7). Calls of `service/control` and `monitor/script_run` go without a card
    (APR-18), but a hold with `no_tool` or `no_action` on their scope rejects them with
    `denied(held)` in the same way (MON-8, MON-10). Campaigns in the scope pause in the same
    transaction (ORC-11), and a script step whose enqueue a hold rejected or whose pending approval
    a hold canceled becomes `failed(held)`; from v0.2 a hold that touches a script run pauses the
    run (SCR-10). A hold on the scope `bot` set by a person moves the bot identity to `suspended`
    (IDN-9, `spec/lifecycles/identity.md`); a hold by the manager seat holder on the same scope
    delays the identity's tasks and changes nothing else (MGR-9). An urgent withdrawal of a plugin,
    action, task type or channel is done with a hold, and the removal from git later with an
    ordinary `apply`. A hold does not silence alarms and does not delay their export: notification
    and silencing live in the monitoring system (MON-1). Fixtures: a hold on a task type with
    `cancel_running` in the middle of a task gives `cancel_requested`, the attempt is not spent, and
    the task waits in `submitted`; a hold on a plugin in the middle of a task: the next `tools/call`
    is refused, and the toolhost does not get the call.
  goal: G4
  check: [blackbox]
  waivable: false
  version: v0.1
  profile: core
  decisions: [D-62, D-68, D-71, D-80]
  fixtures: [authorize/holds/, blackbox:core/hold-pause-action]
  doc: docs/operations.md

