- id: OBV-3
  title: Observations are read only by a closed query
  status: active
  text: >-
    Observations are read only by a closed query: the series, subject, window and rollup are taken
    from an `enum` within the role's `insight.observes` (for an aggregator within its `sources`, for
    a `job` worker within the `observes` of its task type through P1 `obs.query`) and the task's
    mark. The answer contains only numbers and `enum` values, its size is limited, and reading does
