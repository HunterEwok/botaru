- id: OBS-6
  title: Common alarm schema
  status: active
  text: >-
    An alarm is an event `alarm.<name>.vN` produced only by code: the core or a worker of type `job`
    (INJ-7). Alarm data follows the common schema `spec/model/event-data/alarm.schema.json`:
    `alarmkey` (the alarm name and the subject id from the catalog), `state` (`firing` or
    `resolved`), `severity` (`info`, `warn` or `page`), `subject` from the catalog and `values` only
    of numbers and `enum` values. An alarm lives in episodes: `firing` opens an episode, `resolved`
    closes it, and no more than one episode is open per `alarmkey`. An episode has a sequence number
    `seq`, which grows at every change of the episode and is part of the export (MON-11), and a
    counter `repeat_count`. A repeated `firing` with the same `alarmkey` does not open a new
    episode, writes no separate event and gives no export: the episode increments `repeat_count` and
    updates `last_seen_at`. The core exports each episode change to the monitoring system through
    the E5 adapter (MON-1); the farm has no recipients, routes or permissions to receive alarms.
    Alarms about the farm itself (core, store, background loops, storage headroom) belong to the
    service tenant `farm` and are exported with tag `scope: farm`. Fixtures: 60 identical `firing`
    events in an hour give one episode with `repeat_count` 59, one event and one delivery for E5;
    alarm data with text outside the schema is rejected.
  goal: G4
  check: [lint, blackbox]
  waivable: false
  version: v0.1
  profile: core
  decisions: [D-36, D-62]
  fixtures: [blackbox:core/alarm-repeat-count]
  doc: docs/operations.md

- id: OBS-7
  title: Alarm acknowledgement and escalation
  status: retired
  retired: 2026-10-08
