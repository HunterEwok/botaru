    Work that has exhausted its attempts, runs or deadline ends with `failed` (task) or `dead`
    (delivery) with the reason `attempts_exhausted`, `runs_exhausted` or `deadline_exceeded`, is
    visible in the "dead" view (P2 `deadletter.list`) and gives an event. P2 `task.redrive` (for a
    delivery, P2 `delivery.redrive`) creates new work with a `refs` link to the original and the key
    `system:redrive:<id>:<n>`, and permissions and ceilings are checked again; for `action.*` tasks
