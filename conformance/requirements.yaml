- id: MAN-4
  title: Drivers and implementation kinds do not touch permissions
  status: active
  text: >-
    The meta-schema of a driver's `spec.config` forbids fields that rules depend on: link previews,
    markup, accepting messages "on behalf of the chat", egress, placement, ceilings, fallback
    providers. Such fields exist only in the common wrapper under the core's check. A manifest kind
    from an implementation grants no capabilities, declares no tools or actions, and passes the
    `authorize/` fixtures. A kind that affects permissions is added only by a skeleton ADR.
  goal: G2
  check: [lint]
  waivable: true
