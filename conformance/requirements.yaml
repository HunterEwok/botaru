- id: DLV-9
  title: Code texts from the message catalog by language
  status: active
  text: >-
    Code texts (cards, refusals, statuses, notices, `ai_notice`, `privacy_notice`, answers to
    channel commands) come from the message catalog `spec/bindings/channels/messages/<locale>.yaml`
    by the reason or field code and the recipient's `locale`. In v0.1 `locale` is a value of the
    closed list `locale` of `spec/model/common.schema.json` (BCP 47 tags) on the principal (set at
    invitation and by the channel command `/lang`) and on the chat binding; the skeleton catalog
    ships only `en`, with full coverage of the codes; catalogs for other locales are supplied by the
    installation, and the order is: the recipient's `locale`, then `en`. From v0.2 the schedule and
    the tenant have a `locale` too, and the core passes the model's answer language as
    `reply_locale` to the runtime (DLV-18); the model does not guess it. There is no translation;
    argument values and resource ids are not translated. Required catalog keys, without any of which
    the catalog fails the skeleton CI: answers to channel commands `cmd.<command>.*` (including
    `cmd.lang.done`, `cmd.lang.unknown`, `cmd.forbidden.needs`), the follow-up window hint
    `cmd.followup.hint`, the notices `notice.ai`, `notice.privacy`, `notice.not_registered`,
