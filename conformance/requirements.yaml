- id: BUD-9
  title: Budget in micro-euros per call and in euro cents in limits
  status: active
  text: >-
    The usage and reserve of one call are computed at the prices from `ModelProfile` as an integer
    number of micro-euros (`eur_micros`, 1 EUR = 1 000 000) without rounding per call. Limits,
    reports and `farmctl` show euro cents: the sum over a window (day, hour, month, tree) is rounded
    up to a whole euro cent, and the limit is compared with the window sum together with reserves
