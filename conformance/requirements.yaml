- id: MGR-25
  title: Reading separate from deciding
  status: active
  text: >-
    A role of profile `farm-manager-reader` reads tenant content within group `farm-manager-ops` and
    outputs only findings `manager-finding/v1`; it has no access to control data, tasks of purposes
    `governance`, `review`, `inspect`, `manage`, memory of people and bots, sessions, sealed data,
    tasks of workers with an owner (personal assistants, IDN-5), secrets, marks above the ceiling
    and anything of another tenant, and gets `not_found` on them. At `complete` the core checks a
    finding (subject from the tenant, evidence from this attempt's read log, closed names and number
    bounds, no more than 10) and always marks it `untrusted: true`; the core sets the
    `personal_seen` flag on a finding under AUD-5. The `farm-manager` role has no tools with
    `untrusted_output` and no tenant text, including the `note` of findings; it gets the result of
    `service/control` and `monitor/script_run` only as closed fields (result code, service state
    after reconciliation, `service_grant` number), and script output goes as untrusted data into the
    task journal for people and the reader role. Under the role profile table (PRF-1) the
    `farm-manager` role has empty `may_enqueue`, `campaigns`, `scripts` and `messages` and no
    built-in `escalate`, and the `farm-manager-reader` role has only read tools (`access: read`) and
    the built-in `file_read`; the read tools include the `logs` and `monitor` plugins (read only and
    only nodes of its own tenant's catalog, MON-6). Lint checks `tools/list` of both roles and does
    not allow removing the exclusions from group permissions.
  goal: G2
  check: [lint, fixture, blackbox]
  waivable: false
  version: v0.1
  profile: manager
  decisions: [D-30, D-59, D-64, D-67, D-114]
