- id: IDN-4
  title: A principal in one tenant, secrets as hashes
  status: active
  text: >-
    A principal belongs to one tenant, and its identity is unique in that tenant; a person or
    program working in two tenants is two principals. Tokens and keys are stored only as hashes. The
    identity of an external program is `api:<key_id>`, and of an external event source
    `hook:<source>`, but never the key itself. After a token or key is rotated, the old one is valid
    for a limited window, whose value the binding sets.
  goal: G2
