- id: SCR-1
  title: A script is data under a closed schema
  status: active
  text: >-
    A script is data under the closed schema `botaru.script/v1` (JSON Schema 2020-12,
    `additionalProperties: false`), not code. The kind of a script step is taken only from the
    closed list `spec/model/script-step-kinds.yaml`; `run_if` accepts only `succeeded`, `always` or
    `failed`, and `on_failure` only `stop` or `continue`. A script has no expression language, code,
    loops or nested scripts; `needs` refers only to earlier steps, so the graph is acyclic by
    construction; the field `then` inside `fanout` is forbidden. There are no more steps than the
    tenant ceiling (10 by default), which is not higher than the farm ceiling (20). A script does
    not enqueue another script and does not enqueue a task for the translator.
  goal: G2
  check: [lint, fixture]
  waivable: false
  version: v0.1
  profile: campaign
  decisions: [D-15, D-39, D-71]
  fixtures: [scr-fx-schema]
  doc: docs/coordination.md

- id: SCR-2
  title: A step refers only to applied manifests
  status: active
  text: >-
    A script step refers only to applied manifests of its tenant: a task type, an action with
    `script.allowed: true`, a selector or a catalog resource. A task type in a step has purpose
    `work` or `report`; `action.*` types, types of purposes `translate`, `insight`, `review`,
    `aggregate`, `manage`, `governance`, `inspect` and types with `alarm.*` in `events` do not go
    into a script. `params` and `args` pass the schema of the type or action, each leaf of which is
    of a closed kind under INJ-1. A reference to an unknown, unapplied or forbidden manifest gives
    the refusal `script_ref_unknown` with the step number.
  goal: G2
  check: [lint, fixture]
  waivable: false
  version: v0.1
  profile: campaign
  decisions: [D-15, D-39, D-71, D-114]
  fixtures: [scr-fx-refs]
  doc: docs/coordination.md

- id: SCR-3
  title: Conditions and passing values between steps
  status: active
  text: >-
    A `when` condition is built only from atoms of the closed table `spec/model/condition-ops.yaml`
    (`eq`, `ne`, `in`) over the result fields marked `x-botaru-read-by: code` (OUT-1) of a step with
    one result (not a `fanout`) and over the state of any step. Atoms are combined only through
    `all`, `any` and `not`, nesting no deeper than 2, no more than 8 atoms; there is no arithmetic,
    comparison of sizes, string functions, regular expressions, access to time or to external data.
    A value passes to another step only by a reference `{ref: <step>.<field>}` to a closed field
    into a parameter of a compatible kind (`enum_from` of the same catalog, a number within the
    parameter's bounds, an `enum` with the same or a smaller set), and when the step is released the
    core checks it again with the parameter schema and the catalog filtered by the mark. Free text
    of a step result reaches the next step only as an attachment with `untrusted_seen`, never in
    `goal` and `params`.
  goal: G2
  check: [lint, blackbox]
  waivable: false
  version: v0.1
  profile: campaign
  decisions: [D-15, D-39, D-71, D-114]
  fixtures: [scr-fx-conditions]
  doc: docs/coordination.md

- id: SCR-4
  title: The goal of an agent step in a model draft
  status: active
  text: >-
    In a draft that the model wrote, the goal of an agent step is set only as `{template: <id>}`
    from the task type's `goal_templates` or as `{assignment: true}` (the verbatim text of the
    initiator's assignment); a draft has no free goal text. A free goal (the script's `goals`) is
    allowed only in a script from git that passed a human review, and only from v0.2 (SCR-14).
  goal: G2
  check: [lint, fixture]
  waivable: false
  version: v0.1
  profile: campaign
  decisions: [D-15, D-39, D-71]
  fixtures: [trn-inj-05]
