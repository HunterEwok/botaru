- id: ART-5
  title: Only declared content types are handed out
  status: active
  text: >-
    People and sinks get only result files whose content type is in the task type's
    `result_media_types`; another file is not handed out (`media_type_not_allowed`), and the task
    outcome does not change. The core determines the content type from the content, by the WHATWG
    MIME Sniffing standard, not from the name; only inside the `text/*` family, where content cannot
    tell `text/csv` from `text/plain`, the file extension refines the sniffed type. Active formats
    are never handed out and cannot be declared: `text/html`, `application/xhtml+xml`,
    `image/svg+xml`, JavaScript and any `+xml` type. `application/pdf` may be declared only by a
    type with `worker_kind: job`, whose code renders the file from closed result fields, never by an
    agent type; the `apply` lint rejects a type that breaks either rule.
  goal: G2
  check: [adapter, blackbox, lint]
  waivable: false
  version: v0.2
  profile: core
  decisions: []
  fixtures: [blackbox:core/result-media-type, lint:manifests/result-media-active]
  doc: docs/capabilities.md

- id: ART-6
  title: Declared personal data in the file record
  status: active
  text: >-
    The core sets `personal_seen` with source `declared` in the file record when the source declared
    personal data rather than redaction finding it: for a file with `origin: upload` from a
    principal of kind `service` with `uploads_personal: true` in the principal's record (set by an
    admin with `admin:people`, default `true` in a production tenant), and for a file with `origin:
    ingested` that the task `kb.ingest.v1` or `data.arrived.v1` brought from a catalog resource with
    `personal: true`. The manager reads a file with `personal_seen` from any source as personal
    (MGR-30), and it is in the privacy report as an object with personal data. Fixture: a CSV from a
    `service` principal with `uploads_personal: true` gets `personal_seen: declared` without
    redaction.
  goal: C6
