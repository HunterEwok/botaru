- id: OBV-4
  title: Rollups and observation retention
  status: active
  text: >-
    A series rollup is set by its manifest: the window, a function from the closed list
    `spec/model/rollups.yaml` (for example `hour.max`, `hour.mean`, `day.p95`) and a data class not
    below the series class; code computes rollups. Points and rollups belong to retention class
    `observation` (by default points 14 days, rollups 93 days) and are deleted at expiry in whole
    periods (RET-1, RET-2).
  goal: G5
  check: [lint, blackbox]
  waivable: true
  version: v0.1
  profile: insights
  decisions: [D-16, D-71]
  fixtures: []
  doc: docs/improvements.md

- id: OBV-5
  title: Core series are deterministic and stay within the tenant
  status: active
  text: >-
    Series of source `core` are computed by the deterministic core loop `observe` only from records
    of the same tenant: attempts, tasks, usage lines, schedule slots and run finished events outside
    the farm. Identical records give identical points. Where a series matches a series of the farm
    metric catalog, they have one name.
  goal: G5
  check: [blackbox, fixture]
  waivable: true
  version: v0.1
  profile: insights
  decisions: [D-16, D-71]
  fixtures: []
  doc: docs/improvements.md

- id: OBV-6
  title: Registry of core series with definitions of "good" and "bad"
  status: active
  text: >-
    The skeleton sets the registry of core series `spec/model/core-series.yaml`, and the core keeps
    these series for each task type, schedule and dataset of the tenant: attempt duration (median
    p50 and 95th percentile p95), task outcome by reason, number of attempts per task, queue wait
    until the first hand-out, task price by usage lines (BUD-3), schedule slot (on time, late,
    skipped), dataset backup age and series of work outside the farm (OBV-7). Each registry series
    has an `outcome` block: the unit, the rollup for comparison, which event is good and in which
    direction the series is better, the tolerance within which there is no change, and the minimum
    number of events per window (`min_samples`). A tenant series can declare the same block (OBV-2).
    Only a series with a complete `outcome` block can be a metric or a guard of a change trial
    (PRP-21); a registry series without a complete block does not pass lint.
  goal: G5
  check: [lint, fixture, blackbox]
  waivable: false
  version: v0.1
  profile: insights
  decisions: [D-16, D-37, D-71, D-80]
  fixtures: []
  doc: docs/improvements.md

- id: OBV-7
  title: Run finished event outside the farm
  status: active
  text: >-
    Work that continues outside the farm after a task result of "accepted for run" (a pipeline, a
    database backup outside manifests) reports its end with the event `run.finished.v1`. A job
    worker submits it through P1 `emit`, if this event type is in the `events` of its task type,
    with closed fields: the work id, an optional approval number `approval_id` (by it the route
    finds the address `approval_initiator`, DLV-6), a subject from its own tenant's catalog,
    `duration_s`, `retries`, `exit_code` and `outcome` from a closed list; the core sets the event's
    `source` and `id` (IDM-4). The core itself writes the points of the outside-work series
    (duration, retries, outcome) and the backup age from such an event in the `observe` loop,
    without `obs.append`.
  goal: G4
  check: [blackbox, fixture]
  waivable: true
  version: v0.1
  profile: insights
  decisions: [D-16, D-71]
  fixtures: []
  doc: docs/improvements.md

- id: OBV-8
  title: P1 obs.append for job attempts
  status: deferred
  deferred: 2026-10-14
  reason: 'In the pilot the series of the core and the data of the monitoring system (MON-6) are enough; job attempts need not write series.'
  return_when: 'A job needs to write observation points itself.'
  mechanism_removed: false
  text: >-
    From v0.2 P1 `obs.append` is accepted only under the lease of a `job` attempt (another holder or
    a stale token gets `fenced`) and only into a series from the `observes` of the attempt's task
    type (`type_not_allowed`). The value must be of the series kind (`input_schema_invalid`), and
    the subject must be a catalog object of the series subject kind in the task's tenant
    (`ref_invalid`). The core writes the point in the transaction of the call with the store time,
    the tenant and the producer `job` with the attempt; the body carries none of them. One attempt
    writes at most 1000 points, more get `service_rate_limited`. Points are only added; a point is
    never changed.
  goal: G5
