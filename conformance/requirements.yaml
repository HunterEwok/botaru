- id: SEC-4
  title: Minimum fields in a work item
  status: active
  text: >-
    A work item carries the minimum for its kind (the `work-item` schemas by `kind`). A call for the
    toolhost: the tool, the checked arguments, the tenant, `target`, the call id, and for a write
    also `approval_id` and the hash of the arguments; without `goal`, the initiator and `origin`. An
    agent attempt: the body, the instruction, the handles; without the address signature and
    external ids.
  goal: G2
  check: [fixture]
  waivable: false
  version: v0.1
  profile: core
  decisions: []
  fixtures: []
