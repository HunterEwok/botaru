- id: GW-18
  title: A cache point on the conversation of a run
  status: active
  text: >-
    From the second call of a run on, that is when the request holds more than one message, P4
    sets a second cache point of a profile with cache prices on the last block of the last message,
    unless it is a reasoning block and while the call has fewer than four points, so that the next
    call of the run, which sends the same messages and its new ones, reads the conversation so far
    from the cache instead of paying the full input price for it again; the first call of a run
    gets no such point, since nothing would read it (GW-16, BUD-9). The runtime keeps the text
    that is the same for every attempt of a role in the system text and the text of one attempt,
    such as the current time and the path of the skills directory, in the first message.
