- id: ING-1
  title: Authenticity of an external source
  status: active
  text: >-
    A source channel (an E1 driver with `direction: in`) checks the authenticity of every delivery
    with the means of the external system: a signature with a timestamp within `ingress.tolerance`,
    or a token over TLS (`ingress.auth`). A source manifest without `ingress.auth` fails the schema,
    and a source channel without `ingress` fails `apply`; a delivery that fails the check gives no
    activity, no file and no event. With `auth: signature`, `ingress.tolerance` is required and at
    most 5 minutes (`ingress_tolerance`). A `tls_token` source has no replay protection, so a route
    from its events enqueues only task types of tier 0 (`ingress_token_tier`).
  goal: G2
  check: [adapter, lint, fixture]
  waivable: false
  version: v0.2
  profile: ingress
  decisions: []
  fixtures: [schemas/invalid/manifests/channel-ingress, adapter:channel/ingress-authenticity, manifests/v02-lints, manifests/v02-security-lints]
  doc: docs/capabilities.md

- id: ING-2
  title: Only closed fields in external event data
  status: active
  text: >-
    The data of an `ext.*` event contains only the fields extracted by `ingress.mapping` of the
    source manifest, and only of closed kinds (the leaves of INJ-1). The rest of the external
    delivery body is saved as a file and reaches a task only as an attachment, which sets
    `untrusted_seen`. Free text of the external body never reaches a task's `goal`, the event data
    or the audit. Monitoring system names follow INJ-16.
  goal: G2
  check: [lint, fixture]
  waivable: false
  version: v0.2
  profile: ingress
  decisions: [D-69]
  fixtures: [fixture:ingress/annotation-instruction]
  doc: docs/capabilities.md

- id: ING-3
  title: Delivery key and source limits
  status: active
  text: >-
    An incoming delivery of an external source gets the idempotency key
    `system:ingress:<source>:<delivery id>` (IDM-2): a repeated delivery gives one event. The
    delivery id is the id that the external system sends (for Standard Webhooks the `webhook-id`
    header); a source without one gets the sha256 of the body. The source manifest sets a rate limit
    and a body size limit (`ingress.limits`); exceeding them gives the source a refusal, not a
    truncated body.
  goal: G1
  check: [adapter, blackbox, fixture]
  waivable: true
  version: v0.2
  profile: ingress
  decisions: []
  fixtures: [schemas/invalid/manifests/channel-ingress, blackbox:ingress/repeat-and-limits]
  doc: docs/capabilities.md

- id: ING-4
  title: External events only in the ext namespace
  status: active
  text: >-
    External events live only in the `ext.*` namespace: a source manifest whose `ingress.event` is
    outside `ext.*` fails the schema, so a source cannot produce `alarm.*`, `task.*`, `message.*` or
    an event of another core namespace. A farm alarm on an external event is raised only by a `job`
    task that a route enqueues and that checks the condition in code (INJ-7); a monitoring system
    problem `ext.monitor.problem.v1` gives an alarm only after a recheck by code (MON-5). Alarms
    reach people only along the installation's one alarm path (MON-1). A route from `ext.*` enqueues
    only types listed in `system-ops` (PRM-10).
  goal: G4
  check: [lint, fixture]
  waivable: false
  version: v0.2
  profile: ingress
  decisions: [D-62, D-63, D-88]
  fixtures: [schemas/invalid/manifests/channel-ingress, manifests/ingress-routes]
  doc: docs/capabilities.md

- id: INJ-1
  title: No free input on a production machine
  status: active
  text: >-
    On a production machine (DEP-1) the model has no shell, no eval, no SQL as a string, no free
    paths, URLs, hosts, commands or regular expressions. The rule applies to plugin tools with
    `placement: host`, to action argument schemas, to the `params_schema` of task types and to all
    schemas that other rules declare closed (bot message fields, result fields read by code,
    observation series, external event mapping). Every leaf of such a schema, recursively through
    `properties`, `items`, `$defs`, `anyOf` and `oneOf`, is one of: `enum`, `enum_from` or `const`;
    `integer` or `number` with `minimum` and `maximum`; `boolean`; a string with `x-botaru-format`
    from the registry `spec/model/formats.yaml`. A custom `pattern` is rejected.
    `additionalProperties: false` everywhere, `maxItems` on arrays, no `patternProperties`; `$ref`
    and `$schema` are resolved only from the local schema registry. `format` and `default` check
    nothing: only `x-botaru-format` sets a format, and the core fills in default values explicitly
    before the schema check, for actions before the approval snapshot (MAN-9). Catalog values behind
    `enum_from` themselves pass the declared format (MAN-10). A string without a format is allowed
    only for tools with `placement: sandbox`. Fixtures `conformance/fixtures/schemas/invalid/`,
    among them "terminal `send_keys`".
  goal: G2
  check: [fixture, lint, blackbox]
  waivable: false
  version: v0.1
  profile: core
  decisions: [D-39]
  fixtures: [schemas/invalid/terminal-send-keys.yaml, blackbox:model/foreign-source, blackbox:model/path-instead-of-id, blackbox:model/tenant-field, blackbox:model/lines-out-of-range, lint:manifests/terminal-send-keys]
  doc: docs/permissions.md

- id: INJ-2
  title: Tool descriptions only from the manifest
  status: active
  text: >-
    Tool descriptions, schemas and annotations for the model come only from the manifest. A plugin's
    live `tools/list` is only compared with the manifest at `hello`; a mismatch blocks the toolhost.
    The server's `instructions`, its prompts and the skills the server itself offers never reach the
    model.
  goal: G2
  check: [blackbox]
  waivable: false
  version: v0.1
