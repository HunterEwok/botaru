- id: MGR-51
  title: Proposals of the farm manager
  status: active
  text: >-
    The farm manager submits proposals to the commission of tenant T only from data of T, from the
    daily review (MGR-41) or an analysis (MGR-53), at most 2 per tenant per month, counted in the
    review money (BUD-13). It does not submit one proposal to several tenants; recurring problems
    across tenants are found by code from the counters of incident classes and shown only to the
    farm operators in the daily summary. A change the manager may not propose (MGR-16, PRP-3) goes
    to the operators only as a code notice "for information". It does not review its own proposals
    (GOV-17), the commission does not see the author level (COM-15), and its proposals never make
    anyone answer for a link (GOV-41).
  goal: G5
  check: [blackbox]
  waivable: true
  version: v0.3
