    the proposal, the evidence as numbers, the change in code words, the price and the risk, but
    without lens scores, vetoes and the verdict; the buttons are "Would accept" and "Would not
    accept". The answer is recorded in the sample (DIG-5) and scores the forecasts of the reviews
    (COM-16) before the person sees the scores. After the answer "Would accept", the card shows the
    scores and vetoes. An item without a veto has "Accept", and it acts like an ordinary "Accept"
