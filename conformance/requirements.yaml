- id: PRP-9
  title: One running trial per field of an object
  status: active
  text: >-
    A field of an object, or a group of fields that `spec/model/proposable-fields.yaml` names
    together, has at most one running change: the core locks it when a `manifest_change` proposal
    that sets it moves to `realizing` and releases it when that trial ends. Proposals of the kinds
    `action_request`, `script` and `none` take no lock, and a restart of a service holds none. The
    core computes `conflicts_with` (open proposals that change the same locked field or group);
    while the lock is held, the other open ones go to `parked(conflict)` and their cards go dark, a
    new proposal that changes the locked field waits in `parked(conflict)` too, and all of them
    return to `screened` when the lock is released. Only one of conflicting proposals can be
    accepted.
