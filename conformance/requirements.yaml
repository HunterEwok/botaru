- id: GW-7
  title: A model only by the role slot and the tenant list
  status: active
  text: >-
    P4 allows a handle's model only as the profile of one role slot and only if this profile is in
    the tenant's `models_allowed`. The core determines the slot, not the request: `analysis` for the
    purposes `insight` and `aggregate`; `seat` (the profile `model_profile` from the seat's charter:
    `commission.model_profile` for commission seats, `farm_manager.model_profile` for the manager
    seat) only for an attempt on behalf of the seat with the current seat epoch, and from v0.2 for a
    shadow review attempt (COM-10) of a lens on a seat, with the lens seat profile and without a
    seat epoch; `base` for the other purposes; `granted` (from v0.2) only under an active model
    grant to this task (MGR-18). The profile rank check (GOV-3) applies on top. The request body,
    task parameters and tools do not choose the model: a model name in the request body makes no
    choice, and a request with a model other than the allowed one is rejected. A role whose `base`
    or `analysis` slot profile is not in the tenant's `models_allowed` fails `apply` for this tenant
    and does not get `enroll` in it. A task type whose purpose requires a slot the role does not
    have fails `apply`; a profile with a model alias without an exact version also fails `apply`.
  goal: G3
