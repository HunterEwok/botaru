- id: DSP-11
  title: Bot group quota and a rule's share
  status: deferred
  deferred: 2026-10-14
  reason: 'A pilot tenant has few bot groups; the per-type max_running (DSP-7) is enough.'
  return_when: 'Several bot groups of one tenant compete for capacity.'
  mechanism_removed: false
  text: >-
    A bot group's `max_running` caps the running attempts on the group's member workers: `claim`
    does not hand a task to a member of a group whose members already run that many attempts, and a
    worker in several groups is held by each group that has a cap. A dispatcher rule's `max_share`
    caps the running attempts of the tasks the rule matches on the members of the rule's `group` at
    the share of the group's capacity, rounded down but at least one; the capacity is the group's
    `max_running`, or the number of its active members when it has none (as for BUD-8). `apply`
    rejects a rule with `max_share` and without `group` (`max_share_without_group`). A task held by
    either cap waits in `submitted` with `waiting_reason: group_quota` (D10); no attempt is spent and
    no work is lost (DSP-7). The core counts running attempts from the lease records in the `claim`
    transaction, so two concurrent `claim` calls never pass a cap together. P2 `dispatch.explain`
    shows the cap and how many places are taken (DSP-9).
  goal: G1
  check: [fixture, lint]
  waivable: true
  version: v0.2
  profile: core
  decisions: [D-14]
  fixtures: [dispatch/group-quota, manifests/v02-group1-lints]
  doc: docs/coordination.md

- id: EVO-1
  title: The output coupling graph of the manifests
  status: active
  text: >-
    Code builds a directed graph of the references between the manifests of a set, from the callee
    to the caller: a task type feeds the roles that claim, enqueue or analyse it, the schedules and
    routes that start it and the dispatcher rules that match it; a tool plugin feeds the roles and
    actions that use it; a skill folder and an action feed the roles that use them; a catalog feeds
    every task type whose schemas read a catalog with `enum_from`; a script feeds the schedules that run
    it; a role feeds the bot groups that select it, and a bot group the dispatcher rules that name
    it. A field under `spec.dispatch.rules` of a tenant belongs to the node of that rule, any other
    field to its object. In a tenant with `insights.evolution.enabled` the field lock of PRP-9 also
    holds the direct neighbours of every object the locked change sets: an open `manifest_change`
    proposal that sets an object which is a direct caller or callee of a locked one goes to
    `parked(conflict)` and returns when the lock is released; no two kinds a proposal may set in
    v0.3 (Schedule, Catalog, Tenant) are direct neighbours, so this parks a change only once a
    proposable kind gains one. The gate (EVO-9) refuses a change after which a reference within one
    step of a changed object names nothing, and orders the objects of one change from callee to
    caller.
  goal: G5
  check: [impl]
  waivable: false
  version: v0.3
  profile: insights
  decisions: [D-120]
  fixtures: [impl:internal/manifest/TestCouplingEdges, impl:internal/manifest/TestCouplingTopoOrder, impl:internal/gate/TestGateCoupling]
  doc: docs/improvements.md

- id: EVO-2
  title: A scaffold change stays small and away from the skeleton
  status: active
  text: >-
    The diff step of the gate writes the fields of a `manifest_change` into the file that holds the
    target object, changing only the bytes of the old values or adding the missing keys as lines,
    and refuses the change when it sets more fields than the tenant's `insights.gate.max_fields` (1
    by default), when its unified diff has more lines than `max_diff_lines` (40 by default), when it
    touches more than one file or a binary file (`diff_size_exceeded`); when it touches a path under
    `ci/`, `spec/`, `conformance/`, `evals/`, `impl/` or `.github/` (whatever characters the path
    holds), a symbolic link or a path under one, a manifest of a protected kind (Governance,
    Commission, IncidentClass, Group, ModelProfile, Sink, Channel, EvalReports) or a field outside
    the proposable fields of PRP-3 (`forbidden_path_modified`); and when the editor cannot write a
    field in place or the file read back differs from the base by more than exactly those fields
    (`diff_unrenderable`). The editor never writes through a symbolic link. Path checks come before
    size checks; the protected kinds are checked when the set is read back.
  goal: G5
  check: [impl]
  waivable: false
  version: v0.3
  profile: insights
  decisions: [D-120]
  fixtures: [impl:internal/gate/TestGateForbiddenPaths, impl:internal/gate/TestGateDiffSize, impl:internal/gate/TestGateQuotedAndLinkedPaths]
  doc: docs/improvements.md

- id: EVO-3
  title: Lessons of review become rules of the role
  status: active
  text: >-
    When a `manifest_change` proposal leaves by a lesson about its approach, the core keeps a
    review rule of its role: the tenant, the role, the target object, the problem code, the
    diversity signature of the approach (EVO-5), the outcome class and the reason code. A lesson is
    a decline by people with `too_risky`, `wrong_data`, `too_costly` or `not_relevant`, a
    `dismissed(veto)`, a revert with `harm_observed` and a trial outcome `worse`; "not now", a
    duplicate, "already done", `other`, a gate refusal and an expiry teach nothing. A repeat counts
    on the same rule. A later proposal of the role for the same problem and the same target whose
    signature contains every entry of a live rule's signature is refused at creation with
    `rejected(review_rule)`, without a record. A rule stays until a person who may decide its
    category drops it through P2 `review_rule.drop` (C1); a person who lifts the veto of an audit
    sample item takes that proposal out of the rule its veto taught, and a rule left without a
    proposal is dropped. The refusal at creation and the rules in the analysis input hold only in a
    tenant with `insights.evolution.enabled`; the rules are kept for every tenant. The role's
    analysis input carries its live rules, at most 20, with the target, the problem code, the
    signature and the count: a rule says that an approach is refused, never who refused it or why
    (GOV-29). P2 `review_rule.list` leaves out a rule of a proposal whose audit sample card is
    blind (DIG-6).
  goal: G5
  check: [impl]
  waivable: false
  version: v0.3
  profile: insights
  decisions: [D-120]
  fixtures: [impl:internal/core/TestVariantArchiveRevert, impl:internal/core/TestP2VariantViews]
  doc: docs/improvements.md

- id: EVO-4
  title: The variant archive and the lineage of the scaffold
  status: active
  text: >-
    For every target object of every `manifest_change` proposal the core writes a variant at
    creation: an id `var_<ULID>`, the tenant, the target, the parent, the applied commit and
    manifest hash it starts from, the proposal, the author role and bot, the hash of the manifest
    after the change, the fields with their values after and before, the diversity signature, the
    gate result (EVO-9), the outcome and its reason code, a live flag and the counts of its children
    and of its children with the outcome `better`. The parent is the live variant of the object
    while the object is still what that variant made it; otherwise the variant has no parent and
    starts from the applied commit, as after a person's own commit. The outcome is `pending` while
    the proposal is open, then the trial outcome, or `rejected_at_gate`, `rejected_by_commission`
    (any dismissal but the gate's, by the commission or by a code check), `rejected_by_human`,
    `reverted`, `expired` or `canceled`; an audit sample item keeps the outcome of its dismissal
    until a person rejects it. A parent counts a child as successful while the child's outcome is
    `better`. A realized variant is live and takes
    the live flag from the object's previous one; a reverted one is not. Variants of rejected,
    reverted and intermediate changes stay. The identity, the fields and the hashes never change.
  goal: G5
  check: [impl]
  waivable: false
  version: v0.3
  profile: insights
  decisions: [D-120]
  fixtures: [impl:internal/core/TestVariantArchiveRevert, impl:internal/core/TestVariantLineage]
  doc: docs/improvements.md

- id: EVO-5
  title: Analyses see diverse variants, not only the last one
  status: active
  text: >-
    The diversity signature of a variant is the sorted list of its entries
    `<Kind>.<field>:<direction>`: up or down for a number or a duration, more_often, less_often or
    shifted for a cron expression, set for a field the object did not have, changed otherwise.
    In a tenant with `insights.evolution.enabled` code puts the closed block `evolution`
    (`spec/model/insight-evolution.schema.json`) beside "My outcomes" into every analysis task of a
    role: up to five variants of the role's targets with different signatures, the live ones first,
    then by the number of successful children and the newest, so that unchanged, mixed and refused
    approaches stand beside the current one, each with its fields, signature, counts and the
    outcome class a bot sees (`declined` for a refusal by people, `dismissed` for one by the
    commission or the gate), and the role's live review rules (EVO-3). The block has no reason
    codes, no gate step codes and no text (GOV-29, EVO-7).
  goal: G5
  check: [impl]
  waivable: false
  version: v0.3
  profile: insights
  decisions: [D-120]
  fixtures: [impl:internal/core/TestVariantArchiveRevert, impl:internal/core/TestDiversitySignature]
  doc: docs/improvements.md

- id: EVO-6
  title: People read and reuse the archive
  status: active
  text: >-
    A person who may decide a category reads the variants of that category in P2 `variant.list`
    (the tree of each target, parents before children, with outcomes, reason codes and the success
    of children) and `variant.show` (the fields before and after, the gate result, the trial and the
    chain of parents); every read goes into the audit. `farmctl variant checkout <id> -out <dir>`
    writes the variant's fields and, with `-repo`, the manifest file of the target from the
    repository with those fields set, for reuse or a new branch. Nothing in the archive changes the
    farm by itself.
  goal: G5
