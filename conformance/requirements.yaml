- id: MON-9
  title: Monitoring maintenance windows give a farm hold
  status: active
  text: >-
    The monitoring adapter polls the maintenance status of the nodes that the tenant catalog linked
    to its resources (`Catalog.spec.hosts[].monitor_host`) every `maintenance_poll_s` of the
    deployment binding (60 seconds by default, at most 300). It does not compute the time periods of
    the monitoring system: while a node is in maintenance, every poll sends the event
    `ext.monitor.maintenance.v1` with `state: active` and `until` = the poll time plus two poll
    intervals, and the first poll that finds the node out of maintenance sends `state: ended`; the
    events go through P1 `submit_activity` with identity `hook:monitor`. On the first `active` event
    of a window the core sets a hold of scope `host` on the catalog host whose `monitor_host` is the
    node, with effects `no_tool` and `pause_action`, reason `maintenance`, author `contain_auto`,
    source `system:monitor` and the event's `until`; a node is linked to a resource of exactly one
    tenant (D-75, MON-5), so there is one hold. Each later `active` event of the same
    `maintenanceid` moves the `until` of that hold forward, never back; this is the only way a
    hold's deadline grows (HLD-2). An `ended` event or a missing poll changes no hold: the hold ends
    at its `until`, at most two poll intervals after the window, or a tenant admin or an operator
    releases it earlier; after a person released it, the core sets no new hold for the same
    `maintenanceid` while it stays active. A periodic maintenance (for example every night from
    01:00 to 03:00) thus gives one hold per active period. `no_tool` also stops reading tools on
    that host, because people work on the machine during the window (D-100). The window does not
    cancel waiting approvals: with `pause_action` new `request_action` calls are rejected, while
    waiting cards wait, and their expiry is extended by the length of the hold (HLD-3); people who
    set windows in the monitoring system are not farm principals and cannot cancel its approvals. A
    machine with `hosts[].maintenance_hold: true` in the catalog gets the effect `no_action` instead
    of `pause_action`: waiting approvals become `canceled(held)`. A slot of a schedule whose task
    scope holds a resource of that host is skipped with `schedule.skipped(held)`, without catch-up:
    TIM-3 skips a slot for a maintenance hold although its effects do not include `no_enqueue`. A
    window on a node of the farm itself sets no holds. Fixtures: a 2-hour window on the mock
    monitoring system gives one hold whose `until` follows the polls and ends at most two poll
    intervals after the window; a periodic maintenance gives one hold per active period; a tool call
    on this machine gets `denied(held)`; a schedule slot in the window is skipped with `held`; a
    card that was waiting before the window stays `pending` after the window, with its expiry
    extended by the length of the hold; the same card on a machine with `maintenance_hold: true`
    becomes `canceled(held)`.
  goal: G4
  check: [adapter, blackbox]
  waivable: true
  version: v0.2
  profile: monitor
  decisions: [D-59, D-62, D-75, D-88, D-100, D-103]
  fixtures: [blackbox:core/hold-pause-action, blackbox:monitor/maintenance-hold, blackbox:monitor/maintenance-periodic, schemas/valid/ops/ext-monitor-maintenance, schemas/invalid/ops/ext-monitor-maintenance]
  doc: docs/operations.md

- id: MON-10
  title: Monitoring system scripts
  status: active
  text: >-
    A role with `monitor_scripts: [<name>...]` or `monitor_scripts: ["*"]` in its manifest runs
    monitoring system scripts with the action toolhost write tool `monitor/script_run {resource,
    script}` (D-67, D-69). The model sees script names only from the tenant catalog:
    `Catalog.spec.hosts[].monitor_scripts_allowed: [{scriptid, name, hosts}]`, where `name` is the
    closed name in the tenant, `scriptid` is the script id in the monitoring system, and `hosts` are
    the nodes where it is allowed (INJ-16); a (node, script) pair can be in the catalog of only one
    tenant (D-75); `resource` is taken only from the resources of the task tenant's catalog with
    `monitor_host`, `script` only from the `name` of this list for this node, and for a role with a
    list of names only from its list; code takes the node and the `scriptid` from the catalog, not
    the model. The adapter reads through the API the list of scripts that the monitoring system
    gives its account on a node, and passes to the core with the event `ext.monitor.scripts.v1` only
    the `scriptid` and an input flag, without names and texts, and only when the list hash changes
    (it compares the hash at start and every 10 minutes); the core checks the catalog `scriptid`
    against this list with code: a catalog script that the monitoring system does not give on the
    node does not enter the closed values of `script`, and a name from the API never enters the
    model context. A script with free input is not allowed; a script that asks for a choice from a
    list defined in the script itself is allowed, and the choice is also checked against that list.
    The core creates a delivery for E5 of kind `monitor_script`; the adapter of this tenant checks
    that the node is linked to a catalog resource (otherwise `forbidden`) and that the `scriptid` is
    in the node's last list (otherwise `script_unknown`), runs the script through the monitoring
    system API once and returns the result to the core through P1. The model gets the result only as
    closed fields: the result code and the `service_grant` number or `approval_id`. The script
    output, truncated to 4096 bytes, is stored by the core as a task journal file marked as
    untrusted text; an attempt that reads this file gets `untrusted_seen` (INJ-13), and the output
    does not go into the note or the audit. If the task has an initiator, a person or an external
    program, it must have its own capability `monitor.script_run`, as for ordinary actions (D-73,
    APR-18): without it the call gets `forbidden` even though the role has the permission; an
    external program (`service`) gets it only with an explicit line. A call from the allowed list
    goes without an approval card (D-68, D-74, APR-18), except for a task with `untrusted_seen`
    (INJ-15, D-70); it carries the number of a `service_grant` audit record (bot, role, task, node,
    script, task reason code), and the toolhost runs it once by this number. The guards are the same
    as for service actions (MON-8): no more than 6 runs of one script on one node per hour and a
    total limit of 30 actions per tenant per hour, an extra call gets `service_rate_limited` and
    raises `alarm.service.control.rate`; one script per node at a time (`exclusive: resource`);
    holds with `no_tool` or `no_action` give `denied(held)`. Each run writes an audit record and a
    code note `service_control_done` on the task's `monitor_event` problem, and if there is none, on
    the last open problem of the node; if there are no open problems on the node, there is no note.
    The manager is limited on top of this by the seat limits (MGR-14) and by the incident class
    field `responses.monitor_scripts`. Scripts on farm nodes and on nodes not linked by a tenant
    catalog are unavailable (MON-4). Fixtures: a resource without `monitor_host` and a node of
    another tenant are rejected; a role without `monitor_scripts` and a role whose list does not
    contain the name get `forbidden`; a run at the request of `carol` without the capability
    `monitor.script_run` gets `forbidden` despite the role permission; a script with free input does
    not enter the closed values; a catalog script that is not in the node's last list gets
    `script_unknown`; a script name with a canary from the mock monitoring system API does not
    appear in the model context; an unchanged script list over a day gives one
    `ext.monitor.scripts.v1` event; an attempt that read an output file with a canary gets
    `untrusted_seen`, and the canary is neither in the result for the model, nor in the note, nor in
    the audit.
  goal: G2
  check: [adapter, fixture, blackbox]
  waivable: false
  version: v0.1
  profile: monitor
  decisions: [D-67, D-68, D-69, D-70, D-73, D-74, D-75, D-88]
  fixtures: [blackbox:monitor/script-name-closed, fixture:authorize/service-initiator]
  doc: docs/operations.md

- id: MON-11
  title: Export of alarms and the audit head does not die
  status: active
  text: >-
    Deliveries for E5 of kinds `monitor_alarm` and `monitor_audit_head` do not end `dead` by attempt
    count: the core repeats them with a growing pause of up to 10 minutes while the alarm episode is
    open (for `firing`), until the closing is exported (for `resolved`) or until the audit head is
    exported; a newer delivery of the same `alarmkey` replaces the old one. The export includes the
    episode's `seq` (OBS-6); the adapter hands events to the monitoring system in `seq` order per
    `alarmkey`, and `resolved` does not go out before `firing` of the same episode. When the
    connection to the monitoring system is restored (the first successful `complete` of a delivery
    after a failure), the `alarm` loop re-exports all open episodes and the last audit head of each
    tenant: a gap during the failure leaves in the monitoring system neither an open problem without
    an episode nor an episode without a problem. The core keeps per tenant the age of the last
    successful export `monitor_export_age_s`; it is part of the P2 `health` answer (MON-2) and of
    `doctor` (OBS-11). If the age is more than 15 minutes, the core raises the alarm
    `alarm.monitor.export_stalled` (`warn`, it reaches the monitoring system when the connection
    returns) and sends the code message `monitor_export_stalled` to the tenant admins and the
    operator no more often than once in 6 hours (MON-12). Fixtures: the mock monitoring system is
    unavailable for 30 minutes, and a `page` alarm is raised during that time; after the return the
    problem appears in the monitoring system, the delivery is not `dead`, `monitor_export_age_s` is
    reset; `resolved` with `seq` 2 delivered before `firing` with `seq` 1 does not close the problem
    before it opens; after 15 minutes of unavailability there is one `monitor_export_stalled`
    message, and after 20 minutes there is no second one.
  goal: G4
  check: [fixture, blackbox]
  waivable: false
  version: v0.1
  profile: monitor
  decisions: [D-88]
  fixtures: [blackbox:monitor/export-retry, blackbox:monitor/export-order, blackbox:monitor/export-stalled]
  doc: docs/operations.md

- id: MON-12
  title: Alarm export to the monitoring system
  status: active
  text: >-
    In an installation with profile `monitor` the farm does not deliver alarms to people itself
    (MON-1, D-88). Each change of an alarm episode (`firing`, `resolved`, OBS-6) is put by the core
    in the same transaction as a delivery for the E5 monitoring adapter, and the adapter passes it
    to the monitoring system as a value on a farm node with the tags `tenant`, `alarm` (the alarm
    name without `alarm.` and `.vN`), `subject` (id from the catalog), `severity`, `scope`
    (`tenant`, or `farm` for alarms about the farm itself), `origin` (`code`, or `monitor` for
    alarms from a monitoring problem, MON-5) and `key` (`<tenant>:<alarm>:<subject>`, the same as
    `alarmkey`); each tenant has its own adapter process, and alarms about the farm itself are
    exported by the process of the service tenant `farm`. Severity is mapped as follows: `info` to
    Information, `warn` to Warning, `page` to High. The export value and data are only numbers and
    `enum` values from the alarm schema, without ids of people and without texts. A repeated
    `firing` with the same `alarmkey` gives no export. Paging people about an unhandled incident
    also goes along this path: the alarm `alarm.incident.unhandled` with `severity: page`, which the
    `incident` loop raises if within `page_if_unhandled_after` there is neither an operation nor a
    P2 `incident.ack`. Deduplication of notifications, their repeats, the "Acknowledged"
    confirmation, escalation, on-call schedules and silencing are done in the monitoring system.
    Farm channels (E1) do not deliver alarms, and `apply` lint rejects a route that delivers an
    `alarm.*` event to people. A failed export is repeated while the episode is open (MON-11) and
    does not change the episode state. The only exception to this rule: if export to the monitoring
    system fails for longer than 15 minutes, code sends the tenant admins and the operator in a
    private chat a code message from template `monitor_export_stalled` (only the tenant and the age
    of the last successful export, without model text), no more often than once in 6 hours; this is
    not a delivery of an alarm to people, but a message that alarms are not getting through.
    Fixture: a `firing` alarm gives one delivery for E5 with tags and no E1 delivery; 60 identical
    `firing` events in an hour give one delivery for E5.
  goal: C5
  check: [fixture, lint, blackbox]
  waivable: false
  version: v0.1
  profile: monitor
  decisions: [D-59, D-62, D-66, D-71, D-80, D-88]
  fixtures: [blackbox:monitor/export-stalled, blackbox:core/alarm-path-monitor]
  doc: docs/operations.md

- id: MON-13
  title: Alarms to people by core delivery without a monitoring system
  status: active
  text: >-
    In an installation without profile `monitor`, the core, in the same transaction that changes an
    alarm episode (`firing`, `resolved`, OBS-6), puts a delivery of the code text `alarm_notice`
    into a private chat: for a tenant alarm to its admins, for an alarm about the farm itself
    (`scope: farm`) to the admins of the service tenant `farm`. The text comes only from the code
    text catalog: the alarm name, severity, state, `subject` from the catalog, the episode `seq` and
    the time, without ids of people, model text or tenant data beyond that. A repeated `firing` with
    the same `alarmkey` gives no message; a `page` alarm repeats the message every 30 minutes while
    the episode is open and there is no P2 `incident.ack` on its incident; notification preferences
    (DLV-10) do not defer `page`. An `alarm_notice` delivery does not end `dead` by attempt count
    while the episode is open, and goes in `seq` order per `alarmkey`, like the export (MON-11). If
    a tenant has no admin with a private chat, the `farm` admins get the message. The "Acknowledged"
    confirmation, escalation and on-call schedules are not kept on this path: only the monitoring
    system gives them (profile `monitor`). Fixtures: a `firing` alarm of tenant `demo` gives one
    `alarm_notice` delivery to each admin of `demo` and no delivery for E5; 60 identical `firing`
    events in an hour give one message; `resolved` gives a second one; a `page` alarm without
    `incident.ack` for 70 minutes gives two reminders; an alarm about the farm goes to the `farm`
    admins.
  goal: C5
  check: [fixture, blackbox]
  waivable: false
  version: v0.1
  profile: core
  decisions: [D-88]
  fixtures: [blackbox:core/alarm-notice-no-monitor]
  doc: docs/operations.md

- id: MSG-1
  title: Message envelope and core fields
  status: active
  text: >-
    A message is stored and transmitted in the envelope `botaru.message/v1`, which is a CloudEvents
    1.0 event in structured JSON. The sender sets only the type (`type`), the address (`to` or
    `reply_to`), the fields (`fields`), the note (`note`, if the type allows it), its own
    idempotency key and an expiry (`ttl`) no longer than the type's expiry. All CloudEvents
    attributes and all extensions (`tenant`, `msgkind`, `msgto`, `msgdelivery`, `replyto`,
    `fromrole`, `fromworker`, `fromtask`, `correlationid`, `causationid`, `idempotencykey`, `hops`,
    `datamark`, `untrusted`, `untrustedsrc`, `dataorigin`, `origininitiators`, `expiresat`,
    `traceparent`) are written only by the core from the credentials, the attempt record
    and the type manifest; the schema rejects a request that carries any of them. `dataorigin`
    equals `model` if the model wrote the fields, including in the core's auto-report on an agent
    task, and `code` in all other cases.
  goal: G2
  check: [fixture, blackbox]
  waivable: false
  version: v0.1
  profile: messaging
  decisions: [D-14, D-71]
  fixtures: [fx-msg-01]
  doc: docs/messaging.md

- id: MSG-2
  title: The message type is declared in git
  status: active
  text: >-
    Each message type is a `MessageType` manifest in git with the name `<genus>.<name>.vN`. The
    genus comes from a closed list: `report` and `state`; a new genus is introduced only through an
    ADR and a new minor version of the envelope. `apply` accepts a type only if it declares the
    genus, `fields_schema`, `data_class`, the delivery mode (for genus `report`; for `state` a new
    value replaces the previous one by the genus itself), an expiry (`ttl` for `report`,
    `stale_after` for `state`) not above the genus ceiling, `max_bytes`, `producers`, `rate` and the
    note policy. The leaves of `fields_schema` pass the INJ-1 check: `enum`, `enum_from`, `const`,
    numbers with bounds, `boolean`, strings only with an `x-botaru-format` from the format registry;
    `additionalProperties: false` everywhere, `maxItems` on arrays. The formats of capability,
    approval, `system:` key, URL, address, `file_ref`, task id and worker id are forbidden in
    fields. A type of genus `state` that has `agent` in `producers` does not pass `apply`.
  goal: G2
  check: [lint, fixture]
  waivable: false
  version: v0.1
  profile: messaging
  decisions: [D-14, D-71]
  fixtures: [fx-msg-09]
  doc: docs/messaging.md

- id: MSG-3
  title: Message logs hold only metadata
  status: active
  text: >-
    In the audit, the event log and tracing a message has only metadata: id, type, genus, address,
    roles, sizes, hashes, reasons, `subject` (catalog id) and the fields, if all their leaves are
    `enum`, ids or numbers (AUD-2). The note is stored only in the erasable retention class
    `content` until the end of the record's period and does not enter any log. Each core decision
    about a message (send, hand-out, acknowledgement, return, refusal, `dead`, `expired`) writes an
    audit record (AUD-1).
  goal: C6
  check: [lint, blackbox]
  waivable: false
  version: v0.1
  profile: messaging
  decisions: [D-14, D-71]
  fixtures: [fx-msg-journal-metadata]
  doc: docs/messaging.md

- id: MSG-4
  title: An address only within the tenant, only the core writes to an instance
  status: active
  text: >-
    A message address is exactly one of: `role:<name>`, `group:<name>` or a `reply_to` answer to an
    entry read by this attempt. The core resolves an address only within the sender's tenant; an
    address of another tenant, a nonexistent address and an address where no role accepts the type
    get the same `rejected(address_invalid)`. The model chooses an address only from the `enum` that
    the core builds from its role's `messages.send`; the core chooses the recipient of a reply: the
    reply goes to the inbox of the role from the `fromrole` of the entry that was read. The address
    `worker:<id>` (a specific worker) is written only by the core (D-32): copies of an `all`
    delivery and the core's own messages; neither the model nor worker code has such an address. A
    canary mark of tenant A written into a field or a note does not appear in the inboxes, tasks or
    model requests of tenant B.
  goal: C3
  check: [fixture, blackbox]
  waivable: false
  version: v0.1
  profile: messaging
  decisions: [D-14, D-32, D-71]
  fixtures: [fx-msg-02, peer-08, peer-09]
  doc: docs/messaging.md

- id: MSG-5
  title: Who can write to whom
  status: active
  text: >-
    A type V can be sent to an address A only if all conditions hold: the pair (V, A) is in the
    `messages.send` of the sender's role; the sender kind (`agent` for the model, `job` for a code
    attempt, `code` for worker code outside an attempt, `core` for the core) is in the type's
    `producers`; at least one recipient role declares `receive` of type V; when sending from an
    attempt, the initiator of its task has the capability `msg.send:<V>` (for initiator `system`,
    through group `system-ops`). A reply to an entry that was read passes the same check for the
    pair (V, the sender role of the entry read). `apply` rejects a pair without a recipient role, a
    pair with delivery `all` to a role without `instance_inbox: true`, any address to a role of
    profile `reviewer`, `aggregator`, `farm-manager`, `farm-manager-reader` or `translator` (these
    profiles have empty `messages.receive`, PRF-1) and any non-empty `messages.send` of a role of
    profile `reporter`. The check is repeated at every send (PRM-3).
  goal: G2
  check: [lint, fixture, blackbox]
  waivable: false
  version: v0.1
  profile: messaging
  decisions: [D-14, D-18, D-40, D-71]
  fixtures: [fx-msg-08, fx-msg-09, peer-02]
  doc: docs/messaging.md

- id: MSG-6
  title: The mark and the distrust flag travel with the message
  status: active
  text: >-
    The core writes into a message a `datamark` equal to the mark of the sender's attempt (for code
    outside an attempt, the type's class), and `untrusted` equal to the attempt's `untrusted_seen`
    flag, OR the presence of a note, OR the fact that the model wrote the fields; the flag sources
    go into `untrustedsrc`. Sending a type whose `data_class` is below the sender's mark is rejected
    (`data_class_exceeded`): the class is not lowered through a message. An attempt gets only
    entries with a mark not above its own; the rest are not handed out and are counted in the number
    `hidden`. Reading an entry with `untrusted: true` sets `untrusted_seen` on the reading attempt
    with the source "message of type V from role R" (INJ-13). The mark of the reading attempt does
    not change from reading.
  goal: G2
  check: [fixture, blackbox]
  waivable: false
  version: v0.1
  profile: messaging
  decisions: [D-14, D-71]
  fixtures: [fx-msg-05, fx-msg-06, peer-01]
  doc: docs/messaging.md

- id: MSG-7
  title: A message grants no permissions and enqueues no tasks
  status: active
  text: >-
    A message does not grant or change the recipient's permissions, tier, mark, budget, delivery
    target or conversation, does not create approvals or cards, and does not enqueue tasks,
    including through a wake-up. Reading an entry through `inbox_read` or `msg.receive` adds the
    `origininitiators` of the entry read to the initiator set of the reading attempt; C2 intersects
    the attempt's permissions with the permissions of each initiator, so a child and a campaign of
    such an attempt pass `task:<type>` and `data:<mark>` of all its initiators. A task appears
    because of a message only in two ways: a tenant route from git (MSG-16) or an enqueue from the
    reading attempt within its permissions, depth and budget (PRM-6, ORC-6). Worker code outside an
    attempt does not enqueue tasks.
  goal: G2
  check: [fixture, blackbox, lint, eval]
  waivable: false
  version: v0.1
  profile: messaging
  decisions: [D-14, D-40, D-71]
  fixtures: [fx-msg-launder, inj-peer-mgr-01, peer-01, peer-05]
  doc: docs/messaging.md

- id: MSG-8
  title: A message reaches the model only at its request
  status: active
  text: >-
    The model sees the content of an inbox entry only as the output of a read tool it called itself,
    in the INJ-4 wrapper. For an agent this is P3 `inbox_read`: it is in the attempt's `tools/list`
    only if its task type declared `inbox.read`. A message is never put into the instruction, the
    `goal` or the start of a session, and is not inserted into a running attempt without its call;
    the core builds the `goal` of a task enqueued because of a message from the route or type
    template. There is no network path between runtimes (DEP-5). Check: a mock provider behind P4
    sees the message text only inside a tool result block.
  goal: G2
  check: [fixture, blackbox, adapter, lint]
  waivable: false
  version: v0.1
  profile: messaging
  decisions: [D-14, D-71]
  fixtures: [fx-msg-08, peer-04]
  doc: docs/messaging.md

- id: MSG-9
  title: Publishing and acknowledgement together with complete
  status: active
  text: >-
    The core holds messages sent from an attempt in state `staged` and publishes them in the
    `complete` transaction of that attempt (DLV-2); an attempt that failed, was canceled, was
    preempted or lost its lease publishes nothing (FEN-4). A retry of an attempt does not duplicate
    messages: core key `system:msg:<attempt>:<n>`. Entries that the attempt read are leased by it
    and acknowledged in the same `complete` transaction. On `fail`, lease loss and `msg.nack` the
    entry returns to the inbox with the hand-out count increased by one; after the third hand-out
    the entry moves to `dead(delivery_exhausted)`. On cancellation and preemption of the attempt,
    and on a lease that expired while the core was not running (FEN-5), the entry returns without
    counting a hand-out. A new value of genus `state` replaces the previous one in one transaction.
  goal: G1
  check: [blackbox]
  waivable: false
  version: v0.1
  profile: messaging
  decisions: [D-14, D-03, D-71]
  fixtures: [fx-msg-03, fx-msg-04]
  doc: docs/messaging.md

- id: MSG-10
  title: "One sender's share of an inbox"
  status: retired
  retired: 2026-10-14
  reason: >-
    Merged into MSG-15 in the simplification of v0.4 (D-114): the same behaviour, written once.
  replaced_by: [MSG-15]

- id: MSG-11
  title: Hops, the tree and the wake-up budget
  status: active
  text: >-
    A message's `hops` equals the effective depth of the sender's attempt plus one. Reading raises
    the "depth floor" of the reading attempt to the highest `hops` of what it read; a wake-up task
    gets a depth not less than the highest `hops` of its entries; sending with `hops` greater than 5
    gives `rejected(hops_exceeded)` (PRM-6). A message and a wake-up carry `correlationid` onward
    (the root of the original tree), and tree limits (`max_tree_tasks` and tree money) are counted
    by it. A wake-up task reserves the price estimate in all applicable BUD-1 limits, including the
    daily limit of each principal from `origininitiators`, and also in the tenant's daily wake-up
    ceiling `Tenant.spec.messaging.wake_day_eur` (by default a tenth of
    `Tenant.spec.budgets.day_eur`), which the core keeps per pair (tenant, recipient role); the
    number of wake-up tasks per day per tenant is no more than `Tenant.spec.messaging.wakes_per_day`
    (200 by default). If any of the money limits is exhausted, the wake-up is skipped with the event
    `wake.skipped` and reason `budget_exhausted`; if the count is exhausted, with reason
    `service_rate_limited`; in both cases the entries wait until their expiry. A tenant can only
    lower both values. The core writes the cost of the message itself as a usage line with unit
    `message` (size, type) into the sender's tree (BUD-3).
  goal: G3
  check: [fixture, blackbox]
  waivable: false
  version: v0.1
  profile: messaging
  decisions: [D-14, D-71]
  fixtures: [fx-msg-05, inj-peer-mgr-03, peer-03, fx-msg-10]
  doc: docs/messaging.md

- id: MSG-12
  title: Entry expiry
  status: active
  text: >-
    Each inbox entry has an expiry `expiresat`, which the core sets from the type's expiry: 24 hours
    by default for `report`, the type can raise it to 7 days, and the sender can only shorten it. An
    entry of genus `state` becomes stale after the type's `stale_after`, no more than 1 hour, and
    after that it is read with the mark `stale`. An expired entry is not handed out, wakes no one
    and creates no tasks or notifications. The `start_by` of a wake-up task is no later than the
    latest expiry of the entries it was enqueued for. The `inbox` loop moves expired entries to
    `expired`, and their content is deleted by retention class `content`.
  goal: G1
  check: [blackbox]
  waivable: false
  version: v0.1
  profile: messaging
  decisions: [D-14, D-71]
  fixtures: [blackbox:messaging/ttl-expired]
  doc: docs/messaging.md

- id: MSG-13
  title: A note is always untrusted and stays out of logs
  status: active
  text: >-
    A note `data.note` exists only for types of genus `report` that allow it (`note.max_chars`
    greater than 0), and never for `state`. Its length is no more than the type's `note.max_chars`,
    with a ceiling of 500 characters; otherwise the send gets `rejected(note_not_allowed)`. A
    message with a note is always `untrusted: true` with source `note`. The recipient's model sees
    the note only in the untrusted text wrapper (INJ-4). The note is not written into the event log,
    the audit or tracing and is stored only in the erasable class `content` until the end of the
    entry's period (MSG-3).
  goal: G2
  check: [lint, fixture, blackbox]
  waivable: false
  version: v0.1
  profile: messaging
  decisions: [D-14, D-71]
  fixtures: [fx-msg-note]
  doc: docs/messaging.md

- id: MSG-14
  title: The type sets the delivery mode
  status: active
  text: >-
    The message type sets the delivery mode. `one`: the entry sits in the inbox of a role or bot
    group and is handed out to one reader at a time. `all`: at publishing the core puts a copy into
    the inbox of each active recipient worker (only for roles with `instance_inbox: true`), no more
    than 50 recipients; the rest get no copies, and the sender sees the number of recipients. For
    genus `report` an "at least once" guarantee applies until the entry's expiry; order is promised
    only within one inbox (by the number the core assigns). An entry of genus `state` is stored as
    the last value per (inbox, sender worker, type): a new value replaces the previous one, and such
    an entry has no lease and no acknowledgement.
  goal: G1
  check: [blackbox, fixture]
  waivable: false
  version: v0.1
  profile: messaging
  decisions: [D-14, D-71]
  fixtures: [fx-msg-07]
  doc: docs/messaging.md

- id: MSG-15
  title: "Size, rate, capacity and sender share limits"
  status: active
  text: >-
    An envelope is no more than 8 KiB; the fields are no more than the type's `max_bytes` with a
    ceiling of 4 KiB (otherwise `rejected(data_schema_invalid)`). One attempt sends no more than 3
    messages (the fourth gets `rejected(service_rate_limited)`); the rate per (tenant, sender role,
    type) is no higher than the type's `rate` and the farm ceiling of 120 per hour (otherwise
    `service_rate_limited` and one event per period); `state` no more often than once a minute per
    (worker, type), plus on a change of `phase`. Inbox capacity: 100 entries for a worker inbox,
    1000 for a role inbox and a bot group inbox. The next wake-up task of one route is no earlier
    than the route window, and the window is no shorter than 5 minutes. The default values are in
    the binding; a tenant and a type can only lower them, and the ceilings themselves cannot be
    waived. One sender role takes no more than 25% of the capacity of one inbox. An entry beyond
    this share gets `rejected(sender_quota)`, and only this role gets the refusal; entries of other
    roles are accepted. A full inbox gives the sender `rejected(inbox_full)` and one event per
    (inbox, period). Old entries are not silently evicted or lost. On the first share or fullness
    refusal in a period, the core raises the event `inbox.flood` with code. Lint builds the graph
    "role, type, address, wake-up route, task type, role" and warns about cycles; at run time MSG-11
    breaks a cycle.
  goal: G3
  check: [blackbox, lint, fixture]
  waivable: false
  version: v0.1
  profile: messaging
  decisions: [D-14, D-71]
  fixtures: [inj-peer-mgr-03, peer-06, fx-msg-flood, fx-msg-07]
  doc: docs/messaging.md

- id: MSG-16
  title: Tasks and notifications from messages only by routes from git
  status: active
  text: >-
    A task or a notification because of a message is created only by a tenant route from git: `on:
    inbox` (a wake-up of a role or bot group), `on: message` (a notification to people from a code
    template) or `on: task_done` (a core auto-report). The model, a worker and an external program
    do not create, change or remove routes at run time. A route from a message does not enqueue
    `action.*` (APR-5). A notification to people by a route goes only from entries with `dataorigin:
    code` and `untrusted: false`; a route does not deliver alarms to people, the monitoring system
    passes them on (MON-1); a type with `alarm.*` does not declare `inbox.read` and does not get
    entries with `dataorigin: model` or `untrusted: true` by a route (INJ-7). The core enqueues a
    wake-up task from `system` (a type in group `system-ops`, PRM-10) with key
    `system:wake:<route>:<window>`; its goal is taken from the type template, and it reads the
    entries with a tool. The core publishes an `on: task_done` auto-report in the transaction of the
    task's terminal transition with the fields from the type's `summary_fields` (only closed INJ-1
    kinds), the task's mark and flag, and key `system:report:<task>:<route>`. Route filters are only
    an exact match and a prefix on `subject`.
  goal: G2
  check: [lint, blackbox, fixture]
  waivable: false
  version: v0.1
  profile: messaging
  decisions: [D-14, D-62, D-71]
  fixtures: [peer-02, peer-09]
  doc: docs/messaging.md

- id: MSG-17
  title: Activity from a non-principal in a bound chat
  status: active
  text: >-
    Activity in a bound chat from a channel identity that is not mapped to a tenant principal
    (including in a group chat with `membership_assurance: none`) creates no `Activity`, task, file
    (`file.put` is not called) or session record; the core does not store the text and attachments
    and does not write them into logs, and only the event `activity.ignored` with reason
    `not_subject`, the channel identity and the chat goes into the audit. Channel code answers with
    a repeat of the notices `ai_notice` and `privacy_notice` as code text (DLV-9, DLV-12), without a
    model, no more often than once per `notice_repeat` (90 days by default) per pair (chat, channel
    identity); in a private chat the answer also carries the code text "you are not registered with
    this bot". For a participant who is mapped to a principal and joined a bound group chat with
    `membership_assurance: enforced`, the core repeats `privacy_notice` under SEC-13; this rule
    concerns only unmapped identities. Check: fixture `fx-msg-11` submits activity from an unknown
    identity into the `demo` group chat and expects no `Activity`, file or session record, one
    `activity.ignored(not_subject)` event and one notice delivery; a second activity on the same day
    gives an event and no delivery.
  goal: C6
  check: [fixture, adapter, blackbox]
  waivable: false
  version: v0.1
  profile: messaging
  decisions: [D-71]
  fixtures: [fx-msg-11]
  doc: docs/messaging.md

- id: MSG-18
  title: Message and inbox views for people
  status: active
  text: >-
    P2 `msg.list`, `msg.show` and `inbox.status` show messages and inboxes to the operator (any
    tenant) and to a person with `admin:people` (only their own tenant) as metadata (MSG-3): id,
    type, genus, address, sender role, state, times, size, hand-out count, reason, and only the
    fields whose leaves are all `enum` values, ids or numbers. `msg.list` filters only by closed
    values (type, role, state, a time window) and returns at most 200 rows per page. `msg.show`
    returns the note only to a person with `audit.read` in the message's tenant who also has
    `data:<mark>` for the message's `datamark` (ART-3), in an untrusted text wrapper, and writes an
    audit record of that read; any other caller, the operator included, gets the message without
    the note. `inbox.status` gives for each (tenant, role) inbox the counts by state, the age of the
    oldest waiting entry, the capacity and the wake-up budget left. A message or inbox of another
    tenant and a nonexistent one give the same `not_found`. No model or worker calls these
    operations.
  goal: G6
  check: [blackbox]
  waivable: true
  version: v0.2
  profile: messaging
  decisions: [D-106]
  fixtures: [blackbox:messaging/p2-message-views]
  doc: docs/messaging.md

- id: OBS-1
  title: Telemetry without content
  status: active
  text: >-
    Traces, metrics, process logs and health reports are subject to AUD-2: they hold only ids,
    sizes, hashes, times, codes and names from closed lists. The content attributes of the
    OpenTelemetry GenAI conventions (input and output messages, system instructions, tool call
    arguments and results) are not enabled in any farm process. The farm telemetry collector drops
    every attribute outside the allowlist of the binding `spec/bindings/telemetry/otel.md`. Metric
    labels come only from closed sets (tenant, task type, role, plugin, tool, reason, state),
    without ids of people, chats and external systems. Runtime telemetry goes only through the E4
    adapter or not at all. A log that may contain content (runtime transcripts, plugin stderr,
    channel debug output) belongs to retention class `content` (RET-1), and only metadata leaves it.
    Check: a mock telemetry collector; canaries in the task body, plugin output, mock model answer
    and attachment file name do not appear in exported telemetry; lint of deployment configs.
  goal: C6
  check: [blackbox, lint]
  waivable: false
  version: v0.1
  profile: core
  decisions: []
  fixtures: [canaries/telemetry/]
  doc: docs/operations.md

- id: OBS-2
  title: One trace per task tree
  status: active
  text: >-
    The core writes the field `trace` into a task (the W3C `traceparent` of the root), and all tasks
    of one tree have one trace id. Into each event the core writes `correlationid`, equal to the id
    of the tree root, and `causationid`, equal to the id of the direct cause: the parent task, the
    approval (for `action.*`), the event (for a route task), the incoming message (for a channel
    task) or the schedule slot. An attempt, a model call in P4, a tool call, a delivery and an
    approval decision are spans of one trace; the core assigns the span parent. The toolhost passes
    context to a plugin only in `_meta.traceparent`. Fixture: a tree of three tasks with tool calls
    gives one trace id, and all events have `correlationid` equal to the root id.
  goal: G4
  check: [blackbox]
  waivable: true
  version: v0.1
  profile: core
  decisions: [D-94]
  fixtures: []
  doc: docs/operations.md

- id: OBS-3
  title: External trace context decides nothing
  status: active
  text: >-
    Trace context that came from outside (from an external program, a runtime, a plugin or a future
    A2A entry) does not affect any core decision: the tenant, the principal, the task and
    permissions are never taken from it. External `baggage` and `tracestate` are dropped at the core
    boundary and are not passed into a plugin call. An external `traceparent` is kept only as a link
    to a foreign trace. Fixture: `enqueue` with a foreign `traceparent` and `baggage: tenant=demo2`
    changes nothing, and the plugin does not get `baggage`.
  goal: G2
  check: [blackbox]
  waivable: false
  version: v0.1
  profile: core
  decisions: [D-94]
  fixtures: []
  doc: docs/operations.md

- id: OBS-4
  title: Worker liveness and loop ticks
  status: active
  text: >-
    A worker has `last_seen`: the time of its last P1 call of any kind, including waiting in `claim`
    and `msg.receive`. A worker not seen for longer than two long-poll periods gives the event
    `worker.stale` and an alarm by code. This is a core observation, not a worker lifecycle state,
    and the worker's self-report does not change it (STA-2). The `worker-liveness` loop counts by
    `last_seen`, not by heartbeat. Each core background loop marks a tick in the store; the tick age
    of each loop and missed ticks are visible in P2 `doctor` and are part of the P2
    `health` answer that the monitoring system polls (MON-2). Fixture: a worker is silent for longer
    than two long-poll periods, the core writes `worker.stale` and raises an alarm, although the
    worker's last self-report is `idle`.
  goal: G1
  check: [blackbox]
  waivable: true
  version: v0.1
  profile: core
  decisions: [D-60]
  fixtures: [blackbox:core/worker-stale]
  doc: docs/operations.md

