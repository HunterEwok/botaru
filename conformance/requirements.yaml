- id: MAN-8
  title: The implementation declares the skeleton version and profiles
  status: active
  text: >-
    The implementation declares the skeleton version and conformance profiles with the field
    `conforms_to: {skeleton: <version>, profiles: [core, ...]}` in P2 `status` and in the runner
    report. The runner checks the active rules of the declared profiles whose `version` is not newer
    than the declared version and whose `until`, when set, is not older than it (a rule with `until`
    is replaced from the next version by the rules of its `superseded_by`, D-113); a rule with `waivable: false` in the expected failures file fails the
    run.
  goal: C10
  check: [lint]
  waivable: true
  version: v0.1
  profile: core
