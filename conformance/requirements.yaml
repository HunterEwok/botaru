    server-side compaction iterations. Three quantities have their own names: the task tree limit
    `tree_budget_eur` in the task type (an amount in euros), the output limit of one call
    `max_output_tokens` in the model profile (reasoning counts as output) and the input limit of one
    runtime run `run_max_input_tokens` in the `limits` of the attempt work item, next to `max_turns` and `deadline`. There is no `max_tokens` field in the
    farm's manifests and contracts; lint rejects it. `tree_budget_eur` is required for every task
    type with a model, including review types `review.*`, analysis, aggregation and the manager;
    lint at `apply` rejects a type with a model without it, and also a type whose `tree_budget_eur`
    is less than the reserve of one call under the profile of the purpose's slot and its fallbacks
    (code `tree_budget_below_call`, GW-2).
