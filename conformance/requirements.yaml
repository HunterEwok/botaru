- id: IDM-3
  title: A repeat of holder operations gives the same answer
  status: active
  text: >-
    A repeat of `heartbeat`, `complete`, `fail`, `release`, `cancel` and `decide` with the same
    arguments gives the same answer, and the side records (transition, event, deliveries, usage,
    audit) appear once. For `decide`, "the same arguments" means the same principal, the same
    subject `(subject_kind, id, nonce)` and the same decision: such a repeat (a double press, a
    channel retry) gets the same success answer, and there stays one write call. A different
    decision on an already decided subject, or a press by another principal, gets `already_decided`,
    and nothing changes (APR-4). Fixtures: `blackbox:channel/double-press` (the same person, the
    same decision: two identical successes, one write call) and `blackbox:channel/decide-other`
    (another person or another decision after the first: `already_decided`).
  goal: G2
  check: [blackbox]
  waivable: true
  version: v0.1
  profile: core
  decisions: []
  fixtures: [blackbox:channel/double-press, blackbox:channel/decide-other]
  doc: docs/tasks-and-delivery.md

- id: IDM-4
  title: An event is unique by source and id, which the core sets
  status: active
  text: >-
    An event is unique by the pair `source` and `id` (CloudEvents), and the core assigns both values
    from the sender's credentials. Otherwise a worker could take the id of a real event, including
    `alarm.*`, and the real one would be discarded as a duplicate. P1 `emit` is accepted only with
    the token of a live attempt and only for event types from the `events` of its task type. A route
    is declared in the tenant's git and reads events only of its own tenant. A route on an alarm
    event `alarm.*` can only enqueue a task: alarms reach people only along the installation's one
    alarm path (MON-1).
  goal: G4
  check: [blackbox]
  waivable: true
  version: v0.1
  profile: core
  decisions: [D-62]
  fixtures: [blackbox:core/event-source-id]
  doc: docs/tasks-and-delivery.md

