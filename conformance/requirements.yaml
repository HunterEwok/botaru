- id: REP-12
  title: Code answers the initiator and lead commands
  status: active
  text: >-
    The commands `/tasks`, `/status <number>`, `/cancel <number>`, `/help`, `/team`, `/about` and
    `/lang` are answered by core and channel code, without a model and without a reporter task:
    `/tasks` and `/status` take rows from the `status.tasks` view, filtered by the permissions of
    the person who asked (REP-7, PRM-9); `/team` gives a person with the `team.view` permission a
    code table of the tasks of their group (states, waiting approvals, usage by type over the
    window, without usage by person, DLV-14); `/cancel` calls task cancellation on behalf of the
    initiator under PRM-15; `/help` lists the tenant's commands (`commands`, `run`) with the `title`
    of types available to the person who asked; `/about` returns a code text about the bot, the
    tenant, the operator and `/mydata` and repeats `ai_notice` (DLV-12); `/lang <language>` sets the
    principal's `locale` from the closed list of catalog languages (DLV-9) and answers already in
    the new language. All texts of these answers, including table headings, reason codes and the
    refusal line with the needed group (`needs`), come from the code text catalog by the principal's
    `locale` (DLV-9), and the skeleton ships the catalog in `en`; the installation supplies other
    locales. The same catalog gives the texts that code draws without a command: the follow-up
    window hint under a bot question (`cmd.followup.hint`, CNT-5), the notices `ai_notice`,
    `privacy_notice` with substitutions from the privacy block and `notice_version` (SEC-13), the
    answer to a non-principal (MSG-17) and `principal_left` (IDN-13), the initiator copy of a card
    with the "Remind approvers" button and the reminder to approvers (APR-19), the attribution
    dispute cards `attribution_dispute` (`card.attribution_dispute`, buttons "Yes" and "Withdraw",
    GOV-13) and the outcome with the mark `self_measured` (`card.self_measured`, button "Count it",
    GOV-14); the keys and examples are listed in `docs/messaging.md`, code fills in the values in
    curly braces, and they contain no model text. An answer in a group chat is possible only for
