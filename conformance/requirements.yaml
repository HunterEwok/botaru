- id: MGR-20
  title: Manager money and turning off reading
  status: active
  text: >-
    Seat attempts in tenant T (decision, reading, daily review) are paid by the one `manager` line
    of tenant T, with its key and workspace; there is no farm-wide manager line, and the price of
    each attempt is written into a usage line. The `manager` line has a daily and a monthly limit
    (`budgets.lines.manager.day_eur` and `month_eur`) and is reserved before the call; 30% of the
    daily line is a reserve for sev1, and code stops work outside sev1 when 70% of the day is spent.
    `apply` lint: the `models_allowed` of every active tenant contains the seat model profile
    `farm_manager.model_profile` (slot `seat`, GW-7), the `manager` line is greater than 0, and its
    daily limit `manager.day_eur` is not less than the price of three readings of one worst-case
    incident at the seat profile prices: 60 thousand input tokens in total and three answers at the
    seat profile's `max_output_tokens`; otherwise `apply` rejects the tenant with reason
    `manager_line_too_small`. Lint skips a tenant with `farm_manager.enabled: false` (MGR-42): it
    has no `manager` line. The purpose `incident_review` is off in the template of a `kind:
    production` tenant and on for a test bench (D-77); a production tenant turns it on itself in
    `privacy.purposes`. If the tenant's `privacy.purposes` contains the purpose `incident_review`
    and no worker of a role with profile `farm-manager-reader` is enrolled in the tenant, `farmctl
    doctor` prints a warning, and `inspect` tasks in this tenant wait for a worker; without this
    purpose the reader role is not needed. If this purpose is off, the core does not enqueue tasks
    of purpose `inspect` in the tenant, and cancels running reading attempts in it in the same
    transaction as turning it off.
  goal: G3
  check: [blackbox, lint]
  waivable: false
  version: v0.1
  profile: manager
  decisions: [D-42, D-77, D-114]
  fixtures: [fx-mgr-line-too-small, fx-mgr-review-off-production]
  doc: docs/farm-manager.md

- id: MGR-21
  title: Takeover
  status: active
  text: >-
    A takeover creates a new task in tenant T of the same type with key `system:takeover:<task>`
    (IDM-2) and a grant of `kind: takeover` on the seat profile for 1 attempt in the tenant's
    `takeover` budget line. It needs all of these: the type is on the tenant list
    `takeover.types` (empty by default), the group permission `task.takeover:<type>`, a
    `takeover` line greater than 0 (0 by default), and the approval of a person of T with
    `model_grant.manage` (card `takeover_confirm`, `decide(subject_kind: takeover)`). Otherwise
    the refusal is `takeover_not_allowed`. The card is never lifted: the field
    `takeover.confirm_above_eur` is reserved, and `apply` rejects a value above 0
    (`takeover_confirm_threshold`). The `cap_eur` of the takeover grant is the estimate that the card
    showed, within the `takeover` line; a call that does not fit it does not start (MGR-18). The
    original task is canceled as
    `superseded_by_takeover`. The manager gets only a closed result. With `untrusted_seen` on
    the manager's attempt, takeover is forbidden (`takeover_untrusted`).
  goal: G1
  check: [blackbox, fixture]
  waivable: false
  version: v0.2
  until: v0.2
  superseded_by: [MGR-48]
  profile: manager
  decisions: [D-18, D-21]
  fixtures: [fx-mgr-takeover, manifests/v02-security-lints]
  doc: docs/farm-manager.md

- id: MGR-22
  title: Distrust mode
  status: active
  text: >-
    A decision attempt gets `untrusted_seen` if it read findings, an escalation or a grant request
    with a distrust flag. Only untrusted sources under INJ-13 set the mode: an alarm and an incident
    from a monitoring system problem of its own tenant with a trigger from the catalog (MON-5, D-82)
    do not turn it on, while the findings of the `farm-manager-reader` role are always `untrusted:
    true` (MGR-25) and do turn it on. In this mode `cancel` goes only through a `control` card,
    `service/control` and `monitor/script_run` only through an approval card to a person (INJ-15),
    no more than 1 `quarantine` per incident, a grant only to the first step of the ladder, takeover
    is forbidden, the card shows the source, and proposed facts get `untrusted_origin`.
  goal: G2
  check: [blackbox, eval]
  waivable: false
  version: v0.1
  profile: manager
  decisions: [D-30, D-70, D-82]
  fixtures: [mgr-inj-07]
