- id: BUD-10
  title: Reconciliation of usage with the provider report by code
  status: active
  text: >-
    Code reconciles the farm's usage per provider workspace with the provider's usage report. The
    operator exports the report file from the provider console (its format is in the provider
    binding) and imports it with `farmctl spend reconcile --file`; a process outside the core with
    the provider's reports key may hand in the same data. The core, workers and runtimes do not have
    the reports key. The data reaches the core through P2 `spend.reconcile`, one request per UTC
    day, and the core reconciles: the daily sum of the workspace's usage lines in micro-euros
    against the provider's daily sum (D-87 (1)). The difference is written as one signed correction
    line (`correction_eur_micros`), the `spend_estimated` lines of that day (BUD-11) get the marker
    `spend_reconciled` without a price change, and their reserve returns to the limits. A
    `spend_estimated` line that no reconciliation reached within `spend.estimate_release_after` from
    the deployment settings (7 days by default) releases its reserve by time: from then on it counts
    as zero in the limits and in the daily sum that reconciliation compares, and the correction line
    of its day brings in what the provider actually billed. If the difference exceeds the tolerance
    from the deployment settings, the core raises the alarm `alarm.spend.estimate_drift` (warn). The
    `budget` background loop watches that reconciliation runs: if a provider workspace has no
    `spend_reconciled` line for longer than `spend.reconcile_overdue_days` from the deployment
    settings (35 days by default, set to the rhythm of reconciliation), it raises the alarm
    `alarm.spend.reconcile_overdue` (warn) with the `subject` of that workspace, and a
    reconciliation closes the episode; the alarm is cleared neither by a person nor by time.
    `doctor` shows the age of the last reconciliation for each workspace. A reconciliation that
    fills the usage gap after a restore from a backup also clears `alarm.spend.unreconciled` and
    restores the daily limits (RET-6). Fixtures: a mock provider report for a day below the sum of
    the lines gives one correction line equal to the difference; the line prices are unchanged, and
    the reserve of the `spend_estimated` lines returned to the limits. A mock clock without a
    `spend_reconciled` line for longer than `spend.reconcile_overdue_days` gives
    `alarm.spend.reconcile_overdue`, and a reconciliation line moves it to `resolved`. A
    `spend_estimated` line older than `spend.estimate_release_after` without a reconciliation no
    longer counts toward the limits.
  goal: G3
  check: [blackbox, fixture]
  waivable: true
  version: v0.1
  profile: core
  decisions: [D-36, D-87, D-114]
  fixtures: [blackbox:gateway/estimate-reconciled, blackbox:core/reconcile-overdue]
  doc: docs/models-and-money.md

