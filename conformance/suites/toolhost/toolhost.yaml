# Suite checks toolhost/toolhost. This file is the source: edit it by hand.
# Format and fields: docs/quality.md, section "Suites". python3 ci/gen_suites.py fills version
# and the rules that name a check in their fixtures field; --check fails if anything is out of date.
suite: toolhost
area: toolhost
checks:
- id: adapter:toolhost/plugin-sampling-refused
  method: adapter
  rules:
  - INJ-5
  version: v0.1
  group: Bindings
  spec:
    What: a plugin declared `sampling` and asks for input
    Expectation: the capability is not passed, the input request ends with a call error
- id: adapter:toolhost/plugin-cancel-on-lease
  method: adapter
  rules:
  - FEN-6
  version: v0.1
  group: Bindings
  spec:
    What: the call lease expired by the toolhost clock
    Expectation: the plugin process is ended, nothing is written
- id: adapter:toolhost/sandbox-container
  method: adapter
  rules:
  - DEP-1
  - SBX-2
  version: v0.1
  group: Bindings
  spec:
    What: (v0.2) the sandbox toolhost runs two tasks of tenant `demo` one after the other; in the first the model's command
      tries to open a network socket, read `/run/secrets`, write to `/in` and fill `/out` above its limit, and prints 50 KB
    Expectation: each task gets a new container that is destroyed at the end; no network, no secret, `/in` read-only, the
      `/out` write above the limit fails; the model gets at most 32 KB after redaction and the attempt has `untrusted_seen`;
      the audit has the hash and length of `argv`; `sandbox_seconds` grows by the command time
