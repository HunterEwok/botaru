# Suite checks lint/http. This file is the source: edit it by hand.
# Format and fields: docs/quality.md, section "Suites". python3 ci/gen_suites.py fills version
# and the rules that name a check in their fixtures field; --check fails if anything is out of date.
suite: lint
area: http
checks:
- id: lint:http/p1-openapi
  method: lint
  rules:
  - MAN-12
  version: v0.2
  group: The design as a whole
  spec:
    What: (v0.2) a P1 row is added to `spec/ports/operations.yaml` without regenerating `spec/bindings/http/p1.openapi.json`
    Expectation: '`gen_openapi.py --check` fails; after the rebuild every body reference resolves to a `spec/model` file'
