# Suite checks lint/model. This file is the source: edit it by hand.
# Format and fields: docs/quality.md, section "Suites". python3 ci/gen_suites.py fills version
# and the rules that name a check in their fixtures field; --check fails if anything is out of date.
suite: lint
area: model
checks:
- id: lint:model/provider-terms-lint
  method: lint
  rules:
  - GW-15
  version: v0.1
  group: Holds, queue, backups and spend
  spec:
    What: 'a profile with `provider_training: true`; with `provider_human_review: yes` while `terms.human_review: abuse_only`;
      with a subprocessor outside `privacy.subprocessors`'
    Expectation: '`apply` rejects the profile in `models_allowed`; a call on it gets `provider_config`'
- id: lint:model/price-age-lint
  method: lint
  rules:
  - GW-17
  version: v0.1
  group: Holds, queue, backups and spend
  spec:
    What: '`price.checked` 70 days ago; 130 days ago'
    Expectation: a warning; an `apply` refusal
