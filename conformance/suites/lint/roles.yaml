# Suite checks lint/roles. This file is the source: edit it by hand.
# Format and fields: docs/quality.md, section "Suites". python3 ci/gen_suites.py fills version
# and the rules that name a check in their fixtures field; --check fails if anything is out of date.
suite: lint
area: roles
checks:
- id: lint:roles/profile-limits
  method: lint
  rules:
  - PRF-1
  version: v0.1
  group: Scripts and role profiles
  spec:
    What: a role declares what its profile forbids (`fx-rep-01` for `reporter`, the same fixtures for the other profiles)
    Expectation: '`apply` rejects the role; no built-in tools outside the profile in `tools/list`'
- id: lint:roles/aggregator-sources
  method: lint
  rules:
  - AGG-3
  version: v0.2
  group: Scripts and role profiles
  spec:
    What: (v0.2) an aggregator names a role of profile `aggregator` in `aggregate.sources.roles`, directly or through a bot
      group in `sources.bot_groups`, or lists more source entries than `max_sources` (`manifests/agg-02.yaml`)
    Expectation: '`apply` rejects the role with `aggregator_source_aggregator` or `aggregator_sources_over_max`'
