# Suite checks lint/manager. This file is the source: edit it by hand.
# Format and fields: docs/quality.md, section "Suites". python3 ci/gen_suites.py fills version
# and the rules that name a check in their fixtures field; --check fails if anything is out of date.
suite: lint
area: manager
checks:
- id: lint:manager/accountable-class
  method: lint
  rules:
  - GOV-48
  - MGR-55
  version: v0.3
  group: Accountability, the manager and the translator from v0.3
  spec:
    What: 'a class with `manager_accountable: true` whose alarm reads a series fed by model output; a class with `manager_accountable:
      true` whose alarm is built from code series only'
    Expectation: the first is rejected; the second passes
- id: lint:manager/line-covers-postmortem
  method: lint
  rules:
  - MGR-49
  version: v0.3
  group: Accountability, the manager and the translator from v0.3
  spec:
    What: a tenant whose daily `manager` line is below the daily review plus the analysis ceiling, or whose month line is
      below `takeover.manager_month_eur`
    Expectation: '`manager_line_too_small`'
