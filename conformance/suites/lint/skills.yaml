# Suite checks lint/skills. This file is the source: edit it by hand.
# Format and fields: docs/quality.md, section "Suites". python3 ci/gen_suites.py fills version
# and the rules that name a check in their fixtures field; --check fails if anything is out of date.
suite: lint
area: skills
checks:
- id: lint:skills/format
  method: lint
  rules:
  - SKL-1
  version: v0.2
  group: Model gateway, knowledge and external events
  spec:
    What: (v0.2) a skill folder with `scripts/run.sh`; an executable file; the field `allowed-tools` in `SKILL.md`; a binary
      file in `assets/`; a tree above the size limit
    Expectation: '`apply` rejects each set'
