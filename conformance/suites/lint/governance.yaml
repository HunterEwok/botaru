# Suite checks lint/governance. This file is the source: edit it by hand.
# Format and fields: docs/quality.md, section "Suites". python3 ci/gen_suites.py fills version
# and the rules that name a check in their fixtures field; --check fails if anything is out of date.
suite: lint
area: governance
checks:
- id: lint:governance/persona-v03
  method: lint
  rules:
  - GOV-45
  version: v0.3
  group: Accountability, the manager and the translator from v0.3
  spec:
    What: a manager persona without the anchor `purpose`; a commission persona with a sentence about accuracy scores and departure;
      persona with addenda over 4 KiB; a reporter addendum without an `accuracy` anchor
    Expectation: '`apply` rejects the first three; the fourth passes, since lint checks no other anchors'
