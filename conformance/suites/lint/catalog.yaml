# Suite checks lint/catalog. This file is the source: edit it by hand.
# Format and fields: docs/quality.md, section "Suites". python3 ci/gen_suites.py fills version
# and the rules that name a check in their fixtures field; --check fails if anything is out of date.
suite: lint
area: catalog
checks:
- id: lint:catalog/model-exposure
  method: lint
  rules:
  - PRV-4
  version: v0.2
  group: Model gateway, knowledge and external events
  spec:
    What: '(v0.2) a catalog resource with `model_exposure: none` has in `read_by` a tool of a role with `worker_kind: agent`;
      a resource with `aggregates` is read by an agent tool with `untrusted_output: true` (`manifests/model-exposure.yaml`)'
    Expectation: '`apply` rejects the set with `model_exposure_agent_read` or `model_exposure_not_aggregate`; at call time
      the core refuses the same call with `forbidden`'
- id: lint:catalog/curated-only-git
  method: lint
  rules:
  - KNW-2
  version: v0.2
  group: Model gateway, knowledge and external events
  spec:
    What: '(v0.2) a corpus with `trust: curated` and `source: upload` or `source: sync`; the same corpus with `source: git`'
    Expectation: '`apply` rejects the first two catalogs; the third passes'
- id: lint:catalog/host-one-tenant
  method: lint
  rules:
  - DEP-11
  - TEN-4
  version: v0.1
  group: People's data and erasure
  spec:
    What: 'a `demo2` catalog with `machine: web1` or `monitor_host: db1.example.org`, which are already in the `demo` catalog;
      the service `nginx` on `web1` in two catalogs'
    Expectation: '`apply` rejects the second catalog (D-75)'
