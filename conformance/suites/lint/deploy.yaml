# Suite checks lint/deploy. This file is the source: edit it by hand.
# Format and fields: docs/quality.md, section "Suites". python3 ci/gen_suites.py fills version
# and the rules that name a check in their fixtures field; --check fails if anything is out of date.
suite: lint
area: deploy
checks:
- id: lint:deploy/toolhost-on-farm-host
  method: lint
  rules:
  - DEP-10
  - DEP-11
  version: v0.1
  group: People's data and erasure
  spec:
    What: a deployment description with a toolhost or a `demo` plugin on `core1`
    Expectation: the lint rejects the description
- id: lint:deploy/two-tenants-one-host
  method: lint
  rules:
  - DEP-10
  - DEP-11
  version: v0.1
  group: People's data and erasure
  spec:
    What: the action toolhost of `demo2` on `web1` next to `demo`
    Expectation: the lint rejects the description (D-75)
- id: lint:deploy/os-rule-matches-catalog
  method: lint
  rules:
  - DEP-10
  version: v0.1
  group: Bindings
  spec:
    What: the rule on the machine differs from the catalog (file hash through the action toolhost)
    Expectation: '`doctor` fails the check'
