# Suite checks core-blackbox/messaging. This file is the source: edit it by hand.
# Format and fields: docs/quality.md, section "Suites". python3 ci/gen_suites.py fills version
# and the rules that name a check in their fixtures field; --check fails if anything is out of date.
suite: core-blackbox
area: messaging
checks:
- id: blackbox:messaging/alarm-bypass-reporter
  method: blackbox
  rules:
  - REP-5
  version: v0.1
  group: The design as a whole
  spec:
    What: a core alarm, a farm manager notice and an immediate report of a control operation while the `reporter` role is
      alive
    Expectation: the alarm goes to the monitoring adapter (E5), the notice and the report go to people by core delivery; no
      `reporter` task and no entry in its inbox
- id: blackbox:messaging/p2-message-views
  method: blackbox
  rules:
  - MSG-18
  version: v0.2
  group: The design as a whole
  spec:
    What: (v0.2) a `report.qc_note.v1` message with a note in `demo`; `carol` (`admin:people`) calls `msg.list`, `msg.show`
      and `inbox.status`; `dave` with `admin:people`, `audit.read` and `data:internal` calls `msg.show` on that `internal`
      message, and `erin` with `admin:people`, `audit.read` and only `data:summary` does the same; `carol` calls `msg.show`
      with a `demo2` message id and with an unknown id; the operator calls `msg.list` for `demo2`
    Expectation: '`carol` sees metadata and closed fields without the note; `dave` sees the note in an untrusted wrapper and
      an audit record of the read appears; `erin` and the operator get the message without the note; both foreign and unknown
      ids give the same `not_found`; `inbox.status` gives counts by state, the oldest age, the capacity and the wake-up budget;
      a `msg.list` page has at most 200 rows'
- id: blackbox:messaging/ttl-expired
  method: blackbox
  rules:
  - MSG-12
  version: v0.1
  group: The design as a whole
  spec:
    What: an inbox entry with `ttl` 1 minute, time shifted by 2 minutes
    Expectation: the entry is `expired`, it is not in `inbox_read`, the event `msg.expired` has metadata only
