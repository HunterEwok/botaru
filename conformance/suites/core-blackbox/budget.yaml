# Suite checks core-blackbox/budget. This file is the source: edit it by hand.
# Format and fields: docs/quality.md, section "Suites". python3 ci/gen_suites.py fills version
# and the rules that name a check in their fixtures field; --check fails if anything is out of date.
suite: core-blackbox
area: budget
checks:
- id: blackbox:budget/subject-anonymized-93d
  method: blackbox
  rules:
  - BUD-16
  - SEC-14
  version: v0.2
  group: Holds, queue, backups and spend
  spec:
    What: a usage record 94 days old of `bob` (v0.2), and the audit records of its task
    Expectation: it has no `subject`, `task` or `root`, its `time` is midnight UTC, and no field of it joins with an audit
      record, event or task record of `bob`
- id: blackbox:budget/line-by-purpose
  method: blackbox
  rules:
  - BUD-7
  version: v0.1
  group: Holds, queue, backups and spend
  spec:
    What: tasks with purposes `work`, `report`, `insight`, `review`, `manage`; the worker sends a different budget line
    Expectation: the core sets `line` by purpose (`work`, `work`, `insight`, `review`, `manager`); exhausting the `insight`
      line does not touch `work` tasks; a call that does not fit the `review` remainder does not start
- id: blackbox:budget/estimate-p90
  method: blackbox
  rules:
  - BUD-14
  - GW-6
  version: v0.1
  group: Holds, queue, backups and spend
  spec:
    What: a type with 20 finished tasks in 30 days; a type without history
    Expectation: the enqueue estimate is the 90th percentile of the tree price; a new type gets the worst case by the most
      expensive allowed model and `tree_budget_eur`; the reserve before a call into P4 is still the worst case
fixtures:
- fixture: fixture:budget/reviews-not-day-limit
  rules:
  - BUD-1
  group: Holds, queue, backups and spend
  spec:
    What: 100 reviews in a day from `system`
    Expectation: 'a schedule from `system` does not hit the principal''s daily limit: it counts only the `work` line'
- fixture: fixture:budget/waiting-reserve-not-threshold
  rules:
  - BUD-4
  group: Holds, queue, backups and spend
  spec:
    What: '72 schedule tasks wait with `waiting_reason: provider_unavailable`'
    Expectation: 'a person''s question does not get `budget_exhausted`: reserves of waiting tasks do not count toward the
      threshold'
- fixture: fixture:budget/manager-line-absent
  rules:
  - BUD-15
  group: Holds, queue, backups and spend
  spec:
    What: '`demo2` with `farm_manager.enabled: false` without a `manager` line'
    Expectation: '`apply` passes; `doctor` shows the 30-day usage of each line and no manager rows'
