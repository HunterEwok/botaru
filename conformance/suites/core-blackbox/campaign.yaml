# Suite checks core-blackbox/campaign. This file is the source: edit it by hand.
# Format and fields: docs/quality.md, section "Suites". python3 ci/gen_suites.py fills version
# and the rules that name a check in their fixtures field; --check fails if anything is out of date.
suite: core-blackbox
area: campaign
checks:
- id: blackbox:campaign/no-item-delivery
  method: blackbox
  rules:
  - ORC-10
  version: v0.1
  group: The design as a whole
  spec:
    What: a campaign of 3 read items with `origin` in `chat:lab`, all items end `ok`
    Expectation: in `origin` exactly one progress card (`card_update` updates no more often than the channel ceiling, by default
      once every 30 seconds, and on a state change) and one final summary with the campaign label; the items have no deliveries
      of their own; a campaign of a `fanout` step has neither a progress card nor a summary
- id: blackbox:campaign/propose-live-attempt
  method: blackbox
  rules:
  - ORC-1
  version: v0.1
  group: The design as a whole
  spec:
    What: '`campaign.propose` with the token of an expired lease, and `propose_campaign` from a live attempt'
    Expectation: the first call is rejected, no record; the second creates a campaign with frozen `items` and `plan_hash`,
      the plan does not change afterwards
- id: blackbox:campaign/pace-window
  method: blackbox
  rules:
  - ORC-15
  version: v0.2
  group: The design as a whole
  spec:
    What: '(v0.2) a campaign with `rate_per_min: 2` and five free items after the canary; two copies of the `campaign` loop
      tick at the same time, then again 30 and 61 seconds later'
    Expectation: at most two releases in any 60 seconds across both copies; the held items stay `pending` without an outcome;
      a release past a closed wave never happens
