# Suite checks core-blackbox/principal. This file is the source: edit it by hand.
# Format and fields: docs/quality.md, section "Suites". python3 ci/gen_suites.py fills version
# and the rules that name a check in their fixtures field; --check fails if anything is out of date.
suite: core-blackbox
area: principal
checks:
- id: blackbox:principal/one-tenant-hashed
  method: blackbox
  rules:
  - IDN-4
  version: v0.1
  group: Permissions, cards and initiator commands
  spec:
    What: '`principal.add` with the same subject in `demo2`; reading the principal record'
    Expectation: the second tenant is rejected; the verification code and the API key are stored only as hashes, there is
      no key canary in the store
