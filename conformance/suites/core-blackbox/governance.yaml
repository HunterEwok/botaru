# Suite checks core-blackbox/governance. This file is the source: edit it by hand.
# Format and fields: docs/quality.md, section "Suites". python3 ci/gen_suites.py fills version
# and the rules that name a check in their fixtures field; --check fails if anything is out of date.
suite: core-blackbox
area: governance
checks:
- id: blackbox:governance/case-audit-metadata
  method: blackbox
  rules:
  - GOV-21
  version: v0.2
  group: Holds, queue, backups and spend
  spec:
    What: (v0.2) a governance case goes through opening with the list L, a `not_eligible` queue event and a person's choice
      of the leaver; then the audit log and the events are read through P2 `audit.query` by a person with `admin:governance`
      and by a person without it
    Expectation: every step writes its command from `spec/model/governance-events.yaml` (v0.2) with `case`, the list L with
      the figures of its seats, the proposed seat, the chosen seat, the flags and the person; no free text appears in events
      or audit; a person without `admin:governance` gets `forbidden`
- id: blackbox:governance/attribution-silence
  method: blackbox
  rules:
  - GOV-30
  version: v0.2
  group: Holds, queue, backups and spend
  spec:
    What: (v0.2) an attribution candidate with nobody answering for 7, 14, 21, 28 and 35 days; then an answer "Yes" on another
      one
    Expectation: 'after the 7-day card deadline the candidate is `unknown` and stays so: it does not expire, no promotion
      trigger appears and the track record and accuracy do not change; weekly reminders on day 14, 21 and 28 (no more than
      3), after that only a row in the weekly digest to people with `governance.attribute`; "Yes" moves the attribution to
      `confirmed` and writes the audit line'
- id: blackbox:governance/attribution-reminders
  method: blackbox
  rules:
  - COM-17
  - GOV-30
  version: v0.2
  group: Permissions, cards and initiator commands
  spec:
    What: (v0.2) an attribution card is answered "No" after the second reminder; another one is disputed and then canceled
    Expectation: no third reminder after the answer; a disputed attribution stays out of the accuracy (COM-17) until resolved;
      a canceled one leaves it
- id: blackbox:governance/accountability-shadow
  method: blackbox
  rules:
  - GOV-36
  version: v0.3
  group: Accountability, the manager and the translator from v0.3
  spec:
    What: a tenant in `shadow` with a confirmed link to a rejected proposal; reviews written before `governance_v03_since`
    Expectation: the link is shown in P2 `commission.status` only; no card, nobody leaves, no reward; old reviews are not
      scored; `governance.v03_enabled` is in the audit
- id: blackbox:governance/accountability-ready
  method: blackbox
  rules:
  - GOV-36
  version: v0.3
  group: Accountability, the manager and the translator from v0.3
  spec:
    What: '`apply` of `accountability: on` with the default `commission.accountability_min_forecasts` 20 and one holder at
      19 scored forecasts; then all at 20; then a tenant with the parameter 8 and all holders at 8'
    Expectation: '`accountability_not_ready`; then the card `accountability_ready` goes once a month, `apply` accepts `on`
      and writes `commission.accountability_on`; the tenant with 8 accepts `on` at 8; a parameter of 7 fails `apply`'
- id: blackbox:governance/rejection-link-candidate
  method: blackbox
  rules:
  - GOV-38
  version: v0.3
  group: Accountability, the manager and the translator from v0.3
  spec:
    What: a `disk_full` incident on `db1`; a proposal lowering the `disk.used` threshold on `db1` dismissed 20 days earlier,
      problem code in `problem_codes`; another one 100 days earlier
    Expectation: 'one candidate of `kind: rejected_proposal` under `rejected_direct`; none for the old proposal; no model
      call'
- id: blackbox:governance/rejection-link-exclusions
  method: blackbox
  rules:
  - GOV-38
  version: v0.3
  group: Accountability, the manager and the translator from v0.3
  spec:
    What: the same with an external cause, with `untrusted_seen`, with the farm manager as author, with the author writing
      40% of the alarm series, with 4 subjects in the problem
    Expectation: no candidate in any case; one incident never gets more than 3 candidates
- id: blackbox:governance/manager-hint
  method: blackbox
  rules:
  - GOV-39
  version: v0.3
  group: Accountability, the manager and the translator from v0.3
  spec:
    What: the manager calls `link_hint` four times in a week and once about its own proposal
    Expectation: three hints visible to people marked "not checked", no candidate; the fourth is refused by the limit, the
      own one with `own_proposal`
- id: blackbox:governance/rejection-link-card
  method: blackbox
  rules:
  - GOV-40
  version: v0.3
  group: Accountability, the manager and the translator from v0.3
  spec:
    What: a candidate in a tenant with `on`; "Yes" without "Details"; the creator of a hint candidate presses "Yes" while
      a second person exists; 7 days of silence
    Expectation: '`details_not_opened`; the creator''s answer refused; silence keeps `unknown` and gives at most 3 reminders'
- id: blackbox:governance/against-and-for
  method: blackbox
  rules:
  - GOV-41
  version: v0.3
  group: Accountability, the manager and the translator from v0.3
  spec:
    What: 'a confirmed link with a veto by security, score 1 by cost, no review by the value seat; a confirmed attribution
      of class `area: cost` to a change recommended by all'
    Expectation: the cost and value holders answer for the link, security does not; only the cost holder answers for the attribution;
      the farm manager never
- id: blackbox:governance/unseat-park
  method: blackbox
  rules:
  - GOV-42
  version: v0.3
  group: Accountability, the manager and the translator from v0.3
  spec:
    What: '"Yes" on a link where seat 3 answers'
    Expectation: in one transaction the seat is vacant with epoch + 1, the bot is `parked`, `seat_parked_notice` goes with
      `farmctl worker enroll --bot`; the bot is not retired as `worker_gone`; after 180 days it retires with `parked_expired`
- id: blackbox:governance/unseat-pace
  method: blackbox
  rules:
  - GOV-42
  version: v0.3
  group: Accountability, the manager and the translator from v0.3
  spec:
    What: two confirmed links in 10 days; a link where the last holder of a veto lens answers
    Expectation: the second departure waits in order; the last veto holder stays
- id: blackbox:governance/unseat-false-alarm
  method: blackbox
  rules:
  - GOV-42
  version: v0.3
  group: Accountability, the manager and the translator from v0.3
  spec:
    What: the incident of a confirmed link is dismissed as false while the seat is vacant, then in another case after a new
      holder took it
    Expectation: '`seat_return_notice`; in the second case the bot heads the queue without cooldown and the new holder stays'
- id: blackbox:governance/accuracy-leaver
  method: blackbox
  rules:
  - GOV-43
  version: v0.3
  group: Accountability, the manager and the translator from v0.3
  spec:
    What: a case needs a seat in a tenant with `on`; one holder has the worst accuracy, one has 8 scored forecasts for 30
      days, one is protected by a reward; then the two worst differ by less than one standard error
    Expectation: code proposes the worst and it leaves only after the person's button; the 8-forecast holder counts with the
      lens median; the protected one is not proposed; on the tie code proposes nobody and the person chooses from L
- id: blackbox:governance/cooldown-after-unseat
  method: blackbox
  rules:
  - GOV-42
  version: v0.3
  group: Accountability, the manager and the translator from v0.3
  spec:
    What: a parked bot gets a success 100 days after leaving, and another 200 days after
    Expectation: no trigger for the first; a new queue entry for the second
- id: blackbox:governance/accountability-unaware
  method: blackbox
  rules:
  - GOV-46
  version: v0.3
  group: Accountability, the manager and the translator from v0.3
  spec:
    What: contexts of a reviewer, the manager and a functionary in a tenant with `on`, a confirmed link and a parked bot;
      a canary link id
    Expectation: no score, accuracy, reward, link state, mode, parking or restricted mode in any context; the canary does
      not reach P4
