# Suite checks core-blackbox/proposal. This file is the source: edit it by hand.
# Format and fields: docs/quality.md, section "Suites". python3 ci/gen_suites.py fills version
# and the rules that name a check in their fixtures field; --check fails if anything is out of date.
suite: core-blackbox
area: proposal
checks:
- id: blackbox:proposal/author-origin
  method: blackbox
  rules:
  - PRP-14
  version: v0.1
  group: The design as a whole
  spec:
    What: the result was submitted by `bot_17` of epoch 1; then a duplicate from `bot_18`; a worker result without a bot
    Expectation: '`origin.acting_bot` and `bot_epoch` from the submitting attempt; on merge the author does not change; without
      a bot `acting_bot` is empty, the author is `origin.worker`'
- id: blackbox:proposal/realizer-deadline
  method: blackbox
  rules:
  - PRP-18
  version: v0.1
  group: The design as a whole
  spec:
    What: '"Accept" on a `manifest_change` proposal is pressed by a person not in `insights.realizers`'
    Expectation: the executor is the first of `realizers`, deadline `realize_by`, a reminder at the halfway point; at the
      deadline `realization_failed(timeout)`, the trial is `canceled`
