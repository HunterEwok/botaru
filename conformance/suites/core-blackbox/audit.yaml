# Suite checks core-blackbox/audit. This file is the source: edit it by hand.
# Format and fields: docs/quality.md, section "Suites". python3 ci/gen_suites.py fills version
# and the rules that name a check in their fixtures field; --check fails if anything is out of date.
suite: core-blackbox
area: audit
checks:
- id: blackbox:audit/attempt-journal
  method: blackbox
  rules:
  - AUD-4
  version: v0.2
  group: People's data and erasure
  spec:
    What: '(v0.2) an attempt of a `kind: test` tenant with two model calls and one tool call, a canary in the tool output;
      a `kind: production` tenant without `retention.journals`'
    Expectation: journal entries of class `content` with the task mark and a 7-day period; the canary is in no audit record,
      event or later model request; the production tenant writes no journal
