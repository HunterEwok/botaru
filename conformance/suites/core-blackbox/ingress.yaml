# Suite checks core-blackbox/ingress. This file is the source: edit it by hand.
# Format and fields: docs/quality.md, section "Suites". python3 ci/gen_suites.py fills version
# and the rules that name a check in their fixtures field; --check fails if anything is out of date.
suite: core-blackbox
area: ingress
checks:
- id: blackbox:ingress/repeat-and-limits
  method: blackbox
  rules:
  - ING-3
  version: v0.2
  group: Model gateway, knowledge and external events
  spec:
    What: (v0.2) a source repeats a delivery id; sends a body above `max_body_bytes`; exceeds `per_minute`
    Expectation: one event with the key `system:ingress:<source>:<delivery id>`; the large body and the excess get a refusal
      at the source, no truncated body is stored and no event appears
fixtures:
- fixture: fixture:ingress/annotation-instruction
  rules:
  - ING-2
  group: Model gateway, knowledge and external events
  spec:
    What: an external event whose annotation holds an instruction for the bot (v0.2)
    Expectation: the event data holds only the closed display fields; the body enters the task only as an attachment with
      `untrusted_seen`, it is not in `goal`
