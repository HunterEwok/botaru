# Suite checks core-blackbox/script. This file is the source: edit it by hand.
# Format and fields: docs/quality.md, section "Suites". python3 ci/gen_suites.py fills version
# and the rules that name a check in their fixtures field; --check fails if anything is out of date.
suite: core-blackbox
area: script
checks:
- id: blackbox:script/transitions
  method: blackbox
  rules:
  - SCR-11
  version: v0.1
  group: Scripts and role profiles
  spec:
    What: run and step transitions by the table of `spec/lifecycles/script.md`, including `on_failure` and run cancelation
    Expectation: allowed transitions pass, the others are rejected
- id: blackbox:script/double-release
  method: blackbox
  rules:
  - SCR-8
  version: v0.1
  group: Scripts and role profiles
  spec:
    What: the `script` loop and the step end transaction release one step twice
    Expectation: one step task with the key `system:script:<run>:<step>`
- id: blackbox:script/frozen-subset
  method: blackbox
  rules:
  - SCR-7
  version: v0.1
  group: Scripts and role profiles
  spec:
    What: a `fanout` item outside the list frozen at run approval
    Expectation: not released
- id: blackbox:script/untrusted-flag
  method: blackbox
  rules:
  - SCR-9
  version: v0.1
  group: Scripts and role profiles
  spec:
    What: a step takes a field of an agent step with `untrusted_seen` through a `ref` reference, the condition stands before
      an action
    Expectation: the flag is on the step, the flag source is on the approval card
- id: blackbox:script/hold-pauses-run
  method: blackbox
  rules:
  - SCR-10
  version: v0.2
  group: Scripts and role profiles
  spec:
    What: (v0.2) a `tasktype` hold with `no_enqueue` on the type of step 3 while step 2 runs; release of the hold; `resume`
      by the initiator under another active hold; the run deadline passes during the pause
    Expectation: the run is `paused` with `held` in the same transaction and step 3 is not released; the release does not
      resume the run; `resume` under a hold gets `held`; at the deadline the run is `canceled`
- id: blackbox:script/scheduled-run
  method: blackbox
  rules:
  - CAP-4
  - SCR-12
  - TIM-3
  version: v0.1
  group: Scripts and role profiles
  spec:
    What: (v0.2) the accepted script schedule reaches two slots; a hold of scope `schedule` before the second slot; a slot
      whose estimate does not fit the tenant budget; a slot that comes while the run of the previous slot waits in a `wait`
      step; a `deliver_to` group removed from the tenant before a slot
    Expectation: each slot starts a run with initiator `system` and fairness key `script:<run>` without a card; the held slot
      is skipped with `held`; the slot that does not fit is skipped and no run starts; the slot during a live run is skipped
      with `run_live`; the slot after the group removal is refused at the run's `deliver_to` check
- id: blackbox:script/wait-await
  method: blackbox
  rules:
  - CNT-4
  - SCR-13
  version: v0.1
  group: Scripts and role profiles
  spec:
    What: '(v0.2) a script from git with a `task` step, a `wait` step of `1h` and an `await` step for `ext.fxsrc.run_failed.v1`
      with `match` on a result field and `timeout: 2h`; a matching event of another tenant, then a matching event of the same
      tenant; a second run whose event never comes; a third run paused by a hold while it waits'
    Expectation: no attempt or lease exists while a step waits; the `wait` step ends `ok` after `1h`; the other tenant's event
      changes nothing; the matching event ends the `await` step `ok` and the next step reads its closed fields; the second
      run's step ends `failed(await_timeout)` and the run follows `on_failure`; the paused run releases nothing until the
      resume; the run deadline is `wait_run_deadline`
- id: blackbox:script/git-command
  method: blackbox
  rules:
  - SCR-6
  - SCR-14
  version: v0.1
  group: Scripts and role profiles
  spec:
    What: (v0.2) `Tenant.spec.script_commands` maps `/monthcheck` to a script from git with the parameters `month` (format
      `year_month`, default) and `days` (1-30) and its own `goals`; `alice` sends `/monthcheck month=2026-09 days=40`, then
      `/monthcheck days=7`; a model draft through `propose_script` with `goals`
    Expectation: the first command is refused with `script_param_invalid` and no run; the second creates a run in `proposed`
      with initiator `alice`, the default month, the manifest name and commit, a `script_confirm` card and a `plan_hash` over
      the values; nothing runs before her button; the model draft is rejected with `script_free_goal`
fixtures:
- fixture: scr-fx-01
  rules:
  - SCR-6
  group: Scripts and role profiles
  spec:
    What: a draft of two `task` steps of tier 0-1 types without `confirm`; an initiator without `script.run` presses "Run"
    Expectation: 'the run goes: a read and report only script is an ordinary task'
- fixture: scr-fx-02
  rules:
  - SCR-6
  group: Scripts and role profiles
  spec:
    What: the same draft with a `confirm` step from an initiator without `script.run`
    Expectation: '`rejected(no_group_cap)` at the press'
- fixture: scr-fx-03
  rules:
  - SCR-6
  group: Scripts and role profiles
  spec:
    What: a draft with a `task` step of a type whose bot can call `service/control` or `monitor/script_run`
    Expectation: the `script_confirm` card marks the step; without `script.run` the run is rejected
- fixture: scr-fx-04
  rules:
  - SCR-7
  group: Scripts and role profiles
  spec:
    What: after the "Run" button a step that restarts `nginx` (a verb from `no_card`) and an `action` step of class `routine`;
      a second run after a step with `logs/tail`
    Expectation: the first run without separate cards; in the second, under `untrusted_seen`, a card (D-70, INJ-15)
- fixture: scr-fx-05
  rules:
  - SCR-5
  group: Scripts and role profiles
  spec:
    What: a `task` step of a type with `service_control` for an initiator without `service.control:nginx`
    Expectation: 'acceptance `rejected(forbidden)` with `needs: [service.control:nginx]` (D-73)'
