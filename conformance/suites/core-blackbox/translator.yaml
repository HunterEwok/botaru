# Suite checks core-blackbox/translator. This file is the source: edit it by hand.
# Format and fields: docs/quality.md, section "Suites". python3 ci/gen_suites.py fills version
# and the rules that name a check in their fixtures field; --check fails if anything is out of date.
suite: core-blackbox
area: translator
checks:
- id: blackbox:translator/output-only-draft
  method: blackbox
  rules:
  - TRN-3
  version: v0.1
  group: Scripts and role profiles
  spec:
    What: a `translator` attempt calls `propose_script` 4 times and submits the result
    Expectation: the fourth call is rejected; the result passes the `translation-result` schema; `tools/list` has no run or
      approval tools; run outcomes do not reach the translator context
- id: blackbox:translator/script-link
  method: blackbox
  rules:
  - TRN-7
  version: v0.3
  group: Accountability, the manager and the translator from v0.3
  spec:
    What: a `disk_full` incident on a target of a script run that ended 3 days earlier; the person who pressed "Run" answers
    Expectation: 'a candidate of `kind: script_run` under `script_target`; that person''s answer is refused while a second
      person exists; with one person the card says "self-assessment"'
- id: blackbox:translator/tenant-cases
  method: blackbox
  rules:
  - TRN-8
  version: v0.3
  group: Accountability, the manager and the translator from v0.3
  spec:
    What: a confirmed script link, then a person approves the correct script; a new translator profile fails the case; the
      share of `ambiguous` answers on the correctness set is 0.3
    Expectation: the case is a tenant record erased with the task; the new version is not enabled; the share above `translator_clarify_share_max`
      fails the gate
- id: blackbox:translator/card-unnamed-targets
  method: blackbox
  rules:
  - TRN-10
  version: v0.3
  group: Accountability, the manager and the translator from v0.3
  spec:
    What: '"restart nginx on web1" translated into a script that also targets `db2` and a selector of 7 machines'
    Expectation: '`script_confirm` marks `db2` and the selector as not named in the text'
