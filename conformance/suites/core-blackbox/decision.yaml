# Suite checks core-blackbox/decision. This file is the source: edit it by hand.
# Format and fields: docs/quality.md, section "Suites". python3 ci/gen_suites.py fills version
# and the rules that name a check in their fixtures field; --check fails if anything is out of date.
suite: core-blackbox
area: decision
checks:
- id: blackbox:decision/event-fields
  method: blackbox
  rules:
  - APR-11
  - AUD-2
  version: v0.1
  group: Permissions, cards and initiator commands
  spec:
    What: '`carol` decides an approval after "Details"'
    Expectation: 'decision event: `subject`, `decision`, `reason_code`, `decided_by`, `channel`, `chat_kind`, `delivered_at`,
      `decided_at`, `response_ms`, `details_opened: true`, no texts'
