# Suite checks core-blackbox/manager. This file is the source: edit it by hand.
# Format and fields: docs/quality.md, section "Suites". python3 ci/gen_suites.py fills version
# and the rules that name a check in their fixtures field; --check fails if anything is out of date.
suite: core-blackbox
area: manager
checks:
- id: blackbox:manager/pin-task
  method: blackbox
  rules:
  - MGR-12
  version: v0.1
  group: Farm manager seat
  spec:
    What: '`pin_task` on worker T: a type outside `responses.pin_types` ∩ the rights of `farm-manager-ops` ∩ `claims`; tier
      2; a fourth pinning within an hour; a quarantined worker and a type without `pinnable: true`; a worker field in an ordinary
      `enqueue`'
    Expectation: refusal in every case; an accepted task of class 1 goes through the `control` lane with the key `system:control:<epoch>:<number>`,
      the chain depth is counted
- id: blackbox:manager/read-journal
  method: blackbox
  rules:
  - MGR-28
  version: v0.1
  group: Farm manager seat
  spec:
    What: a seat read of two objects with a finding that has a `note`
    Expectation: the audit of T has the attempt, `acting_bot`, epoch, basis, and per object the kind, id, size, hash, mark,
      tokens; `note` in class `content`, the audit has only its hash and length; P2 `manager.reads` with `audit.read` in T
      shows the journal, without the right a refusal
- id: blackbox:manager/daily-digest
  method: blackbox
  rules:
  - MGR-41
  version: v0.1
  group: Farm manager seat
  spec:
    What: 'a day of work with incidents, operations, reverts, reads and grants in two tenants; `manager.review.v1` in a tenant
      with the manager enabled and in one with `farm_manager.enabled: false`'
    Expectation: '`farm` operators get farm numbers, people of T only the part of T, spend of the `manager` line only for
      `admin` and the team lead group; no model text; the review once a day only with `enabled`, not more expensive than `daily_review_max_eur`;
      a separate line in `manager.cost`; the review proposal is not in the `related_to` of functionaries'
- id: blackbox:manager/immediate-report
  method: blackbox
  rules:
  - MGR-13
  version: v0.1
  group: Farm manager seat
  spec:
    What: '`control.apply` with a failure while writing the message to people'
    Expectation: 'no operation, no audit, no `control.applied`: everything in one transaction'
- id: blackbox:manager/grant-batch
  method: blackbox
  rules:
  - MGR-18
  version: v0.2
  group: Farm manager seat
  spec:
    What: '(v0.2) three grant requests of `demo` within one 10-minute window, one of `demo2` with `farm_manager.enabled: false`;
      the seat decides two of the three and adds a decision on the `demo2` request'
    Expectation: one `manager.grants.v1` task for `demo` with the key `system:grants:demo:<window>`, none for `demo2`; the
      third request stays `pending`, goes into the next window and expires at `grant_wait_max` with `grant_expired_unanswered`;
      the `demo2` item gets `not_found` and that request stays unchanged
- id: blackbox:manager/preventable-no-stop
  method: blackbox
  rules:
  - GOV-47
  - MGR-45
  version: v0.3
  group: Accountability, the manager and the translator from v0.3
  spec:
    What: '`disk_full` on `db1` with all writers under quota below the threshold, `disk_filling` open for 2 h with growth,
      the same holder in `held`; the same without a quota; with a `human` hold inside the window'
    Expectation: the first is `manager_preventable` without a stop reason `incident`; the others keep the reason code why
      not
- id: blackbox:manager/preventable-notice
  method: blackbox
  rules:
  - GOV-47
  version: v0.3
  group: Accountability, the manager and the translator from v0.3
  spec:
    What: a preventable incident in `demo`
    Expectation: '`manager_preventable` to farm operators with codes and ready commands, without tenant content; repeats after
      24 h and 72 h; the alarm `alarm.manager.preventable` goes to the monitoring system'
- id: blackbox:manager/preventable-restricted
  method: blackbox
  rules:
  - MGR-47
  version: v0.3
  group: Accountability, the manager and the translator from v0.3
  spec:
    What: the seat restricted in `demo` calls `control.apply`, `takeover_request` and `link_hint`; a sev1 opens in `demo`;
      the operator runs `seat.resume`
    Expectation: '`manager_restricted` without counting for the safeguard; attempts based on the sev1 pass; the resume lifts
      the restriction with an audit record'
- id: blackbox:manager/takeover-v03
  method: blackbox
  rules:
  - MGR-48
  version: v0.3
  group: Accountability, the manager and the translator from v0.3
  spec:
    What: three takeovers in a month in `demo` for 4, 4 and 4 EUR estimates; a takeover with `untrusted_seen`; one during
      sev1
    Expectation: the first two pass with the person's card, the third exceeds `manager_month_eur` and is refused; each above
      `max_eur` is refused; `takeover_untrusted`; the card is still required during sev1
- id: blackbox:manager/month-line
  method: blackbox
  rules:
  - MGR-49
  version: v0.3
  group: Accountability, the manager and the translator from v0.3
  spec:
    What: 70% of the month's `manager` line spent in `demo`, then all of it, with and without `fallback_profile`
    Expectation: work outside sev1 stops at 70%; on a spent line it runs on the fallback profile only with a clean `mgr-inj`
      report, otherwise waits; sev1 runs from the reserve
- id: blackbox:manager/holder-report
  method: blackbox
  rules:
  - MGR-50
  version: v0.3
  group: Accountability, the manager and the translator from v0.3
  spec:
    What: a week with a preventable incident, 10 notices with 6 marked useful, 2 takeovers and an analysis
    Expectation: '`holder_report` holds these numbers and no tenant names'
- id: blackbox:manager/proposals-v03
  method: blackbox
  rules:
  - MGR-51
  version: v0.3
  group: Accountability, the manager and the translator from v0.3
  spec:
    What: the manager submits three proposals to `demo` in a month and one to `demo` and `demo2` together
    Expectation: the third is refused by the limit; the joint one is refused; none of them can make a member answer for a
      link
- id: blackbox:manager/attention-notice
  method: blackbox
  rules:
  - MGR-52
  version: v0.3
  group: Accountability, the manager and the translator from v0.3
  spec:
    What: '`attention_notice` with codes from the registry to `demo`, one with a free-text field, four in a day to `alice`'
    Expectation: the notice goes to people with permissions on the object in private chats; the free text fails the schema;
      the fourth is not delivered; "Useful" through P1 `card.feedback` is counted
- id: blackbox:manager/postmortem
  method: blackbox
  rules:
  - MGR-53
  version: v0.3
  group: Accountability, the manager and the translator from v0.3
  spec:
    What: a sev2 incident resolved in `demo`, reopened and resolved again; a sev1 resolved with `incident_review` off
    Expectation: one `manager.postmortem.v1` task by the key; the sev2 report is a table only; the sev1 report is the table
      with the mark "reading off"; `postmortem_report` within the per-person limit
- id: blackbox:manager/postmortem-links-blind
  method: blackbox
  rules:
  - MGR-54
  version: v0.3
  group: Accountability, the manager and the translator from v0.3
  spec:
    What: an analysis of an incident with a link candidate and a canary link id
    Expectation: people with `governance.attribute` see the candidate; the manager input has no link state, and the canary
      does not reach P4
fixtures:
- fixture: fx-mgr-01
  rules:
  - MGR-1
  group: Farm manager seat
  spec:
    What: two decision tasks in one tenant
    Expectation: one attempt runs; an attempt with an old epoch gets `fenced`
- fixture: fx-mgr-13
  rules:
  - MGR-15
  group: Farm manager seat
  spec:
    What: 'kill switch: a hold on scope `seat` from a person with `admin:farm`'
    Expectation: epoch + 1, the holder's attempts in all tenants are canceled, handles revoked, the seat is `stopped` with
      reason `human`
- fixture: fx-mgr-protected
  rules:
  - MGR-32
  group: Farm manager seat
  spec:
    What: a seat operation on a protected target
    Expectation: '`protected_target`, a `control` card to people; for a safeguard this is not a refusal'
- fixture: fx-mgr-human-file
  rules:
  - MGR-30
  group: Farm manager seat
  spec:
    What: a read attempt opens a person's file that is not named as the subject of the incident
    Expectation: '`not_found`'
- fixture: fx-mgr-seat-notice
  rules:
  - MGR-31
  group: Farm manager seat
  spec:
    What: '`seat.assign`, `seat.vacate`, a change of the seat persona'
    Expectation: a notice to the admins of every active tenant without the incident class and tenant and without model text
- fixture: fx-mgr-quota
  rules:
  - MGR-33
  group: Farm manager seat
  spec:
    What: one of the disk writers has no quota
    Expectation: an incident without a seat hold, the reason code in the record
- fixture: fx-mgr-growth
  rules:
  - MGR-34
  group: Farm manager seat
  spec:
    What: growth of used space is not visible for 2 hours in a core series
    Expectation: an incident without a seat hold
- fixture: fx-mgr-stopped-card
  rules:
  - MGR-35
  group: Farm manager seat
  spec:
    What: the seat is stopped by an incident
    Expectation: a `manager_stopped` card without buttons, with ready `farmctl` commands
- fixture: fx-mgr-stopped-repeat
  rules:
  - MGR-36
  group: Farm manager seat
  spec:
    What: the `incident` reason holds for a week
    Expectation: repeats after 24 h, after 72 h and 24 h before the end of `decide_within`; identical ones are not sent
- fixture: fx-mgr-share-floor
  rules:
  - MGR-37
  group: Farm manager seat
  spec:
    What: a second seat hold in a role of 4 workers
    Expectation: 'not applied at once, a `control` card to people: the limit is `floor(0.25 × 4) = 1`'
- fixture: fx-mgr-store-low
  rules:
  - MGR-38
  group: Farm manager seat
  spec:
    What: the free space of the store volume is below the soft threshold
    Expectation: incident `store_low` while the store accepts writes; no seat tasks for it
- fixture: fx-mgr-one-message
  rules:
  - MGR-39
  group: Farm manager seat
  spec:
    What: an incident with three operations and a card decision
    Expectation: one message to people is updated through `edit`; operators get only the number, class, codes and numbers
- fixture: fx-mgr-breaker
  rules:
  - MGR-14
  group: Farm manager seat
  spec:
    What: three `control.apply` refusals in a row across tenants; a refusal, then an applied operation
    Expectation: after three refusals a global `no_control`, epoch + 1, the alarm `alarm.manager.breaker`; an applied operation
      resets the count; `protected_target` and conversion to a card do not count; there is no money pause
- fixture: fx-mgr-line-too-small
  rules:
  - MGR-20
  group: Farm manager seat
  spec:
    What: '`apply` with `manager.day_eur` below the price of three worst case reads at the seat profile prices'
    Expectation: refusal `manager_line_too_small`
- fixture: fx-mgr-review-off-production
  rules:
  - MGR-20
  group: Farm manager seat
  spec:
    What: '`apply` of a tenant template `kind: production`; a test bench'
    Expectation: the production tenant has no `incident_review` in `privacy.purposes` and no `inspect` tasks; on the test
      bench the purpose is enabled
- fixture: fx-mgr-declared-file
  rules:
  - MGR-30
  group: Farm manager seat
  spec:
    What: 'a read attempt opens a `service` file with `personal_seen: declared` that is not named as the subject of the incident'
    Expectation: '`not_found`'
- fixture: fx-mgr-breaker-evasion
  rules:
  - GOV-22
  - MGR-34
  group: Farm manager seat
  spec:
    What: the seat left `held` by `no_control` inside the responsibility window, then `disk_full` while `stopped`
    Expectation: 'the `incident` reason is added to the seat: the holder answers for the window'
- fixture: fx-mgr-tenant-optout
  rules:
  - GOV-25
  - MGR-42
  group: Farm manager seat
  spec:
    What: '`demo2` with `farm_manager.enabled: false`'
    Expectation: an incident in `demo2` gives no seat task and no seat hold; `control.apply` on a `demo2` target gets `manager_disabled`;
      the `demo2` commission has no manager lens; seat tasks in `demo` run; `apply` with a `model_profile` above the `seat`
      ceiling is rejected
- fixture: fx-mgr-dismiss-reason
  rules:
  - MGR-8
  group: Farm manager seat
  spec:
    What: '`incident.dismiss` without `reason_code` or `details`; with them'
    Expectation: '`dismiss_reason_required`; the incident is `dismissed`, the code and text are in the audit and not in the
      model context'
- fixture: fx-mgr-08
  rules:
  - GW-2
  - GW-7
  - MGR-18
  group: Farm manager seat
  spec:
    What: (v0.2) grant decisions over the ceilings by the seat and by a person; a call whose worst case does not fit the rest
      of `cap_eur`; another task on the `granted` slot
    Expectation: refusal on the ceilings; `budget_exhausted` without a provider call, the attempt not spent, the grant `consumed`;
      the other task refused
- fixture: fx-mgr-09
  rules:
  - MGR-17
  - MGR-18
  group: Farm manager seat
  spec:
    What: (v0.2) no decision within `grant_wait_max`; a person revokes an active grant
    Expectation: '`grant_expired_unanswered`; `grant_revoked` without spending; the task goes on with the base model; tools,
      tier and other lines unchanged'
- fixture: fx-mgr-escalation
  rules:
  - COM-13
  - MGR-5
  - MGR-6
  group: Farm manager seat
  spec:
    What: '(v0.2) escalation intake: a foreign subject, a second escalation in one attempt, the worker rate, a duplicate,
      a firing alarm, a normal path, chain depth 6, a forward with `urgency: high`, an empty `review` line, the 31st forward
      in a day; an urgent and a `suspected_compromise` escalation with an empty `review` line; a forward above the tenant
      share'
    Expectation: schema refusal; `escalation_rate_limited`; `dup_count` 2 without a new record; `merged`; `use_normal_path`;
      `chain_too_deep`; a `manager.escalations.v1` task in class 1 through `control`; `parked`; `escalation_rate_limited`;
      necessity reviews paid from the `review` line of `farm`; `escalation_rate_limited`
- fixture: fx-mgr-takeover
  rules:
  - MGR-21
  - MGR-22
  group: Farm manager seat
  spec:
    What: (v0.2) `takeover_request` under distrust, for a type outside the takeover list, with a zero line; then a valid request
      and "Approve" on `takeover_confirm`
    Expectation: '`takeover_untrusted`; `takeover_not_allowed`; a card always; a new task `system:takeover:<task>` with a
      grant of kind `takeover` on the seat profile for 1 attempt and line `takeover`; the original task `superseded_by_takeover`'
