# Suite checks core-blackbox/skills. This file is the source: edit it by hand.
# Format and fields: docs/quality.md, section "Suites". python3 ci/gen_suites.py fills version
# and the rules that name a check in their fixtures field; --check fails if anything is out of date.
suite: core-blackbox
area: skills
checks:
- id: blackbox:skills/tool-outside-role
  method: blackbox
  rules:
  - SKL-3
  version: v0.2
  group: Model gateway, knowledge and external events
  spec:
    What: a role skill names a tool outside the role (v0.2)
    Expectation: the tool is not in `tools/list`, the tier and the task class stay the same
- id: blackbox:skills/role-only
  method: blackbox
  rules:
  - SKL-2
  version: v0.2
  group: Model gateway, knowledge and external events
  spec:
    What: '(v0.2) an agent worker that declares `runtime.skills: runtime_files`; the role pins `disk-triage` by hash; the
      core copy differs by one byte'
    Expectation: the attempt work item of `claim` holds only `disk-triage` with the hash of the core copy; with a tree of
      another hash the skill is not given and the attempt fails; a skill of another role on the agent's disk makes the worker
      `blocked`; the skill directory is read only
- id: blackbox:skills/skill-read
  method: blackbox
  rules:
  - SKL-2
  - SKL-4
  version: v0.2
  group: Model gateway, knowledge and external events
  spec:
    What: '(v0.2) a runtime with `skills: farm`; the model calls `skill_read` for a role skill file, for a file of another
      skill, for a 40 KiB file, and in an `insight` task'
    Expectation: the first returns the core copy and the tree hash; the second fails the enum check; the 40 KiB file comes
      in two calls with `next_offset`; the `insight` task has no `skill_read`; a `file` of `references/../SKILL.md` fails
      the schema
