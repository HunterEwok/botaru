# Monitoring system data for the adapter process of the tenant demo (reference
# Zabbix). The tenant's user sees only the host groups that the demo catalog
# named; it sees neither farm nodes nor other tenants (MON-4, DEP-11).
tenant: demo
items:
  - {host: botaru-core, key: "botaru.audit.head[demo]", type: trapper, value: text}
  - {host: botaru-core, key: "botaru.adapter.alive[demo]", type: trapper, value: numeric}
user:
  user_group: botaru-mon-demo
  type: User
  read: [botaru-demo]                        # host groups of the demo catalog
  allowed_actions: [execute_scripts, add_problem_comments]
  forbidden: [acknowledge, close, change_severity, suppress, maintenance_edit]
