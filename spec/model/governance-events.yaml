registry: governance-events
version: 4
description: >-
  Command names of the audit records of governance (GOV-21, AUD-1). Every case
  transition, flag, people's decision and queue change writes
  one audit record under a name from this list, with metadata only (AUD-2): ids,
  seat ids, reason codes, numbers, numbers and hashes, never free text. Before the
  case is decided no bot sees these records (GOV-29).
source: docs/commission.md
entries:
  - id: governance.enabled
    since: v0.2
    meaning: the v0.2 governance rules took effect in the tenant; its time is governance_since (GOV-14)
    rules: [GOV-14, GOV-21]
  - id: governance.entry.queued
    since: v0.2
    meaning: a promotion trigger put a bot into the queue or moved its entry to a later trigger
    rules: [GOV-14, GOV-21]
  - id: governance.entry.removed
    since: v0.2
    meaning: an entry left the queue (retired, wrong_candidate, seated, attribution)
    rules: [GOV-14, GOV-21, GOV-31]
  - id: governance.not_eligible
    since: v0.2
    meaning: the head of the queue failed eligibility at opening and waits
    rules: [GOV-14, GOV-21]
  - id: governance.case.opened
    since: v0.2
    meaning: a case opened with the list L, the figures of its seats and the proposed leaver with the basis of the proposal, or none
    rules: [GOV-12, GOV-21, GOV-43]
  - id: governance.flag.set
    since: v0.2
    meaning: code set a case flag from spec/model/governance-flags.yaml
    rules: [GOV-19, GOV-21]
  - id: governance.decided
    since: v0.2
    meaning: a person confirmed the case outcome with the chosen seat, or rejected it with the reason code
    rules: [GOV-9, GOV-12, GOV-21, GOV-31]
  - id: governance.case.expired
    since: v0.2
    meaning: the promotion card expired without a decision; nobody leaves
    rules: [GOV-9, GOV-21]
  - id: governance.case.canceled
    since: v0.2
    meaning: a case was canceled with a reason (human, candidate_ineligible, seat_changed)
    rules: [GOV-12, GOV-14, GOV-21]
  - id: governance.effective
    since: v0.2
    meaning: the confirmed change was done in one transaction (holder change, leaving, new worker identity, fact offers)
    rules: [GOV-21]
  - id: commission.shadow_seed
    since: v0.2
    meaning: the monthly shadow selection seed of a tenant was drawn (COM-10)
    rules: [COM-10, GOV-21]
  - id: governance.v03_enabled
    since: v0.3
    meaning: the first apply of the tenant on a core that claims v0.3; its time is governance_v03_since (GOV-36)
    rules: [GOV-36, GOV-21]
  - id: commission.accountability_on
    since: v0.3
    meaning: the first apply with commission.accountability on; its time is accountability_on_since (GOV-36)
    rules: [GOV-36, GOV-21]
  - id: governance.link.confirmed
    since: v0.3
    meaning: a person confirmed a link of kind rejected_proposal or a recommended change, with the seats that answer (GOV-40, GOV-41)
    rules: [GOV-40, GOV-41, GOV-21]
  - id: governance.seat.parked
    since: v0.3
    meaning: a holder left its seat for a confirmed link and was parked, or its departure waits for the 30-day pace (GOV-42)
    rules: [GOV-42, GOV-21]
  - id: governance.seat.returned
    since: v0.3
    meaning: a link was canceled after the incident was declared false, and the parked bot returned to its seat or the queue head (GOV-42)
    rules: [GOV-42, GOV-21]
  - id: governance.reward
    since: v0.3
    meaning: the most accurate holder got or lost the reward and its protection (COM-18)
    rules: [COM-18, GOV-21]
