registry: reasons
version: 11
description: 'Closed registry of reasons: end of an attempt, refusals at enqueue and at a call, waiting, outcomes of calls,
  approvals and deliveries, and also codes of other parts of the farm. A worker in P1 `fail` passes only a code from here; there is no free
  reason text in the records. Record fields: `meaning` (what it means); `spends_attempt` (whether it spends an attempt: true,
  false, or null if the reason does not end an attempt); `retry` (retry: `backoff` with the pause from the type `retry.backoff`, `immediate`
  at once, `jitter` with a pause and full random spread up to `deadline`, `on_fix` waits for a fix until `deadline`,
  `after_release` after the stop is released, `on_share` waits for a share of the model pool, `requeue` the task returns to the queue,
  `after_grant` after the model grant decision, `none` no retry, null for codes that do not end work); `outcome`
  (result when there is no retry: `failed(attempts_exhausted)`, `failed(deadline_exceeded)`, `failed`, `canceled`, `rejected`
  at enqueue or refusal of an operation, `response` an answer to a call with no change to records, `error` an outcome of a tool call,
  `withheld` and `dead` delivery outcomes, `apply_error` a refusal by the `apply` lint, `mark` a mark or notice without refusal,
  `value` a field value: reason for a stop, an erasure request, a revert, or a `health` answer); `rules` (rule numbers).'
source: docs/tasks-and-delivery.md
entries:
- id: lease_expired
  since: v0.1
  meaning: The lease expired without renewal. The attempt is spent; for a read call this is the error `error(lease_expired)`, which
    the model sees.
  spends_attempt: true
  retry: backoff
  outcome: failed(attempts_exhausted)
  rules: [FEN-1, FEN-3]
- id: runtime_error
  since: v0.1
  meaning: The agent runtime ended the run with an error.
  spends_attempt: true
  retry: backoff
  outcome: failed(attempts_exhausted)
  rules: [FEN-1, FEN-3]
- id: model_error
  since: v0.1
  meaning: The model returned an error after which the run cannot continue.
  spends_attempt: true
  retry: backoff
  outcome: failed(attempts_exhausted)
  rules: [FEN-1, FEN-3]
- id: attempt_timeout
  since: v0.1
  meaning: The time limit of one attempt `timeouts.attempt` ran out.
  spends_attempt: true
  retry: backoff
  outcome: failed(attempts_exhausted)
  rules: [FEN-1, FEN-3]
- id: output_schema_invalid
  since: v0.1
  meaning: The result at `complete` did not pass the full schema of the task type. The attempt is spent.
  spends_attempt: true
  retry: backoff
  outcome: failed(attempts_exhausted)
  rules: [FEN-3, OUT-2]
- id: stalled
  since: v0.1
  meaning: For longer than `stall_after` there is no completed P3 or P4 call and the progress in `heartbeat` does not change.
    The attempt is spent, and the core raises the alarm `alarm.task.stalled`.
  spends_attempt: true
  retry: backoff
  outcome: failed(attempts_exhausted)
  rules: [CNT-4]
- id: worker_drain
  since: v0.1
  meaning: The holder returned the work with `release` when the worker stopped. The attempt is not spent.
  spends_attempt: false
  retry: immediate
  outcome: null
  rules: [FEN-1, FEN-2]
- id: core_unavailable
  since: v0.1
  meaning: The lease expired while the core was down and was not renewed by the holder after `lease.extend`. The attempt is not spent
    and does not count toward `runs_counted`; a read call gets `error(core_unavailable)`, a write call `exec_unknown`, a delivery
    returns to `planned`.
  spends_attempt: false
  retry: immediate
  outcome: null
  rules: [FEN-5, FEN-3]
- id: provider_unavailable
  since: v0.1
  meaning: The model provider is unavailable or the circuit of the pair (workspace, model pool) is open. The attempt is not spent; this
    is also a waiting reason of a task.
  spends_attempt: false
  retry: jitter
  outcome: failed(deadline_exceeded)
  rules: [CAP-2, GW-11, GW-12, FEN-3]
- id: provider_rate_limited
  since: v0.1
  meaning: A rate limit answer from the model provider. The attempt is not spent. Do not confuse with `service_rate_limited`,
    the limiter of the farm itself.
  spends_attempt: false
  retry: jitter
  outcome: failed(deadline_exceeded)
  rules: [CAP-2, GW-12, FEN-3]
- id: provider_config
  since: v0.1
  meaning: 'Model provider configuration error. The retry is not on a timer: the task waits for a fix until `deadline`, the alarm
    is raised by code.'
  spends_attempt: false
  retry: on_fix
  outcome: failed(deadline_exceeded)
  rules: [GW-13, FEN-3]
- id: held
  since: v0.1
  meaning: A stop on the scope of work is in effect. For an attempt this is a stop with `cancel_running` without spending the attempt; at enqueue
    `rejected(held)` under a stop with `no_enqueue`; for a waiting task a waiting reason; for a call `denied(held)`; for a delivery
    `withheld` under `no_delivery`; for a message `discarded(held)`.
  spends_attempt: false
  retry: after_release
  outcome: rejected
  rules: [HLD-1, HLD-3]
- id: provider_quota
  since: v0.1
  meaning: The pair (tenant workspace, model pool) waits for the provider rate limit. The attempt is not spent; this is also
    a waiting reason of a task.
  spends_attempt: false
  retry: on_share
  outcome: failed(deadline_exceeded)
  rules: [GW-10, FEN-3]
- id: preempted
  since: v0.1
  meaning: The core preempted the attempt with the control operation `preempt`. The attempt is not spent.
  spends_attempt: false
  retry: requeue
  outcome: null
  rules: [MGR-11, FEN-1]
- id: seat_changed
  since: v0.1
  meaning: 'The seat epoch changed: a holder was assigned or removed, or the seat has a new stop reason. An attempt of a seat
    task is not spent.'
  spends_attempt: false
  retry: requeue
  outcome: null
  rules: [IDN-10, MGR-1]
- id: awaiting_model_grant
  since: v0.2
  meaning: The attempt ended because the task asked for a grant of a stronger model.
  spends_attempt: false
  retry: after_grant
  outcome: null
  rules: [MGR-17]
- id: grant_revoked
  since: v0.2
  meaning: The model grant was revoked; the task continues on the base model or waits for a decision.
  spends_attempt: false
  retry: after_grant
  outcome: null
  rules: [MGR-17, MGR-18]
- id: provider_spend_cap
  since: v0.1
  meaning: The money ceiling of the provider workspace was reached. There is no retry; the alarm is raised by code.
  spends_attempt: false
  retry: none
  outcome: failed
  rules: [CAP-2, GW-9]
- id: budget_exhausted
  since: v0.1
  meaning: 'The budget limit is exhausted: at enqueue the reserve did not pass (`rejected`), during work the task ends
    `failed`. Also a value of a wake-up skip `wake.skipped(budget_exhausted)`.'
  spends_attempt: false
  retry: none
  outcome: failed
  rules: [BUD-1, BUD-2, FEN-3]
- id: deadline_exceeded
  since: v0.1
  meaning: The task `deadline` passed, counting all attempts.
  spends_attempt: false
  retry: none
  outcome: failed
  rules: [DLV-4]
- id: attempts_exhausted
  since: v0.1
  meaning: All `retry.max_attempts` attempts were spent; for a delivery the delivery attempts ran out. The work shows up in "dead".
  spends_attempt: null
  retry: none
  outcome: failed
  rules: [FEN-3, DLV-4]
- id: runs_exhausted
  since: v0.1
  meaning: The ceiling of runtime runs with a model answer `retry.max_runs` was exhausted. The task shows up in "dead".
  spends_attempt: null
  retry: none
  outcome: failed
  rules: [FEN-3, DLV-4]
- id: exec_failed
  since: v0.1
  meaning: 'The write call of the action ended with an error (`error` or `denied(held)`): approval `exec_failed`, task
    `action.<a>` `failed(exec_failed)`. A new action request is needed.'
  spends_attempt: null
  retry: none
  outcome: failed
  rules: [CNT-7, APR-7]
- id: exec_unknown
  since: v0.1
  meaning: 'It is unknown whether the action was executed: the write call lease expired with no result or the storage epoch grew.
    Task `action.<a>` `failed(exec_unknown)`; delivery `monitor_script` ends `dead(exec_unknown)`. There is
    no retry.'
  spends_attempt: null
  retry: none
  outcome: failed
  rules: [CNT-7, APR-7, DLV-1]
- id: no_executor
  since: v0.1
  meaning: No toolhost of the target took the tool call in `queued` within `start_by`. The call is not retried; the model sees the
    error; for a write call the approval is `exec_failed(no_executor)`.
  spends_attempt: false
  retry: none
  outcome: error
  rules: [DLV-16, CNT-7]
- id: plugin_unavailable
  since: v0.1
  meaning: The call target has no live toolhost or the plugin is in state `down`; the call ends with an error at once.
  spends_attempt: false
  retry: none
  outcome: error
  rules: [DLV-16, OBS-10]
- id: admin
  since: v0.1
  meaning: 'Result `canceled(admin)`: the task, campaign or waiting approval was canceled by the tenant admin or the operator
    (P2 `task.cancel`, P2 `campaign.control`); children in a cascade get the same reason.'
  spends_attempt: false
  retry: none
  outcome: canceled
  rules: [APR-6, FEN-4, PRM-9, ORC-4]
- id: rights_revoked
  since: v0.1
  meaning: The initiator lost `task:<type>` or `data:<class>`; the task is canceled on recheck.
  spends_attempt: false
  retry: none
  outcome: canceled
  rules: [PRM-3]
- id: person_inactive
  since: v0.1
  meaning: 'The initiator is turned off: a refusal at enqueue, a cancellation for a running or waiting task.'
  spends_attempt: false
  retry: none
  outcome: canceled
  rules: [PRM-3]
- id: by_manager
  since: v0.1
  meaning: The task was canceled by the control operation `cancel`.
  spends_attempt: false
  retry: none
  outcome: canceled
  rules: [MGR-9]
- id: preempt_limit
  since: v0.1
  meaning: The third preemption of the same task; the task is canceled.
  spends_attempt: false
  retry: none
  outcome: canceled
  rules: [MGR-11]
- id: superseded_by_takeover
  since: v0.2
  meaning: The task was replaced by a takeover.
  spends_attempt: false
  retry: none
  outcome: canceled
  rules: [MGR-21]
- id: tenant_mismatch
  since: v0.1
  meaning: The tenant in the request does not match the tenant of the credentials; the core raises an alarm.
  spends_attempt: null
  retry: none
  outcome: rejected
  rules: [TEN-2]
- id: input_schema_invalid
  since: v0.1
  meaning: 'The request or body did not pass the schema: a record field, a "this worker" field, a `system:` key not from the core, an `action.*` type,
    an unknown type, `params` outside `params_schema`.'
  spends_attempt: null
  retry: none
  outcome: rejected
  rules: [IDN-1, DSP-4, APR-5, INJ-1]
- id: no_group_cap
  since: v0.1
  meaning: The initiator lacks the permission `task:<type>`; the refusal carries the field `needs`.
  spends_attempt: null
  retry: none
  outcome: rejected
  rules: [PRM-7, PRM-8]
- id: no_data_class
  since: v0.1
  meaning: The initiator or recipient lacks `data:<class>`; a refusal at enqueue carries the field `needs`, for a delivery this is
    `withheld`.
  spends_attempt: null
  retry: none
  outcome: rejected
  rules: [PRM-5, DLV-6]
- id: tier_exceeded
  since: v0.1
  meaning: 'The task or tool tier is above the allowed one: a child above its parent, or a tool above the `max_tier`
    of the task.'
  spends_attempt: null
  retry: none
  outcome: rejected
  rules: [PRM-4, PRM-6]
- id: depth_exceeded
  since: v0.1
  meaning: The task tree is deeper than 5.
  spends_attempt: null
  retry: none
  outcome: rejected
  rules: [PRM-6]
- id: tree_too_large
  since: v0.1
  meaning: More children than `max_children` or more tasks in the tree than `max_tree_tasks`.
  spends_attempt: null
  retry: none
  outcome: rejected
  rules: [PRM-6]
- id: group_invalid
  since: v0.1
  meaning: The bot group `to.group` belongs to someone else, does not exist or is not allowed; the answer is the same in all three cases.
  spends_attempt: null
  retry: none
  outcome: rejected
  rules: [DSP-4]
- id: ref_invalid
  since: v0.1
  meaning: A `file_ref` or `refs` link to an object that belongs to someone else or does not exist; the answer is the same. Also an approval outcome
    `canceled(ref_invalid)`.
  spends_attempt: null
  retry: none
  outcome: rejected
  rules: [TEN-7]
- id: subject_closed
  since: v0.1
  meaning: The decision subject was closed by its own lifecycle (the campaign was canceled, the case was canceled, the person withdrew their request,
    the binding candidate was canceled together with a false incident); the decision outcome is `canceled(subject_closed)`.
    Also the refusal of a P2 people operation on an `offboarded` principal (LCY-8).
  spends_attempt: null
  retry: none
  outcome: canceled
  rules: [APR-6, LCY-8]
- id: over_capacity
  since: v0.1
  meaning: The tenant queue ceiling `max_queued` or `max_enqueue_per_hour` was exceeded, or the soft threshold of storage space;
    the refusal carries `retry_after_s`, and the idempotency key is not taken.
  spends_attempt: null
  retry: none
  outcome: rejected
  rules: [CAP-1, DSP-7]
- id: memory_untrusted
  since: v0.1
  meaning: A type that writes memory, or a role with memory inside the runtime, does not accept a task with `untrusted_seen`.
  spends_attempt: null
  retry: none
  outcome: rejected
  rules: [MEM-3, RT-2]
- id: idempotency_conflict
  since: v0.1
  meaning: The idempotency key is already taken by a task with a different initiator or a different body; the answer has no id.
  spends_attempt: null
  retry: null
  outcome: response
  rules: [IDM-1]
- id: gone
  since: v0.1
  meaning: 'The object was deleted: the key of a deleted task (tombstone) or a read of a file in `expired` or `purged`.'
  spends_attempt: null
  retry: null
  outcome: response
  rules: [IDM-1, RET-3]
- id: not_ready
  since: v0.1
  meaning: 'The core is not ready: storage is unavailable, or recovery or drain is in progress; the answer carries `retry_after_s`. Also
    a value of the `reason` field of the P2 `health` answer.'
  spends_attempt: null
  retry: null
  outcome: response
  rules: [OBS-8, RET-6, DLV-5]
- id: fenced
  since: v0.1
  meaning: A mutating call with a stale token, with a past storage or seat epoch, or from an attempt that lost
    its lease or was canceled. The holder stops work; no record changes.
  spends_attempt: null
  retry: null
  outcome: response
  rules: [FEN-2, FEN-4]
- id: lease_mismatch
  since: v0.1
  meaning: The worker_id of the lease token is not equal to the worker from the credentials or to the holder of the lease record with this
    lease_no, or, for a token signed by the core, the signature is invalid. There are no side effects; the refusal is written to the audit.
  spends_attempt: false
  retry: none
  outcome: rejected
  rules: [FEN-2]
- id: not_found
  since: v0.1
  meaning: One answer for an object that belongs to someone else and for one that does not exist.
  spends_attempt: null
  retry: null
  outcome: response
  rules: [PRM-9]
- id: type_not_allowed
  since: v0.1
  meaning: An event type outside the task type `events` (P1 `emit`) or an observation request outside `observes`.
  spends_attempt: null
  retry: null
  outcome: response
  rules: [IDM-4]
- id: handle_invalid
  since: v0.1
  meaning: The handle is invalid, expired, or belongs to other work or another tenant.
  spends_attempt: null
  retry: null
  outcome: response
  rules: [SEC-3]
- id: forbidden
  since: v0.1
  meaning: 'Permission denied: the principal has no permission for the operation or object; a service or script lacks the role permission or
    its own initiator permission `service.control:<service>` or `monitor.script_run`, or the node is outside the catalog.'
  spends_attempt: null
  retry: null
  outcome: response
  rules: [PRM-9, APR-18]
- id: already_terminal
  since: v0.1
  meaning: A command to an object that is already in a final state.
  spends_attempt: null
  retry: null
  outcome: response
  rules: []
- id: version_unsupported
  since: v0.1
  meaning: The protocol version is outside the window; the worker gets this at `hello`, not in the middle of work. Also an `apply`
    error for a manifest kind or field of a later skeleton version or of a feature profile the core does not claim (MAN-11).
  spends_attempt: null
  retry: null
  outcome: response
  rules: [LCY-7, MAN-11]
- id: unauthenticated
  since: v0.1
  meaning: The credentials are not recognized.
  spends_attempt: null
  retry: null
  outcome: response
  rules: []
- id: blocked
  since: v0.1
  meaning: 'The worker is in state `blocked`: `hello` diverged from the `enroll` record, or a runtime with `runtime_internal`
    has no `match` operation.'
  spends_attempt: null
  retry: null
  outcome: response
  rules: [RT-5]
- id: draining
  since: v0.1
  meaning: 'The core or worker is draining: `claim` and `msg.receive` give no new work. Also a `health` value.'
  spends_attempt: null
  retry: null
  outcome: response
  rules: [LCY-4, LCY-6, MON-2]
- id: identity_unknown
  since: v0.1
  meaning: The identity that a channel or monitoring adapter asserts is not found among the tenant principals.
  spends_attempt: null
  retry: null
  outcome: response
  rules: [TEN-4]
- id: egress_denied
  since: v0.1
  meaning: Outbound access to an address that is not in the allowed list.
  spends_attempt: null
  retry: null
  outcome: response
  rules: []
- id: self_approve
  since: v0.1
  meaning: The approver is the same as the initiator.
  spends_attempt: null
  retry: null
  outcome: response
  rules: []
- id: privileged_group
  since: v0.1
  meaning: A privileged group cannot be granted in chat.
  spends_attempt: null
  retry: null
  outcome: response
  rules: [PRM-16]
- id: already_decided
  since: v0.1
  meaning: Another decision or another person on an already decided subject; nothing changes.
  spends_attempt: null
  retry: null
  outcome: response
  rules: [IDM-3, APR-4]
- id: expired
  since: v0.1
  meaning: The deadline of the decision subject or of the card has passed.
  spends_attempt: null
  retry: null
  outcome: response
  rules: [APR-4]
- id: service_rate_limited
  since: v0.1
  meaning: 'A limiter of the farm itself fired: actions with services and scripts, cards, wake-ups, `card.remind`,
    `routine` runs.'
  spends_attempt: null
  retry: null
  outcome: response
  rules: [MON-8, MSG-11, APR-19]
- id: operator_only
  since: v0.1
  meaning: The operation is available only to the operator through `farmctl`.
  spends_attempt: null
  retry: null
  outcome: response
  rules: [PRM-14]
- id: details_not_opened
  since: v0.2
  meaning: The decision requires that this person first opened `card.details` of this card.
  spends_attempt: null
  retry: null
  outcome: response
  rules: [APR-14]
- id: initiator
  since: v0.1
  meaning: 'Result `canceled(initiator)`: the task or campaign was canceled by its initiator (P1 `cancel`, the `/cancel` command through
    P2 `task.cancel`, the campaign "Cancel" button) or by an external program for its own task; children in a cascade and waiting
    approvals get the same reason.'
  spends_attempt: false
  retry: none
  outcome: canceled
  rules: [APR-6, FEN-4, PRM-9, PRM-17]
- id: restored
  since: v0.1
  meaning: Outcome `canceled(restored)` of a waiting approval after storage is restored from a backup.
  spends_attempt: null
  retry: null
  outcome: canceled
  rules: [RET-6]
- id: not_subject
  since: v0.1
  meaning: 'Audit value `activity.ignored(not_subject)`: an incoming message in a group from an identity that is not a principal
    of the tenant.'
  spends_attempt: null
  retry: null
  outcome: mark
  rules: [MSG-17]
- id: assistant_in_default_types
  since: v0.1
  meaning: 'Lint `apply`: a personal assistant type in the tenant `default_types`.'
  spends_attempt: null
  retry: null
  outcome: apply_error
  rules: [DSP-10]
- id: address_invalid
  since: v0.1
  meaning: The message address is not from the role `messages.send` and is not a reply to an entry that was read.
  spends_attempt: null
  retry: null
  outcome: rejected
