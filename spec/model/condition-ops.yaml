registry: condition-ops
version: 2
description: >-
  Operations of the atom of a script `when` condition (SCR-3). An atom is `{ref: "<step>.<field>", op, value}`
  over a closed result field of a step with one result, or a step state `{ref: "<step>.state", op, value}`. Atoms
  are combined only through `all`, `any` and `not`, nesting at most 2, at most 8 atoms.
  There is no arithmetic, no comparison of sizes, no string functions, no regular expressions, no access to time
  or to external data; a new atom kind is added only through an ADR. Entry fields: `meaning`, `value` (which
  literal the operation accepts), `state` (whether it is allowed over a step state), `rules`.
source: docs/coordination.md
entries:
  - id: eq
    since: v0.1
    meaning: The field equals the literal.
    value: a literal by the field schema
    state: true
    rules: [SCR-3]
  - id: ne
    since: v0.1
    meaning: The field does not equal the literal.
    value: a literal by the field schema
    state: true
    rules: [SCR-3]
  - id: in
    since: v0.1
    meaning: The field value is in the list of literals.
    value: a list of literals by the field schema
    state: true
    rules: [SCR-3]
