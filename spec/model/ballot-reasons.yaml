registry: ballot-reasons
version: 1
description: >-
  Reason codes of a ballot in the "who leaves" vote (GOV-7). A ballot carries up
  to 3 codes from this list and no free text; each code points at a figure of the
  case package (spec/model/ballot-package.schema.json) for the named seat. Code
  reads the codes only for the flag identical_reasons (GOV-19); they decide nothing
  in the count (GOV-8).
source: docs/commission.md
entries:
  - id: calibration_low
    since: v0.2
    meaning: the holder's calibration is the lowest in the list or below the mean of its lens
    rules: [GOV-7]
  - id: refuted_vetoes
    since: v0.2
    meaning: the package figure refuted is high for the holder's vetoes (lifted by people, trial not worse, no attributions)
    rules: [GOV-7]
  - id: refuted_recommendations
    since: v0.2
    meaning: the package figure refuted is high for the holder's recommendations
    rules: [GOV-7]
  - id: few_confirmed
    since: v0.2
    meaning: the package figure confirmed is low for the holder
    rules: [GOV-7]
  - id: reviews_few
    since: v0.2
    meaning: the holder has few reviews in the window, so its figures say little
    rules: [GOV-7]
  - id: tenure_long
    since: v0.2
    meaning: the holder has the longest continuous term in the commission among the list
    rules: [GOV-7]
