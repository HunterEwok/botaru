  - {id: nice, since: v0.1, category: launcher, rules: [INJ-14]}
  - {id: ionice, since: v0.1, category: launcher, rules: [INJ-14]}
  - {id: timeout, since: v0.1, category: launcher, rules: [INJ-14]}
  - {id: stdbuf, since: v0.1, category: launcher, rules: [INJ-14]}
