registry: builtin-tools
version: 3
description: >-
  Built-in P3 tools. The core adds them to the tools/list of an attempt at step 7
  of catalog assembly, if the tool allows the role profile (role-profiles.yaml) and
  the task conditions are met. Entry fields: access (read or write; write exists
  only for service/control and monitor/script_run, APR-18), profiles (profiles
  the tool is available to), purposes (task type purposes in which
  the tool exists; null means all purposes of the profile except handover and
  governance, where nobody has built-in tools, MEM-8, GOV-7),
  condition (task and role condition in words), limit (call limit, if one
  is named), args_schema and result_schema (argument and result schemas from
  spec/model; null while there is no schema, and then schema_note says when it
  will appear). The set is
  closed: a tool outside the registry does not get into the catalog, even if the manifest
  is wrong (PRF-1).
source: spec/ports/p3-tool-gateway.md
entries:
  - id: request_action
    since: v0.1
    access: read
    profiles: [worker, manager]
    purposes: [work]
    condition: the role may request actions (actions_may_request) and every initiator has action.request for at least one of them
    limit: at most 3 requests per task (APR-2)
    args_schema: request-action.schema.json
    result_schema: request-action-result.schema.json
    rules: [APR-1, APR-2, PRF-1]
  - id: status.tasks
    since: v0.1
    access: read
    profiles: [worker, manager, reporter]
    purposes: [work, report]
    condition: the type declared the view status.tasks
    args_schema: null
    result_schema: null
    schema_note: a schema recorded as null will appear in spec/model together with the tool
    rules: [PRF-1]
  - id: status.workers
    since: v0.1
    access: read
    profiles: [worker, manager, reporter]
    purposes: [work, report]
    condition: the type declared the view status.workers
    args_schema: empty-request.schema.json
    result_schema: status-workers-result.schema.json
    rules: [PRF-1, STA-3]
  - id: status.proposals
    since: v0.1
    access: read
    profiles: [worker, manager, reporter]
    purposes: [work, report]
    condition: the type declared the view status.proposals
    args_schema: null
    result_schema: null
    schema_note: a schema recorded as null will appear in spec/model together with the tool
    rules: [PRF-1]
  - id: status.campaigns
    since: v0.1
    access: read
    profiles: [worker, manager, reporter]
    purposes: [work, report]
    condition: the type declared the view status.campaigns
    args_schema: null
    result_schema: null
    schema_note: a schema recorded as null will appear in spec/model together with the tool
    rules: [PRF-1]
  - id: enqueue_child
    since: v0.1
    access: read
    profiles: [manager]
    purposes: [work]
    condition: the child type is in the role's may_enqueue; the child's permissions are not wider than the parent's permissions and the intersection of the initiators' permissions (PRM-6)
    args_schema: null
    result_schema: null
    schema_note: a schema recorded as null will appear in spec/model together with the tool
    rules: [PRF-1, PRM-6]
  - id: send_message
    since: v0.1
    access: read
    profiles: [worker, manager]
    purposes: [work]
    condition: the role declared messages.send; the initiators have msg.send:<type>
    args_schema: msg-send-request.schema.json
    result_schema: msg-send-response.schema.json
    rules: [PRF-1]
  - id: inbox_read
    since: v0.1
    access: read
    profiles: [worker, manager, reporter]
    purposes: [work, report]
    condition: the type declared inbox.read
    args_schema: inbox-read-request.schema.json
    result_schema: inbox-read-response.schema.json
    rules: [PRF-1]
  - id: observations_query
    since: v0.1
    access: read
    profiles: [worker, manager, reviewer, aggregator]
    purposes: [insight, review, aggregate]
    condition: in insight tasks this is the only built-in tool, within the role's insight.observes (INS-1, OBV-3); for reviewer only in review tasks
    args_schema: observation-query.schema.json
    result_schema: observation-query-result.schema.json
    rules: [PRF-1]
  - id: service/control
    since: v0.1
    access: write
    profiles: [worker, manager, farm-manager]
    purposes: [work, manage]
    condition: >-
      the role has service_control for the service and the service is in the tenant catalog;
      enum of services and verbs from the catalog; without a card only a verb from
      services[].no_card in a task without untrusted_seen; every initiator has
      service.control:<service> (D-73)
    args_schema: service-control.schema.json
    result_schema: service-control-result.schema.json
    rules: [APR-18, INJ-15, PRF-1]
  - id: monitor/script_run
    since: v0.1
    access: write
    profiles: [worker, manager, farm-manager]
    purposes: [work, manage]
    condition: >-
      the role has a non-empty monitor_scripts; enum of resources with monitor_host and names from
      hosts[].monitor_scripts_allowed of the catalog whose scriptid is in the latest
      adapter list; without a card in a task without untrusted_seen; every
      initiator has monitor.script_run (D-73)
    args_schema: monitor-script-run.schema.json
    result_schema: service-control-result.schema.json
    rules: [APR-18, INJ-15, INJ-16, PRF-1]
  - id: messages_digest
    since: v0.1
    access: read
    profiles: [aggregator]
    purposes: [aggregate]
    condition: budget line aggregate
    args_schema: null
    result_schema: null
    schema_note: a schema recorded as null will appear in spec/model together with the tool
