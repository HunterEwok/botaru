registry: model-families
version: 2
description: >-
  Model families for the family field of the ModelProfile manifest: profiles of one family share
  a pool of provider rate limits (GW-10). The commission lenses do not need different families
  (D-117). The skeleton text names only the training family family-a; the deployment adds real
  families together with the provider binding sheet.
source: docs/models-and-money.md
entries:
  - id: family-a
    since: v0.1
    meaning: the training family of the skeleton examples; a common pool of rate limits for the example profiles
    rules: [GW-10]
