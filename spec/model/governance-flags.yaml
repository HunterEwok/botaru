registry: governance-flags
version: 3
description: >-
  Flags of a governance case. Code sets them only from this closed list; people
  see the flags on the promotion card next to the figures of every seat of L and in P2,
  and they decide nothing (GOV-19). The when field says when code sets the flag.
source: docs/improvements.md
entries:
  - id: evicts_top_calibrated
    since: v0.2
    when: from v0.3 the chosen or proposed leaver has the best accuracy of its lens (COM-17); the name stays from the calibration of v0.2
    rules: [GOV-19]
  - id: evicts_upheld_veto
    since: v0.2
    when: the chosen or proposed leaver is a holder whose veto people upheld
    rules: [GOV-19]
  - id: evicts_only_scored_veto
    since: v0.3
    when: the proposed leaver is the only holder of a veto lens with enough scored forecasts (GOV-43)
    rules: [GOV-19, GOV-43]
