registry: events-catalog
version: 4
description: >-
  Catalog of events for observability, hold, retention and erasure, time and
  external monitoring, plus events of campaigns, scripts, seats and proposal
  refusals. An event is a CloudEvents 1.0 record with the required id,
  source, specversion and type; the core sets the source and id pair and keeps it
  unique (IDM-4). The data_schema field is the schema of the event data; producer
  lists who publishes it (core: the core, job: a job worker through P1
  emit, adapter: an adapter through submit_activity). Alarms use one data schema,
  alarm (OBS-6); the severity field of an alarm is set only where the text
  names the severity. Event data is metadata only (AUD-2). Alarms of
  other parts of the farm (alarm.task.unclaimed, alarm.task.stalled,
  alarm.manager.absent, campaign alarms and incident catalog alarms) are recorded
  here too with the same schema; the alarm field of the incident-classes and holds registries
  names the full event type of this catalog, with .v1.
source: docs/operations.md
