# Code text catalog, locale en (DLV-9, DLV-18, D-90).
# The skeleton ships only this catalog. An installation supplies catalogs for other locales of
# the closed list `locale` in spec/model/common.schema.json as <locale>.yaml files with the same
# keys in its own configuration; a key missing there takes the en text of that key (DLV-18).
# Code substitutes values in curly braces; a text holds no model text. The skeleton CI checks
# that this catalog has every key that docs/messaging.md and rule DLV-9 name.
locale: en
texts:
  # Notices (DLV-12, SEC-13, MSG-17, IDN-13)
  notice.ai: >-
    This is the bot of tenant {tenant}. Answers are written by an external provider's model; the
    conversation is stored by operator {operator}, who sees metadata and the audit.
  notice.privacy: >-
    Data is processed by {controller} ({contact}): {purposes}. Recipients: {recipients};
    subprocessors: {subprocessors}. Retention: {retention}. Full text: {notice_ref} (version
    {notice_version}). To request or delete your data: /mydata.
  notice.not_registered: You are not registered with this bot; the administrator of tenant {tenant} grants access.
  notice.principal_left: "{subject} has been deactivated ({reason}). Still a member of the chats: {chats}."
  notice.principal_left.no_chats: none
  # An alarm without a monitoring system (MON-13)
  notice.alarm: "Alarm {alarm} ({severity}) is {state}: {subject}, change {seq} at {at}."
  # Channel commands (REP-12, PRM-15, DLV-9)
  cmd.tasks.header: "Your tasks today:"
  cmd.tasks.row: "{n}. {title}: {state}{waiting}"
  cmd.tasks.empty: You have no tasks today.
  cmd.status.row: "Task {n} \"{title}\": {state}, attempt {attempt}{waiting}, deadline {deadline}."
  cmd.status.not_found: There is no task {n} of yours.
  cmd.cancel.confirm: 'Cancel task {n} "{title}"? Its child tasks will stop too.'
  cmd.cancel.done: Task {n} is canceled.
  cmd.cancel.forbidden: You cannot cancel task {n}.
  cmd.help.header: "Commands you can use here:"
  cmd.help.row: "/{command}: {title}"
  cmd.help.none: There are no commands available to you here.
  cmd.team.header: "Group {group}, last {window}:"
  cmd.team.row: "{title}: done {done}, failed {failed}, waiting {waiting}"
  cmd.team.approvals: "Waiting approvals: {count}"
  cmd.team.spend: "Spend of {title}: {amount_eur} EUR"
  cmd.about.text: >-
    This is the bot of tenant {tenant}. Your messages are processed by an external provider's
    model; you can request your data with the /mydata command.
  cmd.lang.done: The language is now {locale}.
  cmd.lang.unknown: "Unknown language. Available: {locales}."
  cmd.forbidden.needs: This needs the group {group}; contact the tenant administrator.
  cmd.followup.hint: You can simply reply with a message within {minutes} minutes.
  # Cards (APR-19, GOV-13, GOV-14)
  card.copy.initiator: "Approval \"{title}\": {state}, deadline {deadline}. Decided by: {decided_by}."
  card.copy.remind_button: Remind approvers
  card.remind: 'Reminder: approval "{title}" awaits your decision until {deadline} (requested by {initiator}).'
  card.remind.rate_limited: A reminder has already been sent; you can repeat it in {minutes} min.
  card.paused: "Paused by a hold until it ends; the deadline moves by the length of the pause."
  card.attribution_dispute: >-
    Incident {incident} was declared false ({reason_code}: {details}, {dismissed_by}). Does your
    "Yes" answer about the link to change {change} stand? Deadline {deadline}; silence withdraws
    the answer.
  card.attribution_dispute.keep: "Yes"
  card.attribution_dispute.withdraw: Withdraw
  card.self_measured: >-
    Change {change}: outcome {outcome} was measured only on the author's work. Calculations: all
    {calc_all}, without the author {calc_without_author}, without the role {calc_without_role}.
    Count it as a promotion trigger by {deadline}? Silence leaves the success in the track record.
  card.self_measured.count: Count it
  # Number words that a model paragraph to people may not hold (REP-4)
  number.words: [zero, one, two, three, four, five, six, seven, eight, nine, ten, eleven, twelve,
    thirteen, fourteen, fifteen, sixteen, seventeen, eighteen, nineteen, twenty, thirty, forty, fifty,
    sixty, seventy, eighty, ninety, hundred, thousand, million, billion, dozen, half, twice]
  # Refusals and outcomes that the first bot shows (DLV-9, PRM-8)
  provenance.model: "[AI answer]"
  task.rejected: "The request was not accepted: {reason}."
  task.rejected.no_group_cap: You have no permission for this request. Ask an admin for the group that allows it.
  task.rejected.no_data_class: You have no permission for the data this request needs.
  task.rejected.budget_exhausted: The money limit is used up; try again later.
  task.rejected.over_capacity: The farm is busy; try again in a few minutes.
  task.rejected.held: Requests of this kind are paused right now.
  task.rejected.person_inactive: Your access is turned off.
  task.failed: The request could not be completed ({reason}).
  activity.not_command: Send a command, for example /hello.
  activity.unknown_command: Unknown command.
  activity.not_verified: The sender of this message is not known, so it is not executed.
