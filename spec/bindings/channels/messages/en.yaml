  cmd.manager.usage: "Usage: /manager [operation] <role|worker|resource|incident> <id> [your text], for example /manager drain worker w_7 it loops."
  cmd.manager.disabled: The farm manager is turned off in this tenant.
  cmd.manager.done: "The farm manager got your directive (task {task})."
