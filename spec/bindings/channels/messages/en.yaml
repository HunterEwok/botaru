# Code text catalog, locale en (DLV-9, DLV-18, D-90).
# The skeleton ships only this catalog. An installation supplies catalogs for other locales of
# the closed list `locale` in spec/model/common.schema.json as <locale>.yaml files with the same
# keys in its own configuration; a key missing there takes the en text of that key (DLV-18).
# Code substitutes values in curly braces; a text holds no model text. The skeleton CI checks
# that this catalog has every key that docs/messaging.md and rule DLV-9 name.
locale: en
texts:
  # Notices (DLV-12, SEC-13, MSG-17, IDN-13)
  notice.ai: >-
    This is the bot of tenant {tenant}. Answers are written by an external provider's model; the
    conversation is stored by operator {operator}, who sees metadata and the audit.
  notice.privacy: >-
    Data is processed by {controller} ({contact}): {purposes}. Recipients: {recipients};
    subprocessors: {subprocessors}. Retention: {retention}. Full text: {notice_ref} (version
    {notice_version}). To request or delete your data: /mydata.
  notice.not_registered: You are not registered with this bot; the administrator of tenant {tenant} grants access.
  notice.principal_left: "{subject} has been deactivated ({reason}). Still a member of the chats: {chats}."
  notice.principal_left.no_chats: none
  notice.erasure_done: "Your data is erased (request {request}). Result per store:\n{results}"
  # An alarm without a monitoring system (MON-13)
  notice.alarm: "Alarm {alarm} ({severity}) is {state}: {subject}, change {seq} at {at}."
  # Export to the monitoring system fails for longer than 15 minutes (MON-12)
  notice.monitor_export_stalled: "Alarms of tenant {tenant} do not reach the monitoring system: the last successful export was {age_min} minutes ago."
  # Channel commands (REP-12, PRM-15, DLV-9)
  cmd.tasks.header: "Your tasks today:"
  cmd.tasks.row: "{n}. {title}: {state}{waiting}"
  cmd.tasks.empty: You have no tasks today.
  cmd.status.row: "Task {n} \"{title}\": {state}, attempt {attempt}{waiting}, deadline {deadline}."
  cmd.status.not_found: There is no task {n} of yours.
  cmd.cancel.confirm: 'Cancel task {n} "{title}"? Its child tasks will stop too. To confirm, send /cancel {n} {nonce}.'
  cmd.cancel.finished: "Task {n} has already finished ({state})."
  cmd.cancel.done: Task {n} is canceled.
  cmd.cancel.forbidden: You cannot cancel task {n}.
  cmd.help.header: "Commands you can use here:"
  cmd.help.row: "/{command}: {title}"
  cmd.help.none: There are no commands available to you here.
  cmd.team.header: "Group {group}, last {window}:"
  cmd.team.row: "{title}: done {done}, failed {failed}, waiting {waiting}"
  cmd.team.approvals: "Waiting approvals: {count}"
  cmd.team.spend: "Spend of {title}: {amount_eur} EUR"
  cmd.about.text: >-
    This is the bot of tenant {tenant}. Your messages are processed by an external provider's
    model; you can request your data with the /mydata command.
  cmd.lang.done: The language is now {locale}.
  cmd.profile.groups: "Your groups: {groups}."
  cmd.profile.types: "You can ask for: {titles}."
  cmd.profile.actions: "Actions you can request: {titles}."
  cmd.profile.data: "Your data classes: {classes}."
  cmd.lang.unknown: "Unknown language. Available: {locales}."
  cmd.forbidden.needs: This needs the group {group}; contact the tenant administrator.
  cmd.followup.hint: You can simply reply with a message within {minutes} minutes.
  # A person's data and memory (MEM-4, SEC-11)
  cmd.mydata.summary: "The farm keeps {records} memory records about you and {sessions} conversations. /forget erases them; /mydata erase asks to erase all your data."
  cmd.mydata.usage: "Usage: /mydata, /mydata erase or /forget."
  cmd.mydata.erase: "Your request {request} to erase your data is recorded; a person with admin:people decides it within {days} days, and the result comes here."
  cmd.mydata.export: The copy of your data arrives in a later version.
  cmd.forget.done: "Your memory records and conversations are being erased for real (request {request})."
  # Service control and pipelines by command, without a model (PRM-18, APR-17)
  cmd.service.usage: "Usage: /service <verb> <service>, for example /service restart nginx."
  cmd.service.unknown: There is no such service or verb in the catalog of this tenant.
  cmd.service.accepted: "{verb} {service}: accepted; the outcome comes here."
  cmd.run.usage: "Usage: /run <pipeline> <arguments>."
  cmd.run.unknown: There is no such pipeline here.
  cmd.run.invalid: The arguments do not fit the pipeline.
  cmd.run.accepted: "{title}: started; the outcome comes here."
  cmd.action.pending: '"{title}" awaits the decision of a person until {deadline}.'
  cmd.action.done: "{action}: done."
  cmd.refused.held: This is stopped by a hold right now.
  cmd.refused.service_rate_limited: The limit of such actions is reached; try again later.
  cmd.refused.resource_busy: Another operation on this service is running; try again later.
  # Cards (APR-19, GOV-13, GOV-14)
  card.copy.initiator: "Approval \"{title}\": {state}, deadline {deadline}. Decided by: {decided_by}."
  card.copy.remind_button: Remind approvers
  card.remind: 'Reminder: approval "{title}" awaits your decision until {deadline} (requested by {initiator}).'
  card.remind.rate_limited: A reminder has already been sent; you can repeat it in {minutes} min.
  card.paused: "Paused by a hold until it ends; the deadline moves by the length of the pause."
  card.attribution_dispute: >-
    Incident {incident} was declared false ({reason_code}: {details}, {dismissed_by}). Does your
    "Yes" answer about the link to change {change} stand? Deadline {deadline}; silence withdraws
    the answer.
  card.attribution_dispute.keep: "Yes"
  card.attribution_dispute.withdraw: Withdraw
  card.self_measured: >-
    Change {change}: outcome {outcome} was measured only on the author's work. Calculations: all
    {calc_all}, without the author {calc_without_author}, without the role {calc_without_role}.
    Count it as a promotion trigger by {deadline}? Silence leaves the success in the track record.
  card.self_measured.count: Count it
  # The approval card and its answers, drawn by the channel from the card fields (APR-3, APR-19)
  card.title: "Approval needed: {title}"
  card.risk: "Risk: {risk}"
  card.args: "Arguments: {args}"
  card.requested_by: "Requested by {initiator} ({source})"
  card.context: "What the code saw: {context}"
  card.untrusted: "The request was made after reading untrusted text ({source})."
  card.deadline: "Decide by {deadline}."
  card.state: "State: {state}"
  card.footer: "You get this card because you hold {why_you}. If nobody decides by {until}: {on_silence}."
  card.realization.footer: "You get this card as the executor of the accepted change. If it is not done by {until}: {on_silence}."
  card.executor.footer: "You get this card as the executor of the accepted change. Otherwise: {on_silence}."
  card.button.approve: Approve
  card.button.reject: Reject
  card.button.details: Details
  card.button.accept: Accept
  card.button.defer: Postpone
  # Proposal cards and the proposal digest, drawn by code from the records (DIG-1, DIG-3, PRP-18)
  card.proposal.title: "Bot proposal: {title}"
  card.realization.title: "Change to carry out: {title}"
  card.rollback.title: "A change may need reverting: {title}"
  proposal.digest: "Recommended bot proposals ({count}); each has its card in your private chat:\n{items}"
  proposal.digest.with_loop_off: "Recommended bot proposals ({count}); each has its card in your private chat:\n{items}\nAnalysis is off: {loop_off}."
  proposal.digest.loop_off: "No proposals this time. Analysis is off: {loop_off}."
  card.answer.accepted: Accepted.
  card.answer.forbidden: You cannot decide on this card.
  card.answer.expired: The card has expired.
  card.answer.already_decided: This card is already decided.
  card.answer.failed: The press could not be processed; try again later.
  card.details.header: "Details of \"{title}\":"
  card.details.row: "{field}: {value}"
  # Number words that a model paragraph to people may not hold (REP-4)
  number.words: [zero, one, two, three, four, five, six, seven, eight, nine, ten, eleven, twelve,
    thirteen, fourteen, fifteen, sixteen, seventeen, eighteen, nineteen, twenty, thirty, forty, fifty,
    sixty, seventy, eighty, ninety, hundred, thousand, million, billion, dozen, half, twice]
  # Refusals and outcomes that the first bot shows (DLV-9, PRM-8)
  provenance.model: "[AI answer]"
  task.rejected: "The request was not accepted: {reason}."
  task.rejected.no_group_cap: You have no permission for this request. Ask an admin for the group that allows it.
  task.rejected.no_data_class: You have no permission for the data this request needs.
  task.rejected.budget_exhausted: The money limit is used up; try again later.
  task.rejected.over_capacity: The farm is busy; try again in a few minutes.
  task.rejected.held: Requests of this kind are paused right now.
  task.rejected.person_inactive: Your access is turned off.
  task.failed: The request could not be completed ({reason}).
  task.continuation_refused: "The follow-up step of your request could not start ({reason})."
  delivery.withheld.channel_ceiling: The answer holds data of a class this chat may not receive, so it was not sent here.
  delivery.details_private: Details sent privately.
  delivery.open_private_chat: The answer is ready. Open a private chat with the bot to receive it.
  cmd.grant.usage: "Usage: /grant <person> <group> or /ungrant <person> <group>; the person is an identity such as telegram:1002."
  cmd.grant.no_group: There is no group {group} in this tenant.
  cmd.grant.no_person: There is no such person in this tenant.
  cmd.grant.privileged: Group {group} is privileged; only the operator grants it.
  cmd.grant.not_covered: You can grant only a group whose rights you hold yourself; {group} has more.
  cmd.grant.done: "{subject} is now in group {group}."
  cmd.ungrant.done: "{subject} is no longer in group {group}."
  notice.delegated_grant: "{by} granted {subject} the delegated group {group}."
  notice.delegated_ungrant: "{by} removed {subject} from the delegated group {group}."
  cmd.ungrant.not_member: "{subject} is not in group {group}."
  cmd.direct_only: This command can only be given in a private chat with the bot.
  cmd.help.group_header: "In this chat you can ask in plain text:"
  cmd.help.group_row: "- {title}"
  cmd.help.group_hint: Other commands are given in a private chat with the bot.
  activity.not_command: Send a command, for example /hello.
  activity.unknown_command: Unknown command.
  activity.attachment_invalid: The attached file could not be used; send it again.
  activity.not_verified: The sender of this message is not known, so it is not executed.
