# Operation map of the ports. Edited together with the port sheets spec/ports/*.md.
registry: operations
version: 3
description: 'Operation map of the ports: one row per sheet operation. id is <port>.<operation>; port is P1-P4, C1-C4, E1-E5 or
  T (the test-control port spec/ports/test-control.md); since is the skeleton version; request and response are the name of the schema spec/model/<name>.schema.json
  (null if there is no schema, and then note says why); rules are rule numbers. For edge operations request is what the edge receives
  (the body of the work or delivery), and response is what it hands in. Optional fields: lease (true if the call goes under a lease
  and carries the Botaru-Lease header, or a string if only for some callers), on_behalf (the channel acts on behalf of a person:
  the headers Botaru-On-Behalf and Botaru-Chat), credential (which handle is in Authorization instead of the worker token), idempotent_by
  (the idempotency key), body (a special body shape in the binding), binding (a binding other than HTTP), transport (how an edge operation goes
  through P1 or inside a process), wire (false for operations inside the core). profiles are the conformance profiles that need the operation: the union of the profiles of its rules, core for a row without rules. The HTTP path of a P1 and P2 operation is derived from the id by spec/bindings/http/README.md. contract: false marks a row of a port that describes how the core is built, not a boundary with foreign code (P2, C1-C4, E2, E4 and T; C10, D-114): its schemas are implementation schemas of the core and farmctl or core test schemas, not port contracts; a row without the field is a contract boundary (P1, P3, P4, E1, E3, E5). operator_only (P2 only) marks the closed list of operator operations of PRM-14: true when the whole operation is the operator''s through farmctl, or a string that names the case in which it is.'
source: spec/ports/README.md
