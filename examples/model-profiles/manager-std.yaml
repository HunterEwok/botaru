# Model profile manager-std: the farm manager seat. Prices and ranks are illustrative (docs/models-and-money.md).
apiVersion: botaru/v1alpha1
kind: ModelProfile
metadata: {name: manager-std}
spec:
  provider: provider-a
  model: model-a-xlarge-2026-09
  family: family-a
  rank: 4
  pool: family-a
  fallback: []
  fallback_on: [overloaded, unavailable, retired]
  max_output_tokens: 8000
  forced_schema: true
  tokens_per_s: 60
  price: {input: 4.00, output: 16.00, cache_write: 5.00, cache_read: 0.40, checked: 2026-10-01}
  provider_retention_days: {value: 30, checked: 2026-10-01}
  requires_retention: false
  provider_training: {value: false, checked: 2026-10-01}
  provider_human_review: {value: abuse_only, checked: 2026-10-01}
  subprocessors: []
  retires_at: null
