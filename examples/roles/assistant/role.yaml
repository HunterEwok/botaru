# Personal assistant (flow 8). The personal assistant is deferred (DSP-10, D-114) and apply refuses a role with
# memory: person (person_memory_deferred, MEM-2), so the example role holds no memory until DSP-10 returns.
apiVersion: botaru/v1alpha1
kind: Role
metadata: {name: assistant}
spec:
  profile: worker
  worker_kind: agent
  claims: [assist.chat.v1]
  models: {base: base-std}
  memory: none
