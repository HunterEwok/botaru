# Report on the end of a CTD QC run: route ctd-qc-finished to the private chat of the action initiator.
apiVersion: botaru/v1alpha1
kind: TaskType
metadata: {name: pipeline.ctd_qc.report.v1}
spec:
  title: "CTD quality control result"
  worker_kind: agent
  purpose: report
  tier: 0
  data_class: internal
  instruction: |
    Write two or three sentences about the run result from the event fields. The code draws the numbers.
  params_schema: {type: object, additionalProperties: false, properties: {}}
  result_schema:
    type: object
    additionalProperties: false
    required: [text]
    properties:
      text: {type: string, maxLength: 1000}
  dispatch: {priority_class: 4}
  timeouts: {start_by: 30m, lease: 60s, heartbeat: 20s, attempt: 2m, deadline: 1h}
  retry: {max_attempts: 2, max_runs: 3}
  tree_budget_eur: 0.05
  max_children: 0
  proposable: false                  # purpose is not work, or an alarm in events (PRP-10)
