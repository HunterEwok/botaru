# Paragraph of the monthly report by the reporter: child task of report.monthly.numbers.v1 (flow 7).
apiVersion: botaru/v1alpha1
kind: TaskType
metadata: {name: report.monthly.v1}
spec:
  title: "Monthly report"
  worker_kind: agent
  purpose: report
  tier: 0
  data_class: internal
  instruction: |
    The report for the month in one paragraph. Numbers only from params: the code draws the table.
  params_schema:
    type: object
    additionalProperties: false
    required: [month]
    properties:
      month: {type: string, x-botaru-format: year_month}
      ctd_qc_runs: {type: integer, minimum: 0, maximum: 100000}
      ctd_qc_ok: {type: integer, minimum: 0, maximum: 100000}
      lab_runs: {type: integer, minimum: 0, maximum: 100000}
      lab_ok: {type: integer, minimum: 0, maximum: 100000}
      sensor_slots_on_time_pct: {type: number, minimum: 0, maximum: 100}
      cost_eur: {type: number, minimum: 0, maximum: 1000000}
  result_schema:
    type: object
    additionalProperties: false
    required: [text]
    properties:
      text: {type: string, maxLength: 1500}
  dispatch: {priority_class: 4}
  timeouts: {start_by: 30m, lease: 60s, heartbeat: 20s, attempt: 2m, deadline: 1h}
  retry: {max_attempts: 2, max_runs: 3}
  tree_budget_eur: 0.05
  max_children: 0
  proposable: false                  # purpose is not work, or an alarm in events (PRP-10)
