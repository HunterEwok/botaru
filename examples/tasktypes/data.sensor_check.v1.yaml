# Nightly sensor check: a job without a model on schedule sensor-nightly (flow 5).
apiVersion: botaru/v1alpha1
kind: TaskType
metadata: {name: data.sensor_check.v1}
spec:
  title: "Nightly sensor check"
  worker_kind: job
  purpose: work
  tier: 1
  data_class: internal
  params_schema:
    type: object
    additionalProperties: false
    required: [window_h]
    properties:
      window_h: {type: integer, minimum: 1, maximum: 72}
  result_schema:
    type: object
    additionalProperties: false
    required: [sensors_checked, sensors_with_issues]
    properties:
      sensors_checked: {type: integer, minimum: 0, maximum: 100, x-botaru-read-by: code}
      sensors_with_issues: {type: integer, minimum: 0, maximum: 100, x-botaru-read-by: code}
  summary_fields: [sensors_checked, sensors_with_issues]
  dispatch: {priority_class: 4}
  timeouts: {start_by: 30m, lease: 120s, heartbeat: 30s, attempt: 10m, deadline: 2h}
  retry: {max_attempts: 2, max_runs: 2}
  tree_budget_eur: 0.05
  max_children: 1
