# Task type for free text without a command (default_types of tenant demo).
apiVersion: botaru/v1alpha1
kind: TaskType
metadata: {name: ops.summary.v1}
spec:
  title: "Short answer to a free-form question"
  worker_kind: agent
  purpose: work
  tier: 0
  data_class: summary
  instruction: |
    Answer briefly from the summaries available to you. If the question needs
    logs or data, name the command that enqueues it.
    If you cannot answer without one more detail from the person, ask for it in
    the answer and set need_input to true; their next words continue this task.
  params_schema: {type: object, additionalProperties: false, properties: {}}
  result_schema:
    type: object
    additionalProperties: false
    required: [answer]
    properties:
      answer: {type: string, maxLength: 1500}
      need_input: {type: boolean, x-botaru-read-by: code}
  dispatch: {priority_class: 3}
  interactive: true
  timeouts: {start_by: 5m, lease: 60s, heartbeat: 20s, attempt: 2m, deadline: 10m}
  retry: {max_attempts: 2, max_runs: 3}
  tree_budget_eur: 0.05
  max_children: 0
  followup_window_s: 900
  goal_trust: untrusted
