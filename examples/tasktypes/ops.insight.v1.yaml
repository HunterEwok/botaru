# Analysis of the ops-reader role (INS-1): it reads the core series and the machine load and hands in at most
# three proposals or nothing_found. The result schema is the core's insight-result, so the type declares none.
apiVersion: botaru/v1alpha1
kind: TaskType
metadata: {name: ops.insight.v1}
spec:
  title: "Weekly look at the role's own results"
  worker_kind: agent
  purpose: insight
  tier: 1
  data_class: internal
  instruction: |
    Look at the outcomes, attempts and durations of this role's tasks in the series farm.task.outcome,
    farm.task.attempts and farm.attempt.duration, and at the machine load.

    The service levels of these tasks over the last 7 days (window 7d): at least 80 percent of them
    done (farm.task.outcome with rollup window.share, which is the share of tasks done), fewer than
    2.0 attempts per task on average (farm.task.attempts, rollup window.mean), and attempts that do
    not regularly last longer than 180 seconds (farm.attempt.duration, rollup window.p95).

    Read each of these series once with that window and rollup, for the task types that have tasks,
    and the machine load once per host over the same 7 days (item cpu_load, step 1h); ask for these
    readings together in one turn. Another window or a second reading of the same series adds
    nothing to the levels.

    If the series you read break at least one of these levels, propose one change, the one with the
    strongest evidence, with the values you read; nothing_found is then not an answer. Answer
    nothing_found only when every level holds.
  params_schema: {type: object, additionalProperties: false, properties: {}}
  timeouts: {start_by: 1h, lease: 60s, heartbeat: 20s, attempt: 5m, deadline: 2h}
  retry: {max_attempts: 1, max_runs: 2}
  tree_budget_eur: 0.10
  max_children: 0
  proposable: false
