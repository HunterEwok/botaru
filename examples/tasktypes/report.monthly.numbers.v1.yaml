# Numbers of the monthly report: a job without a model, /run month-report without a card (flow 7, APR-17).
apiVersion: botaru/v1alpha1
kind: TaskType
metadata: {name: report.monthly.numbers.v1}
spec:
  title: "Monthly report numbers"
  worker_kind: job
  purpose: work
  tier: 0
  data_class: internal
  params_schema:
    type: object
    additionalProperties: false
    required: [month]
    properties:
      month: {type: string, x-botaru-format: year_month}
  result_schema:
    type: object
    additionalProperties: false
    required: [month, cost_eur]
    properties:
      month: {type: string, x-botaru-format: year_month, x-botaru-read-by: code}
      ctd_qc_runs: {type: integer, minimum: 0, maximum: 100000, x-botaru-read-by: code}
      lab_runs: {type: integer, minimum: 0, maximum: 100000, x-botaru-read-by: code}
      cost_eur: {type: number, minimum: 0, maximum: 1000000, x-botaru-read-by: code}
  summary_fields: [month, ctd_qc_runs, lab_runs, cost_eur]
  observes: [farm.external.outcome, farm.external.duration, farm.schedule.slot, farm.task.cost]
  run: {approval: none}
  dispatch: {priority_class: 4}
  timeouts: {start_by: 30m, lease: 120s, heartbeat: 30s, attempt: 10m, deadline: 2h}
  retry: {max_attempts: 2, max_runs: 2}
  tree_budget_eur: 0.10
  max_children: 1
  result_media_types: [text/csv]
