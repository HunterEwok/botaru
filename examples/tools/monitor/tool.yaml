# Read plugin for the organization's monitoring system (MON-6): nodes only from the catalog of its own tenant.
apiVersion: botaru/v1alpha1
kind: ToolPlugin
metadata: {name: monitor}
spec:
  source: {image: "registry.example.org/botaru-monitor-read@sha256:<digest>"}
  placement: host
  network: {egress: [monitor-api]}
  secrets: [MONITOR_READ_TOKEN]
  tools:
    - name: problems
      access: read
      tier: 1
      output_class: internal
      untrusted_output: false
      redact: [ip, email, secret]
      target: any
      params:
        host: {enum_from: catalog.hosts}
        since: {type: string, x-botaru-format: datetime}
      output_schema:
        type: object
        additionalProperties: false
        required: [host, problems]
        properties:
          host: {enum_from: catalog.hosts}
          problems:
            type: array
            maxItems: 100
            items:
              type: object
              additionalProperties: false
              required: [eventid, triggerid, class, resource, severity, state, time]
              properties:
                eventid: {type: integer, minimum: 0, maximum: 9007199254740991}
                triggerid: {type: integer, minimum: 0, maximum: 9007199254740991}
                class: {enum: [disk_free, disk_fill, unknown]}
                resource: {enum_from: catalog.hosts}
                severity: {type: integer, minimum: 0, maximum: 5}
                state: {enum: [open, resolved]}
                time: {type: string, x-botaru-format: datetime}
      output_limit_kb: 32
    - name: item_history
      access: read
      tier: 1
      output_class: internal
      untrusted_output: false
      redact: [ip, email, secret]
      target: any
      params:
        host: {enum_from: catalog.hosts}
        item: {enum: [cpu_load, mem_used, disk_used, net_in, net_out]}
        start: {type: string, x-botaru-format: datetime}
        end: {type: string, x-botaru-format: datetime}
        step: {enum: ["1m", "5m", "1h"]}
      output_schema:
        type: object
        additionalProperties: false
        required: [item, step, points]
        properties:
          item: {enum: [cpu_load, mem_used, disk_used, net_in, net_out]}
          step: {enum: ["1m", "5m", "1h"]}
          points:
            type: array
            maxItems: 500
            items:
              type: object
              additionalProperties: false
              required: [t, v]
              properties:
                t: {type: string, x-botaru-format: datetime}
                v: {type: number, minimum: -1000000000000000, maximum: 1000000000000000}
      output_limit_kb: 32
    - name: maintenance
      access: read
      tier: 1
      output_class: internal
      untrusted_output: false
      redact: [ip, email, secret]
      target: any
      params:
        host: {enum_from: catalog.hosts}
      output_schema:
        type: object
        additionalProperties: false
        required: [in_maintenance]
        properties:
          in_maintenance: {type: boolean}
          since: {type: string, x-botaru-format: datetime}
      output_limit_kb: 8
    - name: item_text
      access: read
      tier: 1
      output_class: internal
      untrusted_output: true
      redact: [ip, email, secret]
      target: any
      params:
        host: {enum_from: catalog.hosts}
        trigger: {enum_from: catalog.monitor_triggers}
        since: {type: string, x-botaru-format: datetime}
      output_limit_kb: 16
    - name: problem_comments
      access: read
      tier: 1
      output_class: internal
      untrusted_output: true
      redact: [ip, email, secret]
      target: any
      params:
        host: {enum_from: catalog.hosts}
      output_limit_kb: 8
    - {name: execute_api, enabled: false, reason: "free-form API request"}
