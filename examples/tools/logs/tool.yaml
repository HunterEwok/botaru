# Reads logs from catalog sources: outsiders write the lines (INJ-13).
apiVersion: botaru/v1alpha1
kind: ToolPlugin
metadata: {name: logs}
spec:
  placement: host
  network: {egress: []}
  tools:
    - name: tail
      access: read
      tier: 1
      output_class: raw_logs
      untrusted_output: true
      redact: [ip, email, secret]
      target_from: source
      params:
        source: {enum_from: catalog.log_sources}
        lines: {type: integer, minimum: 10, maximum: 500, default: 100}
      output_limit_kb: 32
      timeout_s: 20
