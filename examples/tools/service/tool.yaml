# Write plugin for controlling catalog services (APR-18, MON-8): the unit mechanism through the systemd binding.
apiVersion: botaru/v1alpha1
kind: ToolPlugin
metadata: {name: service}
spec:
  placement: host
  network: {egress: []}
  tools:
    - name: control
      access: write
      tier: 3
      output_class: internal
      untrusted_output: false
      target_from: service
      params:
        service: {enum_from: catalog.services}
        verb: {enum: [start, stop, restart]}
      output_limit_kb: 4
      timeout_s: 90
      os_mechanism:
        unit: {unit_from: service, verb_from: control, wait: true}
